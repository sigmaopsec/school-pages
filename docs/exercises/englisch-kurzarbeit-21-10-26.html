le. Planning frameworks can state a desired level of service, examine whether benefits are equitable and specify when new observations will trigger review. Coastal warming will not produce identical outcomes everywhere. In practice, measurable uncertainty leads authorities to compare conditional options over time rather than assume either that one wall will remove risk or that all exposed places will inevitably be lost."}],"sources":[{"title":"U.S. coastline to see up to a foot of sea level rise by 2050","url":"https://www.noaa.gov/news-release/us-coastline-to-see-up-to-foot-of-sea-level-rise-by-2050","publisher":"National Oceanic and Atmospheric Administration"},{"title":"Coastal Inundation","url":"https://coast.noaa.gov/digitalcoast/topics/coastal-inundation.html","publisher":"NOAA Office for Coastal Management"},{"title":"Effects of sea-level rise on salt water intrusion near a coastal well field in southeastern Florida","url":"https://pubs.usgs.gov/publication/70056049","publisher":"U.S. Geological Survey"},{"title":"Effects of hydrologic system alterations on salinity in the Biscayne aquifer in Broward County, Florida","url":"https://www.usgs.gov/centers/caribbean-florida-water-science-center-%28cfwsc%29/science/effects-hydrologic-system","publisher":"U.S. Geological Survey"}],"vocabIds":["b01","b02","b03","b04","b05","b06","b07","b08","b09","b10","b11","b12","b13","b14","b15","b16","b17","b18","b19","b20","b21","b22","b23","b24","b25","b26","b27","b28","b29","b30"],"vocabCoverage":[{"id":"b01","quote":"may exacerbate the imbalance"},{"id":"b02","quote":"The goal is resilience"},{"id":"b03","quote":"can mitigate damage"},{"id":"b04","quote":"Heavy precipitation can then compound tidal flooding"},{"id":"b05","quote":"who might be displaced"},{"id":"b06","quote":"Their livelihood may depend on a coastal workplace"},{"id":"b07","quote":"deteriorating housing"},{"id":"b08","quote":"must contend with several connected pressures"},{"id":"b09","quote":"must allocate limited funds"},{"id":"b10","quote":"Such infrastructure can mitigate damage"},{"id":"b11","quote":"can then compound tidal flooding"},{"id":"b12","quote":"can leave vulnerable residents behind"},{"id":"b13","quote":"Engineers can retrofit roads"},{"id":"b14","quote":"changes the wider watershed"},{"id":"b15","quote":"salinity can increase in wells"},{"id":"b16","quote":"can galvanize residents around a shared decision"},{"id":"b17","quote":"government should curtail development"},{"id":"b18","quote":"The dispute becomes contentious"},{"id":"b19","quote":"Some officials advocate protective construction"},{"id":"b20","quote":"to inundate places more often"},{"id":"b21","quote":"An equitable plan therefore asks"},{"id":"b22","quote":"once a critical threshold is crossed"},{"id":"b23","quote":"leaves room to recalibrate plans"},{"id":"b24","quote":"A sea-level trajectory describes a range"},{"id":"b25","quote":"restored dunes or wetlands may buffer waves"},{"id":"b26","quote":"Water managers may divert canal flows"},{"id":"b27","quote":"The report forecasts a range"},{"id":"b28","quote":"they can mobilize crews and funding"},{"id":"b29","quote":"These interactions underpin the case for regional planning"},{"id":"b30","quote":"These are genuine trade-offs"}],"questions":[{"id":"r02q01","type":"mc","prompt":"Which statement is NOT true according to the text?","choices":["A higher sea level allows tides and storm surges to inundate places more often.","Sea-level rise and groundwater pumping can both affect saltwater intrusion.","A sea wall by itself protects coastal drinking-water sources from saltwater intrusion.","Local measurements are needed because regional projections do not determine every street-level outcome."],"answer":2,"points":1,"explanation":"Paragraph B explicitly says that a flood barrier alone cannot protect a drinking-water source. The other three statements are supported by paragraphs A and B.","evidence":"Paragraph B: ‘A flood barrier therefore cannot by itself protect a drinking-water source.’"},{"id":"r02q02","type":"mc","prompt":"Complete the sentence according to paragraph C: Coastal resilience means that a community ...","choices":["prevents every form of coastal damage permanently.","can withstand disruption, recover and adjust.","replaces engineered protection with wetlands in every location.","keeps existing infrastructure unchanged as conditions develop."],"answer":1,"points":1,"explanation":"Paragraph C defines resilience through resistance, recovery and adjustment. The distractors turn it into total prevention or prescribe one fixed technical approach.","evidence":"Paragraph C: ‘The goal is resilience—the capacity to withstand disruption, recover and adjust—not the unrealistic elimination of all coastal risk.’"},{"id":"r02q03","type":"mc","prompt":"What is the author’s main reason for combining different adaptation measures?","choices":["Every measure has limits and conditions may change after construction.","Nature-based measures are always cheaper than engineered protection.","Permanent coastal protection is technically impossible in every location.","Monitoring can replace the need to invest in physical measures."],"answer":0,"points":1,"explanation":"Paragraph C stresses limits, combinations, monitoring and adjustment. It does not claim that nature is always cheaper, that protection is universally impossible, or that monitoring alone prevents damage.","evidence":"Paragraph C: ‘It combines defences, monitors results and leaves room to recalibrate plans as observations change.’"},{"id":"r02q04","type":"mc","prompt":"How does paragraph D challenge a property-value-only funding rule?","choices":["It argues that every exposed property must receive identical spending.","It suggests that business districts create no benefits outside their boundaries.","It claims that insurance always covers the full cost of relocation.","It shows that exposure, mobility and livelihoods are not captured by property prices alone."],"answer":3,"points":1,"explanation":"The paragraph adds housing condition, evacuation capacity and dependence on workplaces to the assessment. The distractors propose absolute equality or claims the text never makes.","evidence":"Paragraph D: ‘Renters, older people, low-income households and those without cars may face evacuation costs or deteriorating housing’ and ‘Their livelihood may depend on a coastal workplace.’"},{"id":"r02q05","type":"mediation","prompt":"Vergleiche für einen kurzen Infokasten auf Deutsch Schutzmaßnahmen und Verlagerung als zwei Strategien der Küstenanpassung. Nutze die Absätze C, E und G.","points":2,"model":"Schutzmaßnahmen wie Pumpen, erhöhte Technik oder Feuchtgebiete können Schäden mindern und wichtige Infrastruktur funktionsfähig halten. Ihre Wirkung ist jedoch begrenzt; außerdem können Mauern Risiken verlagern oder neue Bebauung fördern. Eine Verlagerung entfernt Gebäude oder Dienste aus wiederholt überfluteten Gebieten und kann langfristig sicherer sein. Sie kann aber Arbeitswege, Schulen und soziale Netze beeinträchtigen; deshalb müssen Entschädigung und Freiwilligkeit berücksichtigt werden.","criteria":["Nennt eine Schutzwirkung technischer oder naturbasierter Maßnahmen.","Beschreibt eine Grenze oder mögliche Nebenwirkung von Schutzmaßnahmen.","Nennt den Sicherheitsgewinn durch Verlagerung aus wiederholt gefährdeten Gebieten.","Beschreibt eine soziale oder finanzielle Schwierigkeit der Verlagerung."],"criterionPoints":[0.5,0.5,0.5,0.5],"explanation":"Je Vergleichsaspekt werden 0,5 Punkte vergeben. Erwartet wird eine knappe deutsche Gegenüberstellung, keine vollständige Übersetzung.","evidence":"Absatz C: ‘Such infrastructure can mitigate damage, yet performance has limits.’ Absatz E: ‘may not enable a family to remain near work, schools and relatives.’ Absatz G: ‘moving a service or building away from repeated floods may be safer’."},{"id":"r02q06","type":"text","prompt":"Which four-word expression in paragraph E means that waiting can make future damage greater and harder to avoid?","answer":["lock in larger losses"],"points":1,"explanation":"‘Lock in larger losses’ means that delay can create or fix conditions that lead to greater future harm.","evidence":"Paragraph E: ‘delay can lock in larger losses.’","task":"short-answer"},{"id":"r02q07","type":"text","prompt":"Which two-word expression in paragraph F refers to predefined signals for reviewing or changing a plan?","answer":["trigger points"],"points":1,"explanation":"‘Trigger points’ are monitored conditions that prompt the next planned decision or response.","evidence":"Paragraph F: ‘Monitoring groundwater, tides and land elevation helps authorities revise trigger points.’","task":"short-answer"}]},{"id":"r03","title":"A Carbon Budget Is Also a Land, Energy and Materials Budget","source":"Eigener Sachtext auf Grundlage der angegebenen Fachquellen; keine Original-Prüfungsaufgabe.","level":"B2+","minutes":45,"examOnly":true,"paragraphs":[{"label":"A","text":"Climate action is often reduced to a single number: tonnes of carbon dioxide. The number matters because carbon dioxide released by burning coal, oil and gas accumulates and helps trap heat. A remaining carbon budget estimates cumulative additional carbon dioxide emissions compatible with limiting warming to a chosen level, under stated assumptions and likelihood. Yet that budget is not merely an atmospheric account. Every route for reducing emissions requires energy systems, land, water, minerals, labour and institutions. Treating climate change as an isolated pressing challenge can therefore hide important connections. Solar panels need materials and space; forests store carbon but also support biodiversity and livelihoods; cities need reliable electricity while they replace fuels. The task is not to discover an impact-free technology. It is to choose combinations that cut the carbon footprint quickly without shifting unacceptable costs onto ecosystems or people."},{"label":"B","text":"The physical starting point is clear. NASA explains that human activities have increased heat-trapping greenhouse gases, with fossil-fuel use central to the rise in atmospheric carbon dioxide. Additional warming can intensify evaporation and alter the water cycle, contributing to heavier rainfall in some places and drought in others. In already arid regions, water depletion may make farms and settlements more vulnerable; elsewhere, floods can displace residents and cause devastating losses. These outcomes do not follow from temperature alone, since exposure and public services shape harm. Nevertheless, delay can exacerbate the risks and narrow later choices. Mitigation aims to reduce the cause, while adaptation limits damage that can no longer be avoided. Confusing the two creates false alternatives: societies need both, although spending and timing remain contested."},{"label":"C","text":"Energy illustrates the difficulty of transition. An electricity system can transition from fossil-fuel-reliant generation to wind, solar, nuclear, hydroelectric power, storage and lower demand. Renewable technologies harness flows that are replenished, but constructing them still uses land and minerals. Transmission lines connect windy or sunny regions to consumers, and storage or flexible demand helps when output varies. These additions may pose a significant threat to particular habitats if sites are chosen poorly. On the other hand, refusing every new line or turbine can prolong combustion and its wider impacts. Public authorities can incentivise clean investment, speed up permits and protect sensitive areas simultaneously. The relevant comparison is not a project with no footprint versus one with a footprint, but credible alternatives that deliver the same service."},{"label":"D","text":"Land is not an empty platform for energy. Deforestation releases stored carbon and drives habitat loss, increasing the risk of extinction for some species. Protecting and restoring ecosystems can therefore mitigate climate change while improving water regulation and biodiversity. However, land-based action has limits. A plantation is not equivalent to an old, diverse forest, and trees cannot permanently compensate for continued fossil emissions if fire, drought or harvesting returns their carbon to the atmosphere. Large bioenergy schemes can compete with food production, conservation or local land rights. These conflicts remain controversial because benefits depend on location, management and timescale. Safeguarding high-carbon ecosystems is of paramount importance, but claims about future removals should not become permission to postpone direct emissions cuts."},{"label":"E","text":"Material use links the energy and land questions. Batteries, grids and buildings require extraction and processing; affluent societies generally consume far more materials and energy per person than poorer ones. Framing environmental pressure only as overpopulation can therefore be misleading, because population size and consumption patterns interact. A circular economy seeks to keep products and materials in use through durability, repair, reuse and recycling. It can reduce mining, waste and the emissions associated with making replacements. Yet circularity is not automatic. Improper waste disposal can cause soil and water contamination, while incineration may recover energy but destroys material value and emits carbon. Recycling also needs energy and cannot recover every material indefinitely. Demand reduction and longer product life must accompany better collection."},{"label":"F","text":"Carbon-neutral claims deserve equally careful reading. A company may cut direct fuel use, buy renewable electricity and finance removals for remaining emissions. These steps are not identical. A permanent reduction in fossil combustion prevents additional carbon from entering the atmosphere. An offset instead claims a balancing benefit beyond the reporting boundary through another reduction, an avoided emission or a removal. Every such claim depends on credible measurement; a removal also depends on continued storage. Boundaries matter too: excluding supply chains can make a carbon footprint look smaller without changing total emissions. At national level, imported goods may shift industrial emissions abroad while consumption continues. Good accounting therefore states the year, gases, activities and assumptions included. It also separates gross emissions, removals and avoided emissions. Without that clarity, the label carbon-neutral may describe a serious pathway, a limited product claim or little more than marketing."},{"label":"G","text":"Justice is not separate from effectiveness. Measures fail when they ignore who can afford new equipment, who loses a job or who controls land. A higher fuel price may encourage efficiency, but it can burden a rural household with no public transport. Closing a polluting plant may improve health while destabilising a town that depends on its wages and tax revenue. Governments can tackle the issue of unequal impacts through rebates, retraining, affordable transport and participation in siting decisions. Support should enable change rather than preserve every existing activity indefinitely. Equally, the costs of transition should not be used to excuse inaction, because climate damage also falls unevenly and can make some places uninhabitable. Fair policy compares both the costs of acting and the costs of delay."},{"label":"H","text":"A remaining carbon budget can therefore serve as a decision framework as well as an atmospheric limit. Applied to policy, it raises questions about which emissions fall first, which services continue and which land and materials each pathway requires. Assessments can test whether an option reduces cumulative emissions, affects vulnerable communities, damages ecosystems and remains technically deliverable. No single technology passes every test everywhere. Stated priorities and measurements of actual emissions allow later results to be compared with earlier announcements. Examining energy, land, water and material flows together also reveals interactions that separate sector targets may miss. Some measures, including efficient homes, durable products, cleaner transport and ecosystem protection, can produce several benefits; others transfer burdens between sectors or groups. Carbon-budget decisions therefore include physical limits, resource requirements and the distribution of costs, not only a final emissions total."}],"sources":[{"title":"Causes of Climate Change","url":"https://science.nasa.gov/climate-change/causes/","publisher":"NASA Science"},{"title":"AR6 Synthesis Report: Summary for Policymakers","url":"https://www.ipcc.ch/report/ar6/syr/summary-for-policymakers/","publisher":"Intergovernmental Panel on Climate Change"},{"title":"What is a Circular Economy?","url":"https://www.epa.gov/circulareconomy/what-circular-economy","publisher":"United States Environmental Protection Agency"},{"title":"Where greenhouse gases come from","url":"https://www.eia.gov/energyexplained/energy-and-the-environment/where-greenhouse-gases-come-from.php","publisher":"U.S. Energy Information Administration"}],"vocabIds":["wic01","wic02","wic03","wic04","wic05","wic06","wic07","wic08","wic09","wic10","wic11","wic12","wic13","wic14","wic15","wic16","wic17","wic18","wic19","wic20","wic21","wic22","wic23","wic24","wic25","wic26","wic27","wic28","wic29","wic30","wic31","wic32","wic33"],"vocabCoverage":[{"id":"wic01","quote":"can intensify evaporation"},{"id":"wic02","quote":"an isolated pressing challenge"},{"id":"wic03","quote":"helps trap heat"},{"id":"wic04","quote":"may pose a significant threat to particular habitats"},{"id":"wic05","quote":"drought in others"},{"id":"wic06","quote":"intensify evaporation"},{"id":"wic07","quote":"water depletion"},{"id":"wic08","quote":"already arid regions"},{"id":"wic09","quote":"make some places uninhabitable"},{"id":"wic10","quote":"can displace residents"},{"id":"wic11","quote":"cause devastating losses"},{"id":"wic12","quote":"delay can exacerbate the risks"},{"id":"wic13","quote":"tackle the issue of unequal impacts"},{"id":"wic14","quote":"only as overpopulation can therefore be misleading"},{"id":"wic15","quote":"Deforestation releases stored carbon"},{"id":"wic16","quote":"make farms and settlements more vulnerable"},{"id":"wic17","quote":"drives habitat loss"},{"id":"wic18","quote":"risk of extinction"},{"id":"wic19","quote":"improving water regulation and biodiversity"},{"id":"wic20","quote":"can therefore mitigate climate change"},{"id":"wic21","quote":"cut the carbon footprint quickly"},{"id":"wic22","quote":"transition from fossil-fuel-reliant generation to wind"},{"id":"wic23","quote":"Renewable technologies harness flows"},{"id":"wic24","quote":"affluent societies generally consume far more materials"},{"id":"wic25","quote":"fossil-fuel-reliant generation"},{"id":"wic26","quote":"is of paramount importance"},{"id":"wic27","quote":"can incentivise clean investment"},{"id":"wic28","quote":"These conflicts remain controversial"},{"id":"wic29","quote":"Carbon-neutral claims deserve equally careful reading"},{"id":"wic30","quote":"Improper waste disposal can cause"},{"id":"wic31","quote":"soil and water contamination"},{"id":"wic32","quote":"incineration may recover energy"},{"id":"wic33","quote":"A circular economy seeks to keep products"}],"questions":[{"id":"r03q01","type":"mc","prompt":"Which statement is NOT true according to the text?","choices":["Fossil-fuel use is central to the human-caused rise in atmospheric carbon dioxide.","Renewable energy infrastructure can require land, minerals and transmission lines.","A circular economy can recover every material indefinitely if enough energy is available.","The meaning of a carbon-neutral claim depends partly on its accounting boundaries."],"answer":2,"points":1,"explanation":"Paragraph E states that recycling cannot recover every material indefinitely. The other statements are supported by paragraphs B, C and F.","evidence":"Paragraph E: ‘Recycling also needs energy and cannot recover every material indefinitely.’"},{"id":"r03q02","type":"mc","prompt":"Complete the sentence according to paragraph C: The environmental value of a new energy project should be assessed by ...","choices":["comparing it with credible alternatives that provide the same service.","approving it whenever its operational emissions are lower than before.","requiring it to have no effect on land, minerals or habitats.","measuring only the electricity produced at the project site."],"answer":0,"points":1,"explanation":"Paragraph C requires comparison among realistic ways of delivering the same service. The distractors ignore wider impacts or demand an impossible zero-impact project.","evidence":"Paragraph C: ‘credible alternatives that deliver the same service.’"},{"id":"r03q03","type":"mc","prompt":"Why can a population-only explanation of environmental pressure be misleading?","choices":["Because population has no relationship to resource demand.","Because poorer societies always use more materials per person.","Because material extraction occurs independently of consumption.","Because population size interacts with very unequal consumption levels."],"answer":3,"points":1,"explanation":"Paragraph E links total pressure to both population and per-person consumption, noting higher material and energy use in affluent societies. The other options deny or reverse those relationships.","evidence":"Paragraph E: ‘population size and consumption patterns interact.’"},{"id":"r03q04","type":"mc","prompt":"What broader purpose does the carbon-budget discussion serve in paragraphs A and H?","choices":["It reduces climate policy to one final emissions figure.","It links a cumulative emissions limit to choices about resources, services and distribution.","It proves that land and material effects are more important than atmospheric warming.","It identifies one technology that satisfies every policy test."],"answer":1,"points":1,"explanation":"The text defines the atmospheric limit, then connects pathways to energy, land, materials, services and social distribution. The distractors contradict that integrated approach.","evidence":"Paragraph H: ‘Carbon-budget decisions therefore include physical limits, resource requirements and the distribution of costs, not only a final emissions total.’"},{"id":"r03q05","type":"mediation","prompt":"Vergleiche für einen kurzen Infokasten auf Deutsch direkte Emissionssenkungen und Kompensation beziehungsweise CO₂-Entnahmen. Nutze Absatz F.","points":2,"model":"Direkte Emissionssenkungen verhindern zusätzliches CO₂ aus fossiler Verbrennung an der Quelle. Eine Kompensation beansprucht dagegen einen Ausgleich außerhalb der Bilanzgrenze, etwa durch eine andere Senkung, eine vermiedene Emission oder eine Entnahme. Jede solche Gutschrift benötigt glaubwürdige Messung und klare Bilanzgrenzen. Bei einer CO₂-Entnahme kommt als eigene Bedingung hinzu, dass der Kohlenstoff dauerhaft gespeichert bleibt.","criteria":["Erklärt, dass direkte Senkungen zusätzliche fossile Emissionen an der Quelle vermeiden.","Erklärt, dass Kompensation einen Ausgleich durch eine andere Senkung, eine vermiedene Emission oder eine Entnahme beansprucht.","Nennt glaubwürdige Messung oder klare Bilanzgrenzen als Voraussetzung für die Kompensation.","Nennt dauerhafte Speicherung als zusätzliche Bedingung für CO₂-Entnahmen."],"criterionPoints":[0.5,0.5,0.5,0.5],"explanation":"Je Vergleichsaspekt werden 0,5 Punkte vergeben. Erwartet wird eine knappe deutsche Gegenüberstellung, keine vollständige Übersetzung.","evidence":"Absatz F: ‘A permanent reduction in fossil combustion prevents additional carbon from entering the atmosphere.’ / ‘An offset instead claims a balancing benefit beyond the reporting boundary through another reduction, an avoided emission or a removal.’ / ‘Every such claim depends on credible measurement; a removal also depends on continued storage.’"},{"id":"r03q06","type":"text","prompt":"Which two-word expression in paragraph D means the destruction or reduction of species’ natural living space?","answer":["habitat loss"],"points":1,"explanation":"‘Habitat loss’ names the disappearance or degradation of the places where species live.","evidence":"Paragraph D: ‘Deforestation releases stored carbon and drives habitat loss’.","task":"short-answer"},{"id":"r03q07","type":"text","prompt":"Which two-word expression in paragraph F means the total climate emissions assigned to a defined set of activities?","answer":["carbon footprint"],"points":1,"explanation":"A ‘carbon footprint’ totals the emissions included within a stated accounting boundary.","evidence":"Paragraph F: ‘excluding supply chains can make a carbon footprint look smaller without changing total emissions.’","task":"short-answer"}]}],"gaps":[{"id":"g01","title":"When the village well ran low","unit":"WIC","level":"Core","examOnly":false,"text":"The village had always stood in an {0} region, so people were used to making careful decisions about water. This summer, however, a long {1} continued after the season when rain normally arrived. Heat increased {2} from the small lake, while the continued use of underground reserves led to further {3}. Farmers could see that the two supplies were under pressure for different reasons.\n\nAt a public meeting, protecting drinking water became a {4}. The loss of crops had already had a {5} effect on several families, who depended on the harvest for their income. If conditions became worse, the shortage could {6} more residents. People also feared that arguments over access to the remaining water would {7} existing tensions.\n\nThe village therefore asked farmers, households and local officials to plan together. They agreed to explain decisions openly and consider how each measure would affect people's ability to live and work. Nobody claimed that one meeting could produce rain, but the group could at least organise a fair response to the shortage.","gaps":[{"term":"arid","answer":["arid"],"definition":"very dry because there is little rain","explanation":"Arid describes the region's usual dry conditions; it is an adjective before region."},{"term":"drought","answer":["drought"],"definition":"a long period of unusually dry weather with too little rain","explanation":"Drought names the unusually dry period; use the singular noun after a long."},{"term":"evaporation","answer":["evaporation"],"definition":"the process in which liquid changes into gas","explanation":"Evaporation is the process increased by heat, not water use."},{"term":"depletion","answer":["depletion"],"definition":"the reduction of a supply by using it up","explanation":"Depletion describes underground reserves being used up; it is an uncountable noun here."},{"term":"pressing challenge","answer":["pressing challenge"],"definition":"a serious and urgent problem requiring attention","explanation":"Pressing challenge fits after a and identifies the urgent problem."},{"term":"devastating","answer":["devastating"],"definition":"causing great damage or suffering","explanation":"Devastating is an adjective describing the effect of failed crops."},{"term":"displace","answer":["displace"],"definition":"force people to leave their homes","explanation":"Use the base verb displace after could."},{"term":"exacerbate","answer":["exacerbate"],"definition":"make an existing problem worse","explanation":"Exacerbate fits after would and shows that tensions already existed."}],"distractors":["contamination","biodiversity"]},{"id":"g02","title":"The road beside the forest","unit":"WIC","level":"Core","examOnly":false,"text":"A proposed road would pass through the forest beside a small town. During a school project, a class examined the plan instead of judging it only from the route on a map. The removal of a large wooded area would be {0}. For animals that depended on that area, the immediate problem would be {1}. The students recorded the forest's {2}, noting that it supported many different plants and animals.\n\nOne group explained that species could become more {3} as their natural homes were reduced or divided. Being at risk was different from {4}, which would mean that a species no longer existed. Their report concluded that the proposed route {5} to the forest, although the town still needed to discuss its transport needs.\n\nAnother group connected forests with the climate. They explained that greenhouse gases {6}, and that forests help store carbon. Protecting the woodland could therefore help {7} harm in more than one way. At the final meeting, students asked the planners to explain how each possible route would affect both the community and the surrounding environment.","gaps":[{"term":"deforestation","answer":["deforestation"],"definition":"the cutting down of large areas of forest","explanation":"Deforestation names the removal of the wooded area."},{"term":"habitat loss","answer":["habitat loss"],"definition":"the destruction or reduction of a species' natural home","explanation":"Habitat loss explains what removing the forest means for its inhabitants."},{"term":"biodiversity","answer":["biodiversity"],"definition":"the variety of plants and animals in a place","explanation":"Biodiversity names the variety recorded by the students."},{"term":"vulnerable","answer":["vulnerable"],"definition":"easily harmed or affected","explanation":"Vulnerable is an adjective after become more."},{"term":"extinction","answer":["extinction"],"definition":"the state in which a species no longer exists","explanation":"Extinction concerns the disappearance of a species, not just an increased risk."},{"term":"pose a significant threat","answer":["posed a significant threat"],"definition":"created a serious risk or danger","explanation":"The report is in the past, so posed agrees with the past reporting context."},{"term":"trap heat","answer":["trap heat"],"definition":"prevent warmth from escaping","explanation":"Greenhouse gases is plural, so use trap heat."},{"term":"mitigate","answer":["mitigate"],"definition":"make harm less serious","explanation":"Use mitigate after help; the aim is to reduce harm."}],"distractors":["depletion","carbon-neutral"]},{"id":"g03","title":"A new energy plan for the school","unit":"WIC","level":"Stretch","examOnly":false,"text":"The school served an {0} town with many large homes and busy roads. Although residents could afford new technology, the local energy supply remained {1}. The student council wanted the school to use the energy discussion as a practical learning project. Engineers explained how equipment on the roof could {2} the sun's energy, while students compared ways to reduce the school's {3}.\n\nThe building manager argued that the school should {4} gas boilers to a cleaner heating system, but that the work needed careful planning. Better insulation could also reduce waste before more energy was produced. The council asked the town to {5} these changes by offering financial support to schools that improved their buildings.\n\nThe long-term aim was to become {6}, meaning that the school would need to consider its overall balance of carbon dioxide. Some proposals could still {7} because families disagreed about costs and priorities. The students therefore presented the reasons for each choice and invited questions. They wanted the final decision to connect an ambitious aim with a clear explanation of what would actually change.","gaps":[{"term":"affluent","answer":["affluent"],"definition":"wealthy and enjoying a high standard of living","explanation":"Affluent is an adjective before town."},{"term":"fossil-fuel-reliant","answer":["fossil-fuel-reliant"],"definition":"depending heavily on coal, oil or gas","explanation":"Fossil-fuel-reliant describes the existing energy supply."},{"term":"harness","answer":["harness"],"definition":"control and use energy or a natural force","explanation":"Use the base verb harness after could."},{"term":"carbon footprint","answer":["carbon footprint"],"definition":"the amount of carbon dioxide associated with a person, activity or organisation","explanation":"Carbon footprint is the noun phrase after the school's."},{"term":"transition from … to …","answer":["transition from"],"definition":"change from one system to another","explanation":"Enter transition from; gas boilers and the destination beginning with to are already printed."},{"term":"incentivise","answer":["incentivise","incentivize"],"definition":"encourage an action by offering a benefit","explanation":"Use the base verb after to; both British incentivise and the accepted z variant are valid."},{"term":"carbon-neutral","answer":["carbon-neutral","carbon neutral"],"definition":"causing no net release of carbon dioxide","explanation":"Carbon-neutral describes the goal; net refers to the overall balance."},{"term":"remain controversial","answer":["remain controversial"],"definition":"continue to cause disagreement","explanation":"Use remain controversial after could; the proposals may continue to divide opinion."}],"distractors":["arid","incineration"]},{"id":"g04","title":"Before the lakeside festival opens","unit":"WIC","level":"Stretch","examOnly":false,"text":"Before approving another lakeside festival, the town decided to {0} waste around the camping area. The previous event had left bags beside the water, an example of {1}. Tests had then shown {2} in a narrow stream that entered the lake. A damaged hut nearby had also become {3}, so the organisers could not simply invite campers back and hope for the best.\n\nThe new plan began with the question of how to prevent unnecessary waste. Sending everything for {4} would mean burning it after the event, while a {5} would keep useful materials in use through repair and reuse. Organisers asked suppliers to explain how their equipment could be used again and arranged a place where visitors could return it.\n\nProtecting the water was {6}, since the campsite was part of the town's shared environment. Heavy rain could {7} the problem if loose rubbish reached the stream. The organisers therefore planned safe collection before the first visitor arrived. Their aim was to connect the event's design with its environmental responsibilities, rather than leave all the difficult decisions until the final day.","gaps":[{"term":"tackle the issue of","answer":["tackle the issue of"],"definition":"make a determined effort to deal with the problem of","explanation":"The phrase ends with of because waste is the issue being addressed."},{"term":"improper waste disposal","answer":["improper waste disposal"],"definition":"getting rid of waste in an unsuitable or illegal way","explanation":"Improper waste disposal names the careless handling described."},{"term":"contamination","answer":["contamination"],"definition":"pollution that makes something dirty or unsafe","explanation":"Contamination is the noun describing the stream's condition."},{"term":"uninhabitable","answer":["uninhabitable"],"definition":"unsafe or unsuitable for people to live in","explanation":"Uninhabitable is an adjective after become."},{"term":"incineration","answer":["incineration"],"definition":"the process of burning waste","explanation":"Incineration names the waste-burning process."},{"term":"circular economy","answer":["circular economy"],"definition":"a system in which materials are reused and waste is minimised","explanation":"Circular economy fits after a and connects repair with repeated use."},{"term":"of paramount importance","answer":["of paramount importance"],"definition":"more important than anything else","explanation":"The complete phrase fits after was and emphasises the priority."},{"term":"intensify","answer":["intensify"],"definition":"make something stronger or more severe","explanation":"Use intensify after could to describe the problem becoming worse."}],"distractors":["extinction","evaporation"]},{"id":"g05","title":"Finding a starting point on the beach","unit":"4A","level":"Core","examOnly":false,"text":"When Maya arrived at the beach, the shore was {0}. Parts of the path were {1} a grey covering of old bags and damaged packaging. She had expected anger, but instead she felt a strange {2}. The task seemed {3}, as though no number of volunteers could ever make the place clean again.\n\nAt the meeting afterwards, a teacher discussed {4}: people can find it difficult to respond emotionally when suffering or destruction appears on an enormous scale. That helped Maya understand why even a {5} situation had left her struggling to act. The group then talked about the {6} of possible measures. They wanted to know which actions could produce a useful result, instead of judging every small step against the whole world's waste.\n\nMaya decided to {7} for fewer disposable items at local events. The group still planned to clear the beach, but they also wanted to reduce the rubbish reaching it. They divided the work into practical tasks and explained how each one fitted the wider aim. Maya left with a responsibility she could understand and a reason to return.","gaps":[{"term":"rubbish-strewn","answer":["rubbish-strewn"],"definition":"covered with rubbish in many places","explanation":"Rubbish-strewn is an adjective describing the shore."},{"term":"shrouded in","answer":["shrouded in"],"definition":"covered or hidden by something","explanation":"The phrase shrouded in introduces the covering on the path."},{"term":"numbness","answer":["numbness"],"definition":"an inability to feel or react normally","explanation":"Numbness is the noun describing Maya's emotional response."},{"term":"insurmountable","answer":["insurmountable"],"definition":"too difficult to deal with successfully","explanation":"Insurmountable describes how the task appeared to Maya."},{"term":"psychic numbing","answer":["psychic numbing"],"definition":"reduced emotional response to suffering on a very large scale","explanation":"Psychic numbing names the response discussed by the teacher."},{"term":"dire","answer":["dire"],"definition":"extremely serious or urgent","explanation":"Dire is an adjective before situation."},{"term":"efficacy","answer":["efficacy"],"definition":"the ability to produce the intended result","explanation":"Efficacy identifies whether a proposed measure can work."},{"term":"campaign","answer":["campaign"],"definition":"take part in organised activities to achieve change","explanation":"Use campaign after decided to; the goal follows for."}],"distractors":["durable","wrongdoing"]},{"id":"g06","title":"The repair evening that became a regular event","unit":"4A","level":"Core","examOnly":false,"text":"At the community repair evening, people brought household items that had stopped working. A volunteer explained that a {0} product should last a long time, but lasting materials were not enough if a small broken part made the whole object useless. On another table, visitors borrowed {1} cups instead of taking {2} ones for a single drink.\n\nThe organisers discussed a familiar {3}: people wanted strong products, yet often replaced them quickly. Some visitors had begun to think that throwing things away was {4}. Seeing a damaged lamp work again challenged that belief. The local council was invited to {5} by providing a room and supporting the collection of usable parts.\n\nAt the end of the evening, the organisers did not {6} that the town's waste problem was solved. They simply announced that the event would return and asked visitors what had helped them. For one student, the experience had a {7} effect. She had previously seen an old object as the end of a story; now she could see the skills, materials and decisions that might give it another useful life.","gaps":[{"term":"durable","answer":["durable"],"definition":"able to last a long time without becoming damaged","explanation":"Durable is an adjective describing the intended quality of a product."},{"term":"reusable","answer":["reusable"],"definition":"able to be used again","explanation":"Reusable describes cups intended for repeated use."},{"term":"disposable","answer":["disposable"],"definition":"intended to be thrown away after one use or a short time","explanation":"Disposable contrasts with reusable in the drinks example."},{"term":"paradox","answer":["paradox"],"definition":"a situation containing apparently opposite ideas","explanation":"Paradox names the conflict between wanting strength and replacing products quickly."},{"term":"inevitable","answer":["inevitable"],"definition":"certain to happen and impossible to avoid","explanation":"Inevitable describes the belief that disposal cannot be avoided."},{"term":"intervene","answer":["intervene"],"definition":"become involved to improve a difficult situation","explanation":"Use intervene after invited to."},{"term":"declare","answer":["declare"],"definition":"announce something officially or publicly","explanation":"Use declare after did not; the verb stays in its base form."},{"term":"profound","answer":["profound"],"definition":"very great or having an important effect","explanation":"Profound is an adjective describing the student's change in thinking."}],"distractors":["terrestrial","numbness"]},{"id":"g07","title":"A museum looks back from an imagined future","unit":"4A","level":"Stretch","examOnly":false,"text":"The museum created an exhibition in which visitors imagined studying the remains of modern life far in the future. It did not ask them to settle the debate about a new {0}. Instead, it asked what traces human consumption might leave behind. A discarded plastic bottle became the {1} for a much wider story about how society uses materials.\n\nOne label described some plastics as almost {2}, emphasising how long they could persist after their first use. The guide explained that they do not simply {3} in the same way as food scraps. Small pieces may {4} where people no longer notice them, including in both marine and {5} environments. A model showed how a piece could {6} a seabird's stomach.\n\nThe final room focused on decisions rather than treating the material as an independent actor. A fictional case of illegal dumping encouraged visitors to discuss human {7} and responsibility. The exhibition ended with a question about what people could change now. Visitors were invited to think about products, habits and waste systems, rather than leave with the impression that the future had already been decided.","gaps":[{"term":"geological epoch","answer":["geological epoch"],"definition":"a long period in Earth's history with particular natural characteristics","explanation":"Geological epoch is the noun phrase following a new; the passage does not claim a formal classification has been agreed."},{"term":"poster child","answer":["poster child"],"definition":"a highly visible example representing an issue","explanation":"Poster child refers to the bottle as a representative example."},{"term":"imperishable","answer":["imperishable"],"definition":"able to exist for a very long time without being destroyed or decaying","explanation":"Almost imperishable emphasises persistence without claiming that nothing can ever damage the material."},{"term":"decompose","answer":["decompose"],"definition":"decay or break down through a natural process","explanation":"Use decompose after do not."},{"term":"lurk","answer":["lurk"],"definition":"remain present somewhere unnoticed","explanation":"Use lurk after may."},{"term":"terrestrial","answer":["terrestrial"],"definition":"relating to land rather than sea or air","explanation":"Terrestrial contrasts with marine and describes environments."},{"term":"lodge itself in","answer":["lodge itself in"],"definition":"become fixed in a place and difficult to remove","explanation":"A piece is singular, so itself is appropriate; in links the phrase to the stomach."},{"term": function activateVocab(s){S.vocab.active[vocabSlot()]=s.key;return s;}
const clusters=[['exacerbate','compound','intensify','deteriorate'],['mitigate','buffer','curtail'],['galvanize','mobilize','incentivise','campaign','advocate'],['insatiable','ravenous'],['contentious','remain controversial'],['numbness','psychic numbing'],['durable','imperishable','reusable']];
function nearMeaning(a,b){return C.normalize(a.term)===C.normalize(b.term)||clusters.some(c=>c.includes(a.term)&&c.includes(b.term));}
function pickDistinct(list,n){const selected=[];for(const v of shuffle(list)){if(!selected.some(x=>nearMeaning(x,v)))selected.push(v);if(selected.length===n)break;}return selected;}
function vocabQuestion(v,index,mode,difficulty='Standard'){
 const context=v.contexts[index%v.contexts.length];
 const q={id:'vq-'+v.id+'-'+mode+'-'+index,vocabId:v.id,unit:v.unit,points:1,explanation:context.explanation,kind:'vocabulary'};
 if(mode==='meanings'||(mode==='mixed'&&difficulty==='Easy')||(mode==='mixed'&&index%3===0)){
  const candidates=DATA.distractors[v.term],reverse=Array.isArray(candidates)&&index%2===1;
  const distractors=Array.isArray(candidates)?shuffle(candidates).slice(0,3).map(term=>DATA.vocabulary.find(x=>x.term===term)):candidates.definitions.map(def=>({def}));
  const options=shuffle([v,...distractors]);
  return {...q,type:'mc',prompt:reverse?`Which word or phrase has this meaning? ${v.def}`:`What does “${v.term}” mean?`,choices:options.map(x=>reverse?x.term:x.def),answer:options.findIndex(x=>x===v),explanation:`${v.term}: ${v.def} Example: ${context.sentence.replace('{gap}',context.answers[0])}`};
 }
 if(mode==='recall'&&!v.term.includes('…')){
  const spellings=[v.term,...(v.term==='incentivise'?['incentivize']:v.term==='galvanize'?['galvanise']:v.term==='mobilize'?['mobilise']:[])];
  return {...q,type:'text',prompt:`Erinnere dich an das Wort or phrase: ${v.def}`,answer:[...spellings,...(v.sourceTerm.startsWith('to ')?spellings.map(word=>'to '+word):[])],hintText:`${v.de} · Anfangsbuchstabe: ${v.term[0]}.`,explanation:`${v.term}: ${v.def} Example: ${context.sentence.replace('{gap}',context.answers[0])}`};
 }
 return {...q,type:'text',prompt:context.sentence+(mode==='contextual'?` (${v.def})`:` (${v.def})`),answer:context.answers,partial:(v.forms||[]).filter(f=>!context.answers.some(a=>C.normalize(a)===C.normalize(f))),hintText:`${v.de} · Anfangsbuchstabe: ${context.answers[0][0]}.`};
}
function startVocab(mode=S.vocab.mode,words=null,count=10){
 const candidates=words||pool();if(!candidates.length){notify('Keine Wörter für diese Filter.');return;}
 if(mode==='cards')return activateVocab(newSession('cards-'+(++S.uid),{kind:'vocabulary',format:'cards',deck:shuffle(candidates.map(v=>v.id)),index:0,flipped:false,ratings:{},reviewAdded:{},initialCount:candidates.length}));
 if(mode==='matching'){
  const chosen=pickDistinct(candidates,Math.min(6,candidates.length));
  return activateVocab(newSession('match-'+(++S.uid),{kind:'vocabulary',format:'matching',items:chosen,right:shuffle(chosen.map(v=>v.id)),matched:[],selection:null,error:null,message:'',wrong:new Set(),matchMode:S.vocab.matchMode,pairCount:0}));
 }
 if(mode==='mixed'&&S.vocab.difficulty==='Exam'){
  const sets=gapPool();
  const weak=new Set(DATA.vocabulary.filter(v=>S.needs[v.id]).map(v=>C.normalize(v.term))),priority=g=>g.gaps.filter(q=>weak.has(C.normalize(q.term))).length;
  if(sets.length)return activateVocab(gapSession(shuffle(sets).sort((a,b)=>priority(b)-priority(a))[0],false));
 }
 let chosen=shuffle(candidates);if(mode==='mixed')chosen=chosen.sort((a,b)=>Number(!!S.needs[b.id])-Number(!!S.needs[a.id]));
 chosen=chosen.slice(0,count);
 return activateVocab(newSession('vocab-'+(++S.uid),{kind:'vocabulary',format:'quiz',title:{meanings:'Finde die Bedeutung',recall:'Erinnere dich an das Wort',contextual:'Nutze den Kontext',mixed:'Deine gemischten Aufgaben'}[mode]||'Wortschatz üben',questions:chosen.map((v,i)=>vocabQuestion(v,Math.floor(Math.random()*3)+(i*3),mode,S.vocab.difficulty)),allowHints:S.vocab.difficulty!=='Exam'}));
}

 if(!p.length)body=empty('Keine Wörter für diese Filter.','Wähle eine andere Quelle, alle Wörter oder leere die Suche.',btn('Filter zurücksetzen','clear-vocab','','primary'));
 else if(mode==='glossary')body=renderGlossary(p);
 else if(mode==='bank'||mode==='gaps')body=s?renderVocabGap(s):renderGapCatalog(mode);
 else if(mode==='cards'){if(!s)s=startVocab();body=renderCards(s);}

 else{if(!s)s=startVocab();body=`<div class="study-toolbar"><div><h3 class="no-margin">${h(s.title||s.gap?.title||'Gemischte Prüfungsübungen')}</h3><p>${s.questions.length} questions · ${p.length} Einträge im Filter</p></div><div class="actions">${mode==='mixed'?`<label class="inline-label">Mode <select style="width:120px" data-setting="vocab.difficulty">${['Easy','Standard','Exam'].map(x=>`<option ${S.vocab.difficulty===x?'selected':''}>${x}</option>`).join('')}</select></label>`:''}${btn('Neue Aufgaben','new-vocab','','compact','shuffle')}</div></div>${s.format==='gap'?gapMarkup(s):quizMarkup(s)}`;}
 return header('So bleiben die Wörter hängen.','Lerne zuerst die Bedeutung. Finde dann das Wort und seine richtige Form im Satz.',btn('Meine Fehler üben','mistakes','','','rotate'))+`<div class="tabs" aria-label="Wortschatzübungen">${modes.map(([id,label])=>`<button type="button" class="tab ${mode===id?'active':''}" data-act="vocab-mode" data-mode="${id}" aria-pressed="${mode===id}">${label}</button>`).join('')}</div>`+filterMarkup()+body;
}

}

function gapSession(g,bank=false,key=null){
 const questions=g.gaps.map((item,i)=>{const v=DATA.vocabulary.find(v=>C.normalize(v.term)===C.normalize(item.term)&&(g.unit==='Mixed'||v.unit===g.unit))||DATA.vocabulary.find(v=>C.normalize(v.term)===C.normalize(item.term));return {id:g.id+'q'+i,type:'text',prompt:`${g.title}, gap ${i+1}: ${item.definition}`,answer:item.answer,points:1,explanation:item.explanation,vocabId:v?.id,unit:v?.unit,definition:item.definition,partial:(v?.forms||[]).filter(f=>!item.answer.some(a=>C.normalize(a)===C.normalize(f)))};});
 return newSession(key||'gap-'+(++S.uid),{kind:'vocabulary',format:'gap',gap:g,questions,bankMode:bank,bank:shuffle([...questions.map(q=>q.answer[0]),...(g.level==='Stretch'?(g.distractors||[]):[])])});

function gapPool(){const terms=new Set(pool().map(v=>C.normalize(v.term)));return DATA.gaps.filter(x=>!x.examOnly&&(S.vocab.unit==='all'||x.unit===S.vocab.unit)&&(S.vocab.level==='all'||x.level===S.vocab.level)&&(!S.vocab.search||x.gaps.some(g=>terms.has(C.normalize(g.term)))));}

e-step',`data-session="${s.key}" data-index="${s.guideStep+1}"`,'compact soft','arrow'):btn('Fragen bearbeiten','guide-finish','','compact soft','check')}</div>${teacherGuidance()}</section>`;}

th+' Kurswörter</p>'+(session?.checked?'<p class="small">'+(sum.pending?sum.pending+' Punkte benötigen eine Bewertung':sum.earned+' / '+sum.possible+' Punkte')+'</p>':'')+btn(session?'Weiterlesen':'Lesetext öffnen','start-reading','data-id="'+r.id+'"','','arrow')+'</article>';}).join('')+'</div>'+(!readings.length?empty('Kein Lesetext passt zu dieser Auswahl.','Wähle eine andere Stufe oder Aufgabenart.'):'')+'<p class="footer-note">Belegte Klimathemen, keine erfundenen Fallgeschichten. Der dritte Text bleibt für die Prüfungssimulation reserviert.</p>';

function startExam(configId,minutes=0){
 const config=examConfigs.find(x=>x.id===configId),gap=DATA.gaps.find(x=>x.id===config.gapId),reading=DATA.readings.find(x=>x.id===config.readingId);
 const base=gapSession(gap,false,'exam-'+(++S.uid)),prefix=base.key+'-';
 const part1=base.questions.map(q=>({...q,id:prefix+q.id,originId:q.id,part:1}));
 const part2=config.contextIds.map(id=>{const q=DATA.context.questions.find(q=>q.id===id);return {...q,id:prefix+q.id,originId:q.id,part:2};});
 const part3=reading.questions.map(q=>({...q,id:prefix+q.id,originId:q.id,part:3,readingId:reading.id}));
 Object.assign(base,{kind:'exam',format:'exam',configId,title:config.title,questions:[...part1,...part2,...part3],readingId:reading.id,part:1,resultPart:1,minutes,startedAt:Date.now(),deadline:minutes?Date.now()+minutes*60000:null,pausedRemaining:null,submitted:false,bankMode:false});
 S.exams.id=base.key;closeModal();navigate('exams');startTimerLoop();notify(minutes?`Übungsprüfung started. The timer is set to ${minutes} minutes.`:'Übungsprüfung started without a timer.');
}
function examCatalog(){return header('In Ruhe für die Prüfung üben.','Übe alle drei Prüfungsteile. Wähle bei Bedarf ein Zeitlimit und werte deine Antworten nach der Abgabe aus.')+sourceNotice(true)+`<div class="grid three section">${examConfigs.map((c,i)=>{const active=Object.values(S.sessions).find(s=>s.kind==='exam'&&s.configId===c.id&&!s.submitted);const history=Object.values(S.sessions).filter(s=>s.kind==='exam'&&s.configId===c.id&&s.submitted);return `<article class="card exam-card catalog-card"><div class="exam-number">0${i+1}</div><h3>${h(c.title)}</h3><p>${h(c.subtitle)}</p><div class="exam-parts"><div>${icon('book')}<span>Teil 1 · Definitionslückentext</span></div><div>${icon('nodes')}<span>Teil 2 · Vorläufige Themenfragen</span></div><div>${icon('text')}<span>Teil 3 · Neuer Lesetext</span></div></div><div class="summary-tags">${(DATA.readings.find(r=>r.id===c.readingId)?.questions||[]).map(q=>q.type).filter((t,i,a)=>a.indexOf(t)===i).map(t=>tag(typeName(t))).join('')}</div><p class="tiny muted">Optionales Zeitlimit · Rückmeldung nach Abgabe</p>${active?btn('Prüfung fortsetzen','resume-exam',`data-session="${active.key}"`,'primary','arrow'):btn('Prüfung vorbereiten','setup-exam',`data-id="${c.id}"`,'primary','arrow')}${history.length?`<button class="link-button" data-act="resume-exam" data-session="${history.at(-1).key}">Letztes Ergebnis ansehen ${icon('arrow')}</button>`:''}</article>`;}).join('')}</div><div class="notice section"><strong>Übungsbedingungen.</strong> Dies ist eine Übungssimulation. Zeitlimit und Punkteverteilung sind Übungseinstellungen; offizielle Prüfungsdauer und Notenskala fehlen. Teil 2 bleibt wegen der fehlenden Lehrbuchseite 50 vorläufig. Der dritte Klimasachtext ist für diese Prüfung reserviert.</div>`;}

function unresolvedQuestions(){
 const latest={};for(const log of Object.values(S.logs)){if(!log.vocabId&&!log.pending){const prev=latest[log.questionId];if(!prev||(log.at||0)>=(prev.at||0))latest[log.questionId]=log;}}
 return Object.values(latest).filter(x=>x.earned<x.possible&&x.question);
}
function startMistakes(){
 const weak=DATA.vocabulary.filter(v=>S.needs[v.id]),other=unresolvedQuestions();
 if(!weak.length&&!other.length){S.results.tab='mistakes';navigate('results');return;}
 const questions=shuffle(weak).slice(0,8).map((v,i)=>vocabQuestion(v,i,'contextual'));
 for(const log of other.slice(0,Math.max(4,12-questions.length)))questions.push({...log.question,id:'review-'+(++S.uid),originId:log.questionId,readingId:log.readingId||log.question.readingId});
 const s=newSession('revision-'+(++S.uid),{kind:'revision',format:'quiz',title:'Deine Fehler üben',questions,allowHints:true});
 S.results.revisionKey=s.key;S.results.tab='practice';navigate('results');
}

 s.answers[q.id]=el.value;
 if(el.type==='radio'){$$('label.choice',el.closest('.choices')).forEach(l=>l.classList.toggle('chosen',$('input',l).checked));}
 if(s.kind==='exam'){
  const count=examAnswered(s);for(const progress of $$('[data-exam-progress="'+s.key+'"]')){progress.textContent=`${count} / ${s.questions.length} responses entered`;const fill=progress.closest('.study-toolbar')?.nextElementSibling?.querySelector('.progress-fill');if(fill)fill.style.width=count/s.questions.length*100+'%';}
  const jump=$('.exam-question-nav [data-q="'+q.id+'"]');if(jump)jump.classList.toggle('answered',String(el.value).trim()!=='');
 }
}
function onKeydown(event){
 const modal=$('.modal');
 if(modal){if(event.key==='Escape'){event.preventDefault();closeModal();return;}if(event.key==='Tab'){const focusable=$$('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href],summary',modal);if(!focusable.length){event.preventDefault();return;}const first=focusable[0],last=focusable.at(-1);if(event.shiftKey&&(document.activeElement===first||document.activeElement===modal)){event.preventDefault();last.focus();}else if(!event.shiftKey&&(document.activeElement===last||document.activeElement===modal)){event.preventDefault();first.focus();}}return;}
 if(event.key==='Enter'&&event.target.matches('input[type="text"][data-q]')){const s=getSession(event.target.dataset.session);if(s&&s.kind!=='exam'&&!s.checked){event.preventDefault();s.checked=true;commitSession(s);renderKeepFocus();notify('Antworten geprüft. Lies die Rückmeldung.');}}
}
function initializeApp(){
 $('#nav').innerHTML=views.map(([id,label,mobile,ico],i)=>`<button type="button" data-act="nav" data-view="${id}" aria-label="${h(label)}">${icon(ico)}<span class="desktop-label">${h(label)}</span><span class="mobile-label">${h(mobile)}</span><span class="nav-number">0${i+1}</span></button>`).join('');
 document.addEventListener('click',onAction);document.addEventListener('input',event=>{if(event.target.tagName!=='SELECT')onInput(event);});document.addEventListener('change',event=>{if(event.target.tagName==='SELECT')onInput(event);});document.addEventListener('keydown',onKeydown);
 document.addEventListener('toggle',event=>{const id=event.target.dataset?.topic;if(id){S.context.openTopics??={};S.context.openTopics[id]=event.target.open;}},true);
 $('#modal-host').addEventListener('click',event=>{if(event.target.dataset.overlay)closeModal();});
 render();
}
// Reset transient answers when restored from the browser back/forward cache.
window.addEventListener('pageshow', event => { if(event.persisted) location.reload(); });
initializeApp();
</script>
