at. However, it would make the journey longer.","criteria":["Identifies preserving more marsh or avoiding the wettest habitat as a benefit.","Identifies the longer journey as the cost of that design."],"explanation":"A trade-off contains both a desirable result and something given up. Simply naming the wooden path does not explain it.","evidence":"Paragraph C: ‘preserve more of the marsh, although the journey would be longer’."},{"id":"r05q06","type":"open","prompt":"Describe the two evidence sources used in the trial: the volunteers’ observations and regular users’ reports. State what each will cover. Answer concisely in English.","points":2,"model":"It will collect wildlife observations and reports from regular users about travelling safely and comfortably.","criteria":["Identifies wildlife observations or evidence about the habitat.","Identifies users’ reports about safe and comfortable access."],"explanation":"The trial checks environmental and practical effects, giving the council information about both purposes of the place.","evidence":"Paragraph E: ‘record wildlife observations’ and ‘report whether they could travel safely and comfortably’."}]},{"id":"r06","title":"A label is only the beginning","source":"Original practice text — fictional scenario.","level":"Standard","minutes":18,"examOnly":false,"paragraphs":[{"label":"A","text":"For the school magazine, Eva investigated a question that sounded easy: which coat should she wear through winter? Her older sister had offered her a used one with a broken zip. Meanwhile, the fictional company Mossline was advertising a new jacket with a large green label. The words ‘carbon-neutral delivery’ were easy to see. The explanation beneath them was much smaller."},{"label":"B","text":"Eva contacted the company instead of guessing what the label meant. Its reply explained that the claim concerned the journey from the warehouse to the customer. It did not describe the materials used in the jacket or the energy consumed during production. Eva wrote that this information did not prove wrongdoing. It did mean that the delivery claim alone could not answer her wider environmental question."},{"label":"C","text":"Next, she spoke to a local repairer. The damaged zip in her sister’s coat could be replaced, and the rest of the coat was still durable. The repair would cost less than the new jacket, although Eva would need to collect it after school. She noticed how easily the excitement of a new purchase had pushed this practical option into the background."},{"label":"D","text":"Her article did not tell every reader to make exactly the same choice. Someone without a suitable coat might need to buy one. Another person might live too far from a repair shop to use it easily. Eva therefore included questions about durability, repair services and the full carbon footprint of production and transport. She also asked whether advertised benefits were explained clearly enough to check."},{"label":"E","text":"Eva chose the repair. More importantly for her article, she changed the question from ‘Which label looks greenest?’ to ‘What information supports this choice?’ She kept the company’s reply in the magazine’s evidence folder so readers could distinguish its actual claim from assumptions they might have made about the whole product."}],"summaryBank":["delivery","production","durable","disposable","wrongdoing","repair"],"questions":[{"id":"r06q01","type":"text","prompt":"Complete the summary with one word from the text: Mossline’s environmental claim covers {gap}, rather than every stage of the jacket’s life.","answer":["delivery"],"points":1,"explanation":"The claim concerns transport from the warehouse to the customer. It does not describe how the jacket was made.","evidence":"Paragraph A: ‘carbon-neutral delivery’; paragraph B: ‘the journey from the warehouse to the customer’."},{"id":"r06q02","type":"text","prompt":"Complete the summary with one word from the text: Replacing the zip is a practical option because the rest of the used coat is still {gap}.","answer":["durable"],"points":1,"explanation":"A single faulty part does not mean that the whole coat has reached the end of its useful life.","evidence":"Paragraph C: ‘the rest of the coat was still durable’."},{"id":"r06q03","type":"mc","prompt":"What does Eva conclude from the company’s reply?","choices":["The company has proved that its whole jacket has no environmental impact.","Every environmental label must be deliberately dishonest.","The narrow claim cannot settle the broader question about the product.","Production matters only when delivery is not carbon-neutral."],"answer":2,"points":1,"explanation":"Eva distinguishes the limited scope of the claim from her broader question. She explicitly avoids claiming that wrongdoing has been proved.","evidence":"Paragraph B: ‘the delivery claim alone could not answer her wider environmental question’."},{"id":"r06q04","type":"mc","prompt":"Why does the article mention people living far from repair shops?","choices":["To explain why all damaged clothes should be thrown away.","To acknowledge that people have different practical options.","To prove that travelling always costs more than buying a coat.","To suggest that durability is unimportant in rural places."],"answer":1,"points":1,"explanation":"Repair access is one reason the same decision may not be suitable for every reader.","evidence":"Paragraph D: ‘did not tell every reader to make exactly the same choice’ and ‘too far from a repair shop’."},{"id":"r06q05","type":"mc","prompt":"Why does Eva keep the company’s reply?","choices":["To encourage readers to buy the same brand.","To hide the limits of her investigation.","To show that the company recommended repairing the coat.","To let readers compare the stated claim with their own assumptions."],"answer":3,"points":1,"explanation":"Keeping the source makes the scope of the actual claim checkable. Readers need not rely on the appearance of the label.","evidence":"Paragraph E: ‘distinguish its actual claim from assumptions they might have made’."},{"id":"r06q06","type":"mediation","prompt":"Ein deutschsprachiger Freund glaubt, das grüne Etikett beweise, dass der Kauf dieser Jacke die beste Wahl für die Umwelt ist. Welche Informationen sollte er vor seiner Entscheidung berücksichtigen? Verfasse anhand der Absätze B–D eine kurze Nachricht auf Deutsch. Erkläre die begrenzte Aussage des Etiketts und Evas Reparaturmöglichkeit. Formuliere außerdem je eine Frage: eine zur Langlebigkeit oder zu Reparaturangeboten und eine zum gesamten CO₂-Fußabdruck von Herstellung und Transport oder zu Belegen für die beworbenen Umweltvorteile.","points":4,"model":"Die Angabe bezieht sich nur auf die Lieferung vom Lager zur Kundschaft. Sie sagt nichts über die Materialien oder den Energieverbrauch bei der Herstellung aus. Eva kann den Reißverschluss des vorhandenen Mantels ersetzen lassen, weil der Rest noch haltbar ist. Vor einem Kauf solltest du fragen, wie langlebig und reparierbar das Produkt ist und welche Informationen es zum gesamten CO₂-Fußabdruck von Herstellung und Transport gibt.","criteria":["Explains in German that the claim covers delivery from the warehouse, not the materials or production.","Explains in German that repairing the zip can keep an otherwise durable coat in use.","Includes a useful German question about durability or available repair services.","Includes a useful German question about the full production-and-transport footprint or evidence supporting advertised benefits."],"explanation":"The message should correct the overinterpretation and help the friend make a decision. It should not accuse the company of dishonesty, which the text does not establish.","evidence":"Paragraph B: ‘did not describe the materials’ or ‘energy consumed during production’; paragraph C: ‘zip ... could be replaced’; paragraph D: ‘durability, repair services and the full carbon footprint’."}]},{"id":"r07","title":"The river does not stop at a fence","source":"Original practice text — fictional scenario.","level":"Standard","minutes":19,"examOnly":false,"paragraphs":[{"label":"A","text":"When a photograph of dirty water beside Northfield Farm appeared on the village noticeboard, some residents immediately blamed the farmer. The image showed where the photographer had stood, however, not where the contamination had begun. A student river group decided to investigate the route the water took before reaching that bend. Their teacher asked them to separate what they had observed from what they merely suspected."},{"label":"B","text":"The students drew a map of the watershed: the area of land from which water drained into the river. The map included farms, a road, houses and the town’s waste collection yard. During a visit after heavy precipitation, they saw water flowing from several directions. A fence between properties did not prevent water from moving beyond them. Responsibility could not be assigned just by looking at the nearest sign."},{"label":"C","text":"An environmental officer helped compare samples from different places. Water entering the farm’s boundary already showed contamination. This weakened the claim that the photographed field was the only possible source. It did not prove that every activity on the farm was harmless. The officer said that further checks were needed to identify particular sources and decide which measures would be effective."},{"label":"D","text":"Meanwhile, the council repaired a leaking pipe near the collection yard and arranged better covers for waste containers. Farmers agreed to review how they stored materials near the river. These actions addressed visible problems without waiting for one dramatic explanation. The students recorded them separately from the sample results, because a promised improvement was not the same as evidence that water quality had improved."},{"label":"E","text":"At the public meeting, the group showed its map before displaying the original photograph. Residents asked fewer questions about who looked guilty and more about which checks would come next. The group’s final report left space for new results. Its strongest conclusion was that protecting a shared river required people to look beyond their own boundary."}],"questions":[{"id":"r07q01","type":"match","prompt":"Which paragraph explains why water management must consider a whole connected area? Paragraphs may be used more than once.","choices":["Paragraph A","Paragraph B","Paragraph C","Paragraph D","Paragraph E"],"answer":1,"points":1,"explanation":"The watershed map and flows crossing boundaries show how activities in several places may affect the same river.","evidence":"Paragraph B: ‘the area of land from which water drained into the river’ and ‘water flowing from several directions’."},{"id":"r07q02","type":"match","prompt":"Which paragraph warns against confusing completed or planned actions with measured environmental improvement? Paragraphs may be used more than once.","choices":["Paragraph A","Paragraph B","Paragraph C","Paragraph D","Paragraph E"],"answer":3,"points":1,"explanation":"The group keeps actions and sample results separate because doing something does not by itself demonstrate its efficacy.","evidence":"Paragraph D: ‘a promised improvement was not the same as evidence that water quality had improved’."},{"id":"r07q03","type":"open","prompt":"Why does the photograph alone not prove that Northfield Farm caused the contamination? Answer in one English sentence.","points":1,"model":"It shows where dirty water was photographed, but not where the contamination began.","criteria":["Distinguishes the location of the photograph from the unknown source of the contamination."],"explanation":"A visible problem at one location is not enough to establish where it originated.","evidence":"Paragraph A: ‘where the photographer had stood ... not where the contamination had begun’."},{"id":"r07q04","type":"open","prompt":"What does the upstream sample show about the claim that the photographed field is the only source of contamination? Does that result establish that every activity on the farm is harmless? Explain both points in two concise English sentences.","points":2,"model":"The water was already contaminated when it entered the farm, so the photographed field cannot simply be assumed to be the only source. The result does not prove that all activities on the farm are harmless.","criteria":["States that contamination was present before the water entered the farm, weakening the claim that the field was the sole source.","States that the evidence does not establish that every activity on the farm is harmless."],"explanation":"The answer must respect both the information the samples provide and the limit the officer states.","evidence":"Paragraph C: ‘already showed contamination’ and ‘did not prove that every activity on the farm was harmless’."},{"id":"r07q05","type":"open","prompt":"How did the focus of residents’ questions change at the meeting? Answer in one English sentence.","points":1,"model":"They moved from asking who seemed guilty to asking which further checks would be carried out.","criteria":["Contrasts the earlier focus on blame with the later focus on further investigation."],"explanation":"The map encourages residents to investigate the system instead of relying on the impression created by one photograph.","evidence":"Paragraph E: ‘fewer questions about who looked guilty and more about which checks would come next’."},{"id":"r07q06","type":"mediation","prompt":"Eine deutschsprachige Anwohnerin hat die Versammlung verpasst und fragt, ob die Verantwortung des Bauernhofs bewiesen ist. Was ist bereits bekannt und was geschieht als Nächstes? Verfasse anhand der Absätze C und D eine kurze Nachricht auf Deutsch. Nenne das Ergebnis der Proben. Erkläre, ob damit eine alleinige Verantwortung oder die vollständige Unbedenklichkeit aller Tätigkeiten des Hofs bewiesen ist und ob weitere Prüfungen nötig sind. Nenne außerdem zwei unterschiedliche Maßnahmen.","points":4,"model":"Das Wasser war bereits verunreinigt, als es die Grenze des Bauernhofs erreichte. Daher ist nicht bewiesen, dass das fotografierte Feld die einzige Quelle ist. Das bedeutet aber auch nicht, dass alle Tätigkeiten auf dem Hof unbedenklich sind; weitere Untersuchungen sind nötig. Die Gemeinde hat ein undichtes Rohr beim Sammelplatz repariert und bessere Abdeckungen für Abfallbehälter organisiert.","criteria":["States in German that contamination was present before the river entered the farm.","Explains in German that neither sole responsibility nor complete harmlessness of the farm is proved, and further checks are needed.","Communicates in German one stated action: pipe repair, better waste-container covers, or farmers reviewing storage.","Communicates in German a second distinct stated action from the same list."],"explanation":"Useful mediation preserves the uncertainty and provides concrete next steps. It should not replace an unsupported accusation with an unsupported declaration of innocence.","evidence":"Paragraph C: ‘further checks were needed’; paragraph D: ‘repaired a leaking pipe’, ‘better covers’ and ‘review how they stored materials’."}]},{"id":"r08","title":"When the library stayed open late","source":"Original practice text — fictional scenario.","level":"Standard","minutes":17,"examOnly":false,"paragraphs":[{"label":"A","text":"Mina usually left the public library before dinner. During a spell of extreme heat, she began staying until it closed. Her family’s flat held the warmth long after sunset, and she could not concentrate on her homework there. At the library, she found older neighbours reading the newspapers and a delivery worker resting between shifts. The building had become useful in a way its borrowing figures did not show."},{"label":"B","text":"When the council discussed extending the evening opening hours, one member asked whether it was fair to spend money on people who were not borrowing books. The librarian replied that the same public building could meet more than one need. She also pointed out that residents living in hot flats had fewer choices than people with large gardens or cooler homes. Access to a comfortable space should not depend on someone’s income."},{"label":"C","text":"Longer hours would have costs. Staff needed to be paid, and the building’s old cooling system consumed energy. The council could not simply declare the service carbon-neutral because it helped residents during a heatwave. It asked an engineer to examine options for retrofitting the building and reducing energy demand. External shade and better controls were included in the proposed work."},{"label":"D","text":"Mina helped ask visitors what would make the service easier to use. Some wanted a quiet study area, while others needed seats where conversation was welcome. A neighbour said the final bus left too early for her to benefit from the later closing time. This changed the discussion: keeping a door open was not enough if people could not get home afterwards."},{"label":"E","text":"The council approved a trial with separate quiet and social areas and an adjusted evening bus service. It would review attendance, energy use and staff workload before deciding on permanent hours. Mina liked the plan because it treated the immediate need seriously while also checking what would make the service last."}],"summaryBank":["income","attendance","retrofitting","replacing","energy","books"],"questions":[{"id":"r08q01","type":"mc","prompt":"What does the first paragraph suggest about borrowing figures?","choices":["They prove the library should buy fewer books.","They show that all evening visitors are doing homework.","They do not capture every way the building benefits residents.","They are deliberately changed during hot weather."],"answer":2,"points":1,"explanation":"People use the building for study, rest and a comfortable place to spend time, even without borrowing anything.","evidence":"Paragraph A: ‘useful in a way its borrowing figures did not show’."},{"id":"r08q02","type":"mc","prompt":"Why does the neighbour’s comment about the bus matter?","choices":["It shows that access also depends on being able to travel home.","It proves that everyone prefers to leave the library early.","It means the library should replace its quiet study area.","It removes the need to examine the building’s energy use."],"answer":0,"points":1,"explanation":"An opening-time change does not help someone who cannot make the return journey. Transport is part of effective access.","evidence":"Paragraph D: ‘keeping a door open was not enough if people could not get home afterwards’."},{"id":"r08q03","type":"text","prompt":"Complete the summary with one word from the text: The librarian argues that access to a comfortable public space should not depend on a resident’s {gap}.","answer":["income"],"points":1,"explanation":"Her argument concerns equitable access, since residents differ in the alternatives they can afford.","evidence":"Paragraph B: ‘should not depend on someone’s income’."},{"id":"r08q04","type":"text","prompt":"Complete the summary with one word from the text: The engineer is asked to consider {gap} the existing building to reduce its energy demand.","answer":["retrofitting"],"points":1,"explanation":"The proposed work improves an existing building, rather than automatically replacing it.","evidence":"Paragraph C: ‘options for retrofitting the building and reducing energy demand’."},{"id":"r08q05","type":"open","prompt":"Why would it be misleading to call the service carbon-neutral simply because it helps during a heatwave? Explain the difference between the benefit to residents and a claim about net carbon emissions, then identify the specific energy-use concern described in the passage. Answer in one or two English sentences.","points":2,"model":"Helping residents is a social benefit, but it does not by itself show that the service causes no net carbon emissions. The old cooling system still consumes energy, so its environmental impact needs to be examined.","criteria":["Distinguishes the benefit to residents from evidence about net carbon emissions.","Mentions the cooling system’s energy use or the need to examine and reduce that demand."],"explanation":"The passage separates a helpful response to heat from a claim about the service’s carbon footprint.","evidence":"Paragraph C: ‘the building’s old cooling system consumed energy’ and ‘could not simply declare the service carbon-neutral’."},{"id":"r08q06","type":"open","prompt":"Name two different measures the council will review before making the opening hours permanent. Answer in English.","points":2,"model":"It will review attendance and energy use.","criteria":["Identifies one of attendance, energy use or staff workload.","Identifies a second, different measure from attendance, energy use or staff workload."],"explanation":"The decision will consider use of the service alongside its resource and staffing demands. Any two of attendance, energy use and staff workload are acceptable.","evidence":"Paragraph E: ‘review attendance, energy use and staff workload’."}]},{"id":"r09","title":"A shelf full of things to borrow","source":"Original practice text — fictional scenario.","level":"Standard","minutes":17,"examOnly":false,"paragraphs":[{"label":"A","text":"The first object in the neighbourhood lending cupboard was a drill. Its owner, Jo, had used it to put up shelves and then left it untouched for months. She wondered why every household needed to buy an object that was useful only occasionally. Soon the cupboard also held a ladder, garden tools and a strong box for moving books. Members could reserve an item and return it after use."},{"label":"B","text":"At first, the group accepted every donation. This made the cupboard look successful, but it also filled the shelves with objects nobody requested. Several were damaged or missing essential parts. The organisers changed their approach. Before accepting an item, they checked whether members needed it and whether it was durable enough to be shared. A large collection was no longer their main goal."},{"label":"C","text":"Booking created another problem. People sometimes reserved the same tool for the same weekend, while returned items needed checking before the next loan. The group introduced a waiting list and left time for inspection between bookings. Jo took responsibility for recording faults. Sharing depended on maintenance and clear information, not just on people being willing to lend their possessions."},{"label":"D","text":"The cupboard was initially open on weekday mornings, when many members were at work. Evening opening helped, but residents at the far end of the village still found collection difficult. The group arranged a second collection point at the community centre. It asked members to combine collection with a journey they were already making where possible, because extra car trips could add to the activity’s carbon footprint."},{"label":"E","text":"For its review, the group asked whether a loan had replaced a planned purchase. It also recorded repairs and items that were rarely borrowed. These answers were more useful than simply counting members. Some borrowers had avoided buying a new tool; others had tried an activity they would otherwise have skipped. Both outcomes mattered, but they were not the same evidence of reduced consumption."}],"summaryBank":["maintenance","donations","members","consumption","production","inspection"],"questions":[{"id":"r09q01","type":"match","prompt":"Which paragraph shows the group becoming more selective about what it accepts? Paragraphs may be used more than once.","choices":["Paragraph A","Paragraph B","Paragraph C","Paragraph D","Paragraph E"],"answer":1,"points":1,"explanation":"The group moves from accepting all donations to checking need, condition and durability.","evidence":"Paragraph B: ‘Before accepting an item, they checked whether members needed it’."},{"id":"r09q02","type":"match","prompt":"Which paragraph distinguishes an avoided purchase from a new opportunity to try something? Paragraphs may be used more than once.","choices":["Paragraph A","Paragraph B","Paragraph C","Paragraph D","Paragraph E"],"answer":4,"points":1,"explanation":"The review recognises two different outcomes and avoids treating every loan as proof that a purchase was prevented.","evidence":"Paragraph E: ‘avoided buying a new tool’ and ‘tried an activity they would otherwise have skipped’."},{"id":"r09q03","type":"text","prompt":"Complete the summary with the word paired with “clear information” in paragraph C: Reliable sharing requires {gap} and clear information, rather than goodwill alone.","answer":["maintenance"],"points":1,"explanation":"Checks, fault records and time between loans keep the shared objects ready for use.","evidence":"Paragraph C: ‘Sharing depended on maintenance and clear information’."},{"id":"r09q04","type":"text","prompt":"Complete the summary with one word from the text: Asking whether a loan replaced a purchase helps assess reduced {gap}.","answer":["consumption"],"points":1,"explanation":"An avoided purchase provides more direct evidence about buying less than a membership total does.","evidence":"Paragraph E: ‘a loan had replaced a planned purchase’ and ‘evidence of reduced consumption’."},{"id":"r09q05","type":"open","prompt":"Using paragraph D, explain how the group addressed one access difficulty caused by opening times and one caused by distance. Answer in one or two English sentences.","points":2,"model":"It added evening opening for people who worked during the day. It also set up a second collection point for residents living far from the original cupboard.","criteria":["Links evening opening to members who cannot attend on weekday mornings.","Links the second collection point to residents who live farther away."],"explanation":"The two changes address time and distance. Naming the changes without connecting them to the difficulties is less complete.","evidence":"Paragraph D: ‘Evening opening helped’ and ‘a second collection point at the community centre’."},{"id":"r09q06","type":"open","prompt":"Why does the group encourage members to combine collection with an existing journey? Answer in one English sentence.","points":1,"model":"It wants to avoid extra car journeys that could increase the lending activity’s carbon footprint.","criteria":["Connects combining journeys with avoiding additional car travel and its carbon footprint."],"explanation":"Borrowing may reduce purchases, but the group also considers the resources used to run the service.","evidence":"Paragraph D: ‘extra car trips could add to the activity’s carbon footprint’."}]},{"id":"r10","title":"The road above the front doors","source":"Original practice text — fictional scenario.","level":"Challenge","minutes":24,"examOnly":false,"paragraphs":[{"label":"A","text":"At the Harbour Ward meeting, the council displayed a picture of a dry road beside a flooded one. Raising the road seemed an obvious improvement. Buses could continue running, and deliveries could reach the shops after high water. Rina, who lived in a flat behind those shops, almost put up her hand in support. Then she noticed that the picture ended at the pavement. Her front door was outside its frame."},{"label":"B","text":"An engineer explained that raising the road alone would not remove the water. The drainage plan had to show where it would go. In an early version, a channel could divert water towards the lower courtyards behind the shops. Rina asked whether a dry bus route would count as success if the homes beside it became more vulnerable. The engineer agreed that the whole area had to be assessed, including places less visible to passing visitors."},{"label":"C","text":"Another resident, Mr Alves, raised a different concern. His landlord supported improvements but had already mentioned higher rents to help pay for them. Mr Alves feared that a scheme intended to protect the neighbourhood might displace the people who lived there. He did not oppose safer buildings. He wanted the council to explain how existing tenants would be able to remain in them, rather than discussing property values as if they were everyone’s main concern."},{"label":"D","text":"Shop owner Nessa reminded the meeting that delays also had consequences. Each closure interrupted her livelihood, and customers without cars struggled to find another shop. She asked for measures that could work during the coming season. Rina agreed. Her objection was to an incomplete plan, not to action itself. The two residents suggested improving the existing drainage while the larger design was checked, with a temporary safe route when water made the road unusable."},{"label":"E","text":"The council decided to repair blocked drains and prepare that temporary route first. It also added support for existing tenants to the longer plan, including work on keeping improved rental homes affordable. The road design would be reconsidered with maps of the courtyards included. These choices could mitigate immediate difficulties, but nobody promised that they would remove every future risk. More extensive changes might still be needed as conditions developed."},{"label":"F","text":"Before leaving, Rina asked how the plan would be reviewed. The answer now included reports from tenants and shop workers, records of water entering homes, and whether buses could operate. This was a broader test than the original picture had suggested. Rina left without a simple promise that her street would stay dry forever. She did have a clearer account of whose experiences would shape the next decision."}],"questions":[{"id":"r10q01","type":"match","prompt":"Which paragraph warns that environmental improvements could make existing residents unable to afford their homes? Paragraphs may be used more than once.","choices":["Paragraph A","Paragraph B","Paragraph C","Paragraph D","Paragraph E","Paragraph F"],"answer":2,"points":1,"explanation":"Mr Alves links the improvements to possible rent rises and displacement. This is distinct from the physical flood risk discussed in paragraph B.","evidence":"Paragraph C: ‘higher rents to help pay for them’ and ‘might displace the people who lived there’."},{"id":"r10q02","type":"match","prompt":"Which paragraph shows a resident supporting immediate action while still challenging the larger proposal? Paragraphs may be used more than once.","choices":["Paragraph A","Paragraph B","Paragraph C","Paragraph D","Paragraph E","Paragraph F"],"answer":3,"points":1,"explanation":"Rina accepts the need for action but wants the incomplete plan improved. She and Nessa propose work that can begin while the design is checked.","evidence":"Paragraph D: ‘Her objection was to an incomplete plan, not to action itself’."},{"id":"r10q03","type":"mc","prompt":"What is the significance of Rina’s front door being outside the picture?","choices":["Her flat is too far from the road to be affected.","The picture leaves out people whose risks could be changed by the scheme.","The council has already decided to demolish the building.","Only homes directly on the pavement may take part in the meeting."],"answer":1,"points":1,"explanation":"The missing door introduces the broader problem: a proposal can look successful if its effects on less visible residents are excluded.","evidence":"Paragraph A: ‘Her front door was outside its frame’; paragraph B: ‘including places less visible to passing visitors’."},{"id":"r10q04","type":"mc","prompt":"Which claim about the revised plan is supported?","choices":["It guarantees permanent protection from every future flood.","It removes the need to change the road design.","It deals only with tenants and no longer considers buses.","It combines immediate measures with a broader review of future changes."],"answer":3,"points":1,"explanation":"Repairs and a temporary route come first, while a revised design and wider evaluation continue. The text explicitly avoids a guarantee.","evidence":"Paragraph E: ‘repair blocked drains ... first’ and ‘The road design would be reconsidered’."},{"id":"r10q05","type":"open","prompt":"Explain how a measure that helps road users could worsen conditions for nearby residents. Answer in one or two English sentences.","points":2,"model":"Raising the road could keep buses and deliveries moving. However, an unsuitable drainage channel could divert the water into lower courtyards and increase the risk to nearby homes.","criteria":["Identifies improved road access for buses, deliveries or road users.","Explains that diverted water could increase flooding or vulnerability in the lower courtyards."],"explanation":"The causal link is the direction of the water after the road is raised. The problem is not that improved access is itself undesirable.","evidence":"Paragraph A: ‘Buses could continue running’; paragraph B: ‘divert water towards the lower courtyards’."},{"id":"r10q06","type":"open","prompt":"Whose experiences will the final review include, and what physical effect away from the road will it record? Answer in one or two English sentences.","points":2,"model":"It includes reports from tenants and shop workers. It also records whether water enters people’s homes.","criteria":["Identifies the inclusion of tenants’ or shop workers’ experiences.","Identifies records of water entering homes, beyond conditions on the road itself."],"explanation":"The revision expands whose experience counts and what physical effects are measured.","evidence":"Paragraph F: ‘reports from tenants and shop workers’ and ‘records of water entering homes’."},{"id":"r10q07","type":"mediation","prompt":"Deine deutschsprachigen Nachbarn konnten nicht an der Versammlung teilnehmen. Was wurde beschlossen und wie geht es weiter? Verfasse anhand der Absätze E und F eine kurze Nachricht auf Deutsch. Erkläre die unmittelbaren Arbeiten, die Unterstützung für bisherige Mieter und die verbleibende Unsicherheit. Beschreibe außerdem die geplante Überprüfung: Wessen Erfahrungen sollen einfließen, und welche konkrete Auswirkung soll beobachtet werden?","points":4,"model":"Zunächst will die Gemeinde verstopfte Abflüsse reparieren und einen vorübergehenden sicheren Weg vorbereiten. Im längerfristigen Plan soll außerdem berücksichtigt werden, dass die bisherigen Mieterinnen und Mieter ihre verbesserten Wohnungen weiterhin bezahlen können. Diese Schritte sollen die aktuellen Schwierigkeiten mildern, bieten aber keinen vollständigen Schutz vor allen künftigen Risiken. Bei der Überprüfung sollen Erfahrungen von Mietern und Beschäftigten in den Geschäften, Wasser in Wohnungen und der Busbetrieb berücksichtigt werden.","criteria":["Communicates in German both the blocked-drain repairs and the temporary route.","Explains in German the aim of keeping improved rental homes affordable for existing tenants.","States in German that the measures cannot guarantee removal of all future risk.","Explains in German that evaluation includes residents’ or workers’ reports and a concrete measure such as water entering homes or bus operation."],"explanation":"The update should help neighbours understand the decision and its limits without recounting every speech at the meeting.","evidence":"Paragraph E: ‘keeping improved rental homes affordable’ and ‘nobody promised’; paragraph F: ‘reports from tenants and shop workers’."}]},{"id":"r11","title":"The museum of things still in use","source":"Original practice text — fictional scenario.","level":"Challenge","minutes":25,"examOnly":false,"paragraphs":[{"label":"A","text":"I expected the exhibition about consumption to begin with a mountain of rubbish. Instead, the first object was a school bag with carefully repaired straps. Its owner had lent it to the museum for the afternoon and needed it back before Monday. Beside it stood a kitchen chair with one replaced leg. These ordinary objects did not look like treasures. That, the opening sign suggested, was partly the point."},{"label":"B","text":"The curator explained that an earlier version of the exhibition had opened with enormous images of waste and a wall of alarming figures. Visitors often became quiet and then walked past the section about possible responses. In their comments, some described a feeling of numbness. The scale made their own actions seem too small to matter. The museum had wanted to communicate urgency, but its presentation had sometimes made participation feel pointless."},{"label":"C","text":"The revised display began with individual objects and the people who kept them useful. A short film followed the repair of the bag, including the difficulty of finding strong replacement straps. The curator used the word efficacy: the ability of an action to produce its intended result. Visitors could see what had changed and why. The museum still explained the wider problem, but now placed it beside examples of action with visible outcomes."},{"label":"D","text":"One display explored a paradox of durability. A bag designed for repeated use benefited from strong material, while durable packaging became a problem when it was discarded after a brief journey. The question was not simply whether a material lasted. It was whether its useful life matched its lasting presence. A product intended for moments of convenience could leave a burden that someone else had to manage long afterwards."},{"label":"E","text":"The exhibition also challenged an easy conclusion: that every difficulty could be solved by a more determined individual shopper. The chair’s owner had found a replacement part only because a local workshop kept standard pieces. Another product could not be repaired because its parts were unavailable. Visitors were asked to consider how product design, repair services and purchasing decisions by large organisations could support a circular economy. Personal effort needed conditions in which it could succeed."},{"label":"F","text":"Before leaving, I reached for a brochure advertising a new range of ‘better’ household goods. Then I looked again at the borrowed school bag. The exhibition had not supplied a shopping list that would settle every environmental question. It had made me more curious about what I already owned, what could remain useful, and who could help make repair possible. The familiar chair suddenly seemed a more interesting object than the glossy catalogue."}],"summaryBank":["numbness","urgency","efficacy","consumption","durability","convenience"],"questions":[{"id":"r11q01","type":"mc","prompt":"Why does the new exhibition begin with a repaired school bag?","choices":["It offers a concrete example of an object kept useful through action.","It proves that school bags create more waste than other objects.","It allows the museum to avoid discussing the wider problem.","It shows that old objects belong in museums instead of everyday life."],"answer":0,"points":1,"explanation":"The bag demonstrates an observable result and remains in use. The wider problem is still covered, so the display is a new entry point rather than an omission.","evidence":"Paragraph A: ‘needed it back before Monday’; paragraph C: ‘action with visible outcomes’."},{"id":"r11q02","type":"mc","prompt":"Which interpretation of the ending is best supported?","choices":["The narrator has decided that all new products are equally harmful.","The narrator wants the museum to sell the displayed furniture.","The narrator is questioning the assumption that an environmental response must begin with another purchase.","The narrator believes that glossy catalogues should replace repair advice."],"answer":2,"points":1,"explanation":"The narrator turns from a catalogue of new goods towards questions about existing possessions and the conditions that support repair.","evidence":"Paragraph F: ‘more curious about what I already owned, what could remain useful’."},{"id":"r11q03","type":"text","prompt":"Complete the summary with one word from the text: Some visitors reacted to the original display’s overwhelming scale with a feeling of {gap}.","answer":["numbness"],"points":1,"explanation":"The reaction was reduced emotional engagement and a sense that action was pointless, rather than a lack of awareness that waste existed.","evidence":"Paragraph B: ‘some described a feeling of numbness’."},{"id":"r11q04","type":"text","prompt":"Complete the summary with one word from the text: The curator uses the term {gap} for an action’s ability to produce its intended result.","answer":["efficacy"],"points":1,"explanation":"The repaired objects make this idea visible: visitors can understand both the action and its outcome.","evidence":"Paragraph C: ‘efficacy: the ability of an action to produce its intended result’."},{"id":"r11q05","type":"open","prompt":"Explain the paradox of durability using the two examples in paragraph D. Answer in two concise English sentences.","points":2,"model":"Durable material helps a bag remain useful through repeated use. The same lasting quality can be a problem in packaging that is discarded after only a short useful life.","criteria":["Explains that strength or durability benefits a product intended for repeated use, such as the bag.","Explains the mismatch between a short use and a long-lasting material in discarded packaging."],"explanation":"The contrast concerns useful life and lasting presence, not a rule that durability is always good or always bad.","evidence":"Paragraph D: ‘benefited from strong material’ and ‘durable packaging became a problem when it was discarded’."},{"id":"r11q06","type":"open","prompt":"Using paragraph E, identify the specific problem with replacement parts that an individual shopper could not solve. Then name one different condition that can support successful repair. Answer in two concise English sentences.","points":2,"model":"One product could not be repaired because replacement parts were unavailable. Accessible repair services are another condition that helps personal effort succeed.","criteria":["Mentions unavailable replacement parts as a limit on what an individual can do.","Identifies a different supporting condition: repair-friendly product design, access to repair services, or large organisations’ purchasing decisions. Do not award this point again for replacement-part availability alone."],"explanation":"The answer needs the specific supply problem and a separate condition that helps people act. The same point about replacement parts cannot earn both marks.","evidence":"Paragraph E: ‘its parts were unavailable’ and ‘product design, repair services and purchasing decisions by large organisations’."},{"id":"r11q07","type":"mediation","prompt":"Deine deutschsprachige Klasse plant eine Ausstellung über Abfall. Was kann sie aus der Überarbeitung der beschriebenen Ausstellung lernen? Verfasse anhand der Absätze B und C eine kurze Empfehlung auf Deutsch. Beschreibe vier Aspekte: die Reaktion der Besucher auf die erste Fassung, ihr Verhalten beim Bereich über mögliche Maßnahmen, den neuen Einstieg mit sichtbaren Ergebnissen und die Rolle des größeren Umweltproblems in der überarbeiteten Fassung.","points":4,"model":"Beginnt nicht nur mit überwältigenden Müllbildern und riesigen Zahlen. In der beschriebenen Ausstellung fühlten sich manche Besucher dadurch abgestumpft und hielten ihre eigenen Handlungsmöglichkeiten für zu gering. Viele gingen deshalb am Bereich über mögliche Antworten vorbei. Die neue Fassung zeigte zuerst einzelne weiterbenutzte Gegenstände und die Menschen, die sie reparierten. So wurden konkrete Ergebnisse sichtbar. Das größere Umweltproblem blieb Teil der Ausstellung, wurde aber mit nachvollziehbaren Handlungsmöglichkeiten verbunden.","criteria":["Explains in German that the scale of the original images and figures caused numbness or made personal action seem pointless.","Communicates in German the observed consequence that visitors passed the section on possible responses.","Describes in German the revised focus on individual objects or people and visible repair outcomes.","States in German that the wider problem was still explained alongside these actionable examples."],"explanation":"The recommendation selects the lesson relevant to classmates designing a display. It should not claim that the museum removed all information about large environmental problems.","evidence":"Paragraph B: ‘walked past the section about possible responses’; paragraph C: ‘still explained the wider problem’ and ‘visible outcomes’."}]},{"id":"r12","title":"A wet week after a dry summer","source":"Original practice text — fictional scenario.","level":"Challenge","minutes":24,"examOnly":false,"paragraphs":[{"label":"A","text":"For most of the summer, the farmers around Willow Vale had worried about drought. Then a week of heavy precipitation flooded the road beside the vegetable fields. At a meeting, someone asked how a place could suffer from too little water and then too much. The water officer replied that the timing and location of water mattered, as well as the total amount. Rain arriving suddenly did not automatically remain available for the next dry period."},{"label":"B","text":"Farmer Bea wanted more storage tanks. She had relied heavily on a well during the dry months and was concerned about further groundwater depletion. A tank could hold some water when rain returned. The village caretaker agreed that storage might help, but asked the council to examine its leaking pipes too. Building new capacity while allowing stored water to escape through damaged infrastructure seemed a poor use of the limited funds."},{"label":"C","text":"An engineer explained that different tanks would serve different purposes. Water collected from the school roof could be used in its garden. Water from a proposed site near the old waste yard would need checks for contamination before any use was planned. Covers could reduce evaporation from stored water, but they would not remove pollution already present. On the planning map, two equally large spaces did not necessarily offer equally useful solutions."},{"label":"D","text":"A nature group proposed restoring a wet meadow beside the river. Its plan aimed to buffer high water by giving it more space away from buildings. Bea supported investigating the idea but asked about the field that would no longer be used for crops. Protecting the village should not mean ignoring a farmer’s livelihood. The group suggested beginning on less productive ground and discussing support with the affected landowner."},{"label":"E","text":"The council allocated money to pipe repairs, a school tank and a small meadow trial. Each measure had a named person responsible for maintenance and observation. The river team would record when water crossed an agreed threshold, meaning the level at which a further review was required. If the meadow did not perform as expected, the plan would be adjusted. Approval was the beginning of a test, rather than proof that the test had succeeded."},{"label":"F","text":"Writing about the meeting afterwards, student reporter Leon resisted the headline ‘Flood problem solved’. The measures could mitigate particular problems, but their value depended on maintenance, future conditions and evidence from the trial. He also avoided promising that one wet week had ended every water shortage. His report explained what each measure was intended to do and what it could not yet guarantee. It was a less dramatic story, but one the village could use when reviewing its next decision."}],"questions":[{"id":"r12q01","type":"match","prompt":"Which paragraph questions investment in extra capacity while existing resources are being lost? Paragraphs may be used more than once.","choices":["Paragraph A","Paragraph B","Paragraph C","Paragraph D","Paragraph E","Paragraph F"],"answer":1,"points":1,"explanation":"The caretaker points out that leaking infrastructure can undermine the benefit of adding storage.","evidence":"Paragraph B: ‘Building new capacity while allowing stored water to escape’."},{"id":"r12q02","type":"match","prompt":"Which paragraph argues that a nature-based proposal must also account for someone’s income? Paragraphs may be used more than once.","choices":["Paragraph A","Paragraph B","Paragraph C","Paragraph D","Paragraph E","Paragraph F"],"answer":3,"points":1,"explanation":"The meadow could occupy land used for crops, so the discussion includes a farmer’s livelihood and support for the landowner.","evidence":"Paragraph D: ‘Protecting the village should not mean ignoring a farmer’s livelihood’."},{"id":"r12q03","type":"text","prompt":"Complete the summary with one word from the text: Bea’s heavy reliance on a well made her concerned about further groundwater {gap}.","answer":["depletion"],"points":1,"explanation":"Depletion refers to a resource being reduced through use, here the groundwater drawn from the well.","evidence":"Paragraph B: ‘concerned about further groundwater depletion’."},{"id":"r12q04","type":"text","prompt":"Complete the summary with one word from the text: Tank covers can reduce {gap}, but cannot remove pollution already in the water.","answer":["evaporation"],"points":1,"explanation":"The passage distinguishes conserving stored water from treating contaminated water.","evidence":"Paragraph C: ‘Covers could reduce evaporation ... but they would not remove pollution’."},{"id":"r12q05","type":"text","prompt":"Complete the summary with one word from the text: A further review is required when river water crosses the agreed {gap}.","answer":["threshold"],"points":1,"explanation":"Here the threshold is a specified water level that triggers reassessment. The student need not know a numerical level.","evidence":"Paragraph E: ‘an agreed threshold, meaning the level at which a further review was required’."},{"id":"r12q06","type":"open","prompt":"Why can the timing or location of water matter, and why is a sudden downpour not the same as a usable water supply for the next dry period? Explain both points in one or two English sentences.","points":2,"model":"Water must be available in the right place and at the time it is needed. Rain that arrives suddenly may flow away instead of remaining available for the next dry period.","criteria":["Identifies the importance of timing or location, beyond the total rainfall.","Explains that sudden rainfall is not automatically retained or available for later dry conditions."],"explanation":"The officer’s explanation separates rainfall occurring from a reliable usable water supply.","evidence":"Paragraph A: ‘timing and location of water mattered’ and ‘did not automatically remain available’."},{"id":"r12q07","type":"open","prompt":"Why does Leon reject the headline ‘Flood problem solved’? Explain what remains to be established through the trial, then name one separate ongoing condition affecting the measures’ usefulness. Use the final two paragraphs and answer in two concise English sentences.","points":2,"model":"The trial still has to show whether the measures work as expected and may lead to adjustments. Their continued usefulness also depends on maintenance.","criteria":["Explains that the trial still needs observation or evidence to establish whether the measures work, or may lead to adjustment.","Identifies a separate ongoing condition: maintenance or future conditions such as weather. Do not award this point again for trial evidence or the mere absence of a guarantee."],"explanation":"The answer needs both an unresolved question for the trial and a distinct continuing condition, such as maintenance or future weather. Approval alone demonstrates neither.","evidence":"Paragraph E: ‘Approval was the beginning of a test’; paragraph F: ‘depended on maintenance, future conditions and evidence’."}]},{"id":"r13","title":"Market day on higher ground","source":"Original practice text — fictional scenario. Reserved for mock exam 1.","level":"Challenge","minutes":25,"examOnly":true,"paragraphs":[{"label":"A","text":"The Saturday market at Tern Harbour had always stood near the water. Recently, repeated flooding in this fictional town had damaged stalls and interrupted trade. Sellers wanted a reliable place to work, while residents wanted to keep a market they could reach easily. Moving to higher ground sounded sensible. Yet the first proposal showed how a shared aim could produce disagreement once people examined the details."},{"label":"B","text":"A developer offered a site beside a large car park outside town. The drawings showed new stalls made with materials advertised as environmentally friendly. The site was higher than the harbour and had space for delivery vehicles. However, it was far from the bus route. The proposal said little about how customers without cars would get there or how extra journeys might affect the market’s carbon footprint."},{"label":"C","text":"Baker Hana explained why this mattered to her livelihood. Some of her regular customers walked from nearby flats and bought only what they could carry. A move to the edge of town might protect her stall while separating it from those customers. She accepted the need to leave the lowest ground. What she challenged was the assumption that any dry site would be an equally useful site."},{"label":"D","text":"Meanwhile, carpenter Louis examined the existing stalls. Several damaged sections needed replacing, but much of the timber remained durable. He proposed repairing the stalls and making them easier to take apart and move. Buying an entirely new set would discard useful material. He asked the committee to compare what could be kept in use before choosing a new product simply because its advertisement carried a green message."},{"label":"E","text":"The school then offered its higher yard for a trial. A bus stop and several residential streets were nearby. The offer came with a condition: the yard had to be clear before lessons resumed. The school’s garden club also asked that the neighbouring wildlife patch remain untouched. Unlike the permanent site outside town, this option would require the market to be assembled and removed around the school’s timetable."},{"label":"F","text":"The committee combined the school’s offer with Louis’s repair plan. It arranged shared storage for the stalls and paid for damaged parts to be replaced. Pitch charges would remain affordable so that small traders could join the trial. Volunteers would help explain the new route, but moving and checking the stalls would be paid work; the plan needed reliable responsibility as well as goodwill."},{"label":"G","text":"After the first market, the committee resisted declaring a complete success based only on a busy yard. It would review how customers travelled, whether traders could earn a livelihood, and how well the repaired stalls survived repeated use. The trial had created a promising alternative. Evidence across different weather conditions would still be needed before the committee could judge whether it was a lasting response."}],"questions":[{"id":"r13q01","type":"match","prompt":"Which paragraph proposes retaining useful materials instead of replacing every stall? Paragraphs may be used more than once.","choices":["Paragraph A","Paragraph B","Paragraph C","Paragraph D","Paragraph E","Paragraph F","Paragraph G"],"answer":3,"points":1,"explanation":"Louis distinguishes damaged sections from timber that remains usable and proposes repair before wholesale replacement.","evidence":"Paragraph D: ‘much of the timber remained durable’ and ‘repairing the stalls’."},{"id":"r13q02","type":"match","prompt":"Which paragraph introduces a site that can be used only around another institution’s schedule? Paragraphs may be used more than once.","choices":["Paragraph A","Paragraph B","Paragraph C","Paragraph D","Paragraph E","Paragraph F","Paragraph G"],"answer":4,"points":1,"explanation":"The school yard must be cleared before lessons, so the market cannot occupy it permanently.","evidence":"Paragraph E: ‘the yard had to be clear before lessons resumed’."},{"id":"r13q03","type":"match","prompt":"Which paragraph describes a financial arrangement intended to include small traders? Paragraphs may be used more than once.","choices":["Paragraph A","Paragraph B","Paragraph C","Paragraph D","Paragraph E","Paragraph F","Paragraph G"],"answer":5,"points":1,"explanation":"Keeping pitch charges affordable directly addresses whether small traders can participate. Hana’s earlier concern describes customers and livelihood but not this arrangement.","evidence":"Paragraph F: ‘Pitch charges would remain affordable so that small traders could join’."},{"id":"r13q04","type":"match","prompt":"Which paragraph explains why a high attendance alone cannot establish lasting success? Paragraphs may be used more than once.","choices":["Paragraph A","Paragraph B","Paragraph C","Paragraph D","Paragraph E","Paragraph F","Paragraph G"],"answer":6,"points":1,"explanation":"The committee identifies travel, livelihoods, durability and varied weather as further evidence needed beyond a busy opening day.","evidence":"Paragraph G: ‘resisted declaring a complete success based only on a busy yard’."},{"id":"r13q05","type":"mc","prompt":"Which statement best describes Hana’s attitude to relocation?","choices":["She accepts moving away from flood risk but wants customer access considered.","She thinks the market must stay beside the water under all conditions.","She supports any site with space for delivery vehicles.","She believes traders’ livelihoods depend only on keeping stalls dry."],"answer":0,"points":1,"explanation":"Hana supports the purpose of relocation while questioning whether the proposed site will serve the people who use the market.","evidence":"Paragraph C: ‘accepted the need to leave the lowest ground’ and ‘any dry site would be an equally useful site’."},{"id":"r13q06","type":"mc","prompt":"Which environmental issue is insufficiently addressed in the developer’s proposal?","choices":["Whether the site has space for delivery vehicles.","Whether the proposed stalls use materials advertised as environmentally friendly.","How additional customer journeys could affect the carbon footprint.","Whether the new site lies higher than the harbour."],"answer":2,"points":1,"explanation":"The plan promotes the stall materials but does not adequately account for travel caused by the site’s distance from public transport.","evidence":"Paragraph B: ‘how extra journeys might affect the market’s carbon footprint’."},{"id":"r13q07","type":"mc","prompt":"Why does the committee pay for moving and checking the stalls?","choices":["To replace all volunteer involvement in running the trial.","To give essential repeated tasks dependable responsibility.","To let traders avoid storing any stalls between markets.","To make another review of the repaired stalls unnecessary."],"answer":1,"points":1,"explanation":"The plan still uses volunteers for communication, but it treats essential repeated work as something requiring reliable organisation.","evidence":"Paragraph F: ‘the plan needed reliable responsibility as well as goodwill’."},{"id":"r13q08","type":"mc","prompt":"What is the main message of the passage?","choices":["The newest products always provide the most effective environmental response.","Protecting a market from floods makes its effects on travel irrelevant.","Community trials are useful only when every participant agrees in advance.","A useful response considers flood risk, access, livelihoods and material use together."],"answer":3,"points":1,"explanation":"The revised plan develops by combining these needs. The ending stresses continuing evaluation rather than claiming that one feature guarantees success.","evidence":"Paragraphs C–G: ‘those customers’, ‘timber remained durable’, ‘small traders’ and ‘different weather conditions’."}]},{"id":"r14","title":"The woodland at the edge of the plan","source":"Original practice text — fictional scenario. Reserved for mock exam 2.","level":"Challenge","minutes":26,"examOnly":true,"paragraphs":[{"label":"A","text":"A housing proposal for the old delivery depot in Linden End looked straightforward on the first map. Homes would replace unused buildings, and a new access road would cross a narrow woodland beside them. The trees occupied only a thin green strip on the drawing. For residents studying the plan at the community hall, it was easy to focus on the buildings and overlook what that strip contained."},{"label":"B","text":"A school nature group had been observing the woodland through the seasons. Students showed photographs of nesting places, fallen branches sheltering insects and a shaded route connecting the trees with a larger green area. Cutting the strip would cause habitat loss. Planting replacement trees elsewhere might have benefits, but it would not immediately provide all the same spaces. Counting trees alone would miss how different parts of the habitat worked together."},{"label":"C","text":"An engineer added a question about water. The access road could interrupt an existing drainage route. One suggestion was to divert the flow into a ditch beside nearby houses. Before supporting this, residents wanted to know whether the ditch could cope during heavy precipitation. The engineer asked for further investigation. A change intended to improve access to new homes should not quietly transfer a water problem to people already living next door."},{"label":"D","text":"Keeping the woodland would also require changes to the transport plan. A narrower road offered less space for parking. Some residents welcomed that; others pointed out that bus services ended early. They argued that a plan would not be equitable if it reduced parking while leaving people with no practical alternative. The discussion moved towards improving the evening bus connection and ensuring that essential vehicle access could still be provided."},{"label":"E","text":"The council allocated funds for a wildlife survey and a comparison of possible drainage routes. It asked the designers to show a version that retained the woodland connection. The survey would assess biodiversity, including the variety of plants and animals using the site, rather than simply produce a total number of trees. Students would contribute their observations, while specialists would examine questions that the school group’s records could not answer alone."},{"label":"F","text":"At the next meeting, the council had not yet chosen a final route. The students were pleased that their observations had changed the questions being asked, but their teacher warned them against claiming that every species was now protected. Surveys could improve the decision without predicting every future change. The aim was to make the consequences visible before committing to a design. New housing, existing residents and the woodland all belonged in that decision, even if they could not all be represented by a single green line."}],"questions":[{"id":"r14q01","type":"text","prompt":"Complete the summary with a two-word phrase from the text: Cutting through the woodland would cause {gap}, removing part of the natural home of its wildlife.","answer":["habitat loss"],"points":1,"explanation":"The students identify the loss of living spaces and connections, not merely a change in the number of trees.","evidence":"Paragraph B: ‘Cutting the strip would cause habitat loss’."},{"id":"r14q02","type":"text","prompt":"Complete the summary with one word from the text: One proposal would {gap} the water into a ditch beside existing homes.","answer":["divert"],"points":1,"explanation":"The proposed route would change the direction of water, which is why residents ask whether the ditch can cope.","evidence":"Paragraph C: ‘divert the flow into a ditch beside nearby houses’."},{"id":"r14q03","type":"text","prompt":"Complete the summary with one word from the text: Residents argued that reduced parking without practical alternatives would make the plan less {gap}.","answer":["equitable"],"points":1,"explanation":"The concern is fairness for people who cannot use the limited bus service, rather than an unconditional demand for more parking.","evidence":"Paragraph D: ‘a plan would not be equitable if it reduced parking while leaving people with no practical alternative’."},{"id":"r14q04","type":"text","prompt":"Complete the summary with one word from the text: The council {gap} money to a wildlife survey and a comparison of drainage routes.","answer":["allocated"],"points":1,"explanation":"The council assigned resources to two investigations before choosing a final design.","evidence":"Paragraph E: ‘allocated funds for a wildlife survey and a comparison of possible drainage routes’."},{"id":"r14q05","type":"text","prompt":"Complete the summary with one word from the text: The survey will assess {gap} by examining the variety of plants and animals using the woodland.","answer":["biodiversity"],"points":1,"explanation":"The measure concerns the variety of living things, not just the quantity of one visible feature such as trees.","evidence":"Paragraph E: ‘assess biodiversity, including the variety of plants and animals’."},{"id":"r14q06","type":"open","prompt":"Explain two limitations of a replacement-tree count: one concerning how quickly existing habitat features can be replaced, and one concerning the woodland’s connection to a larger green area. Answer in two concise English sentences.","points":2,"model":"New trees would not immediately provide all the existing nesting places and shelters. A tree count would also miss the connected route between this strip and the larger green area.","criteria":["Explains that replacement trees do not immediately reproduce established nesting places, shelter or other existing habitat features.","Explains that counting trees overlooks the connected route linking the woodland strip to the larger green area."],"explanation":"The passage asks readers to look at the functions and arrangement of habitat as well as the number of trees.","evidence":"Paragraph B: ‘would not immediately provide all the same spaces’ and ‘a shaded route connecting the trees with a larger green area’."},{"id":"r14q07","type":"open","prompt":"Explain the residents’ concern about the proposed ditch and the step needed before accepting it. Answer in one or two English sentences.","points":2,"model":"They fear the diverted water could create a problem beside their existing homes during heavy rain. Further investigation is needed to check whether the ditch can cope with that flow.","criteria":["Identifies the risk of transferring a water or flooding problem to existing residents.","States that further investigation must establish whether the ditch can cope during heavy precipitation."],"explanation":"The response needs the possible consequence and the evidence required before the proposal is accepted.","evidence":"Paragraph C: ‘whether the ditch could cope during heavy precipitation’ and ‘asked for further investigation’."},{"id":"r14q08","type":"open","prompt":"What has the students’ work achieved, and what can it not guarantee? Answer in two concise English sentences.","points":2,"model":"Their observations have made the woodland’s effects part of the questions used to assess the development. They cannot guarantee that every species is protected or predict all future changes.","criteria":["States that their observations changed the planning questions or made habitat consequences visible before a decision.","States that the work cannot guarantee protection for every species or predict every future change."],"explanation":"The conclusion recognises a real influence on the process while keeping the limits of the evidence clear.","evidence":"Paragraph F: ‘changed the questions being asked’ and ‘without predicting every future change’."}]},{"id":"r15","title":"The hall with two possible futures","source":"Original practice text — fictional scenario. Reserved for mock exam 3.","level":"Challenge","minutes":27,"examOnly":true,"paragraphs":[{"label":"A","text":"Bridge School wanted to reduce its reliance on fossil fuels and improve its cold assembly hall. A sponsor offered help towards a new building with a roof designed to harness solar energy. The drawings were attractive, and the phrase ‘a clean start’ appeared on the first page. The school’s environment group welcomed investment but asked whether replacing the entire hall was the only route to improvement."},{"label":"B","text":"The group requested a comparison covering more than energy use after construction. It wanted the materials for the new hall, building work and disposal of the old structure included too. A new roof that generated electricity was a useful feature, but it could not by itself establish the footprint of the whole project. The students asked the designers to explain which activities their environmental claims covered."},{"label":"C","text":"An inspection found that the existing walls and roof were sound, although old equipment wasted energy. An engineer proposed retrofitting the hall: improving the building already there with better controls, insulation and new equipment. This would retain useful materials. It was an option worth comparing, she said, rather than a rule that every old building should always be kept regardless of its condition."},{"label":"D","text":"The decision also affected people outside the school. The hall hosted affordable evening activities, and some families had no alternative place to meet. Extensive work could interrupt those groups even if the finished building was more efficient. Parents asked for a schedule that kept part of the space available where possible, or provided a nearby temporary room. A distant replacement venue could exclude people who depended on walking or the bus."},{"label":"E","text":"The school selected a phased retrofit, subject to the final checks on cost and construction. Work would take place in separate sections. When a whole-hall closure was necessary, a room in the nearby community centre would be available at the usual affordable price. The school explained that this arrangement aimed to reduce disruption; it did not mean that every activity could continue at its normal time."},{"label":"F","text":"Solar panels remained part of the proposal. The upgraded equipment would still need electricity from the grid when the roof produced too little. For that reason, the group refused to describe the hall as carbon-neutral merely because panels were included. Reducing demand and improving the energy supply were both part of the plan. The remaining energy use also had to be acknowledged."},{"label":"G","text":"Once the work was complete, the school would compare energy use while taking account of weather and how often the hall was occupied. A lower bill after fewer opening hours would not automatically show a more efficient building. The students wanted a result that could be explained, including its limits. For them, a convincing environmental claim began with a clear account of what had actually changed."}],"questions":[{"id":"r15q01","type":"mc","prompt":"Why does the environment group ask for more than a comparison of energy use after construction?","choices":["It believes the completed hall will never use electricity.","It wants to include materials, construction and disposal in the assessment.","It wants to exclude the environmental effects of building work.","It assumes all old buildings have a smaller footprint than all new ones."],"answer":1,"points":1,"explanation":"The group seeks a broader view of the project’s impacts before accepting a claim based on one feature.","evidence":"Paragraph B: ‘the materials for the new hall, building work and disposal of the old structure’."},{"id":"r15q02","type":"mc","prompt":"What does ‘retrofitting’ mean in this passage?","choices":["Moving all activities permanently to a different town.","Removing a building so its site can be left empty.","Adding improvements and equipment to the existing building.","Keeping every part exactly as it is to avoid new materials."],"answer":2,"points":1,"explanation":"The engineer proposes changes to the existing hall, retaining its sound structure while improving performance.","evidence":"Paragraph C: ‘improving the building already there with better controls, insulation and new equipment’."},{"id":"r15q03","type":"mc","prompt":"What does the engineer’s final comment in paragraph C emphasise?","choices":["The existing building should be evaluated as an option in its particular condition.","Every old building must be retained regardless of safety or usefulness.","The inspection has made comparison with other options unnecessary.","Keeping old materials means that no new equipment can be installed."],"answer":0,"points":1,"explanation":"She avoids turning a case-specific finding into an absolute rule. The structure’s sound condition is relevant to this option.","evidence":"Paragraph C: ‘an option worth comparing’ and ‘rather than a rule that every old building should always be kept’."},{"id":"r15q04","type":"mc","prompt":"Which statement about the solar panels is supported?","choices":["They make all other energy-saving work unnecessary.","They ensure that the hall never draws power from the grid.","Their presence alone proves the entire project is carbon-neutral.","They are part of an improvement plan that still has remaining energy demand."],"answer":3,"points":1,"explanation":"The hall will still need grid electricity when roof production is insufficient. The group therefore qualifies its environmental claim.","evidence":"Paragraph F: ‘still need electricity from the grid’ and ‘remaining energy use also had to be acknowledged’."},{"id":"r15q05","type":"mc","prompt":"Which statement best describes the school’s selected approach?","choices":["It guarantees that all activities keep their usual timetable.","It chooses improvements in stages while making arrangements to limit disruption.","It abandons energy improvements because community activities matter.","It approves construction without any remaining cost checks."],"answer":1,"points":1,"explanation":"The school combines phased work with a nearby temporary room and affordable access. Final checks and some disruption remain.","evidence":"Paragraph E: ‘phased retrofit, subject to the final checks’ and ‘aimed to reduce disruption’."},{"id":"r15q06","type":"open","prompt":"Why might a distant temporary venue make the works less equitable? Explain why these evening activities matter to some families and how a distant venue could limit their access. Answer in one or two English sentences.","points":2,"model":"Some families depend on the affordable activities and do not have another place to meet. A distant venue could exclude those who rely on walking or the bus, so they would bear more of the disruption.","criteria":["Identifies families’ dependence on the affordable activities or lack of an alternative meeting place.","Explains that distance can exclude people who depend on walking or public transport."],"explanation":"An equitable arrangement considers who can actually use the alternative, rather than just whether an empty room exists somewhere.","evidence":"Paragraph D: ‘no alternative place to meet’ and ‘exclude people who depended on walking or the bus’."},{"id":"r15q07","type":"open","prompt":"Explain how fewer opening hours could lower the hall’s energy bill without proving improved efficiency. Then name one separate condition the review must also take into account when comparing energy use. Answer in one or two English sentences.","points":2,"model":"The bill could be lower simply because the hall was used less, rather than because it became more efficient. A fair comparison must also take account of weather conditions.","criteria":["Explains that fewer opening hours or less use can lower the bill without proving improved building efficiency.","Identifies weather or temperature conditions as another factor that must be considered. Do not award this point again for opening hours or occupancy alone."],"explanation":"The answer distinguishes reduced use from improved efficiency and identifies weather as a separate influence on energy demand. Repeating the occupancy point cannot earn both marks.","evidence":"Paragraph G: ‘taking account of weather and how often the hall was occupied’ and ‘fewer opening hours’."},{"id":"r15q08","type":"mediation","prompt":"Die deutschsprachige Elterngruppe möchte wissen, was der gewählte Plan für ihre Abendveranstaltungen bedeutet. Was ändert sich während der Bauarbeiten? Verfasse anhand der Absätze C und E eine kurze Nachricht auf Deutsch. Erkläre die Entscheidung zum Gebäude, die Organisation der Arbeiten und die Ausweichmöglichkeit bei vollständiger Schließung. Gib auch an, ob alle Veranstaltungen zu ihren bisherigen Zeiten fortgesetzt werden können.","points":4,"model":"Die bestehende Halle soll nachgerüstet werden, weil Wände und Dach noch in gutem Zustand sind. Dabei werden unter anderem Dämmung, Steuerung und technische Ausstattung verbessert. Die Arbeiten sollen abschnittsweise stattfinden. Wenn die ganze Halle geschlossen werden muss, steht im nahen Gemeindezentrum ein Raum zum bisherigen günstigen Preis zur Verfügung. Trotzdem können nicht alle Veranstaltungen zu ihren gewohnten Zeiten stattfinden; außerdem stehen die endgültigen Kosten- und Bauprüfungen noch aus.","criteria":["Explains in German that the existing sound structure will be improved or retrofitted rather than simply left unchanged.","States in German that the work will take place in separate sections or stages.","Communicates in German the nearby community-centre room at the usual affordable price during complete closures.","States in German that not every activity can keep its usual time, so disruption is reduced rather than eliminated."],"explanation":"The parents need practical consequences for their activities. A long account of the solar panels would not answer this particular request.","evidence":"Paragraph C: ‘existing walls and roof were sound’; paragraph E: ‘separate sections’, ‘usual affordable price’ and ‘not ... every activity ... at its normal time’."}]}],"gaps":[{"id":"g01","title":"When the village well ran low","unit":"WIC","level":"Core","examOnly":false,"text":"The village had always stood in an {0} region, so people were used to making careful decisions about water. This summer, however, a long {1} continued after the season when rain normally arrived. Heat increased {2} from the small lake, while the continued use of underground reserves led to further {3}. Farmers could see that the two supplies were under pressure for different reasons.\n\nAt a public meeting, protecting drinking water became a {4}. The loss of crops had already had a {5} effect on several families, who depended on the harvest for their income. If conditions became worse, the shortage could {6} more residents. People also feared that arguments over access to the remaining water would {7} existing tensions.\n\nThe village therefore asked farmers, households and local officials to plan together. They agreed to explain decisions openly and consider how each measure would affect people's ability to live and work. Nobody claimed that one meeting could produce rain, but the group could at least organise a fair response to the shortage.","gaps":[{"term":"arid","answer":["arid"],"definition":"very dry because there is little rain","explanation":"Arid describes the region's usual dry conditions; it is an adjective before region."},{"term":"drought","answer":["drought"],"definition":"a long period of unusually dry weather with too little rain","explanation":"Drought names the unusually dry period; use the singular noun after a long."},{"term":"eva
