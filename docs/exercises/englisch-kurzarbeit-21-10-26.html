poration","answer":["evaporation"],"definition":"the process in which liquid changes into gas","explanation":"Evaporation is the process increased by heat, not water use."},{"term":"depletion","answer":["depletion"],"definition":"the reduction of a supply by using it up","explanation":"Depletion describes underground reserves being used up; it is an uncountable noun here."},{"term":"pressing challenge","answer":["pressing challenge"],"definition":"a serious and urgent problem requiring attention","explanation":"Pressing challenge fits after a and identifies the urgent problem."},{"term":"devastating","answer":["devastating"],"definition":"causing great damage or suffering","explanation":"Devastating is an adjective describing the effect of failed crops."},{"term":"displace","answer":["displace"],"definition":"force people to leave their homes","explanation":"Use the base verb displace after could."},{"term":"exacerbate","answer":["exacerbate"],"definition":"make an existing problem worse","explanation":"Exacerbate fits after would and shows that tensions already existed."}],"distractors":["contamination","biodiversity"]},{"id":"g02","title":"The road beside the forest","unit":"WIC","level":"Core","examOnly":false,"text":"A proposed road would pass through the forest beside a small town. During a school project, a class examined the plan instead of judging it only from the route on a map. The removal of a large wooded area would be {0}. For animals that depended on that area, the immediate problem would be {1}. The students recorded the forest's {2}, noting that it supported many different plants and animals.\n\nOne group explained that species could become more {3} as their natural homes were reduced or divided. Being at risk was different from {4}, which would mean that a species no longer existed. Their report concluded that the proposed route {5} to the forest, although the town still needed to discuss its transport needs.\n\nAnother group connected forests with <script>var StudyCore = (() => {
  'use strict';
  const normalize = value => String(value ?? '').normalize('NFKC').replace(/[‘’]/g,"'").trim().replace(/\s+/g,' ').toLocaleLowerCase('en');
  const isOpen = q => q.type === 'open' || q.type === 'mediation';
  function grade(q, value, manual) {
    const possible = Number(q.points) || 1;
    const base = {earned:0,possible,pending:0,kind:'incorrect'};
    if (isOpen(q)) {
      if (!normalize(value)) return {...base,kind:'blank'};
      if (manual === null || manual === undefined || !Number.isFinite(Number(manual))) return {...base,pending:possible,kind:'pending'};
      const earned = Math.max(0,Math.min(possible,Number(manual)));
      return {...base,earned,kind:earned===possible?'correct':earned>0?'partial':'incorrect',manual:true};
    }
    if (q.type === 'mc' || q.type === 'match') {
      if (!normalize(value)) return {...base,kind:'blank'};
      const ok = Number.isInteger(Number(value)) && Number(value) === q.answer;
      return {...base,earned:ok?possible:0,kind:ok?'correct':'incorrect'};
    }
    if (!normalize(value)) return {...base,kind:'blank'};
    const answers = Array.isArray(q.answer) ? q.answer : [q.answer];
    if (answers.some(a => normalize(a) === normalize(value))) return {...base,earned:possible,kind:'correct'};
    if ((q.partial || []).some(a => normalize(a) === normalize(value))) return {...base,earned:possible/2,kind:'partial'};
    return base;
  }
  function summarize(questions, answers={}, manual={}) {
    const grades=questions.map(q=>({...grade(q,answers[q.id],manual[q.id]),id:q.id}));
    const result=grades.reduce((a,g)=>({earned:a.earned+g.earned,possible:a.possible+g.possible,pending:a.pending+g.pending}),{earned:0,possible:0,pending:0});
    return {...result,percent:result.pending?null:result.possible?Math.round(100*result.earned/result.possible):0,grades};
  }
  function placeWord(bank, placements, gapId, wordIndex) {
    const next={...placements}; delete next[gapId];
    if(wordIndex === null || wordIndex === undefined) return next;
    if(!Number.isInteger(wordIndex) || wordIndex<0 || wordIndex>=bank.length) return {...placements};
    for(const key of Object.keys(next)) if(next[key]===wordIndex) delete next[key];
    next[gapId]=wordIndex; return next;
  }
  const deadlineSeconds=(deadline,now)=>Math.max(0,Math.ceil((deadline-now)/1000));
  function record(logs,key,result) { logs[key]={...result}; }
  return {normalize,isOpen,grade,summarize,placeWord,deadlineSeconds,record};
})();

function answerLabel(q){return q.type==='mc'||q.type==='match'?q.choices[q.answer]:(Array.isArray(q.answer)?q.answer.join(' / '):q.answer||q.model||'');}
function answerControl(s,q,disabled=false){
 const value=s.answers[q.id]??'',attrs=`data-session="${h(s.key)}" data-q="${h(q.id)}"`;
 if(q.type==='mc')return `<div class="choices">${q.choices.map((choice,i)=>{const checked=String(value)===String(i)&&value!=='';const cls=s.checked?(i===q.answer?'correct':checked?'incorrect':''):checked?'chosen':'';return `<label class="choice ${cls}"><input type="radio" name="${h(s.key+'-'+q.id)}" value="${i}" ${attrs} ${checked?'checked':''} ${disabled?'disabled':''}><span>${h(choice)}</span></label>`;}).join('')}</div>`;
 if(q.type==='match')return `<div class="text-answer"><label class="sr-only" for="ans-${q.id}">Deine Zuordnung</label><select id="ans-${q.id}" ${attrs} ${disabled?'disabled':''}><option value="">Absatz wählen</option>${q.choices.map((x,i)=>`<option value="${i}" ${String(value)===String(i)&&value!==''?'selected':''}>${h(x)}</option>`).join('')}</select></div>`;
 if(C.isOpen(q))return `<label class="sr-only" for="ans-${q.id}">Your ${q.type==='mediation'?'German':'English'} answer</label><textarea id="ans-${q.id}" ${attrs} placeholder="${q.type==='mediation'?'Schreibe deine Antwort auf Deutsch.':'Schreibe deine Antwort auf Englisch.'}" ${disabled?'disabled':''} spellcheck="false" lang="${q.type==='mediation'?'de':'en'}">${h(value)}</textarea>`;
 if(s.bankMode&&s.kind==='reading')return `<button type="button" class="gap-slot ${value?'filled':''} ${s.targetGap===q.id?'target':''}" data-act="gap-slot" ${attrs} aria-label="Wort für diese Zusammenfassungslücke wählen${value?': '+h(value):''}" ${disabled?'disabled':''}>${value?h(value):'Wort wählen'}</button>`;
 return `<div class="text-answer"><label class="sr-only" for="ans-${q.id}">Deine Antwort</label><input id="ans-${q.id}" type="text" ${attrs} value="${h(value)}" autocomplete="off" spellcheck="false" autocapitalize="off" ${disabled?'disabled':''} placeholder="Fehlendes Wort oder Ausdruck"></div>`;
}
function feedback(s,q){
 const g=C.grade(q,s.answers[q.id],s.manual[q.id]);
 if(C.isOpen(q)){
  const marked=s.manual[q.id]!==undefined;const flags=s.criteria[q.id]||[];
  return `<div class="response-box ${g.kind}"><div class="response-title">${icon(g.pending?'info':g.earned===g.possible?'check':'flag')}${g.pending?'Deine Bewertung fehlt':`${g.earned} / ${g.possible} points${g.manual?' · Selbst bewertet':''}`}</div><strong class="small">Musterantwort</strong><p class="model" ${q.type==='mediation'?'lang="de"':''}>${h(q.model)}</p><p class="small muted">Andere Formulierungen können richtig sein. Vergleiche die Inhalte und die geforderte Form. Ein Stichwortvergleich kann vollständige Antworten nicht bewerten.</p><div class="rubric">${(q.criteria||[]).map((criterion,i)=>`<label><input type="checkbox" data-criterion="${i}" data-session="${h(s.key)}" data-q="${q.id}" ${flags[i]?'checked':''} ${!C.normalize(s.answers[q.id])?'disabled':''}><span>${h(criterion)} <span class="muted">(1 Punkt)</span></span></label>`).join('')}</div>${C.normalize(s.answers[q.id])?btn(marked?'Bewertung aktualisieren':'Bewertung übernehmen','manual',`data-session="${h(s.key)}" data-q="${q.id}"`,'compact soft','check'):'<p class="small">Keine Antwort eingegeben: 0 Punkte. Wiederhole die Aufgabe zum Üben.</p>'}${q.explanation?`<p class="small muted" style="margin-top:12px">${h(q.explanation)}</p>`:''}${evidenceMarkup(q)}</div>`;
 }
 const title={correct:'Richtig',incorrect:'Noch nicht richtig',blank:'Keine Antwort',partial:'Richtige Wortfamilie; prüfe die Form'}[g.kind];
 return `<div class="response-box ${g.kind}"><div class="response-title">${icon(g.kind==='correct'?'check':'flag')}${title} <span class="push-right">${g.earned} / ${g.possible}</span></div>${g.kind!=='correct'?`<p>Antwort: <span class="answer-text">${h(answerLabel(q))}</span></p>`:''}<p>${h(q.explanation||'Read the definition, then check the meaning and form in the sentence.')}</p>${evidenceMarkup(q)}</div>`;
}
function evidenceMarkup(q){return q.evidence?`<details class="evidence"><summary>Beleg anzeigen</summary><p>${h(q.evidence)}</p></details>`:'';}
function questionMarkup(s,q,index,exam=false){
 const show=s.checked||s.submitted;
 let prompt=h(q.prompt).replace('{gap}','<strong>________</strong>');
 return `<section class="question" id="question-${h(q.id)}"><div class="q-head"><span class="q-num">${index+1}</span><div class="q-prompt" ${q.type==='mediation'?'lang="de"':''}>${prompt}${q.hint&&!show?`<p class="small muted no-margin">${h(q.hint)}</p>`:''}</div><span class="q-points">${q.points} ${q.points===1?'pt':'pts'}</span></div>${answerControl(s,q,show)}${!show&&!exam&&q.vocabId&&s.allowHints?`<div class="actions" style="margin-top:8px">${btn('Hinweis','hint',`data-session="${s.key}" data-q="${q.id}"`,'subtle compact','info')}${s.hints[q.id]?`<span class="small muted">${h(q.hintText||'Anfangsbuchstabe: '+(q.answer[0]||'')[0]+'. '+(q.answer[0]||'').split(' ').length+' word(s).')}</span>`:''}</div>`:''}${show?feedback(s,q):''}</section>`;
}
function scoreStrip(s){const sum=C.summarize(activeQuestions(s),s.answers,s.manual);return `<div class="result-strip" role="status"><div><strong>${sum.earned} / ${sum.possible}</strong> <span>${sum.pending?`· ${sum.pending} Punkte benötigen deine Bewertung`:`· ${sum.percent}%`}</span></div><span class="small">${sum.pending?'Vergleiche die Musterantworten unten.':sum.percent>=80?'Gut gemacht. Probiere einen neuen Kontext.':'Lies die Erklärungen und wiederhole schwierige Aufgaben.'}</span></div>`;}
function quizMarkup(s,exam=false){const qs=activeQuestions(s);return `${s.checked?scoreStrip(s):''}<div class="card">${qs.map((q,i)=>questionMarkup(s,q,i,exam)).join('')}${!exam?`<div class="exercise-actions">${s.checked?btn('Falsche Antworten wiederholen','retry',`data-session="${s.key}" data-wrong="true"`,'primary','rotate')+btn('Alles wiederholen','retry',`data-session="${s.key}"`,'','rotate'):btn('Antworten prüfen','check',`data-session="${s.key}"`,'primary','check')}</div>`:''}</div>`;}
function filterMarkup(){return `<div class="filters"><div class="field"><label for="vocab-unit">Quelle</label><select id="vocab-unit" data-setting="vocab.unit"><option value="all">Alle Quellen</option>${['WIC','4A','4B'].map(u=>`<option value="${u}" ${S.vocab.unit===u?'selected':''}>${unitName(u)}</option>`).join('')}</select></div><div class="field"><label for="vocab-level">Schwierigkeit</label><select id="vocab-level" data-setting="vocab.level"><option value="all">Alle Wörter</option>${['Core','Stretch'].map(u=>`<option ${S.vocab.level===u?'selected':''}>${u}</option>`).join('')}</select></div><div class="field grow"><label for="vocab-search">Wort suchen</label><input id="vocab-search" type="search" data-setting="vocab.search" value="${h(S.vocab.search)}" placeholder="English word, meaning, or Deutsche Übersetzung"></div></div>`;}
const vocabSlot=()=>[S.vocab.mode,S.vocab.unit,S.vocab.level,S.vocab.search].join('|');
function vocabSession(){return S.sessions[S.vocab.active[vocabSlot()]];}
function activateVocab(s){S.vocab.active[vocabSlot()]=s.key;return s;}
const clusters=[['exacerbate','compound','intensify','deteriorate'],['mitigate','buffer','curtail'],['galvanize','mobilize','incentivise','campaign','advocate'],['insatiable','ravenous'],['contentious','remain controversial'],['numbness','psychic numbing'],['durable','imperishable','reusable']];
function nearMeaning(a,b){return C.normalize(a.term)===C.normalize(b.term)||clusters.some(c=>c.includes(a.term)&&c.includes(b.term));}
function pickDistinct(list,n){const selected=[];for(const v of shuffle(list)){if(!selected.some(x=>nearMeaning(x,v)))selected.push(v);if(selected.length===n)break;}return selected;}
function vocabQuestion(v,index,mode,difficulty='Standard'){
 const context=v.contexts[index%v.contexts.length];
 const q={id:'vq-'+v.id+'-'+mode+'-'+index,vocabId:v.id,unit:v.unit,points:1,explanation:context.explanation,kind:'vocabulary'};
 if(mode==='meanings'||(mode==='mixed'&&difficulty==='Easy')||(mode==='mixed'&&index%3===0)){
  const candidates=DATA.distractors[v.term],reverse=Array.isArray(candidates)&&index%2===1;
  const distractors=Array.isArray(candidates)?shuffle(candidates).slice(0,3).map(term=>DATA.vocabulary.find(x=>x.term===term)):candidates.definitions.map(def=>({def}));
  const options=shuffle([v,...distractors]);
  return {...q,type:'mc',prompt:reverse?`Which word or phrase has this meaning? ${v.def}`:`What does “${v.term}” mean?`,choices:options.map(x=>reverse?x.term:x.def),answer:options.findIndex(x=>x===v),explanation:`${v.term}: ${v.def} Example: ${context.sentence.replace('{gap}',context.answers[0])}`};
 }
 if(mode==='recall'&&!v.term.includes('…')){
  const spellings=[v.term,...(v.term==='incentivise'?['incentivize']:v.term==='galvanize'?['galvanise']:v.term==='mobilize'?['mobilise']:[])];
  return {...q,type:'text',prompt:`Erinnere dich an das Wort or phrase: ${v.def}`,answer:[...spellings,...(v.sourceTerm.startsWith('to ')?spellings.map(word=>'to '+word):[])],hintText:`${v.de} · Anfangsbuchstabe: ${v.term[0]}.`,explanation:`${v.term}: ${v.def} Example: ${context.sentence.replace('{gap}',context.answers[0])}`};
 }
 return {...q,type:'text',prompt:context.sentence+(mode==='contextual'?` (${v.def})`:` (${v.def})`),answer:context.answers,partial:(v.forms||[]).filter(f=>!context.answers.some(a=>C.normalize(a)===C.normalize(f))),hintText:`${v.de} · Anfangsbuchstabe: ${context.answers[0][0]}.`};
}
function startVocab(mode=S.vocab.mode,words=null,count=10){
 const candidates=words||pool();if(!candidates.length){notify('Keine Wörter für diese Filter.');return;}
 if(mode==='cards')return activateVocab(newSession('cards-'+(++S.uid),{kind:'vocabulary',format:'cards',deck:shuffle(candidates.map(v=>v.id)),index:0,flipped:false,ratings:{},reviewAdded:{},initialCount:candidates.length}));
 if(mode==='matching'){
  const chosen=pickDistinct(candidates,Math.min(6,candidates.length));
  return activateVocab(newSession('match-'+(++S.uid),{kind:'vocabulary',format:'matching',items:chosen,right:shuffle(chosen.map(v=>v.id)),matched:[],selection:null,error:null,message:'',wrong:new Set(),matchMode:S.vocab.matchMode,pairCount:0}));
 }
 if(mode==='mixed'&&S.vocab.difficulty==='Exam'){
  const sets=gapPool();
  const weak=new Set(DATA.vocabulary.filter(v=>S.needs[v.id]).map(v=>C.normalize(v.term))),priority=g=>g.gaps.filter(q=>weak.has(C.normalize(q.term))).length;
  if(sets.length)return activateVocab(gapSession(shuffle(sets).sort((a,b)=>priority(b)-priority(a))[0],false));
 }
 let chosen=shuffle(candidates);if(mode==='mixed')chosen=chosen.sort((a,b)=>Number(!!S.needs[b.id])-Number(!!S.needs[a.id]));
 chosen=chosen.slice(0,count);
 return activateVocab(newSession('vocab-'+(++S.uid),{kind:'vocabulary',format:'quiz',title:{meanings:'Finde die Bedeutung',recall:'Erinnere dich an das Wort',contextual:'Nutze den Kontext',mixed:'Deine gemischten Aufgaben'}[mode]||'Wortschatz üben',questions:chosen.map((v,i)=>vocabQuestion(v,Math.floor(Math.random()*3)+(i*3),mode,S.vocab.difficulty)),allowHints:S.vocab.difficulty!=='Exam'}));
}
function renderVocabulary(){
 const p=pool(),mode=S.vocab.mode;
 let s=vocabSession();
 let body='';
 if(!p.length)body=empty('Keine Wörter für diese Filter.','Wähle eine andere Quelle, alle Wörter oder leere die Suche.',btn('Filter zurücksetzen','clear-vocab','','primary'));
 else if(mode==='glossary')body=renderGlossary(p);
 else if(mode==='bank'||mode==='gaps')body=s?renderVocabGap(s):renderGapCatalog(mode);
 else if(mode==='cards'){if(!s)s=startVocab();body=renderCards(s);}
 else if(mode==='matching'){if(!s)s=startVocab();body=renderMatching(s);}
 else{if(!s)s=startVocab();body=`<div class="study-toolbar"><div><h3 class="no-margin">${h(s.title||s.gap?.title||'Gemischte Prüfungsübungen')}</h3><p>${s.questions.length} Fragen · ${p.length} Einträge im Filter</p></div><div class="actions">${mode==='mixed'?`<label class="inline-label">Mode <select style="width:120px" data-setting="vocab.difficulty">${['Easy','Standard','Exam'].map(x=>`<option ${S.vocab.difficulty===x?'selected':''}>${x}</option>`).join('')}</select></label>`:''}${btn('Neue Aufgaben','new-vocab','','compact','shuffle')}</div></div>${s.format==='gap'?gapMarkup(s):quizMarkup(s)}`;}
 return header('So bleiben die Wörter hängen.','Lerne zuerst die Bedeutung. Finde dann das Wort und seine richtige Form im Satz.',btn('Meine Fehler üben','mistakes','','','rotate'))+`<div class="tabs" aria-label="Wortschatzübungen">${modes.map(([id,label])=>`<button type="button" class="tab ${mode===id?'active':''}" data-act="vocab-mode" data-mode="${id}" aria-pressed="${mode===id}">${label}</button>`).join('')}</div>`+filterMarkup()+body;
}
function renderCards(s){
 const v=vocabularyById[s.deck[s.index]];
 if(!v)return `<div class="single-study">${empty('Du hast diese Kartenrunde abgeschlossen.',`${s.initialCount} entries reviewed. Words you flagged are in your revision list.`,btn('Schwierige Wörter wiederholen','mistakes','','primary','rotate')+btn('Neu mischen','new-vocab','','','shuffle'))}</div>`;
 const direction=S.vocab.direction,context=v.contexts[(wordStatus(v).attempts+s.index)%3];

 const base=gapSession(gap,false,'exam-'+(++S.uid)),prefix=base.key+'-';
 const part1=base.questions.map(q=>({...q,id:prefix+q.id,originId:q.id,part:1}));
 const part2=config.contextIds.map(id=>{const q=DATA.context.questions.find(q=>q.id===id);return {...q,id:prefix+q.id,originId:q.id,part:2};});
 const part3=reading.questions.map(q=>({...q,id:prefix+q.id,originId:q.id,part:3,readingId:reading.id}));
 Object.assign(base,{kind:'exam',format:'exam',configId,title:config.title,questions:[...part1,...part2,...part3],readingId:reading.id,part:1,resultPart:1,minutes,startedAt:Date.now(),deadline:minutes?Date.now()+minutes*60000:null,pausedRemaining:null,submitted:false,bankMode:false});
 S.exams.id=base.key;closeModal();navigate('exams');startTimerLoop();notify(minutes?`Übungsprüfung started. The timer is set to ${minutes} minutes.`:'Übungsprüfung started without a timer.');
}
function examCatalog(){return header('In Ruhe für die Prüfung üben.','Übe alle drei Prüfungsteile. Wähle bei Bedarf ein Zeitlimit und werte deine Antworten nach der Abgabe aus.')+sourceNotice(true)+`<div class="grid three section">${examConfigs.map((c,i)=>{const active=Object.values(S.sessions).find(s=>s.kind==='exam'&&s.configId===c.id&&!s.submitted);const history=Object.values(S.sessions).filter(s=>s.kind==='exam'&&s.configId===c.id&&s.submitted);return `<article class="card exam-card catalog-card"><div class="exam-number">0${i+1}</div><h3>${h(c.title)}</h3><p>${h(c.subtitle)}</p><div class="exam-parts"><div>${icon('book')}<span>Teil 1 · Definitionslückentext</span></div><div>${icon('nodes')}<span>Teil 2 · Vorläufige Themenfragen</span></div><div>${icon('text')}<span>Teil 3 · Neuer Lesetext</span></div></div><div class="summary-tags">${(DATA.readings.find(r=>r.id===c.readingId)?.questions||[]).map(q=>q.type).filter((t,i,a)=>a.indexOf(t)===i).map(t=>tag(typeName(t))).join('')}</div><p class="tiny muted">Optionales Zeitlimit · Rückmeldung nach Abgabe</p>${active?btn('Prüfung fortsetzen','resume-exam',`data-session="${active.key}"`,'primary','arrow'):btn('Prüfung vorbereiten','setup-exam',`data-id="${c.id}"`,'primary','arrow')}${history.length?`<button class="link-button" data-act="resume-exam" data-session="${history.at(-1).key}">Letztes Ergebnis ansehen ${icon('arrow')}</button>`:''}</article>`;}).join('')}</div><div class="notice section"><strong>Übungsbedingungen.</strong> These are study simulations. The timer and point allocations are practice settings. The teacher did not supply an official duration or grade scale. Part 2 cannot reproduce the full page 50 exam scope until that page is available. All three reading passages are reserved for this exam area.</div>`;}
function examAnswered(s){return s.questions.filter(q=>{const a=s.answers[q.id];return a!==undefined&&a!==null&&String(a).trim()!=='';}).length;}
function renderExams(){

function unresolvedQuestions(){

 return Object.values(latest).filter(x=>x.earned<x.possible&&x.question);
}

function timerText(s){if(!s.minutes)return 'Ohne Zeitlimit';if(s.submitted)return 'Abgegeben';if(s.pausedRemaining!==null)return 'Pausiert · '+formatSeconds(s.pausedRemaining);return formatSeconds(C.deadlineSeconds(s.deadline,Date.now()));}
function formatSeconds(seconds){const n=Math.max(0,seconds);return `${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;}

 for(const el of $$('[data-timer]')){const s=getSession(el.dataset.timer);if(!s)continue;const remaining=s.deadline?C.deadlineSeconds(s.deadline,Date.now()):null;el.innerHTML=icon('clock')+'<span>'+timerText(s)+'</span>';el.classList.toggle('urgent',remaining!==null&&remaining<300);}
 const active=Object.values(S.sessions).find(s=>s.kind==='exam'&&!s.submitted),link=$('#active-exam');
 if(active){link.classList.remove('hidden');link.dataset.session=active.key;link.innerHTML=icon('clock')+'<span>Exam '+active.configId.slice(1)+' · '+timerText(active)+'</span>';}else link.classList.add('hidden');
}
function startTimerLoop(){if(timerHandle)return;timerHandle=setInterval(()=>{let changed=false;for(const s of Object.values(S.sessions)){if(s.kind==='exam'&&!s.submitted&&s.deadline&&Date.now()>=s.deadline){submitExam(s,true);changed=true;}}updateTimerDisplay();if(changed&&S.view==='exams')render();},500);}

function syncPlacements(s){
 let cleared=0;s.placements={};for(const q of s.questions.filter(q=>q.type==='text')){const value=s.answers[q.id];if(!value)continue;const canonical=C.grade(q,value).kind==='correct'?q.answer[0]:value;const used=Object.values(s.placements),index=s.bank.findIndex((w,i)=>!used.includes(i)&&C.normalize(w)===C.normalize(canonical));if(index>=0){s.placements[q.id]=index;s.answers[q.id]=s.bank[index];}else{delete s.answers[q.id];cleared++;}}
 s.selectedWord=null;s.targetGap=null;return cleared;
}
function updateBankAnswers(s,old){for(const id of Object.keys(old))if(s.placements[id]===undefined)delete s.answers[id];for(const [id,index] of Object.entries(s.placements))s.answers[id]=s.bank[index];}
function renderKeepFocus(preferred=null){
 const active=document.activeElement,id=active?.id,tagName=active?.tagName,data=Object.entries(active?.dataset||{}),start=active?.selectionStart,end=active?.selectionEnd,top=window.scrollY;
 const oldAct=active?.dataset?.act,session=active?.dataset?.session;
 render();
 let el=preferred?$(preferred):id?document.getElementById(id):data.length?$$(tagName).find(node=>data.every(([key,value])=>node.dataset[key]===value)):null;
 if(!el||el.disabled){
  if(oldAct==='check')el=$('[data-act="retry"][data-session="'+session+'"]');
  else if(oldAct==='retry')el=$('[data-act="check"][data-session="'+session+'"]');
  else if(oldAct==='rate-card')el=$('[data-act="new-vocab"]');
  else if(oldAct==='match-meaning')el=$('[data-act="match-recall"]');
 }
 (el&&!el.disabled?el:$('#main'))?.focus({preventScroll:true});
 if(el&&typeof start==='number'&&el.setSelectionRange)try{el.setSelectionRange(start,end??start);}catch{}
 window.scrollTo({top,behavior:'instant'});
}
function markCard(rating){const s=vocabSession();if(!s||s.format!=='cards')return;if(!s.flipped){notify('Decke die Karte vor der Bewertung auf.');return;}const id=s.deck[s.index];S.seen[id]=true;S.cardRatings[id]=rating==='known'?'known':'practice';S.needs[id]=rating!=='known';s.ratings[s.index]=rating;C.record(S.logs,s.key+':'+s.index,{key:s.key+':'+s.index,kind:'vocabulary',vocabId:id,earned:rating==='known'?1:0,possible:1,self:true,at:Date.now()});if(rating==='practice'&&!s.reviewAdded[id]){s.deck.push(id);s.reviewAdded[id]=true;}s.index++;s.flipped=false;if(s.index>=s.deck.length)S.completed[s.key]='vocabulary';renderKeepFocus('[data-act="flip-card"]');}
function handleMatch(id){
 const s=vocabSession();if(!s?.selection){notify('Wähle zuerst links ein Wort.');return;}const selected=s.selection,v=vocabularyById[selected];s.pairCount++;
 const q={id:'match-'+selected,vocabId:selected,type:'text',answer:[selected],points:1,prompt:`Match “${v.term}” to its ${s.matchMode}.`,explanation:v.def};const g=C.grade(q,id);
 recordQuestion({...s,round:s.pairCount},q,g);
 if(selected===id){s.matched.push(id);s.selection=null;s.error=null;s.message=`${v.term}: ${v.def}`;if(s.matched.length===s.items.length)S.completed[s.key]='vocabulary';}
 else{s.error=id;s.wrong.add(selected);s.message=`That pair does not fit. “${v.term}” means: ${v.def} Try the matching meaning again.`;}
 renderKeepFocus(selected===id?'[data-act="match-word"]:not(:disabled)':null);
}
function onAction(event){
 const target=event.target.closest('[data-act]');if(!target||target.disabled)return;
 const d=target.dataset,act=d.act,s=d.session?getSession(d.session):null;
 switch(act){
  case 'nav':navigate(d.view);break;
  case 'theme':S.theme=S.theme==='light'?'dark':'light';renderKeepFocus();break;
  case 'sources':showSources();break;
  case 'close-modal':closeModal();break;
  case 'quick':S.vocab.mode='mixed';S.vocab.unit='all';S.vocab.level='all';S.vocab.search='';S.vocab.difficulty='Standard';startVocab('mixed',null,10);navigate('vocabulary');break;
  case 'vocab-mode':S.vocab.mode=d.mode;renderKeepFocus();break;
  case 'clear-vocab':S.vocab.unit='all';S.vocab.level='all';S.vocab.search='';renderKeepFocus('#vocab-search');break;
  case 'new-vocab':startVocab();renderKeepFocus();break;
  case 'flip-card':{const current=vocabSession();if(current){current.flipped=!current.flipped;renderKeepFocus();}}break;
  case 'prev-card':{const current=vocabSession();if(current?.index>0){current.index--;current.flipped=false;renderKeepFocus('[data-act="flip-card"]');}else notify('Dies ist die erste Karte dieser Runde.');}break;
  case 'rate-card':markCard(d.rating);break;
  case 'match-word':{const current=vocabSession();if(current&&!current.matched.includes(d.id)){current.selection=d.id;current.error=null;current.message='Now select the matching '+{definition:'definition',german:'German meaning',example:'sentence'}[current.matchMode]+'.';renderKeepFocus();}}break;
  case 'match-meaning':handleMatch(d.id);break;
  case 'match-recall':{const current=vocabSession(),items=current?.items||pool();S.vocab.mode='recall';startVocab('recall',items,items.length);navigate('vocabulary');}break;
  case 'practise-word':{const v=vocabularyById[d.id];if(v){S.vocab.mode='contextual';S.vocab.unit=v.unit;S.vocab.level='all';S.vocab.search='';const session=startVocab('contextual',[v],1);session.questions=v.contexts.map((_,i)=>vocabQuestion(v,i,'contextual'));navigate('vocabulary');}}break;
  case 'start-gap':{const g=DATA.gaps.find(g=>g.id===d.id&&!g.examOnly);if(g){activateVocab(gapSession(g,S.vocab.mode==='bank'));navigate('vocabulary');}}break;
  case 'gap-catalog':delete S.vocab.active[vocabSlot()];navigate('vocabulary');break;
  case 'bank-word':{
   if(!s||s.checked||s.submitted)break;const i=Number(d.index),placedGap=s.targetGap;if(Object.values(s.placements).includes(i))break;
   if(s.targetGap){const old={...s.placements};s.placements=C.placeWord(s.bank,s.placements,s.targetGap,i);updateBankAnswers(s,old);s.targetGap=null;s.selectedWord=null;}
   else s.selectedWord=s.selectedWord===i?null:i;
   renderKeepFocus(placedGap?'[data-act="gap-slot"][data-session="'+s.key+'"][data-q="'+placedGap+'"]':null);break;
  }
  case 'gap-slot':{
   if(!s||s.checked||s.submitted)break;const old={...s.placements};
   if(s.selectedWord!==null){s.placements=C.placeWord(s.bank,s.placements,d.q,s.selectedWord);s.selectedWord=null;s.targetGap=null;}
   else if(s.placements[d.q]!==undefined){s.placements=C.placeWord(s.bank,s.placements,d.q,null);s.targetGap=d.q;}
   else{delete s.answers[d.q];s.targetGap=s.targetGap===d.q?null:d.q;}
   updateBankAnswers(s,old);renderKeepFocus();break;
  }
  case 'toggle-bank':if(s){s.bankMode=!s.bankMode;if(s.checked)resetSession(s);const cleared=s.bankMode?syncPlacements(s):0;renderKeepFocus();if(cleared)notify(`${cleared} typed answer${cleared===1?'':'s'} could not use an available bank word. Those gaps are ready to fill again.`);}break;
  case 'check':if(s&&!s.checked&&s.kind!=='exam'){s.checked=true;commitSession(s);renderKeepFocus();const sum=C.summarize(activeQuestions(s),s.answers,s.manual);notify(sum.pending?'Answers checked. Review the written responses using the model answers.':`${sum.earned} of ${sum.possible} points. Read the feedback below each answer.`);}break;
  case 'retry':if(s&&s.kind!=='exam'){
   const only=d.wrong==='true',wrong=s.questions.filter(q=>C.grade(q,s.answers[q.id],s.manual[q.id]).earned<q.points);
   if(only&&!wrong.length){notify('Every answer is correct. Choose a new set or try all again.');break;}
   resetSession(s,only);renderKeepFocus();notify(only?`Try ${wrong.length} item${wrong.length===1?'':'s'} again.`:'The activity is ready for a new attempt.');
  }break;
  case 'manual':{
   if(!s||(!s.checked&&!s.submitted))break;const q=s.questions.find(q=>q.id===d.q);if(!q||!C.normalize(s.answers[q.id]))break;
   s.manual[q.id]=(s.criteria[q.id]||[]).filter(Boolean).length;recordQuestion(s,q,C.grade(q,s.answers[q.id],s.manual[q.id]));
   if(!C.summarize(s.questions,s.answers,s.manual).pending)S.completed[s.key]=s.kind==='reading'?'reading':s.kind;
   renderKeepFocus();notify(`Self assessment saved: ${s.manual[q.id]} of ${q.points} points.`);break;
  }
  case 'hint':if(s&&!s.checked){s.hints[d.q]=!s.hints[d.q];renderKeepFocus();}break;
  case 'context-tab':S.context.tab=d.tab;renderKeepFocus();break;
  case 'context-topic':S.context.tab='questions';S.context.topic=d.id;navigate('context');break;
  case 'start-reading':startReading(d.id);break;
  case 'reading-catalog':S.reading.id=null;navigate('reading');break;
  case 'guided-start':S.reading.guide=true;S.reading.id=null;navigate('reading');break;
  case 'toggle-guide':S.reading.guide=!S.reading.guide;renderKeepFocus();break;
  case 'guide-step':if(s){s.guideStep=Math.max(0,Math.min(3,Number(d.index)));renderKeepFocus();}break;
  case 'guide-finish':S.reading.guide=false;render();$('.reading-questions')?.scrollIntoView({block:'start'});break;
  case 'setup-exam':setupExam(d.id);break;
  case 'start-exam':startExam(d.id,Number($('#exam-duration').value));break;
  case 'resume-exam':if(s){S.exams.id=s.key;navigate('exams');}break;
  case 'exam-catalog':S.exams.id=null;navigate('exams');break;
  case 'exam-part':if(s&&!s.submitted){s.part=Number(d.part);renderKeepFocus();window.scrollTo({top:0,behavior:'instant'});}break;
  case 'exam-result-part':if(s){s.resultPart=Number(d.part);renderKeepFocus();}break;
  case 'exam-question':if(s){const q=s.questions.find(q=>q.id===d.q);if(q){s.part=q.part;render();document.getElementById('question-'+q.id)?.scrollIntoView({block:'center'});const input=$('[data-q="'+q.id+'"]',document.getElementById('question-'+q.id));input?.focus({preventScroll:true});}}break;
  case 'pause-exam':if(s&&!s.submitted&&s.minutes){if(s.pausedRemaining!==null){s.deadline=Date.now()+s.pausedRemaining*1000;s.pausedRemaining=null;}else{s.pausedRemaining=C.deadlineSeconds(s.deadline,Date.now());s.deadline=null;}renderKeepFocus();}break;
  case 'confirm-submit':if(s&&!s.submitted)confirmSubmit(s);break;
  case 'submit-exam':if(s){submitExam(s);closeModal();S.exams.id=s.key;navigate('exams');notify('Exam submitted. Review your results and written answers.');}break;
  case 'mistakes':startMistakes();break;
  case 'results-tab':S.results.tab=d.tab;renderKeepFocus();break;
  case 'review-question':{const log=S.logs[d.log];if(log?.question){const session=newSession('revision-'+(++S.uid),{kind:'revision',questions:[{...log.question,id:'review-q-'+S.uid,originId:log.questionId,readingId:log.readingId||log.question.readingId}]});S.results.revisionKey=session.key;S.results.tab='practice';navigate('results');}}break;
 }
}
function onInput(event){
 const el=event.target,d=el.dataset;if(!d)return;
 if(d.setting){
  const [group,key]=d.setting.split('.'),value=el.type==='checkbox'?el.checked:el.value;S[group][key]=value;
  if(group==='vocab'&&key==='direction'){const s=vocabSession();if(s)s.flipped=false;}
  if(group==='vocab'&&['matchMode','difficulty'].includes(key))startVocab();
  renderKeepFocus();return;
 }
 if(d.readingBank){const s=getSession(d.readingBank);if(s&&!s.checked){s.bankMode=el.value==='bank';S.reading.summaryMode=el.value;const cleared=s.bankMode?syncPlacements(s):0;renderKeepFocus();if(cleared)notify(`${cleared} typed answer${cleared===1?'':'s'} could not use an available bank word. Those gaps are ready to fill again.`);}return;}
 const s=d.session?getSession(d.session):null;if(!s)return;
 if(d.note){s.notes[d.note]=el.value;return;}
 if(d.criterion!==undefined){if(!s.checked&&!s.submitted)return;const flags=s.criteria[d.q]||(s.criteria[d.q]=[]);flags[Number(d.criterion)]=el.checked;return;}
 if(!d.q||s.checked||s.submitted)return;
 const q=s.questions.find(q=>q.id===d.q);if(!q)return;
 s.answers[q.id]=el.value;
 if(el.type==='radio'){$$('label.choice',el.closest('.choices')).forEach(l=>l.classList.toggle('chosen',$('input',l).checked));}
 if(s.kind==='exam'){
  const count=examAnswered(s);for(const progress of $$('[data-exam-progress="'+s.key+'"]')){progress.textContent=`${count} / ${s.questions.length} responses entered`;const fill=progress.closest('.study-toolbar')?.nextElementSibling?.querySelector('.progress-fill');if(fill)fill.style.width=count/s.questions.length*100+'%';}
  const jump=$('.exam-question-nav [data-q="'+q.id+'"]');if(jump)jump.classList.toggle('answered',String(el.value).trim()!=='');
 }
}
function onKeydown(event){
 const modal=$('.modal');
 if(modal){if(event.key==='Escape'){event.preventDefault();closeModal();return;}if(event.key==='Tab'){const focusable=$$('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href],summary',modal);if(!focusable.length){event.preventDefault();return;}const first=focusable[0],last=focusable.at(-1);if(event.shiftKey&&(document.activeElement===first||document.activeElement===modal)){event.preventDefault();last.focus();}else if(!event.shiftKey&&(document.activeElement===last||document.activeElement===modal)){event.preventDefault();first.focus();}}return;}
 if(event.key==='Enter'&&event.target.matches('input[type="text"][data-q]')){const s=getSession(event.target.dataset.session);if(s&&s.kind!=='exam'&&!s.checked){event.preventDefault();s.checked=true;commitSession(s);renderKeepFocus();notify('Antworten geprüft. Lies die Rückmeldung.');}}
}
function initializeApp(){
 $('#nav').innerHTML=views.map(([id,label,mobile,ico],i)=>`<button type="button" data-act="nav" data-view="${id}" aria-label="${h(label)}">${icon(ico)}<span class="desktop-label">${h(label)}</span><span class="mobile-label">${h(mobile)}</span><span class="nav-number">0${i+1}</span></button>`).join('');
 document.addEventListener('click',onAction);document.addEventListener('input',event=>{if(event.target.tagName!=='SELECT')onInput(event);});document.addEventListener('change',event=>{if(event.target.tagName==='SELECT')onInput(event);});document.addEventListener('keydown',onKeydown);
 document.addEventListener('toggle',event=>{const id=event.target.dataset?.topic;if(id){S.context.openTopics??={};S.context.openTopics[id]=event.target.open;}},true);
 $('#modal-host').addEventListener('click',event=>{if(event.target.dataset.overlay)closeModal();});
 render();
}
// Reset transient answers when restored from the browser back/forward cache.
window.addEventListener('pageshow', event => { if(event.persisted) location.reload(); });
initializeApp();
</script>
