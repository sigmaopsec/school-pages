rs":["compound"],"explanation":"The base verb follows “would”; the leak would add another difficulty to existing problems."},{"sentence":"Last summer, a power cut {gap} the effects of the heatwave by stopping household fans.","answers":["compounded"],"explanation":"The past form describes an extra problem that increased existing harm."},{"sentence":"Rising repair costs are {gap} the financial pressure on families whose homes flooded.","answers":["compounding"],"explanation":"“Are” requires the -ing form; higher costs add to pressure that already exists."}],"def":"To worsen a problem by adding another difficulty or harmful factor."},{"id":"b12","unit":"4B","term":"vulnerable","sourceTerm":"vulnerable","de":"verletzlich; gefährdet","level":"Core","forms":["vulnerable"],"contexts":[{"sentence":"Basement flats are particularly {gap} to water entering during a flash flood.","answers":["vulnerable"],"explanation":"The adjective combines with “to” to identify a specific risk of harm."},{"sentence":"The emergency plan offers extra support to {gap} residents who need help reaching shelters.","answers":["vulnerable"],"explanation":"The adjective describes residents especially exposed to harm."},{"sentence":"When the sea wall cracked, the homes behind it became more {gap}.","answers":["vulnerable"],"explanation":"After “became more”, the adjective means more exposed to danger."}],"def":"At risk of being harmed or damaged."},{"id":"b13","unit":"4B","term":"retrofit","sourceTerm":"to retrofit","de":"nachrüsten","level":"Stretch","forms":["retrofit","retrofits","retrofitted","retrofitting"],"contexts":[{"sentence":"The city plans to {gap} older homes with stronger roof connections.","answers":["retrofit"],"explanation":"The base verb follows “to”; it means add protective features to existing buildings."},{"sentence":"The school was {gap} with more efficient lighting during last year’s renovation.","answers":["retrofitted"],"explanation":"After “was”, use the past participle for changes made to an existing building."},{"sentence":"By {gap} old pumps with modern controls, the water company hopes to reduce electricity use.","answers":["retrofitting"],"explanation":"After “by”, use the -ing form; double the final “t” before “ing”."}],"def":"To equip an existing building or system with newer features or technology."},{"id":"b14","unit":"4B","term":"watershed","sourceTerm":"watershed","de":"Einzugsgebiet","level":"Stretch","forms":["watershed","watersheds"],"contexts":[{"sentence":"Pollution anywhere in the river’s {gap} can be carried downstream towards the bay.","answers":["watershed"],"explanation":"The noun refers to the surrounding land that drains into this river."},{"sentence":"The two neighbouring {gap} send rainwater into different lakes.","answers":["watersheds"],"explanation":"“Two” requires the plural; each land area drains towards a different destination."},{"sentence":"The map outlines the {gap} that supplies the town’s reservoir.","answers":["watershed"],"explanation":"The singular noun names the area whose water drains into the reservoir, not a turning point."}],"def":"The land area from which water drains into the same river, lake or other water body."},{"id":"b15","unit":"4B","term":"salinity","sourceTerm":"salinity","de":"Salzgehalt; Salinität","level":"Stretch","forms":["salinity"],"contexts":[{"sentence":"After seawater entered the well, tests showed that its {gap} had increased.","answers":["salinity"],"explanation":"The noun refers to the amount of dissolved salt in the well water."},{"sentence":"Farmers monitor soil {gap} because some crops cannot tolerate much salt.","answers":["salinity"],"explanation":"The uncountable noun names the soil’s salt concentration."},{"sentence":"The class compared the {gap} of freshwater, seawater and water from the river mouth.","answers":["salinity"],"explanation":"The noun identifies the salt concentration being measured in each sample."}],"def":"The concentration of salt in water or soil."},{"id":"b16","unit":"4B","term":"galvanize","sourceTerm":"to galvanize","de":"aufrütteln; mobilisieren","level":"Stretch","forms":["galvanize","galvanizes","galvanized","galvanizing","galvanise","galvanises","galvanised","galvanising"],"contexts":[{"sentence":"The photographs of flooded classrooms could {gap} parents into demanding safer buildings.","answers":["galvanize","galvanise"],"explanation":"The base verb follows “could”; the photographs may provoke action. Both spelling variants are accepted."},{"sentence":"Last year’s sewage spill {gap} the community into organising a river-protection campaign.","answers":["galvanized","galvanised"],"explanation":"The past form describes an event that stirred people into action."},{"sentence":"The campaign hopes its clear account of local risks will {gap} support for the flood plan.","answers":["galvanize","galvanise"],"explanation":"The base verb follows “will”; it means stimulate active support."}],"def":"To stir people strongly enough that they take action."},{"id":"b17","unit":"4B","term":"curtail","sourceTerm":"to curtail","de":"einschränken; kürzen","level":"Stretch","forms":["curtail","curtails","curtailed","curtailing"],"contexts":[{"sentence":"Officials may {gap} lawn watering if the dry weather continues.","answers":["curtail"],"explanation":"The base verb follows “may”; it means limit an activity."},{"sentence":"The factory {gap} production during last summer’s water shortage.","answers":["curtailed"],"explanation":"The past form describes a reduction during a completed period."},{"sentence":"The town is {gap} vehicle access to the fragile beach habitat.","answers":["curtailing"],"explanation":"“Is” requires the -ing form for an ongoing restriction."}],"def":"To reduce the amount, extent or duration of something."},{"id":"b18","unit":"4B","term":"contentious","sourceTerm":"contentious","de":"umstritten; strittig","level":"Stretch","forms":["contentious"],"contexts":[{"sentence":"Deciding which neighbourhood receives the first sea-wall repairs proved {gap}.","answers":["contentious"],"explanation":"The adjective describes a decision that caused disagreement."},{"sentence":"The proposal to move homes away from the shore became a {gap} topic at the meeting.","answers":["contentious"],"explanation":"The adjective before “topic” means likely to lead to argument."},{"sentence":"Residents asked for an open discussion of the most {gap} parts of the flood plan.","answers":["contentious"],"explanation":"The adjective describes the parts most likely to divide opinions."}],"def":"Likely to provoke disagreement or argument."},{"id":"b19","unit":"4B","term":"advocate","sourceTerm":"to advocate","de":"befürworten; eintreten für","level":"Core","forms":["advocate","advocates","advocated","advocating"],"contexts":[{"sentence":"The campaigners {gap} restoring wetlands as part of the flood strategy.","answers":["advocate"],"explanation":"The plural subject takes the base present form; “advocate” can be followed directly by an -ing activity."},{"sentence":"At yesterday’s meeting, the engineer {gap} stronger building standards along the coast.","answers":["advocated"],"explanation":"The past form fits the completed public statement of support."},{"sentence":"The student group is {gap} better public transport to reduce car use.","answers":["advocating"],"explanation":"“Is” requires the -ing form for continuing public support of a policy."}],"def":"To speak publicly in support of an idea, policy or course of action."},{"id":"b20","unit":"4B","term":"inundate","sourceTerm":"to inundate","de":"überschwemmen; überfluten","level":"Stretch","forms":["inundate","inundates","inundated","inundating"],"contexts":[{"sentence":"A storm surge could {gap} the low-lying streets beside the harbour.","answers":["inundate"],"explanation":"The base verb follows “could”; the streets may be covered with floodwater."},{"sentence":"The shops were {gap} when the river overflowed during last night’s storm.","answers":["inundated"],"explanation":"After “were”, use the past participle to describe buildings flooded with water."},{"sentence":"Water from the damaged canal is {gap} the nearby fields.","answers":["inundating"],"explanation":"“Is” requires the -ing form for flooding that is happening now."}],"def":"To cover with floodwater or overwhelm with a large amount of something."},{"id":"b21","unit":"4B","term":"equitable","sourceTerm":"equitable","de":"gerecht; fair","level":"Core","forms":["equitable"],"contexts":[{"sentence":"The council wants an {gap} distribution of repair funds that takes different levels of need into account.","answers":["equitable"],"explanation":"The adjective after “an” means fair; fair support may consider unequal needs."},{"sentence":"Residents argued that the evacuation plan was not {gap} because it ignored people without cars.","answers":["equitable"],"explanation":"The adjective describes fairness in the treatment of different groups."},{"sentence":"An {gap} climate policy should consider how its costs affect both wealthy and poorer households.","answers":["equitable"],"explanation":"The adjective means fair and impartial, rather than simply identical for everyone."}],"def":"Fair and impartial in the way people are treated or resources are shared."},{"id":"b22","unit":"4B","term":"threshold","sourceTerm":"threshold","de":"Schwelle","level":"Stretch","forms":["threshold","thresholds"],"contexts":[{"sentence":"The warning is issued when the river reaches a set {gap}.","answers":["threshold"],"explanation":"The singular noun follows “a set” and names the level that triggers action."},{"sentence":"Different plants have different salt-tolerance {gap}.","answers":["thresholds"],"explanation":"The plural refers to several levels beyond which conditions change for different plants."},{"sentence":"The town uses an income {gap} to decide which households qualify for free flood repairs.","answers":["threshold"],"explanation":"The noun identifies the income level that marks a change in eligibility for financial help."}],"def":"A point or level at which a change begins or a condition is triggered."},{"id":"b23","unit":"4B","term":"recalibrate","sourceTerm":"to recalibrate","de":"neu justieren; neu kalibrieren","level":"Stretch","forms":["recalibrate","recalibrates","recalibrated","recalibrating"],"contexts":[{"sentence":"Technicians must {gap} the flood sensor after replacing its measuring unit.","answers":["recalibrate"],"explanation":"The base verb follows “must”; the sensor needs a precise new adjustment."},{"sentence":"After receiving better rainfall data last month, planners {gap} their flood model.","answers":["recalibrated"],"explanation":"The past form describes adjusting the model to match new information."},{"sentence":"The team is {gap} its warning system to reflect changes in the coastline.","answers":["recalibrating"],"explanation":"“Is” requires the -ing form for a precise adjustment to new conditions."}],"def":"To adjust something precisely so it suits new conditions or information."},{"id":"b24","unit":"4B","term":"trajectory","sourceTerm":"trajectory","de":"Entwicklungskurve; Verlauf","level":"Stretch","forms":["trajectory","trajectories"],"contexts":[{"sentence":"The graph shows the {gap} of the town’s emissions over the last decade.","answers":["trajectory"],"explanation":"The singular noun names the pattern of development over time."},{"sentence":"The report compares two possible {gap} for future coastal development.","answers":["trajectories"],"explanation":"“Two” requires the plural; the report considers two possible paths of change."},{"sentence":"The new energy plan aims to change the upward {gap} of electricity demand.","answers":["trajectory"],"explanation":"The noun refers to the developing direction of demand, not its value at one moment."}],"def":"The direction or pattern of a process as it develops over time."},{"id":"b25","unit":"4B","term":"buffer","sourceTerm":"to buffer","de":"abpuffern; schützen","level":"Stretch","forms":["buffer","buffers","buffered","buffering"],"contexts":[{"sentence":"A belt of restored dunes can {gap} nearby homes against some storm-wave impacts.","answers":["buffer"],"explanation":"The base verb follows “can”; the dunes reduce the force reaching homes."},{"sentence":"The wetland {gap} the village against some floodwater during last winter’s storms.","answers":["buffered"],"explanation":"The past form describes protection that reduced an impact during a completed event."},{"sentence":"The forest is {gap} the riverside path from the strongest winds.","answers":["buffering"],"explanation":"“Is” requires the -ing form; the trees lessen the effect of the wind."}],"def":"To protect against an impact by reducing its force or effect."},{"id":"b26","unit":"4B","term":"divert","sourceTerm":"to divert","de":"umleiten; ablenken","level":"Core","forms":["divert","diverts","diverted","diverting"],"contexts":[{"sentence":"Engineers plan to {gap} excess rainwater into a storage pond.","answers":["divert"],"explanation":"The base verb follows “to”; it means redirect water to another route."},{"sentence":"Yesterday, workers {gap} traffic away from the flooded bridge.","answers":["diverted"],"explanation":"The past form fits yesterday’s completed change in traffic direction."},{"sentence":"The new channel is {gap} runoff towards a wetland instead of the town centre.","answers":["diverting"],"explanation":"“Is” requires the -ing form for directing water along a different path."}],"def":"To make something move along a different route or in a different direction."},{"id":"b27","unit":"4B","term":"forecast","sourceTerm":"to forecast","de":"vorhersagen; prognostizieren","level":"Core","forms":["forecast","forecasts","forecasted","forecasting"],"contexts":[{"sentence":"Meteorologists use satellite observations to {gap} approaching storms.","answers":["forecast"],"explanation":"The base verb follows “to”; it means predict using information."},{"sentence":"Yesterday’s report {gap} heavy rain for the coastal district.","answers":["forecast","forecasted"],"explanation":"Both “forecast” and “forecasted” are accepted past forms for yesterday’s prediction."},{"sentence":"The weather service is {gap} strong winds for tomorrow’s evacuation period.","answers":["forecasting"],"explanation":"“Is” requires the -ing form; tomorrow makes the prediction’s future reference clear."}],"def":"To predict future conditions using available information."},{"id":"b28","unit":"4B","term":"mobilize","sourceTerm":"to mobilize","de":"mobilisieren","level":"Core","forms":["mobilize","mobilizes","mobilized","mobilizing","mobilise","mobilises","mobilised","mobilising"],"contexts":[{"sentence":"The rescue coordinator will {gap} volunteers to check on isolated residents.","answers":["mobilize","mobilise"],"explanation":"The base verb follows “will”; it means organise people for action. Both spelling variants are accepted."},{"sentence":"Last night, local groups {gap} vehicles and supplies for the emergency shelters.","answers":["mobilized","mobilised"],"explanation":"The past form describes resources organised for use during a completed event."},{"sentence":"The city is {gap} repair crews before the storm reaches the coast.","answers":["mobilizing","mobilising"],"explanation":"“Is” requires the -ing form for preparing people for action."}],"def":"To organise people or resources and get them ready for action."},{"id":"b29","unit":"4B","term":"underpin","sourceTerm":"to underpin","de":"untermauern; stützen","level":"Stretch","forms":["underpin","underpins","underpinned","underpinning"],"contexts":[{"sentence":"Reliable rainfall records {gap} the town’s flood-risk calculations.","answers":["underpin"],"explanation":"The plural “records” takes the base present form; the data provide essential support."},{"sentence":"Trust between neighbours {gap} the community’s emergency response.","answers":["underpins"],"explanation":"The singular “trust” takes “underpins”; it forms a foundation for cooperation."},{"sentence":"The earlier coastal plan was {gap} by detailed surveys of local land levels.","answers":["underpinned"],"explanation":"After “was”, use the past participle; double the final “n” before “ed”."}],"def":"To provide essential support or a foundation for something."},{"id":"b30","unit":"4B","term":"trade-off","sourceTerm":"trade-off","de":"Abwägung; Zielkonflikt","level":"Stretch","forms":["trade-off","trade-offs"],"contexts":[{"sentence":"The proposal involves a {gap} between creating more parking and preserving green space.","answers":["trade-off"],"explanation":"The singular noun follows “a” and describes competing benefits that cannot both be maximised."},{"sentence":"Planners discussed the {gap} between building a taller sea wall and keeping an open view of the coast.","answers":["trade-off"],"explanation":"The noun names a compromise between protection and an unobstructed view."},{"sentence":"Every option has {gap}, so the committee compared cost, flood protection and effects on wildlife.","answers":["trade-offs"],"explanation":"The plural noun refers to several compromises among competing priorities."}],"def":"A compromise in which gaining one desired benefit means giving up some of another."}],"context":{"status":"partial","scopeNotice":"Provisional topic revision: the actual textbook page 50, Environmental Challenges, is not included in the supplied Unit 4 materials. These notes and questions are based on the supplied Words in Context vocabulary table and its related cloze exercise (handout pp. 2–5). They cannot confirm the full content or sequence of the missing textbook text. Use your textbook page 50 to complete preparation for the real exam. Exact numerical facts are not tested.","sourceSummary":[{"file":"Pasted text(20261019-182759).txt","pages":"Master prompt, sections 2–3, 7–9","use":"Defines the approved Unit 4 scope, exam formats, manual assessment of written answers, and the instruction not to test exact numbers.","limitation":"Refers to textbook page 50 and a four-step reading overview that are not themselves attached."},{"file":"Vocabulary Focus On Success Plus 12.pdf","pages":"Handout pp. 2–5: Words in Context; pp. 6–8: Unit 4A; pp. 9–11: Unit 4B","use":"Approved vocabulary, German meanings, word forms and related cloze topics. WIC pp. 2–5 are the basis of this provisional study section.","limitation":"The WIC cloze is a separate exercise, not a scan of textbook page 50. Later units in this large file are excluded. A Unit 4A cloze gap requests geophysical force, which is not a vocabulary-table entry and is excluded from the tested list."},{"file":"The Anthropocene.pdf","pages":"Textbook pp. 52–53, paragraphs A–G","use":"Confirms Unit 4A themes: consumption, plastic persistence, psychic numbing and the importance of feeling that action can work.","limitation":"This is Unit 4A, not the missing WIC page. Its wording about a geological epoch is treated as the supplied author's framing, not as a claim about current formal geological classification."},{"file":"Climate Change in FL.pdf","pages":"Textbook pp. 56–58, paragraphs A–G","use":"Confirms Unit 4B themes: sea-level rise, water contamination, hurricanes, habitat loss, displacement and possible responses.","limitation":"The article is dated 21 April 2020. Its projections are not presented as current forecasts and no exact figures are tested. Page 58 gives a five-step group placemat activity, not the requested four reading steps."},{"file":"Reading Texts Fachabitur 2024.pdf","pages":"Both supplied pages: For the Love of Nature, paragraphs A–G","use":"Establishes reading level and the source evidence for the accompanying example task formats.","limitation":"Supplemental example only. It does not supply Environmental Challenges and does not expand the tested Unit 4 vocabulary list."},{"file":"For the love of nature Aufgaben.pdf","pages":"PDF pp. 1–2","use":"Confirms one-option multiple choice, English-to-German mediation, and concise English short answers. It explicitly permits words from the reading text for short answers.","limitation":"Does not contain an exact four-step overview, multiple-matching guidance or a gapped-summary method."},{"file":"Lösung For the love of nature.pdf","pages":"PDF p. 1","use":"Confirms the example mediation content and short-answer wording; helps verify expected response precision.","limitation":"Leading MC letters conflict with option wording. Matching the wording to the worksheet and reading text gives A, D, C, D, which also matches the trailing corrections. Old conflicting letters are not copied into practice answer keys."},{"file":"English_Lesson_Climate_and_Outdoor_Communities.pptx","pages":"Slides 1–11, especially embedded guidance on slides 5 and 7–9","use":"Verified guidance for detailed reading, paragraph headings, MC, mediation and short-answer tasks. Embedded image tables were inspected, not just extracted slide text.","limitation":"The numbered sequence is a lesson plan with five phases. It is not an identified four-step reading overview. The exact requested four steps remain unverified."},{"file":"Vocabulary_List_Climate_and_Outdoor_Communities.pdf","pages":"PDF p. 1","use":"Reviewed to separate the supplemental For the Love of Nature vocabulary from approved Unit 4 entries.","limitation":"No additional tested vocabulary is imported from this supplemental list."},{"file":"Klimasachtexte · FOS-12-Übung","pages":"Drei Sachtexte; die Fachquellen stehen jeweils am Textende.","use":"Ersetzt die bisherigen fiktiven Lesetexte. Alle 93 Kurswortschatz-Einträge werden in den drei Sachtexten verwendet. Die Aufgaben folgen dem gelieferten Fachabitur-Beispiel: 4 Multiple Choice, eine vergleichende Sprachmittlung (2 Punkte) und 2 Short-Answer Questions, zusammen 8 Punkte.","limitation":"Eigenständig formulierte, quellenbasierte Sachtexte; keine Original-Prüfungsaufgaben und keine offizielle Einstufung. Zwei Texte zum Üben, einer für die Prüfungssimulation. Die fehlende Lehrbuchseite 50 und die genaue Vier-Schritte-Methode werden hierdurch nicht ersetzt."}],"topics":[{"id":"climate","title":"Climate pressure and connected risks","summary":"The supplied WIC material treats climate change as an urgent challenge with connected effects on food, water, public health and places where people live. Greenhouse gases retain heat in the atmosphere. The cloze links longer heatwaves and changing rainfall to risks for people and ecosystems.","causes":["Greenhouse gases prevent some heat from escaping.","Reliance on coal, oil and gas is linked to the need for cleaner energy systems."],"effects":["Longer heatwaves and changing rainfall threaten food security and public health.","Rising seas pose risks to coastal communities."],"responses":["Reduce the carbon footprint of homes and transport.","Move energy systems towards renewable sources and improve planning."],"connections":["Warmer conditions connect to evaporation and water stress.","Environmental damage can become a social problem when it affects homes and livelihoods."],"source":"WIC vocabulary handout pp. 2–4 and Environmental Challenges cloze, p. 5; provisional revision, not verified textbook p. 50."},{"id":"water","title":"Drought, evaporation and depleted water","summary":"The WIC table distinguishes drought, evaporation and depletion. Drought is a long unusually dry period; evaporation changes liquid water into vapour; depletion reduces a supply by using it up. The examples show why farming communities may face several kinds of water pressure together.","causes":["A long period with too little rain produces drought conditions.","Heat can increase evaporation.","Using groundwater reduces the remaining supply."],"effects":["Less available water puts crops and communities under pressure.","Failed harvests and depleted supplies can worsen existing social tensions."],"responses":["Treat safe drinking water as a central priority.","Plan adaptation around both environmental needs and people's livelihoods."],"connections":["A physical shortage can affect food security and contribute to displacement.","Contamination is a different water problem: water may be present but unsafe."],"source":"WIC vocabulary handout pp. 2–4: drought, evaporation, depletion, arid, contamination; cloze p. 5."},{"id":"people","title":"Homes, vulnerability and fairness","summary":"The provided WIC cloze connects environmental stress with human consequences. Storms, drought and damaged living conditions can force families to move. It also argues that adaptation should support livelihoods and social justice.","causes":["Storms and drought can damage the conditions people depend on.","Repeated flooding can make an area unsafe to live in.","Existing inequalities can increase the difficulty of responding."],"effects":["People may be displaced from their homes.","Food problems and reduced resources can increase social tensions.","Vulnerable communities face serious risks."],"responses":["Include community involvement in environmental planning.","Choose adaptation measures that strengthen livelihoods."],"connections":["The same environmental threat can also affect food, housing and social relationships.","Fair adaptation joins environmental protection with the needs of affected people."],"source":"WIC vocabulary handout pp. 2–3: uninhabitable, displace, exacerbate, vulnerable; cloze p. 5."},{"id":"biodiversity","title":"Forests, habitats and biodiversity","summary":"Forests are linked to carbon storage and rich biodiversity in the WIC examples. The cloze connects deforestation with soil damage and fragmented habitats. Habitat loss can make species more vulnerable and increase the risk of extinction.","causes":["Deforestation removes large areas of forest.","Habitat destruction and fragmentation reduce suitable natural homes."],"effects":["The planet loses some of its capacity to store carbon when forests are removed.","Species become more vulnerable when their habitats disappear.","Extinction reduces biodiversity."],"responses":["Tackle habitat loss and forest destruction.","Consider ecosystems as well as human needs in environmental planning."],"connections":["Deforestation connects the climate problem with the biodiversity problem.","Extinction concerns the loss of a species; biodiversity concerns the variety of life."],"source":"WIC vocabulary handout p. 3 and Environmental Challenges cloze p. 5."},{"id":"energy","title":"Energy choices and carbon footprints","summary":"The WIC material connects lower carbon footprints with homes, travel and the energy system. It gives insulation, shared rides and train travel as examples. At a wider level, the cloze calls for renewable energy, improved storage and better public transport.","causes":["Fossil-fuel-reliant systems depend heavily on coal, oil or gas.","Affluent societies can consume large amounts of energy."],"effects":["Energy choices affect the amount of carbon dioxide associated with an activity or organisation.","Changing an entire energy system requires more than one household action."],"responses":["Insulate homes, share rides and use suitable train journeys.","Harness wind or other renewable energy and improve storage.","Invest in public transport and encourage cleaner production."],"connections":["Individual choices and wider investment can support the same environmental aim.","Carbon-neutral refers to a net balance of carbon dioxide, so the word net matters."],"source":"WIC vocabulary handout pp. 3–4 and Environmental Challenges cloze p. 5."},{"id":"waste","title":"Waste, contamination and a circular economy","summary":"The WIC table explains improper waste disposal, contamination, incineration and a circular economy. The cloze develops a response based on repair, keeping materials useful and reducing waste from the beginning of a product's life.","causes":["Waste handled in unsuitable ways can pollute rivers and other places.","A system that discards useful materials creates avoidable waste."],"effects":["Contamination can make water or other materials dirty or unsafe.","Waste must be managed even when it is no longer useful to its first owner."],"responses":["Repair products and reuse materials.","Design supply chains that keep materials valuable and reduce waste.","Distinguish burning waste from preventing it in the first place."],"connections":["Water quantity and water quality are related concerns but different problems.","Repair changes the flow of materials and can be supported through wider policy."],"source":"WIC vocabulary handout p. 4 and Environmental Challenges cloze p. 5."},{"id":"action","title":"Practical responses and difficult choices","summary":"The supplied cloze presents environmental action as possible but demanding. It combines targeted investment, public participation and planning based on evidence. The vocabulary also recognises that some responses continue to cause disagreement.","causes":["Environmental challenges connect several systems, so one measure may address only part of a problem.","Different responses can raise competing concerns."],"effects":["A proposal can remain controversial even when it is intended to reduce harm.","Adaptation can affect both ecosystems and livelihoods."],"responses":["Incentivise cleaner production and durability.","Use targeted investment and community engagement.","Judge whether adaptation supports the people affected."],"connections":["Mitigating harm does not necessarily mean removing the whole problem.","A useful explanation links a response to the specific cause or effect it addresses."],"source":"WIC vocabulary handout pp. 3–4 and Environmental Challenges cloze p. 5."}],"questions":[{"id":"c01","type":"open","prompt":"Why is climate change described as a pressing challenge in the supplied WIC revision material? Give two connected reasons in complete English sentences.","points":2,"model":"It is an urgent problem because heatwaves and changing rainfall can threaten food security and public health. These effects can also damage the conditions communities depend on, so action is needed to reduce harm.","criteria":["Explains urgency using a supported threat to food, health or living conditions.","Connects the threat to a consequence for people or a reason for action."],"explanation":"A strong answer explains why the challenge matters; simply replacing pressing with urgent does not provide two ideas.","evidence":"Vocabulary handout p. 2, pressing challenge and pose a significant threat; cloze p. 5, opening sentences.","topic":"climate"},{"id":"c02","type":"open","prompt":"Explain the meaning of trap heat and connect it to the climate theme of the WIC material.","points":2,"model":"To trap heat means to prevent it from escaping. The WIC example explains that greenhouse gases retain heat in the atmosphere, which connects the expression to the problem of a warming climate.","criteria":["Explains that heat is prevented from escaping.","Identifies greenhouse gases and the atmosphere as the relevant context."],"explanation":"Give the physical meaning and then apply it to the example. No exact temperature or measurement is needed.","evidence":"Vocabulary handout p. 2, trap heat entry and example.","topic":"climate"},{"id":"c03","type":"open","prompt":"Choose one climate-related problem from the revision notes and explain a chain with a cause, an environmental effect and a consequence for people.","points":3,"model":"A long period with too little rain can cause a drought. The shortage of water can damage crops and contribute to failed harvests. This threatens food security and can put farming communities under greater pressure.","criteria":["Identifies a supported cause, such as prolonged lack of rain or rising temperatures.","Explains a plausible environmental effect supported by the notes.","Connects that effect to a supported consequence for people."],"explanation":"Other supported chains are acceptable, such as heat, evaporation and reduced water supplies. Award points for the links, not for memorised wording.","evidence":"Vocabulary handout p. 2, drought and evaporation; cloze p. 5, water stress and failed harvests.","topic":"climate"},{"id":"c04","type":"open","prompt":"How are drought and evaporation different? Explain both terms without using numerical facts.","points":2,"model":"Drought is a long period of unusually dry weather with too little rain. Evaporation is the process in which liquid water changes into a gas, often because of heat. One is a weather condition, while the other is a physical process.","criteria":["Defines drought as a prolonged unusually dry period with insufficient rain.","Defines evaporation as liquid water changing into gas."],"explanation":"They can happen together, but they name different things. An answer that treats them as synonyms misses the distinction.","evidence":"Vocabulary handout p. 2, drought and evaporation entries.","topic":"water"},{"id":"c05","type":"open","prompt":"Why can groundwater depletion create problems for farming communities? Include the meaning of depletion and one consequence.","points":2,"model":"Groundwater depletion means that the supply is reduced as water is used up. If less water remains available, farming communities can struggle to supply crops, which can contribute to failed harvests and pressure on their livelihoods.","criteria":["Explains that depletion reduces a supply by using it up.","Links the reduced water supply to farming, harvests or livelihoods."],"explanation":"The answer needs to connect the meaning of the word to the people in the source example.","evidence":"Vocabulary handout p. 2, depletion; cloze p. 5, groundwater depletion and failed harvests.","topic":"water"},{"id":"c06","type":"open","prompt":"Explain how drought and groundwater depletion could reinforce pressure on an arid region.","points":3,"model":"An arid region already receives little rain. A drought adds a prolonged period of unusually dry conditions, while groundwater depletion reduces stored water as it is used. Together these pressures can leave less water for farming and communities.","criteria":["Explains that an arid region is very dry because it receives little rain.","Distinguishes the added pressure from drought and from groundwater use.","Explains a combined consequence for water availability or farming."],"explanation":"This is a synthesis of the vocabulary examples and cloze, not a claim that the missing textbook uses this exact explanation.","evidence":"Vocabulary handout p. 2, arid, drought and depletion; cloze p. 5.","topic":"water"},{"id":"c07","type":"open","prompt":"How is water contamination different from water depletion, and why can both matter to a community?","points":3,"model":"Depletion reduces the amount of water in a supply. Contamination makes water polluted or unsafe. A community needs both enough water and water that is safe to use, so either problem can threaten its access to useful water.","criteria":["Correctly explains depletion as a reduction in supply.","Correctly explains contamination as pollution or loss of safety.","Explains why quantity and quality both matter to access to water."],"explanation":"The final link is a reasoned connection between two supplied definitions. It does not require a numerical threshold.","evidence":"Vocabulary handout p. 2, depletion; p. 4, contamination and importance of drinking water.","topic":"water"},{"id":"c08","type":"open","prompt":"How can an environmental problem lead to displacement? Explain the relationship using a supplied WIC example.","points":2,"model":"Repeated flooding can make a place unsafe for people to live in. If residents can no longer remain there safely, they may be forced to leave their homes, which is displacement.","criteria":["Gives a supported environmental threat to homes or living conditions.","Explains that displacement means people are forced to leave their homes."],"explanation":"A drought or storm example can also earn full credit if it explains why people may have to move.","evidence":"Vocabulary handout p. 2, uninhabitable and displace; cloze p. 5, storms and drought.","topic":"people"},{"id":"c09","type":"open","prompt":"What does it mean to say that environmental pressures can exacerbate existing inequalities? Explain the word and the relationship.","points":2,"model":"Exacerbate means to make an existing problem worse. Environmental pressures can add further difficulties to communities that already face unequal conditions, so the original inequalities become more serious rather than beginning from nothing.","criteria":["Explains exacerbate as making an existing problem worse.","Explains that environmental pressure can add to inequalities that already exist."],"explanation":"The key distinction is worsening an existing problem. A specific invented statistic is unnecessary.","evidence":"Vocabulary handout p. 3, exacerbate example; cloze p. 5, environmental pressure and social tensions.","topic":"people"},{"id":"c10","type":"open","prompt":"The cloze links adaptation with social justice. What would a fair response need to consider, and why?","points":3,"model":"A fair response would consider how environmental measures affect people's livelihoods as well as the natural environment. It would involve communities in planning and aim to strengthen their ability to live and work, rather than adding further pressure to them.","criteria":["Includes the livelihoods or needs of affected people.","Identifies community involvement as part of planning.","Explains why the response should reduce harm instead of making people's situation worse."],"explanation":"A response is not fully explained by naming a technology. The question asks about the people affected by the decision.","evidence":"Environmental Challenges cloze, handout p. 5, final sentences on community engagement, social justice and livelihoods.","topic":"people"},{"id":"c11","type":"open","prompt":"Explain the connection between deforestation and habitat loss.","points":2,"model":"Deforestation removes large areas of forest. Because forests provide natural homes for many plants and animals, removing them can destroy or reduce those habitats and make the species that depend on them more vulnerable.","criteria":["Explains that deforestation removes forest.","Connects forest removal to the loss or reduction of natural homes for species."],"explanation":"The second point requires a connection, not merely two separate definitions.","evidence":"Vocabulary handout p. 3, deforestation and habitat loss; cloze p. 5, deforestation and fragmented habitats.","topic":"biodiversity"},{"id":"c12","type":"open","prompt":"How are extinction and biodiversity connected, and how do their meanings differ?","points":3,"model":"Extinction means that a species no longer exists. Biodiversity is the variety of plant and animal life in a place. When a species disappears, that variety can be reduced, so extinction is one way biodiversity is lost.","criteria":["Defines extinction as the complete disappearance of a species.","Defines biodiversity as the variety of plant and animal life.","Explains how species loss reduces variety."],"explanation":"Do not define extinction as the death of one individual animal; the word concerns the species.","evidence":"Vocabulary handout p. 3, extinction and biodiversity; cloze p. 5, species loss.","topic":"biodiversity"},{"id":"c13","type":"open","prompt":"Why does the revision material connect protecting forests with both climate and biodiversity?","points":2,"model":"The vocabulary examples connect forests with carbon storage, so losing them reduces that capacity. Forests also support a rich variety of life, so protecting them helps preserve habitats and biodiversity.","criteria":["Explains the connection between forests and carbon storage.","Explains the connection between forests and habitats or biodiversity."],"explanation":"These are two different benefits. Repeating the habitat benefit in different words earns only one point.","evidence":"Vocabulary handout p. 3, deforestation and biodiversity examples.","topic":"biodiversity"},{"id":"c14","type":"open","prompt":"Explain why habitat loss can make a species vulnerable even before it becomes extinct.","points":2,"model":"Habitat loss reduces or damages the natural home that a species depends on. The species can therefore face a greater risk of harm while it still exists; extinction would mean that it had disappeared completely.","criteria":["Explains increased risk through damage to the natural home.","Distinguishes being at risk from no longer existing."],"explanation":"Vulnerable describes susceptibility to harm, not a guarantee that extinction has already occurred.","evidence":"Vocabulary handout p. 3, habitat loss, vulnerable and extinction.","topic":"biodiversity"},{"id":"c15","type":"open","prompt":"Name two ways households can reduce their carbon footprint in the supplied cloze, and explain the shared aim.","points":3,"model":"Households can insulate their homes and choose trains instead of suitable short flights. Both choices are presented as ways to reduce the carbon dioxide associated with everyday activities and therefore make the household's carbon footprint smaller.","criteria":["Gives one cloze example: insulation, shared rides or train travel instead of short flights.","Gives a different supported cloze example.","Connects both to reducing the carbon dioxide associated with activities."],"explanation":"Two transport examples are acceptable if they are distinct and both are supported. The definition of carbon footprint should be used accurately.","evidence":"Vocabulary handout p. 3, carbon footprint; cloze p. 5, household responses.","topic":"energy"},{"id":"c16","type":"open","prompt":"What is the difference between a household action and a change at the energy-system level? Give one supplied example of each.","points":2,"model":"A household can improve its own home's insulation. A change at the energy-system level affects wider infrastructure, such as moving electricity supply towards renewable sources or improving energy storage. The examples operate at different scales.","criteria":["Gives a supported action taken at household level.","Gives a supported wider energy or transport investment and distinguishes its scale."],"explanation":"The cloze includes both personal choices and wider changes; neither category replaces the other.","evidence":"Environmental Challenges cloze, handout p. 5, household and system-level responses.","topic":"energy"},{"id":"c17","type":"open","prompt":"What does it mean for an economy to be fossil-fuel-reliant, and what transition does the WIC material suggest?","points":2,"model":"A fossil-fuel-reliant economy depends heavily on coal, oil or gas. The WIC material suggests moving towards renewable energy sources, with wider changes such as improved storage and public transport supporting that transition.","criteria":["Identifies heavy dependence on coal, oil or gas.","Explains a move towards renewable energy sources."],"explanation":"Transition refers to changing systems over time. It is not the same word as simply transporting fuel.","evidence":"Vocabulary handout p. 3, fossil-fuel-reliant and transition; cloze p. 5.","topic":"energy"},{"id":"c18","type":"open","prompt":"Explain harness in an energy context and give the example supported by the vocabulary table.","points":2,"model":"To harness energy means to control and use it for a purpose. The vocabulary example describes engineers using wind to generate electricity, so a natural force is being put to practical use.","criteria":["Explains control and useful application of energy or a natural force.","Uses wind generating electricity as the supported example."],"explanation":"The answer should show the energy meaning of the verb rather than an unrelated noun meaning.","evidence":"Vocabulary handout p. 3, harness definition and example.","topic":"energy"},{"id":"c19","type":"open","prompt":"Why is the word net important in the supplied definition of carbon-neutral?","points":2,"model":"Net refers to the overall balance. Carbon-neutral therefore means no net release of carbon dioxide, rather than automatically meaning that no carbon dioxide is produced at any stage of every activity.","criteria":["Explains net as an overall balance.","Distinguishes no net release from an automatic claim of no emissions at any stage."],"explanation":"This question practises careful interpretation of the supplied definition. It does not require details of any particular accounting system.","evidence":"Vocabulary handout p. 4, carbon-neutral definition.","topic":"energy"},{"id":"c20","type":"open","prompt":"How can improper waste disposal lead to contamination? Use a supplied example to explain the link.","points":2,"model":"If waste is disposed of in an unsuitable way, it can pollute the place where it ends up. The WIC example connects improper disposal with contaminated rivers, where water becomes dirty or unsafe.","criteria":["Explains the link between unsuitable disposal and pollution.","Uses the supported river example and explains contamination as reduced cleanliness or safety."],"explanation":"Merely saying that waste is bad does not explain the process or its effect.","evidence":"Vocabulary handout p. 4, improper waste disposal and contamination entries.","topic":"waste"},{"id":"c21","type":"open","prompt":"Explain how repair contributes to a circular economy.","points":2,"model":"Repair allows a product to remain useful instead of being discarded immediately. This supports a circular economy because materials stay in use and less waste is created.","criteria":["Explains that repair extends a product's useful life.","Links longer use to retaining materials or reducing waste."],"explanation":"Repair is connected to the definition of circular economy; it is not just an isolated helpful activity.","evidence":"Vocabulary handout p. 4, circular economy example; cloze p. 5, keeping materials useful and normalising repair.","topic":"waste"},{"id":"c22","type":"open","prompt":"How does a circular-economy approach differ from only dealing with waste after products are discarded?","points":3,"model":"A circular-economy approach aims to keep materials useful through reuse and repair. It also considers product design and supply chains so that waste is reduced from the start. Dealing only with discarded waste acts later, after the materials have already left their first use.","criteria":["Explains reuse or repair as a way to retain useful materials.","Includes prevention through design or supply chains.","Clearly distinguishes prevention and continued use from handling waste afterwards."],"explanation":"The cloze places emphasis on the whole material cycle, including the stage before a product becomes waste.","evidence":"Vocabulary handout p. 4, circular economy; cloze p. 5, supply chains, repair and designing out waste.","topic":"waste"},{"id":"c23","type":"open","prompt":"What is incineration, and why is it a different action from repairing a product?","points":2,"model":"Incineration means burning waste. Repair restores a product so that it can continue to be used. The actions differ because one deals with discarded material by burning it, while the other keeps a product in use.","criteria":["Defines incineration as burning waste.","Explains that repair keeps a product in use and therefore differs from burning it."],"explanation":"No claim that incineration solves every waste problem is needed or supported by the definition.","evidence":"Vocabulary handout p. 4, incineration and circular economy examples.","topic":"waste"},{"id":"c24","type":"open","prompt":"How could a policy that rewards product durability support the circular-economy aim in the supplied cloze?","points":2,"model":"Rewarding durability encourages producers to make products that remain useful for longer. Longer use can reduce the need to discard and replace products, helping to keep materials valuable and reduce waste.","criteria":["Explains how a reward can encourage longer-lasting products.","Connects longer useful life to material retention or reduced waste."],"explanation":"This is a reasoned connection between two ideas in the cloze. Other clear explanations of that link are acceptable.","evidence":"Environmental Challenges cloze, handout p. 5, incentives for durability and circular supply chains.","topic":"waste"},{"id":"c25","type":"open","prompt":"What does incentivise mean, and how can governments use it to encourage cleaner production?","points":2,"model":"To incentivise means to encourage an action by offering a benefit. Governments can offer support such as favourable loans or tax benefits to make investment in cleaner production more attractive.","criteria":["Defines incentivise as encouragement through a benefit.","Gives a supported benefit linked to cleaner production or technology."],"explanation":"A command and an incentive are different ideas. The answer should identify what makes the desired action attractive.","evidence":"Vocabulary handout p. 4, incentivise and tax-credit example; cloze p. 5, loans and cleaner production.","topic":"action"},{"id":"c26","type":"open","prompt":"What is the difference between mitigating a problem and claiming that the problem has disappeared? Give an environmental example from the notes.","points":2,"model":"Mitigating a problem means making it less serious or harmful, so some of it may remain. Better insulation can reduce energy waste, for example, without proving that every source of energy waste has disappeared.","criteria":["Distinguishes reducing harm from completely removing the problem.","Gives a supported environmental example that illustrates reduction."],"explanation":"The meaning of mitigate is deliberately more limited than eliminate. The answer should preserve that difference.","evidence":"Vocabulary handout p. 3, mitigate definition and insulation example.","topic":"action"},{"id":"c27","type":"open","prompt":"Why can an environmental response remain controversial? Use the vocabulary table's example and avoid adding an unsupported conclusion.","points":2,"model":"A response can remain controversial because people continue to disagree about it. The table uses nuclear power as an example and identifies radioactive waste as a reason for the disagreement, without giving a final judgement that everyone must accept.","criteria":["Explains continuing disagreement as the meaning of remain controversial.","Identifies nuclear power and the concern about radioactive waste from the supplied example."],"explanation":"Report the example accurately. This is a reading and vocabulary question, not a request to decide the whole energy debate.","evidence":"Vocabulary handout p. 4, remain controversial definition and example.","topic":"action"},{"id":"c28","type":"open","prompt":"What makes an environmental response well connected to a problem? Choose one response from the notes and explain the problem, the action and its intended effect.","points":3,"model":"Improper waste disposal can contaminate rivers. A circular-economy approach promotes repair and continued use of materials so that less waste needs to be discarded. Its intended effect is to reduce avoidable waste at an earlier stage, although safe handling of remaining waste is still necessary.","criteria":["Identifies a supported environmental problem clearly.","Chooses a relevant response from the supplied notes.","Explains the intended connection between the response and a reduction in harm, without claiming it solves every problem."],"explanation":"Other supported examples can receive full credit, such as home insulation and energy waste or forest protection and habitat loss. Assess the reasoning, not a keyword count.","evidence":"Vocabulary handout pp. 2–4 and Environmental Challenges cloze p. 5; synthesis question.","topic":"action"}],"method":{"verified":false,"notice":"General four-step practice aid, not the teacher's verified four steps. The requested exact four-step overview is absent. The supplied lesson slides do contain genuine detailed-reading and task-specific guidance, summarised separately below. Their five lesson phases and the Florida page 58 five-step group placemat activity are not relabelled as the missing method.","steps":[{"title":"Preview and set a purpose","description":"Look at the title and task instructions. Predict the topic, identify the response language and notice what kind of answer is required.","action":"Write one prediction and check whether the task asks for a choice, an exact word, a short explanation or German mediation."},{"title":"Read for meaning","description":"Read the paragraphs carefully. Identify the main idea, mark unfamiliar words, distinguish people or viewpoints, and create short headings in your own words.","action":"Give each paragraph a short heading. Note a cause, an effect or a response that seems important."},{"title":"Find evidence for the task","description":"Return to the relevant paragraph. Compare the question with the passage using meaning and context, including paraphrases. Check limiting words such as only and not.","action":"Identify the sentence or linked sentences that support your answer. For multiple choice, explain why the other options fail."},{"title":"Answer and review","description":"Give only the requested information in the requested language. Check that all parts are answered and that your wording is clear and grammatically suitable.","action":"Check the evidence, number of requested points, word or phrase length, response language and spelling before moving on."}],"taskGuidance":[{"type":"mc","title":"Verified teacher guidance: multiple choice","points":["Select one fully correct option and consider every alternative.","Use the surrounding context; synonyms, opposites and paraphrases can help locate evidence.","Eliminate options whose claims are unsupported or contain an error, and pay special attention to NOT.","The lesson slide suggests checking unknown words in a dictionary. It does not establish permission to use a dictionary in the actual exam.","On a paper answer sheet, make a changed selection unambiguous. In this app, choosing another option replaces the earlier choice."],"source":"English_Lesson_Climate_and_Outdoor_Communities.pptx, slide 7 embedded table; For the love of nature Aufgaben.pdf, p. 1."},{"type":"mediation","title":"Verified teacher guidance: English to German mediation","points":["Answer the German question in German and use the English text to identify the relevant meaning.","Use natural, idiomatic German and give one best version.","Communicate all the required information; do not translate mechanically word by word or list alternative versions.","Check tense, singular and plural forms, prepositions and word order.","When completing a supplied German sentence, make the answer fit that sentence grammatically."],"source":"English_Lesson_Climate_and_Outdoor_Communities.pptx, slide 8 embedded table; For the love of nature Aufgaben.pdf, p. 2, English–German mediation."},{"type":"open","title":"Verified teacher guidance: short answers","points":["Answer an English question in English and use the context to identify the required information.","You may copy the relevant word or phrase when the question asks for it, but stop at the correct boundary.","If one word is requested, give one word. If an expression or several words are requested, provide the needed phrase.","Obey a requested word class such as verb, noun or adjective, and distinguish a metaphorical expression from a literal description.","For several content points, look for linked details in the surrounding text and include every requested point without copying an unnecessarily long passage."],"source":"English_Lesson_Climate_and_Outdoor_Communities.pptx, slide 9 embedded table; For the love of nature Aufgaben.pdf, p. 2, short-answer instructions."}],"detailedReadingGuidance":{"title":"Verified teacher guidance: paragraph reading","points":["Read each paragraph slowly and in detail.","Underline unfamiliar words and complete the word list while reading.","Highlight main information, using a different colour for people mentioned.","Create a heading that summarises each paragraph in your own words, without copying whole phrases."],"source":"English_Lesson_Climate_and_Outdoor_Communities.pptx, slide 5 embedded image."}}},"readings":[{"id":"r01","title":"Reading the Climate Record in a Culture of Consumption","source":"Quellenbasierter eigener Sachtext auf Grundlage der angegebenen Fachquellen; keine Original-Prüfungsaufgabe.","level":"B2","minutes":45,"examOnly":false,"paragraphs":[{"label":"A","text":"A photograph of a rubbish-strewn beach can become a poster child for environmental decline. Its message is immediate: disposable objects remain after the shopper has gone. Climate change is harder to picture. It may be shrouded in graphs, probability ranges and arguments about individual storms. Yet the scientific case does not rest on one dramatic image. NASA describes several independent lines of evidence, including rising global temperatures, warming oceans, shrinking ice sheets and changes in glaciers. These observations fit the physical fact that carbon dioxide and other greenhouse gases trap heat. The conclusion is therefore not a guess based on a hot afternoon; it is an explanation that connects measurements made across the atmosphere, oceans, land and ice."},{"label":"B","text":"Attribution asks a more demanding question: not only whether the climate is changing, but why. Natural factors have always affected climate, and scientific attribution examines them. NASA identifies human activity as the principal cause of current warming and reports that changes in solar energy cannot explain the observed trend. Human activities, especially burning fossil fuels, have increased heat-trapping gases. Those emissions intensify an existing greenhouse effect rather than inventing a new one. Attribution draws a profound distinction between two uncertainties: the exact scale and timing of particular regional impacts may remain uncertain, but this does not make the challenge insurmountable or its main cause unknowable. A doctor, similarly, can be unsure how quickly an illness will develop while still identifying its cause."},{"label":"C","text":"Consumption belongs in this account because emissions do not begin and end at a power station. A life-cycle account follows products through extraction, manufacture, transport, use and disposal; the EPA likewise contrasts circular systems with a linear model in which resources are mined, made into products and then become waste. An affluent society with a ravenous appetite for new goods can move pollution out of sight without removing it. A phone may appear clean at the point of use, while energy and material demands lurk in its supply chain. A supposedly imperishable plastic is not literally eternal, but many durable plastics decompose extremely slowly and may lodge themselves in terrestrial or aquatic environments. Replacing every item with a fashionable 'green' version can therefore leave an insatiable demand for materials largely untouched, even when each product has a smaller carbon footprint."},{"label":"D","text":"This produces a policy paradox. Individual choices affect demand, yet presenting climate change only as personal wrongdoing can hide the systems that shape those choices. A commuter cannot transition from a car to reliable public transport that does not exist; a tenant may not control an inefficient heating system. At the same time, institutions cannot tackle the issue of consumption while assuming that habits never change. Reusable containers, repair and longer product use can reduce demand for new materials, but their efficacy depends on design, access and repeated use. A reusable object that is quickly discarded merely wears a reassuring label. Policy analysis therefore connects personal practice with infrastructure, product standards and public investment, rather than declaring either consumers or governments solely responsible."},{"label":"E","text":"Communication creates another difficulty. A dire headline may attract attention, but a constant stream of devastating images can produce numbness. The term psychic numbing describes the concern that vast, repeated suffering may become emotionally difficult to process. For campaigners, this creates an infuriating balance: understated danger may delay action, while descriptions of every outcome as inevitable may lead audiences to conclude that action is pointless. Some people mourn visible losses, such as a damaged landscape, more readily than statistical risks. Others find the convenience and status of consumption intoxicating enough to discount distant costs. One communication framework separates reassurance from certainty: it distinguishes what is well established, what remains uncertain and which choices could still mitigate harm."},{"label":"F","text":"Competing policies reveal similar tensions. A carbon price can incentivise lower-emission choices across an economy, but its fairness depends on how costs and revenues are distributed. Regulation can intervene directly by setting efficiency or durability standards, although poorly designed rules may protect established firms or raise prices. Public investment can expand clean electricity and transport, but projects require land, materials and consent. Appeals to buy less may reduce waste, yet they can affect households differently because incomes and emissions vary widely. These differences explain why policy packages remain controversial: each instrument has strengths, limits and side effects, and a fossil-fuel-reliant economy cannot change through a single switch."},{"label":"G","text":"A circular economy offers one framework for reducing material pressure. In the EPA's account, such an economy keeps materials and products in circulation and aims to eliminate waste. That can mean designing goods to be maintained, repaired, reused or remanufactured. Increased circulation, however, does not by itself limit the total volume of production. Recycling requires collection, sorting and energy, and some materials lose quality. Nor does circularity automatically address climate change if the system still runs on high-emission energy. The framework therefore links several aims: slowing the flow of new resources, extending useful lives and combining material efficiency with cleaner power. In this account, waste prevention and climate mitigation are connected, but neither is a complete substitute for the other."},{"label":"H","text":"Public debate often contrasts rapid intervention with gradual adjustment, and personal behaviour with technological change. The evidence establishes the physical diagnosis, while values, distributional effects and practical constraints influence the selection of responses. Human influence is so extensive that some writers discuss it in terms of a geological epoch, although the formal label is separate from the observed climatic and material pressures. Organisations campaign for different combinations of lower consumption, regulation, infrastructure and innovation. No single product would cause emissions to fall precipitously, and no particular policy outcome is inevitable simply because every instrument has limitations. Monitoring results and revising measures allow uncertainty to be incorporated into decisions about this pressing challenge."}],"sources":[{"title":"Evidence","url":"https://science.nasa.gov/climate-change/evidence/","publisher":"NASA"},{"title":"Causes","url":"https://science.nasa.gov/climate-change/causes/","publisher":"NASA"},{"title":"What is a Circular Economy?","url":"https://www.epa.gov/circulareconomy/what-circular-economy","publisher":"United States Environmental Protection Agency"},{"title":"‘If I look at the mass I will never act’: Psychic numbing and genocide","url":"https://doi.org/10.1017/S1930297500000061","publisher":"Judgment and Decision Making"}],"vocabIds":["a01","a02","a03","a04","a05","a06","a07","a08","a09","a10","a11","a12","a13","a14","a15","a16","a17","a18","a19","a20","a21","a22","a23","a24","a25","a26","a27","a28","a29","a30","wic01","wic02","wic03","wic11","wic13","wic20","wic21","wic22","wic24","wic25","wic27","wic28","wic33"],"vocabCoverage":[{"id":"a01","quote":"rubbish-strewn beach"},{"id":"a02","quote":"shrouded in graphs"},{"id":"a03","quote":"intoxicating enough"},{"id":"a04","quote":"the challenge insurmountable"},{"id":"a05","quote":"Organisations campaign"},{"id":"a06","quote":"produce numbness"},{"id":"a07","quote":"psychic numbing"},{"id":"a08","quote":"A dire headline"},{"id":"a09","quote":"mourn visible losses"},{"id":"a10","quote":"an infuriating balance"},{"id":"a11","quote":"This produces a policy paradox"},{"id":"a12","quote":"intervene directly"},{"id":"a13","quote":"fall precipitously"},{"id":"a14","quote":"their efficacy depends"},{"id":"a15","quote":"Reusable containers"},{"id":"a16","quote":"a poster child"},{"id":"a17","quote":"a profound distinction"},{"id":"a18","quote":"a geological epoch"},{"id":"a19","quote":"declaring either consumers or governments solely responsible"},{"id":"a20","quote":"disposable objects"},{"id":"a21","quote":"many durable plastics"},{"id":"a22","quote":"A supposedly imperishable plastic"},{"id":"a23","quote":"policy outcome is inevitable"},{"id":"a24","quote":"decompose extremely slowly"},{"id":"a25","quote":"lurk in its supply chain"},{"id":"a26","quote":"terrestrial or aquatic environments"},{"id":"a27","quote":"lodge themselves in terrestrial or aquatic environments"},{"id":"a28","quote":"personal wrongdoing"},{"id":"a29","quote":"a ravenous appetite"},{"id":"a30","quote":"an insatiable demand"},{"id":"wic01","quote":"intensify an existing greenhouse effect"},{"id":"wic02","quote":"pressing challenge"},{"id":"wic03","quote":"trap heat"},{"id":"wic11","quote":"devastating images"},{"id":"wic13","quote":"tackle the issue of consumption"},{"id":"wic20","quote":"mitigate harm"},{"id":"wic21","quote":"carbon footprint"},{"id":"wic22","quote":"transition from a car to reliable public transport"},{"id":"wic24","quote":"An affluent society"},{"id":"wic25","quote":"a fossil-fuel-reliant economy"},{"id":"wic27","quote":"incentivise lower-emission choices"},{"id":"wic28","quote":"policy packages remain controversial"},{"id":"wic33","quote":"A circular economy"}],"questions":[{"id":"r01q01","type":"mc","prompt":"Which statement about paragraph A is NOT true?","choices":["A polluted beach provides a more immediate visual message than climate graphs.","Climate evidence combines observations from several parts of the Earth system.","One striking photograph is sufficient evidence for the scientific explanation of climate change.","The greenhouse effect connects heat-trapping gases with the observed changes."],"answer":2,"points":1,"explanation":"Option 2 is the only false statement because the paragraph explicitly says the case does not depend on one dramatic image. Options 0, 1 and 3 accurately paraphrase the contrast, the multiple evidence lines and their physical explanation.","evidence":"Paragraph A: “Yet the scientific case does not rest on one dramatic image.”"},{"id":"r01q02","type":"mc","prompt":"Complete the sentence according to paragraph B: Uncertainty about regional climate impacts ...","choices":["prevents scientists from distinguishing human influence from natural factors.","shows that changes in solar energy are probably driving current warming.","can coexist with a well-supported conclusion about the principal cause of warming.","means that medical comparisons provide stronger evidence than climate measurements."],"answer":2,"points":1,"explanation":"Option 2 completes the distinction between uncertain regional details and supported attribution. Option 0 collapses those two questions; option 1 contradicts NASA's solar finding; option 3 mistakes an analogy for scientific evidence.","evidence":"Paragraph B: “the exact scale and timing of particular regional impacts may remain uncertain, but this does not make the challenge insurmountable or its main cause unknowable”"},{"id":"r01q03","type":"mc","prompt":"Why does paragraph D discuss both commuters and reusable objects?","choices":["To argue that consumers should wait for governments before changing any behaviour.","To claim that public transport is always more effective than reducing packaging.","To show that product labels are a sufficient guide to environmental impact.","To demonstrate that individual action is constrained by systems and also depends on how choices are actually used."],"answer":3,"points":1,"explanation":"Both examples qualify simple appeals to personal responsibility: infrastructure limits some choices, while the benefit of a reusable product depends on repeated use. Options 0–2 each turn a conditional argument into an absolute claim.","evidence":"Paragraph D: “Policy analysis therefore connects personal practice with infrastructure, product standards and public investment”"},{"id":"r01q04","type":"mc","prompt":"What limitation of a circular economy does paragraph G identify?","choices":["Keeping products in circulation is useful but cannot justify endless output or replace cleaner energy.","Repair and remanufacture usually consume more resources than producing new goods.","Recycling should be abandoned because materials always lose all their quality.","Waste prevention has no meaningful relationship to climate mitigation."],"answer":0,"points":1,"explanation":"The paragraph supports circularity while marking its boundaries. Option 1 is not stated; option 2 exaggerates partial quality loss; option 3 directly contradicts the conclusion that the two aims are connected.","evidence":"Paragraph G: “Increased circulation, however, does not by itself limit the total volume of production.”"},{"id":"r01q05","type":"mediation","prompt":"Für eine kurze deutsche Übersicht vergleichst du die beiden politischen Ansätze in Absatz F: CO₂-Bepreisung und Regulierung. Stelle zu jedem Ansatz die mögliche Wirkung und eine genannte Einschränkung dar.","points":2,"model":"Eine CO₂-Bepreisung kann in der gesamten Wirtschaft Anreize für emissionsärmere Entscheidungen schaffen. Wie gerecht sie wirkt, hängt jedoch davon ab, wie Kosten und Einnahmen verteilt werden. Regulierung greift direkter ein, etwa durch Effizienz- oder Haltbarkeitsstandards. Schlecht gestaltete Vorschriften können allerdings etablierte Unternehmen schützen oder Preise erhöhen. Beide Ansätze können somit Emissionen beeinflussen, haben aber unterschiedliche Risiken.","criteria":["CO₂-Bepreisung kann emissionsärmere Entscheidungen in der gesamten Wirtschaft anregen.","Ihre Fairness hängt von der Verteilung der Kosten und Einnahmen ab.","Regulierung kann durch Effizienz- oder Haltbarkeitsstandards direkt eingreifen.","Schlecht gestaltete Regeln können etablierte Unternehmen schützen oder Preise erhöhen."],"criterionPoints":[0.5,0.5,0.5,0.5],"explanation":"Die Antwort soll zwei Ansätze knapp vergleichen und für jeden genau eine mögliche Wirkung sowie eine Einschränkung vermitteln; eine Satz-für-Satz-Übersetzung ist nicht nötig.","evidence":"Absatz F: “A carbon price can incentivise lower-emission choices across an economy, but its fairness depends on how costs and revenues are distributed.” / “Regulation can intervene directly by setting efficiency or durability standards, although poorly designed rules may protect established firms or raise prices.”"},{"id":"r01q06","type":"text","prompt":"Which expression in paragraph E means a reduced emotional response when suffering is presented on a very large scale?","answer":["psychic numbing"],"points":1,"explanation":"The expression names the difficulty of processing vast, repeated suffering emotionally; the surrounding examples distinguish it from simple lack of information.","evidence":"Paragraph E: “The term psychic numbing describes the concern that vast, repeated suffering may become emotionally difficult to process.”","task":"short-answer"},{"id":"r01q07","type":"text","prompt":"Which expression in paragraph C means the complete sequence from extracting resources to making, using and disposing of a product?","answer":["life-cycle account"],"points":1,"explanation":"The expression covers the linked stages of a product rather than only the emissions visible while it is being used.","evidence":"Paragraph C: “A life-cycle account follows products through extraction, manufacture, transport, use and disposal”","task":"short-answer"}]},{"id":"r02","title":"Florida’s Moving Coastline: Adaptation Beyond a Higher Wall","source":"Eigener Sachtext auf Grundlage der angegebenen Fachquellen; keine Original-Prüfungsaufgabe.","level":"B2+","minutes":45,"examOnly":false,"paragraphs":[{"label":"A","text":"Along Florida’s low-lying coast, climate adaptation is often presented as a contest between land and water. The reality is less dramatic but more demanding. As oceans warm, seawater expands; melting land ice adds more water. A 2022 federal report projected that average sea level along the United States coast would rise about 10–12 inches between 2020 and 2050, roughly as much as during the previous century. A higher starting point allows ordinary tides and storm surges to inundate places more often. Heavy precipitation can then compound tidal flooding because drainage systems must move rainwater into an already elevated sea. Thus, coastal communities must contend with several connected pressures, not one distant disaster. The report forecasts a range, not a street-level promise: local land movement, currents and storms alter the result, so planners need regional scenarios and local measurements."},{"label":"B","text":"Florida’s water system makes the problem particularly complex. Much of the state relies on porous limestone aquifers, canals and pumps. Near the coast, fresh groundwater and seawater meet below ground. If freshwater levels fall relative to the sea, saltwater can move inland and salinity can increase in wells. USGS research in southeastern Florida shows that both sea-level rise and groundwater pumping influence this boundary. Drought or unusually low precipitation may exacerbate the imbalance, while intense rain can overload canals without restoring every aquifer equally. A flood barrier therefore cannot by itself protect a drinking-water source. Water managers may divert canal flows, relocate wells, limit pumping or store more freshwater, but each measure changes the wider watershed. The lesson is important: visible flooding and invisible saltwater intrusion are different hazards, although the same water-management choices may affect both."},{"label":"C","text":"Engineers can retrofit roads, drainage outlets, sewage plants and buildings. Pumps may remove water where gravity drainage no longer works; raised electrical equipment can keep a facility operating; restored dunes or wetlands may buffer waves. Such infrastructure can mitigate damage, yet performance has limits. A pump designed for yesterday’s rainfall and tide may fail once a critical threshold is crossed. Concrete walls can protect assets behind them but may redirect water, interrupt habitats or worsen erosion nearby. Nature-based measures need space and maintenance, and they cannot stop every surge. For that reason, sound design does not select one supposedly permanent solution. It combines defences, monitors results and leaves room to recalibrate plans as observations change. The goal is resilience—the capacity to withstand disruption, recover and adjust—not the unrealistic elimination of all coastal risk."},{"label":"D","text":"Money turns technical choices into political ones. Local authorities must allocate limited funds among drainage, transport, water supply, emergency services and housing. Protecting a dense business district may preserve jobs and tax revenue, whereas repeatedly repairing an isolated road may become unaffordable. Nevertheless, a calculation based only on property value can leave vulnerable residents behind. Renters, older people, low-income households and those without cars may face evacuation costs or deteriorating housing long before a structure is officially unsafe. Their livelihood may depend on a coastal workplace even if they live inland. An equitable plan therefore asks who receives protection, who pays, who can obtain insurance and who might be displaced by either flooding or rising housing costs. Distribution is not an optional moral extra; it affects whether adaptation works in practice."},{"label":"E","text":"Some officials advocate protective construction because delay can lock in larger losses. Others argue that government should curtail development in the most exposed areas and avoid subsidising repeated rebuilding. The dispute becomes contentious when a new sea wall protects one neighbourhood but changes access, views or erosion elsewhere. A voluntary property purchase may reduce future exposure, but an offer based on past market prices may not enable a family to remain near work, schools and relatives. Conversely, promising to defend every parcel indefinitely can consume money needed for hospitals or clean water. These are genuine trade-offs, not evidence that planning has failed. Transparent maps, published assumptions and meaningful participation can galvanize residents around a shared decision, while secrecy and technical language can deepen mistrust."},{"label":"F","text":"Uncertainty is sometimes used as a reason to wait, but it should change the type of decision rather than stop decisions altogether. A sea-level trajectory describes a range shaped by future emissions and physical responses; it does not identify the exact year when a particular doorway will flood. Planners can therefore favour measures that perform under several scenarios. A park that stores stormwater may provide recreation today and flood capacity later. A bridge can be built so that it is easier to raise, and land beside a wetland can be kept free rather than developed. Monitoring groundwater, tides and land elevation helps authorities revise trigger points. If observed change approaches a threshold sooner than expected, they can mobilize crews and funding; if it proceeds more slowly, they have not necessarily wasted an adaptable investment."},{"label":"G","text":"Adaptation can also create new risk. Higher flood protection may encourage more construction behind it, increasing the eventual consequences if the defence is overtopped. Draining canals to protect streets can lower connected fresh groundwater levels or move polluted runoff into a lagoon. Elevating homes may reduce direct damage but leave residents stranded when roads, power and sewers fail. These interactions underpin the case for regional planning: water crosses municipal boundaries, and one town’s drainage decision can affect another. Officials need to compare the lifetime cost of maintaining a project with the changing value it protects. They also need honest exit strategies. In some locations, moving a service or building away from repeated floods may be safer than continually attempting to hold the shoreline in place."},{"label":"H","text":"Coastal plans do not fall into two exclusive categories called adaptation and retreat. Communities can combine protection, accommodation and relocation in different places and at different times. Immediate maintenance addresses present hazards from blocked drains and weak roofs; long-term land-use rules address exposure created by construction that may remain for decades. Federal projections and USGS groundwater models describe physical conditions, while local evidence identifies which bus route, clinic or well is indispensab
