rs":["compound"],"explanation":"The base verb follows “would”; the leak would add another difficulty to existing problems."},{"sentence":"Last summer, a power cut {gap} the effects of the heatwave by stopping household fans.","answers":["compounded"],"explanation":"The past form describes an extra problem that increased existing harm."},{"sentence":"Rising repair costs are {gap} the financial pressure on families whose homes flooded.","answers":["compounding"],"explanation":"“Are” requires the -ing form; higher costs add to pressure that already exists."}],"def":"To worsen a problem by adding another difficulty or harmful factor."},{"id":"b12","unit":"4B","term":"vulnerable","sourceTerm":"vulnerable","de":"verletzlich; gefährdet","level":"Core","forms":["vulnerable"],"contexts":[{"sentence":"Basement flats are particularly {gap} to water entering during a flash flood.","answers":["vulnerable"],"explanation":"The adjective combines with “to” to identify a specific risk of harm."},{"sentence":"The emergency plan offers extra support to {gap} residents who need help reaching shelters.","answers":["vulnerable"],"explanation":"The adjective describes residents especially exposed to harm."},{"sentence":"When the sea wall cracked, the homes behind it became more {gap}.","answers":["vulnerable"],"explanation":"After “became more”, the adjective means more exposed to danger."}],"def":"At risk of being harmed or damaged."},{"id":"b13","unit":"4B","term":"retrofit","sourceTerm":"to retrofit","de":"nachrüsten","level":"Stretch","forms":["retrofit","retrofits","retrofitted","retrofitting"],"contexts":[{"sentence":"The city plans to {gap} older homes with stronger roof connections.","answers":["retrofit"],"explanation":"The base verb follows “to”; it means add protective features to existing buildings."},{"sentence":"The school was {gap} with more efficient lighting during last year’s renovation.","answers":["retrofitted"],"explanation":"After “was”, use the past participle for changes made to an existing building."},{"sentence":"By {gap} old pumps with modern controls, the water company hopes to reduce electricity use.","answers":["retrofitting"],"explanation":"After “by”, use the -ing form; double the final “t” before “ing”."}],"def":"To equip an existing building or system with newer features or technology."},{"id":"b14","unit":"4B","term":"watershed","sourceTerm":"watershed","de":"Einzugsgebiet","level":"Stretch","forms":["watershed","watersheds"],"contexts":[{"sentence":"Pollution anywhere in the river’s {gap} can be carried downstream towards the bay.","answers":["watershed"],"explanation":"The noun refers to the surrounding land that drains into this river."},{"sentence":"The two neighbouring {gap} send rainwater into different lakes.","answers":["watersheds"],"explanation":"“Two” requires the plural; each land area drains towards a different destination."},{"sentence":"The map outlines the {gap} that supplies the town’s reservoir.","answers":["watershed"],"explanation":"The singular noun names the area whose water drains into the reservoir, not a turning point."}],"def":"The land area from which water drains into the same river, lake or other water body."},{"id":"b15","unit":"4B","term":"salinity","sourceTerm":"salinity","de":"Salzgehalt; Salinität","level":"Stretch","forms":["salinity"],"contexts":[{"sentence":"After seawater entered the well, tests showed that its {gap} had increased.","answers":["salinity"],"explanation":"The noun refers to the amount of dissolved salt in the well water."},{"sentence":"Farmers monitor soil {gap} because some crops cannot tolerate much salt.","answers":["salinity"],"explanation":"The uncountable noun names the soil’s salt concentration."},{"sentence":"The class compared the {gap} of freshwater, seawater and water from the river mouth.","answers":["salinity"],"explanation":"The noun identifies the salt concentration being measured in each sample."}],"def":"The concentration of salt in water or soil."},{"id":"b16","unit":"4B","term":"galvanize","sourceTerm":"to galvanize","de":"aufrütteln; mobilisieren","level":"Stretch","forms":["galvanize","galvanizes","galvanized","galvanizing","galvanise","galvanises","galvanised","galvanising"],"contexts":[{"sentence":"The photographs of flooded classrooms could {gap} parents into demanding safer buildings.","answers":["galvanize","galvanise"],"explanation":"The base verb follows “could”; the photographs may provoke action. Both spelling variants are accepted."},{"sentence":"Last year’s sewage spill {gap} the community into organising a river-protection campaign.","answers":["galvanized","galvanised"],"explanation":"The past form describes an event that stirred people into action."},{"sentence":"The campaign hopes its clear account of local risks will {gap} support for the flood plan.","answers":["galvanize","galvanise"],"explanation":"The base verb follows “will”; it means stimulate active support."}],"def":"To stir people strongly enough that they take action."},{"id":"b17","unit":"4B","term":"curtail","sourceTerm":"to curtail","de":"einschränken; kürzen","level":"Stretch","forms":["curtail","curtails","curtailed","curtailing"],"contexts":[{"sentence":"Officials may {gap} lawn watering if the dry weather continues.","answers":["curtail"],"explanation":"The base verb follows “may”; it means limit an activity."},{"sentence":"The factory {gap} production during last summer’s water shortage.","answers":["curtailed"],"explanation":"The past form describes a reduction during a completed period."},{"sentence":"The town is {gap} vehicle access to the fragile beach habitat.","answers":["curtailing"],"explanation":"“Is” requires the -ing form for an ongoing restriction."}],"def":"To reduce the amount, extent or duration of something."},{"id":"b18","unit":"4B","term":"contentious","sourceTerm":"contentious","de":"umstritten; strittig","level":"Stretch","forms":["contentious"],"contexts":[{"sentence":"Deciding which neighbourhood receives the first sea-wall repairs proved {gap}.","answers":["contentious"],"explanation":"The adjective describes a decision that caused disagreement."},{"sentence":"The proposal to move homes away from the shore became a {gap} topic at the meeting.","answers":["contentious"],"explanation":"The adjective before “topic” means likely to lead to argument."},{"sentence":"Residents asked for an open discussion of the most {gap} parts of the flood plan.","answers":["contentious"],"explanation":"The adjective describes the parts most likely to divide opinions."}],"def":"Likely to provoke disagreement or argument."},{"id":"b19","unit":"4B","term":"advocate","sourceTerm":"to advocate","de":"befürworten; eintreten für","level":"Core","forms":["advocate","advocates","advocated","advocating"],"contexts":[{"sentence":"The campaigners {gap} restoring wetlands as part of the flood strategy.","answers":["advocate"],"explanation":"The plural subject takes the base present form; “advocate” can be followed directly by an -ing activity."},{"sentence":"At yesterday’s meeting, the engineer {gap} stronger building standards along the coast.","answers":["advocated"],"explanation":"The past form fits the completed public statement of support."},{"sentence":"The student group is {gap} better public transport to reduce car use.","answers":["advocating"],"explanation":"“Is” requires the -ing form for continuing public support of a policy."}],"def":"To speak publicly in support of an idea, policy or course of action."},{"id":"b20","unit":"4B","term":"inundate","sourceTerm":"to inundate","de":"überschwemmen; überfluten","level":"Stretch","forms":["inundate","inundates","inundated","inundating"],"contexts":[{"sentence":"A storm surge could {gap} the low-lying streets beside the harbour.","answers":["inundate"],"explanation":"The base verb follows “could”; the streets may be covered with floodwater."},{"sentence":"The shops were {gap} when the river overflowed during last night’s storm.","answers":["inundated"],"explanation":"After “were”, use the past participle to describe buildings flooded with water."},{"sentence":"Water from the damaged canal is {gap} the nearby fields.","answers":["inundating"],"explanation":"“Is” requires the -ing form for flooding that is happening now."}],"def":"To cover with floodwater or overwhelm with a large amount of something."},{"id":"b21","unit":"4B","term":"equitable","sourceTerm":"equitable","de":"gerecht; fair","level":"Core","forms":["equitable"],"contexts":[{"sentence":"The council wants an {gap} distribution of repair funds that takes different levels of need into account.","answers":["equitable"],"explanation":"The adjective after “an” means fair; fair support may consider unequal needs."},{"sentence":"Residents argued that the evacuation plan was not {gap} because it ignored people without cars.","answers":["equitable"],"explanation":"The adjective describes fairness in the treatment of different groups."},{"sentence":"An {gap} climate policy should consider how its costs affect both wealthy and poorer households.","answers":["equitable"],"explanation":"The adjective means fair and impartial, rather than simply identical for everyone."}],"def":"Fair and impartial in the way people are treated or resources are shared."},{"id":"b22","unit":"4B","term":"threshold","sourceTerm":"threshold","de":"Schwelle","level":"Stretch","forms":["threshold","thresholds"],"contexts":[{"sentence":"The warning is issued when the river reaches a set {gap}.","answers":["threshold"],"explanation":"The singular noun follows “a set” and names the level that triggers action."},{"sentence":"Different plants have different salt-tolerance {gap}.","answers":["thresholds"],"explanation":"The plural refers to several levels beyond which conditions change for different plants."},{"sentence":"The town uses an income {gap} to decide which households qualify for free flood repairs.","answers":["threshold"],"explanation":"The noun identifies the income level that marks a change in eligibility for financial help."}],"def":"A point or level at which a change begins or a condition is triggered."},{"id":"b23","unit":"4B","term":"recalibrate","sourceTerm":"to recalibrate","de":"neu justieren; neu kalibrieren","level":"Stretch","forms":["recalibrate","recalibrates","recalibrated","recalibrating"],"contexts":[{"sentence":"Technicians must {gap} the flood sensor after replacing its measuring unit.","answers":["recalibrate"],"explanation":"The base verb follows “must”; the sensor needs a precise new adjustment."},{"sentence":"After receiving better rainfall data last month, planners {gap} their flood model.","answers":["recalibrated"],"explanation":"The past form describes adjusting the model to match new information."},{"sentence":"The team is {gap} its warning system to reflect changes in the coastline.","answers":["recalibrating"],"explanation":"“Is” requires the -ing form for a precise adjustment to new conditions."}],"def":"To adjust something precisely so it suits new conditions or information."},{"id":"b24","unit":"4B","term":"trajectory","sourceTerm":"trajectory","de":"Entwicklungskurve; Verlauf","level":"Stretch","forms":["trajectory","trajectories"],"contexts":[{"sentence":"The graph shows the {gap} of the town’s emissions over the last decade.","answers":["trajectory"],"explanation":"The singular noun names the pattern of development over time."},{"sentence":"The report compares two possible {gap} for future coastal development.","answers":["trajectories"],"explanation":"“Two” requires the plural; the report considers two possible paths of change."},{"sentence":"The new energy plan aims to change the upward {gap} of electricity demand.","answers":["trajectory"],"explanation":"The noun refers to the developing direction of demand, not its value at one moment."}],"def":"The direction or pattern of a process as it develops over time."},{"id":"b25","unit":"4B","term":"buffer","sourceTerm":"to buffer","de":"abpuffern; schützen","level":"Stretch","forms":["buffer","buffers","buffered","buffering"],"contexts":[{"sentence":"A belt of restored dunes can {gap} nearby homes against some storm-wave impacts.","answers":["buffer"],"explanation":"The base verb follows “can”; the dunes reduce the force reaching homes."},{"sentence":"The wetland {gap} the village against some floodwater during last winter’s storms.","answers":["buffered"],"explanation":"The past form describes protection that reduced an impact during a completed event."},{"sentence":"The forest is {gap} the riverside path from the strongest winds.","answers":["buffering"],"explanation":"“Is” requires the -ing form; the trees lessen the effect of the wind."}],"def":"To protect against an impact by reducing its force or effect."},{"id":"b26","unit":"4B","term":"divert","sourceTerm":"to divert","de":"umleiten; ablenken","level":"Core","forms":["divert","diverts","diverted","diverting"],"contexts":[{"sentence":"Engineers plan to {gap} excess rainwater into a storage pond.","answers":["divert"],"explanation":"The base verb follows “to”; it means redirect water to another route."},{"sentence":"Yesterday, workers {gap} traffic away from the flooded bridge.","answers":["diverted"],"explanation":"The past form fits yesterday’s completed change in traffic direction."},{"sentence":"The new channel is {gap} runoff towards a wetland instead of the town centre.","answers":["diverting"],"explanation":"“Is” requires the -ing form for directing water along a different path."}],"def":"To make something move along a different route or in a different direction."},{"id":"b27","unit":"4B","term":"forecast","sourceTerm":"to forecast","de":"vorhersagen; prognostizieren","level":"Core","forms":["forecast","forecasts","forecasted","forecasting"],"contexts":[{"sentence":"Meteorologists use satellite observations to {gap} approaching storms.","answers":["forecast"],"explanation":"The base verb follows “to”; it means predict using information."},{"sentence":"Yesterday’s report {gap} heavy rain for the coastal district.","answers":["forecast","forecasted"],"explanation":"Both “forecast” and “forecasted” are accepted past forms for yesterday’s prediction."},{"sentence":"The weather service is {gap} strong winds for tomorrow’s evacuation period.","answers":["forecasting"],"explanation":"“Is” requires the -ing form; tomorrow makes the prediction’s future reference clear."}],"def":"To predict future conditions using available information."},{"id":"b28","unit":"4B","term":"mobilize","sourceTerm":"to mobilize","de":"mobilisieren","level":"Core","forms":["mobilize","mobilizes","mobilized","mobilizing","mobilise","mobilises","mobilised","mobilising"],"contexts":[{"sentence":"The rescue coordinator will {gap} volunteers to check on isolated residents.","answers":["mobilize","mobilise"],"explanation":"The base verb follows “will”; it means organise people for action. Both spelling variants are accepted."},{"sentence":"Last night, local groups {gap} vehicles and supplies for the emergency shelters.","answers":["mobilized","mobilised"],"explanation":"The past form describes resources organised for use during a completed event."},{"sentence":"The city is {gap} repair crews before the storm reaches the coast.","answers":["mobilizing","mobilising"],"explanation":"“Is” requires the -ing form for preparing people for action."}],"def":"To organise people or resources and get them ready for action."},{"id":"b29","unit":"4B","term":"underpin","sourceTerm":"to underpin","de":"untermauern; stützen","level":"Stretch","forms":["underpin","underpins","underpinned","underpinning"],"contexts":[{"sentence":"Reliable rainfall records {gap} the town’s flood-risk calculations.","answers":["underpin"],"explanation":"The plural “records” takes the base present form; the data provide essential support."},{"sentence":"Trust between neighbours {gap} the community’s emergency response.","answers":["underpins"],"explanation":"The singular “trust” takes “underpins”; it forms a foundation for cooperation."},{"sentence":"The earlier coastal plan was {gap} by detailed surveys of local land levels.","answers":["underpinned"],"explanation":"After “was”, use the past participle; double the final “n” before “ed”."}],"def":"To provide essential support or a foundation for something."},{"id":"b30","unit":"4B","term":"trade-off","sourceTerm":"trade-off","de":"Abwägung; Zielkonflikt","level":"Stretch","forms":["trade-off","trade-offs"],"contexts":[{"sentence":"The proposal involves a {gap} between creating more parking and preserving green space.","answers":["trade-off"],"explanation":"The singular noun follows “a” and describes competing benefits that cannot both be maximised."},{"sentence":"Planners discussed the {gap} between building a taller sea wall and keeping an open view of the coast.","answers":["trade-off"],"explanation":"The noun names a compromise between protection and an unobstructed view."},{"sentence":"Every option has {gap}, so the committee compared cost, flood protection and effects on wildlife.","answers":["trade-offs"],"explanation":"The plural noun refers to several compromises among competing priorities."}],"def":"A compromise in which gaining one desired benefit means giving up some of another."}],"context":{"status":"partial","scopeNotice":"Provisional topic revision: the actual textbook page 50, Environmental Challenges, is not included in the supplied Unit 4 materials. These notes and questions are based on the supplied Words in Context vocabulary table and its related cloze exercise (handout pp. 2–5). They cannot confirm the full content or sequence of the missing textbook text. Use your textbook page 50 to complete preparation for the real exam. Exact numerical facts are not tested.","sourceSummary":[{"file":"Pasted text(20261019-182759).txt","pages":"Master prompt, sections 2–3, 7–9","use":"Defines the approved Unit 4 scope, exam formats, manual assessment of written answers, and the instruction not to test exact numbers.","limitation":"Refers to textbook page 50 and a four-step reading overview that are not themselves attached."},{"file":"Vocabulary Focus On Success Plus 12.pdf","pages":"Handout pp. 2–5: Words in Context; pp. 6–8: Unit 4A; pp. 9–11: Unit 4B","use":"Approved vocabulary, German meanings, word forms and related cloze topics. WIC pp. 2–5 are the basis of this provisional study section.","limitation":"The WIC cloze is a separate exercise, not a scan of textbook page 50. Later units in this large file are excluded. A Unit 4A cloze gap requests geophysical force, which is not a vocabulary-table entry and is excluded from the tested list."},{"file":"The Anthropocene.pdf","pages":"Textbook pp. 52–53, paragraphs A–G","use":"Confirms Unit 4A themes: consumption, plastic persistence, psychic numbing and the importance of feeling that action can work.","limitation":"This is Unit 4A, not the missing WIC page. Its wording about a geological epoch is treated as the supplied author's framing, not as a claim about current formal geological classification."},{"file":"Climate Change in FL.pdf","pages":"Textbook pp. 56–58, paragraphs A–G","use":"Confirms Unit 4B themes: sea-level rise, water contamination, hurricanes, habitat loss, displacement and possible responses.","limitation":"The article is dated 21 April 2020. Its projections are not presented as current forecasts and no exact figures are tested. Page 58 gives a five-step group placemat activity, not the requested four reading steps."},{"file":"Reading Texts Fachabitur 2024.pdf","pages":"Both supplied pages: For the Love of Nature, paragraphs A–G","use":"Establishes reading level and the source evidence for the accompanying example task formats.","limitation":"Supplemental example only. It does not supply Environmental Challenges and does not expand the tested Unit 4 vocabulary list."},{"file":"For the love of nature Aufgaben.pdf","pages":"PDF pp. 1–2","use":"Confirms one-option multiple choice, English-to-German mediation, and concise English short answers. It explicitly permits words from the reading text for short answers.","limitation":"Does not contain an exact four-step overview, multiple-matching guidance or a gapped-summary method."},{"file":"Lösung For the love of nature.pdf","pages":"PDF p. 1","use":"Confirms the example mediation content and short-answer wording; helps verify expected response precision.","limitation":"Leading MC letters conflict with option wording. Matching the wording to the worksheet and reading text gives A, D, C, D, which also matches the trailing corrections. Old conflicting letters are not copied into practice answer keys."},{"file":"English_Lesson_Climate_and_Outdoor_Communities.pptx","pages":"Slides 1–11, especially embedded guidance on slides 5 and 7–9","use":"Verified guidance for detailed reading, paragraph headings, MC, mediation and short-answer tasks. Embedded image tables were inspected, not just extracted slide text.","limitation":"The numbered sequence is a lesson plan with five phases. It is not an identified four-step reading overview. The exact requested four steps remain unverified."},{"file":"Vocabulary_List_Climate_and_Outdoor_Communities.pdf","pages":"PDF p. 1","use":"Reviewed to separate the supplemental For the Love of Nature vocabulary from approved Unit 4 entries.","limitation":"No additional tested vocabulary is imported from this supplemental list."}],"topics":[{"id":"climate","title":"Climate pressure and connected risks","summary":"The supplied WIC material treats climate change as an urgent challenge with connected effects on food, water, public health and places where people live. Greenhouse gases retain heat in the atmosphere. The cloze links longer heatwaves and changing rainfall to risks for people and ecosystems.","causes":["Greenhouse gases prevent some heat from escaping.","Reliance on coal, oil and gas is linked to the need for cleaner energy systems."],"effects":["Longer heatwaves and changing rainfall threaten food security and public health.","Rising seas pose risks to coastal communities."],"responses":["Reduce the carbon footprint of homes and transport.","Move energy systems towards renewable sources and improve planning."],"connections":["Warmer conditions connect to evaporation and water stress.","Environmental damage can become a social problem when it affects homes and livelihoods."],"source":"WIC vocabulary handout pp. 2–4 and Environmental Challenges cloze, p. 5; provisional revision, not verified textbook p. 50."},{"id":"water","title":"Drought, evaporation and depleted water","summary":"The WIC table distinguishes drought, evaporation and depletion. Drought is a long unusually dry period; evaporation changes liquid water into vapour; depletion reduces a supply by using it up. The examples show why farming communities may face several kinds of water pressure together.","causes":["A long period with too little rain produces drought conditions.","Heat can increase evaporation.","Using groundwater reduces the remaining supply."],"effects":["Less available water puts crops and communities under pressure.","Failed harvests and depleted supplies can worsen existing social tensions."],"responses":["Treat safe drinking water as a central priority.","Plan adaptation around both environmental needs and people's livelihoods."],"connections":["A physical shortage can affect food security and contribute to displacement.","Contamination is a different water problem: water may be present but unsafe."],"source":"WIC vocabulary handout pp. 2–4: drought, evaporation, depletion, arid, contamination; cloze p. 5."},{"id":"people","title":"Homes, vulnerability and fairness","summary":"The provided WIC cloze connects environmental stress with human consequences. Storms, drought and damaged living conditions can force families to move. It also argues that adaptation should support livelihoods and social justice.","causes":["Storms and drought can damage the conditions people depend on.","Repeated flooding can make an area unsafe to live in.","Existing inequalities can increase the difficulty of responding."],"effects":["People may be displaced from their homes.","Food problems and reduced resources can increase social tensions.","Vulnerable communities face serious risks."],"responses":["Include community involvement in environmental planning.","Choose adaptation measures that strengthen livelihoods."],"connections":["The same environmental threat can also affect food, housing and social relationships.","Fair adaptation joins environmental protection with the needs of affected people."],"source":"WIC vocabulary handout pp. 2–3: uninhabitable, displace, exacerbate, vulnerable; cloze p. 5."},{"id":"biodiversity","title":"Forests, habitats and biodiversity","summary":"Forests are linked to carbon storage and rich biodiversity in the WIC examples. The cloze connects deforestation with soil damage and fragmented habitats. Habitat loss can make species more vulnerable and increase the risk of extinction.","causes":["Deforestation removes large areas of forest.","Habitat destruction and fragmentation reduce suitable natural homes."],"effects":["The planet loses some of its capacity to store carbon when forests are removed.","Species become more vulnerable when their habitats disappear.","Extinction reduces biodiversity."],"responses":["Tackle habitat loss and forest destruction.","Consider ecosystems as well as human needs in environmental planning."],"connections":["Deforestation connects the climate problem with the biodiversity problem.","Extinction concerns the loss of a species; biodiversity concerns the variety of life."],"source":"WIC vocabulary handout p. 3 and Environmental Challenges cloze p. 5."},{"id":"energy","title":"Energy choices and carbon footprints","summary":"The WIC material connects lower carbon footprints with homes, travel and the energy system. It gives insulation, shared rides and train travel as examples. At a wider level, the cloze calls for renewable energy, improved storage and better public transport.","causes":["Fossil-fuel-reliant systems depend heavily on coal, oil or gas.","Affluent societies can consume large amounts of energy."],"effects":["Energy choices affect the amount of carbon dioxide associated with an activity or organisation.","Changing an entire energy system requires more than one household action."],"responses":["Insulate homes, share rides and use suitable train journeys.","Harness wind or other renewable energy and improve storage.","Invest in public transport and encourage cleaner production."],"connections":["Individual choices and wider investment can support the same environmental aim.","Carbon-neutral refers to a net balance of carbon dioxide, so the word net matters."],"source":"WIC vocabulary handout pp. 3–4 and Environmental Challenges cloze p. 5."},{"id":"waste","title":"Waste, contamination and a circular economy","summary":"The WIC table explains improper waste disposal, contamination, incineration and a circular economy. The cloze develops a response based on repair, keeping materials useful and reducing waste from the beginning of a product's life.","causes":["Waste handled in unsuitable ways can pollute rivers and other places.","A system that discards useful materials creates avoidable waste."],"effects":["Contamination can make water or other materials dirty or unsafe.","Waste must be managed even when it is no longer useful to its first owner."],"responses":["Repair products and reuse materials.","Design supply chains that keep materials valuable and reduce waste.","Distinguish burning waste from preventing it in the first place."],"connections":["Water quantity and water quality are related concerns but different problems.","Repair changes the flow of materials and can be supported through wider policy."],"source":"WIC vocabulary handout p. 4 and Environmental Challenges cloze p. 5."},{"id":"action","title":"Practical responses and difficult choices","summary":"The supplied cloze presents environmental action as possible but demanding. It combines targeted investment, public participation and planning based on evidence. The vocabulary also recognises that some responses continue to cause disagreement.","causes":["Environmental challenges connect several systems, so one measure may address only part of a problem.","Different responses can raise competing concerns."],"effects":["A proposal can remain controversial even when it is intended to reduce harm.","Adaptation can affect both ecosystems and livelihoods."],"responses":["Incentivise cleaner production and durability.","Use targeted investment and community engagement.","Judge whether adaptation supports the people affected."],"connections":["Mitigating harm does not necessarily mean removing the whole problem.","A useful explanation links a response to the specific cause or effect it addresses."],"source":"WIC vocabulary handout pp. 3–4 and Environmental Challenges cloze p. 5."}],"questions":[{"id":"c01","type":"open","prompt":"Why is climate change described as a pressing challenge in the supplied WIC revision material? Give two connected reasons in complete English sentences.","points":2,"model":"It is an urgent problem because heatwaves and changing rainfall can threaten food security and public health. These effects can also damage the conditions communities depend on, so action is needed to reduce harm.","criteria":["Explains urgency using a supported threat to food, health or living conditions.","Connects the threat to a consequence for people or a reason for action."],"explanation":"A strong answer explains why the challenge matters; simply replacing pressing with urgent does not provide two ideas.","evidence":"Vocabulary handout p. 2, pressing challenge and pose a significant threat; cloze p. 5, opening sentences.","topic":"climate"},{"id":"c02","type":"open","prompt":"Explain the meaning of trap heat and connect it to the climate theme of the WIC material.","points":2,"model":"To trap heat means to prevent it from escaping. The WIC example explains that greenhouse gases retain heat in the atmosphere, which connects the expression to the problem of a warming climate.","criteria":["Explains that heat is prevented from escaping.","Identifies greenhouse gases and the atmosphere as the relevant context."],"explanation":"Give the physical meaning and then apply it to the example. No exact temperature or measurement is needed.","evidence":"Vocabulary handout p. 2, trap heat entry and example.","topic":"climate"},{"id":"c03","type":"open","prompt":"Choose one climate-related problem from the revision notes and explain a chain with a cause, an environmental effect and a consequence for people.","points":3,"model":"A long period with too little rain can cause a drought. The shortage of water can damage crops and contribute to failed harvests. This threatens food security and can put farming communities under greater pressure.","criteria":["Identifies a supported cause, such as prolonged lack of rain or rising temperatures.","Explains a plausible environmental effect supported by the notes.","Connects that effect to a supported consequence for people."],"explanation":"Other supported chains are acceptable, such as heat, evaporation and reduced water supplies. Award points for the links, not for memorised wording.","evidence":"Vocabulary handout p. 2, drought and evaporation; cloze p. 5, water stress and failed harvests.","topic":"climate"},{"id":"c04","type":"open","prompt":"How are drought and evaporation different? Explain both terms without using numerical facts.","points":2,"model":"Drought is a long period of unusually dry weather with too little rain. Evaporation is the process in which liquid water changes into a gas, often because of heat. One is a weather condition, while the other is a physical process.","criteria":["Defines drought as a prolonged unusually dry period with insufficient rain.","Defines evaporation as liquid water changing into gas."],"explanation":"They can happen together, but they name different things. An answer that treats them as synonyms misses the distinction.","evidence":"Vocabulary handout p. 2, drought and evaporation entries.","topic":"water"},{"id":"c05","type":"open","prompt":"Why can groundwater depletion create problems for farming communities? Include the meaning of depletion and one consequence.","points":2,"model":"Groundwater depletion means that the supply is reduced as water is used up. If less water remains available, farming communities can struggle to supply crops, which can contribute to failed harvests and pressure on their livelihoods.","criteria":["Explains that depletion reduces a supply by using it up.","Links the reduced water supply to farming, harvests or livelihoods."],"explanation":"The answer needs to connect the meaning of the word to the people in the source example.","evidence":"Vocabulary handout p. 2, depletion; cloze p. 5, groundwater depletion and failed harvests.","topic":"water"},{"id":"c06","type":"open","prompt":"Explain how drought and groundwater depletion could reinforce pressure on an arid region.","points":3,"model":"An arid region already receives little rain. A drought adds a prolonged period of unusually dry conditions, while groundwater depletion reduces stored water as it is used. Together these pressures can leave less water for farming and communities.","criteria":["Explains that an arid region is very dry because it receives little rain.","Distinguishes the added pressure from drought and from groundwater use.","Explains a combined consequence for water availability or farming."],"explanation":"This is a synthesis of the vocabulary examples and cloze, not a claim that the missing textbook uses this exact explanation.","evidence":"Vocabulary handout p. 2, arid, drought and depletion; cloze p. 5.","topic":"water"},{"id":"c07","type":"open","prompt":"How is water contamination different from water depletion, and why can both matter to a community?","points":3,"model":"Depletion reduces the amount of water in a supply. Contamination makes water polluted or unsafe. A community needs both enough water and water that is safe to use, so either problem can threaten its access to useful water.","criteria":["Correctly explains depletion as a reduction in supply.","Correctly explains contamination as pollution or loss of safety.","Explains why quantity and quality both matter to access to water."],"explanation":"The final link is a reasoned connection between two supplied definitions. It does not require a numerical threshold.","evidence":"Vocabulary handout p. 2, depletion; p. 4, contamination and importance of drinking water.","topic":"water"},{"id":"c08","type":"open","prompt":"How can an environmental problem lead to displacement? Explain the relationship using a supplied WIC example.","points":2,"model":"Repeated flooding can make a place unsafe for people to live in. If residents can no longer remain there safely, they may be forced to leave their homes, which is displacement.","criteria":["Gives a supported environmental threat to homes or living conditions.","Explains that displacement means people are forced to leave their homes."],"explanation":"A drought or storm example can also earn full credit if it explains why people may have to move.","evidence":"Vocabulary handout p. 2, uninhabitable and displace; cloze p. 5, storms and drought.","topic":"people"},{"id":"c09","type":"open","prompt":"What does it mean to say that environmental pressures can exacerbate existing inequalities? Explain the word and the relationship.","points":2,"model":"Exacerbate means to make an existing problem worse. Environmental pressures can add further difficulties to communities that already face unequal conditions, so the original inequalities become more serious rather than beginning from nothing.","criteria":["Explains exacerbate as making an existing problem worse.","Explains that environmental pressure can add to inequalities that already exist."],"explanation":"The key distinction is worsening an existing problem. A specific invented statistic is unnecessary.","evidence":"Vocabulary handout p. 3, exacerbate example; cloze p. 5, environmental pressure and social tensions.","topic":"people"},{"id":"c10","type":"open","prompt":"The cloze links adaptation with social justice. What would a fair response need to consider, and why?","points":3,"model":"A fair response would consider how environmental measures affect people's livelihoods as well as the natural environment. It would involve communities in planning and aim to strengthen their ability to live and work, rather than adding further pressure to them.","criteria":["Includes the livelihoods or needs of affected people.","Identifies community involvement as part of planning.","Explains why the response should reduce harm instead of making people's situation worse."],"explanation":"A response is not fully explained by naming a technology. The question asks about the people affected by the decision.","evidence":"Environmental Challenges cloze, handout p. 5, final sentences on community engagement, social justice and livelihoods.","topic":"people"},{"id":"c11","type":"open","prompt":"Explain the connection between deforestation and habitat loss.","points":2,"model":"Deforestation removes large areas of forest. Because forests provide natural homes for many plants and animals, removing them can destroy or reduce those habitats and make the species that depend on them more vulnerable.","criteria":["Explains that deforestation removes forest.","Connects forest removal to the loss or reduction of natural homes for species."],"explanation":"The second point requires a connection, not merely two separate definitions.","evidence":"Vocabulary handout p. 3, deforestation and habitat loss; cloze p. 5, deforestation and fragmented habitats.","topic":"biodiversity"},{"id":"c12","type":"open","prompt":"How are extinction and biodiversity connected, and how do their meanings differ?","points":3,"model":"Extinction means that a species no longer exists. Biodiversity is the variety of plant and animal life in a place. When a species disappears, that variety can be reduced, so extinction is one way biodiversity is lost.","criteria":["Defines extinction as the complete disappearance of a species.","Defines biodiversity as the variety of plant and animal life.","Explains how species loss reduces variety."],"explanation":"Do not define extinction as the death of one individual animal; the word concerns the species.","evidence":"Vocabulary handout p. 3, extinction and biodiversity; cloze p. 5, species loss.","topic":"biodiversity"},{"id":"c13","type":"open","prompt":"Why does the revision material connect protecting forests with both climate and biodiversity?","points":2,"model":"The vocabulary examples connect forests with carbon storage, so losing them reduces that capacity. Forests also support a rich variety of life, so protecting them helps preserve habitats and biodiversity.","criteria":["Explains the connection between forests and carbon storage.","Explains the connection between forests and habitats or biodiversity."],"explanation":"These are two different benefits. Repeating the habitat benefit in different words earns only one point.","evidence":"Vocabulary handout p. 3, deforestation and biodiversity examples.","topic":"biodiversity"},{"id":"c14","type":"open","prompt":"Explain why habitat loss can make a species vulnerable even before it becomes extinct.","points":2,"model":"Habitat loss reduces or damages the natural home that a species depends on. The species can therefore face a greater risk of harm while it still exists; extinction would mean that it had disappeared completely.","criteria":["Explains increased risk through damage to the natural home.","Distinguishes being at risk from no longer existing."],"explanation":"Vulnerable describes susceptibility to harm, not a guarantee that extinction has already occurred.","evidence":"Vocabulary handout p. 3, habitat loss, vulnerable and extinction.","topic":"biodiversity"},{"id":"c15","type":"open","prompt":"Name two ways households can reduce their carbon footprint in the supplied cloze, and explain the shared aim.","points":3,"model":"Households can insulate their homes and choose trains instead of suitable short flights. Both choices are presented as ways to reduce the carbon dioxide associated with everyday activities and therefore make the household's carbon footprint smaller.","criteria":["Gives one cloze example: insulation, shared rides or train travel instead of short flights.","Gives a different supported cloze example.","Connects both to reducing the carbon dioxide associated with activities."],"explanation":"Two transport examples are acceptable if they are distinct and both are supported. The definition of carbon footprint should be used accurately.","evidence":"Vocabulary handout p. 3, carbon footprint; cloze p. 5, household responses.","topic":"energy"},{"id":"c16","type":"open","prompt":"What is the difference between a household action and a change at the energy-system level? Give one supplied example of each.","points":2,"model":"A household can improve its own home's insulation. A change at the energy-system level affects wider infrastructure, such as moving electricity supply towards renewable sources or improving energy storage. The examples operate at different scales.","criteria":["Gives a supported action taken at household level.","Gives a supported wider energy or transport investment and distinguishes its scale."],"explanation":"The cloze includes both personal choices and wider changes; neither category replaces the other.","evidence":"Environmental Challenges cloze, handout p. 5, household and system-level responses.","topic":"energy"},{"id":"c17","type":"open","prompt":"What does it mean for an economy to be fossil-fuel-reliant, and what transition does the WIC material suggest?","points":2,"model":"A fossil-fuel-reliant economy depends heavily on coal, oil or gas. The WIC material suggests moving towards renewable energy sources, with wider changes such as improved storage and public transport supporting that transition.","criteria":["Identifies heavy dependence on coal, oil or gas.","Explains a move towards renewable energy sources."],"explanation":"Transition refers to changing systems over time. It is not the same word as simply transporting fuel.","evidence":"Vocabulary handout p. 3, fossil-fuel-reliant and transition; cloze p. 5.","topic":"energy"},{"id":"c18","type":"open","prompt":"Explain harness in an energy context and give the example supported by the vocabulary table.","points":2,"model":"To harness energy means to control and use it for a purpose. The vocabulary example describes engineers using wind to generate electricity, so a natural force is being put to practical use.","criteria":["Explains control and useful application of energy or a natural force.","Uses wind generating electricity as the supported example."],"explanation":"The answer should show the energy meaning of the verb rather than an unrelated noun meaning.","evidence":"Vocabulary handout p. 3, harness definition and example.","topic":"energy"},{"id":"c19","type":"open","prompt":"Why is the word net important in the supplied definition of carbon-neutral?","points":2,"model":"Net refers to the overall balance. Carbon-neutral therefore means no net release of carbon dioxide, rather than automatically meaning that no carbon dioxide is produced at any stage of every activity.","criteria":["Explains net as an overall balance.","Distinguishes no net release from an automatic claim of no emissions at any stage."],"explanation":"This question practises careful interpretation of the supplied definition. It does not require details of any particular accounting system.","evidence":"Vocabulary handout p. 4, carbon-neutral definition.","topic":"energy"},{"id":"c20","type":"open","prompt":"How can improper waste disposal lead to contamination? Use a supplied example to explain the link.","points":2,"model":"If waste is disposed of in an unsuitable way, it can pollute the place where it ends up. The WIC example connects improper disposal with contaminated rivers, where water becomes dirty or unsafe.","criteria":["Explains the link between unsuitable disposal and pollution.","Uses the supported river example and explains contamination as reduced cleanliness or safety."],"explanation":"Merely saying that waste is bad does not explain the process or its effect.","evidence":"Vocabulary handout p. 4, improper waste disposal and contamination entries.","topic":"waste"},{"id":"c21","type":"open","prompt":"Explain how repair contributes to a circular economy.","points":2,"model":"Repair allows a product to remain useful instead of being discarded immediately. This supports a circular economy because materials stay in use and less waste is created.","criteria":["Explains that repair extends a product's useful life.","Links longer use to retaining materials or reducing waste."],"explanation":"Repair is connected to the definition of circular economy; it is not just an isolated helpful activity.","evidence":"Vocabulary handout p. 4, circular economy example; cloze p. 5, keeping materials useful and normalising repair.","topic":"waste"},{"id":"c22","type":"open","prompt":"How does a circular-economy approach differ from only dealing with waste after products are discarded?","points":3,"model":"A circular-economy approach aims to keep materials useful through reuse and repair. It also considers product design and supply chains so that waste is reduced from the start. Dealing only with discarded waste acts later, after the materials have already left their first use.","criteria":["Explains reuse or repair as a way to retain useful materials.","Includes prevention through design or supply chains.","Clearly distinguishes prevention and continued use from handling waste afterwards."],"explanation":"The cloze places emphasis on the whole material cycle, including the stage before a product becomes waste.","evidence":"Vocabulary handout p. 4, circular economy; cloze p. 5, supply chains, repair and designing out waste.","topic":"waste"},{"id":"c23","type":"open","prompt":"What is incineration, and why is it a different action from repairing a product?","points":2,"model":"Incineration means burning waste. Repair restores a product so that it can continue to be used. The actions differ because one deals with discarded material by burning it, while the other keeps a product in use.","criteria":["Defines incineration as burning waste.","Explains that repair keeps a product in use and therefore differs from burning it."],"explanation":"No claim that incineration solves every waste problem is needed or supported by the definition.","evidence":"Vocabulary handout p. 4, incineration and circular economy examples.","topic":"waste"},{"id":"c24","type":"open","prompt":"How could a policy that rewards product durability support the circular-economy aim in the supplied cloze?","points":2,"model":"Rewarding durability encourages producers to make products that remain useful for longer. Longer use can reduce the need to discard and replace products, helping to keep materials valuable and reduce waste.","criteria":["Explains how a reward can encourage longer-lasting products.","Connects longer useful life to material retention or reduced waste."],"explanation":"This is a reasoned connection between two ideas in the cloze. Other clear explanations of that link are acceptable.","evidence":"Environmental Challenges cloze, handout p. 5, incentives for durability and circular supply chains.","topic":"waste"},{"id":"c25","type":"open","prompt":"What does incentivise mean, and how can governments use it to encourage cleaner production?","points":2,"model":"To incentivise means to encourage an action by offering a benefit. Governments can offer support such as favourable loans or tax benefits to make investment in cleaner production more attractive.","criteria":["Defines incentivise as encouragement through a benefit.","Gives a supported benefit linked to cleaner production or technology."],"explanation":"A command and an incentive are different ideas. The answer should identify what makes the desired action attractive.","evidence":"Vocabulary handout p. 4, incentivise and tax-credit example; cloze p. 5, loans and cleaner production.","topic":"action"},{"id":"c26","type":"open","prompt":"What is the difference between mitigating a problem and claiming that the problem has disappeared? Give an environmental example from the notes.","points":2,"model":"Mitigating a problem means making it less serious or harmful, so some of it may remain. Better insulation can reduce energy waste, for example, without proving that every source of energy waste has disappeared.","criteria":["Distinguishes reducing harm from completely removing the problem.","Gives a supported environmental example that illustrates reduction."],"explanation":"The meaning of mitigate is deliberately more limited than eliminate. The answer should preserve that difference.","evidence":"Vocabulary handout p. 3, mitigate definition and insulation example.","topic":"action"},{"id":"c27","type":"open","prompt":"Why can an environmental response remain controversial? Use the vocabulary table's example and avoid adding an unsupported conclusion.","points":2,"model":"A response can remain controversial because people continue to disagree about it. The table uses nuclear power as an example and identifies radioactive waste as a reason for the disagreement, without giving a final judgement that everyone must accept.","criteria":["Explains continuing disagreement as the meaning of remain controversial.","Identifies nuclear power and the concern about radioactive waste from the supplied example."],"explanation":"Report the example accurately. This is a reading and vocabulary question, not a request to decide the whole energy debate.","evidence":"Vocabulary handout p. 4, remain controversial definition and example.","topic":"action"},{"id":"c28","type":"open","prompt":"What makes an environmental response well connected to a problem? Choose one response from the notes and explain the problem, the action and its intended effect.","points":3,"model":"Improper waste disposal can contaminate rivers. A circular-economy approach promotes repair and continued use of materials so that less waste needs to be discarded. Its intended effect is to reduce avoidable waste at an earlier stage, although safe handling of remaining waste is still necessary.","criteria":["Identifies a supported environmental problem clearly.","Chooses a relevant response from the supplied notes.","Explains the intended connection between the response and a reduction in harm, without claiming it solves every problem."],"explanation":"Other supported examples can receive full credit, such as home insulation and energy waste or forest protection and habitat loss. Assess the reasoning, not a keyword count.","evidence":"Vocabulary handout pp. 2–4 and Environmental Challenges cloze p. 5; synthesis question.","topic":"action"}],"method":{"verified":false,"notice":"General four-step practice aid, not the teacher's verified four steps. The requested exact four-step overview is absent. The supplied lesson slides do contain genuine detailed-reading and task-specific guidance, summarised separately below. Their five lesson phases and the Florida page 58 five-step group placemat activity are not relabelled as the missing method.","steps":[{"title":"Preview and set a purpose","description":"Look at the title and task instructions. Predict the topic, identify the response language and notice what kind of answer is required.","action":"Write one prediction and check whether the task asks for a choice, an exact word, a short explanation or German mediation."},{"title":"Read for meaning","description":"Read the paragraphs carefully. Identify the main idea, mark unfamiliar words, distinguish people or viewpoints, and create short headings in your own words.","action":"Give each paragraph a short heading. Note a cause, an effect or a response that seems important."},{"title":"Find evidence for the task","description":"Return to the relevant paragraph. Compare the question with the passage using meaning and context, including paraphrases. Check limiting words such as only and not.","action":"Identify the sentence or linked sentences that support your answer. For multiple choice, explain why the other options fail."},{"title":"Answer and review","description":"Give only the requested information in the requested language. Check that all parts are answered and that your wording is clear and grammatically suitable.","action":"Check the evidence, number of requested points, word or phrase length, response language and spelling before moving on."}],"taskGuidance":[{"type":"mc","title":"Verified teacher guidance: multiple choice","points":["Select one fully correct option and consider every alternative.","Use the surrounding context; synonyms, opposites and paraphrases can help locate evidence.","Eliminate options whose claims are unsupported or contain an error, and pay special attention to NOT.","The lesson slide suggests checking unknown words in a dictionary. It does not establish permission to use a dictionary in the actual exam.","On a paper answer sheet, make a changed selection unambiguous. In this app, choosing another option replaces the earlier choice."],"source":"English_Lesson_Climate_and_Outdoor_Communities.pptx, slide 7 embedded table; For the love of nature Aufgaben.pdf, p. 1."},{"type":"mediation","title":"Verified teacher guidance: English to German mediation","points":["Answer the German question in German and use the English text to identify the relevant meaning.","Use natural, idiomatic German and give one best version.","Communicate all the required information; do not translate mechanically word by word or list alternative versions.","Check tense, singular and plural forms, prepositions and word order.","When completing a supplied German sentence, make the answer fit that sentence grammatically."],"source":"English_Lesson_Climate_and_Outdoor_Communities.pptx, slide 8 embedded table; For the love of nature Aufgaben.pdf, p. 2, English–German mediation."},{"type":"open","title":"Verified teacher guidance: short answers","points":["Answer an English question in English and use the context to identify the required information.","You may copy the relevant word or phrase when the question asks for it, but stop at the correct boundary.","If one word is requested, give one word. If an expression or several words are requested, provide the needed phrase.","Obey a requested word class such as verb, noun or adjective, and distinguish a metaphorical expression from a literal description.","For several content points, look for linked details in the surrounding text and include every requested point without copying an unnecessarily long passage."],"source":"English_Lesson_Climate_and_Outdoor_Communities.pptx, slide 9 embedded table; For the love of nature Aufgaben.pdf, p. 2, short-answer instructions."}],"detailedReadingGuidance":{"title":"Verified teacher guidance: paragraph reading","points":["Read each paragraph slowly and in detail.","Underline unfamiliar words and complete the word list while reading.","Highlight main information, using a different colour for people mentioned.","Create a heading that summarises each paragraph in your own words, without copying whole phrases."],"source":"English_Lesson_Climate_and_Outdoor_Communities.pptx, slide 5 embedded image."}}},"readings":[{"id":"r01","title":"The cup that stayed at home","source":"Original practice text — fictional scenario.","level":"Foundation","minutes":12,"examOnly":false,"paragraphs":[{"label":"A","text":"On Monday, Sam found another reusable cup in his school bag. He had bought it at the weekend fair because its bright design made him smile. At home, several similar cups were waiting in a cupboard. He usually forgot to take any of them when he went out, so he still accepted disposable cups at the café."},{"label":"B","text":"At the next environment club meeting, Sam suggested selling a new cup with the school name on it. Leila asked a simple question: would another product actually change their habits? A durable object was useful only if people kept using it. Sam realised that he had been treating reusable products as disposable items."},{"label":"C","text":"The group decided to lend cups at its next event. Visitors would pay a small deposit and get their money back when they returned the cup. Volunteers would collect and wash the cups. Clear signs would show people where to bring them, including those leaving through the side gate."},{"label":"D","text":"Sam still liked attractive designs. Now, however, he wanted the club to count returned cups instead of cups sold. He put his oldest cup beside his keys, ready for the morning. The change began with something he already owned."}],"summaryBank":["disposable","reusable","returned","sold","broken","new"],"questions":[{"id":"r01q01","type":"mc","prompt":"What was the main problem with Sam’s reusable cups?","choices":["They were too fragile to use regularly.","The café refused to accept them.","He kept buying them but rarely took them out.","He disliked their designs after washing them."],"answer":2,"points":1,"explanation":"Owning a reusable product does not reduce his use of disposable cups if he leaves it at home. The text does not mention a café rule or damage.","evidence":"Paragraph A: ‘He usually forgot to take any of them when he went out’."},{"id":"r01q02","type":"mc","prompt":"Why will visitors pay a deposit?","choices":["To encourage them to bring the borrowed cup back.","To buy a cup that they must keep.","To pay for a new design for every visitor.","To reserve a place at the next event."],"answer":0,"points":1,"explanation":"The money is returned when the cup is returned, so the arrangement encourages reuse through the lending system.","evidence":"Paragraph C: ‘get their money back when they returned the cup’."},{"id":"r01q03","type":"text","prompt":"Complete the summary with one word from the text: Sam realised he had been treating reusable products as {gap} items.","answer":["disposable"],"points":1,"explanation":"‘Disposable’ describes items treated as if they are used briefly and then replaced. It is the contrast Leila helps Sam notice.","evidence":"Paragraph B: ‘treating reusable products as disposable items’."},{"id":"r01q04","type":"text","prompt":"Complete the summary with one word from the text: At future events, Sam wants the club to measure success by counting {gap} cups.","answer":["returned"],"points":1,"explanation":"Returned cups can be washed and used again. Sales alone do not show that a reusable product is being reused.","evidence":"Paragraph D: ‘count returned cups instead of cups sold’."},{"id":"r01q05","type":"open","prompt":"Apart from the deposit, explain how the club will handle used cups and help visitors find where to return them. Answer in one or two English sentences.","points":2,"model":"Volunteers will collect and wash the cups. Clear signs will show visitors where to return them, including near the side gate.","criteria":["Identifies volunteers collecting or washing the cups.","Identifies clear return signs or a return point serving the side gate."],"explanation":"The question asks for the practical organisation, beyond the deposit already explained in the multiple-choice task.","evidence":"Paragraph C: ‘Volunteers would collect and wash the cups’ and ‘Clear signs would show people where to bring them’."},{"id":"r01q06","type":"open","prompt":"How does putting the cup beside his keys address Sam’s original problem? Answer in one English sentence.","points":1,"model":"It helps him remember to take a cup he already owns when he leaves home.","criteria":["Connects the reminder beside his keys with remembering to take and use an existing cup."],"explanation":"This is an inference from his earlier habit of forgetting the cups and his new preparation for the morning.","evidence":"Paragraph A: ‘forgot to take any of them’; paragraph D: ‘beside his keys, ready for the morning’."}]},{"id":"r02","title":"A garden with untidy edges","source":"Original practice text — fictional scenario.","level":"Foundation","minutes":12,"examOnly":false,"paragraphs":[{"label":"A","text":"When the grass behind Brook School grew long, several neighbours complained. They thought the gardening club had stopped caring for the site. In fact, the students had left one corner uncut on purpose. They wanted to find out whether different plants would attract more kinds of animals than the short lawn."},{"label":"B","text":"Each Friday, the students watched from the same place and wrote down what they saw. Beetles hid under dead leaves, birds searched for food, and insects visited the flowers. Their teacher reminded them that biodiversity meant a variety of plants and animals, rather than a large number of one familiar species."},{"label":"C","text":"The club did not leave the whole garden wild. Students kept the path clear so people could walk through without stepping on plants. They removed litter and left the gate open during the usual visiting hours. Near the entrance, they displayed drawings showing the different habitats in their small patch."},{"label":"D","text":"One neighbour still preferred a neat lawn, but she changed her view of the students. She could see that the garden was being managed carefully. She offered to help with the observation book, hoping to discover whether the animals would stay when the flowers disappeared later in the year."}],"summaryBank":["animals","flowers","grass","clear","closed","wild"],"questions":[{"id":"r02q01","type":"match","prompt":"Which paragraph describes a regular method for observing wildlife? Paragraphs may be used more than once.","choices":["Paragraph A","Paragraph B","Paragraph C","Paragraph D"],"answer":1,"points":1,"explanation":"The repeated day, place and written observations describe the students’ method. Paragraph D proposes a future question but does not describe the established routine.","evidence":"Paragraph B: ‘Each Friday’ and ‘watched from the same place and wrote down what they saw’."},{"id":"r02q02","type":"match","prompt":"Which paragraph explains how the project protects access for human visitors? Paragraphs may be used more than once.","choices":["Paragraph A","Paragraph B","Paragraph C","Paragraph D"],"answer":2,"points":1,"explanation":"A clear path and normal gate opening allow people to continue using the garden.","evidence":"Paragraph C: ‘kept the path clear’ and ‘left the gate open during the usual visiting hours’."},{"id":"r02q03","type":"mc","prompt":"Why did the students leave part of the grass uncut?","choices":["They had lost interest in the gardening club.","They wanted to close the garden to visitors.","They lacked enough volunteers to mow it.","They wanted to investigate its effect on wildlife variety."],"answer":3,"points":1,"explanation":"The corner is part of a deliberate investigation, although the neighbours initially interpret it as neglect.","evidence":"Paragraph A: ‘left one corner uncut on purpose’ and ‘attract more kinds of animals’."},{"id":"r02q04","type":"mc","prompt":"Which statement best describes the neighbour at the end?","choices":["She now thinks every lawn should be left uncut.","She respects the project even though her visual preference remains.","She wants the students to stop recording wildlife.","She believes the project has already answered every question."],"answer":1,"points":1,"explanation":"She still likes neat lawns but recognises the care behind the project and offers practical help.","evidence":"Paragraph D: ‘still preferred a neat lawn, but she changed her view of the students’."},{"id":"r02q05","type":"text","prompt":"Complete the summary with one word from the text: The teacher explains that biodiversity includes a variety of plants and {gap}.","answer":["animals"],"points":1,"explanation":"The term concerns variety across plants and animals, rather than simply the number of individual flowers or insects.","evidence":"Paragraph B: ‘biodiversity meant a variety of plants and animals’."},{"id":"r02q06","type":"text","prompt":"Complete the summary with one word from the text: To keep the garden accessible, the students made sure the path remained {gap}.","answer":["clear"],"points":1,"explanation":"The students manage the path while allowing the selected corner to grow wild.","evidence":"Paragraph C: ‘Students kept the path clear’."}]},{"id":"r03","title":"Before you replace it","source":"Original practice text — fictional scenario.","level":"Foundation","minutes":14,"examOnly":false,"paragraphs":[{"label":"A","text":"Community notice: The next repair afternoon will take place at the neighbourhood hall on Saturday. Bring one small household item that no longer works properly. Volunteers will examine it with you and explain whether repair seems possible. The event is free, but replacement parts may cost money. Repairs cannot be promised in advance."},{"label":"B","text":"Last month, Maya brought a reading lamp. She had almost ordered a new one because the old lamp kept switching off. A volunteer found a damaged switch. After the lamp had been repaired and checked, Maya could use it again. She also understood the problem, which made the repair feel less mysterious."},{"label":"C","text":"Not every visit ended with a working object. Amir’s radio needed a part that the group could not find. He received information about a suitable collection point instead. The organisers explained that keeping unsafe objects in use was not the purpose of the afternoon. They wanted to prevent unnecessary waste, while recognising the limits of repair."},{"label":"D","text":"Maya now asks whether a product is durable and repairable before she buys it. She still replaces things when necessary. However, a fault no longer means an automatic trip to the shop. Sometimes, the most useful new purchase is the one she does not have to make."}],"questions":[{"id":"r03q01","type":"mc","prompt":"What does the notice promise every visitor?","choices":["A free replacement product.","A discussion of whether the item can be repaired.","A completed repair with free parts.","A refund of the original purchase price."],"answer":1,"points":1,"explanation":"The volunteers will examine the object and explain the possibilities. They do not guarantee a successful repair or free parts.","evidence":"Paragraph A: ‘examine it with you and explain whether repair seems possible’."},{"id":"r03q02","type":"mc","prompt":"Why is Amir’s experience included?","choices":["To show that the volunteers accept only lamps.","To suggest that buying new is always cheaper.","To explain why all repair events should charge fees.","To show that preventing waste also involves recognising repair limits."],"answer":3,"points":1,"explanation":"His radio could not be repaired at the event, and the group offered a responsible next step. This qualifies the successful example of Maya’s lamp.","evidence":"Paragraph C: ‘prevent unnecessary waste, while recognising the limits of repair’."},{"id":"r03q03","type":"mc","prompt":"What does the final sentence suggest?","choices":["Avoiding an unnecessary purchase can be a useful outcome.","Maya should buy products before she needs them.","The best products never need repairs.","People should stop replacing any broken objects."],"answer":0,"points":1,"explanation":"The ending values a purchase avoided through repair. It does not demand that people keep unsafe or unusable items.","evidence":"Paragraph D: ‘She still replaces things when necessary’ and ‘the one she does not have to make’."},{"id":"r03q04","type":"open","prompt":"Apart from having a working lamp again, what did Maya gain from the visit? Answer in one English sentence.","points":1,"model":"She understood what had caused the problem, so repair seemed less mysterious to her.","criteria":["States that she gained an understanding of the fault or greater confidence in understanding repair."],"explanation":"The question asks for the learning benefit rather than simply repeating that the lamp worked.","evidence":"Paragraph B: ‘She also understood the problem, which made the repair feel less mysterious’."},{"id":"r03q05","type":"open","prompt":"Which two qualities does Maya now consider before buying a product? Answer in one English sentence.","points":2,"model":"She checks whether it is durable and whether it can be repaired.","criteria":["Mentions durability or the ability to last a long time.","Mentions repairability or the possibility of repair."],"explanation":"Both qualities can help an object remain useful instead of becoming unnecessary waste.","evidence":"Paragraph D: ‘whether a product is durable and repairable’."},{"id":"r03q06","type":"mediation","prompt":"Deine deutschsprachige Nachbarin möchte einen defekten Haushaltsgegenstand mitbringen. Was muss sie über den Reparaturnachmittag wissen? Verfasse anhand von Absatz A eine kurze Nachricht auf Deutsch. Nenne Ort und Zeitpunkt, den passenden Gegenstand, das Angebot der Freiwilligen sowie mögliche Kosten und Grenzen. Gib die wichtigen Informationen sinngemäß wieder.","points":4,"model":"Am Samstag gibt es im Nachbarschaftshaus einen Reparaturnachmittag. Du kannst einen kleinen Haushaltsgegenstand mitbringen, der nicht richtig funktioniert. Freiwillige schauen ihn sich mit dir an und erklären, ob eine Reparatur möglich erscheint. Die Veranstaltung ist kostenlos, Ersatzteile können aber etwas kosten. Eine erfolgreiche Reparatur wird nicht garantiert.","criteria":["States in clear German that the event is on Saturday at the neighbourhood hall.","Explains in German that visitors should bring one small household item that is faulty.","Explains in German that volunteers examine the item and discuss whether repair is possible.","Communicates in German that the event is free but parts may cost money and repair is not guaranteed."],"explanation":"An effective message helps the neighbour decide what to bring and what to expect. The stories about Maya and Amir are not needed for this purpose.","evidence":"Paragraph A: ‘on Saturday’, ‘one small household item’, ‘explain whether repair seems possible’ and ‘replacement parts may cost money’."}]},{"id":"r04","title":"Saving rain for a dry week","source":"Original practice text — fictional scenario.","level":"Foundation","minutes":12,"examOnly":false,"paragraphs":[{"label":"A","text":"During a dry spell, the gardeners at Elm School watched the soil around their young trees become hard. They had been watering the trees with drinking water. The school wanted to reduce this use without losing the plants that students had spent months looking after."},{"label":"B","text":"The caretaker suggested a covered tank beside the library. It would store rainwater from the roof for the garden. A notice on the tank would explain that this water was not for drinking. The students also agreed to cover the soil around the trees with dead leaves to reduce evaporation."},{"label":"C","text":"The first rain filled the tank, but the next dry period lasted longer than expected. The water ran low. The gardening club gave the young trees priority and stopped watering the decorative flowers near the gate. Some students disliked the result, because the entrance no longer looked as colourful."},{"label":"D","text":"At their meeting, the club recorded both the benefits and the limits of its plan. Storing rain had reduced its use of drinking water, but a tank could not produce rain during a drought. For the next planting season, the students would choose plants that needed less water. They would also record when the tank was empty instead of presenting it as a complete solution."}],"summaryBank":["rainwater","drinking water","evaporation","contamination","flowers","trees"],"questions":[{"id":"r04q01","type":"match","prompt":"Which paragraph describes a decision about who or what receives a limited resource first? Paragraphs may be used more than once.","choices":["Paragraph A","Paragraph B","Paragraph C","Paragraph D"],"answer":2,"points":1,"explanation":"The club prioritises the trees when stored water becomes scarce, accepting that the flowers will receive less care.","evidence":"Paragraph C: ‘gave the young trees priority and stopped watering the decorative flowers’."},{"id":"r04q02","type":"match","prompt":"Which paragraph describes a change to future planting after the project’s limits become clear? Paragraphs may be used more than once.","choices":["Paragraph A","Paragraph B","Paragraph C","Paragraph D"],"answer":3,"points":1,"explanation":"The later response is to choose plants with lower water needs. The earlier tank suggestion appears in paragraph B.","evidence":"Paragraph D: ‘choose plants that needed less water’."},{"id":"r04q03","type":"text","prompt":"Complete the summary with one word from the text: The covered tank collects {gap} from the library roof for use in the garden.","answer":["rainwater"],"points":1,"explanation":"The tank stores rain from the roof. The notice distinguishes this from drinking water.","evidence":"Paragraph B: ‘store rainwater from the roof for the garden’."},{"id":"r04q04","type":"text","prompt":"Complete the summary with one word from the text: Dead leaves are placed around the trees to reduce {gap}.","answer":["evaporation"],"points":1,"explanation":"The stated purpose is to limit water escaping from the soil, rather than to treat contaminated water.","evidence":"Paragraph B: ‘cover the soil around the trees with dead leaves to reduce evaporation’."},{"id":"r04q05","type":"open","prompt":"Why is the tank helpful without being a complete solution? Give both parts of the explanation in English.","points":2,"model":"It reduces the need to use drinking water in the garden. However, stored water can run out because the tank cannot produce rain during a drought.","criteria":["Explains that storing rain reduces the use of drinking water.","Explains that the tank can run out during a prolonged dry period or cannot make rain."],"explanation":"A balanced answer identifies an actual benefit and the specific limit shown in the trial.","evidence":"Paragraph D: ‘reduced its use of drinking water’ and ‘could not produce rain during a drought’."},{"id":"r04q06","type":"open","prompt":"Why do some students dislike the decision to prioritise the young trees? Answer in one English sentence.","points":1,"model":"They dislike the less colourful entrance after the club stops watering the decorative flowers.","criteria":["Connects their dissatisfaction to the appearance of the entrance or loss of colourful flowers."],"explanation":"The disagreement concerns appearance, which the students must weigh against keeping the young trees alive.","evidence":"Paragraph C: ‘the entrance no longer looked as colourful’."}]},{"id":"r05","title":"The path beside the marsh","source":"Original practice text — fictional scenario.","level":"Standard","minutes":17,"examOnly":false,"paragraphs":[{"label":"A","text":"The coast path at Bracken Bay was more than a pleasant place for a walk. It connected the bus stop with the village shops, and some children used it on their way to school. When high water repeatedly covered the lowest section, walkers had to use a narrow road without a pavement. Residents agreed that doing nothing was becoming difficult. They disagreed about what to do next."},{"label":"B","text":"The council’s first drawing showed a straight wall along the water. It would protect the existing route during the conditions used in the engineers’ plan. Building it, however, would remove part of the marsh. A local nature group argued that this would mean habitat loss. Its members also wanted the engineers to consider how the marsh itself might buffer the force of incoming water."},{"label":"C","text":"Idris, who led nature walks, suggested a raised wooden path that bent around the wettest ground. It would preserve more of the marsh, although the journey would be longer. He stressed that a path was not accessible simply because a fit adult could use it. Parents with pushchairs and people using wheelchairs needed to help test the design before it was approved."},{"label":"D","text":"The choice involved money as well as the coast. Funds allocated to a large wall could not also repair the village’s deteriorating drains. Shop owner Ruth feared that a long planning process would leave her customers using the unsafe road for another season. She supported careful investigation but asked for a temporary route while the permanent plans were discussed."},{"label":"E","text":"The council agreed to improve an inland route immediately and test a short section of raised path. Volunteers would record wildlife observations, while regular users would report whether they could travel safely and comfortably. The trial would not settle every question about future sea levels. It would, however, replace some confident guesses with evidence about this particular place."}],"questions":[{"id":"r05q01","type":"match","prompt":"Which paragraph argues that potential users should help test a design? Paragraphs may be used more than once.","choices":["Paragraph A","Paragraph B","Paragraph C","Paragraph D","Paragraph E"],"answer":2,"points":1,"explanation":"Idris specifically asks for input from people whose access needs could otherwise be overlooked. Paragraph E reports the later trial decision.","evidence":"Paragraph C: ‘Parents with pushchairs and people using wheelchairs needed to help test the design’."},{"id":"r05q02","type":"match","prompt":"Which paragraph identifies a different infrastructure problem competing for the same money? Paragraphs may be used more than once.","choices":["Paragraph A","Paragraph B","Paragraph C","Paragraph D","Paragraph E"],"answer":3,"points":1,"explanation":"The drains are a separate need. Spending the available money on the wall would leave less for this work.","evidence":"Paragraph D: ‘could not also repair the village’s deteriorating drains’."},{"id":"r05q03","type":"mc","prompt":"What is the nature group’s objection to the proposed wall?","choices":["It would make every route through the village longer.","It would protect no part of the current path.","It would prevent the council from observing wildlife anywhere.","It could destroy habitat and overlook a useful feature of the marsh."],"answer":3,"points":1,"explanation":"The group points to habitat loss and asks whether the marsh could help buffer water. It does not deny that the wall has a protective purpose.","evidence":"Paragraph B: ‘this would mean habitat loss’ and ‘the marsh itself might buffer the force of incoming water’."},{"id":"r05q04","type":"mc","prompt":"Which statement best captures Ruth’s position?","choices":["Investigation can continue, but people also need a safer route now.","Any temporary route would make a permanent solution unnecessary.","The council should build the wall before considering evidence.","Protecting customers requires closing the nature path permanently."],"answer":0,"points":1,"explanation":"Ruth accepts careful planning while emphasising an immediate need. Her position combines short-term access with a longer decision process.","evidence":"Paragraph D: ‘supported careful investigation but asked for a temporary route’."},{"id":"r05q05","type":"open","prompt":"Describe the trade-off in Idris’s proposal. Answer in one or two English sentences.","points":2,"model":"A path that bends around the wettest ground would preserve more marsh habit
