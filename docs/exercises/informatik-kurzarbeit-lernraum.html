const oldCheckModel=checkModel,oldCheckSchema=checkSchema;
checkModel=function(actual,s){if(!s.school)return oldCheckModel(actual,s);const o=report(),{map,used}=mapEntities(actual,s.model,o),usedR=new Set();for(const e of s.model.entities){const a=map.get(e.id);if(!a)continue;for(const ea of e.attrs){const aa=a.attrs.find(x=>match(x.name,ea));checkAdd(o,!!aa,`${e.name}: Attribut ${ea.name}${aa?' vorhanden.':' fehlt oder hängt am falschen Typ.'}`,a.id);if(ea.key&&aa)checkAdd(o,!!aa.key,`${e.name}.${ea.name}: vorgegebenen Schlüssel unterstreichen.`,a.id);}if(e.attrs.some(x=>x.key)){const k=e.attrs.filter(x=>x.key).map(x=>a.attrs.find(y=>match(y.name,x))?.id).filter(Boolean);checkAdd(o,sameSet(k,a.attrs.filter(x=>x.key).map(x=>x.id)),`${e.name}: nur die vorgegebenen Attribute bilden den gewählten Schlüssel.`,a.id);}for(const aa of a.attrs)if(!e.attrs.some(x=>match(aa.name,x)))o.notes.push(`${e.name}: „${aa.name}“ ist nicht in dieser Originalaufgabe vorgegeben. Begründe die Ergänzung.`);}
 for(const r of s.model.relations){const a=map.get(r.a),b=map.get(r.b);if(!a||!b){checkAdd(o,false,`${r.name}: zuerst die beteiligten Entitätstypen ergänzen.`);continue;}const pool=actual.relations.filter(x=>!usedR.has(x.id)&&((x.a===a.id&&x.b===b.id)||(x.a===b.id&&x.b===a.id)));const ar=pool.find(x=>match(x.name,r))||(pool.length===1?pool[0]:null);checkAdd(o,!!ar,`${r.name}: richtige Entitätstypen verbinden.`,ar?.id);if(!ar)continue;usedR.add(ar.id);let ca=ar.a===a.id?ar.ca:ar.cb,cb=ar.a===a.id?ar.cb:ar.ca;checkAdd(o,maxOf(ca)===maxOf(r.ca),`${oneName(a.name,true)} → ${partnerText(b.name,r.ca)}. Die ${maxOf(r.ca)} steht bei ${b.name}.`,ar.id);checkAdd(o,maxOf(cb)===maxOf(r.cb),`${oneName(b.name,true)} → ${partnerText(a.name,r.cb)}. Die ${leftNumber(r.ca,r.cb)} steht bei ${a.name}.`,ar.id);checkAdd(o,!!ar.name.trim(),`${r.name}: die Raute braucht ein passendes Verb.`,ar.id);if(!match(ar.name,r))o.notes.push(`„${ar.name}“ wurde anhand der Endpunkte als „${r.name}“ erkannt. Die Bedeutung eines freien Verbs musst du selbst prüfen.`);for(const ea of r.attrs){checkAdd(o,ar.attrs.some(x=>match(x.name,ea)),`${ea.name}: gehört an die Beziehung ${r.name}.`,ar.id);}}
 for(const a of actual.entities)if(!used.has(a.id)){if(s.openTask)o.notes.push(`Zusätzliche Entität ${a.name}: offene Aufgabe, fachlich selbst begründen.`);else checkAdd(o,false,`Zusätzliche Entität ${a.name} passt nicht zur direkten Musterstruktur.`,a.id);}for(const r of actual.relations)if(!usedR.has(r.id))checkAdd(o,false,`Zusätzliche oder nicht eindeutig zugeordnete Beziehung ${r.name}.`,r.id);o.notes.push(...s.notes);o.notes.push('Schulmodus: bewertet werden Typen, genannte Attribute, vorgegebene Schlüssel und maximale Kardinalitäten. Nicht genannte Mindestteilnahmen sind keine versteckten Bewertungskriterien. Freie Alternativmodelle benötigen eine fachliche Sichtprüfung.');return o;};
checkSchema=function(sc,s){if(!s.school)return oldCheckSchema(sc,s);const o=report(),map=new Map(),used=new Set(),usedG=new Set();const gkey=(t,g)=>t.id+':'+g.map(c=>c.id).sort().join(',');
 for(const e of s.model.entities){const t=sc.tables.find(t=>!used.has(t.id)&&match(t.name,e));checkAdd(o,!!t,`Relation ${e.name}${t?' vorhanden.':' fehlt oder ist anders benannt.'}`,t?.id);if(!t)continue;map.set(e.id,t);used.add(t.id);for(const a of e.attrs){const c=t.cols.find(c=>match(c.name,a));checkAdd(o,!!c,`${e.name}: Attribut ${a.name}.`,t.id);if(c&&a.key)checkAdd(o,c.pk,`${e.name}.${a.name}: als Primärschlüssel markieren.`,t.id);}const ids=e.attrs.filter(a=>a.key).map(a=>t.cols.find(c=>match(c.name,a))?.id).filter(Boolean);if(ids.length)checkAdd(o,sameSet(ids,t.cols.filter(c=>c.pk).map(c=>c.id)),`${e.name}: nur die vorgesehenen Attribute bilden gemeinsam den PS.`,t.id);}
 for(const r of s.model.relations){const a=map.get(r.a),b=map.get(r.b);if(!a||!b){checkAdd(o,false,`${r.name}: beteiligte Grundrelationen fehlen.`);continue;}let owner;const am=maxOf(r.ca),bm=maxOf(r.cb);
 if(am==='n'&&bm==='n'){owner=sc.tables.find(t=>!used.has(t.id)&&refGroupsTo(t,a).length&&refGroupsTo(t,b).length);checkAdd(o,!!owner,`${r.name}: eigene Zuordnungstabelle mit zwei richtigen Referenzen.`,owner?.id);if(!owner)continue;used.add(owner.id);const ga=refGroupsTo(owner,a)[0],gb=refGroupsTo(owner,b)[0],pair=[...ga,...gb];usedG.add(gkey(owner,ga));usedG.add(gkey(owner,gb));checkAdd(o,isUnique(owner,pair.map(c=>c.id)),`${owner.name}: beide Fremdschlüssel bilden gemeinsam den PS oder eine gleichwertige gemeinsame Eindeutigkeitsbedingung.`,owner.id);checkAdd(o,!uniqueSets(owner).some(u=>u.length<pair.length&&u.every(id=>pair.some(c=>c.id===id))),`${owner.name}: keine einzelne Zuordnungsseite darf allein eindeutig sein.`,owner.id);if(!sameSet(owner.cols.filter(c=>c.pk).map(c=>c.id),pair.map(c=>c.id)))o.notes.push(`${owner.name}: Die Unterrichtsmuster verwenden das Fremdschlüsselpaar als zusammengesetzten PS. Eine zusätzliche ID mit gemeinsamer Eindeutigkeitsregel ist eine technische Alternative.`);
 }else{let target,one=am==='1'&&bm==='1';if(one){let gb=refGroupsTo(b,a).find(g=>!usedG.has(gkey(b,g))),ga=refGroupsTo(a,b).find(g=>!usedG.has(gkey(a,g)));owner=gb?b:ga?a:b;target=owner===a?b:a;}else{owner=am==='n'?b:a;target=owner===a?b:a;}const g=refGroupsTo(owner,target).find(g=>!usedG.has(gkey(owner,g)));checkAdd(o,!!g,`${r.name}: Fremdschlüssel in ${owner.name} auf ${target.name}.`,owner.id);if(g){usedG.add(gkey(owner,g));checkAdd(o,one?isUnique(owner,g.map(c=>c.id)):!isUnique(owner,g.map(c=>c.id)),`${r.name}: ${one?'Der Fremdschlüssel muss eindeutig sein (1:1).':'Der Fremdschlüssel darf mehrfach vorkommen (1:n).'}`,owner.id);}}
 if(owner)for(const at of r.attrs)checkAdd(o,owner.cols.some(c=>match(c.name,at)),`${at.name} gehört in ${owner.name}.`,owner.id);}
 for(const t of sc.tables){checkAdd(o,t.cols.some(c=>c.pk),`${t.name}: genau einen, gegebenenfalls zusammengesetzten PS festlegen.`,t.id);checkAdd(o,new Set(t.cols.map(c=>norm(c.name))).size===t.cols.length,`${t.name}: keine doppelten Attributnamen.`,t.id);if(!used.has(t.id))checkAdd(o,false,`Zusätzliche oder nicht zugeordnete Relation ${t.name}.`,t.id);for(const g of foreignGroups(t))if(!usedG.has(gkey(t,g)))checkAdd(o,false,`${t.name}: zusätzliche, falsche oder unvollständige Referenz ${g.map(c=>c.name).join(', ')}.`,t.id);}
 o.notes.push(...s.notes);o.notes.push('Die Bewertung folgt den Abbildungsregeln der Unterrichtsblätter. Nicht vorgegebene Datentypen und NULL-Regeln werden hier nicht benotet. Eine freie Alternativlösung muss zusätzlich fachlich geprüft werden.');return o;};

function miniRelation(left='Kunde',right='Auftrag',name='erteilt',a='0,n',b='1,1',hide=false){return schoolERM({entities:[{id:'a',name:left,x:150,y:90,attrs:[]},{id:'b',name:right,x:750,y:90,attrs:[]}],relations:[{id:'r',name,a:'a',b:'b',ca:a,cb:b,attrs:[]}]},{blank:hide});}
const oldDashboard=dashboard;
dashboard=function(){const complete=C.tasks.filter(t=>(state.school.rubric[t.id]||[]).filter(Boolean).length===t.rubric.length).length;return `<div class="between wrap"><div class="eyebrow"><span class="dot"></span>UNTERRICHTSAUSGABE · INFORMATIK 12</div><span class="badge green">Ohne Konto · ohne Speicherung</span></div><section class="hero school-hero"><div class="hero-copy"><h1>Verstehen.<br>Zeichnen.<br><span>Sicher anwenden.</span></h1><p>Dein Unterricht, deine Aufgaben, deine Schreibweise.<br>Vom ersten Begriff bis zum fertigen Datenmodell auf Papier.</p><div class="row wrap">${schoolButton('Mit den Originalaufgaben lernen','nav','data-page="unterricht"','primary')}${btn('Lernstoff durchgehen','nav','','','data-page="learn"')}</div><div class="hero-meta"><span>${D.lessons.length} kompakte Lernkapitel</span><span>${C.tasks.filter(t=>!t.extra).length} Original-Aufgabengruppen</span><span>2 zusätzliche Probeaufgaben</span></div></div><div class="panel school-hero-art"><div class="eyebrow">DIE ZWEI FRAGEN, DIE ALLES KLÄREN</div><div class="direction-line"><span class="num-circle">1</span><div>Ein Kunde → wie viele Aufträge?<br><strong>Mehrere. Das n steht bei Auftrag.</strong></div></div><div class="school-svg-scroll">${miniRelation()}</div><div class="direction-line"><span class="num-circle">2</span><div>Ein Auftrag → wie viele Kunden?<br><strong>Einer. Die 1 steht bei Kunde.</strong></div></div><div class="hero-art-foot">Kunde <strong>1</strong> — erteilt — <strong>n</strong> Auftrag</div></div></section><section class="stats"><div class="stat"><div class="stat-symbol">${icon('chart')}</div><div><b>${allProgress()}<span> %</span></b><p>Automatischer Themenfortschritt</p></div></div><div class="stat"><div class="stat-symbol">${icon('book')}</div><div><b>${Object.values(state.lessons).filter(Boolean).length}<span> / ${D.lessons.length}</span></b><p>Kapitel als gelesen markiert</p></div></div><div class="stat"><div class="stat-symbol">${icon('pen')}</div><div><b>${complete}<span> / ${C.tasks.length}</span></b><p>Aufgaben selbst kontrolliert</p></div></div><div class="stat"><div class="stat-symbol">${icon('clock')}</div><div><b>${Math.floor(state.seconds/60)}<span> min</span></b><p>Aktive Lernzeit</p></div></div></section><div class="feature-grid mt24"><section class="panel tint"><div class="eyebrow">ZUERST VERSTEHEN</div><h2>Warum genau diese Verbindung?</h2><p class="small muted mt12">Fixiere ein Objekt, stelle beide Fragen und sieh, an welches Ende die Antwort gehört. Mit den Beispielen aus deinen Blättern.</p><div class="mt20">${schoolButton('Den Zwei-Fragen-Trainer öffnen','nav','data-page="cards"','primary')}</div></section><section class="panel"><div class="eyebrow">DANN AUF PAPIER KÖNNEN</div><h2>So sieht es in der Prüfung aus.</h2><p class="small muted mt12">Rechtecke, Rauten und Ellipsen. Relationskästen mit unterstrichenen PS, markierten FS und Linien direkt zwischen den Schlüsseln.</p><div class="mt20">${schoolButton('Papiertraining starten','nav','data-page="papier"')}</div></section></div><div class="section-head"><div><h2>Dein Weg durch den Stoff</h2><p>Die Begriffe zuerst. Dann die Beziehungen. Zum Schluss die vollständigen Aufgaben.</p></div></div><div class="path-grid">${D.lessons.map((l,i)=>`<button class="path-card" data-act="open-lesson" data-id="${l.id}"><span class="path-num">${String(i+1).padStart(2,'0')}</span><div class="grow"><h3>${esc(l.title)}</h3><p>${esc(l.short)}</p>${progress(topicProgress(l.id))}</div><span class="percentage">${topicProgress(l.id)}%</span></button>`).join('')}</div><div class="callout mt24"><strong>Wichtig für deine Prüfung:</strong> Die Standardansicht verwendet jetzt die Kardinalitäten-Schreibweise deiner Unterrichtsblätter, nicht die frühere lokale Min-Max-Darstellung.</div>`;};

function directionLab(){let s=bySid(U.dirCase)||bySid('u-carsharing'),r=s.model.relations[U.dirRelation]||s.model.relations[0],a=s.model.entities.find(e=>e.id===r.a),b=s.model.entities.find(e=>e.id===r.b),step=U.dirStep;let small={entities:[{...a,x:160,y:105,attrs:[]},{...b,x:790,y:105,attrs:[]}],relations:[{...r,attrs:[],x:475,y:105}]};return `<div class="cols2"><div class="field"><label for="dir-case">Unterrichtsbeispiel</label><select id="dir-case" data-school-change="dir-case">${C.scenarios.filter(x=>!x.openTask&&!x.ermOnly&&x.model.relations.length).map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div><div class="field"><label for="dir-relation">Beziehung</label><select id="dir-relation" data-school-change="dir-rel">${s.model.relations.map((x,i)=>`<option value="${i}" ${x.id===r.id?'selected':''}>${esc(s.model.entities.find(e=>e.id===x.a).name+' — '+x.name+' — '+s.model.entities.find(e=>e.id===x.b).name)}</option>`).join('')}</select></div></div><div class="direction-steps"><button data-school="dir-step" data-step="0" class="${step===0?'active':''}">1 · Zusammenhang</button><button data-school="dir-step" data-step="1" class="${step===1?'active':''}">2 · ${esc(oneName(a.name,true))}</button><button data-school="dir-step" data-step="2" class="${step===2?'active':''}">3 · ${esc(oneName(b.name,true))}</button><button data-school="dir-step" data-step="3" class="${step===3?'active':''}">4 · Zusammensetzen</button></div><div class="school-svg-scroll focus-direction step-${step}">${schoolERM(small)}</div><div class="feedback mt16">${step===0?`<b>Welche Zuordnung muss gespeichert werden?</b>Die Aufgabe beschreibt ausdrücklich die Beziehung „${esc(r.name)}“ zwischen ${esc(a.name)} und ${esc(b.name)}. Genau diese Information braucht eine Verbindung; nicht einfach jedes Paar von Rechtecken.`:step===1?`<b>Fixiere genau EIN Objekt: ${esc(a.name)}.</b>Wie viele ${esc(pluralName(b.name))} sind über die Beziehung „${esc(r.name)}“ möglich? <strong>${maxOf(r.ca)==='n'?'Mehrere':'Höchstens eines'}.</strong><br>Die Antwort <strong>${maxOf(r.ca)}</strong> steht am Ziel der Frage, also bei <strong>${esc(b.name)}</strong>.`:step===2?`<b>Wechsle die Richtung: genau EIN Objekt ${esc(b.name)}.</b>Wie viele ${esc(pluralName(a.name))} sind über diese Beziehung möglich? <strong>${maxOf(r.cb)==='n'?'Mehrere':'Höchstens eines'}.</strong><br>Die Antwort <strong>${leftNumber(r.ca,r.cb)}</strong> steht jetzt bei <strong>${esc(a.name)}</strong>.`:`<b>Jetzt beide Enden zusammen lesen: ${esc(a.name)} ${srRatio(r.ca,r.cb)} ${esc(b.name)}.</b>Die Zahlen gehören nicht zur Größe eines einzelnen Kastens. Sie beschreiben die erlaubte Zuordnung zwischen Objekten. Beide Leserichtungen sind nötig.<br>${maxOf(r.ca)==='n'&&maxOf(r.cb)==='n'?'Beide Seiten erlauben mehrere Partner. Deshalb folgt im relationalen Modell eine Zuordnungstabelle.':'Die Fremdschlüsselregel folgt erst im nächsten Schritt, wenn du Relationen zeichnest.'}`}</div><div class="between mt16">${schoolButton('Zurück','dir-step',`data-step="${Math.max(0,step-1)}" ${step===0?'disabled':''}`,'sm')}${schoolButton(step===3?'Von vorn':'Nächster Gedankenschritt','dir-step',`data-step="${(step+1)%4}"`,'sm primary')}</div>`;}
function keyLab(){const rows=[['17','Mara','Beck'],['18','Mara','Beck'],['19','Jonas','Winter']],sel=U.keyChoice;return `<p>Wähle einen Schlüsselvorschlag für diese Beispieldaten. Zwei Personen heißen absichtlich gleich.</p>${tableHTML(['Personal-Nr.','Vorname','Name'],rows)}<div class="chip-list">${[['id','Personal-Nr.'],['name','Name'],['full','Vorname + Name']].map(([id,title])=>`<button class="chip ${sel===id?'active':''}" data-school="key-choice" data-value="${id}">${title}</button>`).join('')}</div>${sel?`<div class="feedback ${sel==='id'?'good':'bad'}"><b>${sel==='id'?'In diesen Daten eindeutig.':'Nicht eindeutig.'}</b>${sel==='id'?'17, 18 und 19 unterscheiden die Personen. Die fortlaufende Personal-Nr. ist ein künstlicher, einfacher Schlüssel. Für das gesamte System muss die Nummernvergabe ihre Eindeutigkeit sicherstellen.':sel==='name'?'Der Name Beck kommt zweimal vor. Er kann diese Personen nicht unterscheiden.':'Auch das Paar Mara | Beck kommt zweimal vor. Zwei Spalten machen die Kombination nicht automatisch zu einem gültigen Schlüssel. Es ist ein zusammengesetzter Vorschlag, aber hier ungeeignet.'}</div>`:''}<div class="callout mt16"><strong>FIN ist natürlich, obwohl sie vergeben wird.</strong> Im Fahrzeugmodell ist sie als fachliche Kennung bereits vorhanden. „Zusammengesetzt“ sagt dagegen, wie viele Attribute gemeinsam verwendet werden.</div>`;}
function tableHTML(head,rows){return `<div class="table-wrap mt16"><table><thead><tr>${head.map(v=>`<th>${esc(v)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function mnLab(){const s=bySid('u-avallon'),all=makeSchema(s);let sc=clone(all);sc.tables=sc.tables.filter(t=>['Auftrag','Produkt','Auftragsposition'].includes(t.name)).sort((a,b)=>['Auftrag','Auftragsposition','Produkt'].indexOf(a.name)-['Auftrag','Auftragsposition','Produkt'].indexOf(b.name));sc.tables.forEach(t=>{t.cols=t.cols.filter(c=>!c.refTable||sc.tables.some(x=>x.id===c.refTable));});const step=U.mnStep;let html='';if(step===0){html=diagramBlock(miniRelation('Auftrag','Produkt','enthält','1,n','0,n'))+`<div class="feedback"><b>Beide Richtungen erlauben mehrere Partner.</b>Ein Auftrag enthält mehrere Produkte. Ein Produkt kann in mehreren Aufträgen vorkommen. Ein einzelner Produkt-Fremdschlüssel in Auftrag reicht deshalb nicht.</div>`;}else if(step===1){sc.tables=sc.tables.filter(t=>t.name!=='Auftragsposition');html=diagramBlock(schoolSchema(sc))+`<div class="feedback"><b>Erst die zwei Grundrelationen.</b>Auftrag speichert Auftragsdaten. Produkt speichert Produktdaten. Zwischen den beiden fehlen noch die einzelnen Zuordnungen.</div>`;}else{html=diagramBlock(schoolSchema(sc))+`<div class="feedback"><b>${step===2?'Jetzt das Paar in eine eigene Relation.':'Jede Zeile bedeutet: dieses Produkt in diesem Auftrag.'}</b>Auftrags-ID und Produkt-ID sind jeweils Fremdschlüssel und <strong>gemeinsam ein Primärschlüssel</strong>. Menge gehört zu diesem Paar. Aus m:n werden zwei 1:n-Verbindungen mit der n-Seite bei Auftragsposition.</div>`;if(step===3)html+=tableHTML(['Auftrags-ID (PS, FS)','Produkt-ID (PS, FS)','Menge'],[['70','1','200'],['70','2',U.quantityAdded?'60':'50'],['71','2','120'],['71','4','40'],['72','3','30']])+`<div class="row wrap mt16">${schoolButton('10 Stück zu 70 | 2 hinzufügen','mn-add','','sm')}${schoolButton('Doppeltes Paar 70 | 2 versuchen','mn-duplicate','','sm')}${schoolButton('Zurücksetzen','mn-reset','','sm')}</div>${U.mnMessage?`<div class="feedback ${U.mnMessage.startsWith('Abgelehnt')?'bad':'good'} mt16">${esc(U.mnMessage)}</div>`:''}`;}
return `<div class="direction-steps">${['m:n erkennen','Grundrelationen','Zuordnung ergänzen','Daten prüfen'].map((label,i)=>`<button class="${step===i?'active':''}" data-school="mn-step" data-step="${i}">${i+1} · ${label}</button>`).join('')}</div>${html}<div class="mt16">${schoolButton('Originalaufgabe 07 / 5 bearbeiten','open-task','data-id="07-5"','primary sm')}</div>`;}
function drawingLab(){const s=bySid('u-avallon'),sc=makeSchema(s);sc.tables=sc.tables.filter(t=>['Kunde','Auftrag'].includes(t.name));sc.tables.forEach(t=>{t.cols=t.cols.filter(c=>!c.refTable||sc.tables.some(x=>x.id===c.refTable));});return diagramBlock(schoolSchema(sc))+'<div class="callout"><strong>So überträgst du das auf Papier:</strong> Zwei Kästen zeichnen. Namen oben abtrennen. Attribute untereinander. Kunden-ID und Auftrags-ID als PS unterstreichen. Kunden-ID in Auftrag ergänzen und (FS) notieren. Die Linie genau auf Höhe dieser beiden Kunden-ID-Zeilen zeichnen: 1 bei Kunde, n bei Auftrag.</div><div class="mt16">'+schoolButton('Leere Zeichenblätter öffnen','nav','data-page="papier"','sm primary')+'</div>';}

 '07-5':[{key:'positions',title:'Auftragsposition',head:['Auftrags-ID (PS, FS)','Produkt-ID (PS, FS)','Menge'],rows:[['70','1','200'],['70','2','50'],['71','2','120'],['71','4','40'],['72','3','30']],keys:[0,1]}],

function fieldEqual(value,expected){if(/^\d+$/.test(String(expected))){const v=String(value).trim();return /^\d+(?:[.,]\d+)?$/.test(v)&&Number(v.replace(',','.'))===Number(expected);}const n=v=>norm(v).replace(/primär/g,'primaer').replace(/\(.*?\)/g,'');const aliases={primaerschluessel:['ps','pk','primarykey'],fremdschluessel:['fs','fk','foreignkey'],mengen:['menge']};let x=n(value),y=n(expected);if(x===y)return true;if(expected==='m:n')return ['nm','mn'].includes(x);if((aliases[y]||[]).includes(x))return true;if(y==='kundenid'&&['kundenidfs','kundennummer','kundennr'].includes(x))return true;if(y==='zusammengesetzten'&&['zusammengesetzt','verbund'].includes(x))return true;return false;}
function dateNorm(v){let x=String(v).trim().replace('T',' ').replace(/\s+/g,' ');let m=x.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})\s+(\d{1,2}):(\d{2})(?::00)?(?:\s*Uhr)?$/i);if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')} ${m[4].padStart(2,'0')}:${m[5]}`;m=x.match(/^(\d{4})-(\d{1,2})-(\d{1,2})\s+(\d{1,2}):(\d{2})(?::00)?$/);return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')} ${m[4].padStart(2,'0')}:${m[5]}`:x;}
function gradeOriginal(t){const a=answersFor(t.id),items=[];for(const f of t.fields){const ok=fieldEqual(a[f.key]||'',f.answer);items.push({good:ok,key:f.key,label:f.label,expected:f.answer});}for(const g of GRID_TASKS[t.id]||[]){const seen=new Set();g.rows.forEach((_,i)=>{const vals=g.head.map((_,j)=>a[g.key+'_'+i+'_'+j]||''),signature=g.keys.map(j=>norm(vals[j])).join('|');const wanted=g.rows.find(row=>g.keys.every(j=>norm(row[j])===norm(vals[j])));if(seen.has(signature)&&signature.replace(/\|/g,'')){items.push({good:false,label:`${g.title}: Schlüssel in Zeile ${i+1} doppelt.`,expected:'Jede vollständige Schlüsselkombination darf nur einmal vorkommen.'});}seen.add(signature);g.head.forEach((h,j)=>{let exp=wanted?.[j]??g.rows[i][j];let good=!!wanted&&(g.dates?.includes(j)?dateNorm(vals[j])===dateNorm(exp):g.head[j].includes('E-Mail')?String(vals[j]).trim().toLowerCase()===String(exp).toLowerCase():fieldEqual(vals[j],exp));items.push({good,key:g.key+'_'+i+'_'+j,label:g.title+' · Zeile '+(i+1)+' · '+h,expected:exp});});});}U.autoResult={task:t.id,items,score:items.filter(x=>x.good).length,total:items.length};return U.autoResult;}
function autoFeedback(t){const f=U.autoResult;if(!f||f.task!==t.id)return '';return `<div class="feedback ${f.score===f.total?'good':'bad'} mt20" role="status"><b>${f.score} von ${f.total} automatisch prüfbaren Feldern richtig.</b>Freie Begründungen und Papierzeichnungen werden nicht automatisch bewertet.${f.items.some(x=>!x.good)?'<details class="mt12"><summary>Rückmeldung zu den Feldern</summary>'+f.items.filter(x=>!x.good).map(x=>`<p>${esc(x.label)}: erwartet <strong>${esc(x.expected)}</strong>.</p>`).join('')+'</details>':''}</div>`;}
function taskMenu(){const tasks=C.tasks.filter(t=>(U.source==='all'||t.source===U.source)&&norm(t.title+' '+t.prompt.replace(/<[^>]+>/g,' ')).includes(norm(U.query)));return tasks.map(t=>{const checks=state.school.rubric[t.id]||[],done=checks.filter(Boolean).length===t.rubric.length;return `<button data-school="open-task" data-id="${t.id}" class="${U.task===t.id?'active':''}"><span class="task-source">${t.source==='extra'?'PLUS':t.source}</span><span>${esc(t.title.replace(/^Aufgabe |^Übung /,''))}</span>${done?'<b class="green">✓</b>':''}</button>`;}).join('')||'<p class="small muted">Keine passende Aufgabe. Suche oder Filter ändern.</p>';}
function originalTaskView(){const t=courseTask(U.task),a=answersFor(t.id),sid=t.scenario,s=sid?bySid(sid):null,revealed=state.school.revealed[t.id],hints=state.school.hints[t.id]||0;const tools=`${schoolButton('Papierblatt','print-task',`data-id="${t.id}"`,'sm')}`;let content='';if(U.taskTab==='original'){content=t.pages.map(n=>sourceImage(t.source+'-'+n)).join('')||'<div class="callout">Zusätzlich erstellte Aufgabe: Es gibt dazu kein Arbeitsblatt.</div>';}else if(U.taskTab==='solution'){content=revealed?`<div class="solution-source">${t.provided?`<b>Mitgelieferte Lösung als Grundlage</b><br>${esc(t.provided)}. Diagramme sind neu gesetzt; Erläuterungen sind ergänzt.`:'<b>Eigener Lösungsvorschlag</b><br>Für diese Teilaufgabe wurde keine ausgefüllte Musterlösung mitgeliefert. Annahmen und mögliche Alternativen sind ausdrücklich gekennzeichnet.'}</div><div class="worksheet-prose">${expandTokens(t.solution)}</div>`:`<div class="empty-state"><h3>Erst selbst versuchen.</h3><p>Beim Öffnen der Lösung wird die Aufgabe als mit Hilfe bearbeitet gekennzeichnet. Deine Eingaben bleiben erhalten.</p>${schoolButton('Lösung jetzt anzeigen','reveal-task',`data-id="${t.id}"`,'primary')}</div>`;}else{content=`<div class="worksheet-prose original-reading">${expandTokens(t.prompt)}</div><p class="source-caption">Lesefassung mit angepassten Zeilenumbrüchen. Die vollständige Aufgabenanordnung steht auf deinem Arbeitsblatt.</p>${s?`<div class="row wrap mt20">${['erm','both'].includes(t.kind)?btn('Im ERM-Editor zeichnen','start-erm','pen','primary',`data-id="${sid}"`):''}${['schema','both'].includes(t.kind)&&!s.ermOnly?btn('Im Relationen-Editor lösen','start-schema','table','primary',`data-id="${sid}"`):''}${schoolButton('Auf Papier zeichnen','print-task',`data-id="${t.id}"`)}</div>`:''}${t.id==='06-2'?`<div class="mt16">${btn('Zusatz: Leitung separat üben','start-erm','network','sm','data-id="u-personal-leitung"')}</div>`:''}${fieldsHTML(t)}${gridsHTML(t)}<div class="field mt24"><label for="answer-${t.id}-text">Deine Begründung, Annahmen oder Papiernotizen · nur bis zum Neuladen</label><textarea rows="6" id="answer-${t.id}-text" data-school-answer="${t.id}" data-key="text" placeholder="Ein … kann mehrere … . Umgekehrt … . Deshalb steht … .">${esc(a.text||'')}</textarea></div><div class="row wrap">${(t.fields.length||GRID_TASKS[t.id])?schoolButton('Felder prüfen','grade-task',`data-id="${t.id}"`,'primary'):''}${schoolButton('Hinweis '+Math.min(hints+1,3)+' / 3','task-hint',`data-id="${t.id}" ${hints>=3?'disabled':''}`)}${schoolButton('Lösung vergleichen','reveal-task',`data-id="${t.id}"`)}${schoolButton('Eingaben löschen','clear-task',`data-id="${t.id}"`,'sm')}</div>${hints?`<div class="hint-area mt16"><b>Hinweis ${hints}</b><br>${esc(t.hints[hints-1]||t.hints.at(-1))}</div>`:''}${autoFeedback(t)}`;}

propertiesHTML=function(){const n=selectedNode(),m=getModel();if(!n||m.entities.some(e=>e.id===n.id)||state.school.settings.notation==='minmax')return oldProperties();const a=m.entities.find(e=>e.id===n.a),b=m.entities.find(e=>e.id===n.b);const choices=v=>`<option value="0,1" ${maxOf(v)==='1'?'selected':''}>Höchstens ein Partner (1)</option><option value="0,n" ${maxOf(v)==='n'?'selected':''}>Mehrere Partner (n)</option>`;return `<div><div class="between"><h3>Beziehung</h3>${ib('trash','delete-node','Beziehung löschen')}</div><div class="field"><label for="prop-name">Verb in der Raute</label><input id="prop-name" data-prop="name" value="${esc(n.name)}" maxlength="60"></div><div class="field"><label for="prop-a">Entitätstyp A</label><select id="prop-a" data-prop="a">${m.entities.map(e=>`<option value="${e.id}" ${n.a===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div><div class="field"><label for="prop-b">Entitätstyp B</label><select id="prop-b" data-prop="b">${m.entities.map(e=>`<option value="${e.id}" ${n.b===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div><div class="field"><label for="prop-ca">Ein ${esc(a?.name)} → wie viele ${esc(b?.name)}?</label><select id="prop-ca" data-prop="ca">${choices(n.ca)}</select><small class="blue">Diese Zahl steht bei ${esc(b?.name)}.</small></div><div class="field"><label for="prop-cb">Ein ${esc(b?.name)} → wie viele ${esc(a?.name)}?</label><select id="prop-cb" data-prop="cb">${choices(n.cb)}</select><small class="purple">Diese Zahl steht bei ${esc(a?.name)}.</small></div>${n.a===n.b?`<div class="field"><label for="role-a">Rolle A</label><input id="role-a" data-prop="role0" value="${esc(n.roles?.[0]||'')}"></div><div class="field"><label for="role-b">Rolle B</label><input id="role-b" data-prop="role1" value="${esc(n.roles?.[1]||'')}"></div>`:''}<span class="badge purple">${srRatio(n.ca,n.cb)}</span></div><div><h4>Beziehungsattribute</h4>${n.attrs.map(at=>`<div class="attr-item"><span>${esc(at.name)}</span>${ib('pen','edit-attribute','Attribut bearbeiten',`data-id="${at.id}" data-owner="${n.id}"`)}</div>`).join('')}<div class="mt16">${btn('Attribut ergänzen','add-attribute','plus','sm',`data-owner="${n.id}"`)}</div><p class="notation">Zum Beispiel Menge je Auftrag und Produkt. Pflichtteilnahmen stehen im Text; die Schulzeichnung verwendet 1, n und m.</p></div>`;};
const oldRelationForm=relationForm;
relationForm=function(){if(state.school.settings.notation==='minmax')return oldRelationForm();oldRelationForm();const d=$('#modal');$('label[for=rel-ca]',d).textContent='Ein Objekt A → wie viele Objekte B?';$('label[for=rel-cb]',d).textContent='Ein Objekt B → wie viele Objekte A?';$('#rel-ca',d).innerHTML='<option value="0,1">Höchstens ein Partner (1)</option><option value="0,n" selected>Mehrere Partner (n)</option>';$('#rel-cb',d).innerHTML='<option value="0,1" selected>Höchstens ein Partner (1)</option><option value="0,n">Mehrere Partner (n)</option>';$('.callout',d).innerHTML='<strong>Wie im Unterricht:</strong> Die Antwort auf die erste Frage steht bei B. Die Antwort auf die zweite Frage steht bei A. Erst beide Antworten bestimmen 1:1, 1:n, n:1 oder m:n.';};
const oldEditorView=editorView;
editorView=function(embedded=false){let h=oldEditorView(embedded);h=h.replace('(min,max) je Objekt an dieser Seite','1 / n / m am Ziel der Leserichtung');if(state.school.settings.notation!=='minmax')h=h.replace('Zeichne ein vollständiges Modell. Wähle Elemente für ihre Eigenschaften. Verschiebe sie direkt auf der Zeichenfläche.','Zeichne wie auf deinen Unterrichtsblättern: Rechtecke, Rauten, Ellipsen und 1/n/m an den richtigen Enden.');if(!embedded){h=`<div class="notation-switch"><span class="badge purple">${state.school.settings.notation==='minmax'?'ZUSATZ: LOKALE MIN-MAX-NOTATION':'UNTERRICHTSSCHREIBWEISE'}</span><label>Darstellung <select data-school-change="notation"><option value="school" ${state.school.settings.notation!=='minmax'?'selected':''}>Schule: 1 / n / m</option><option value="minmax" ${state.school.settings.notation==='minmax'?'selected':''}>Vertiefung: lokale Min-Max-Paare</option></select></label></div>`+h;}return h;};
notationDialog=function(){modal('Die Schreibweise deiner Unterrichtsblätter',`<div class="stack"><div class="callout"><strong>Die Antwort steht am Ziel der Leserichtung.</strong> Ein Kunde → wie viele Aufträge? Mehrere: n bei Auftrag. Ein Auftrag → wie viele Kunden? Einer: 1 bei Kunde.</div>${diagramBlock(miniRelation())}<p>Rechteck: Entitätstyp im Singular. Ellipse: Attribut. Raute: Beziehung mit einem Verb. Ein festgelegtes Schlüsselattribut wird unterstrichen.</p><p>Im relationalen Modell: Kasten mit Namen oben und Attributen untereinander. PS unterstreichen und (PS) ergänzen. FS mit (FS) markieren. Eine Linie verbindet genau die zugehörigen Schlüsselzeilen.</p><details><summary>Unterschied zur früheren Min-Max-Ansicht</summary><p class="mt12">Die lokale Angabe (0,n) beim Kunden zählt die Teilnahmen dieses Kunden. Das n der Unterrichts-Verhältnisnotation steht dagegen bei Auftrag. Das sind zwei Darstellungsregeln für denselben Zusammenhang, keine widersprüchlichen Geschäftsregeln. Die Originalaufgaben verwenden 1/n/m.</p></details></div>`,true);};
const oldSchemaTableHTML=schemaTableHTML;
schemaTableHTML=function(t,sc,editable=true){return `<div class="schema-table school-table" id="table-${esc(t.id)}"><div class="table-head"><h3>${esc(t.name)}</h3>${editable?ib('pen','rename-table','Relation umbenennen',`data-id="${t.id}"`)+ib('trash','delete-table','Relation löschen',`data-id="${t.id}"`):''}</div>${t.cols.map(c=>{let target=sc.tables.find(x=>x.id===c.refTable),ref=target?.cols.find(x=>x.id===c.refCol);return `<${editable?'button':'div'} class="col-row" ${editable?`data-act="edit-column" data-table="${t.id}" data-id="${c.id}"`:''}><div><span class="${c.pk?'school-pk':c.refTable?'school-fk':''}">${esc(c.name)}</span>${c.pk||c.refTable?` <span class="small">(${c.pk&&c.refTable?'PS, FS':c.pk?'PS':'FS'})</span>`:''}${target?`<div class="tiny muted">→ ${esc(target.name)}.${esc(ref?.name||'?')}</div>`:''}</div>${c.unique?'<span class="badge blue">eindeutig</span>':''}</${editable?'button':'div'}>`;}).join('')||'<p class="small muted" style="padding:15px">Noch keine Attribute.</p>'}${(t.uniqueGroups||[]).map((g,i)=>`<div class="schema-note between"><span>Gemeinsam eindeutig: ${g.map(id=>esc(t.cols.find(c=>c.id===id)?.name||'?')).join(' + ')}</span>${editable?ib('close','delete-unique','Eindeutigkeit entfernen',`data-table="${t.id}" data-index="${i}"`):''}</div>`).join('')}${editable?`<div class="table-bottom">${btn('Attribut','add-column','plus','sm',`data-id="${t.id}"`)}${btn('Gemeinsam eindeutig','unique-group','link','sm',`data-id="${t.id}"`)}</div>`:''}</div>`;};
const oldColumnForm=columnForm;
columnForm=function(t,c=null){oldColumnForm(t,c);$('#modal .modal-body').innerHTML=$('#modal .modal-body').innerHTML.replaceAll('Primärschlüssels (PK)','Primärschlüssels (PS)').replaceAll(' · PK',' · PS').replace('Datentyp</label>','Datentyp · technischer Zusatz</label>');};
schemaView=function(embedded=false){const exam=state.exam?.active&&UI.page==='exam',ctx=schemaCtx(),s=ctx==='custom'?{id:'custom',title:'Dein eigener Entwurf',model:state.customModel||blank(),text:'Aus deinem eigenen ERM übernommen.',notes:[]}:scenario(exam?state.exam.schemaScenario:ctx),sc=getSchema();const narrative=exam||UI.schemaInput==='text';let h=embedded?'':pageHead('TEXT ODER ERM → RELATIONALES MODELL','Zeichne den Bauplan deiner Tabellen.','PS unterstreichen. FS markieren. Die passenden Schlüsselzeilen verbinden. Die Vorschau entsteht direkt aus deinem Entwurf.',btn('Abbildungsregeln','schema-rules','info'));
 if(!exam)h+=`<div class="field" style="max-width:640px"><label for="schema-task">Aufgabe auswählen</label><select id="schema-task" data-change="schema-context"><optgroup label="Originalunterricht und Probeklausuren">${C.scenarios.filter(s=>!s.ermOnly).map(x=>`<option value="${x.id}" ${x.id===ctx?'selected':''}>${esc(x.title)}</option>`).join('')}</optgroup><optgroup label="Weitere Übungen aus der bisherigen Version">${D.scenarios.filter(x=>!x.school).map(x=>`<option value="${x.id}" ${x.id===ctx?'selected':''}>${esc(x.title)}</option>`).join('')}</optgroup>${state.customModel?`<option value="custom" ${ctx==='custom'?'selected':''}>Eigener Entwurf</option>`:''}</select></div>`;
 h+=`<section class="panel"><div class="between wrap"><h3>${esc(s.title)}</h3><span class="badge purple">${narrative?'NUR SACHTEXT':'ERM ALS VORLAGE'}</span></div>${s.source?citeSource(s.source,s.pages):''}${!exam?`<div class="tabs"><button data-school="schema-input" data-value="erm" class="${!narrative?'active':''}">Mit ERM-Vorlage</button><button data-school="schema-input" data-value="text" class="${narrative?'active':''}">Nur Sachtext</button></div>`:''}${narrative?`<p class="task-text">${esc(s.text).replace(/\n/g,'<br>')}</p>`:diagramBlock(schoolERM(s.model))}${!exam?`<details class="mt16"><summary>Aufgabentext und Quellenhinweise</summary><p class="small mt12">${esc(s.text).replace(/\n/g,'<br>')}</p>${s.notes.map(n=>`<p class="tiny muted mt12">${esc(n)}</p>`).join('')}</details>`:''}</section>`;
 h+=`<div class="schema-tools">${btn('Relation hinzufügen','add-table','plus','primary')}${btn('Rückgängig','undo-schema','undo')}${btn('Wiederholen','redo-schema','redo')}${!exam?btn('Grundrelationen als Hilfe','schema-base','spark')+btn('Musterlösung','schema-solution','eye')+btn('Neuer Versuch','new-schema-attempt','refresh'):''}</div><section class="panel schema-drawing"><div class="between wrap"><h3>Deine Zeichnung im Unterrichtsformat</h3><div class="row wrap">${schoolButton('Zeichnung als SVG','schema-svg','','sm')}${schoolButton('Zeichnung drucken','print-schema','','sm')}</div></div><div id="schema-preview" class="mt16">${sc.tables.length?diagramBlock(schoolSchema(sc,s,{highlight:U.activeRef,interactive:true})):schoolSchema(sc,s)}</div><p class="tiny muted mt12">Ein gemeinsamer Primärschlüssel kann mehrere unterstrichene Attribute haben. Ein normaler FS darf sich wiederholen. Eine 1:1-Referenz muss eindeutig sein.</p></section><div class="section-head"><div><h2>Relationen bearbeiten</h2><p>Klicke ein Attribut an, um PS, FS und Referenzziel festzulegen.</p></div></div><div class="schema-grid">${sc.tables.map(t=>schemaTableHTML(t,sc)).join('')}</div>`;
 if(!sc.tables.length)h+=`<div class="empty-state">${btn('Erste Relation anlegen','add-table','plus','soft')}</div>`;
 if(!exam)h+=`<div class="row wrap mt24">${btn('Modell prüfen','grade-schema','check','primary')}${btn('Schema als Text','schema-text','copy')}${btn('SQL · Zusatz','show-sql','scan')}</div>${UI.schemaCheck?checkHTML(UI.schemaCheck,'Auswertung deines relationalen Modells'):''}${noteBox('schema:'+ctx)}`;return h;};
showModelSolution=function(s,allowLoad=true){markSeen('erm:'+s.id);modal('ERM-Lösung · '+esc(s.title),`<div class="callout">${s.school?'Schulnotation mit 1, n und m. ':'Zusätzliche Übung. '}Die automatisch prüfbare Musterstruktur ersetzt bei offenen Aufgaben keine fachliche Beurteilung anderer Lösungen.</div>${diagramBlock(schoolERM(s.model))}${readings(s)}${s.notes.map(n=>`<div class="callout mt12">${esc(n)}</div>`).join('')}${allowLoad?`<div class="modal-footer">${btn('Muster in den Editor übernehmen','load-model-solution','pen','primary',`data-id="${s.id}"`)}</div>`:''}`,true);};
showSchemaSolution=function(s,allowLoad=true){markSeen('schema:'+s.id);const sc=makeSchema(s);modal('Relationenlösung · '+esc(s.title),`${diagramBlock(schoolSchema(sc,s))}<div class="schema-grid">${sc.tables.map(t=>schemaTableHTML(t,sc,false)).join('')}</div>${s.notes.map(n=>`<div class="callout mt12">${esc(n)}</div>`).join('')}${allowLoad?`<div class="modal-footer">${btn('Muster in den Editor übernehmen','load-schema-solution','table','primary',`data-id="${s.id}"`)}</div>`:''}`,true);};
schemaRules=function(){modal('Die vier Abbildungsregeln aus Blatt 07',`<div class="stack"><div class="callout"><b>1. Entitätstyp → Relation.</b> Attribute untereinander. Primärschlüssel unterstreichen und (PS) ergänzen.</div><div class="callout"><b>2. 1:n → PS der 1-Seite als FS auf die n-Seite.</b> Verbinde die konkreten Schlüsselzeilen. 1 am referenzierten PS, n am FS.</div><div class="callout"><b>3. m:n → Zuordnungstabelle.</b> Beide PS als FS übernehmen. Zusammen bilden sie einen zusammengesetzten PS. Beide Namen unterstreichen und jeweils (PS, FS) notieren. Beziehungsattribute kommen ebenfalls in diese Relation.</div><div class="callout"><b>4. 1:1 → eindeutiger FS in einer Seite.</b> Jeder referenzierte Wert darf dort höchstens einmal vorkommen. Alternativ können die Typen zusammengefasst werden, sofern keine fachliche Trennung verlangt ist.</div><p class="small muted">Quelle: 07_Arbeitsblatt_Relationales_Modell.pdf, Seiten 3–7. Technische Zusatzbedingungen wie NULL und UNIQUE sind von der geforderten Schulzeichnung zu unterscheiden.</p></div>`);};

/* Paper practice and text-based mock examinations. */
function blankDrawing(title='Zeichenfläche',size='large'){return `<section class="drawing-sheet ${size}"><div class="drawing-sheet-head"><strong>${esc(title)}</strong><span>Name: ____________________ &nbsp; Datum: ______________</span></div><div class="drawing-grid"></div><p>Kontrolle: alle Typen und Attribute · beide Kardinalitäten · PS unterstrichen · FS gekennzeichnet · Schlüsselzeilen verbunden</p></section>`;}
function printableTaskBody(t,solutions=false){return `<section class="print-task"><div class="book-kicker">MODELLRAUM · PAPIERTRAINING · ${t.extra?'ZUSATZAUFGABE':'ORIGINAL '+t.source}</div><h1>${esc(t.title)}</h1>${citeSource(t.source,t.pages)}<div class="worksheet-prose">${expandTokens(t.prompt)}</div><div class="paper-answer-lines"></div></section>${t.scenario?blankDrawing('Dein Modell · '+t.title):''}${solutions?`<section class="print-task solution-print"><h2>Lösung und Begründung</h2><div class="worksheet-prose">${expandTokens(t.solution)}</div></section>`:''}`;}
function mockPaper(a='x-lernwerkstatt',b='x-veranstaltung',solutions=false){const sa=bySid(a),sb=bySid(b);return `<section class="print-task"><div class="book-kicker">MODELLRAUM · ZUSÄTZLICH ERSTELLTE PROBEKLAUSUR</div><h1>Vom Text zum Datenmodell</h1><p>Arbeite ohne Musterlösung. Dies ist ein Übungsbogen, keine angekündigte Originalprüfung. Für die beiden Modelle ist jeweils eine eigene Zeichenfläche vorgesehen.</p><h2>Teil A · Grundlagen und Fehlerdiagnose</h2><p>1. Unterscheide Datenbank, DBMS und Datenbanksystem.<br>2. Nenne die vier Phasen der Datenbankentwicklung in der Unterrichtsreihenfolge.<br>3. Erkläre Entität, Entitätstyp, Attribut und Attributwert mit je einem Beispiel.<br>4. Begründe: FIN ist ein natürlicher Schlüssel; Name + Vorname ist nicht automatisch ein geeigneter Primärschlüssel.<br>5. Ein Kunde kann mehrere Aufträge erteilen. Jeder Auftrag hat einen Kunden. Begründe die Kardinalität in beiden Richtungen und gib die Position der beiden Zahlen an.<br>6. Fehler: Auftrag(Auftrags-Nr. PS, Datum, Produkt-Nr. FS, Menge), obwohl Auftrag und Produkt m:n verknüpft sind. Beschreibe zwei Probleme und die richtige Struktur.</p><div class="paper-answer-lines"></div></section><section class="print-task"><div class="book-kicker">TEIL B · SACHTEXT → SEMANTISCHES MODELL</div><h1>${esc(sa.title)}</h1><p class="exam-text">${esc(sa.text).replace(/\n/g,'<br>')}</p><p><strong>Arbeitsauftrag:</strong> Zeichne ein zusammenhängendes ERM mit Entitätstypen, Attributen, Schlüsselmarkierungen und Kardinalitäten. Verwende Rechtecke, Ellipsen und Rauten. Begründe die Beziehungen in beiden Leserichtungen.</p>${sa.source!=='extra'?citeSource(sa.source,sa.pages):'<p class="source-caption">Zusätzlich erstellter Übungstext.</p>'}</section>${blankDrawing('Teil B · Dein ER-Modell')}<section class="print-task"><div class="book-kicker">TEIL C · SACHTEXT → RELATIONALES MODELL</div><h1>${esc(sb.title)}</h1><p class="exam-text">${esc(sb.text).replace(/\n/g,'<br>')}</p><p><strong>Arbeitsauftrag:</strong> Erstelle direkt das relationale Modell. Zeichne Relationskästen mit Attributen untereinander. Unterstreiche die Primärschlüssel und ergänze (PS). Markiere Fremdschlüssel mit (FS), Schlüsselbestandteile der Zuordnungen mit (PS, FS). Verbinde die zugehörigen Schlüsselzeilen und notiere 1 beziehungsweise n.</p>${sb.source!=='extra'?citeSource(sb.source,sb.pages):'<p class="source-caption">Zusätzlich erstellter Übungstext.</p>'}</section>${blankDrawing('Teil C · Dein relationales Modell')}${solutions?`<section class="print-task"><h1>Musterstruktur zur Probeklausur</h1><p>Die Grundlagenantworten findest du in den Kapiteln 1–6. Fehler in Aufgabe 6: Der Auftrag würde bei mehreren Produkten mehrfach vorkommen oder mehrere Produktnummern in einer Zelle benötigen. Auftragsdaten würden wiederholt. Korrekt ist eine Zuordnungstabelle mit Auftrags-Nr., Produkt-Nr. und Menge.</p><h2>Teil B</h2>${diagramBlock(schoolERM(sa.model))}${readings(sa)}<h2>Teil C</h2>${diagramBlock(schoolSchema(makeSchema(sb),sb))}<p>Bei zwei unabhängigen m:n-Beziehungen entstehen zwei getrennte Zuordnungstabellen. Jede enthält ihre beiden Referenzen und die passenden Beziehungsattribute.</p></section>`:''}`;}
function openPrint(title,body){modal(title,`<div class="print-toolbar row wrap mb16">${schoolButton('Drucken / als PDF speichern','print-now','','primary')}<span class="small muted">A4 · Lesefassung zum Ausdrucken.</span></div><div class="printpack">${body}</div>`,true);}
function paperView(){const p=state.school.paper,active=!!p?.running;const pool=C.scenarios.filter(s=>['u-personal','u-carsharing','u-fitwerk','x-lernwerkstatt','x-veranstaltung'].includes(s.id));return pageHead('DAS ZIEL: OHNE VORLAGE AUFS PAPIER','Schreibtraining für die Prüfung.','Übe die beiden angekündigten Formen: Sachtext → semantisches Modell und Sachtext → relationales Modell. Deine Zeichnung kontrollierst du anschließend mit einer Musterstruktur.')+`<div class="trainer-layout"><section class="panel"><span class="badge purple">PRÜFUNGSRUNDE AUF PAPIER</span><h2 class="mt16">Erst selbst zeichnen. Dann vergleichen.</h2><div class="cols2 mt24"><div class="field"><label for="paper-a">Teil B · Text → ERM</label><select id="paper-a" ${active?'disabled':''}>${pool.map(s=>`<option value="${s.id}" ${(p?.a||'x-lernwerkstatt')===s.id?'selected':''}>${esc(s.title)}</option>`).join('')}</select></div><div class="field"><label for="paper-b">Teil C · Text → relationales Modell</label><select id="paper-b" ${active?'disabled':''}>${pool.map(s=>`<option value="${s.id}" ${(p?.b||'x-veranstaltung')===s.id?'selected':''}>${esc(s.title)}</option>`).join('')}</select></div></div><div class="row wrap"><div class="field" style="max-width:200px"><label for="paper-duration">Trainingszeit</label><select id="paper-duration" ${active?'disabled':''}><option value="45">45 Minuten</option><option value="60" selected>60 Minuten</option><option value="90">90 Minuten</option></select></div>${active?`<div class="exam-clock" id="paper-clock">${paperTime()}</div>`:''}</div><div class="row wrap">${schoolButton('Prüfungsbogen öffnen','paper-print','','primary')}${active?schoolButton('Zeichnen beendet','paper-stop'):schoolButton('Zeitmessung starten','paper-start')}${schoolButton('Musterstrukturen vergleichen','paper-solutions',active?'disabled':'')}</div>${p?.completed?'<div class="feedback good mt20">Die Zeichenrunde ist abgeschlossen. Vergleiche jetzt jedes Attribut, jede Kardinalität und jede Schlüsselverbindung. Die Papierzeichnung wird nicht automatisch bewertet.</div>':''}<p class="tiny muted mt16">Die Zeitmessung ist optional. Bei laufender Runde werden Musterstrukturen hier ausgeblendet. Der Endzeitpunkt bleibt beim Neuladen erhalten. Dies ist keine manipulationssichere Prüfung.</p></section><aside class="stack"><section class="panel tint"><h3>Deine Zeichenroutine</h3><div class="routine-track mt16">${['Entitätstypen sammeln','Attribute zuordnen','Jede Beziehung zweimal lesen','Schlüssel und Zuordnungen zeichnen','Am Text zurückprüfen'].map((s,i)=>`<div><span class="num-circle">${i+1}</span>${s}</div>`).join('')}</div></section><section class="panel"><h3>Leere Vorlagen</h3><p class="small muted mt12">Für Skizzen ohne Bildschirm oder zum sauberen Übertragen eines Modells.</p><div class="stack mt16">${schoolButton('Zwei leere Zeichenblätter','blank-paper')}${schoolButton('Schlüsselkästen zum Ausfüllen','key-template')}</div></section></aside></div><section class="panel mt24"><h3>Originalaufgaben auf Papier</h3><p class="small muted mt12">Jede Aufgabe in der Unterrichtswerkstatt besitzt einen Papierknopf. Für den exakt gleichen Seitensatz nutze dein Arbeitsblatt aus dem Unterricht.</p><div class="row wrap mt20">${schoolButton('Zu den Originalaufgaben','nav','data-page="unterricht"')}</div></section><section class="panel mt24"><h3>Vor der Abgabe</h3><div class="cols2 mt16"><div><h4>Semantisches Modell</h4><p class="small muted mt8">Rechtecke im Singular. Attribute statt Werte. Verben in Rauten. An jeder Beziehung beide Zahlen. Alle Textangaben berücksichtigt.</p></div><div><h4>Relationales Modell</h4><p class="small muted mt8">PS vollständig unterstrichen. FS auf der richtigen Seite. Jede m:n-Beziehung aufgelöst. Beziehungsattribute am richtigen Ort. Linien verbinden passende Schlüsselzeilen.</p></div></div></section>`;}

function bookSourcePage(id,p){return `<section class="source-page" data-source="${id}" data-page="${p}"><p class="source-page-label">${esc(schoolSource(id,[p]))}</p><img src="${ASSETS[id+'-'+p]}" alt="Original: ${esc(schoolSource(id,[p]))}" loading="lazy" width="1000" height="1414"></section>`;}
function bookSources(){return [];}
function bookChapterVisual(id){switch(id){case 'grundlagen':return `<div class="rule-banner"><strong>Datenbanksystem = DBMS + Datenbasis</strong><br>Benutzersichten und Anwendungen greifen über das DBMS auf die benötigten Daten zu.</div>`;case 'phasen':return '<div class="rule-banner"><strong>Informationsstruktur → semantisches Modell → logisches Modell → Datenbank-Schema.</strong><br>Output und Input → Rechtecke, Ellipsen, Rauten → Relationskästen, PS und FS → Implementierung.</div>';case 'entitaeten':return tableHTML(['Ebene','Beispiel','Darstellung'],[['Entitätstyp','Kunde','Rechteck'],['Entität','Kunde mit Kunden-ID 3','Konkreter Datensatz'],['Attribut','Kundenname','Ellipse'],['Attributwert','Blueroad Ltd.','Zellinhalt im Datensatz']]);case 'beziehungen':return diagramBlock(miniRelation())+'<div class="rule-banner">Frage nicht nur: „Haben diese Wörter miteinander zu tun?“<br>Frage: <strong>„Welche konkrete Zuordnung muss das System speichern?“</strong></div>';case 'kardinalitaeten':return diagramBlock(miniRelation())+'<div class="rule-banner"><b>Ein Kunde → mehrere Aufträge:</b> n bei Auftrag.<br><b>Ein Auftrag → ein Kunde:</b> 1 bei Kunde.<br><b>Erst dann zusammenlesen:</b> Kunde 1:n Auftrag.</div>';case 'schluessel':return tableHTML(['Vorschlag','Herkunft / Aufbau','Entscheidende Prüfung'],[['FIN','natürlich, einfach','Eindeutiges fachliches Fahrzeugmerkmal'],['Kunden-ID','künstlich, einfach','Eindeutig vergeben, nicht leer, stabil'],['Name + Vorname','natürlicher, zusammengesetzter Vorschlag','Nicht allgemein eindeutig; daher ungeeignet'],['Auftrags-ID + Produkt-ID','zusammengesetzt aus zwei IDs','Das vollständige Paar ist eindeutig']]);case 'lesen':case 'relationen':return expandTokens('{{subset:u-avallon:Kunde,Auftrag:full}}');case 'mn':return expandTokens('{{subset:u-avallon:Auftrag,Auftragsposition,Produkt:full}}')+'<div class="inline-legend"><strong>Auftragsposition hat einen gemeinsamen PS:</strong> Auftrags-ID + Produkt-ID.<br>Die einzelne Nummer darf mehrfach vorkommen. Nur das vollständige Paar darf nicht doppelt sein.</div>';case 'text':return '<div class="rule-banner"><strong>Zeichenreihenfolge für Relationen:</strong><br>Grundrelationen → PS → 1:n-FS → m:n-Zuordnungstabellen → 1:1-Eindeutigkeit → Schlüsselzeilen verbinden → Textkontrolle.</div>';case 'fehler':return '<div class="rule-banner"><strong>Fehlerbegründung = falsche Stelle + Auswirkung + Korrektur.</strong><br>„Lieferant-ID in Artikel erlaubt nur einen Lieferanten je Artikel. Der Text erlaubt mehrere. Deshalb ergänze ich Lieferant_Artikel.“</div>';case 'komplex':return '<div class="rule-banner"><strong>Blatt 06:</strong> Fahrzeug 1:1 Parkplatz.<br><strong>Blatt 10:</strong> Fahrzeug n:1 Standort.<br>Gleicher Themenbereich, unterschiedliche ausdrückliche Regeln.</div>';default:return '';}}
function buildBook(mode='full'){
 const full=mode==='full',paper=mode==='paper';const title=paper?'Papiertraining & Probeklausur':full?'Lernheft mit Aufgaben und Lösungen':'Datenbanken · Kurzskript';let content=`<section class="book-cover" id="start"><div><div class="book-kicker">MODELLRAUM · INFORMATIK 12 · UNTERRICHTSAUSGABE</div><h1>${paper?'Auf Papier.<br><span>Ohne Vorlage.</span>':full?'Datenbanken<br><span>wirklich verstehen.</span>':'Der Stoff.<br><span>Auf einen Blick.</span>'}</h1><p class="lead">${paper?'Originalaufgaben, freie Zeichenflächen und eine zusätzliche Probeklausur. In der Schreibweise deiner Unterrichtsblätter.':full?'Vom Begriff bis zum fertigen Modell: dein Unterricht, alle Originalaufgaben und verständliche Lösungsvorschläge.':'Die zwölf Lernkapitel zu Datenbanksystemen, ER-Modellen, Kardinalitäten und relationalen Datenmodellen.'}</p><div class="badge-line"><span>Rechteck · Raute · Ellipse</span><span>1 : n · m : n</span><span>PS und FS</span><span>Text → Modell</span></div></div><div class="cover-note"><b>Grundlage:</b> deine elf hochgeladenen Unterrichtsdokumente. ${paper?'Dieser Übungsband enthält keine ausgefüllten Lösungsseiten. Das separate Lernheft enthält die Vergleichslösungen.':full?'Alle 31 Originalseiten sind im Anhang unverändert enthalten. Ergänzende Erläuterungen und Lösungen sind als solche gekennzeichnet.':'Die vollständigen Originalaufgaben und Lösungen stehen im separaten Lernheft und in der interaktiven Website.'}<br>Erstellt für dein persönliches Lernen. Keine amtliche Prüfungsvorhersage. Stand der Materialien: deine hochgeladenen Unterrichtsblätter.</div></section>`;
 if(paper){content+=`<section class="book-intro" id="inhalt"><div class="book-kicker">SO VERWENDEST DU DIESEN BAND</div><h2>Erst zeichnen, dann vergleichen.</h2><p class="book-subtitle">Die Originalseiten folgen ihrer Unterrichtsreihenfolge. Freie Zeichenflächen stehen nach größeren Modellierungsaufgaben bereit.</p><h3>Beim semantischen Modell</h3><p>Schreibe Entitätstypen im Singular in Rechtecke. Zeichne Attribute als Ellipsen und Beziehungen mit Verben in Rauten. Halte für jede Richtung genau ein Objekt fest. Die Antwort auf „wie viele?“ steht beim gegenüberliegenden Entitätstyp.</p><h3>Beim relationalen Modell</h3><p>Zeichne Kästen mit dem Relationsnamen oben und den Attributen untereinander. Unterstreiche die Primärschlüssel und ergänze (PS). Markiere Referenzen mit (FS). In einer Zuordnungstabelle werden beide Schlüsselbestandteile unterstrichen und mit (PS, FS) versehen. Verbinde die passenden Schlüsselzeilen.</p><h3>Bewusst ohne Lösung arbeiten</h3><p>Auf diesem Übungsbogen werden keine fertigen Lösungen aus Blatt 08 Lösung oder der Rückseite von Blatt 10 mitgedruckt. Manche Original-Infoseiten enthalten bereits erklärte Beispiele; für eine Übung ganz ohne Hilfen verwende die zusätzliche Probeklausur am Ende.</p><div class="rule-banner"><b>Dein letzter Blick:</b> Habe ich jede wichtige Textaussage umgesetzt? Stimmen beide Zahlen? Sind m:n-Beziehungen aufgelöst? Stehen Beziehungsattribute in der Zuordnungstabelle? Treffen die Verbindungslinien die richtigen Schlüssel?</div></section>`;
 const extraAfter=new Set(['04-3','05-1','06-3','07-7','08-2','08-3','08-4','10-1']);for(const x of bookSources(mode)){content+=bookSourcePage(x.id,x.page);if(extraAfter.has(x.id+'-'+x.page))content+=blankDrawing('Zeichenfläche zu Blatt '+x.id+' · Seite '+x.page);}
 content+=mockPaper('x-lernwerkstatt','x-veranstaltung',false);
 }else{
 content+=`<section class="book-toc" id="inhalt"><div class="book-kicker">INHALT</div><h2>Dein Weg durch den Stoff</h2><h3>Teil I · Die Zusammenfassung</h3><ol>${C.lessons.map((l,i)=>`<li><a href="#kapitel-${l.id}">${esc(l.title)}</a></li>`).join('')}</ol>${full?`<h3>Teil II · Aufgaben und Lösungsvorschläge</h3><ol>${C.tasks.map(t=>`<li><a href="#aufgabe-${t.id}">${esc(t.title)}</a></li>`).join('')}</ol><h3>Teil III · Unveränderte Originalseiten</h3><p class="tiny">Alle elf Dokumente, einschließlich der mitgelieferten Lösungen. Seitenangaben bei Aufgaben und Erklärungen beziehen sich immer auf das jeweilige Originaldokument.</p>`:'<h3>Für die Anwendung</h3><p>Bearbeite nach dem Lesen eine vollständige Aufgabe aus dem Lernheft oder aus der Website. Die zusätzliche Probeklausur im Papierband enthält einen Text für ein semantisches Modell und einen zweiten Text für ein relationales Modell.</p>'}</section>`;
