<script>const D={"scenarios": [{"id": "mensa", "title": "Mittag in der Schulmensa", "tag": "Gastronomie", "level": 2, "minutes": 20, "text": "Eine Schulmensa verwaltet Schüler, Bestellungen und Gerichte. Jeder Schüler hat eine eindeutige SchülerID und einen Namen. Jedes Gericht besitzt eine eindeutige Gerichtsnummer, eine Bezeichnung und einen Preis. Ein Schüler kann beliebig viele Bestellungen aufgeben, muss aber noch keine aufgegeben haben. Jede Bestellung gehört genau einem Schüler und hat eine eindeutige Bestellnummer und ein Bestelldatum. Jede Bestellung enthält mindestens ein Gericht. Ein Gericht kann in beliebig vielen Bestellungen vorkommen, auch in keiner. Für jedes Gericht innerhalb einer Bestellung wird die Menge gespeichert. Ein Gericht kommt innerhalb derselben Bestellung höchstens einmal vor; die Menge fasst mehrere Portionen zusammen.", "model": {"entities": [{"id": "s", "name": "Schüler", "attrs": [{"name": "SchülerID", "key": 1, "optional": false, "aliases": ["Schülernummer", "SchuelerNr"], "id": "s_a0"}, {"name": "Name", "key": false, "optional": false, "aliases": [], "id": "s_a1"}], "aliases": ["Schueler", "Schülerin", "Lernender", "Schülerinnen"], "x": 250, "y": 260}, {"id": "b", "name": "Bestellung", "attrs": [{"name": "Bestellnummer", "key": 1, "optional": false, "aliases": ["BestellID", "BestellungID", "BestellNr"], "id": "b_a0"}, {"name": "Bestelldatum", "key": false, "optional": false, "aliases": ["Datum"], "id": "b_a1"}], "aliases": ["Bestellungen", "Order"], "x": 700, "y": 490}, {"id": "g", "name": "Gericht", "attrs": [{"name": "Gerichtsnummer", "key": 1, "optional": false, "aliases": ["GerichtID", "GerichtsID", "GerichtNr"], "id": "g_a0"}, {"name": "Bezeichnung", "key": false, "optional": false, "aliases": ["Name"], "id": "g_a1"}, {"name": "Preis", "key": false, "optional": false, "aliases": [], "id": "g_a2"}], "aliases": ["Gerichte", "Speise"], "x": 1150, "y": 260}], "relations": [{"id": "auf", "name": "gibt auf", "a": "s", "b": "b", "ca ", "key": 1, "optional": false, "aliases": [], "id": "s_a0"}, {"name": "Sitznummer", "key": false, "optional": false, "aliases": [], "id": "s_a1"}], "aliases": [], "x": 700, "y": 490}, {"id": "t", "name": "Ticket", "attrs": [{"name": "TicketID", "key": 1, "optional": false, "aliases": [], "id": "t_a0"}, {"name": "Preis", "key": false, "optional": false, "aliases": [], "id": "t_a1"}], "aliases": [], "x": 1150, "y": 260}], "relations": [{"id": "gil", "name": "gilt für", "a": "t", "b": "v", "ca": "1,1", "cb": "0,n", "attrs": [], "aliases": ["gehört zu", "hat"], "table": "", "roles": []}, {"id": "res", "name": "reserviert", "a": "t", "b": "s", "ca": "1,1", "cb": "0,n", "attrs": [], "aliases": ["gehört zu", "hat"], "table": "", "roles": []}]}, "notes": ["Die Beziehung Ticket zu Sitzplatz ist historisch n:1, nicht global 1:1. Ein Sitzplatz wird in vielen Vorstellungen verkauft.", "Zusätzlich muss die Kombination aus VorstellungID und SitzID in Ticket eindeutig sein. Diese Bedingung wird mitgeprüft."], "focus": ["Kontextabhängige Eindeutigkeit", "Zusatzbedingung", "Ereignis"]}], "cards": [{"id": "k1", "title": "Bestellungen im Shop", "left": "Kunde", "right": "Bestellung", "ca": "0,n", "cb": "1,1", "text": "Ein Kunde kann viele Bestellungen aufgeben, auch keine. Jede Bestellung gehört genau einem Kunden.", "tip": "Eine einzelne Bestellung hat nicht mehrere Kunden. Deshalb ist n:m ausgeschlossen.", "level": 1}, {"id": "k2", "title": "Die Richtung wechseln", "left": "Bestellung", "right": "Kunde", "ca": "1,1", "cb": "0,n", "text": "Jede Bestellung gehört genau einem Kunden. Ein Kunde kann viele Bestellungen aufgeben, auch keine.", "tip": "Die Sache bleibt gleich, nur die Leserichtung ändert sich: Bestellung zu Kunde ist n:1.", "level": 1}, {"id": "k3", "title": "Ein persönlicher Spind", "left": "Schüler", "right": "Spind", "ca": "0,1", "cb": "0,1", "text": "Ein Schüler darf höchstens einen Spind haben. Ein Spind ist höchstens einem Schüler zugeordnet. Schüler ohne Spind und freie Spinde sind erlaubt.", "tip": "Optionalität betrifft das Minimum. Zwei optionale Seiten machen aus 1:1 keine n:m Beziehung.", "level": 1}, {"id": "k4", "title": "Klassenverband", "left": "Klasse", "right": "Schüler", "ca": "1,n", "cb": "1,1", "text": "Jede Klasse hat mindestens einen Schüler. Jeder Schüler besucht genau eine Klasse.", "tip": "Mindestens ein bedeutet Minimum 1. Es setzt keine Obergrenze von einem Schüler.", "level": 1}, {"id": "k5", "title": "Kurse wählen", "left": "Schüler", "right": "Kurs", "ca": "0,n", "cb": "1,n", "text": "Ein Schüler kann beliebig viele Kurse belegen, auch keinen. Jeder Kurs hat mindestens einen Schüler und kann viele haben.", "tip": "Beide Seiten erlauben mehrere Partner. Die Beziehung ist n:m.", "level": 1}, {"id": "k6", "title": "Rezeptzutaten", "left": "Gericht", "right": "Zutat", "ca": "1,n", "cb": "0,n", "text": "Jedes Gericht enthält mindestens eine Zutat. Eine Zutat kann in vielen Gerichten vorkommen, auch in keinem.", "tip": "Die Menge einer Zutat hängt vom konkreten Gericht ab. Sie ist ein Beziehungsattribut.", "level": 1}, {"id": "k7", "title": "Leitung einer Abteilung", "left": "Mitarbeiter", "right": "Abteilung", "ca": "0,1", "cb": "1,1", "text": "Ein Mitarbeiter leitet höchstens eine Abteilung, möglicherweise keine. Jede Abteilung hat genau einen Leiter.", "tip": "Leiten ist nicht dasselbe wie dort arbeiten. Betrachte nur die beschriebene Beziehung.", "level": 1}, {"id": "k8", "title": "Bücher im Regal", "left": "Buch", "right": "Exemplar", "ca": "1,n", "cb": "1,1", "text": "Zu jedem Buch gibt es mindestens ein Exemplar. Jedes Exemplar gehört genau zu einem Buch.", "tip": "Ein Buchtitel und ein physisches Exemplar sind unterschiedliche Entitätstypen.", "level": 1}, {"id": "k9", "title": "Historische Ausleihen", "left": "Leser", "right": "Ausleihe", "ca": "0,n", "cb": "1,1", "text": "Ein Leser kann im Zeitverlauf viele Ausleihen tätigen. Jede Ausleihe gehört genau einem Leser. Leser ohne Ausleihe sind erlaubt.", "tip": "Ein Ausleihvorgang hat genau einen Leser, auch wenn ein Leser viele Vorgänge hat.", "level": 1}, {"id": "k10", "title": "Autorenteam", "left": "Autor", "right": "Buch", "ca": "0,n", "cb": "1,n", "text": "Ein Autor kann viele Bücher schreiben, auch noch keines. Jedes Buch hat mindestens einen Autor und kann mehrere haben.", "tip": "Ein Buch mit mehreren Autoren ist ausdrücklich erlaubt. Deshalb nicht 1:n.", "level": 1}, {"id": "k11", "title": "Ein Kunde mit Profil", "left": "Kunde", "right": "Profil", "ca": "0,1", "cb": "1,1", "text": "Ein Kunde kann ein Profil besitzen, muss aber keines besitzen. Jedes Profil gehört genau einem Kunden.", "tip": "Je Kunde höchstens ein Profil und je Profil genau ein Kunde ergibt 1:1.", "level": 1}, {"id": "k12", "title": "Projektmitarbeit", "left": "Mitarbeiter", "right": "Projekt", "ca": "0,n", "cb": "0,n", "text": "Mitarbeiter können an vielen Projekten mitarbeiten. Projekte können viele Mitarbeiter haben. Auf beiden Seiten ist auch keine Mitarbeit erlaubt.", "tip": "0..n bedeutet keine, eine oder viele Teilnahmen, nicht genau null.", "level": 1}, {"id": "k13", "title": "Land und Städte", "left": "Land", "right": "Stadt", "ca": "1,n", "cb": "1,1", "text": "In diesem Modell hat jedes Land mindestens eine Stadt. Jede Stadt gehört genau einem Land.", "tip": "Verwende die Geschäftsregel dieses Modells, nicht Sonderfälle außerhalb der Aufgabe.", "level": 1}, {"id": "k14", "title": "Fahrzeuge in der Flotte", "left": "Fahrzeug", "right": "Fuhrpark", "ca": "1,1", "cb": "0,n", "text": "Jedes Fahrzeug gehört genau einem Fuhrpark. Ein Fuhrpark kann viele Fahrzeuge haben, aber zunächst auch leer sein.", "tip": "Von Fahrzeug zu Fuhrpark gelesen ist dies n:1.", "level": 1}, {"id": "k15", "title": "Lieferangebote", "left": "Lieferant", "right": "Zutat", "ca": "0,n", "cb": "0,n", "text": "Lieferanten können viele Zutaten anbieten. Zutaten können von vielen Lieferanten angeboten werden. Auch kein Angebot ist erlaubt.", "tip": "Ein Einkaufspreis je Lieferant und Zutat gehört zur Beziehung.", "level": 1}, {"id": "k16", "title": "Eine feste Paarung", "left": "Person", "right": "Partner", "ca": "0,1", "cb": "0,1", "text": "Betrachtet wird nur eine aktuelle feste Partnerschaft. Eine Person hat höchstens einen Partner. Auch der Partner hat höchstens eine solche Zuordnung. Alleinstehende Personen sind erlaubt.", "tip": "Dies ist eine rekursive 1:1 Beziehung mit zwei Rollen. Historische Partnerschaften wären ein anderes Modell.", "level": 2}, {"id": "k17", "title": "Zeitpunkte und Tickets", "left": "Vorstellung", "right": "Ticket", "ca": "0,n", "cb": "1,1", "text": "Für eine Vorstellung können viele Tickets verkauft werden, auch noch keines. Ein Ticket gilt für genau eine Vorstellung.", "tip": "Nicht verwechseln: Die Sitzplatzregel gehört zu einer zusätzlichen Beziehung oder Eindeutigkeitsbedingung.", "level": 2}, {"id": "k18", "title": "Musiklisten", "left": "Playlist", "right": "Titel", "ca": "0,n", "cb": "0,n", "text": "Eine Playlist kann viele Titel enthalten, auch keinen. Ein Titel kann in vielen Playlists vorkommen, auch in keiner. Ein Titel steht pro Playlist höchstens einmal.", "tip": "Mehrere Titel je Liste und mehrere Listen je Titel ergeben n:m.", "level": 2}, {"id": "k19", "title": "Ein Mentor", "left": "Mentor", "right": "Mentee", "ca": "0,n", "cb": "0,1", "text": "Ein Mitarbeiter in der Rolle Mentor kann viele Mentees betreuen. Ein Mentee hat höchstens einen Mentor. Beide Rollen können ohne Zuordnung bleiben.", "tip": "Die Rollen gehören zum selben Entitätstyp. Die maximale Beziehung ist trotzdem 1:n.", "level": 2}, {"id": "k20", "title": "Pflichtmitgliedschaft", "left": "Mitglied", "right": "Team", "ca": "1,n", "cb": "1,n", "text": "Jedes Mitglied spielt in mindestens einem Team und kann in mehreren spielen. Jedes Team hat mindestens ein Mitglied und kann viele haben.", "tip": "Pflichtteilnahme auf beiden Seiten ändert n:m nicht zu 1:1.", "level": 2}, {"id": "k21", "title": "Unbesetzte Stelle", "left": "Stelle", "right": "Mitarbeiter", "ca": "0,1", "cb": "1,1", "text": "Eine Stelle kann unbesetzt sein oder genau einen Mitarbeiter haben. Jeder Mitarbeiter besetzt genau eine Stelle.", "tip": "Je Stelle 0..1 Mitarbeiter; je Mitarbeiter 1..1 Stelle. Beziehungstyp 1:1.", "level": 2}, {"id": "k22", "title": "Ein optionales Fach", "left": "Paket", "right": "Abholfach", "ca": "0,1", "cb": "0,1", "text": "Betrachtet wird die aktuelle Belegung. Ein Paket liegt entweder in keinem oder in genau einem Abholfach. Ein Abholfach enthält höchstens ein Paket.", "tip": "Die aktuelle Belegung ist 1:1. Die vollständige Nutzungsgeschichte müsste mit Vorgängen modelliert werden.", "level": 2}, {"id": "k23", "title": "Arzttermine", "left": "Arzt", "right": "Termin", "ca": "0,n", "cb": "1,1", "text": "Ein Arzt kann viele Termine haben, auch keinen. Jeder Termin ist genau einem Arzt zugeordnet.", "tip": "Gleichzeitigkeit wird nicht durch die historische 1:n Kardinalität allein geregelt.", "level": 2}, {"id": "k24", "title": "Bestellpositionen lesen", "left": "Position", "right": "Produkt", "ca": "1,1", "cb": "0,n", "text": "Jede Bestellposition bezieht sich genau auf ein Produkt. Ein Produkt kann in vielen Positionen verschiedener Bestellungen vorkommen, auch in keiner.", "tip": "Position zu Produkt ist n:1. Die ursprüngliche Beziehung Bestellung zu Produkt war n:m.", "level": 2}, {"id": "k25", "title": "Ein eigenes Benutzerkonto", "left": "Person", "right": "Benutzerkonto", "ca": "1,1", "cb": "1,1", "text": "Jede Person in diesem System hat genau ein Benutzerkonto. Jedes Benutzerkonto gehört genau einer Person.", "tip": "Beide Teilnahmen sind verpflichtend. Im Datenbankschema genügt ein einzelner Fremdschlüssel nicht für die Existenzpflicht beider Seiten.", "level": 3}, {"id": "k26", "title": "Zuständigkeiten", "left": "Abteilung", "right": "Projekt", "ca": "0,n", "cb": "1,1", "text": "Eine Abteilung kann viele Projekte verantworten, auch keines. Jedes Projekt hat genau eine verantwortliche Abteilung.", "tip": "Die Mitarbeit an Projekten wäre eine andere Beziehung. Sie wird hier nicht gefragt.", "level": 2}, {"id": "k27", "title": "Buchungen über die Zeit", "left": "Zimmer", "right": "Buchung", "ca": "0,n", "cb": "1,1", "text": "Ein Zimmer kann über die Zeit viele Buchungen haben. Jede Buchung betrifft genau ein Zimmer. Ungebuchte Zimmer bleiben gespeichert.", "tip": "Ob sich Zeiträume überschneiden, ist eine zusätzliche Bedingung und keine Änderung zu 1:1.", "level": 3}, {"id": "k28", "title": "Kategorien ohne Inhalt", "left": "Produkt", "right": "Kategorie", "ca": "1,1", "cb": "0,n", "text": "Jedes Produkt gehört genau einer Kategorie. Eine Kategorie kann viele Produkte enthalten oder leer sein.", "tip": "Fremdschlüssel KategorieID gehört später in Produkt, also auf die n Seite.", "level": 2}], "lessons": [{"id": "grundlagen", "title": "Datenbanken verstehen", "short": "Vom Zettel zur Struktur", "icon": "database", "minutes": 8, "subtitle": "Daten so organisieren, dass sie zusammenpassen.", "sections": [["Warum überhaupt modellieren?", "Eine Liste kann schnell entstehen. Sobald dieselbe Information an vielen Stellen steht, wird ihre Pflege schwierig. Ein Datenmodell beschreibt, welche Objekte du verwaltest und wie sie zusammenhängen. Das Modell entsteht vor den Tabellen."], ["Drei Ebenen, drei Aufgaben", "Der Sachtext beschreibt Regeln der Wirklichkeit. Das ERM zeigt Entitätstypen, Attribute und Beziehungen. Das relationale Modell übersetzt diese Struktur in Tabellen, Schlüssel und Fremdschlüssel. SQL ist eine mögliche technische Umsetzung."], ["Schema und Daten unterscheiden", "Das Schema ist der Bauplan, zum Beispiel Kunde(KundenID, Name). Ein Datensatz ist eine konkrete Zeile, zum Beispiel (17, „Mara“). Fünf vorhandene Kunden begrenzen nicht die Anzahl der erlaubten Kunden."], ["Redundanz erkennen", "Steht der Kundenname in jeder Bestellung, muss eine Namenskorrektur an mehreren Stellen erfolgen. Eine getrennte Kundentabelle mit einer Referenz aus Bestellung vermeidet diese Wiederholung. Ein historisch vereinbarter Preis darf dagegen bewusst separat gespeichert werden."]], "lab": "redundanz"}, {"id": "entitaeten", "title": "Entitäten und Attribute", "short": "Objekt oder Eigenschaft?", "icon": "box", "minutes": 12, "subtitle": "Erkenne, was ein eigener Gegenstand ist und was ihn beschreibt.", "sections": [["Entität ist nicht Entitätstyp", "Die konkrete Schülerin mit SchülerID 17 ist eine Entität. Schüler ist der Entitätstyp, also die Beschreibung aller solchen Objekte. Im ERM beschriftest du das Rechteck mit dem Entitätstyp, meist im Singular."], ["Attribute beschreiben", "Name und Geburtsdatum beschreiben einen Schüler. Eine einfache Eigenschaft wird als Attribut modelliert. Adresse kann als zusammengesetztes Attribut in Straße, Hausnummer, Postleitzahl und Ort zerlegt werden."], ["Optional und identifizierend", "Ein optionales Attribut muss nicht bei jedem Objekt einen Wert haben. Ein Schlüsselattribut hilft, ein Objekt eindeutig zu identifizieren. Ein Name ist normalerweise nicht eindeutig. Ein zusammengesetzter Schlüssel besteht aus mehreren Attributen gemeinsam."], ["Eigenschaft einer Beziehung", "Die bestellte Menge ist weder eine feste Eigenschaft des Gerichts noch der gesamten Bestellung. Sie beschreibt die Kombination aus beidem. Deshalb hängt sie im ERM an der Beziehung enthält."]], "lab": "classify"}, {"id": "schluessel", "title": "Primärschlüssel und Fremdschlüssel", "short": "Eindeutig. Und verbunden.", "icon": "key", "minutes": 12, "subtitle": "Verknüpfe Datensätze, ohne Informationen doppelt zu speichern.", "sections": [["Einen Datensatz eindeutig bestimmen", "Der gewählte Primärschlüssel ist eindeutig und darf keinen NULL Wert enthalten. Er kann eine Spalte oder mehrere Spalten gemeinsam umfassen. Andere geeignete eindeutige Schlüssel heißen Schlüsselkandidaten."], ["Ein Fremdschlüssel verweist", "Bestellung.KundenID kann auf Kunde.KundenID verweisen. Ein nicht leerer Fremdschlüsselwert muss einen vorhandenen referenzierten Schlüssel treffen. Das ist referenzielle Integrität. Ein Fremdschlüssel ist nicht automatisch eindeutig."], ["Eindeutige Paare", "In Bestellposition kann (Bestellnummer, Gerichtsnummer) gemeinsam der Primärschlüssel sein. Die einzelne Bestellnummer darf sich wiederholen. Nur die vollständige Kombination muss eindeutig sein."], ["NULL und UNIQUE", "NOT NULL verbietet einen fehlenden Wert. UNIQUE verlangt Eindeutigkeit einer Spalte oder Spaltengruppe. Ein optionaler 1:1 Fremdschlüssel benötigt Eindeutigkeit, kann aber NULL sein. Wie UNIQUE mit mehreren NULL Werten umgeht, hängt vom Datenbanksystem ab."]], "lab": "keys"}, {"id": "beziehungen", "title": "Beziehungen modellieren", "short": "Objekte in Verbindung", "icon": "network", "minutes": 9, "subtitle": "Verben liefern Hinweise. Die Bedeutung entscheidet.", "sections": [["Ein Zusammenhang zwischen Objekten", "Kunde gibt Bestellung auf ist ein Beziehungstyp. Mara gibt Bestellung 204 auf ist eine konkrete Beziehung. Beziehungen bekommen im Diagramm eine Raute und einen aussagekräftigen Namen."], ["Nicht jeder Satz braucht eine neue Entität", "Ein Verb wie bestellt deutet oft auf eine Beziehung hin. Ein eigenständiger Bestellvorgang mit Nummer und Datum kann zugleich eine Entität Bestellung begründen. Entscheidend sind die benötigten Daten und Regeln."], ["Rollen und mehrere Beziehungen", "Ein Mitarbeiter arbeitet in einer Abteilung und kann eine Abteilung leiten. Das sind zwei verschiedene Beziehungen. Bei einer rekursiven Beziehung kann Mitarbeiter Mentor und Mentee sein. Rollen machen die Bedeutung sichtbar."]], "lab": "relationship"}, {"id": "kardinalitaeten", "title": "Kardinalitäten verstehen", "short": "Wie viele? Und mindestens wie viele?", "icon": "shuffle", "minutes": 15, "subtitle": "Prüfe immer beide Richtungen getrennt.", "sections": [["Zwei Fragen statt Raten", "Fixiere genau einen Kunden. Wie viele Bestellungen darf er haben? Dann fixiere genau eine Bestellung. Wie viele Kunden darf sie haben? Erst beide Antworten bestimmen den Beziehungstyp."], ["Maximum und Minimum trennen", "1:1, 1:n, n:1 und n:m beschreiben die maximale Zuordnung in einer Leserichtung. Ob eine Teilnahme verpflichtend ist, steht zusätzlich im Minimum: 0 bedeutet optional, 1 bedeutet mindestens eine Teilnahme."], ["Unsere Min Max Konvention", "Die Angabe direkt bei einer Entität zählt hier die Beziehungsteilnahmen eines einzelnen Objekts dieser Entität. Beim Kunden steht (0,n), bei Bestellung (1,1). Die maximale Beziehung von Kunde zu Bestellung heißt trotzdem 1:n. Die Zahlenposition ist nicht mit der klassischen Chen Verhältnisnotation gleichzusetzen."], ["Beispieldaten beweisen keine Obergrenze", "Wenn ein Kunde gerade nur eine Bestellung hat, könnte er trotzdem weitere bestellen dürfen. Daten können eine Regel verletzen oder mit ihr vereinbar sein. Die allgemeine Regel folgt aus der Beschreibung, nicht allein aus einer kleinen Stichprobe."]], "lab": "cardinality"}, {"id": "lesen", "title": "ERM Diagramme lesen", "short": "Aus Formen werden Aussagen", "icon": "scan", "minutes": 10, "subtitle": "Übersetze ein Bild in eindeutige Sätze.", "sections": [["Die Zeichen lesen", "Rechtecke stehen für Entitätstypen. Ovale stehen für Attribute. Unterstrichene Attribute bilden den gewählten Schlüssel. Rauten stehen für Beziehungstypen. Eine gestrichelte Attributumrandung kennzeichnet hier ein optionales Attribut als zusätzliche Lernhilfe."], ["Von links nach rechts, dann zurück", "Lies eine Beziehung nicht nur in eine Richtung. Formuliere zum Beispiel: Ein Schüler kann viele Bestellungen aufgeben. Jede Bestellung gehört genau einem Schüler."], ["Schlüssel im konzeptionellen Modell", "Im ERM musst du Fremdschlüssel nicht zusätzlich als Kopien zeichnen, um eine bereits vorhandene Beziehung auszudrücken. Die Fremdschlüssel entstehen bei der Überführung in das relationale Modell."]], "lab": "read"}, {"id": "text", "title": "Vom Fließtext zum ERM", "short": "Die wichtigste Prüfungsroutine", "icon": "pen", "minutes": 15, "subtitle": "Strukturiert vorgehen statt sofort alles zu zeichnen.", "sections": [["Zuerst die Objekte sammeln", "Markiere relevante Gegenstände und Vorgänge. Entscheide dann, welche davon eigenständige Entitätstypen sind. Nicht jedes Substantiv ist ein Entitätstyp: Preis ist hier eine Eigenschaft von Gericht."], ["Eigenschaften und Schlüssel zuordnen", "Notiere die Attribute unter ihrem Eigentümer. Markiere ausdrücklich genannte eindeutige Nummern. Fehlt eine notwendige Identifikation, formuliere eine Annahme, statt eine ungenannte Regel als Tatsache auszugeben."], ["Beziehungen und Regeln lesen", "Verbinde die passenden Entitätstypen. Prüfe zu jeder Verbindung beide Richtungen und jeweils Minimum und Maximum. Achte auf kann, mindestens, höchstens und genau."], ["Am Text zurückprüfen", "Jede wesentliche Regel muss im Modell oder in einer ergänzenden Bedingung vorkommen. Mengen je Kombination sind Beziehungsattribute. Zeitliche Regeln und Bedingungen über mehrere Beziehungen passen oft nicht in einfache Kardinalitäten."]], "lab": "text"}, {"id": "relationen", "title": "ERM in Tabellen umwandeln", "short": "Der zweite große Aufgabentyp", "icon": "table", "minutes": 18, "subtitle": "Aus Struktur werden Tabellen und überprüfbare Schlüssel.", "sections": [["Entitätstyp wird Tabelle", "Einfache Attribute werden Spalten. Die gewählten Schlüsselattribute bilden den Primärschlüssel. Zusammengesetzte Attribute werden meist in ihre benötigten Bestandteile zerlegt. Mehrwertige Attribute benötigen eine eigene Tabelle."], ["1:n: Fremdschlüssel auf der n Seite", "Bei Kunde zu Bestellung kommt KundenID in Bestellung. NOT NULL bildet ab, dass jede Bestellung einen Kunden haben muss. Ob jeder Kunde mindestens eine Bestellung haben muss, wird dadurch nicht erzwungen."], ["n:m: eigene Zuordnungstabelle", "Bestellung und Gericht benötigen Bestellposition mit zwei Fremdschlüsseln. Wenn jedes Paar höchstens einmal vorkommt, ist das Paar ein geeigneter Primärschlüssel. Alternativ sind eine eigene ID und ein zusätzliches UNIQUE über das Paar möglich. Menge kommt ebenfalls in diese Tabelle."], ["1:1: Fremdschlüssel und Eindeutigkeit", "Ein Fremdschlüssel in einer geeigneten Tabelle erhält UNIQUE. Ein verpflichteter Besitzer der Referenz erhält außerdem NOT NULL. Bei beidseitiger Pflichtteilnahme ist die Existenz auf der anderen Seite zusätzlich sicherzustellen."], ["Grenzen der einfachen Übersetzung", "Mindestens eine Position pro Bestellung, zeitliche Überschneidungsfreiheit und ähnliche Regeln brauchen zusätzliche Verfahren. Dieses Studio zeigt solche Restbedingungen ausdrücklich an. Der SQL Export ist ein Schemaentwurf, keine laufende Datenbank."]], "lab": "transform"}, {"id": "komplex", "title": "Komplexe Modelle sicher lösen", "short": "Die Regeln hinter den Regeln", "icon": "layers", "minutes": 16, "subtitle": "Ereignisse, Rollen und Kontext statt auswendig gelernter Muster.", "sections": [["Wiederholbare Vorgänge brauchen Identität", "Derselbe Leser kann dasselbe Exemplar mehrfach ausleihen. Ein Schlüssel nur aus LeserID und ExemplarID würde das verhindern. Ein Ausleihvorgang bekommt daher eine eigene ID oder einen geeigneten erweiterten Schlüssel."], ["Eine Momentaufnahme ist keine Geschichte", "Ein Stellplatz hat aktuell höchstens einen Nutzer. Über Jahre können viele Nutzungen entstehen. Die richtige Kardinalität hängt davon ab, ob du den aktuellen Zustand oder die Historie modellierst."], ["Zusammengesetzte Eindeutigkeit", "Ein Sitzplatz kann in vielen Vorstellungen verkauft werden. Eindeutig sein muss (VorstellungID, SitzID), nicht SitzID allein. Das ist eine zusätzliche Regel für eine Kombination."], ["Nicht mehr behaupten als vorgegeben", "Aus arbeitet in und leitet folgt nicht automatisch, dass jemand seine eigene Abteilung leitet. Zusätzliche fachliche Regeln müssen ausdrücklich genannt oder als Annahme dokumentiert sein."]], "lab": "constraints"}], "quiz": [{"id": "q1", "topic": "grundlagen", "question": "Was beschreibt ein Datenbankschema?", "options": ["Die Struktur der Daten", "Nur die aktuell gespeicherten Zeilen", "Die Anzahl der angemeldeten Benutzer"], "answer": 0, "explain": "Ein Schema beschreibt unter anderem Tabellen, Spalten, Schlüssel und Regeln. Die Zeilen sind konkrete Daten."}, {"id": "q2", "topic": "grundlagen", "question": "Ein Kunde hat heute genau eine Bestellung. Welche allgemeine Regel ist damit bewiesen?", "options": ["Jeder Kunde hat höchstens eine Bestellung", "Die Beziehung ist sicher 1:1", "Keine maximale Kardinalität ist allein dadurch bewiesen"], "answer": 2, "explain": "Eine Stichprobe zeigt nur vorhandene Daten. Die erlaubten künftigen Zuordnungen ergeben sich aus der Geschäftsregel."}, {"id": "q3", "topic": "grundlagen", "question": "Welche Reihenfolge ist für diese Aufgaben sinnvoll?", "options": ["Tabellen → zufällige Schlüssel → Sachtext", "Sachtext → ERM → relationales Modell", "SQL → Farben → Geschäftsregeln"], "answer": 1, "explain": "Zuerst werden die fachlichen Regeln verstanden und modelliert. Danach folgt die Übersetzung in Tabellen."}, {"id": "q4", "topic": "entitaeten", "question": "Was ist eine konkrete Entität?", "options": ["Der Entitätstyp Schüler", "Die Schülerin mit SchülerID 17", "Das Attribut Name"], "answer": 1, "explain": "Die konkrete Schülerin ist eine Entität. Schüler ist der Entitätstyp und Name eine Eigenschaft."}, {"id": "q5", "topic": "entitaeten", "question": "Wohin gehört die Menge eines Gerichts in einer Bestellung?", "options": ["Nur zu Gericht", "Nur zu Schüler", "Zur Beziehung zwischen Bestellung und Gericht"], "answer": 2, "explain": "Dasselbe Gericht kann in verschiedenen Bestellungen mit unterschiedlichen Mengen vorkommen."}, {"id": "q6", "topic": "entitaeten", "question": "Welches Attribut ist zusammengesetzt?", "options": ["Eine Adresse mit Straße, Hausnummer und Ort", "Ein einzelner Preis", "Eine nicht weiter zerlegte KundenID"], "answer": 0, "explain": "Ein zusammengesetztes Attribut hat fachlich relevante Bestandteile. Diese können später eigene Spalten werden."}, {"id": "q7", "topic": "schluessel", "question": "Was muss für einen Primärschlüssel gelten?", "options": ["Er darf sich wiederholen, wenn der Name verschieden ist", "Er ist eindeutig und enthält keinen NULL Wert", "Er besteht immer aus genau einer Zahl"], "answer": 1, "explain": "Ein Primärschlüssel kann mehrere Spalten umfassen und muss nicht numerisch sein. Eindeutigkeit und fehlende NULL Werte sind entscheidend."}, {"id": "q8", "topic": "schluessel", "question": "Darf KundenID in vielen Bestellungen denselben Wert haben?", "options": ["Ja, ein normaler Fremdschlüssel darf sich wiederholen", "Nein, jeder Fremdschlüssel ist eindeutig", "Nur wenn KundenID in Kunde doppelt ist"], "answer": 0, "explain": "Viele Bestellungen dürfen denselben Kunden referenzieren. Eindeutigkeit wäre eine zusätzliche Bedingung."}, {"id": "q9", "topic": "schluessel", "question": "Der Primärschlüssel ist (BestellID, ProduktID). Was ist verboten?", "options": ["Dieselbe BestellID bei unterschiedlichen Produkten", "Dieselbe ProduktID in verschiedenen Bestellungen", "Dieselbe vollständige Kombination ein zweites Mal"], "answer": 2, "explain": "Die Kombination ist eindeutig. Ihre einzelnen Bestandteile dürfen sich in unterschiedlichen Kombinationen wiederholen."}, {"id": "q10", "topic": "beziehungen", "question": "Ein Mitarbeiter arbeitet in und leitet eine Abteilung. Wie viele Beziehungstypen sind nötig?", "options": ["Ein einziger, weil die Rechtecke gleich sind", "Zwei, weil die Bedeutungen verschieden sind", "Keiner, das sind Attribute"], "answer": 1, "explain": "Gleiche Entitätstypen können mehrere unabhängige Beziehungen mit unterschiedlichen Kardinalitäten haben."}, {"id": "q11", "topic": "beziehungen", "question": "Was macht eine rekursive Beziehung aus?", "options": ["Sie hat überhaupt keine Attribute", "Ein Entitätstyp übernimmt mehrere Rollen in derselben Beziehung", "Sie muss immer 1:1 sein"], "answer": 1, "explain": "Zum Beispiel kann Mitarbeiter sowohl Mentor als auch Mentee sein. Die Rollen unterscheiden die Teilnahmen."}, {"id": "q12", "topic": "beziehungen", "question": "Warum kann eine Ausleihe eine eigene Entität sein?", "options": ["Weil jedes Verb automatisch eine Entität ist", "Weil sie ein identifizierbarer, wiederholbarer Vorgang mit eigenen Daten ist", "Weil Beziehungen keine Eigenschaften haben dürfen"], "answer": 1, "explain": "Ein Vorgang mit eigener Identität kann als Entität modelliert werden. Beziehungen dürfen ebenfalls Attribute besitzen."}, {"id": "q13", "topic": "kardinalitaeten", "question": "Was bedeutet (0,n) direkt beim Kunden in diesem Studio?", "options": ["Ein einzelner Kunde darf an keiner, einer oder vielen Zuordnungen teilnehmen", "Jede Bestellung darf viele Kunden haben", "Ein Kunde muss mindestens eine Bestellung haben"], "answer": 0, "explain": "Die Min Max Angabe wird lokal gelesen: Sie zählt Teilnahmen eines einzelnen Objekts der benachbarten Entität."}, {"id": "q14", "topic": "kardinalitaeten", "question": "Welche Aussage trennt Optionalität und Mehrfachheit korrekt?", "options": ["Optional bedeutet immer n:m", "0 ist ein Minimum; n ist ein Maximum", "1:1 bedeutet immer Pflichtteilnahme"], "answer": 1, "explain": "Minimum und Maximum beantworten unterschiedliche Fragen. Auch eine 1:1 Beziehung kann optional sein."}, {"id": "q15", "topic": "kardinalitaeten", "question": "Kunde zu Bestellung ist 1:n. Wie heißt die umgekehrte Leserichtung?", "options": ["1:1", "n:m", "n:1"], "answer": 2, "explain": "Die Beziehung ändert sich nicht. Nur die Reihenfolge der betrachteten Entitätstypen wird umgedreht."}, {"id": "q16", "topic": "lesen", "question": "Was bedeutet ein unterstrichenes Attribut im ERM dieses Studios?", "options": ["Es gehört zum gewählten Schlüssel", "Es ist immer optional", "Es ist stets ein Fremdschlüssel"], "answer": 0, "explain": "Unterstreichung kennzeichnet Schlüsselattribute. Bei einem zusammengesetzten Schlüssel sind mehrere Attribute unterstrichen."}, {"id": "q17", "topic": "lesen", "question": "Welche Form stellt hier einen Beziehungstyp dar?", "options": ["Oval", "Raute", "Rechteck"], "answer": 1, "explain": "Rechtecke stehen für Entitätstypen, Ovale für Attribute und Rauten für Beziehungstypen."}, {"id": "q18", "topic": "lesen", "question": "Muss KundenID als Fremdschlüssel im konzeptionellen ERM bei Bestellung stehen?", "options": ["Nein, die Beziehung drückt den Zusammenhang bereits aus", "Ja, sonst existiert die Beziehung nicht", "Nur bei n:m"], "answer": 0, "explain": "Fremdschlüssel entstehen bei der Überführung in das relationale Modell. Im konzeptionellen ERM genügt die Beziehung."}, {"id": "q19", "topic": "text", "question": "Im Sachtext fehlt eine Identifikation für Schüler. Was ist fachlich sauber?", "options": ["Einfach den Namen als sicher eindeutig behandeln", "Eine geeignete SchülerID ausdrücklich als Annahme ergänzen", "Alle Schüler weglassen"], "answer": 1, "explain": "Ungenannte Regeln dürfen nicht stillschweigend als gegeben gelten. Eine begründete Modellierungsannahme macht die Ergänzung sichtbar."}, {"id": "q20", "topic": "text", "question": "Welche Formulierung legt das Minimum 1 und das Maximum n fest?", "options": ["höchstens eine", "genau eine", "mindestens eine, beliebig viele möglich"], "answer": 2, "explain": "Mindestens eine verlangt Teilnahme. Beliebig viele erlaubt Mehrfachheit."}, {"id": "q21", "topic": "text", "question": "Was prüfst du bei jeder Beziehung?", "options": ["Nur das Maximum von links nach rechts", "Beide Richtungen mit Minimum und Maximum", "Nur die Anzahl der gezeichneten Ovale"], "answer": 1, "explain": "Eine einzige Leserichtung reicht nicht. Beide Seiten können unabhängig optional oder verpflichtend sein."}, {"id": "q22", "topic": "relationen", "question": "Wo steht KundenID bei Kunde 1:n Bestellung?", "options": ["Als Fremdschlüssel in Bestellung", "Als Liste in Kunde", "Nur im Tabellennamen"], "answer": 0, "explain": "Die n Seite erhält den Fremdschlüssel. Jede Bestellung kann so genau einen Kunden referenzieren."}, {"id": "q23", "topic": "relationen", "question": "Wie wird eine einfache n:m Beziehung typischerweise umgesetzt?", "options": ["Mit einer Liste in einer Zelle", "Mit einer Zuordnungstabelle und zwei Fremdschlüsseln", "Mit UNIQUE auf beiden Entitätstabellen ohne Verknüpfung"], "answer": 1, "explain": "Die Zuordnungstabelle speichert die Paare. Beziehungsattribute werden dort zu Spalten."}, {"id": "q24", "topic": "relationen", "question": "Was benötigt ein Fremdschlüssel zur Darstellung einer maximalen 1:1 Zuordnung zusätzlich?", "options": ["UNIQUE oder eine gleichwertige Eindeutigkeitsbedingung", "Immer einen zweiten Fremdschlüssel zurück", "Nichts, jeder Fremdschlüssel erzeugt 1:1"], "answer": 0, "explain": "Ein gewöhnlicher Fremdschlüssel erlaubt mehrere Referenzen auf denselben Datensatz. UNIQUE begrenzt dies auf höchstens eine."}, {"id": "q25", "topic": "komplex", "question": "Erzwingt ein Fremdschlüssel in Position, dass jede Bestellung mindestens eine Position besitzt?", "options": ["Ja, immer", "Nein, er prüft nur vorhandene referenzierende Positionen", "Ja, wenn Position eine eigene ID hat"], "answer": 1, "explain": "Auch bei gültigen Positionsreferenzen kann eine Bestellung ohne Position existieren. Die Mindestteilnahme der Bestellung braucht eine zusätzliche Prüfung."}, {"id": "q26", "topic": "komplex", "question": "Ein Sitz darf je Vorstellung nur einmal verkauft werden. Welche Kombination muss eindeutig sein?", "options": ["SitzID allein", "VorstellungID allein", "VorstellungID und SitzID gemeinsam"], "answer": 2, "explain": "Ein einzelner Sitz wird in vielen Vorstellungen genutzt. Pro Vorstellung ist seine Zuordnung jedoch eindeutig."}, {"id": "q27", "topic": "komplex", "question": "Eine Zuordnungstabelle hat eine eigene ID als Primärschlüssel. Was fehlt bei höchstens einem Eintrag je Paar?", "options": ["Nichts, die ID verhindert auch gleiche Paare", "Ein zusätzliches UNIQUE über beide Fremdschlüssel gemeinsam", "UNIQUE auf jedem Fremdschlüssel einzeln"], "answer": 1, "explain": "Eine neue ID verhindert doppelte Paare nicht. Zwei einzelne UNIQUE Bedingungen wären zu stark und würden n:m einschränken."}], "glossary": [["Entität", "Ein konkret identifizierbares Objekt der modellierten Wirklichkeit, zum Beispiel Schüler 17."], ["Entitätstyp", "Die gemeinsame Beschreibung gleichartiger Entitäten, zum Beispiel Schüler."], ["Attribut", "Eine Eigenschaft eines Entitäts oder Beziehungstyps."], ["Beziehungsattribut", "Eine Eigenschaft der Zuordnung, zum Beispiel Menge je Bestellung und Gericht."], ["Primärschlüssel", "Der ausgewählte eindeutige und nicht leere Identifikator einer Tabellenzeile."], ["Fremdschlüssel", "Eine Spalte oder Spaltengruppe, die einen Schlüssel derselben oder einer anderen Tabelle referenziert."], ["Schlüsselkandidat", "Eine minimale Attributmenge, die eine Entität eindeutig identifiziert."], ["Zusammengesetzter Schlüssel", "Ein Schlüssel, der aus mehreren Attributen gemeinsam besteht."], ["Referenzielle Integrität", "Nicht leere Fremdschlüssel müssen auf vorhandene passende Schlüsselwerte verweisen."], ["Kardinalität", "Eine Aussage über erlaubte Anzahlen von Beziehungspartnern oder Teilnahmen, abhängig von der verwendeten Notation."], ["Optionalität", "Die Teilnahme ist nicht verpflichtend. Das Minimum ist 0."], ["Min Max Notation", "Ein Paar aus minimaler und maximaler Zahl an Teilnahmen. Hier gilt die lokale Lesart am Entitätstyp."], ["Relation", "Im relationalen Modell eine Menge von Tupeln mit demselben Schema; in der Darstellung eine Tabelle. Nicht mit dem Beziehungstyp im ERM verwechseln."], ["Tupel", "Ein Datensatz einer Relation; anschaulich eine Tabellenzeile."], ["Schema", "Die festgelegte Struktur der Daten und ihrer Bedingungen."], ["Zuordnungstabelle", "Eine Tabelle, die unter anderem eine n:m Beziehung durch Fremdschlüsselpaare abbildet."], ["NULL", "Markiert einen fehlenden oder unbekannten Wert. Nicht dasselbe wie 0 oder eine leere Zeichenfolge."], ["UNIQUE", "Eine Eindeutigkeitsbedingung für eine Spalte oder eine Kombination von Spalten."], ["NOT NULL", "Verbietet einen fehlenden Wert in einer Spalte."], ["Rekursive Beziehung", "Eine Beziehung, in der derselbe Entitätstyp verschiedene Rollen übernimmt."], ["Redundanz", "Mehrfache Speicherung derselben Information, die zu widersprüchlichen Änderungen führen kann."], ["Surrogatschlüssel", "Ein künstlicher Identifikator ohne eigene fachliche Bedeutung, zum Beispiel eine fortlaufende ID."], ["Ereignisentität", "Ein als eigener Gegenstand modellierter Vorgang mit Identität und Eigenschaften."], ["Geschäftsregel", "Eine fachliche Vorgabe darüber, welche Zustände in der modellierten Wirklichkeit erlaubt sind."]]};

function schemaNotation(sc){return sc.tables.map(t=>`${t.name} (${t.cols.map(c=>c.name+(c.pk?' [PK]':'')+(c.refTable?' [FK]':'')+(c.unique?' [UNIQUE]':'')+(c.nn||c.pk?' [NOT NULL]':'')).join(', ')})`+(t.uniqueGroups?.length?'\n  '+t.uniqueGroups.map(g=>'UNIQUE ('+g.map(id=>t.cols.find(c=>c.id===id)?.name||'?').join(', ')+')').join('\n  '):'')+'\n'+foreignGroups(t).map(g=>{let tar=sc.tables.find(x=>x.id===g[0].refTable);return '  ('+g.map(c=>c.name).join(', ')+') → '+(tar?.name||'?')+' ('+g.map(c=>tar?.cols.find(x=>x.id===c.refCol)?.name||'?').join(', ')+')';}).join('\n')).join('\n\n');}

function checkHTML(o,title='Deine Auswertung'){const pct=reportPct(o);return `<section class="panel mt20" id="check-report"><div class="row gap24"><div class="score-ring" style="--p:${pct}%"><b>${pct}%</b></div><div><div class="eyebrow">${o.score} VON ${o.total} PRÜFPUNKTEN</div><h3>${title}</h3><p class="small muted mt8">${pct===100?'Alle automatisch geprüften Strukturkriterien sind erfüllt. Beachte weiterhin die Zusatzbedingungen.':'Korrigiere die markierten Punkte. Die Position der Elemente beeinflusst das Ergebnis nicht.'}</p></div></div><div class="review-grid mt24">${o.items.filter(i=>!i.good).map(i=>`<div class="review-item bad">${icon('close')}<span>${esc(i.label)}</span></div>`).join('')}</div><details class="mt16"><summary class="small">Erfüllte Kriterien (${o.items.filter(i=>i.good).length})</summary><div class="review-grid mt12">${o.items.filter(i=>i.good).map(i=>`<div class="review-item good">${icon('check')}<span>${esc(i.label)}</span></div>`).join('')}</div></details>${o.notes.length?`<div class="mt16 stack">${[...new Set(o.notes)].map(n=>`<div class="callout small">${esc(n)}</div>`).join('')}</div>`:''}</section>`;}

 if(kind==='redundanz'){const normalized=!!UI.normalized,name=UI.nameChanged?'Mara Berger':'Mara Beck';return labShell('Eine Namensänderung, zwei Datenmodelle',`<p>Eine Kundin hat geheiratet. Ändere ihren Namen und vergleiche die beiden Speicherformen.</p><div class="tabs"><button class="${!normalized?'active':''}" data-act="normalize-demo" data-id="flat">Eine große Liste</button><button class="${normalized?'active':''}" data-act="normalize-demo" data-id="split">Getrennte Tabellen</button></div>${normalized?`<div class="mini-tables"><div class="table-wrap"><div class="table-title">Kunde</div><table><thead><tr><th>KundenID · PK</th><th>Name</th></tr></thead><tbody><tr><td>17</td><td>${name}</td></tr></tbody></table></div><div class="table-wrap"><div class="table-title">Bestellung</div><table><thead><tr><th>BestellID · PK</th><th>KundenID · FK</th></tr></thead><tbody><tr><td>101</td><td>17</td></tr><tr><td>102</td><td>17</td></tr></tbody></table></div></div>`:`<div class="table-wrap mt16"><table><thead><tr><th>Bestellung</th><th>Kundenname</th><th>Artikel</th></tr></thead><tbody><tr><td>101</td><td>${name}</td><td>Pasta</td></tr><tr><td>102</td><td>Mara Beck</td><td>Salat</td></tr></tbody></table></div>`}<div class="mt16">${btn(UI.nameChanged?'Namensänderung zurücksetzen':'Eine gespeicherte Namensangabe ändern','rename-demo','pen','sm')}</div>${UI.nameChanged?`<div class="feedback ${normalized?'good':'bad'} mt16">${normalized?'Nur eine Stelle speichert den Namen. Beide Bestellungen verweisen weiter auf denselben Kunden.':'Nur die erste Zeile wurde geändert. Dieselbe Kundin hat jetzt zwei verschiedene Namen in den Bestelldaten. Das ist eine Änderungsanomalie.'}</div>`:''}`);}
 if(kind==='classify'){let selected=UI.labSelection||[],res=UI.labResult;let words=['Kunden','Name','Gerichte','Preis','Bestellungen','Bestelldatum','Menge'];let ex=UI.entityExample||'Kunde';let exs=['Schüler','Lehrer','Klasse','Kunde','Bestellung','Produkt','Gericht','Mitarbeiter','Abteilung','Fahrzeug'];let m={entities:[{id:'demo',name:ex,x:650,y:250,attrs:[{id:'p',name:ex+'ID',key:true},{id:'n',name:ex==='Bestellung'?'Datum':'Bezeichnung',key:false}]}],relations:[]};return labShell('Entitätstyp oder Eigenschaft?',`<p>„Ein Restaurant verwaltet Kunden mit Name, Gerichte mit Preis und Bestellungen mit Bestelldatum. Je Gericht in einer Bestellung wird die Menge gespeichert.“</p><p class="mt12"><strong>Wähle die drei Entitätstypen.</strong></p><div class="chip-list">${words.map(w=>`<button class="chip ${selected.includes(w)?'active':''} ${res?( ['Kunden','Gerichte','Bestellungen'].includes(w)?'correct':selected.includes(w)?'wrong':''):''}" data-act="classify-word" data-id="${w}" aria-pressed="${selected.includes(w)}">${w}</button>`).join('')}</div>${btn('Auswahl prüfen','check-classify','check','sm primary')}${res?`<div class="feedback ${res.ok?'good':'bad'} mt16">${res.ok?'Richtig: Kunden, Gerichte und Bestellungen sind hier die Entitätstypen.':'Die Gegenstände sind Kunden, Gerichte und Bestellungen. Name, Preis und Bestelldatum beschreiben sie. Menge beschreibt eine Zuordnung.'}</div>`:''}<div class="cols2 mt24"><div><label class="small muted" for="entity-example">Ein Entitätstyp im Modell</label><select id="entity-example" data-change="entity-example" class="mt8">${exs.map(e=>`<option ${ex===e?'selected':''}>${e}</option>`).join('')}</select><p class="small muted mt12">Das Rechteck beschreibt den Typ. Eine Zeile beschreibt ein konkretes Objekt. Die hier ergänzte ID ist eine Modellierungsannahme für das Beispiel.</p></div><div class="table-wrap"><div class="table-title">${esc(ex)}</div><table><thead><tr><th>${esc(ex)}ID · PK</th><th>${ex==='Bestellung'?'Datum':'Bezeichnung'}</th></tr></thead><tbody><tr><td>1</td><td>${ex==='Bestellung'?'2026-03-12':'Beispiel A'}</td></tr><tr><td>2</td><td>${ex==='Bestellung'?'2026-03-13':'Beispiel B'}</td></tr></tbody></table></div></div><div style="max-height:190px;overflow:hidden">${svgDiagram(m).replace('viewBox="0 0 1340 790"','viewBox="330 95 640 330"')}</div><div class="callout mt12"><strong>Attributwerkstatt:</strong> Lege im freien Editor eine Entität Kunde an. Ergänze KundenID als Schlüssel, Name und die optionale EMail.</div><div class="mt16">${btn('Im Editor ausprobieren','free-customer','pen','sm')}</div>`);}
 if(kind==='keys'){return labShell('Folge einem Fremdschlüssel',`<p>Klicke in Bestellung auf einen KundenID Wert. Der passende Kundendatensatz wird hervorgehoben.</p><div class="mini-tables"><div class="table-wrap"><div class="table-title">Kunde</div><table><thead><tr><th>KundenID · PK</th><th>Name</th></tr></thead><tbody>${UI.customers.map(c=>`<tr class="${UI.keyHighlight===c.id?'highlight-row':''}"><td>${c.id}</td><td>${esc(c.name)}</td></tr>`).join('')}</tbody></table></div><div class="table-wrap"><div class="table-title">Bestellung</div><table><thead><tr><th>BestellID · PK</th><th>KundenID · FK</th></tr></thead><tbody>${UI.orders.map(o=>`<tr><td>${o.id}</td><td><button class="fk-button" data-act="highlight-key" data-id="${o.cid}" aria-label="Kunde ${o.cid} hervorheben">${o.cid} ${icon('arrow')}</button></td></tr>`).join('')}</tbody></table></div></div><div class="row wrap">${btn('Kunde hinzufügen','lab-add-customer','plus','sm')}${btn('Bestellung einfügen','lab-add-order','plus','sm')}${btn('Ungültige Referenz testen','lab-invalid-fk','warning','sm')}</div>${UI.keyMessage?`<div class="feedback ${UI.keyMessage.startsWith('Abgelehnt')?'bad':'good'} mt16">${esc(UI.keyMessage)}</div>`:''}<p class="tiny muted mt16">Dieses Labor prüft Eindeutigkeit der IDs und vorhandene Referenzziele direkt in den Beispieldaten. Es führt kein SQL aus.</p>`);}
 if(kind==='relationship'){let s=scenario('personal'),m=cloneSolution(s);return labShell('Gleiche Partner, andere Bedeutung',`<p>Zwischen Mitarbeiter und Abteilung liegen zwei unterschiedliche Beziehungen. Wähle eine aus.</p><div class="row wrap mt16">${btn('arbeitet in','relationship-demo','','sm '+(UI.relationDemo==='arb'?'primary':''),'data-id="arb"')}${btn('leitet','relationship-demo','','sm '+(UI.relationDemo==='lei'?'primary':''),'data-id="lei"')}</div><div class="schema-model mt16">${svgDiagram(m,{selected:UI.relationDemo||null})}</div><div class="feedback mt16">${UI.relationDemo==='lei'?'Ein Mitarbeiter leitet höchstens eine Abteilung. Eine Abteilung hat genau einen Leiter. Das ist die maximale Beziehung 1:1.':'Ein Mitarbeiter arbeitet in genau einer Abteilung. Eine Abteilung kann viele Mitarbeiter haben. Von Mitarbeiter zu Abteilung ist dies n:1.'}</div>`);}
 if(kind==='cardinality')return labShell('Geschäftsregeln mit Daten prüfen',networkView());
 if(kind==='read'){const s=scenario('mensa');return labShell('Ein Diagramm, klare Aussagen',`<div class="schema-model">${svgDiagram(s.model,{selected:UI.readNode||null})}</div><div class="chip-list">${[...s.model.entities,...s.model.relations].map(n=>`<button class="chip ${UI.readNode===n.id?'active':''}" data-act="read-node" data-id="${n.id}">${esc(n.name)}</button>`).join('')}</div><div class="feedback">${({s:'Schüler ist ein Entitätstyp. SchülerID ist der gewählte Schlüssel. Ein Schüler kann an 0 bis n Beziehungen „gibt auf“ teilnehmen.',b:'Bestellung hat Bestellnummer als Schlüssel und Bestelldatum als Attribut. Jede Bestellung gehört genau einem Schüler und enthält mindestens ein Gericht.',g:'Gericht hat Gerichtsnummer, Bezeichnung und Preis. Ein Gericht muss noch in keiner Bestellung vorkommen und darf in vielen vorkommen.',auf:'„gibt auf“ verbindet Schüler und Bestellung. Je Schüler gilt (0,n), je Bestellung (1,1). In der Richtung Schüler → Bestellung ist die maximale Beziehung 1:n.',ent:'„enthält“ ist n:m. Die Menge hängt an der Beziehung, weil sie für das Paar aus Bestellung und Gericht gespeichert wird.'})[UI.readNode]||'Wähle einen Begriff. Die Erläuterung übersetzt genau diesen Teil des Diagramms in Worte.'}</div>`);}
 if(kind==='text')return labShell('Die wichtigen Wörter sehen',`<p class="task-text">${highlightText(scenario('mensa').text,!!UI.textHighlight)}</p><div class="row wrap">${btn(UI.textHighlight?'Markierungen ausblenden':'Schlüsselwörter hervorheben','text-highlight','scan','sm')}${btn('Schulmensa selbst modellieren','start-erm','pen','sm primary','data-id="mensa"')}</div><p class="tiny muted mt16">Die farbigen Stellen sind Hinweise. Sie ersetzen nicht die Prüfung beider Leserichtungen.</p>`);
 if(kind==='transform'){const s=scenario('mensa'),sc=makeSchema(s),step=UI.transformStep;let show=clone(sc);if(step===1){show.tables=show.tables.slice(0,3);show.tables.forEach(t=>t.cols=t.cols.filter(c=>!c.refTable));}else if(step===2){show.tables=show.tables.slice(0,3);}return labShell('Schritt für Schritt zu Tabellen',`<div class="between"><span class="badge purple">SCHRITT ${step+1} VON 4</span><span class="small muted">${['Das konzeptionelle Modell','Entitätstypen → Grundtabellen','1:n → Fremdschlüssel','n:m → Zuordnungstabelle'][step]}</span></div>${step===0?`<div class="schema-model mt16">${svgDiagram(s.model)}</div>`:`<div class="schema-grid mt16">${show.tables.map(t=>schemaTableHTML(t,sc,false)).join('')}</div>`}<div class="feedback mt16">${['Erst die Bedeutung verstehen: Schüler gibt Bestellungen auf. Bestellungen enthalten Gerichte. Menge ist ein Beziehungsattribut.','Jeder Entitätstyp wird eine Tabelle. Attribute werden Spalten. Die Schlüsselattribute bleiben Primärschlüssel.','SchülerID wird in Bestellung ergänzt. Das ist die n Seite. NOT NULL verlangt, dass jede Bestellung einen Schüler hat.','Bestellposition bekommt beide Fremdschlüssel und Menge. Das Paar bildet gemeinsam den Primärschlüssel. Die Pflicht „mindestens eine Position je Bestellung“ bleibt eine Zusatzbedingung.'][step]}</div><div class="between mt16">${btn('Zurück','transform-step','left','sm',`data-delta="-1" ${step===0?'disabled':''}`)}${step===3?btn('Jetzt selbst umwandeln','start-schema','table','sm primary','data-id="mensa"'):btn('Nächster Schritt','transform-step','arrow','sm primary','data-delta="1"')}</div>`);}
 return labShell('Kardinalität oder Zusatzbedingung?',`<p>Ein Sitzplatz kann über viele Vorstellungen hinweg verkauft werden. Trotzdem darf dasselbe Paar aus Vorstellung und Sitzplatz nur einmal auf einem Ticket stehen.</p><div class="mini-tables"><div class="table-wrap"><div class="table-title">Erlaubte Tickets</div><table><thead><tr><th>TicketID</th><th>VorstellungID</th><th>SitzID</th></tr></thead><tbody><tr><td>1</td><td>10</td><td>5</td></tr><tr><td>2</td><td>11</td><td>5</td></tr></tbody></table></div><div class="table-wrap"><div class="table-title">Dieser zusätzliche Datensatz wäre verboten</div><table><thead><tr><th>TicketID</th><th>VorstellungID</th><th>SitzID</th></tr></thead><tbody><tr><td>3</td><td>10</td><td>5</td></tr></tbody></table></div></div><div class="callout">Der Konflikt ist das gleiche Paar (10,5), nicht die wiederholte SitzID 5. Ergänze UNIQUE(VorstellungID, SitzID).</div><div class="row wrap mt16">${btn('Kino modellieren','start-erm','pen','sm','data-id="kino"')}${btn('Zusatzbedingung selbst setzen','start-schema','table','sm primary','data-id="kino"')}</div>`);
}
function highlightText(text,on){let h=esc(text);return on?h.replace(/(eindeutig\w*|genau ein\w*|mindestens ein\w*|höchstens ein\w*|beliebig viel\w*|optional\w*|keine\w*|Menge|je\s+[^.]{0,20})/gi,'<mark>$1</mark>'):h;}
function networkView(){const counts=UI.networkCustomers.map(id=>({id,n:UI.networkOrders.filter(o=>o.cid===id).length})),missing=UI.networkOrders.filter(o=>!o.cid).length;return `<p><strong>Die Regel:</strong> Ein Kunde darf 0 bis n Bestellungen haben. Jede Bestellung benötigt genau einen Kunden. Ergänze Datensätze und ändere ihre Verknüpfung.</p><div class="sandbox-columns mt16"><div><div class="between"><h4>Kunden</h4>${btn('Kunde','network-customer','plus','sm')}</div>${counts.map(c=>`<div class="record"><strong>${c.id}</strong><span class="badge ${c.n>1?'purple':''}">${c.n} ${c.n===1?'Bestellung':'Bestellungen'}</span></div>`).join('')}</div><div><div class="between"><h4>Bestellungen</h4>${btn('Bestellung','network-order','plus','sm')}</div>${UI.networkOrders.map(o=>`<div class="record"><strong>${o.id}</strong><select data-network="${o.id}" aria-label="Kunde für Bestellung ${o.id}"><option value="">Kein Kunde</option>${UI.networkCustomers.map(c=>`<option value="${c}" ${o.cid===c?'selected':''}>${c}</option>`).join('')}</select>${ib('trash','network-delete','Bestellung löschen',`data-id="${o.id}"`)}</div>`).join('')}</div></div><div class="feedback ${missing?'bad':'good'} mt16">${missing?`${missing} Bestellung(en) ohne Kunde verletzen die Regel „genau ein Kunde“.`:'Alle vorhandenen Bestellungen haben genau einen Kunden. Die Beispieldaten sind mit der Regel vereinbar.'}</div><div class="callout mt12">Die Geschäftsregel legt <strong>1:n</strong> fest, rückwärts <strong>n:1</strong>. Auch wenn gerade jeder Kunde höchstens eine Bestellung hat, wird daraus nicht automatisch eine 1:1 Regel.</div>`;}
function flashView(){let entry=D.glossary[UI.flashIndex%D.glossary.length],known=Object.values(state.flash).filter(Boolean).length;return `<div class="between"><span class="small muted">Karte ${UI.flashIndex+1} von ${D.glossary.length}</span><span class="badge green">${known} als sicher markiert</span></div><button class="flashcard" style="width:100%;cursor:pointer" data-act="flash-flip" aria-label="Karte umdrehen"><span class="eyebrow">${UI.flashBack?'DIE ERKLÄRUNG':'WAS BEDEUTET …'}</span>${UI.flashBack?`<p>${esc(entry[1])}</p>`:`<h2>${esc(entry[0])}</h2><span class="small muted mt24">Klicken oder Enter, um die Karte umzudrehen.</span>`}</button><div class="flash-controls">${btn('Noch unsicher','flash-rate','refresh','','data-rating="0"')}${btn('Das sitzt','flash-rate','check','primary','data-rating="1"')}</div><div class="center mt24"><button class="textbtn" data-act="flash-weak">Unsichere Karte wählen</button></div>`;}
function glossaryView(){return `<div class="searchbox mb16">${icon('search')}<input type="search" id="glossary-search" aria-label="Begriff suchen" placeholder="Begriff suchen, zum Beispiel Fremdschlüssel …" value="${esc(UI.glossaryQuery)}"></div><div id="glossary-grid" class="lexicon-grid">${glossaryItems()}</div>`;}
function glossaryItems(){const arr=D.glossary.filter(x=>norm(x.join(' ')).includes(norm(UI.glossaryQuery)));return arr.map(x=>`<article class="panel lexicon-item"><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p></article>`).join('')||'<p class="muted">Kein passender Begriff.</p>';}
function filteredCards(){return D.cards.filter(x=>UI.cardFilter==='all'||(UI.cardFilter==='open'?(state.best[x.id]||0)<100:state.attempts.some(a=>a.id===x.id&&a.p<100)));}
function currentCard(){return D.cards[UI.cardIndex]||D.cards[0];}
function cardsView(){return pageHead('DIE ZWEI ENTSCHEIDENDEN FRAGEN','Kardinalitäten, die du verstehst.','Erst die Richtung festlegen. Dann Minimum und Maximum für beide Seiten bestimmen.')+`<div class="tabs"><button data-act="card-tab" data-id="train" class="${UI.cardTab==='train'?'active':''}">28 Übungen</button><button data-act="card-tab" data-id="sandbox" class="${UI.cardTab==='sandbox'?'active':''}">Datenlabor</button></div>`+(UI.cardTab==='sandbox'?`<section class="panel">${networkView()}</section>`:cardTraining());}
function cardTraining(){const c=currentCard(),i=D.cards.indexOf(c),ans=UI.cardAnswer,filtered=filteredCards();return `<div class="trainer-layout"><div><section class="panel task-card"><div class="between"><div class="task-kicker">AUFGABE ${String(i+1).padStart(2,'0')} / ${D.cards.length}</div>${levelBadge(c.level)}</div><h2>${esc(c.title)}</h2><p class="task-text">${esc(c.text)}</p><div class="callout"><strong>Feste Leserichtung:</strong> ${esc(c.left)} → ${esc(c.right)}</div><h4 class="mt24">1. Welcher maximale Beziehungstyp passt?</h4><div class="card-choices" role="group" aria-label="Beziehungstyp wählen">${['1:1','1:n','n:1','n:m'].map(v=>`<button class="card-choice ${UI.cardType===v?'active':''}" data-act="choose-card-type" data-id="${v}" aria-pressed="${UI.cardType===v}" ${ans?'disabled':''}>${v}</button>`).join('')}</div><h4 class="mb16">2. Wie oft nimmt jedes einzelne Objekt teil?</h4><div class="minmax-fields"><div class="field"><label for="card-ca">Je ${esc(c.left)}: wie viele Zuordnungen?</label><select id="card-ca" data-change="card-a" ${ans?'disabled':''}>${minmaxOptions(UI.cardA,true)}</select></div><div class="field"><label for="card-cb">Je ${esc(c.right)}: wie viele Zuordnungen?</label><select id="card-cb" data-change="card-b" ${ans?'disabled':''}>${minmaxOptions(UI.cardB,true)}</select></div></div><div class="row wrap mt12">${ans?btn('Nächste Aufgabe','next-card','arrow','primary')+btn('Erneut versuchen','retry-card','refresh'):btn('Antwort prüfen','grade-card','check','primary',!UI.cardType||!UI.cardA||!UI.cardB?'disabled':'')}${!ans?btn('Lösung erklären','reveal-card','eye'):''}</div>${ans?`<div class="feedback ${ans.score===3?'good':ans.reveal?'neutral':'bad'} mt24"><b>${ans.reveal?'Musterlösung':`${ans.score} von 3 Punkten`}</b>${cardExplanation(c,ans)}</div>`:''}</section><section class="panel mt20"><h3 style="font-size:16px">Die Notation bleibt eindeutig.</h3><p class="small muted mt12">Die Min Max Angabe direkt bei einer Entität zählt hier die Teilnahmen <strong>dieses einzelnen Objekts</strong>. Die maximale Verhältnisnotation 1:n benutzt eine andere Leseregel. Deshalb werden beide getrennt abgefragt.</p></section></div><aside class="trainer-aside stack"><section class="panel"><h3 style="font-size:16px">Deine Aufgaben</h3><select data-change="card-filter" aria-label="Aufgaben filtern" class="mt16"><option value="all" ${UI.cardFilter==='all'?'selected':''}>Alle Aufgaben</option><option value="open" ${UI.cardFilter==='open'?'selected':''}>Noch nicht gemeistert</option><option value="errors" ${UI.cardFilter==='errors'?'selected':''}>Mit früheren Fehlern</option></select><div class="task-list mt16">${filtered.length?filtered.map(x=>`<button data-act="select-card" data-id="${x.id}" class="${x.id===c.id?'current':''} ${state.best[x.id]===100?'done':''}" title="${esc(x.title)}" aria-label="Aufgabe ${D.cards.indexOf(x)+1}: ${esc(x.title)}">${D.cards.indexOf(x)+1}</button>`).join(''):'<p class="small muted">Keine Aufgaben in diesem Filter. Wähle „Alle Aufgaben“.</p>'}</div></section><section class="panel"><h3 style="font-size:16px">Vier Angaben, vier Aussagen.</h3><div class="rule-lines"><div class="rule-line"><b>0..1</b><span>Optional. Höchstens einmal.</span></div><div class="rule-line"><b>1..1</b><span>Verpflichtend. Genau einmal.</span></div><div class="rule-line"><b>0..n</b><span>Optional. Mehrfach möglich.</span></div><div class="rule-line"><b>1..n</b><span>Mindestens einmal. Mehrfach möglich.</span></div></div></section><section class="panel tint"><h3 style="font-size:15px">Vorsicht bei „kann“.</h3><p class="small muted mt12">Optionalität legt das Minimum fest. Sie entscheidet nicht darüber, ob maximal ein oder viele Partner erlaubt sind.</p></section></aside></div>`;}
function cardExplanation(c,ans){const rt=ratio(c.ca,c.cb);let error='';if(!ans.reveal&&ans.type!==rt){let implications={'1:1':'Das würde auf beiden Seiten höchstens einen Partner erlauben.','1:n':`Das würde je ${c.right} höchstens einen ${c.left} und je ${c.left} mehrere ${c.right} erlauben.`,'n:1':`Das würde je ${c.left} höchstens einen ${c.right} und je ${c.right} mehrere ${c.left} erlauben.`,'n:m':'Das würde auf beiden Seiten mehrere Partner erlauben.'};error=`Du hast ${esc(ans.type)} gewählt. ${esc(implications[ans.type]||'')} `;}return `${error}<strong>Richtig ist ${rt}</strong> in der Richtung ${esc(c.left)} → ${esc(c.right)}.<br>Je ${esc(c.left)} gilt <strong>(${c.ca})</strong>: ${localRead(c.ca)} Teilnahme(n).<br>Je ${esc(c.right)} gilt <strong>(${c.cb})</strong>: ${localRead(c.cb)} Teilnahme(n).<br><br>${esc(c.tip)}`;}
function tasksView(){return pageHead('VOM SATZ ZUR STRUKTUR','Deine Aufgabenbibliothek','Zusätzliche Modellierungsfälle und Unterrichtsszenarien. Die vollständigen Originalaufgaben mit Quellenansicht findest du im Bereich Unterricht.')+`<div class="tabs"><button data-act="task-tab" data-id="cases" class="${UI.taskTab==='cases'?'active':''}">Modellierungsaufgaben</button><button data-act="task-tab" data-id="repair" class="${UI.taskTab==='repair'?'active':''}">Fehler finden</button></div>`+(UI.taskTab==='repair'?`<div class="cols2">${REPAIRS.map(r=>`<div class="panel repair-card"><div class="between">${levelBadge(r.level)}<span class="tiny muted">MODELLKRITIK</span></div><h3 class="mt16">${r.title}</h3><pre class="sql mt16">${esc(r.code)}</pre>${quizHTML({...r,question:r.q},true)}</div>`).join('')}</div>`:`<div class="filters"><div class="searchbox grow">${icon('search')}<input id="task-search" type="search" placeholder="Szenario, Thema oder Schwierigkeit suchen …" value="${esc(UI.taskQuery)}" aria-label="Aufgaben durchsuchen"></div><select data-change="task-level" aria-label="Schwierigkeit"><option value="all">Alle Schwierigkeitsstufen</option>${[1,2,3].map(n=>`<option value="${n}" ${String(UI.taskLevel)===String(n)?'selected':''}>${['','Einstieg','Aufbau','Anspruchsvoll'][n]}</option>`).join('')}</select><button class="btn ${UI.taskBookmark?'soft':''}" data-act="filter-bookmarks" aria-pressed="${UI.taskBookmark}">${icon('bookmark')} Merkliste</button></div><div class="scenario-grid" id="scenario-grid">${scenarioCards()}</div><div class="callout mt24"><strong>Eigene Übungsfassungen:</strong> Die Szenarien setzen das bereitgestellte Lernstudio Konzept um. Ergänzte Regeln stehen ausdrücklich im jeweiligen Aufgabentext. Dies ist keine amtliche Lehrplanabdeckung oder Originalprüfung.</div>`);}
function scenarioCards(){let arr=D.scenarios.filter(s=>(UI.taskLevel==='all'||s.level===Number(UI.taskLevel))&&(!UI.taskBookmark||state.bookmarks.includes(s.id))&&norm(s.title+' '+s.tag+' '+s.focus.join(' ')+' '+['','Einstieg','Aufbau','Anspruchsvoll'][s.level]).includes(norm(UI.taskQuery)));return arr.map(s=>`<article class="panel scenario-card"><button class="iconbtn bookmarker ${state.bookmarks.includes(s.id)?'active':''}" data-act="bookmark" data-id="${s.id}" aria-label="${state.bookmarks.includes(s.id)?'Aus Merkliste entfernen':'Auf Merkliste setzen'}" aria-pressed="${state.bookmarks.includes(s.id)}">${icon('bookmark')}</button><div class="scene-icon">${icon(s.tag==='Gastronomie'?'coffee':s.tag==='Bibliothek'?'book':s.tag==='Unternehmen'?'network':s.tag==='Vertiefung'?'shuffle':'box')}</div><div class="row gap8">${levelBadge(s.level)}<span class="tiny muted">${s.minutes} Min. je Modell</span></div><h3>${esc(s.title)}</h3><p>${esc(s.text.slice(0,145))}…</p><div class="tags">${s.focus.map(x=>`<span class="badge">${esc(x)}</span>`).join('')}</div><div class="between tiny muted mb16"><span>ERM ${state.best['erm:'+s.id]===100?'✓':(state.best['erm:'+s.id]||0)+'%'}</span><span>Relationen ${state.best['schema:'+s.id]===100?'✓':(state.best['schema:'+s.id]||0)+'%'}</span></div><div class="buttons">${btn('Text → ERM','start-erm','pen','sm primary',`data-id="${s.id}"`)}${(!s.ermOnly?btn('ERM → Tabellen','start-schema','table','sm',`data-id="${s.id}"`):'')}</div></article>`).join('')||'<div class="empty-state" style="grid-column:1/-1"><h3>Keine passende Aufgabe.</h3><p>Ändere den Suchbegriff oder den Filter.</p></div>';}
function taskBanner(s,exam=false){const context=exam?'exam':'erm:'+s.id;let hints=['',`Relevante Formulierungen sind im Text markiert. Suche nach Objekten, eindeutigen Nummern und Mengenangaben.`,`Du benötigst in der direkten Darstellung ${s.model.entities.length} Entitätstyp(en) und ${s.model.relations.length} Beziehungstyp(en).`,null,`Ein Teilschritt: ${s.model.entities[0].name} hat die Attribute ${s.model.entities[0].attrs.map(a=>a.name+(a.key?' (Schlüssel)':'')).join(', ')}.`];if(UI.hint===3)hints[3]=checkModel(getModel(),s).items.find(i=>!i.good)?.label||'Die automatisch geprüfte Struktur stimmt. Prüfe jetzt die zusätzlichen Bedingungen.';return `<details class="panel task-banner" open><summary>${esc(s.title)} ${exam?'<span class="badge purple">PRÜFUNGSAUFGABE</span>':levelBadge(s.level)}</summary><p>${highlightText(s.text,!exam&&UI.hint>=1)}</p>${!exam?`<div class="task-tools"><div class="row wrap gap8">${btn(`Hinweis ${Math.min(UI.hint+1,4)} / 4`,'model-hint','help','sm',UI.hint>=4?'disabled':'')}${btn('Musterlösung','model-solution','eye','sm')}${btn('Neuer Versuch','new-model-attempt','refresh','sm')}</div><span class="tiny muted">${state.seen[context]?'Mit Hilfe · ein neuer Versuch kann wieder ohne Hilfe gewertet werden.':'Hilfen und Lösungen werden im Lernfortschritt gekennzeichnet.'}</span></div>${UI.hint?`<div class="hint-area">${esc(hints[UI.hint]||'')}</div>`:''}`:''}</details>`;}
function editorView(embedded=false){const exam=state.exam?.active&&UI.page==='exam',ctx=modelContext(),s=ctx==='free'?null:scenario(exam?state.exam.modelScenario:ctx);const m=getModel(),hist=historyFor();let html=embedded?'':pageHead('TEXT → ERM','Deine ERM Werkstatt','Zeichne ein vollständiges Modell. Wähle Elemente für ihre Eigenschaften. Verschiebe sie direkt auf der Zeichenfläche.',btn('Notationshilfe','notation','info'));
 if(!exam)html+=`<div class="field" style="max-width:500px"><label for="editor-task">Arbeitsbereich · jede Aufgabe hat einen eigenen Entwurf</label><select id="editor-task" data-change="editor-context"><option value="free" ${ctx==='free'?'selected':''}>Freies Diagramm</option>${D.scenarios.map(x=>`<option value="${x.id}" ${ctx===x.id?'selected':''}>${x.title}</option>`).join('')}</select></div>`;
 if(s)html+=taskBanner(s,exam);
 html+=`<div class="editor-layout ${exam?'exam':''}"><div class="canvas-panel"><div class="toolbar"><div class="toolgroup">${btn('Entität','add-entity','plus','soft')}${btn('Beziehung','add-relation','link','',m.entities.length===0?'disabled':'')}</div><div class="toolgroup">${ib('undo','undo-model','Rückgängig · Strg+Z',hist.undo.length?'':'disabled')}${ib('redo','redo-model','Wiederholen · Strg+Umschalt+Z',hist.redo.length?'':'disabled')}</div><div class="toolgroup">${ib('minus','zoom-out','Verkleinern')}<span class="zoomlabel">${Math.round(UI.zoom*100)}%</span>${ib('plus','zoom-in','Vergrößern')}${ib('expand','fit-model','An Breite anpassen')}</div><div class="toolgroup">${ib('grid','layout-model','Automatisch anordnen')}${ib('trash','reset-model','Diagramm leeren')}</div><div class="toolgroup">${btn('SVG','export-svg','download')}${btn('PNG','export-png','download')}</div></div><div class="canvas-scroll" id="canvas-scroll">${svgDiagram(m,{interactive:true,selected:UI.selected,bad:UI.check?.bad||[],id:'editor-svg'})}${!m.entities.length?`<div class="empty-canvas">${icon('network')}<h3>Hier beginnt dein Modell.</h3><p>Füge deine erste Entität hinzu.<br>Attribute und Beziehungen folgen danach.</p></div>`:''}</div><div class="canvas-legend"><span class="legend-item"><i class="legend-square"></i> Entitätstyp</span><span class="legend-item"><i class="legend-diamond"></i> Beziehung</span><span class="legend-item"><i class="legend-oval"></i> Attribut</span><span><u>Schlüssel</u></span><span>(min,max) je Objekt an dieser Seite</span></div></div><aside class="property-panel" id="properties">${propertiesHTML()}</aside></div><p class="mobile-note">Auf kleinen Bildschirmen: Zeichenfläche seitlich scrollen und „An Breite anpassen“ verwenden.</p>`;
 if(!exam)html+=`<div class="between wrap mt20"><div class="row wrap">${btn(s?'Modell prüfen':'Struktur prüfen','grade-model','check','primary')}${btn('In Tabellen umwandeln','model-to-schema','table')}</div><span class="tiny muted">Ziehen · Pfeiltasten · Entf · Strg+Z</span></div>${UI.check?checkHTML(UI.check):''}${noteBox('erm:'+ctx)}`;
 return html;}

/div>`:''}<div class="badge purple">A → B: ${ratio(n.ca,n.cb)}</div>`:''}</div><div><h4 class="mt16">${ent?'Attribute':'Beziehungsattribute'}</h4>${n.attrs.map(a=>`<div class="attr-item">${icon(a.key?'key':'box')}<span class="${a.key?'key-name':''}">${esc(a.name)}${a.optional?' · optional':''}</span>${ib('pen','edit-attribute','Attribut bearbeiten',`data-id="${a.id}" data-owner="${n.id}"`)}</div>`).join('')||'<p class="tiny muted mt12">Noch keine Attribute.</p>'}<div class="mt16">${btn('Attribut ergänzen','add-attribute','plus','sm soft',`data-owner="${n.id}"`)}</div><div class="notation">${ent?'Mehrere unterstrichene Attribute bilden gemeinsam einen Schlüssel.':'Ein Beziehungsattribut beschreibt die konkrete Kombination, zum Beispiel die Menge pro Bestellung und Gericht.'}</div></div>`;}

 if(!exam)h+=`<div class="between wrap mt24"><div class="row wrap">${btn('Schema prüfen','grade-schema','check','primary')}${btn('SQL anzeigen','show-sql','scan')}${btn('Schema als Text','schema-text','copy')}</div></div>${UI.schemaCheck?checkHTML(UI.schemaCheck,'Dein relationales Modell'):''}<div class="callout mt20">Der SQL Export erstellt einen Schemaentwurf. Hier wird keine Datenbank gestartet. Zusatzregeln wie „mindestens eine Bestellposition“ benötigen weiterhin eine passende fachliche Umsetzung.</div>${noteBox('schema:'+ctx)}`;
