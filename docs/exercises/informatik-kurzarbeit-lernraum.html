function progressView(){const attempts=state.attempts,unassisted=attempts.filter(a=>!a.help),wrong=unassisted.filter(a=>a.p<100).length,done=new Set(attempts.map(a=>a.id)).size;return pageHead('DEIN LERNWEG IN ZAHLEN','Fortschritt, der dir weiterhilft.','Gelesene Kapitel, geprüfte Versuche und eigenständig gelöste Aufgaben werden getrennt gezählt.')+`<section class="stats"><div class="stat"><div class="stat-symbol">${icon('chart')}</div><div><b>${allProgress()}<span>%</span></b><p>Gesamtfortschritt</p></div></div><div class="stat"><div class="stat-symbol">${icon('pen')}</div><div><b>${done}</b><p>Verschiedene Aufgaben bearbeitet</p></div></div><div class="stat"><div class="stat-symbol">${icon('check')}</div><div><b>${unassisted.filter(a=>a.p===100).length}</b><p>Vollständig richtige Versuche</p></div></div><div class="stat"><div class="stat-symbol">${icon('clock')}</div><div><b style="font-size:20px">${fmtTime(state.seconds)}</b><p>Aktive Lernzeit</p></div></div></section><div class="metric-grid mt24"><section class="panel"><h3>Fortschritt je Thema</h3>${[...D.lessons,{id:'pruefung',title:'Prüfungssimulation'}].map(l=>`<div class="topic-metric"><span>${esc(l.title)}</span>${progress(topicProgress(l.id))}<span class="mono">${topicProgress(l.id)}%</span></div>`).join('')}<p class="tiny muted mt20">Themenfortschritt: Mittelwert aus Kapitelstatus und bestem eigenständigen Ergebnis je zugeordneter Aufgabe. Prüfung: bestes abgeschlossenes Ergebnis.</p></section><section class="panel"><h3>Wo lohnt sich Wiederholen?</h3><p class="small muted mt8">Fehlerquote = Anteil der eigenständigen Versuche mit mindestens einem Fehler. Gesamt: ${unassisted.length?Math.round(wrong/unassisted.length*100)+'%':'noch keine Daten'}.</p>${D.lessons.map(l=>{const err=topicError(l.id);return `<div class="topic-metric"><span>${esc(l.title)}</span><div class="progress"><span style="width:${err||0}%;background:var(--amber)"></span></div><span class="mono">${err===null?'—':err+'%'}</span></div>`;}).join('')}<div class="mt24">${btn('Gezielt weiterüben','next-exercise','arrow','primary')}</div></section></div><div class="metric-grid mt24"><section class="panel"><h3>Die letzten Versuche</h3><div class="history mt12">${attempts.length?attempts.slice(-30).reverse().map(a=>`<div class="history-item"><div>${esc(taskName(a.id))}<small>${new Date(a.date).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'})}${a.help?' · mit Hilfe':''}</small></div><span class="badge ${a.p===100?'green':'amber'}">${a.p}%</span></div>`).join(''):'<div class="chart-empty">Noch keine gewerteten Versuche. Beginne mit einer Wissensfrage oder Kardinalitätsaufgabe.</div>'}</div></section><section class="panel"><h3>Nur bis zum Neuladen.</h3><p class="small muted mt12">Fortschritt, Notizen und Entwürfe bleiben nur in diesem geöffneten Tab. Beim Neuladen oder Schließen beginnt alles von vorn. Nichts wird gespeichert oder an einen Server gesendet.</p><div class="callout mt20">Lernzeit zählt nur bei sichtbarer Seite und Aktivität in den letzten zwei Minuten. Lösungshilfen werden nicht als eigenständig gemeistert gezählt.</div><div class="mt24">${btn('Alle Lerndaten zurücksetzen','reset-all','trash','danger sm')}</div></section></div>`;}
function taskName(id){if(id.startsWith('erm:'))return 'ERM · '+scenario(id.split(':')[1]).title;if(id.startsWith('schema:'))return 'Relationen · '+scenario(id.split(':')[1]).title;return D.cards.find(c=>c.id===id)?.title||D.quiz.find(q=>q.id===id)?.question||REPAIRS.find(r=>r.id===id)?.title||id;}
function examView(){const e=state.exam;if(!e||(!e.active&&!e.result))return examStartView();if(e.result&&!e.active)return examResultView(e);return pageHead('PRÜFUNGSSIMULATION','Zeig, was du verstanden hast.','Drei Teile. 100 Punkte. Keine Hinweise und keine Lösungen während der Bearbeitung.',`<div class="row"><div class="exam-clock" id="exam-clock">${examTime(e)}</div>${btn('Prüfung abgeben','finish-exam','check','primary')}</div>`)+`<div class="exam-parts"><button data-act="exam-tab" data-id="a" class="${UI.examTab==='a'?'active':''}"><b>A · Grundlagen</b>20 Punkte · 8 Fragen</button><button data-act="exam-tab" data-id="b" class="${UI.examTab==='b'?'active':''}"><b>B · Text → ERM</b>40 Punkte · ${esc(scenario(e.modelScenario).title)}</button><button data-act="exam-tab" data-id="c" class="${UI.examTab==='c'?'active':''}"><b>C · ERM → Tabellen</b>40 Punkte · ${esc(scenario(e.schemaScenario).title)}</button></div>${UI.examTab==='a'?examQuestionsView(e):UI.examTab==='b'?editorView(true):schemaView(true)}<div class="callout mt24">Deine Eingaben bleiben nur bis zum Neuladen erhalten. Die Prüfungszeit läuft beim Wechseln des Tabs weiter. Neuladen oder Schließen beendet die Prüfung ohne Ergebnis. Bei Zeitablauf wird automatisch ausgewertet.</div>`;}
function examStartView(){return pageHead('ALLE THEMEN. EIN DURCHLAUF.','Deine Generalprobe.','Eine lokal ausgewertete Übungsprüfung mit Grundlagen, einem eigenen ERM und einem relationalen Datenmodell.')+`<div class="trainer-layout"><section class="panel"><span class="badge purple">100 PUNKTE · 3 TEILE</span><h2 class="mt20">Vom Verstehen zum Anwenden.</h2><p class="small muted mt12" style="line-height:1.9">Die Prüfung enthält vier Wissensfragen und vier Kardinalitätsaufgaben. Danach modellierst du einen Sachtext und übersetzt ein anderes ERM in Tabellen. Aufgaben und Eingaben bleiben auch beim Neuladen erhalten.</p><div class="cols3 mt24"><div class="panel flat"><span class="badge purple">TEIL A</span><h3 class="mt12">20 Punkte</h3><p class="tiny muted mt8">Wissen und Kardinalitäten</p></div><div class="panel flat"><span class="badge blue">TEIL B</span><h3 class="mt12">40 Punkte</h3><p class="tiny muted mt8">Eigenes ERM erstellen</p></div><div class="panel flat"><span class="badge green">TEIL C</span><h3 class="mt12">40 Punkte</h3><p class="tiny muted mt8">Relationales Modell erstellen</p></div></div><div class="cols2 mt24"><div class="field"><label for="exam-duration">Prüfungsdauer</label><select id="exam-duration"><option value="45">45 Minuten</option><option value="60" selected>60 Minuten</option><option value="90">90 Minuten</option></select></div><div class="field"><label for="exam-level">Anforderungsniveau</label><select id="exam-level"><option value="basic">Einstieg und Aufbau</option><option value="hard">Anspruchsvoll</option><option value="mixed" selected>Gemischt</option></select></div></div><div class="callout">Während der Prüfung sind die anderen Lernbereiche gesperrt. Hilfen werden erst nach der Abgabe verfügbar. Dies ist ein Lernwerkzeug, keine manipulationssichere Prüfungssoftware.</div><div class="mt24">${btn('Prüfung jetzt starten','start-exam','play','primary')}</div></section><aside class="stack"><section class="panel"><h3>So wird gewertet</h3><p class="small muted mt12" style="line-height:1.9">Wissensfrage: je 2 Punkte.<br>Kardinalitätsaufgabe: je 3 Punkte.<br>Modellteile: Anteil erfüllter Strukturkriterien, umgerechnet auf je 40 Punkte.</p><p class="tiny muted mt16">Es gibt keine amtliche Schulnote. Freie Benennungen und komplexe alternative Modelle können eine ergänzende fachliche Prüfung erfordern.</p></section><section class="panel"><h3>Deine bisherigen Prüfungen</h3>${state.examHistory.length?state.examHistory.slice(-5).reverse().map(x=>`<div class="history-item"><span>${new Date(x.date).toLocaleDateString('de-DE')}</span><span class="badge ${x.percent>=80?'green':'purple'}">${x.percent} / 100</span></div>`).join(''):'<p class="small muted mt12">Noch keine Prüfung abgegeben.</p>'}</section></aside></div>`;}
function examTime(e){let sec=Math.max(0,Math.ceil((e.deadline-Date.now())/1000));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');}
function examQuestionsView(e){return `<div class="cols2">${e.questions.map((item,idx)=>{const q=item.kind==='quiz'?D.quiz.find(q=>q.id===item.id):D.cards.find(q=>q.id===item.id),ans=e.answers[item.id]||{};return `<section class="question" style="margin:0"><div class="between mb16"><span class="badge purple">FRAGE ${idx+1}</span><span class="tiny muted">${item.kind==='quiz'?2:3} Punkte</span></div><h4>${esc(item.kind==='quiz'?q.question:q.title)}</h4>${item.kind==='quiz'?`<div class="options">${q.options.map((v,i)=>`<label class="option"><input type="radio" name="exam-${q.id}" data-exam-answer="${q.id}" data-key="choice" value="${i}" ${ans.choice===i?'checked':''}><span>${esc(v)}</span></label>`).join('')}</div>`:`<p class="small muted mb16">${esc(q.text)}</p><div class="field"><label for="ex-type-${q.id}">${esc(q.left)} → ${esc(q.right)}</label><select id="ex-type-${q.id}" data-exam-answer="${q.id}" data-key="type"><option value="">Beziehungstyp wählen</option>${['1:1','1:n','n:1','n:m'].map(v=>`<option ${ans.type===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="cols2"><div class="field"><label for="ex-a-${q.id}">Teilnahmen je ${esc(q.left)}</label><select id="ex-a-${q.id}" data-exam-answer="${q.id}" data-key="ca">${minmaxOptions(ans.ca,true)}</select></div><div class="field"><label for="ex-b-${q.id}">Teilnahmen je ${esc(q.right)}</label><select id="ex-b-${q.id}" data-exam-answer="${q.id}" data-key="cb">${minmaxOptions(ans.cb,true)}</select></div></div>`}</section>`;}).join('')}</div>`;}
function examResultView(e){const r=e.result;return pageHead('PRÜFUNG ABGESCHLOSSEN','Dein Ergebnis. Dein nächster Schritt.','Die Punkte zeigen, welche automatisch geprüften Kriterien erfüllt wurden. Lies auch die Rückmeldungen zu den Modellen.',btn('Neue Prüfung','new-exam','refresh'))+`<section class="panel"><div class="exam-result"><div><div class="eyebrow">ERREICHTE PUNKTE</div><div class="exam-score">${r.percent}<small> / 100</small></div><p class="small muted mt16">${r.auto?'Automatisch bei Zeitablauf abgegeben.':'Selbst abgegeben.'}</p></div><div class="result-bars">${[['Grundlagen und Kardinalitäten',r.a,20],['Text → ERM',r.b,40],['ERM → Tabellen',r.c,40]].map(([name,v,max])=>`<div><div class="between"><span>${name}</span><strong>${v} / ${max}</strong></div>${progress(Math.round(v/max*100))}</div>`).join('')}<p class="small muted mt16">${r.percent>=85?'Die geprüften Grundlagen sitzen bereits gut. Kontrolliere noch die Zusatzbedingungen und die Lesbarkeit.':r.percent>=60?'Ein Teil der Struktur sitzt. Nutze die Einzelrückmeldungen, um gezielt nachzuarbeiten.':'Arbeite die Grundlagen und die beiden Umwandlungsschritte noch einmal mit Hilfen durch.'}</p></div></div></section><section class="panel mt24"><h3>Teil A · Fragen und Erklärungen</h3><div class="stack mt16">${r.questions.map(x=>`<div class="feedback ${x.points===x.max?'good':'bad'}"><b>${esc(x.title)} · ${x.points}/${x.max} Punkte</b>${esc(x.text)}</div>`).join('')}</div></section>${checkHTML(r.model,'Teil B · Dein ERM')}${checkHTML(r.schema,'Teil C · Dein relationales Modell')}<section class="panel mt24"><h3>Modelle vergleichen</h3><div class="row wrap mt16">${btn('Dein Prüfungs ERM','exam-model-view','eye')}${btn('ERM Musterlösung','exam-solution-model','network')}${btn('Dein Prüfungsschema','exam-schema-view','table')}${btn('Schema Musterlösung','exam-solution-schema','table')}</div></section>`;}
function sourcesView(){return pageHead('TRANSPARENZ & DATENSCHUTZ','Über dieses Lernstudio.','Eine eigenständige Offline Anwendung für das Üben von Datenmodellierung.')+`<div class="cols2"><section class="panel source-list"><h3>Grundlage und Umfang</h3><p>Umgesetzt wurde das bereitgestellte Konzept „Interaktives Informatik Lernstudio für die 12. Klasse“. Es beschreibt insbesondere ERM, Kardinalitäten, den Diagrammeditor und die Schulmensa Aufgabe. Die Lerntexte, weiteren Szenarien, Prüfungen und Musterlösungen sind neu erstellte Übungsinhalte auf dieser Grundlage.</p><p class="mt12">Zielgruppe: 12. Klasse, unter anderem FOS. Die Inhalte sind keine amtlich bestätigte Abdeckung des bayerischen Lehrplans und keine Original Schulaufgaben. Richte dich bei abweichender Notation nach der Vorgabe deiner Lehrkraft.</p><h3>Die Konvention im Diagramm</h3><p>Rechtecke, Rauten und Ovale folgen einer schulnahen ER Darstellung. Kardinalitäten werden hier durch lokale Min Max Angaben ergänzt: Das Paar direkt bei einer Entität zählt Teilnahmen eines einzelnen Objekts dieses Typs. Es ist nicht die klassische Chen Verhältnisnotation. Eine gestrichelte Attributumrandung dient hier zusätzlich als Hinweis auf ein optionales Attribut.</p><h3>Bewertung ohne falsche Versprechen</h3><p>Die Auswertung vergleicht Modellstrukturen, Attribute, Schlüssel und Referenzen. Bekannte Namensvarianten, vertauschte Beziehungsrichtungen und einfache n:m Zuordnungsentitäten werden berücksichtigt. Freie semantische Gleichwertigkeit, beliebige Normalisierungen und komplexe Fachregeln können nicht zuverlässig automatisch beurteilt werden. Unbekannte Alternativen werden deshalb kenntlich gemacht.</p></section><section class="panel source-list"><h3>Fachliche Referenzen</h3><p>Die folgenden Primärquellen wurden zur Prüfung zentraler Begriffe und SQL Bedingungen herangezogen. Die Webseite selbst lädt diese Quellen nicht. Nur beim bewussten Öffnen eines Links wird eine Internetverbindung benötigt.</p><a href="https://www.postgresql.org/docs/18/ddl-constraints.html" target="_blank" rel="noopener noreferrer">PostgreSQL Dokumentation: Constraints, Primärschlüssel, Fremdschlüssel und UNIQUE</a><a href="https://opendsa.cs.vt.edu/ODSA/Books/Database/html/ERDRelationships.html" target="_blank" rel="noopener noreferrer">Virginia Tech OpenDSA: ERD Relationship Types und Notationsvergleich</a><a href="https://pld.cs.luc.edu/database/ER.html" target="_blank" rel="noopener noreferrer">Loyola University Chicago: Entity Relationship Modeling und Min Max Teilnahme</a><h3>Keine Speicherung</h3><p>Es gibt keine Analysewerkzeuge, externen Schriftarten, Netzwerkanfragen, Benutzerkonten oder Backenddienste. Fortschritt, Notizen, Entwürfe und Prüfungsergebnisse bleiben nur im Arbeitsspeicher dieses Tabs. Beim Neuladen oder Schließen werden sie verworfen.</p><h3>Was im Tab gezählt wird</h3><p>Übungsergebnisse mit Datum, aktive Lernzeit, Lernserie, gelesene Kapitel, Karteikartenstatus, Merkliste, Diagramme, Tabellenschemata und eigene Notizen. Es werden keine persönlichen Angaben verlangt.</p><div class="row wrap mt20">${btn('Tastaturhilfe','keyboard-help','info')}</div></section></div>`;}
function render(top=false){const focusID=!top&&$('#app').contains(document.activeElement)?document.activeElement.id:'';let page=UI.page;const content=({dashboard,learn:learnView,cards:cardsView,tasks:tasksView,editor:editorView,schema:schemaView,exam:examView,progress:progressView,sources:sourcesView})[page]||dashboard;$('#app').innerHTML=content();$$('.schema-model').forEach(w=>w.insertAdjacentHTML('afterend',`<div class="diagram-actions">${btn('Diagramm groß anzeigen','expand-diagram','expand','sm')}</div>`));if(focusID)document.getElementById(focusID)?.focus({preventScroll:true});$$('[data-nav]').forEach(b=>{b.classList.toggle('active',b.dataset.nav===page);b.setAttribute('aria-current',b.dataset.nav===page?'page':'false');b.disabled=!!state.exam?.active&&b.dataset.nav!=='exam';});$('#exam-return').classList.toggle('hidden',!state.exam?.active);if(top){window.scrollTo({top:0,behavior:'instant'});$('#app').focus({preventScroll:true});}document.title=({dashboard:'Dein Lernstudio',learn:'Lernlabor',cards:'Kardinalitäten',tasks:'Aufgaben',editor:'ERM Werkstatt',schema:'Relationen',exam:'Prüfung',progress:'Fortschritt',sources:'Über das Lernstudio'}[page]||'Lernstudio')+' · modellraum';}
function navigate(page){if(state.exam?.active&&page!=='exam'){toast('Während der Prüfung sind die anderen Lernbereiche gesperrt.');return;}UI.page=page;UI.check=null;UI.schemaCheck=null;UI.selected=null;if(page!=='exam')location.hash=page;else location.hash='exam';render(true);}

const TYPES=['INTEGER','BIGINT','VARCHAR(40)','VARCHAR(255)','TEXT','DECIMAL(10,2)','DATE','TIME','BOOLEAN'];
function formFooter(label='Speichern'){return `<div class="modal-footer">${btn('Abbrechen','close-modal')}<button type="submit" class="btn primary">${label}</button></div>`;}
function entityForm(){modal('Neue Entität anlegen',`<form data-form="entity"><div class="field"><label for="new-entity-name">Bezeichnung des Entitätstyps</label><input id="new-entity-name" name="name" required maxlength="60" placeholder="Zum Beispiel Kunde" autocomplete="off"></div><p class="small muted">Verwende möglichst den Singular. Ergänze danach die Attribute in den Eigenschaften.</p>${formFooter('Entität anlegen')}</form>`);}
function relationForm(){const m=getModel();if(!m.entities.length)return;const options=(sel)=>m.entities.map(e=>`<option value="${e.id}" ${e.id===sel?'selected':''}>${esc(e.name)}</option>`).join('');let a=UI.selected&&m.entities.some(e=>e.id===UI.selected)?UI.selected:m.entities[0].id,b=m.entities.find(e=>e.id!==a)?.id||a;modal('Beziehung erstellen',`<form data-form="relation"><div class="field"><label for="rel-name">Beziehungsname</label><input id="rel-name" name="name" required maxlength="60" placeholder="Zum Beispiel gibt auf"></div><div class="cols2"><div class="field"><label for="rel-a">Entität A</label><select id="rel-a" name="a">${options(a)}</select></div><div class="field"><label for="rel-b">Entität B</label><select id="rel-b" name="b">${options(b)}</select></div><div class="field"><label for="rel-ca">Teilnahmen je Objekt A</label><select id="rel-ca" name="ca">${minmaxOptions('0,n')}</select></div><div class="field"><label for="rel-cb">Teilnahmen je Objekt B</label><select id="rel-cb" name="cb">${minmaxOptions('1,1')}</select></div></div><div class="callout">Die Angaben zählen die Beziehungen eines einzelnen Objekts <strong>an der jeweiligen Seite</strong>. Beim Kunden steht zum Beispiel (0,n), bei Bestellung (1,1).</div><div class="cols2 mt16"><div class="field"><label for="rel-role-a">Rolle A · bei Selbstbeziehung erforderlich</label><input id="rel-role-a" name="roleA" maxlength="40" placeholder="Zum Beispiel Mentor"></div><div class="field"><label for="rel-role-b">Rolle B · bei Selbstbeziehung erforderlich</label><input id="rel-role-b" name="roleB" maxlength="40" placeholder="Zum Beispiel Mentee"></div></div>${formFooter('Beziehung erstellen')}</form>`);}
function attributeForm(ownerId,attrId=null){const n=findNode(getModel(),ownerId);if(!n)return;const a=n.attrs.find(x=>x.id===attrId)||{name:'',key:false,optional:false},ent=getModel().entities.some(x=>x.id===ownerId);modal(attrId?'Attribut bearbeiten':'Attribut ergänzen',`<form data-form="attribute" data-owner="${ownerId}" data-id="${attrId||''}"><p class="small muted mb16">Gehört zu: <strong>${esc(n.name)}</strong></p><div class="field"><label for="attr-name">Attributname</label><input id="attr-name" name="name" value="${esc(a.name)}" maxlength="60" required placeholder="Zum Beispiel KundenID"></div>${ent?`<label class="check-label mb16"><input type="checkbox" name="key" data-change="attribute-key" ${a.key?'checked':''}>Schlüsselattribut · im Diagramm unterstreichen</label>`:''}<label class="check-label"><input type="checkbox" name="optional" ${a.optional?'checked':''} ${a.key?'disabled':''}>Optionaler Wert</label><p class="tiny muted mt12">${ent?'Mehrere Schlüsselattribute bilden gemeinsam einen zusammengesetzten Schlüssel.':'Ein Attribut an einer Beziehung beschreibt die konkrete Zuordnung.'}</p>${attrId?`<div class="mt20">${btn('Attribut löschen','delete-attribute','trash','danger sm',`data-owner="${ownerId}" data-id="${attrId}"`)}</div>`:''}${formFooter()}</form>`);}
function tableForm(id=null){let t=getSchema().tables.find(x=>x.id===id);modal(t?'Tabelle umbenennen':'Tabelle hinzufügen',`<form data-form="table" data-id="${id||''}"><div class="field"><label for="table-name">Tabellenname</label><input id="table-name" name="name" required maxlength="60" value="${esc(t?.name||'')}" placeholder="Zum Beispiel Bestellung"></div><p class="small muted">Lege anschließend die Spalten an. Der Tabellenname allein erzeugt noch keine Schlüssel oder Verbindungen.</p>${formFooter(t?'Speichern':'Tabelle anlegen')}</form>`);}
function columnForm(tableId,colId=null){const sc=getSchema(),t=sc.tables.find(x=>x.id===tableId);if(!t)return;const c=t.cols.find(x=>x.id===colId)||column('',{nn:true});let ref=c.refTable?c.refTable+'|'+c.refCol:'';modal(colId?'Spalte bearbeiten':'Spalte ergänzen',`<form data-form="column" data-table="${tableId}" data-id="${colId||''}"><p class="small muted mb16">Tabelle <strong>${esc(t.name)}</strong></p><div class="cols2"><div class="field"><label for="col-name">Spaltenname</label><input id="col-name" name="name" required maxlength="60" value="${esc(c.name)}" placeholder="Zum Beispiel KundenID"></div><div class="field"><label for="col-type">Datentyp</label><select id="col-type" name="type">${TYPES.map(v=>`<option ${c.type===v?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="checklist"><label><input type="checkbox" name="pk" data-change="column-pk" ${c.pk?'checked':''}>Teil des Primärschlüssels (PK)</label><label><input type="checkbox" name="nn" ${c.nn||c.pk?'checked':''} ${c.pk?'disabled':''}>Wert erforderlich · NOT NULL</label><label><input type="checkbox" name="unique" ${c.unique?'checked':''}>Diese einzelne Spalte ist eindeutig · UNIQUE</label></div><div class="field mt20"><label for="col-ref">Fremdschlüsselziel · Tabelle und Spalte</label><select id="col-ref" name="ref" data-change="column-ref"><option value="">Keine Referenz</option>${sc.tables.map(tt=>`<optgroup label="${esc(tt.name)}">${tt.cols.filter(cc=>cc.id!==colId).map(cc=>`<option value="${tt.id}|${cc.id}" ${ref===tt.id+'|'+cc.id?'selected':''}>${esc(tt.name)}.${esc(cc.name)}${cc.pk?' · PK':cc.unique?' · UNIQUE':''}</option>`).join('')}</optgroup>`).join('')}</select></div><details><summary class="small">Mehrspaltige Referenz und Selbstbezug</summary><div class="field mt12"><label for="col-group">Name einer gemeinsamen FK Gruppe · optional</label><input id="col-group" name="fkGroup" maxlength="40" value="${esc(c.fkGroup||'')}" placeholder="Leer bei einspaltigem Fremdschlüssel"></div><p class="tiny muted">Mehrere Spalten mit demselben Gruppennamen bilden EINEN zusammengesetzten Fremdschlüssel. Setze je Spalte das zugehörige Ziel. Der Zielschlüssel muss als gesamte Gruppe eindeutig sein.</p><label class="check-label mt16"><input type="checkbox" name="noSelf" ${c.noSelf?'checked':''}>Direkten Selbstbezug ausschließen · CHECK</label><p class="tiny muted mt8">Nur für eine Referenz auf den einspaltigen Primärschlüssel derselben Tabelle, zum Beispiel MentorID ungleich MitarbeiterID.</p></details>${colId?`<div class="mt20">${btn('Spalte löschen','delete-column','trash','danger sm',`data-table="${tableId}" data-id="${colId}"`)}</div>`:''}${formFooter()}</form>`);}
function uniqueForm(tableId){const t=getSchema().tables.find(x=>x.id===tableId);if(!t)return;if(t.cols.length<2){toast('Für eine gemeinsame UNIQUE Bedingung sind mindestens zwei Spalten erforderlich.');return;}modal('Gemeinsame Eindeutigkeit',`<form data-form="unique" data-table="${tableId}"><p class="small muted mb16">Wähle die Spalten, deren <strong>Kombination</strong> in ${esc(t.name)} eindeutig sein muss. Die einzelnen Werte dürfen sich wiederholen.</p><div class="checklist">${t.cols.map(c=>`<label><input type="checkbox" name="cols" value="${c.id}">${esc(c.name)}</label>`).join('')}</div>${formFooter('UNIQUE Gruppe hinzufügen')}</form>`);}
function showModelSolution(s,allowLoad=true){markSeen('erm:'+s.id);modal('Musterlösung · '+esc(s.title),`<div class="callout">Dies ist eine mögliche direkte ER Modellierung. Eine fachlich gleichwertige Zuordnungsentität kann eine n:m Beziehung ersetzen.</div><div class="diagram-full">${svgDiagram(s.model)}</div><div class="stack">${s.model.relations.map(r=>{let a=s.model.entities.find(e=>e.id===r.a),b=s.model.entities.find(e=>e.id===r.b);return `<div class="feedback"><b>${esc(a.name)} → ${esc(b.name)} · ${ratio(r.ca,r.cb)}</b>Bei ${esc(a.name)}${r.roles?.[0]?' als '+esc(r.roles[0]):''} gilt (${r.ca}): ${localRead(r.ca)} Teilnahme(n). Bei ${esc(b.name)}${r.roles?.[1]?' als '+esc(r.roles[1]):''} gilt (${r.cb}): ${localRead(r.cb)} Teilnahme(n).${r.attrs.length?'<br>Beziehungsattribute: '+r.attrs.map(a=>esc(a.name)).join(', '):''}</div>`;}).join('')}${s.notes.map(n=>`<div class="callout">${esc(n)}</div>`).join('')}</div>${allowLoad?`<div class="modal-footer">${btn('Muster in den Editor übernehmen','load-model-solution','pen','primary',`data-id="${s.id}"`)}</div>`:''}`,true);}
function showSchemaSolution(s,allowLoad=true){markSeen('schema:'+s.id);const sc=makeSchema(s);modal('Tabellenlösung · '+esc(s.title),`<div class="schema-grid">${sc.tables.map(t=>schemaTableHTML(t,sc,false)).join('')}</div><div class="stack mt20">${s.notes.map(n=>`<div class="callout">${esc(n)}</div>`).join('')}</div><p class="small muted mt20">Dies ist eine mögliche Übersetzung. Bei einem optionalen 1:1 kann die Fremdschlüsselrichtung wechseln. Bei n:m ist auch eine eigene ID mit gemeinsamem UNIQUE über die beiden Referenzen möglich.</p>${allowLoad?`<div class="modal-footer">${btn('Muster in den Tabelleneditor übernehmen','load-schema-solution','table','primary',`data-id="${s.id}"`)}</div>`:''}`,true);}
function notationDialog(){modal('So liest du die Diagramme',`<div class="stack"><div class="callout"><strong>Hier gilt eine lokale Min Max Konvention.</strong> Die Angabe direkt bei einer Entität zählt Beziehungsteilnahmen eines einzelnen Objekts dieser Entität.</div><p class="small">Kunde (0,n) — gibt auf — (1,1) Bestellung:<br>Ein Kunde kann 0 bis n Bestellungen aufgeben. Jede Bestellung gehört genau einem Kunden. Die maximale Beziehung Kunde → Bestellung ist 1:n.</p><p class="small">Die Position dieser Min Max Angaben darf nicht mit der klassischen Chen Verhältnisnotation oder Crow’s Foot Endpunkten verwechselt werden.</p><div class="rule-lines"><div class="rule-line"><b>▭</b><span>Rechteck: Entitätstyp.</span></div><div class="rule-line"><b>◇</b><span>Raute: Beziehungstyp.</span></div><div class="rule-line"><b>○</b><span>Oval: Attribut. Unterstrichen: Teil des Schlüssels.</span></div></div><p class="small muted">Eine gestrichelte Attributumrandung ist in diesem Studio eine zusätzliche Kennzeichnung für optionale Attribute. Es gibt keine automatische Umstellung auf Crow’s Foot.</p></div>`);}
function schemaRules(){modal('Die Übersetzung in fünf Schritten',`<div class="stack"><div class="callout"><strong>1. Entität → Tabelle.</strong> Attribute werden Spalten. Schlüsselattribute bilden gemeinsam den Primärschlüssel.</div><div class="callout"><strong>2. 1:n → Fremdschlüssel auf der n Seite.</strong> Die Referenz ist NOT NULL, wenn jedes Objekt dieser Seite einen Partner benötigt.</div><div class="callout"><strong>3. n:m → Zuordnungstabelle.</strong> Beide Referenzen sind verpflichtend. Bei höchstens einer Zuordnung je Paar: gemeinsamer Primärschlüssel oder eigene ID plus gemeinsames UNIQUE. Beziehungsattribute kommen dazu.</div><div class="callout"><strong>4. 1:1 → Fremdschlüssel mit Eindeutigkeit.</strong> UNIQUE begrenzt auf höchstens einen Partner. Optionalität steuert die NULL Regel. Eine beidseitige Existenzpflicht braucht zusätzliche Sicherung.</div><div class="callout warn"><strong>5. Restbedingungen notieren.</strong> Mindestanzahlen auf der referenzierten Seite, zeitliche Überschneidungen und andere Fachregeln werden nicht automatisch von einem gewöhnlichen Fremdschlüssel erzwungen.</div></div>`);}
function nextExercise(){const attempted=state.attempts.length;if(!attempted&&!state.lessons.grundlagen){UI.lesson='grundlagen';UI.labTab='lessons';navigate('learn');return;}const w=weakest()[0];if(w.id==='kardinalitaeten'){const c=D.cards.find(c=>state.attempts.some(a=>a.id===c.id&&a.p<100)&&(state.best[c.id]||0)<100)||D.cards.find(c=>(state.best[c.id]||0)<100)||D.cards[0];UI.cardFilter='all';selectCard(c.id);navigate('cards');return;}if(['text','komplex'].includes(w.id)){const s=D.scenarios.find(s=>(w.id==='komplex'?s.level===3:s.level<3)&&(state.best['erm:'+s.id]||0)<100)||D.scenarios[0];startERM(s.id);return;}if(w.id==='relationen'){const s=D.scenarios.find(s=>(state.best['schema:'+s.id]||0)<100)||D.scenarios[0];startSchema(s.id);return;}UI.lesson=w.id;UI.labTab='lessons';navigate('learn');}

async function exportPNG(){const m=getModel(),B=drawingBounds(m),text=svgDiagram(m),blob=new Blob([text],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{try{const scale=Math.min(2,4096/Math.max(B.w,B.h)),canvas=document.createElement('canvas');canvas.width=Math.round(B.w*scale);canvas.height=Math.round(B.h*scale);const ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);canvas.toBlob(b=>{if(b){download('modellraum-diagramm.png',b,'image/png');toast('PNG exportiert.');}else toast('PNG konnte nicht erstellt werden. Nutze den SVG Export.',true);},'image/png');}catch(e){toast('PNG Export nicht möglich: '+e.message,true);}finally{URL.revokeObjectURL(url);}};img.onerror=()=>{URL.revokeObjectURL(url);toast('Das Diagramm konnte nicht als PNG gerendert werden.',true);};img.src=url;}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startExam(){let duration=Number($('#exam-duration')?.value||60),level=$('#exam-level')?.value||'mixed',pool=D.scenarios.filter(s=>level==='hard'?s.level===3:level==='basic'?s.level<3:true),chosen=shuffle(pool);const qs=[...shuffle(D.quiz).slice(0,4).map(q=>({kind:'quiz',id:q.id})),...shuffle(D.cards.filter(c=>level==='basic'?c.level<3:true)).slice(0,4).map(c=>({kind:'card',id:c.id}))];state.exam={id:uid(),active:true,start:Date.now(),deadline:Date.now()+duration*60000,duration,level,questions:qs,answers:{},modelScenario:chosen[0].id,schemaScenario:chosen[1].id,model:blank(),schema:{tables:[]},result:null};UI.examTab='a';editorHistory.exam={undo:[],redo:[]};schemaHistory.exam={undo:[],redo:[]};UI.selected=null;UI.zoom=.68;save();navigate('exam');}
function scoreExam(e,auto=false){let a=0,questions=[];for(const item of e.questions){let ans=e.answers[item.id]||{};if(item.kind==='quiz'){const q=D.quiz.find(q=>q.id===item.id),points=ans.choice===q.answer?2:0;a+=points;questions.push({id:item.id,kind:'quiz',points,max:2,title:q.question,text:`Deine Antwort: ${ans.choice===undefined?'nicht beantwortet':q.options[ans.choice]}. Richtig: ${q.options[q.answer]}. ${q.explain}`});}else{const c=D.cards.find(c=>c.id===item.id),points=Number(ans.type===ratio(c.ca,c.cb))+Number(ans.ca===c.ca)+Number(ans.cb===c.cb);a+=points;questions.push({id:item.id,kind:'card',points,max:3,title:c.title,text:`Deine Angaben: ${ans.type||'offen'}, (${ans.ca||'offen'}), (${ans.cb||'offen'}). Richtig: ${c.left} → ${c.right} ist ${ratio(c.ca,c.cb)}. Je ${c.left} (${c.ca}); je ${c.right} (${c.cb}). ${c.tip}`});}}
 const model=checkModel(e.model,scenario(e.modelScenario)),schema=checkSchema(e.schema,scenario(e.schemaScenario)),b=+(40*model.score/model.total).toFixed(1),c=+(40*schema.score/schema.total).toFixed(1),percent=+(a+b+c).toFixed(1);return {a,b,c,percent,questions,model,schema,auto,finished:Date.now()};}
function finishExam(auto=false){let e=state.exam;if(!e?.active)return;if(!auto&&!confirm('Prüfung jetzt verbindlich abgeben? Danach lassen sich die Antworten dieses Durchlaufs nicht mehr ändern.'))return;closeModal();e.result=scoreExam(e,auto);e.active=false;state.examHistory.push({id:e.id,date:new Date().toISOString(),percent:e.result.percent});if(state.examHistory.length>100)state.examHistory.shift();for(const x of e.result.questions){let topic=x.kind==='quiz'?D.quiz.find(q=>q.id===x.id).topic:'kardinalitaeten';record(x.id,topic,x.points,x.max,false);}record('erm:'+e.modelScenario,scenario(e.modelScenario).level===3?'komplex':'text',e.result.model.score,e.result.model.total,false);record('schema:'+e.schemaScenario,'relationen',e.result.schema.score,e.result.schema.total,false);UI.page='exam';save();render(true);toast(auto?'Die Prüfungszeit ist abgelaufen. Deine gespeicherten Antworten wurden ausgewertet.':'Prüfung abgegeben und ausgewertet.');}
function submitForm(form){const data=new FormData(form),v=k=>String(data.get(k)||'').trim(),checked=k=>data.has(k),kind=form.dataset.form;
 if(data.has('name')&&!v('name')){toast('Die Bezeichnung darf nicht nur aus Leerzeichen bestehen.',true);return;}
 if(kind==='entity'){const name=v('name');if(!name)return;if(getModel().entities.some(e=>norm(e.name)===norm(name))){toast('Diesen Entitätstyp gibt es bereits.',true);return;}let id=uid();mutation(m=>{let i=m.entities.length;m.entities.push({id,name,x:260+(i%3)*450,y:250+Math.floor(i/3)*360,attrs:[]});UI.selected=id;});closeModal();return;}
 if(kind==='relation'){if(v('a')===v('b')&&(!v('roleA')||!v('roleB')||norm(v('roleA'))===norm(v('roleB')))){toast('Gib zwei verschiedene Rollen für die Selbstbeziehung an.',true);return;}const id=uid();mutation(m=>{const r={id,name:v('name'),a:v('a'),b:v('b'),ca:v('ca'),cb:v('cb'),roles:[v('roleA'),v('roleB')],attrs:[]};let same=m.relations.filter(x=>(x.a===r.a&&x.b===r.b)||(x.a===r.b&&x.b===r.a));if(same.length){let p=relationPos(m,r);r.x=p.x;r.y=p.y+150*same.length;}m.relations.push(r);UI.selected=id;});closeModal();return;}
 if(kind==='attribute'){const owner=findNode(getModel(),form.dataset.owner),id=form.dataset.id;if(!owner)return;if(owner.attrs.some(a=>a.id!==id&&norm(a.name)===norm(v('name')))){toast('Dieses Attribut existiert dort bereits.',true);return;}mutation(m=>{let n=findNode(m,owner.id),a=n.attrs.find(a=>a.id===id);const obj={id:id||uid(),name:v('name'),key:checked('key'),optional:checked('optional')&&!checked('key')};if(a)Object.assign(a,obj);else n.attrs.push(obj);});closeModal();return;}
 if(kind==='table'){const id=form.dataset.id;if(getSchema().tables.some(t=>t.id!==id&&norm(t.name)===norm(v('name')))){toast('Dieser Tabellenname ist bereits vergeben.',true);return;}schemaMutate(sc=>{let t=sc.tables.find(t=>t.id===id);if(t)t.name=v('name');else sc.tables.push({id:uid(),name:v('name'),cols:[],uniqueGroups:[]});});closeModal();return;}
 if(kind==='column'){const tid=form.dataset.table,id=form.dataset.id,t=getSchema().tables.find(t=>t.id===tid);if(!t)return;if(t.cols.some(c=>c.id!==id&&norm(c.name)===norm(v('name')))){toast('Diese Spalte existiert in der Tabelle bereits.',true);return;}const [refTable='',refCol='']=v('ref').split('|');if(checked('noSelf')&&(refTable!==tid||v('fkGroup'))){toast('Der Ausschluss des Selbstbezugs ist nur für einen einspaltigen Fremdschlüssel auf die eigene Tabelle möglich.',true);return;}
 schemaMutate(sc=>{const table=sc.tables.find(t=>t.id===tid),c=table.cols.find(c=>c.id===id),obj={id:id||uid(),name:v('name'),type:v('type'),pk:checked('pk'),nn:checked('pk')||checked('nn'),unique:checked('unique'),refTable,refCol,fkGroup:refTable?v('fkGroup'):'',noSelf:checked('noSelf')};if(c)Object.assign(c,obj);else table.cols.push(obj);});closeModal();return;}
 if(kind==='unique'){const cols=data.getAll('cols');if(cols.length<2){toast('Wähle mindestens zwei Spalten. Für eine einzelne Spalte verwende die UNIQUE Option im Spalteneditor.',true);return;}const t=getSchema().tables.find(t=>t.id===form.dataset.table);if(isUnique(t,cols)){toast('Diese Spaltengruppe ist bereits eindeutig.');return;}schemaMutate(sc=>sc.tables.find(x=>x.id===t.id).uniqueGroups.push(cols));closeModal();return;}
 if(kind==='lab-customer'){let id=Number(v('id'));if(!Number.isSafeInteger(id)||id<1||UI.customers.some(c=>c.id===id)){toast('Die KundenID muss eine positive, noch nicht verwendete ganze Zahl sein.',true);return;}UI.customers.push({id,name:v('name')});UI.keyMessage=`Kunde ${id} wurde eingefügt.`;closeModal();render();return;}
 if(kind==='lab-order'){let id=Number(v('id')),cid=Number(v('cid'));if(!Number.isSafeInteger(id)||id<1||UI.orders.some(o=>o.id===id)){toast('Die BestellID muss eine positive, noch nicht verwendete ganze Zahl sein.',true);return;}if(!UI.customers.some(c=>c.id===cid)){UI.keyMessage=`Abgelehnt: Kunde ${cid} existiert nicht. Die Fremdschlüsselregel schützt die referenzielle Integrität.`;closeModal();render();return;}UI.orders.push({id,cid});UI.keyMessage=`Bestellung ${id} verweist auf den vorhandenen Kunden ${cid}.`;UI.keyHighlight=cid;closeModal();render();return;}
}
function clearColumnReferences(sc,tableId,colId=null){for(const t of sc.tables){for(const c of t.cols)if(c.refTable===tableId&&(!colId||c.refCol===colId)){c.refTable='';c.refCol='';c.fkGroup='';c.noSelf=false;}if(t.id===tableId&&colId)t.uniqueGroups=(t.uniqueGroups||[]).filter(g=>!g.includes(colId));}}

dig ist. Ein Auftrag enthält in der Regel mehrere Produkte. Ein Produkt kann aber in mehreren Aufträgen vorkommen. Die Relation Produkt soll als Attribute unter anderem die Produkt-ID, die Bezeichnung, den Listenverkaufspreis sowie die Tagesproduktion in Stück enthalten.","model":{"entities":[{"id":"k","name":"Kunde","attrs":[],"aliases":[],"x":200,"y":200},{"id":"a","name":"Auftrag","attrs":[],"aliases":[],"x":1000,"y":200},{"id":"m","name":"Mitarbeiter","attrs":[],"aliases":[],"x":200,"y":630},{"id":"p","name":"Produkt","attrs":[{"name":"Produkt-ID","key":true,"optional":false,"aliases":[],"id":"p_a0"},{"name":"Bezeichnung","key":false,"optional":false,"aliases":[],"id":"p_a1"},{"name":"Listenverkaufspreis","key":false,"optional":false,"aliases":[],"id":"p_a2"},{"name":"Tagesproduktion in Stück","key":false,"optional":false,"aliases":[],"id":"p_a3"}],"aliases":[],"x":1000,"y":630}],"relations":[{"id":"erteilt","name":"erteilt","a":"k","b":"a","ca":"0,n","cb":"1,1","attrs":[],"table":"","aliases":[],"roles":[]},{"id":"betreut","name":"betreut","a":"m","b":"k","ca":"0,n","cb":"1,1","attrs":[],"table":"","aliases":[],"roles":[]},{"id":"enthaelt","name":"enthält","a":"a","b":"p","ca":"0,n","cb":"0,n","attrs":[],"table":"Auftragsposition","aliases":[],"roles":[]}]},"notes":["Diese Teilaufgabe nennt nur die Produktattribute. Für die anderen Entitätstypen werden hier keine erfundenen Schlüssel gefordert. Für eine zusätzliche relationale Umsetzung müsstest du Identifikatoren ergänzen und diese als Annahme kennzeichnen."],"school":true,"level":2,"tag":"Unterricht","minutes":20,"focus":["Originalaufgabe","Schulnotation"],"ermOnly":true},{"id":"u-04b","title":"Lieferanten und Rahmenvertrag","source":"04","pages":[3],"text":"Mit jedem Lieferanten wird ein individueller Rahmenvertrag abgeschlossen, in dem die Höhe des Rabatts, die Lieferbedingung sowie die Zahlungsbedingung festgelegt sind (Attribute). Die Lieferanten liefern ein oder mehrere Artikel, wobei ein Artikel von einem oder von mehreren Lieferanten bezogen werden kann. Ein Artikel ist einer Artikelgruppe zugeordnet, wobei eine Artikelgruppe mehrere Artikel umfasst. Die Artikelgruppe ist durch die Eigenschaften Artikelgruppe-ID, die Gruppenbezeichnung sowie durch den zuständigen Einkäufer (Mitarbeiter) eindeutig identifizierbar.","model":{"entities":[{"id":"l","name":"Lieferant","attrs":[],"aliases":[],"x":200,"y":210},{"id":"a","name":"Artikel","attrs":[],"aliases":[],"x":1000,"y":210},{"id":"r","name":"Rahmenvertrag","attrs":[{"name":"Rabatt","key":false,"optional":false,"aliases":[],"id":"r_a0"},{"name":"Lieferbedingung","key":false,"optional":false,"aliases":[],"id":"r_a1"},{"name":"Zahlungsbedingung","key":false,"optional":false,"aliases":[],"id":"r_a2"}],"aliases":[],"x":200,"y":640},{"id":"g","name":"Artikelgruppe","attrs":[{"name":"Artikelgruppe-ID","key":true,"optional":false,"aliases":[],"id":"g_a0"},{"name":"Gruppenbezeichnung","key":false,"optional":false,"aliases":[],"id":"g_a1"},{"name":"Einkäufer","key":false,"optional":false,"aliases":[],"id":"g_a2"}],"aliases":[],"x":1000,"y":640}],"relations":[{"id":"liefert","name":"liefert","a":"l","b":"a","ca":"1,n","cb":"1,n","attrs":[],"table":"Lieferant_Artikel","aliases":[],"roles":[]},{"id":"vertrag","name":"schließt ab","a":"l","b":"r","ca":"1,1","cb":"1,1","attrs":[],"table":"","aliases":[],"roles":[]},{"id":"gehoert","name":"gehört zu","a":"a","b":"g","ca":"1,1","cb":"0,n","attrs":[],"table":"","aliases":[],"roles":[]}]},"notes":["Die 1:1-Zuordnung setzt wie die vorgedruckte Struktur einen individuellen Rahmenvertrag je Lieferant voraus.","Die Vorlage sieht Einkäufer als Attribut der Artikelgruppe vor. Ein eigener Entitätstyp Mitarbeiter wäre eine begründete Erweiterung, nicht die unveränderte Grundlösung.","Zusätzliche IDs für Lieferant, Artikel und Rahmenvertrag stehen nicht im Text und werden im ERM dieser Teilaufgabe nicht erzwungen."],"school":true,"level":2,"tag":"Unterricht","minutes":20,"focus":["Originalaufgabe","Schulnotation"],"ermOnly":true},{"id":"u-edrive-standort","title":"E-DRIVE · Kundenstatus und Standort","source":"10","pages":[1,2],"text":"Die E-DRIVE GmbH bietet in deutschen Großstädten Car-Sharing mit strombetriebenen Fahrzeugen von Toyota, Renault und Mitsubishi an.\nEin einmal registrierter Kunde wird je nach Häufigkeit in einen bestimmten Kundenstatus eingruppiert und verfügt über einen individuellen Login-Zugang, um online Mietverträge (Vertrag-ID, Abholtermin, Rückgabetermin, Mietkaution) abschließen zu können. In einem Mietvertrag können ein oder mehrere Fahrzeuge enthalten sein, während ein Fahrzeug im Laufe der Zeit immer in mehreren Mietverträgen enthalten ist. Bei der E-DRIVE GmbH ist jedes Fahrzeug genau einer Preisgruppe zugeordnet und jeweils an einem festgelegten Standort mit vielen Parkzellen (Parkplatz-ID, Straße, PLZ, Ort) abgestellt.","model":{"entities":[{"id":"l","name":"Login-Zugang","attrs":[],"aliases":[],"x":200,"y":170},{"id":"k","name":"Kunde","attrs":[],"aliases":[],"x":750,"y":170},{"id":"s","name":"Kundenstatus","attrs":[],"aliases":[],"x":1300,"y":170},{"id":"v","name":"Mietvertrag","attrs":[{"name":"Vertrag-ID","key":false,"optional":false,"aliases":[],"id":"v_a0"},{"name":"Abholtermin","key":false,"optional":false,"aliases":[],"id":"v_a1"},{"name":"Rückgabetermin","key":false,"optional":false,"aliases":[],"id":"v_a2"},{"name":"Mietkaution","key":false,"optional":false,"aliases":[],"id":"v_a3"}],"aliases":[],"x":750,"y":600},{"id":"p","name":"Preisgruppe","attrs":[],"aliases":[],"x":200,"y":1030},{"id":"f","name":"Fahrzeug","attrs":[],"aliases":[],"x":750,"y":1030},{"id":"o","name":"Standort","attrs":[{"name":"Parkplatz-ID","key":false,"optional":false,"aliases":[],"id":"o_a0"},{"name":"Straße","key":false,"optional":false,"aliases":[],"id":"o_a1"},{"name":"PLZ","key":false,"optional":false,"aliases":[],"id":"o_a2"},{"name":"Ort","key":false,"optional":false,"aliases":[],"id":"o_a3"}],"aliases":[],"x":1300,"y":1030}],"relations":[{"id":"login","name":"verfügt über","a":"k","b":"l","ca":"1,1","cb":"1,1","attrs":[],"table":"","aliases":[],"roles":[]},{"id":"status","name":"erhält","a":"k","b":"s","ca":"1,1","cb":"0,n","attrs":[],"table":"","aliases":[],"roles":[]},{"id":"vertrag","name":"schließt ab","a":"k","b":"v","ca":"0,n","cb":"1,1","attrs":[],"table":"","aliases":[],"roles":[]},{"id":"enthaelt","name":"enthält","a":"v","b":"f","ca":"1,n","cb":"0,n","attrs":[],"table":"Vertragsposition","aliases":[],"roles":[]},{"id":"preis","name":"gehört zu","a":"f","b":"p","ca":"1,1","cb":"0,n","attrs":[],"table":"","aliases":[],"roles":[]},{"id":"steht","name":"ist abgestellt an","a":"f","b":"o","ca":"1,1","cb":"0,n","attrs":[],"table":"","aliases":[],"roles":[]}]},"notes":["Die Rückseitenlösung enthält sieben Entitätstypen. Sie verwendet Standort und ordnet dort ausdrücklich Parkplatz-ID, Straße, PLZ und Ort zu. Diese Bezeichnungen bleiben erhalten.","Der Text nennt nicht für jeden Entitätstyp einen Schlüssel. Die Originalzeichnung unterstreicht die Nummern nicht. Hier wird die Original-ERM-Aufgabe bewertet, nicht eine stillschweigend ergänzte Datenbank.","Anders als Blatt 06: Standort – Fahrzeug ist 1:n, nicht 1:1. Ein Standort hat viele Parkzellen."],"school":true,"level":3,"tag":"Unterricht","minutes":20,"focus":["Originalaufgabe","Schulnotation"],"ermOnly":true},{"id":"u-praxis-offen","title":"Gemeinschaftspraxis · offene Aufgabe","source":"05","pages":[1],"text":"Sie sollen eine Datenbank für eine Arztpraxis entwerfen. Dabei handelt es sich um eine Gemeinschaftspraxis, d.h. es arbeiten verschiedene Ärzte in den gleichen Räumlichkeiten. Erstellen Sie hierzu ein denkbares ERM.","model":{"entities":[{"id":"p","name":"Patient","attrs":[{"name":"Patienten-Nr.","key":true,"optional":false,"aliases":[],"id":"p_a0"},{"name":"Name","key":false,"optional":false,"aliases":[],"id":"p_a1"},{"name":"Vorname","key":false,"optional":false,"aliases":[],"id":"p_a2"}],"aliases":[],"x":220,"y":260},{"id":"a"," lse,"optional":false,"aliases":[],"id":"s_a2"},{"name":"Religion","key":false,"optional":false,"aliases":[],"id":"s_a3"},{"name":"1. Fremdsprache","key":false,"optional":false,"aliases":[],"id":"s_a4"}],"aliases":[],"x":280,"y":280},{"id":"k","name":"Klasse","attrs":[{"name":"Klassenkürzel","key":false,"optional":false,"aliases":[],"id":"k_a0"},{"name":"Schuljahr","key":false,"optional":false,"aliases":[],"id":"k_a1"}],"aliases":[],"x":1050,"y":280}],"relations":[{"id":"gehoert","name":"gehört zu","a":"s","b":"k","ca":"1,1","cb":"0,n","attrs":[],"table":"","aliases":[],"roles":[]}]},"notes":["Möglicher Lösungsvorschlag: Religion, Name, Vorname, Geburtsdatum und 1. Fremdsprache beschreiben Schüler. Klassenkürzel und Schuljahr beschreiben Klasse.","Die Zuordnung der 1. Fremdsprache kann bei einheitlichen Klassenregeln abweichen. Begründe deine Annahme. Die Aufgabe gibt keine Schlüssel und keine schuljahresübergreifende Historie vor.","Für das dargestellte Schuljahr wird angenommen: ein Schüler gehört genau einer Klasse an. Ein Verlauf über mehrere Schuljahre benötigt ein erweitertes Modell."],"school":true,"level":2,"tag":"Unterricht","minutes":20,"focus":["Originalaufgabe","Schulnotation"],"ermOnly":true,"openTask":true},{"id":"x-lernwerkstatt","title":"Probeklausur · Lernwerkstatt","source":"extra","pages":[],"text":"Eine Lernwerkstatt verwaltet Teilnehmer mit Teilnehmer-Nr., Name und Vorname sowie Workshops mit Workshop-Nr., Thema und Datum. Ein Teilnehmer kann mehrere Workshops besuchen. Ein Workshop kann mehrere Teilnehmer haben. Für jede Kombination aus Teilnehmer und Workshop wird das Anmeldedatum gespeichert. Ein Teilnehmer wird pro Workshop nur einmal angemeldet. Jeder Workshop findet in genau einem Raum statt. Ein Raum kann für mehrere Workshops genutzt werden. Zu einem Raum werden Raum-Nr. und Bezeichnung gespeichert. Jeder Teilnehmer besitzt genau einen Werkstattausweis. Jeder Ausweis gehört genau einem Teilnehmer. Zum Ausweis werden Ausweis-Nr. und Ausstellungsdatum gespeichert. Die Ausweisdaten bleiben in einer eigenen Relation.","model":{"entities":[{"id":"t","name":"Teilnehmer","attrs":[{"name":"Teilnehmer-Nr.","key":true,"optional":false,"aliases":[],"id":"t_a0"},{"name":"Name","key":false,"optional":false,"aliases":[],"id":"t_a1"},{"name":"Vorname","key":false,"optional":false,"aliases":[],"id":"t_a2"}],"aliases":[],"x":200,"y":240},{"id":"w","name":"Workshop","attrs":[{"name":"Workshop-Nr.","key":true,"optional":false,"aliases":[],"id":"w_a0"},{"name":"Thema","key":false,"optional":false,"aliases":[],"id":"w_a1"},{"name":"Datum","key":false,"optional":false,"aliases":[],"id":"w_a2"}],"aliases":[],"x":870,"y":240},{"id":"r","name":"Raum","attrs":[{"name":"Raum-Nr.","key":true,"optional":false,"aliases":[],"id":"r_a0"},{"name":"Bezeichnung","key":false,"optional":false,"aliases":[],"id":"r_a1"}],"aliases":[],"x":870,"y":720},{"id":"a","name":"Werkstattausweis","attrs":[{"name":"Ausweis-Nr.","key":true,"optional":false,"aliases":[],"id":"a_a0"},{"name":"Ausstellungsdatum","key":false,"optional":false,"aliases":[],"id":"a_a1"}],"aliases":[],"x":200,"y":720}],"relations":[{"id":"bes","name":"besucht","a":"t","b":"w","ca":"0,n","cb":"0,n","attrs":[{"name":"Anmeldedatum","key":false,"optional":false,"aliases":[],"id":"bes_a0"}],"table":"Anmeldung","aliases":[],"roles":[]},{"id":"raum","name":"findet statt in","a":"w","b":"r","ca":"1,1","cb":"0,n","attrs":[],"table":"","aliases":[],"roles":[]},{"id":"aus","name":"besitzt","a":"t","b":"a","ca":"1,1","cb":"1,1","attrs":[],"table":"","aliases":[],"roles":[]}]},"notes":["Zusätzlich erstellte Prüfungssimulation. Keine Originalaufgabe der Schule."],"school":true,"level":3,"tag":"Unterricht","minutes":20,"focus":["Originalaufgabe","Schulnotation"],"extra":true},{"id":"x-veranstaltung","title":"Probeklausur · zwei m:n-Beziehungen","source":"extra","pages":[],"text":"Ein Veranstaltungsdienst verwaltet Kunden (Kunden-Nr., Name) und Aufträge (Auftrags-Nr., Datum). Ein Kunde kann mehrere Aufträge erteilen; jeder Auftrag gehört genau einem Kunden. Ein Auftrag kann mehrere Geräte enthalten; ein Gerät kann in mehreren Aufträgen vorkommen. Geräte besitzen eine Geräte-Nr. und eine Bezeichnung. Für jedes Paar aus Auftrag und Gerät wird die Menge gespeichert. Das Paar darf nur einmal vorkommen. Zusätzlich werden Techniker (Techniker-Nr., Name) gespeichert. Ein Techniker kann an mehreren Aufträgen arbeiten. An einem Auftrag können mehrere Techniker arbeiten. Für jedes Paar aus Auftrag und Techniker werden die geleisteten Stunden gespeichert. Auch dieses Paar darf nur einmal vorkommen.","model":{"entities":[{"id":"k","name":"Kunde","attrs":[{"name":"Kunden-Nr.","key":true,"optional":false,"aliases":[],"id":"k_a0"},{"name":"Name","key":false,"optional":false,"aliases":[],"id":"k_a1"}],"aliases":[],"x":190,"y":240},{"id":"a","name":"Auftrag","attrs":[{"name":"Auftrags-Nr.","key":true,"optional":false,"aliases":[],"id":"a_a0"},{"name":"Datum","key":false,"optional":false,"aliases":[],"id":"a_a1"}],"aliases":[],"x":810,"y":240},{"id":"g","name":"Gerät","attrs":[{"name":"Geräte-Nr.","key":true,"optional":false,"aliases":[],"id":"g_a0"},{"name":"Bezeichnung","key":false,"optional":false,"aliases":[],"id":"g_a1"}],"aliases":[],"x":1430,"y":240},{"id":"t","name":"Techniker","attrs":[{"name":"Techniker-Nr.","key":true,"optional":false,"aliases":[],"id":"t_a0"},{"name":"Name","key":false,"optional":false,"aliases":[],"id":"t_a1"}],"aliases":[],"x":810,"y":730}],"relations":[{"id":"ert","name":"erteilt","a":"k","b":"a","ca":"0,n","cb":"1,1","attrs":[],"table":"","aliases":[],"roles":[]},{"id":"enth","name":"enthält","a":"a","b":"g","ca":"0,n","cb":"0,n","attrs":[{"name":"Menge","key":false,"optional":false,"aliases":[],"id":"enth_a0"}],"table":"Auftragsposition","aliases":[],"roles":[]},{"id":"arb","name":"arbeitet an","a":"t","b":"a","ca":"0,n","cb":"0,n","attrs":[{"name":"Stunden","key":false,"optional":false,"aliases":[],"id":"arb_a0"}],"table":"Einsatz","aliases":[],"roles":[]}]},"notes":["Zusätzlich erstellte Prüfungssimulation mit zwei unabhängig aufzulösenden m:n-Beziehungen.","Menge steht in Auftragsposition. Stunden stehen in Einsatz. Eine einzige große Zuordnungstabelle würde ungenannte Zuordnungen zwischen Gerät und Techniker behaupten."],"school":true,"level":3,"tag":"Unterricht","minutes":20,"focus":["Originalaufgabe","Schulnotation"],"extra":true},{"id":"u-avallon-base","title":"Aufgabe 07 / 3 · Drei Grundrelationen","source":"07","pages":[1,3],"text":"Übertragen Sie die Entitätstypen Mitarbeiter, Auftrag und Produkt aus dem ER-Modell in Relationen. Kennzeichnen Sie jeweils den Primärschlüssel.","model":{"entities":[{"id":"m","name":"Mitarbeiter","attrs":[{"name":"Mitarbeiter-ID","key":true,"optional":false,"aliases":[],"id":"m_a0"},{"name":"Name","key":false,"optional":false,"aliases":[],"id":"m_a1"},{"name":"Vorname","key":false,"optional":false,"aliases":[],"id":"m_a2"}],"aliases":[],"x":230,"y":260},{"id":"a","name":"Auftrag","attrs":[{"name":"Auftrags-ID","key":true,"optional":false,"aliases":[],"id":"a_a0"},{"name":"Auftragsdatum","key":false,"optional":false,"aliases":[],"id":"a_a1"}],"aliases":[],"x":810,"y":260},{"id":"p","name":"Produkt","attrs":[{"name":"Produkt-ID","key":true,"optional":false,"aliases":[],"id":"p_a0"},{"name":"Bezeichnung","key":false,"optional":false,"aliases":[],"id":"p_a1"},{"name":"Listenpreis","key":false,"optional":false,"aliases":[],"id":"p_a2"}],"aliases":[],"x":1390,"y":260}],"relations":[]},"notes":["Diese Teilaufgabe verlangt nur die drei Grundrelationen, noch keine Fremdschlüssel oder Zuordnungstabellen."],"school":true,"level":1,"tag":"Unterricht","minutes":20,"focus":["Originalaufgabe","Schulnotation"]}],"lessons":[{"id":"grundlagen","title":"Datenbank, DBMS und Datenbanksystem","short":"Was das System leistet und woraus es besteht.","source":"09 · S. 1–2","sections":[["Drei Begriffe, drei Bedeutungen","Die Datenbank ist die Datenbasis, also der gespeicherte Datenbestand. Das Datenbankmanagementsystem (DBMS) verwaltet die Daten und bildet die Schnittstelle zu den Anwendungen beziehungsweise Benutzern. Datenbasis und DBMS bilden zusammen das Datenbanksystem."],["Was eine Datenbank ausmacht","Ein Datenbanksystem speichert große Datenmengen. Es kann passende Daten nach Kriterien finden und gespeicherte Daten verändern. Verknüpfte Tabellen liefern zusammen zusätzliche Informationen, zum Beispiel die Artikelbezeichnungen zu einem Auftrag."],["Die Aufgaben aus deinem Blatt","Datendefinition: die Struktur aufbauen. Datenmanipulation: Datensätze eingeben, ändern und löschen. Gemeinsame Datenbasis: Daten einer Organisation zusammen verwalten. Datenabfrage: Informationen gewinnen. Datenkontrolle: Zugangs- und Zugriffsrechte prüfen. Datenübertragung: Daten sichern, exportieren und importieren."],["Operationen und Schema unterscheiden","Eine neue Tabelle anzulegen verändert die Struktur. Einen neuen Kunden in einer vorhandenen Tabelle zu speichern verändert die Daten. In der ergänzten Lösung der vier Leerstellen stehen INSERT, UPDATE, DELETE und SELECT. Diese Befehlsnamen sind ein eigener Lösungsvorschlag; im Arbeitsblatt selbst sind die Felder leer."]],"lab":"dbms","icon":"book","minutes":10,"subtitle":"Was das System leistet und woraus es besteht."},{"id":"phasen","title":"Die vier Entwicklungsphasen","short":"Informationsstruktur → ERM → Relationen → Schema.","source":"01–03","sections":[["1 · Informationsstruktur","Welche Informationen werden benötigt? Beschreibe den Informationsbedarf (Output) und ermittle die benötigten Eingabedaten (Input). Untersuche dafür die Vorgänge. Die Informationsstruktur beschreibt den für die Aufgabe wichtigen Realitätsausschnitt."],["2 · Semantisches Datenmodell","Beschreibe die Bedeutung der Daten mit Entitätstypen, Attributen und Beziehungen. Das ER-Modell ist ein formales Hilfsmittel dafür. Du zeichnest Rechtecke, Ellipsen und Rauten. Es ist unabhängig vom späteren Datenbanksystem."],["3 · Logisches beziehungsweise relationales Datenmodell","Überführe das ERM in Relationen: Kästen mit Namen, Attributen, Primär- und Fremdschlüsseln. Die Verbindungen verlaufen zwischen den zugehörigen Schlüsseln. Das ist noch der Bauplan, nicht die mit Datensätzen gefüllte Datenbank."],["4 · Datenbank-Schema / Implementierung","Übertrage den Entwurf mit einem DBMS und dessen Datendefinitionssprache in ein Schema aus Datenstruktur und Integritätsregeln. Nach deinem Unterrichtsblatt ist das Ergebnis zunächst eine leere Datenbank."],["Die Bezeichnungen aus deinem Unterricht","Die Übersicht ordnet die vier Schritte der externen, konzeptionellen, logischen und physischen Phase zu. Diese Zuordnung wird hier als Unterrichtsmodell wiedergegeben, nicht als zusätzliche, anders gegliederte Architekturbeschreibung."]],"lab":"phases","icon":"book","minutes":10,"subtitle":"Informationsstruktur → ERM → Relationen → Schema."},{"id":"entitaeten","title":"Entität, Entitätstyp und Attribut","short":"Ein konkretes Objekt ist nicht sein Bauplan.","source":"04 · S. 1; 06 · S. 1–2","sections":[["Entität","Eine Entität ist eine eindeutig identifizierbare Einheit. Beispiel: der konkrete Kunde mit Kunden-ID 3. Eine Entität kann eine Person, ein reales Objekt, ein abstraktes Konzept oder ein Ereignis sein."],["Entitätstyp und Entitätsmenge","Kunde ist der Entitätstyp: die gemeinsame Beschreibung gleichartiger Kunden. Die Entitätsmenge umfasst die konkreten Kunden. Deine Blätter verwenden teilweise Entität, Entitytyp und Entitätsmenge vereinfachend nebeneinander. Im Rechteck steht der Typname im Singular, zum Beispiel Kunde, nicht Kunden."],["Attribut und Attributwert","Name ist ein Attribut. „Bosch Automotive AG“ ist ein konkreter Attributwert. Im ERM steht Name in einer Ellipse. Der konkrete Firmenname gehört später in einen Datensatz. Ein Rechteck mit Bezeichnung wäre in dieser Aufgabe falsch: Bezeichnung ist eine Eigenschaft, kein eigener Entitätstyp."],["Beziehungsattribut","Menge je Auftrag und Produkt beschreibt nicht das Produkt allein. Dasselbe Produkt kann in Auftrag 70 in Menge 50 und in Auftrag 71 in Menge 120 vorkommen. Deshalb gehört Menge zur Beziehung enthält und später in die Zuordnungstabelle."]],"lab":"concepts","icon":"book","minutes":10,"subtitle":"Ein konkretes Objekt ist nicht sein Bauplan."},{"id":"beziehungen","title":"Welche Entitäten verbinde ich?","short":"Erst den fachlichen Zusammenhang finden. Dann zählen.","source":"03 · S. 2; 04 · S. 1–3; 06 · S. 3","sections":[["Nicht jedes Rechteck mit jedem verbinden","Suche eine Aussage darüber, welches einzelne Objekt welchem anderen Objekt zugeordnet ist. „Ein Kunde erteilt einen Auftrag“ begründet Kunde — erteilt — Auftrag. Dass Kunde und Produkt beide im Text stehen, begründet noch keine zusätzliche direkte Beziehung."],["Die Gegenprobe mit Datensätzen","Frage: Welche Zuordnung müsste ich speichern, damit ich später die geforderte Frage beantworten kann? Um „Wer erteilte Auftrag 70?“ zu beantworten, muss Auftrag 70 einem Kunden zugeordnet sein. Eine Verbindungslinie drückt genau diese fachliche Zuordnung aus."],["Ein Verb beschreibt die Beziehung","Im ERM steht die Beziehung in einer Raute und wird mit einem Verb beschrieben: erteilt, liefert, gehört zu, besucht. „Zuordnung“ ist im Fehlerblatt kein passendes Verb. „gehört zu“ beschreibt den Zusammenhang Artikel — Artikelgruppe."],["Gleiche Partner können verschiedene Beziehungen haben","Mitarbeiter arbeitet in Abteilung und Mitarbeiter leitet Abteilung bedeuten nicht dasselbe. Zeichne zwei Rauten. Prüfe für jede Beziehung beide Richtungen neu. Aus den beiden Beziehungen folgt nicht automatisch, dass jemand seine eigene Abteilung leitet."]],"lab":"connections","icon":"book","minutes":10,"subtitle":"Erst den fachlichen Zusammenhang finden. Dann zählen."},{"id":"kardinalitaeten","title":"Kardinalitäten ohne Seitenverwechslung","short":"Ein Objekt festhalten. Die andere Seite zählen.","source":"04 · S. 2; 06 · S. 2","sections":[["Frage 1: Genau EIN Kunde","Wie viele Aufträge darf dieser eine Kunde erteilen? Mehrere. Die Antwort n wird in deiner Unterrichtsschreibweise am Ziel der Frage notiert: bei Auftrag."],["Frage 2: Genau EIN Auftrag","Wie viele Kunden gehören zu diesem einen Auftrag? Genau einer. Die Antwort 1 wird bei Kunde notiert. Damit steht im Bild Kunde 1 — erteilt — n Auftrag."],["Erst beide Antworten ergeben den Typ","Je A höchstens ein B und je B höchstens ein A: 1:1. Je A mehrere B und je B ein A: A 1:n B. Je A ein B und je B mehrere A: A n:1 B. Auf beiden Seiten mehrere: m:n. Die Buchstaben m und n stehen beide für „mehrere“; sie müssen nicht denselben Zahlenwert haben."],["Immer die Regeln des Texts verwenden","Die aktuelle Anzahl gespeicherter Datensätze beweist keine allgemeine Obergrenze. Ein Kunde mit heute nur einem Auftrag kann trotzdem weitere Aufträge erteilen dürfen. „Kunde hat Ansprechpartner“ ist ohne zusätzliche Regel nicht eindeutig 1:1 oder 1:n."],["Optionalität ist ein Zusatz, kein Seitenwechsel","„Kann“ und „muss“ betreffen auch die Mindestteilnahme. Die Schulnotation 1/n/m zeigt vor allem die maximale Zuordnung. Die ältere Studioversion verwendete lokale Min-Max-Paare. Hier gilt standardmäßig die Schreibweise deiner Blätter. Min-Max bleibt ein klar gekennzeichneter Zusatz."],["Hinweis zu Blatt 04","Die allgemeine A/B-Beschreibung unter b) liest den Zusammenhang in der umgekehrten Richtung zum Kundenbeispiel. Für deine Zeichnung sind die beiden konkreten Sätze und der Hinweis zur Sprechweise entscheidend: Kunde 1:n Auftrag; rückwärts Auftrag n:1 Kunde. Das unveränderte Blatt bleibt im Quellenarchiv erhalten."]],"lab":"direction","icon":"book","minutes":10,"subtitle":"Ein Objekt festhalten. Die andere Seite zählen."},{"id":"schluessel","title":"Natürliche, künstliche und zusammengesetzte Schlüssel","short":"Erst Eindeutigkeit prüfen, dann die Schlüsselart.","source":"07 · S. 2–3","sections":[["Was ein Primärschlüssel leistet","Ein Primärschlüssel identifiziert jeden Datensatz eindeutig. In deinem Entwurf besitzt jede Relation genau einen Primärschlüssel. Dieser kann aus einer oder mehreren Spalten bestehen. Kein Teil dieses Schlüssels darf fehlen. Der Wert sollte möglichst stabil bleiben."],["Natürlich oder künstlich?","Ein natürlicher Schlüssel ist fachlich schon vorhanden, zum Beispiel die Fahrgestellnummer (FIN) eines Fahrzeugs. „Natürlich“ bedeutet nicht, dass Menschen ihn nie vergeben haben. Eine zusätzliche Kunden-ID wird nur für die Identifikation im System eingeführt: ein künstlicher Schlüssel."],["Einfach oder zusammengesetzt?","Das ist eine zweite Frage. Ein zusammengesetzter Schlüssel besteht aus mehreren Attributen gemeinsam. In Auftragsposition bilden Auftrags-ID und Produkt-ID zusammen genau einen Primärschlüssel. Ein einzelner Auftrag und ein einzelnes Produkt dürfen sich wiederholen; das vollständige Paar nicht."],["Warum Name + Vorname nicht reicht","Name und Vorname sind eine Kombination aus zwei Attributen. Als Schlüsselvorschlag wäre das zusammengesetzt. Aber verschiedene Personen können denselben vollständigen Namen haben. Ohne garantierte Eindeutigkeit ist die Kombination kein geeigneter Primärschlüssel. Mehrere Attribute allein machen noch keinen gültigen Schlüssel."],["Arten und Eignung nicht verwechseln","Kennzeichen ist ein natürliches Merkmal im Fahrzeugmodell, aber nicht unbedingt dauerhaft stabil. Eine Personalausweisnummer beschreibt ein bestimmtes Dokument; als dauerhafter Schlüssel einer Person ist sie problematisch. Diese Beurteilungen sind Lösungsvorschläge zur offenen Aufgabe 2, keine mitgelieferte Musterlösung."]],"lab":"keys2","icon":"book","minutes":10,"subtitle":"Erst Eindeutigkeit prüfen, dann die Schlüsselart."},{"id":"lesen","title":"ERM und Relationen richtig zeichnen","short":"Gleiche Formen und Schlüsselzeichen wie auf dem Blatt.","source":"04 · S. 1; 07 · S. 1–4","sections":[["Semantisches Modell: drei Formen","Entitätstyp = Rechteck. Attribut = Ellipse. Beziehung = Raute. Verbinde Attribute mit ihrem Entitätstyp und die Raute mit den beteiligten Typen. Schreibe die Typnamen im Singular und die Beziehungsnamen als Verben. Unterstreiche ausdrücklich festgelegte Schlüsselattribute."],["Relationales Modell: Kästen statt Ellipsen","Oben steht der Relationsname, darunter stehen die Attribute untereinander. Trenne den Namen mit einer waagerechten Linie von den Attributen. Unterstreiche den Namen des Primärschlüsselattributs und ergänze (PS)."],["Fremdschlüssel sichtbar kennzeichnen","Ergänze (FS) hinter dem Fremdschlüssel. Verbinde genau seine Zeile mit der referenzierten Primärschlüsselzeile. Eine beliebige Linie zwischen den Kastenrändern reicht für die verlangte Zeichnung nicht. Bei 1:n steht die 1 am referenzierten PS und das n am FS."],["Der zusammengesetzte Primärschlüssel","In einer Zuordnungstabelle unterstreichst du beide zum Schlüssel gehörenden Attribute. Hinter jedem steht (PS, FS), weil es Teil des gemeinsamen Primärschlüssels und zugleich ein Fremdschlüssel ist. Es sind nicht zwei voneinander unabhängige Primärschlüssel."]],"lab":"drawing","icon":"book","minutes":10,"subtitle":"Gleiche Formen und Schlüsselzeichen wie auf dem Blatt."},{"id":"relationen","title":"1:n und 1:1 in Relationen überführen","short":"Die Schlüsselverbindung ersetzt die Raute.","source":"07 · S. 3–7","sections":[["Regel 1: Grundkästen zeichnen","Jeder Entitätstyp wird eine Relation. Übernimm die Attribute und markiere den festgelegten Primärschlüssel. In der Implementierung werden daraus Tabellen und Spalten."],["Regel 2: Bei 1:n steht der FS auf der n-Seite","Kunde 1:n Auftrag: Kopiere Kunden-ID aus Kunde in Auftrag. In Auftrag ist diese Spalte ein Fremdschlüssel. Warum dort? Jeder Auftrag gehört genau einem Kunden, also genügt ein Kundenwert pro Auftragszeile."],["Warum die andere Seite falsch wäre","Eine Auftrags-ID im Kundenkasten müsste für einen Kunden mit 50 Aufträgen 50 Werte aufnehmen. Eine Liste in einer Zelle oder 50 durchnummerierte Auftragsspalten entspricht nicht der geforderten relationalen Darstellung."],["Regel 4: 1:1 braucht einen eindeutigen FS","Kopiere den Primärschlüssel einer Seite als Fremdschlüssel in die andere. Jeder Fremdschlüsselwert darf dort höchstens einmal vorkommen. Bei Kunde — Login-Zugang steht in der Vorlage Kunden-ID (FS) in Login-Zugang."],["Keine unnötigen Rückverweise","Bei 1:n brauchst du nicht in beiden Tabellen einen Fremdschlüssel für dieselbe Beziehung. Auch eine 1:1-Beziehung braucht nicht zwei entgegengesetzte Referenzen. Getrennte Beziehungen zwischen denselben Typen sind ein anderer Fall."]],"lab":"oneMany","icon":"book","minutes":10,"subtitle":"Die Schlüsselverbindung ersetzt die Raute."},{"id":"mn","title":"m:n sicher auflösen","short":"Zwei Grundrelationen, eine Zuordnung, zwei Verbindungen.","source":"07 · S. 5–6; 08 Lösung · S. 1–3","sections":[["Warum ein einzelner Fremdschlüssel nicht genügt","Ein Auftrag enthält mehrere Produkte. Ein Produkt kommt in mehreren Aufträgen vor. Produkt-ID in Auftrag würde entweder mehrere Produkte in eine Zelle drängen oder den Auftrag samt Datum und Kunde wiederholen. Die umgekehrte Richtung hätte dasselbe Problem mit Produktdaten."],["Die Zuordnungstabelle speichert das Paar","Ergänze Auftragsposition. Sie enthält Auftrags-ID und Produkt-ID als Fremdschlüssel. Beide zusammen bilden den zusammengesetzten Primärschlüssel. Die Originalaufgabe setzt voraus, dass ein Produkt je Auftrag nur einmal als Position vorkommt."],["Das m:n wird zu zwei 1:n-Beziehungen","Ein Auftrag hat mehrere Auftragspositionen; jede Position gehört genau einem Auftrag. Ein Produkt kommt in mehreren Auftragspositionen vor; jede Position nennt genau ein Produkt. Die n-Seiten zeigen beide zur Zuordnungstabelle."],["Beziehungsattribute gehören zum Paar","Menge gehört in Auftragsposition. Anmeldedatum gehört in Kursanmeldung. Frühstück gehört in Buchungsposition. Frage immer: Kann der Wert bei gleichem Objekt A, aber anderem Objekt B unterschiedlich sein? Und bei gleichem B, aber anderem A? Dann beschreibt er die Kombination."],["Konkrete Kontrolle mit 70 | 2","Die Zeile Auftrag 70, Produkt 2, Menge 50 darf einmal vorkommen. Werden zehn weitere Stück für dieselbe Position bestellt, wird Menge auf 60 erhöht. Es entsteht keine zweite Zeile mit demselben Schlüssel 70 | 2."]],"lab":"mnlab","icon":"book","minutes":10,"subtitle":"Zwei Grundrelationen, eine Zuordnung, zwei Verbindungen."},{"id":"text","title":"Vom Sachtext zum fertigen Modell","short":"Eine feste Routine für beide Prüfungsaufgaben.","source":"06 · S. 2–3; 07 · S. 7; 08 · S. 3","sections":[["Schritt 1: Gegenstände und Vorgänge sammeln","Markiere Entitätstypen und ordne alle genannten Attribute zu. Ein Preis ist meist ein Attribut, kein eigener Typ. Ein Mietvertrag ist ein eigener Vorgang mit Nummer und Zeiten. Notiere fehlende Angaben als offene Punkte."],["Schritt 2: Beziehungen mit zwei Sätzen begründen","Für jede Raute: Ein A kann mit wie vielen B zusammenhängen? Ein B kann mit wie vielen A zusammenhängen? Notiere jede Antwort am gegenüberliegenden Ende der Linie."],["Schritt 3: Gewünschte Darstellungsart beachten","Für ein semantisches Modell zeichnest du Rechtecke, Ellipsen und Rauten. Für das relationale Modell zeichnest du Grundrelationen, dann Fremdschlüssel, dann die Zuordnungstabellen. Im relationalen Modell bleiben keine m:n-Rauten stehen."],["Schritt 4: Schlüssel und Eigenschaften prüfen","Jeder Grundkasten braucht den passenden PS. Jede m:n-Zuordnung braucht beide Referenzen und den gemeinsamen PS. Ergänze Eigenschaften der Beziehung genau dort. Zeichne Verbindungen von Schlüsselzeile zu Schlüsselzeile."],["Schritt 5: Satz für Satz rückwärts prüfen","Kann dein Modell alle Angaben des Texts speichern? Erlaubt es ungewollt mehrere Partner auf einer Einserseite? Fehlen Eigenschaften? Hast du zusätzliche Regeln erfunden? Eine begründete Annahme muss als Annahme sichtbar sein."]],"lab":"routine","icon":"book","minutes":10,"subtitle":"Eine feste Routine für beide Prüfungsaufgaben."},{"id":"fehler","title":"Fehler erkennen und begründen","short":"Nicht nur verbessern, sondern die Auswirkung erklären.","source":"06 · S. 1; 08 · S. 1","sections":[["Fünf ERM-Fehler aus dem Praktikantenentwurf","Lieferanten ist Plural statt Singular. Bosch Automotive AG ist ein Attributwert statt des Attributnamens Name. Bezeichnung ist als Rechteck statt als Ellipse gezeichnet. liefert wurde als 1:n statt m:n modelliert. Zuordnung ist ein Substantiv statt eines Beziehungsverbs."],["Drei Fehler im relationalen Entwurf","Lieferant-ID direkt in Artikel bildet m:n nicht ab: die Zuordnungstabelle fehlt. Artikel-ID in Artikelgruppe steht auf der falschen Seite: Gruppen-ID gehört als FS in Artikel. Gruppen-ID ist in Artikelgruppe nicht als PS markiert."],["Die beste Fehlerbegründung nennt die Folge","Schreibe nicht nur „FS falsch“. Schreibe: „Lieferant-ID in Artikel erlaubt je Artikel nur einen Lieferanten. Der Text erlaubt mehrere Lieferanten. Deshalb wird Lieferant_Artikel benötigt.“"],["Vier letzte Kontrollen","Keine Attributwerte im ERM. Keine Listen in einer Fremdschlüsselzelle. Kein fehlender Teil eines zusammengesetzten PS. Keine vertauschten 1/n-Enden. Prüfe die fachliche Regel, nicht nur die Form."]],"lab":"errors","icon":"book","minutes":10,"subtitle":"Nicht nur verbessern, sondern die Auswirkung erklären."},{"id":"komplex","title":"Komplexe Fälle und zwei Carsharing-Varianten","short":"Ähnliche Wörter können unterschiedliche Regeln meinen.","source":"06 · S. 3; 08 · S. 1–4; 10 · S. 1–2","sections":[["Fester Parkplatz: 1:1","In Blatt 06 steht ausdrücklich: Jedes Fahrzeug hat genau einen festen Parkplatz und jeder Parkplatz ist genau einem Fahrzeug zugeordnet. Die relationale Musterlösung ergänzt Parkplatz-Nr. als eindeutigen Fremdschlüssel in Fahrzeug."],["Standort mit vielen Parkzellen: 1:n","Blatt 10 verwendet Standort mit vielen Parkzellen. Die Rückseitenlösung zeigt Standort 1:n Fahrzeug und verwendet beim Standort das Attribut Parkplatz-ID. Diese Originalbezeichnung bleibt erhalten, auch wenn sie anders klingt als in Blatt 06."],["Zwei m:n-Beziehungen getrennt auflösen","Ein Auftrag kann mehrere Geräte enthalten und mehrere Techniker einsetzen. Daraus entstehen zwei Zuordnungstabellen: Auftragsposition für Auftrag/Gerät/Menge und Einsatz für Auftrag/Techniker/Stunden. Eine gemeinsame Dreiertabelle würde zusätzliche Zuordnungen zwischen Geräten und Technikern behaupten. Das ist eine ergänzende Trainingsaufgabe."],["Wiederholung eines Vorgangs ist ein anderes Modell","Ein Paar aus Patient und Arzt kann mehrfach auftreten. Soll jede einzelne Behandlung gespeichert werden, braucht der Vorgang eine eigene Identifikation, zum Beispiel Behandlungs-Nr. Das ist eine Modellierungsentscheidung der offenen Praxisaufgabe, nicht eine neue Regel der originalen m:n-Auftragsposition."]],"lab":"compare","icon":"book","minutes":10,"subtitle":"Ähnliche Wörter können unterschiedliche Regeln meinen."}],"tasks":[{"id":"03-regeln","title":"Informationsstruktur: Regeln formulieren","source":"03","pages":[1,2],"prompt":"<p>Regeln für die Beschreibung der Informationsstruktur:<\/p><p>Die Situation „Auftragsverwaltung der AVALLON AG“ und die mögliche Informationsstruktur stehen auf den Originalseiten. Nutze die freie Fläche für Regeln zur Beschreibung.<\/p>","solution":"<p><strong>Eigener Lösungsvorschlag zu den leeren Zeilen:<\/strong> Beschreibe zuerst, was das System ausgeben soll. Ermittle dann die dafür benötigten Eingaben. Beschreibe relevante Objekte mit ihren benötigten Eigenschaften. Formuliere Zuordnungen in ganzen Sätzen und in beiden Leserichtungen. Trenne allgemeine Feststellungen, Kunden, Produkte und Aufträge wie im Beispiel auf Seite 2.<\/p><p>Beispiel: Ein Kunde wird von einem zugeordneten Mitarbeiter betreut. Ein Kunde erteilt im Laufe der Zeit mehrere Aufträge. Ein bestimmter Auftrag stammt immer von einem Kunden. Ein Auftrag kann ein oder mehrere Produkte enthalten.<\/p><p>Eine Rechnung ist ein gewünschter Output. Kundennummer, Auftragsnummer, Produktdaten und Mengen sind dafür benötigte Eingaben. Die ausführliche zweite Originalseite bleibt unverändert verfügbar.<\/p>","scenario":null,"kind":"text","hints":["Lies den Text zunächst ohne zu zeichnen.","Prüfe jede Beziehung in beiden Leserichtungen.","Kontrolliere anschließend Schlüssel, Attribute und alle Verbindungen."],"rubric":["Input und Output unterschieden.","Die Gliederung der Original-Informationsstruktur beachtet.","Keine zusätzlichen Maximalzuordnungen als Vorgabe ausgegeben."],"provided":null,"fields":[],"extra":false},{"id":"04-formen","title":"Grundformen und Begriffe ergänzen","source":"04","pages":[1],"prompt":"<p>Ergänzungen zu den Abbildungen unter „1. Entität“, „2. Attribute (Eigenschaften)“ und „3. Beziehungen zwischen Entitäten (Relationship)“. Die Originalseite enthält die unbeschrifteten Formen.<\/p>","solution":"<p>Rechteck: <strong>Kunde<\/strong>. Die fünf Ellipsen am Kunden: <strong>Kundennummer, Name, Straße, Postleitzahl, Ort<\/strong>. Die Raute zwischen Kunde und Auftrag: <strong>erteilt<\/strong>.<\/p><p>Kunde bezeichnet den Entitätstyp. „Bosch AG“ wäre ein konkreter Attributwert und gehört nicht als Attributname in die Ellipse.<\/p>","scenario":null,"kind":"fields","hints":["Lies den Text zunächst ohne zu zeichnen.","Prüfe jede Beziehung in beiden Leserichtungen.","Kontrolliere anschließend Schlüssel, Attribute und alle Verbindungen."],"rubric":["Alle Teilfragen beantwortet.","Begründung mit der Aufgabenregel verknüpft.","Darstellung mit der Lösung verglichen."],"provided":null,"fields":[{"key":"rect","label":"Rechteck: Entitätstyp","answer":"Kunde","options":null,"explain":""},{"key":"diamond","label":"Raute zwischen Kunde und Auftrag","answer":"erteilt","options":null,"explain":""},{"key":"ellipse","label":"Form für Attribute","answer":"Ellipse","options":["Rechteck","Ellipse","Raute"],"explain":""}],"extra":false},{"id":"04-kard","title":"Drei Beziehungstypen aus dem Unterricht","source":"04","pages":[2],"prompt":"<p>Arbeitsauftrag: Lesen Sie sich in die Theorie zu den Kardinalitäten ein und erstellen Sie anhand der Informationsstruktur das ER-Modell mit den entsprechenden Kardinalitäten.<\/p><div class=\"table-wrap\"><table><thead><tr><th>Beispiel<\/th><th>Originalaussagen<\/th><\/tr><\/thead><tbody><tr><td>Kunde / Login-Zugang<\/td><td>Ein Kunde verfügt über genau einen Login-Zugang. Ein Login-Zugang ist genau einem Kunden zugeordnet.<\/td><\/tr><tr><td>Kunde / Auftrag<\/td><td>Ein Kunde kann im Laufe der Zeit mehrere Aufträge erteilen. Ein Auftrag wird aber immer von einem bestimmten Kunden erteilt.<\/td><\/tr><tr><td>Auftrag / Produkt<\/td><td>Ein Auftrag enthält in der Regel mehrere Produkte. Ein Produkt ist jedoch in mehreren Aufträgen enthalten.<\/td><\/tr><\/tbody><\/table><\/div>","solution":"<p>Kunde <strong>1:1<\/strong> Login-Zugang. Kunde <strong>1:n<\/strong> Auftrag. Auftrag <strong>m:n<\/strong> Produkt.<\/p><p><strong>Die Platzierung ist entscheidend:<\/strong> Beim Lesen von Kunde zu Auftrag lautet die Antwort „mehrere Aufträge“. Das n steht deshalb bei Auftrag. Rückwärts lautet die Antwort „ein Kunde“. Die 1 steht bei Kunde.<\/p>","scenario":null,"kind":"fields","hints":["Lies den Text zunächst ohne zu zeichnen.","Prüfe jede Beziehung in beiden Leserichtungen.","Kontrolliere anschließend Schlüssel, Attribute und alle Verbindungen."],"rubric":["Alle Teilfragen beantwortet.","Begründung mit der Aufgabenregel verknüpft.","Darstellung mit der Lösung verglichen."],"provided":null,"fields":[{"key":"a","label":"Kunde → Login-Zugang","answer":"1:1","options":["1:1","1:n","n:1","m:n"],"explain":""},{"key":"b","label":"Kunde → Auftrag","answer":"1:n","options":["1:1","1:n","n:1","m:n"],"explain":""},{"key":"c","label":"Auftrag → Produkt","answer":"m:n","options":["1:1","1:n","n:1","m:n"],"explain":""}],"extra":false},{"id":"04-a","title":"5a · Kunde, Auftrag, Mitarbeiter und Produkt","source":"04","pages":[3],"prompt":"<p>Ein Kunde kann im Laufe der Zeit mehrere Aufträge erteilen. Ein Auftrag ist aber immer einem bestimmten Kunden zugeordnet. Dabei wird ein Kunde immer von einem Mitarbeiter (Key-Account-Manager) betreut, während ein Mitarbeiter jedoch meist für mehrere Kunden zuständig ist. Ein Auftrag enthält in der Regel mehrere Produkte. Ein Produkt kann aber in mehreren Aufträgen vorkommen. Die Relation Produkt soll als Attribute unter anderem die Produkt-ID, die Bezeichnung, den Listenverkaufspreis sowie die Tagesproduktion in Stück enthalten.<\/p>","solution":"<p>Die Originalvorlage wird mit den folgenden Typen, Beziehungen und Attributen ergänzt. Nicht genannte Attribute werden nicht stillschweigend hinzugefügt.<\/p>{{erm:u-04a}}{{readings:u-04a}}<div class=\"callout \">Diese Teilaufgabe nennt nur die Produktattribute. Für die anderen Entitätstypen werden hier keine erfundenen Schlüssel gefordert. Für eine zusätzliche relationale Umsetzung müsstest du Identifikatoren ergänzen und diese als Annahme kennzeichnen.<\/div>","scenario":"u-04a","kind":"erm","hints":["Lies den Text zunächst ohne zu zeichnen.","Prüfe jede Beziehung in beiden Leserichtungen.","Kontrolliere anschließend Schlüssel, Attribute und alle Verbindungen."],"rubric":["Alle vier Rechtecke richtig benannt.","Drei Beziehungen mit passenden Verben vorhanden.","Beide Kardinalitäten je Beziehung begründet.","Nur die vorgegebenen Attribute oder ausdrücklich begründete Ergänzungen verwendet."],"provided":null,"fields":[],"extra":false},{"id":"04-b","title":"5b · Lieferant, Rahmenvertrag und Artikelgruppe","source":"04","pages":[3],"prompt":"<p>Mit jedem Lieferanten wird ein individueller Rahmenvertrag abgeschlossen, in dem die Höhe des Rabatts, die Lieferbedingung sowie die Zahlungsbedingung festgelegt sind (Attribute). Die Lieferanten liefern ein oder mehrere Artikel, wobei ein Artikel von einem oder von mehreren Lieferanten bezogen werden kann. Ein Artikel ist einer Artikelgruppe zugeordnet, wobei eine Artikelgruppe mehrere Artikel umfasst. Di
