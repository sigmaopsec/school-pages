e Artikelgruppe ist durch die Eigenschaften Artikelgruppe-ID, die Gruppenbezeichnung sowie durch den zuständigen Einkäufer (Mitarbeiter) eindeutig identifizierbar.<\/p>","solution":"<p>Die Originalvorlage wird mit den folgenden Typen, Beziehungen und Attributen ergänzt. Nicht genannte Attribute werden nicht stillschweigend hinzugefügt.<\/p>{{erm:u-04b}}{{readings:u-04b}}<div class=\"callout \">Die 1:1-Zuordnung setzt wie die vorgedruckte Struktur einen individuellen Rahmenvertrag je Lieferant voraus.<\/div><div class=\"callout \">Die Vorlage sieht Einkäufer als Attribut der Artikelgruppe vor. Ein eigener Entitätstyp Mitarbeiter wäre eine begründete Erweiterung, nicht die unveränderte Grundlösung.<\/div><div class=\"callout \">Zusätzliche IDs für Lieferant, Artikel und Rahmenvertrag stehen nicht im Text und werden im ERM dieser Teilaufgabe nicht erzwungen.<\/div>","scenario":"u-04b","kind":"erm","hints":["Lies den Text zunächst ohne zu zeichnen.","Prüfe jede Beziehung in beiden Leserichtungen.","Kontrolliere anschließend Schlüssel, Attribute und alle Verbindungen."],"rubric":["Alle vier Rechtecke richtig benannt.","Drei Beziehungen mit passenden Verben vorhanden.","Beide Kardinalitäten je Beziehung begründet.","Nur die vorgegebenen Attribute oder ausdrücklich begründete Ergänzungen verwendet."],"provided":null,"fields":[],"extra":false},{"id":"05-1","title":"Aufgabe 1 · Kardinalitäten ermitteln","source":"05","pages":[1],"prompt":"<p>Ermitteln Sie die Kardinalitäten der Beziehungen!<\/p><div class=\"table-wrap\"><table><thead><tr><th>Entitätstyp 1<\/th><th>Beziehung<\/th><th>Entitätstyp 2<\/th><\/tr><\/thead><tbody><tr><td>Person<\/td><td>hält<\/td><td>Pkw<\/td><\/tr><tr><td>Mann<\/td><td>ist verheiratet<\/td><td>Frau<\/td><\/tr><tr><td>Person<\/td><td>spricht<\/td><td>Sprache<\/td><\/tr><tr><td>Person<\/td><td>besitzt<\/td><td>EC-Karte<\/td><\/tr><tr><td>Person<\/td><td>nimmt<\/td><td>Kurs<\/td><\/tr><\/tbody><\/table><\/div>","solution":"<div class=\"callout \">Die Aufgabe nennt nur Begriffe. Die folgenden Antworten verwenden ausdrücklich vereinfachende Annahmen. Die Aufgabenwörter allein bestimmen nicht alle Geschäftsregeln.<\/div><div class=\"table-wrap\"><table><thead><tr><th>Beziehung<\/th><th>Typ<\/th><th>Beide Richtungen / Annahme<\/th><\/tr><\/thead><tbody><tr><td>Person hält Pkw<\/td><td>1:n<\/td><td>Eine Person kann mehrere Pkw halten. Ein Pkw hat im vereinfachten Modell einen Halter.<\/td><\/tr><tr><td>Mann ist verheiratet mit Frau<\/td><td>1:1<\/td><td>Annahme: nur eine aktuelle Ehe je Person wird betrachtet, keine Ehehistorie.<\/td><\/tr><tr><td>Person spricht Sprache<\/td><td>m:n<\/td><td>Eine Person kann mehrere Sprachen sprechen. Eine Sprache wird von mehreren Personen gesprochen.<\/td><\/tr><tr><td>Person besitzt EC-Karte<\/td><td>1:n<\/td><td>Annahme: Eine Person kann mehrere Karten besitzen; jede konkrete Karte ist einer Person zugeordnet.<\/td><\/tr><tr><td>Person nimmt Kurs<\/td><td>m:n<\/td><td>Eine Person kann mehrere Kurse nehmen. Ein Kurs hat mehrere Teilnehmer.<\/td><\/tr><\/tbody><\/table><\/div>","scenario":null,"kind":"fields","hints":["Lies den Text zunächst ohne zu zeichnen.","Prüfe jede Beziehung in beiden Leserichtungen.","Kontrolliere anschließend Schlüssel, Attribute und alle Verbindungen."],"rubric":["Vereinfachende Annahmen ausdrücklich genannt.","Jede Beziehung in beide Richtungen gelesen."],"provided":null,"fields":[{"key":"0","label":"Person → Pkw","answer":"1:n","options":["1:1","1:n","n:1","m:n"],"explain":""},{"key":"1","label":"Mann → Frau","answer":"1:1","options":["1:1","1:n","n:1","m:n"],"explain":""},{"key":"2","label":"Person → Sprache","answer":"m:n","options":["1:1","1:n","n:1","m:n"],"explain":""},{"key":"3","label":"Person → EC-Karte","answer":"1:n","options":["1:1","1:n","n:1","m:n"],"explain":""},{"key":"4","label":"Person → Kurs","answer":"m:n","options":["1:1","1:n","n:1","m:n"],"explain":""}],"extra":false},{"id":"05-2","title":"Aufgabe 2 · Wortbausteine einsetzen","source":"05","pages":[1],"prompt":"<p>Füllen Sie das abgebildete Beziehungsmodell mit folgenden Begriffen aus: Schüler, Religion, Schuljahr, Klasse, Name, Vorname, 1. Fremdsprache, gehört zu, Klassenkürzel, Geburtsdatum. (Hinweis: das vorgedruckte Modell kann erweitert werden)<\/p>","solution":"{{erm:u-schueler}}<div class=\"callout \">Möglicher Lösungsvorschlag: Religion, Name, Vorname, Geburtsdatum und 1. Fremdsprache beschreiben Schüler. Klassenkürzel und Schuljahr beschreiben Klasse.<\/div><div class=\"callout \">Die Zuordnung der 1. Fremdsprache kann bei einheitlichen Klassenregeln abweichen. Begründe deine Annahme. Die Aufgabe gibt keine Schlüssel und keine schuljahresübergreifende Historie vor.<\/div><div class=\"callout \">Für das dargestellte Schuljahr wird angenommen: ein Schüler gehört genau einer Klasse an. Ein Verlauf über mehrere Schuljahre benötigt ein erweitertes Modell.<\/div>{{readings:u-schueler}}","scenario":"u-schueler","kind":"erm","hints":["Lies den Text zunächst ohne zu zeichnen.","Prüfe jede Beziehung in beiden Leserichtungen.","Kontrolliere anschließend Schlüssel, Attribute und alle Verbindungen."],"rubric":["Die verlangten Begriffe oder fachlich begründeten Typen verwendet.","Attribute und Attributwerte unterschieden.","Annahmen genannt; offene Aufgabe nicht als einzige mögliche Lösung behandelt."],"provided":null,"fields":[],"extra":false},{"id":"05-3","title":"Aufgabe 3 · Gemeinschaftspraxis","source":"05","pages":[1],"prompt":"<p>Sie sollen eine Datenbank für eine Arztpraxis entwerfen. Dabei handelt es sich um eine Gemeinschaftspraxis, d.h. es arbeiten verschiedene Ärzte in den gleichen Räumlichkeiten. Erstellen Sie hierzu ein denkbares ERM.<\/p>","solution":"{{erm:u-praxis-offen}}<div class=\"callout \">Eigener Lösungsvorschlag, nicht vorgegeben: Eine Behandlung betrifft genau einen Patienten und einen Arzt. Beide können im Laufe der Zeit viele Behandlungen haben.<\/div><div class=\"callout \">Sämtliche genannten Attribute und diese Detailregeln sind Modellierungsannahmen. Andere begründete ER-Modelle sind ebenfalls möglich.<\/div><div class=\"callout \">Behandlung besitzt eine eigene Nummer, damit derselbe Patient denselben Arzt wiederholt besuchen kann. Die automatische Strukturprüfung vergleicht nur mit diesem einen Vorschlag.<\/div>{{readings:u-praxis-offen}}","scenario":"u-praxis-offen","kind":"erm","hints":["Lies den Text zunächst ohne zu zeichnen.","Prüfe jede Beziehung in beiden Leserichtungen.","Kontrolliere anschließend Schlüssel, Attribute und alle Verbindungen."],"rubric":["Die verlangten Begriffe oder fachlich begründeten Typen verwendet.","Attribute und Attributwerte unterschieden.","Annahmen genannt; offene Aufgabe nicht als einzige mögliche Lösung behandelt."],"provided":null,"fields":[],"extra":false},{"id":"06-start","title":"Einstieg · Die fünf ERM-Fehler","source":"06","pages":[1,2],"prompt":"<p>Die Avallon AG bezieht ihre Artikel von Lieferanten. Ein Lieferant liefert mehrere Artikel, ein Artikel kann von mehreren Lieferanten geliefert werden. Jeder Artikel gehört zu genau einer Artikelgruppe, eine Artikelgruppe umfasst mehrere Artikel. Gespeichert werden zu jedem Lieferanten die Lieferant-ID, der Name und der Ort, zu jedem Artikel die Artikel-ID, die Bezeichnung und der Lagerbestand und zu jeder Artikelgruppe die Gruppen-ID und die Gruppenbezeichnung.<\/p><p>Leon, Praktikant bei der Infotech GmbH, hat dazu folgendes ER-Modell gezeichnet:<\/p><p>Arbeitsauftrag: Das Modell enthält fünf Fehler. Markieren Sie die Fehler im Diagramm und tragen Sie sie in die Tabelle ein.<\/p>{{image:06-1}}","solution":"<div class=\"table-wrap\"><table><thead><tr><th>Nr.<\/th><th>Fehler<\/th><th>Korrektur und Grund<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Lieferanten im Rechteck<\/td><td>Lieferant. Ein Entitätstyp wird im Singular bezeichnet.<\/td><\/tr><tr><td>2<\/td><td>Bosch Automotive AG als Attribut<\/td><td>Name. Der Firmenname ist ein Attributwert, nicht der Name des Merkmals.<\/td><\/tr><tr><td>3<\/td><td>Bezeichnung im Rechteck<\/td><td>Eine Ellipse verwenden. Bezeichnung beschreibt Artikel.<\/td><\/tr><tr><td>4<\/td><td>1:n bei liefert<\/td><td>m:n: Ein Artikel kann von mehreren Lieferanten geliefert werden.<\/td><\/tr><tr><td>5<\/td><td>Zuordnung in der Raute<\/td><td>gehört zu. Der Beziehungstyp wird mit einem Verb bezeichnet.<\/td><\/tr><\/tbody><\/table><\/div>{{erm:u-einkauf}}<div class=\"callout \">Das sind die fünf Fehler nach den Kriterien der Checkliste. Die hier ergänzte Unterstreichung der ID-Attribute ist eine Schlüsselhilfe, nicht ein zusätzlicher sechster Fehler der Aufgabenstellung.<\/div>","scenario":"u-einkauf","kind":"errors","hints":["Lies den Text zunächst ohne zu zeichnen.","Prüfe jede Beziehung in beiden Leserichtungen.","Kontrolliere anschließend Schlüssel, Attribute und alle Verbindungen."],"rubric":["Alle fünf Fehler genannt.","Die falsche Kardinalität mit einer konkreten Textregel begründet."],"provided":null,"fields":[],"extra":false},{"id":"06-1","title":"Aufgabe 1 · Bestimmen und begründen","source":"06","pages":[2],"prompt":"<p>Bestimmen Sie die Kardinalität der Beziehung und begründen Sie sie in beiden Leserichtungen („Ein … – mehrere …“). Gehen Sie von den Verhältnissen der Avallon AG bzw. der E-Drive GmbH aus.<\/p><div class=\"table-wrap\"><table><thead><tr><th><\/th><th>Entitätstyp 1<\/th><th>Beziehung<\/th><th>Entitätstyp 2<\/th><\/tr><\/thead><tbody><tr><td>a)<\/td><td>Mitarbeiter<\/td><td>besitzt<\/td><td>Werksausweis<\/td><\/tr><tr><td>b)<\/td><td>Kunde<\/td><td>erteilt<\/td><td>Auftrag<\/td><\/tr><tr><td>c)<\/td><td>Auftrag<\/td><td>enthält<\/td><td>Produkt<\/td><\/tr><tr><td>d)<\/td><td>Abteilung<\/td><td>beschäftigt<\/td><td>Mitarbeiter<\/td><\/tr><tr><td>e)<\/td><td>Fahrzeug<\/td><td>steht auf<\/td><td>Parkplatz (jeder Parkplatz hat eine Ladesäule für genau ein Fahrzeug)<\/td><\/tr><tr><td>f)<\/td><td>Mitarbeiter<\/td><td>besucht<\/td><td>Fortbildung<\/td><\/tr><\/tbody><\/table><\/div><p>g) Kunde – hat – Ansprechpartner: Begründen Sie, warum hier sowohl 1:1 als auch 1:n richtig sein kann. Woran erkennen Sie, welche Lösung gilt?<\/p>","solution":"<div class=\"table-wrap\"><table><thead><tr><th>Teil<\/th><th>Typ<\/th><th>Begründung<\/th><\/tr><\/thead><tbody><tr><td>a<\/td><td>1:1<\/td><td>Ein Mitarbeiter besitzt einen Werksausweis. Ein Werksausweis gehört einem Mitarbeiter.<\/td><\/tr><tr><td>b<\/td><td>1:n<\/td><td>Ein Kunde erteilt mehrere Aufträge. Ein Auftrag stammt von einem Kunden.<\/td><\/tr><tr><td>c<\/td><td>m:n<\/td><td>Ein Auftrag enthält mehrere Produkte. Ein Produkt kommt in mehreren Aufträgen vor.<\/td><\/tr><tr><td>d<\/td><td>1:n<\/td><td>Eine Abteilung beschäftigt mehrere Mitarbeiter. Ein Mitarbeiter arbeitet in einer Abteilung.<\/td><\/tr><tr><td>e<\/td><td>1:1<\/td><td>Ein Fahrzeug steht auf einem festen Parkplatz. Der betrachtete Parkplatz ist für genau ein Fahrzeug vorgesehen.<\/td><\/tr><tr><td>f<\/td><td>m:n<\/td><td>Ein Mitarbeiter besucht mehrere Fortbildungen. Eine Fortbildung wird von mehreren Mitarbeitern besucht.<\/td><\/tr><\/tbody><\/table><\/div><p><strong>g)<\/strong> 1:1 gilt, wenn pro Kunde genau ein Ansprechpartner und pro Ansprechpartner genau ein Kunde erfasst wird. 1:n gilt, wenn pro Kunde mehrere Ansprechpartner erlaubt sind, jeder Ansprechpartner aber genau einem Kunden zugeordnet ist. Welche Lösung gilt, steht in der Informationsstruktur beziehungsweise in der Geschäftsregel; die Begriffe allein reichen nicht.<\/p><p>Die Aussage zum Parkplatz wird im Kontext der festen Zuordnung der E-Drive-Aufgabe gelesen. Eine bloße Momentaufnahme oder eine Nutzungshistorie wäre eine andere Aufgabenannahme.<\/p>","scenario":null,"kind":"fields","hints":["Lies den Text zunächst ohne zu zeichnen.","Prüfe jede Beziehung in beiden Leserichtungen.","Kontrolliere anschließend Schlüssel, Attribute und alle Verbindungen."],"rubric":["Alle Teilfragen beantwortet.","Begründung mit der Aufgabenregel verknüpft.","Darstellung mit der Lösung verglichen."],"provided":null,"fields":[{"key":"a","label":"Mitarbeiter → Werksausweis","answer":"1:1","options":["1:1","1:n","n:1","m:n"],"explain":""},{"key":"b","label":"Kunde → Auftrag","answer":"1:n","options":["1:1","1:n","n:1","m:n"],"explain":""},{"key":"c","label":"Auftrag → Produkt","answer":"m:n","options":["1:1","1:n","n:1","m:n"],"explain":""},{"key":"d","label":"Abteilung → Mitarbeiter","answer":"1:n","options":["1:1","1:n","n:1","m:n"],"explain":""},{"key":"e","label":"Fahrzeug → Parkplatz","answer":"1:1","options":["1:1","1:n","n:1","m:n"],"explain":""},{"key":"f","label":"Mitarbeiter → Fortbildung","answer":"m:n","options":["1:1","1:n","n:1","m:n"],"explain":""}],"extra":false},{"id":"06-2","title":"Aufgabe 2 · Personalverwaltung","source":"06","pages":[2,3],"prompt":"<p>Jeder Mitarbeiter (Personal-Nr., Name, Vorname, Eintrittsdatum) arbeitet in genau einer Abteilung (Abteilungs-Nr., Bezeichnung). In einer Abteilung arbeiten mehrere Mitarbeiter. Mitarbeiter besuchen Fortbildungen (Fortbildungs-Nr., Thema, Datum, Kosten). Ein Mitarbeiter kann mehrere Fortbildungen besuchen, eine Fortbildung wird von mehreren Mitarbeitern besucht.<\/p><p>a) Zeichnen Sie das ER-Modell mit allen Attributen und Kardinalitäten.<\/p><p>b) Zusatz: Jede Abteilung wird von genau einem Mitarbeiter geleitet; ein Mitarbeiter leitet höchstens eine Abteilung. Ergänzen Sie Ihr Modell.<\/p>","solution":"<h4>a) Grundmodell<\/h4>{{erm:u-personal}}{{readings:u-personal}}<h4>b) Zusatz: Leitung<\/h4>{{erm:u-personal-leitung}}<p>Ergänze eine zweite Beziehung zwischen Mitarbeiter und Abteilung: <strong>leitet 1:1<\/strong>. „arbeitet in“ bleibt unverändert n:1. Die beiden Rauten haben unterschiedliche Bedeutungen.<\/p><p>Ergänzende Tabellenübung: Abteilungs-Nr. als FS in Mitarbeiter. Teilnahme mit Personal-Nr. und Fortbildungs-Nr. als gemeinsamem PS und jeweils FS. Für die Leitung kann Leiter-Personal-Nr. als eindeutiger FS in Abteilung ergänzt werden.<\/p>","scenario":"u-personal","kind":"erm","hints":["Lies den Text zunächst ohne zu zeichnen.","Prüfe jede Beziehung in beiden Leserichtungen.","Kontrolliere anschließend Schlüssel, Attribute und alle Verbindungen."],"rubric":["Drei Entitätstypen und alle genannten Attribute vorhanden.","arbeitet in n:1; besucht m:n.","Zusatz als separate 1:1-Beziehung eingezeichnet."],"provided":null,"fields":[],"extra":false},{"id":"06-3","title":"Aufgabe 3 · Carsharing aus dem Text","source":"06","pages":[3],"prompt":"<p>Die E-Drive GmbH bietet in Würzburg Carsharing mit Elektroautos an. Ein Kunde (Kunden-Nr., Name, Vorname, E-Mail) schließt im Laufe der Zeit mehrere Mietverträge (Vertrags-Nr., Abholzeit, Rückgabezeit) ab; ein Mietvertrag gehört immer zu genau einem Kunden. In einem Mietvertrag können mehrere Fahrzeuge (Fahrzeug-Nr., Kennzeichen, Modell, Akkukapazität) gebucht werden, etwa für einen Firmenausflug; ein Fahrzeug erscheint im Laufe der Zeit in vielen Mietverträgen. Jedes Fahrzeug gehört zu genau einer Preisgruppe (Preisgruppen-Nr., Bezeichnung, Preis pro Stunde); eine Preisgruppe umfasst mehrere Fahrzeuge. Jedes Fahrzeug hat genau einen festen Parkplatz mit Ladesäule (Parkplatz-Nr., Straße), und jeder Parkplatz ist genau einem Fahrzeug zugeordnet.<\/p><p>a) Markieren Sie im Text alle Entitätstypen grün und alle Attribute blau.<\/p><p>b) Erstellen Sie ein zusammenhängendes ER-Modell mit Attributen und Kardinalitäten. Prüfen Sie es mit der Checkliste.<\/p><p>c) Formulieren Sie die Beziehung zwischen Mietvertrag und Fahrzeug in beiden Leserichtungen.<\/p>","solution":"<p><strong>a)<\/strong> Entitätstypen: Kunde, Mietvertrag, Fahrzeug, Preisgruppe, Parkplatz. Die in Klammern genannten Angaben sind jeweils die Attribute des davor genannten Typs.<\/p>{{erm:u-carsharing}}{{readings:u-carsharing}}<p><strong>c)<\/strong> Ein Mietvertrag kann mehrere Fahrzeuge umfassen. Ein Fahrzeug kann im Laufe der Zeit in mehreren Mietverträgen enthalten sein. Deshalb m:n.<\/p><p>Wichtig: Das Wort „Mietvertrag“ bedeutet hier ausdrücklich nicht, dass nur ein Fahrzeug gebucht werden dürfte. Der Text erlaubt mehrere Fahrzeuge in einem Vertrag.<\/p>","scenario":"u-carsharing","kind":"erm","hints":["Lies den Text zunächst ohne zu zeichnen.","Prüfe jede Beziehung in beiden Leserichtungen.","Kontrolliere anschließend Schlüssel, Attribute und alle Verbindungen."],"rubric":["Fünf Entitätstypen und alle Attribute übernommen.","Vier Beziehungen vorhanden.","Mietvertrag – Fahrzeug m:n; Fahrzeug – Parkplatz 1:1.","Beide Leserichtungen zu Teil c formuliert."],"provided":"08 · Seite 2: vorgegebenes ERM; zusätzliche Erläuterungen hier neu erstellt","fields":[],"extra":false},{"id":"06-4","title":"Aufgabe 4 · Allegro rückwärts erklären","source":"06","pages":[3],"prompt":"<p>Die Musikschule „Allegro“ hat von der Infotech GmbH dieses ER-Modell erhalten. Formulieren Sie die zugrunde liegende Informationsstruktur in ganzen Sätzen. Gehen Sie auf alle Attribute und auf jede Beziehung in beiden Leserichtungen ein.<\/p>{{erm:u-allegro}}","solution":"<p>Die Musikschule verwaltet Lehrkräfte mit Lehrkraft-Nr, Name und Instrument. Sie verwaltet Kurse mit Kurs-Nr, Bezeichnung und Wochentag. Zu Schülern werden Schüler-Nr, Name und Geburtsdatum gespeichert. Räume besitzen Raum-Nr und Größe in m².<\/p><p>Eine Lehrkraft unterrichtet mehrere Kurse. Jeder Kurs wird einer Lehrkraft zugeordnet. Ein Schüler kann mehrere Kurse belegen. Ein Kurs kann von mehreren Schülern belegt werden. Ein Kurs findet in einem Raum statt. Ein Raum kann für mehrere Kurse genutzt werden.<\/p><p>Die 1/n/m-Angaben der vorgegebenen Zeichnung bestimmen die maximalen Zuordnungen. Zusätzliche Pflichtteilnahmen oder Raumbelegungszeiten sind nicht angegeben.<\/p>","scenario":"u-allegro","kind":"text","hints":["Lies den Text zunächst ohne zu zeichnen.","Prüfe jede Beziehung in beiden Leserichtungen.","Kontrolliere anschließend Schlüssel, Attribute und alle Verbindungen."],"rubric":["Alle vier Entitätstypen und ihre Attribute genannt.","Jede der drei Beziehungen in beiden Leserichtungen beschrieben.","Keine nicht dargestellte Zeitregel hinzugefügt."],"provided":null,"fields":[],"extra":false},{"id":"07-1","title":"Aufgabe 1 · Den richtigen Primärschlüssel wählen","source":"07","pages":[2],"prompt":"<div class=\"table-wrap\"><table><thead><tr><th>Kunden-ID<\/th><th>Kundenname<\/th><th>Ort<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Volkswagen AG<\/td><td>Wolfsburg<\/td><\/tr><tr><td>2<\/td><td>Audi AG<\/td><td>Ingolstadt<\/td><\/tr><tr><td>3<\/td><td>Bosch AG<\/td><td>Lohr am Main<\/td><\/tr><tr><td>4<\/td><td>Bosch AG<\/td><td>Bamberg<\/td><\/tr><tr><td>5<\/td><td>Blueroad Ltd.<\/td><td>Turin<\/td><\/tr><\/tbody><\/table><\/div><p>a) Begründen Sie, warum der Kundenname als Primärschlüssel ungeeignet ist.<\/p><p>b) Wäre die Kombination aus Kundenname und Ort als Primärschlüssel möglich? Was spricht dagegen?<\/p><p>c) Um welche Art von Schlüssel handelt es sich bei der Kunden-ID?<\/p>","solution":"<p><strong>a)<\/strong> Bosch AG kommt zweimal vor. Kundenname identifiziert die Zeilen also nicht eindeutig.<\/p><p><strong>b)<\/strong> In den gezeigten fünf Zeilen sind die Kombinationen verschieden. Das beweist aber keine allgemeine Eindeutigkeit. Zwei Kunden könnten denselben Namen am selben Ort haben. Name und Ort können sich zudem ändern. Ohne dauerhaft gesicherte Eindeutigkeit ist die Kombination ungeeignet.<\/p><p><strong>c)<\/strong> Kunden-ID ist ein künstlicher Schlüssel. Sie wird als zusätzliche Identifikation eingeführt. Sie ist außerdem ein einfacher Schlüssel, weil sie nur aus einem Attribut besteht.<\/p>","scenario":null,"kind":"fields","hints":["Lies den Text zunächst ohne zu zeichnen.","Prüfe jede Beziehung in beiden Leserichtungen.","Kontrolliere anschließend Schlüssel, Attribute und alle Verbindungen."],"rubric":["Alle Teilfragen beantwortet.","Begründung mit der Aufgabenregel verknüpft.","Darstellung mit der Lösung verglichen."],"provided":null,"fields":[{"key":"type","label":"Schlüsselart der Kunden-ID","answer":"künstlich","options":["natürlich","künstlich","zusammengesetzt"],"explain":""}],"extra":false},{"id":"07-2","title":"Aufgabe 2 · Schlüsselarten erkennen und beurteilen","source":"07","pages":[3],"prompt":"<p>Bestimmen Sie die Art des Schlüssels und beurteilen Sie, ob er als Primärschlüssel geeignet ist.<\/p><div class=\"table-wrap\"><table><thead><tr><th><\/th><th>Relation<\/th><th>Vorschlag für den Primärschlüssel<\/th><\/tr><\/thead><tbody><tr><td>a)<\/td><td>Fahrzeug<\/td><td>Fahrgestellnummer (FIN)<\/td><\/tr><tr><td>b)<\/td><td>Fahrzeug<\/td><td>Kennzeichen<\/td><\/tr><tr><td>c)<\/td><td>Kunde<\/td><td>Kunden-ID (fortlaufende Nummer)<\/td><\/tr><tr><td>d)<\/td><td>Person<\/td><td>Personalausweisnummer<\/td><\/tr><tr><td>e)<\/td><td>Mitarbeiter<\/td><td>Name + Vorname<\/td><\/tr><tr><td>f)<\/td><td>Abteilung_Mitarbeiter<\/td><td>Abteilungs-Nr. + Personal-Nr. (ein Mitarbeiter kann mehreren Abteilungen zugeordnet sein)<\/td><\/tr><\/tbody><\/table><\/div>","solution":"<div class=\"table-wrap\"><table><thead><tr><th>Teil<\/th><th>Art<\/th><th>Beurteilung<\/th><\/tr><\/thead><tbody><tr><td>a<\/td><td>natürlich; einfach<\/td><td>FIN ist nach dem Unterrichtsblatt ein vorhandenes eindeutiges Fahrzeugmerkmal und ein geeigneter natürlicher Schlüssel.<\/td><\/tr><tr><td>b<\/td><td>natürlich; einfach<\/td><td>Kennzeichen ist als dauerhafte Fahrzeugidentifikation ungünstig: Es kann sich ändern. Seine Eindeutigkeit muss für den betrachteten Bestand und Zeitraum gesichert sein.<\/td><\/tr><tr><td>c<\/td><td>künstlich; einfach<\/td><td>Geeignet, wenn die Nummer einmalig vergeben wird, nicht fehlt und stabil bleibt.<\/td><\/tr><tr><td>d<\/td><td>natürlich im Personenmodell; einfach<\/td><td>Als dauerhafter Personenschlüssel problematisch: Es identifiziert ein Ausweisdokument, nicht unveränderlich die Person. Eine erneuerte Dokumentidentifikation würde einen Schlüsselwechsel verlangen.<\/td><\/tr><tr><td>e<\/td><td>zusammengesetzter natürlicher Schlüsselvorschlag<\/td><td>Nicht allgemein geeignet. Zwei Mitarbeiter können denselben Nachnamen und Vornamen haben.<\/td><\/tr><tr><td>f<\/td><td>zusammengesetzt, aus zwei Identifikatoren<\/td><td>Geeignet, wenn jede Abteilung/Personal-Zuordnung höchstens einmal gespeichert wird. Beide Nummern dürfen einzeln mehrfach vorkommen.<\/td><\/tr><\/tbody><\/table><\/div><div class=\"callout \">Zwei Achsen: natürlich/künstlich erklärt die Herkunft; einfach/zusammengesetzt erklärt die Anzahl der Attribute. Die Tabelle liefert begründete Lösungsvorschläge, keine zusätzliche Original-Lösungsseite.<\/div>","scenario":null,"kind":"keys","hints":["Lies den Text zunächst ohne zu zeichnen.","Prüfe jede Beziehung in beiden Leserichtungen.","Kontrolliere anschließend Schlüssel, Attribute und alle Verbindungen."],"rubric":["Alle Teilfragen beantwortet.","Begründung mit der Aufgabenregel verknüpft.","Darstellung mit der Lösung verglichen."],"provided":null,"fields":[{"key":"a","label":"Fahrzeug · Fahrgestellnummer (FIN)","answer":"natürlich","options":["natürlich","künstlich","zusammengesetzt"],"explain":""},{"key":"b","label":"Fahrzeug · Kennzeichen","answer":"natürlich","options":["natürlich","künstlich","zusammengesetzt"],"explain":""},{"key":"c","label":"Kunde · Kunden-ID (fortlaufende Nummer)","answer":"künstlich","options":["natürlich","künstlich","zusammengesetzt"],"explain":""},{"key":"d","label":"Person · Personalausweisnummer","answer":"natürlich","options":["natürlich","künstlich","zusammengesetzt"],"explain":""},{"key":"e","label":"Mitarbeiter · Name + Vorname","answer":"zusammengesetzt","options":["natürlich","künstlich","zusammengesetzt"],"explain":""},{"key":"f","label":"Abteilung_Mitarbeiter · Abteilungs-Nr. + Personal-Nr. (ein Mitarbeiter kann mehreren Abteilungen zugeordnet sein)","answer":"zusammengesetzt","options":["natürlich","künstlich","zusammengesetzt"],"explain":""}],"extra":false},{"id":"07-3","title":"Aufgabe 3 · Grundrelationen erstellen","source":"07","pages":[1,3],"prompt":"<p>Übertragen Sie die Entitätstypen Mitarbeiter, Auftrag und Produkt aus dem ER-Modell in Relationen. Kennzeichnen Sie jeweils den Primärschlüssel.<\/p>","solution":"{{subset:u-avallon:Mitarbeiter,Auftrag,Produkt:base}}<p>Mitarbeiter: Mitarbeiter-ID (PS), Name, Vorname. Auftrag: Auftrags-ID (PS), Auftragsdatum. Produkt: Produkt-ID (PS), Bezeichnung, Listenpreis.<\/p><p>In dieser Teilaufgabe werden zunächst nur die Grundrelationen gebildet. Die Fremdschlüssel folgen in den nächsten Regeln.<\/p>","scenario":"u-avallon-base","kind":"schema","hints":["Lies den Text zunächst ohne zu zeichnen.","Prüfe jede Beziehung in beiden Leserichtungen.","Kontrolliere anschließend Schlüssel, Attribute und alle Verbindungen."],"rubric":["Drei Grundrelationen vorhanden.","Alle Attribute vom Ausgangs-ERM übernommen.","Jeweilige ID unterstrichen und mit (PS) markiert."],"provided":null,"fields":[],"extra":false},{"id":"07-4","title":"Aufgabe 4 · Wohin gehört der Fremdschlüssel?","source":"07","pages":[4,5],"prompt":"<h4>Versuch A – die Auftrags-ID steht als Fremdschlüssel beim Kunden:<\/h4><div class=\"table-wrap\"><table><thead><tr><th>Kunden-ID<\/th><th>Kundenname<\/th><th>Ort<\/th><th>Auftrags-ID (FS)<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Volkswagen AG<\/td><td>Wolfsburg<\/td><td>70, 72<\/td><\/tr><tr><td>2<\/td><td>Audi AG<\/td><td>Ingolstadt<\/td><td>71<\/td><\/tr><tr><td>3<\/td><td>Blueroad Ltd.<\/td><td>Turin<\/td><td>–<\/td><\/tr><\/tbody><\/table><\/div><h4>Versuch B – die Kunden-ID steht als Fremdschlüssel beim Auftrag:<\/h4><div class=\"table-wrap\"><table><thead><tr><th>Auftrags-ID<\/th><th>Auftragsdatum<\/th><th>Kunden-ID (FS)<\/th><\/tr><\/thead><tbody><tr><td>70<\/td><td>05.10.2026<\/td><td>1<\/td><\/tr><tr><td>71<\/td><td>07.10.2026<\/td><td>2<\/td><\/tr><tr><td>72<\/td><td>12.10.2026<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div><p>a) Beurteilen Sie beide Versuche. Denken Sie an einen Kunden mit 50 Aufträgen.<\/p><p>Regel 2 (1:n): Der __________ der Relation auf der 1-Seite wird als __________ in die Relation auf der n-Seite aufgenommen.<\/p><p>b) Auch zwischen Mitarbeiter und Kunde besteht eine 1:n-Beziehung (ein Mitarbeiter betreut mehrere Kunden). Frank Günther (Mitarbeiter-ID 1) betreut Volkswagen und Blueroad, Sabine Roth (Mitarbeiter-ID 2) betreut Audi. Ergänzen Sie in der Tabelle Kunde den Fremdschlüssel (Spaltenüberschrift und Werte).<\/p>","solution":"<p><strong>a)<\/strong> Versuch A benötigt eine Liste von Aufträgen in einer Zelle. Bei 50 Aufträgen würde diese Liste nur länger. Versuch B speichert pro Auftrag genau einen Kundenwert und erlaubt gleichzeitig viele Aufträge desselben Kunden.<\/p><p><strong>Lückentext:<\/strong> Primärschlüssel · Fremdschlüssel.<\/p><p><strong>b)<\/strong> Spaltenüberschrift: Mitarbeiter-ID (FS). Volkswagen AG → 1, Audi AG → 2, Blueroad Ltd. → 1.<\/p><div class=\"table-wrap\"><table><thead><tr><th>Kunden-ID<\/th><th>Kundenname<\/th><th>Ort<\/th><th>Mitarbeiter-ID (FS)<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Volkswagen AG<\/td><td>Wolfsburg<\/td><td>1<\/td><\/tr><tr><td>2<\/td><td>Audi AG<\/td><td>Ingolstadt<\/td><td>2<\/td><\/tr><tr><td>3<\/td><td>Blueroad Ltd.<\/td><td>Turin<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>","scenario":null,"kind":"fields","hints":["Lies den Text zunächst ohne zu zeichnen.","Prüfe jede Beziehung in beiden Leserichtungen.","Kontrolliere anschließend Schlüssel, Attribute und alle Verbindungen."],"rubric":["Alle Teilfragen beantwortet.","Begründung mit der Aufgabenregel verknüpft.","Darstellung mit der Lösung verglichen."],"provided":null,"fields":[{"key":"rule1","label":"Der … der 1-Seite","answer":"Primärschlüssel","options":null,"explain":""},{"key":"rule2","label":"wird als … in die n-Seite aufgenommen","answer":"Fremdschlüssel","options":null,"explain":""},{"key":"v","label":"Mitarbeiter-ID für Volkswagen","answer":"1","options":null,"explain":""},{"key":"a","label":"Mitarbeiter-ID für Audi","answer":"2","options":null,"explain":""},{"key":"b","label":"Mitarbeiter-ID für Blueroad","answer":"1","options":null,"explain":""}],"extra":false},{"id":"07-5","title":"Aufgabe 5 · Die Zuordnungstabelle","source":"07","pages":[5,6],"prompt":"<p>Ein Auftrag enthält mehrere Produkte, ein Produkt ist in mehreren Aufträgen enthalten. Auftrag 70 (Volkswagen) umfasst z. B. 200 Schnellladestecker und 50 Elektromotoren. Das Projektteam versucht es mit Regel 2 und nimmt die Produkt-ID und die Menge in die Relation Auftrag auf. Die Tabelle sähe dann so aus:<\/p><div class=\"table-wrap\"><table><thead><tr><th>Auftrags-ID<\/th><th>Auftragsdatum<\/th><th>Kunden-ID<\/th><th>Produkt-ID<\/th><th>Menge<\/th><\/tr><\/thead><tbody><tr><td>70<\/td><td>05.10.2026<\/td><td>1<\/td><td>1<\/td><td>200<\/td><\/tr><tr><td>70<\/td><td>05.10.2026<\/td><td>1<\/td><td>2<\/td><td>50<\/td><\/tr><tr><td>71<\/td><td>07.10.2026<\/td><td>2<\/td><td>2<\/td><td>120<\/td><\/tr><\/tbody><\/table><\/div><p>a) Erläutern Sie die beiden Probleme, die durch diesen Versuch entstehen. Was würde passieren, wenn man stattdessen die Auftrags-ID in die Relation Produkt aufnimmt?<\/p><p>b) Tragen Sie die Bestellungen in die Tabelle Auftragsposition ein:<\/p><p>Auftrag 70: 200 × Produkt 1, 50 × Produkt 2 · Auftrag 71: 120 × Produkt 2, 40 × Produkt 4 · Auftrag 72: 30 × Produkt 3<\/p><p>c) Begründen Sie, warum die Kombination 70 | 2 in der Tabelle Auftragsposition nur einmal vorkommen darf. Was ist zu tun, wenn Volkswagen für Auftrag 70 noch 10 weitere Elektromotoren bestellt?<\/p>","solution":"<p><strong>a) Problem 1:<\/strong> Auftrags-ID 70 steht doppelt. Sie wäre als alleiniger PS nicht mehr eindeutig. <strong>Problem 2:<\/strong> Auftragsdatum und Kunden-ID werden für jede Position wiederholt. Änderungen müssten an mehreren Stellen erfolgen. Eine Auftrags-ID in Produkt verschiebt das Problem nur: Ein Produkt gehört zu mehreren Aufträgen.<\/p><p><strong>b)<\/strong> Jede Zeile speichert genau ein Paar und seine Menge:<\/p><div class=\"table-wrap\"><table><thead><tr><th>Auftrags-ID (PS, FS)<\/th><th>Produkt-ID (PS, FS)<\/th><th>Menge<\/th><\/tr><\/thead><tbody><tr><td>70<\/td><td>1<\/td><td>200<\/td><\/tr><tr><td>70<\/td><td>2<\/td><td>50<\/td><\/tr><tr><td>71<\/td><td>2<\/td><td>120<\/td><\/tr><tr><td>71<\/td><td>4<\/td><td>40<\/td><\/tr><tr><td>72<\/td><td>3<\/td><td>30<\/td><\/tr><\/tbody><\/table><\/div>{{subset:u-avallon:Auftrag,Auftragsposition,Produkt:full}}<p><strong>c)<\/strong> Auftrags-ID und Produkt-ID bilden gemeinsam den PS. Das Paar 70 | 2 darf deshalb nur einmal vorkommen. Erhöhe in dieser Zeile die Menge von 50 auf <strong>60<\/strong>. Eine zweite Zeile mit dem gleichen Paar wäre ein Schlüsselverstoß.<\/p>","scenario":"u-avallon","kind":"positions","hints":["Lies den Text zunächst ohne zu zeichnen.","Prüfe jede Beziehung in beiden Leserichtungen.","Kontrolliere anschließend Schlüssel, Attribute und alle Verbindungen."],"rubric":["Beide Probleme des Versuchs erklärt.","Alle fünf Paare mit richtiger Menge eingetragen.","Beide PS/FS-Attribute unterstrichen.","Beide 1:n-Verbindungen zeigen zur Zuordnungstabelle."],"provided":null,"fields":[{"key":"quantity","label":"Neue Menge für 70 | 2 nach zehn zusätzlichen Stück","answer":"60","options":null,"explain":""}],"extra":false},{"id":"07-6","title":"Aufgabe 6 · Login-Zugang anbinden","source":"07","pages":[6,7],"prompt":"<p>a) Ergänzen Sie in der Relation Login-Zugang den Fremdschlüssel.<\/p><p>b) Begründen Sie, warum jede Kunden-ID in der Tabelle Login-Zugang höchstens einmal vorkommen darf.<\/p>","solution":"{{subset:u-avallon:Kunde,Login-Zugang:full}}<p><strong>a)<\/strong> Ergänze <em>Kunden-ID (FS)<\/em> in Login-Zugang. Verbinde diese Zeile mit Kunden-ID (PS) in Kunde. An beiden Linienenden steht 1.<\/p><p><strong>b)<\/strong> Derselbe Kundenwert darf im Login-Zugang nicht mehrfach vorkommen. Sonst könnte ein Kunde mehrere Login-Zugänge besitzen; die verlangte 1:1-Beziehung wäre verletzt.<\/p><p>Technischer Zusatz, nicht Teil der Zeichnungsaufgabe: Die Eindeutigkeit einer Fremdschlüsselspalte wird zum Beispiel mit UNIQUE abgesichert. Die vollständige Existenzpflicht auf beiden Seiten folgt nicht allein aus einer gewöhnlichen Referenz.<\/p>","scenario":null,"kind":"fields","hints":["Lies den Text zunächst ohne zu zeichnen.","Prüfe jede Beziehung in beiden Leserichtungen.","Kontrolliere anschließend Schlüssel, Attribute und alle Verbindungen."],"rubric":["Alle Teilfragen beantwortet.","Begründung mit der Aufgabenregel verknüpft.","Darstellung mit der Lösung verglichen."],"provided":null,"fields":[{"key":"fk","label":"Fremdschlüsselspalte in Login-Zugang","answer":"Kunden-ID","options":null,"explain":""},{"key":"card","label":"Typ der Beziehung","answer":"1:1","options":["1:1","1:n","n:1","m:n"],"explain":""}],"extra":false},{"id":"07-7","title":"Aufgabe 7 · Regeln im Überblick","source":"07","pages":[7],"prompt":"<p>Ergänzen Sie die Lücken in der Tabelle „Regeln im Überblick“ auf der Originalseite.<\/p>","solution":"<div class=\"table-wrap\"><table><thead><tr><th>Im ER-Modell<\/th><th>Vollständig ausgefüllte Regel<\/th><\/tr><\/thead><tbody><tr><td>Entitätstyp<\/td><td>eigene <strong>Relation<\/strong> (Kasten mit Namen); Attribute werden <strong>untereinander<\/strong> aufgeführt; ein Attribut wird <strong>Primärschlüssel<\/strong>.<\/td><\/tr><tr><td>1:n-Beziehung<\/td><td>PS der <strong>1<\/strong>-Seite wird als <strong>Fremdschlüssel<\/strong> in die Relation der <strong>n<\/strong>-Seite aufgenommen.<\/td><\/tr><tr><td>m:n-Beziehung<\/td><td>eigene Relation, die <strong>Zuordnungstabelle<\/strong>; enthält die PS beider Relationen als <strong>Fremdschlüssel<\/strong>; zusammen bilden sie den <strong>zusammengesetzten<\/strong> PS; Beziehungsattribute (z. B. <strong>Menge<\/strong>) gehören hierher.<\/td><\/tr><tr><td>1:1-Beziehung<\/td><td>PS der einen Relation wird <strong>Fremdschlüssel<\/strong> in der anderen; jeder Wert darf nur <strong>einmal<\/strong> vorkommen (oder beide Relationen zusammenlegen).<\/td><\/tr><\/tbody><\/table><\/div>","scenario":null,"kind":"fields","hints":["Lies den Text zunächst ohne zu zeichnen.","Prüfe jede Beziehung in beiden Leserichtungen.","Kontrolliere anschließend Schlüssel, Attribute und alle Verbindungen."],"rubric":["Alle Teilfragen beantwortet.","Begründung mit der Aufgabenregel verknüpft.","Darstellung mit der Lösung verglichen."],"provided":null,"fields":[{"key":"r","label":"Eigene … (Kasten mit Namen)","answer":"Relation","options":null,"explain":""},{"key":"u","label":"Attribute werden … aufgeführt","answer":"untereinander","options":null,"explain":""},{"key":"p","label":"Ein identifizierendes Attribut wird …","answer":"Primärschlüssel","options":null,"explain":""},{"key":"one","label":"PS der …-Seite","answer":"1","options":null,"explain":""},{"key":"fk","label":"wird als … übernommen","answer":"Fremdschlüssel","options":null,"explain":""},{"key":"n","label":"in die …-Seite","answer":"n","options":null,"explain":""},{"key":"j","label":"Neue Relation bei m:n","answer":"Zuordnungstabelle","options":null,"explain":""},{"key":"c","label":"Beide zusammen bilden den … PS","answer":"zusammengesetzten","options":null,"explain":""},{"key":"m","label":"Beziehungsattribut im Auftragsbeispiel","answer":"Menge","options":null,"explain":""},{"key":"once","label":"Ein 1:1-FS-Wert darf nur … vorkommen","answer":"einmal","options":null,"explain":""}],"extra":false},{"id":"07-8","title":"Aufgabe 8 · Das Gesamtmodell","source":"07","pages":[1,7],"prompt":"<p>Erstellen Sie das vollständige relationale Modell der Auftragsverwaltung mit allen Relationen, Primär- und Fremdschlüsseln. Verbinden Sie jeweils Primär- und Fremdschlüssel und notieren Sie die Kardinalitäten (1 bzw. n) an den Linien.<\/p>","solution":"{{schema:u-avallon}}<p>Es entstehen <strong>sechs Relationen<\/strong>: Mitarbeiter, Kunde, Auftrag, Produkt, Login-Zugang und Auftragsposition. Die ersten fünf stammen aus Entitätstypen. Auftragsposition löst die m:n-Beziehung auf.<\/p><p>Mitarbeiter-ID ist FS in Kunde. Kunden-ID ist FS in Auftrag und als eindeutiger FS in Login-Zugang. Auftragsposition enthält Auftrags-ID und Produkt-ID als gemeinsamen PS und jeweils als FS. Menge gehört ebenfalls in Auftragsposition.<\/p><p>Beachte: Die vorgegebene Ausgangszeichnung auf Seite 1 enthält Menge noch nicht. Diese wird auf den Seiten 5–6 für die Position eingeführt und deshalb im Gesamtmodell ergänzt.<\/p>","scenario":"u-avallon","kind":"schema","hints":["Lies den Text zunächst ohne zu zeichnen.","Prüfe jede Beziehung in beiden Leserichtungen.","Kontrolliere anschließend Schlüssel, Attribute und alle Verbindungen."],"rubric":["Alle sechs Relationen vorhanden.","Alle PS unterstrichen, alle FS markiert.","Menge in Auftragsposition.","Linien verbinden die richtigen Schlüsselzeilen.","Login-Zugang enthält einen eindeutigen Kunden-FS."],"provided":null,"fields":[],"extra":false},{"id":"08-start","title":"Einstieg · Die drei relationalen Fehler","source":"08","pages":[1],"prompt":"<p>Zum korrigierten ER-Modell „Einkauf der Avallon AG“ aus Einheit 1 hat Leon ein relationales Modell erstellt.<\/p><p>Arbeitsauftrag: Das relationale Modell enthält drei Fehler. Beschreiben Sie die Fehler und zeichnen Sie ein korrektes relationales Modell.<\/p>{{image:08-1}}","solution":"<p><strong>1. m:n nicht aufgelöst:<\/strong> Lieferant-ID direkt in Artikel erlaubt nur einen Lieferanten je Artikel. Ergänze Lieferant_Artikel mit beiden IDs als gemeinsamem PS und jeweils FS.<\/p><p><strong>2. Fremdschlüssel auf der falschen Seite:<\/strong> Gruppen-ID gehört in Artikel, nicht Artikel-ID in Artikelgruppe.<\/p><p><strong>3. Primärschlüssel fehlt:<\/strong> Gruppen-ID muss in Artikelgruppe als PS markiert und unterstrichen sein.<\/p>{{schema:u-einkauf}}","scenario":"u-einkauf","kind":"schema","hints":["Lies den Text zunächst ohne zu zeichnen.","Prüfe jede Beziehung in beiden Leserichtungen.","Kontrolliere anschließend Schlüssel, Attribute und alle Verbindungen."],"rubric":["Drei Fehler erklärt.","Vier Relationen einschließlich Zuordnungstabelle.","Schlüssel und Linien wie im korrigierten Modell."],"provided":"08_Loesung_Uebungen_Relationales_Modell.pdf · S. 1","fields":[],"extra":false},{"id":"08-1","title":"Übung 1 · Carsharing relational","source":"08","pages":[1,2],"prompt":"<p>Überführen Sie das ER-Modell der E-Drive GmbH (Einheit 1, Aufgabe 3) in ein relationales Modell. Kennzeichnen Sie alle Primär- und Fremdschlüssel und notieren Sie die Kardinalitäten an den Verbindungslinien.<\/p>{{erm:u-carsharing}}","solution":"{{schema:u-carsharing}}<p>Kunde 1:n Mietvertrag: Kunden-Nr. steht als FS in Mietvertrag. Mietvertrag m:n Fahrzeug: Vertragsposition ergänzt beide Nummern als zusammengesetzten PS und jeweils FS.<\/p><p>Preisgruppe 1:n Fahrzeug: Preisgruppen-Nr. steht in Fahrzeug. Fahrzeug 1:1 Parkplatz: In der gelieferten Lösung steht Parkplatz-Nr. in Fahrzeug. Die umgekehrte Richtung ist ausdrücklich ebenfalls zugelassen, wenn jeder FS-Wert nur einmal vorkommt.<\/p><p>Auch der Name der Zuordnungstabelle darf abweichen, zum Beispiel Buchung oder Mietvertrag_Fahrzeug.<\/p>","scenario":"u-carsharing","kind":"schema","hints":["Lies den Text zunächst ohne zu zeichnen.","Prüfe jede Beziehung in beiden Leserichtungen.","Kontrolliere anschließend Schlüssel, Attribute und alle Verbindungen."],"rubric":["Sechs Relationen vorhanden.","Vertragsposition hat beide unterstrichenen PS/FS-Attribute.","Kunden-FS in Mietvertrag; Preisgruppen-FS in Fahrzeug.","Parkplatzreferenz eindeutig und 1:1 verbunden."],"provided":"08_Loesung_Uebungen_Relationales_Modell.pdf · S. 1","fields":[],"extra":false},{"id":"08-2","title":"Übung 2 · Carsharing: Datensätze eintragen","source":"08","pages":[2,3],"prompt":"<p>Anna Keller (Kunden-Nr. 1, anna.keller@mail.de) schließt den Mietvertrag 501 ab: Abholung am 12.11.2026 um 8:00 Uhr, Rückgabe am selben Tag um 18:00 Uhr, gebucht sind die Fahrzeuge 11 und 14. Tim Wolf (Kunden-Nr. 2, t.wolf@mail.de) mietet mit Vertrag 502 am 13.11.2026 von 9:00 bis 12:00 Uhr das Fahrzeug 14. Anna Keller mietet mit Vertrag 503 am 20.11.2026 von 14:00 bis 16:00 Uhr das Fahrzeug 12.<\/p><p>a) Tragen Sie die Daten in die Tabellen ein.<\/p><p>b) Die Kunden-Nr. 1 steht zweimal in der Tabelle Mietvertrag. Begründen Sie, warum das keine schädliche Redundanz ist.<\/p><p>c) Fahrzeug 14 kommt zweimal in der Tabelle Vertragsposition vor. Verletzt das den Primärschlüssel? Begründen Sie.<\/p>","solution":"<h4>Kunde<\/h4><div class=\"table-wrap\"><table><thead><tr><th>Kunden-Nr. (PS)<\/th><th>Name<\/th><th>Vorname<\/th><th>E-Mail<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Keller<\/td><td>Anna<\/td><td>anna.keller@mail.de<\/td><\/tr><tr><td>2<\/td><td>Wolf<\/td><td>Tim<\/td><td>t.wolf@mail.de<\/td><\/tr><\/tbody><\/table><\/div><h4>Mietvertrag<\/h4><div class=\"table-wrap\"><table><thead><tr><th>Vertrags-Nr. (PS)<\/th><th>Abholzeit<\/th><th>Rückgabezeit<\/th><th>Kunden-Nr. (FS)<\/th><\/tr><\/thead><tbody><tr><td>501<\/td><td>12.11.2026 08:00<\/td><td>12.11.2026 18:00<\/td><td>1<\/td><\/tr><tr><td>502<\/td><td>13.11.2026 09:00<\/td><td>13.11.2026 12:00<\/td><td>2<\/td><\/tr><tr><td>503<\/td><td>20.11.2026 14:00<\/td><td>20.11.2026 16:00<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div><h4>Vertragsposition<\/h4><div class=\"table-wrap\"><table><thead><tr><th>Vertrags-Nr. (PS, FS)<\/th><th>Fahrzeug-Nr. (PS, FS)<\/th><\/tr><\/thead><tbody><tr><td>501<\/td><td>11<\/td><\/tr><tr><td>501<\/td><td>14<\/td><\/tr><tr><td>502<\/td><td>14<\/td><\/tr><tr><td>503<\/td><td>12<\/td><\/tr><\/tbody><\/table><\/div><p><strong>b)<\/strong> Wiederholt wird nur der Verweis auf Anna Keller. Name und E-Mail stehen nur einmal in Kunde. Eine Änderung wird an dieser einen Stelle durchgeführt.<\/p><p><strong>c)<\/strong> Nein. Der PS besteht aus dem vollständigen Paar. 501 | 14 und 502 | 14 sind verschieden. Fahrzeug-Nr. allein ist nicht eindeutig und muss es hier auch nicht sein.<\/p>","scenario":null,"kind":"carData","hints":["Lies den Text zunächst ohne zu zeichnen.","Prüfe jede Beziehung in beiden Leserichtungen.","Kontrolliere anschließend Schlüssel, Attribute und alle Verbindungen."],"rubric":["Zwei Kunden, drei Verträge und vier Vertragspositionen.","Datum und Uhrzeit gemeinsam gespeichert.","Wiederholte FS-Werte von doppelten PS-Kombinationen unterschieden."],"provided":"08_Loesung_Uebungen_Relationales_Modell.pdf · S. 1–2","fields":[],"extra":false},{"id":"08-3","title":"Übung 3 · Komplettaufgabe FitWerk","source":"08","pages":[3,5],"prompt":"<p>Das Fitnessstudio FitWerk in Würzburg möchte seine Mitglieder und Kurse mit einer Datenbank verwalten.\nVon jedem Mitglied werden Mitglieds-Nr., Name, Vorname und Geburtsdatum gespeichert.\nJedes Mitglied wählt genau einen Tarif (Tarif-Nr., Bezeichnung, Monatsbeitrag). Ein Tarif kann von vielen Mitgliedern gewählt werden.\nJedes Mitglied besitzt genau einen Mitgliedsausweis (Ausweis-Nr., Ausstellungsdatum), jeder Ausweis gehört genau einem Mitglied. Die Ausweisdaten sollen aus Datenschutzgründen getrennt gespeichert werden.\nDas Studio bietet Kurse an (Kurs-Nr., Bezeichnung, Wochentag, Uhrzeit). Jeder Kurs wird von genau einem Trainer (Trainer-Nr., Name, Qualifikation) geleitet; ein Trainer kann mehrere Kurse leiten.\nMitglieder melden sich zu Kursen an. Ein Mitglied kann mehrere Kurse belegen, ein Kurs hat mehrere Teilnehmer. Zu jeder Anmeldung wird das Anmeldedatum gespeichert.<\/p><p>a) Erstellen Sie das ER-Modell mit Attributen und Kardinalitäten.<\/p><p>b) Überführen Sie das ER-Modell in ein relationales Modell mit allen Primär- und Fremdschlüsseln.<\/p><p>c) Begründen Sie, in welche Relation das Anmeldedatum gehört.<\/p>","solution":"<h4>a) Semantisches Modell<\/h4>{{erm:u-fitwerk}}<h4>b) Relationales Modell<\/h4>{{schema:u-fitwerk}}<p><strong>c)<\/strong> Anmeldedatum beschreibt die Anmeldung eines bestimmten Mitglieds zu einem bestimmten Kurs. Es ist weder eine Eigenschaft des Mitglieds allein noch des Kurses allein. Im ERM hängt es an der Raute „meldet sich an zu“. Im relationalen Modell steht es in Kursanmeldung.<\/p><p>Fünf Entitätstypen ergeben fünf Grundrelationen. Die m:n-Beziehung erzeugt die sechste Relation. Tarif-Nr. steht in Mitglied, Trainer-Nr. in Kurs und der eindeutige Mitglieds-FS in Mitgliedsausweis.<\/p>","scenario":"u-fitwerk","kind":"both","hints":["Es gibt fünf Entitätstypen: Mitglied, Tarif, Mitgliedsausweis, Kurs und Trainer.","Mitglied – Tarif n:1; Mitglied – Mitgliedsausweis 1:1; Trainer – Kurs 1:n; Mitglied – Kurs m:n.","Es entstehen sechs Relationen. Anmeldedatum gehört in die neue Zuordnungstabelle Kursanmeldung."],"rubric":["Fünf Entitätstypen mit allen Attributen.","Vier Beziehungen richtig.","Sechs Relationen.","Anmeldedatum am Beziehungstyp beziehungsweise in Kursanmeldung.","Zusammengesetzter PS und 1:1-Eindeutigkeit korrekt."],"provided":"08_Loesung_Uebungen_Relationales_Modell.pdf · S. 2–3","fields":[],"extra":false},{"id":"08-4","title":"Übung 4 · Hotel „Am Main“ rückwärts","source":"08","pages":[4],"prompt":"<p>Für ein Würzburger Hotel liegt bereits dieses relationale Modell vor:<\/p>{{schema:u-hotel}}<p>a) Bestimmen Sie die Beziehungstypen zwischen Gast und Buchung, Buchung und Zimmer sowie Zimmer und Kategorie.<\/p><p>b) Zeichnen Sie das zugehörige ER-Modell.<\/p><p>c) Erklären Sie, warum die Relation Buchungsposition einen zusammengesetzten Primärschlüssel hat.<\/p><p>d) Das Hotel möchte zusätzlich speichern, welcher Mitarbeiter (Mitarbeiter-Nr., Name) eine Buchung angenommen hat. Ein Mitarbeiter nimmt viele Buchungen an. Beschreiben Sie die nötige Änderung im relationalen Modell.<\/p>","solution":"<p><strong>a)<\/strong> Gast – Buchung 1:n. Buchung – Zimmer m:n. Zimmer – Kategorie n:1.<\/p>{{erm:u-hotel}}<p><strong>c)<\/strong> Weder Buchungs-Nr. noch Zimmer-Nr. ist allein eindeutig: Eine Buchung kann mehrere Zimmer haben und ein Zimmer kommt im Laufe der Zeit in mehreren Buchungen vor. Das Paar identifiziert die Zuordnung.<\/p><p><strong>d)<\/strong> Ergänze Mitarbeiter mit Mitarbeiter-Nr. (PS) und Name. Ergänze Mitarbeiter-Nr. (FS) in Buchung. Verbinde Mitarbeiter 1:n Buchung von Schlüssel zu Schlüssel. Die Lösung geht davon aus, dass jede Buchung von einem Mitarbeiter angenommen wird.<\/p>","scenario":"u-hotel","kind":"both","hints":["Lies den Text zunächst ohne zu zeichnen.","Prüfe jede Beziehung in beiden Leserichtungen.","Kontrolliere anschließend Schlüssel, Attribute und alle Verbindungen."],"rubric":["Drei Beziehungstypen richtig.","Frühstück im ERM an der Beziehung umfasst.","Gemeinsame Eindeutigkeit des Paars begründet.","Mitarbeiter-FS in Buchung ergänzt."],"provided":"08_Loesung_Uebungen_Relationales_Modell.pdf · S. 3","fields":[],"extra":false},{"id":"09-ops","title":"Operationen eines Datenbanksystems","source":"09","pages":[2],"prompt":"<p>Ein Datenbanksystem bietet dem Benutzer die folgenden Operationen zur Modifizierung und Selektion von Daten.<\/p><p>Anlegen von neuen Datensätzen: __________<\/p><p>Ändern von bestehenden Datensätzen: __________<\/p><p>Löschen von veralteten Datensätzen: __________<\/p><p>Abfrage von bestehenden Datensätzen: __________<\/p>","solution":"<p><strong>Eigener ergänzender Lösungsvorschlag mit SQL-Befehlsnamen:<\/strong> Anlegen eines Datensatzes → INSERT. Ändern → UPDATE. Löschen → DELETE. Abfragen → SELECT.<\/p><p>Das Blatt selbst enthält keine ausgefüllten Befehlsnamen. Nicht verwechseln: CREATE TABLE legt eine Tabellenstruktur an; INSERT fügt einen Datensatz in eine bestehende Tabelle ein.<\/p>","scenario":null,"kind":"fields","hints":["Lies den Text zunächst ohne zu zeichnen.","Prüfe jede Beziehung in beiden Leserichtungen.","Kontrolliere anschließend Schlüssel, Attribute und alle Verbindungen."],"rubric":["Alle Teilfragen beantwortet.","Begründung mit der Aufgabenregel verknüpft.","Darstellung mit der Lösung verglichen."],"provided":null,"fields":[{"key":"i","label":"Neue Datensätze","answer":"INSERT","options":null,"explain":""},{"key":"u","label":"Bestehende Datensätze ändern","answer":"UPDATE","options":null,"explain":""},{"key":"d","label":"Datensätze löschen","answer":"DELETE","options":null,"explain":""},{"key":"s","label":"Datensätze abfragen","answer":"SELECT","options":null,"explain":""}],"extra":false},{"id":"10-erm","title":"E-DRIVE · Kundenstatus und Standort","source":"10","pages":[1],"prompt":"<p>Die E-DRIVE GmbH bietet in deutschen Großstädten Car-Sharing mit strombetriebenen Fahrzeugen von Toyota, Renault und Mitsubishi an.\nEin einmal registrierter Kunde wird je nach Häufigkeit in einen bestimmten Kundenstatus eingruppiert und verfügt über einen individuellen Login-Zugang, um online Mietverträge (Vertrag-ID, Abholtermin, Rückgabetermin, Mietkaution) abschließen zu können. In einem Mietvertrag können ein oder mehrere Fahrzeuge enthalten sein, während ein Fahrzeug im Laufe der Zeit immer in mehreren Mietverträgen enthalten ist. Bei der E-DRIVE GmbH ist jedes Fahrzeug genau einer Preisgruppe zugeordnet und jeweils an einem festgelegten Standort mit vielen Parkzellen (Parkplatz-ID, Straße, PLZ, Ort) abgestellt.<\/p><p>Erstellen Sie aus der vorliegenden Informationsstruktur ein zusammenhängendes ER-Modell.<\/p>","solution":"{{erm:u-edrive-standort}}{{readings:u-edrive-standort}}<p>Die Original-Rückseite zeigt sieben Entitätstypen: Login-Zugang, Kunde, Kundenstatus, Mietvertrag, Fahrzeug, Preisgruppe und Standort. Vertrag-ID, Abholtermin, Rückgabetermin und Mietkaution beschreiben den Mietvertrag. Parkplatz-ID, Straße, PLZ und Ort sind in dieser Vorlage dem Standort zugeordnet.<\/p><p>Die Ergänzung eines eigenen Typs Parkzelle oder zusätzlicher IDs wäre eine neue Modellierungsannahme. Die hier gezeigte Lösung hält sich an die Rückseite.<\/p><p>Der zentrale Unterschied zu Blatt 06: Ein Standort kann viele Fahrzeuge aufnehmen. Deshalb Standort 1:n Fahrzeug. In Blatt 06 besitzt dagegen jedes Fahrzeug genau einen eigenen festen Parkplatz.<\/p>","scenario":"u-edrive-standort","kind":"erm","hints":["Lies den Text zunächst ohne zu zeichnen.","Prüfe jede Beziehung in beiden Leserichtungen.","Kontrolliere anschließend Schlüssel, Attribute und alle Verbindungen."],"rubric":["Sieben Entitätstypen wie auf der Rückseite.","Sechs Beziehungen vorhanden.","Kundenstatus und Login-Zugang nicht vergessen.","Mietvertrag – Fahrzeug m:n; Standort – Fahrzeug 1:n.","Originalattribute am passenden Typ."],"provided":"10. Übung ERM.pdf · Rückseite, S. 2","fields":[],"extra":false},{"id":"x-lernwerkstatt","title":"Probeklausur · Lernwerkstatt","source":"extra","pages":[],"prompt":"<p>Eine Lernwerkstatt verwaltet Teilnehmer mit Teilnehmer-Nr., Name und Vorname sowie Workshops mit Workshop-Nr., Thema und Datum. Ein Teilnehmer kann mehrere Workshops besuchen. Ein Workshop kann mehrere Teilnehmer haben. Für jede Kombination aus Teilnehmer und Workshop wird das Anmeldedatum gespeichert. Ein Teilnehmer wird pro Workshop nur einmal angemeldet. Jeder Workshop findet in genau einem Raum statt. Ein Raum kann für mehrere Workshops genutzt werden. Zu einem Raum werden Raum-Nr. und Bezeichnung gespeichert. Jeder Teilnehmer besitzt genau einen Werkstattausweis. Jeder Ausweis gehört genau einem Teilnehmer. Zum Ausweis werden Ausweis-Nr. und Ausstellungsdatum gespeichert. Die Ausweisdaten bleiben in einer eigenen Relation.<\/p><p>Erstelle zuerst das semantische ER-Modell und danach auf einem zweiten Blatt das relationale Datenmodell. Kennzeichne Primär- und Fremdschlüssel und begründe jede Beziehung in beiden Leserichtungen.<\/p>","solution":"{{erm:x-lernwerkstatt}}{{schema:x-lernwerkstatt}}{{readings:x-lernwerkstatt}}<div class=\"callout \">Zusätzlich erstellte Prüfungssimulation. Keine Originalaufgabe der Schule.<\/div>","scenario":"x-lernwerkstatt","kind":"both","hints":["Lies den Text zunächst ohne zu zeichnen.","Prüfe jede Beziehung in beiden Leserichtungen.","Kontrolliere anschließend Schlüssel, Attribute und alle Verbindungen."],"rubric":["Alle Teilfragen beantwortet.","Begründung mit der Aufgabenregel verknüpft.","Darstellung mit der Lösung verglichen."],"provided":null,"fields":[],"extra":true},{"id":"x-veranstaltung","title":"Probeklausur · zwei m:n-Beziehungen","source":"extra","pages":[],"prompt":"<p>Ein Veranstaltungsdienst verwaltet Kunden (Kunden-Nr., Name) und Aufträge (Auftrags-Nr., Datum). Ein Kunde kann mehrere Aufträge erteilen; jeder Auftrag gehört genau einem Kunden. Ein Auftrag kann mehrere Geräte enthalten; ein Gerät kann in mehreren Aufträgen vorkommen. Geräte besitzen eine Geräte-Nr. und eine Bezeichnung. Für jedes Paar aus Auftrag und Gerät wird die Menge gespeichert. Das Paar darf nur einmal vorkommen. Zusätzlich werden Techniker (Techniker-Nr., Name) gespeichert. Ein Techniker kann an mehreren Aufträgen arbeiten. An einem Auftrag können mehrere Techniker arbeiten. Für jedes Paar aus Auftrag und Techniker werden die geleisteten Stunden gespeichert. Auch dieses Paar darf nur einmal vorkommen.<\/p><p>Erstelle zuerst das semantische ER-Modell und danach auf einem zweiten Blatt das relationale Datenmodell. Kennzeichne Primär- und Fremdschlüssel und begründe jede Beziehung in beiden Leserichtungen.<\/p>","solution":"{{erm:x-veranstaltung}}{{schema:x-veranstaltung}}{{readings:x-veranstaltung}}<div class=\"callout \">Zusätzlich erstellte Prüfungssimulation mit zwei unabhängig aufzulösenden m:n-Beziehungen.<\/div><div class=\"callout \">Menge steht in Auftragsposition. Stunden stehen in Einsatz. Eine einzige große Zuordnungstabelle würde ungenannte Zuordnungen zwischen Gerät und Techniker behaupten.<\/div>","scenario":"x-veranstaltung","kind":"both","hints":["Lies den Text zunächst ohne zu zeichnen.","Prüfe jede Beziehung in beiden Leserichtungen.","Kontrolliere anschließend Schlüssel, Attribute und alle Verbindungen."],"rubric":["Alle Teilfragen beantwortet.","Begründung mit der Aufgabenregel verknüpft.","Darstellung mit der Lösung verglichen."],"provided":null,"fields":[],"extra":true}],"quiz":[{"id":"sq1","topic":"grundlagen","question":"Woraus besteht das Datenbanksystem im Unterrichtsdiagramm?","options":["DBMS und Datenbasis","Nur aus der Bildschirmmaske","Nur aus einer einzelnen Tabelle"],"answer":0,"explain":"Das DBMS verwaltet den Datenbestand. DBMS und Datenbasis bilden das Datenbanksystem."},{"id":"sq2","topic":"grundlagen","question":"Was ist Datenkontrolle?","options":["Zugangs- und Zugriffsrechte prüfen","Den Namen eines Kunden ändern","Alle Tabellen ausdrucken"],"answer":0,"explain":"Datenkontrolle begrenzt den Zugang und Zugriff auf berechtigte Personen."},{"id":"sq3","topic":"grundlagen","question":"Welche Operation fügt einen Datensatz in eine vorhandene Tabelle ein?","options":["SELECT","INSERT","CREATE TABLE"],"answer":1,"explain":"INSERT fügt eine Zeile ein. CREATE TABLE definiert eine Tabellenstruktur."},{"id":"sq4","topic":"phasen","question":"In welcher Phase zeichnest du das ER-Modell?","options":["Informationsstruktur","Semantisches Datenmodell","Implementierung"],"answer":1,"explain":"Das semantische Modell beschreibt die fachlichen Gegenstände und ihre Beziehungen."},{"id":"sq5","topic":"phasen","question":"Was entsteht nach dem Unterrichtsskript zunächst bei der Implementierung?","options":["Eine leere Datenbank mit definierter Struktur","Eine fertige Jahresrechnung","Nur ein ERM auf Papier"],"answer":0,"explain":"Das Schema legt die Struktur und Integritätsregeln fest. Datensätze folgen danach."},{"id":"sq6","topic":"phasen","question":"Was ist ein Output der Auftragsverwaltung?","options":["Eine Kundenrechnung","Nur die Kundennummer","Nur die Produktnummer"],"answer":0,"explain":"Eine Rechnung ist ein gewünschtes Ergebnis. Kunden- und Produktdaten sind benötigte Eingaben."},{"id":"sq7","topic":"entitaeten","question":"Was ist eine konkrete Entität?","options":["Der Typ Kunde","Der konkrete Kunde mit Kunden-ID 3","Das Merkmal Ort"],"answer":1,"explain":"Eine Entität ist eine eindeutig identifizierbare einzelne Einheit."},{"id":"sq8","topic":"entitaeten","question":"Was gehört als Attributname in die Ellipse?","options":["Bosch Automotive AG","Name","Alle Kunden"],"answer":1,"explain":"Name ist das Merkmal. Bosch Automotive AG ist ein möglicher Wert."},{"id":"sq9","topic":"entitaeten","question":"Welche Form bekommt der Entitätstyp Lieferant?","options":["Raute","Ellipse","Rechteck"],"answer":2,"explain":"Entitätstypen werden als Rechtecke mit einem Substantiv im Singular dargestellt."},{"id":"sq10","topic":"beziehungen","question":"Reicht das gemeinsame Auftreten von Kunde und Produkt im Text für eine zusätzliche direkte Beziehung?","options":["Ja, alle Rechtecke werden verbunden","Nein, es muss eine fachliche Zuordnung beschrieben sein","Ja, sofern beide eine ID haben"],"answer":1,"explain":"Das Modell soll die benötigten Zuordnungen speichern. Verbindungen werden nicht allein aus Wortnähe abgeleitet."},{"id":"sq11","topic":"beziehungen","question":"arbeitet in und leitet verbinden dieselben Typen. Wie viele Rauten brauchst du?","options":["Keine","Eine","Zwei"],"answer":2,"explain":"Die beiden Beziehungen haben unterschiedliche Bedeutungen und können unterschiedliche Kardinalitäten haben."},{"id":"sq12","topic":"beziehungen","question":"Welche Beschriftung passt nach der Checkliste in die Raute?","options":["Zuordnung","gehört zu","Artikelgruppe"],"answer":1,"explain":"Eine Beziehung wird mit einem Verb beschrieben."},{"id":"sq13","topic":"kardinalitaeten","question":"Ein Kunde erteilt mehrere Aufträge. Wo steht die Antwort n in der Schulnotation?","options":["Bei Kunde","Bei Auftrag","In einer Attributellipse"],"answer":1,"explain":"Du fixierst einen Kunden und zählst die Aufträge. Die Antwort steht beim Ziel der Frage, also bei Auftrag."},{"id":"sq14","topic":"kardinalitaeten","question":"Ein Auftrag gehört genau einem Kunden. Wo steht deshalb die 1?","options":["Bei Kunde","Bei Auftrag","Immer links unten"],"answer":0,"explain":"Die Antwort betrifft die Anzahl der Kunden je Auftrag. Sie steht bei Kunde."},{"id":"sq15","topic":"kardinalitaeten","question":"Ein Datensatzbeispiel zeigt einen Auftrag je Kunde. Beweist das 1:1?","options":["Ja","Nein, die allgemeine Regel kann weitere Aufträge erlauben","Nur wenn die IDs Zahlen sind"],"answer":1,"explain":"Kardinalitäten beschreiben erlaubte Zuordnungen, nicht nur die momentan vorhandenen Zeilen."},{"id":"sq16","topic":"schluessel","question":"Warum ist FIN im Blatt ein natürlicher Schlüssel?","options":["Weil Menschen sie nie vergeben","Weil sie als eindeutiges fachliches Fahrzeugmerkmal schon vorhanden ist","Weil natürliche Schlüssel immer Buchstaben enthalten"],"answer":1,"explain":"Natürlich bedeutet im Datenmodell fachlich vorhanden. Es bedeutet nicht ohne menschliche Vergabe."},{"id":"sq17","topic":"schluessel","question":"Ist Name + Vorname automatisch ein geeigneter zusammengesetzter Schlüssel?","options":["Ja, es sind zwei Attribute","Nein, auch die Kombination muss garantiert eindeutig sein","Nur wenn beide unterstrichen sind"],"answer":1,"explain":"Ein Paar aus Name und Vorname kann bei verschiedenen Personen gleich sein. Unterstreichen erzeugt keine fachliche Eindeutigkeit."},{"id":"sq18","topic":"schluessel","question":"Wie viele Primärschlüssel hat Auftragsposition mit Auftrags-ID und Produkt-ID?","options":["Zwei unabhängige","Einen zusammengesetzten","Keinen, weil beide auch Fremdschlüssel sind"],"answer":1,"explain":"Die beiden Spalten bilden gemeinsam genau einen Primärschlüssel. Zusätzlich ist jede Spalte eine Referenz."},{"id":"sq19","topic":"lesen","question":"Was verbindet die Linie im relationalen Modell laut Arbeitsblatt?","options":["Nur beliebige Kastenränder","Eine FS-Zeile mit der passenden PS-Zeile","Jedes Attribut mit jeder Tabelle"],"answer":1,"explain":"Die Verbindung muss auf die zusammengehörenden Schlüssel zeigen."},{"id":"sq20","topic":"lesen","question":"Welche Kennzeichnung bekommt ein Schlüsselbestandteil in der Zuordnungstabelle?","options":["Nur FS, nie PS","Unterstrichener Attributname und (PS, FS)","Nur ein farbiger Kreis"],"answer":1,"explain":"Beide Referenzen sind zugleich Bestandteile des gemeinsamen Primärschlüssels."},{"id":"sq21","topic":"lesen","question":"Was bleibt im relationalen Modell nicht als ERM-Form bestehen?","options":["Relationskasten","Beziehungsraute","Attributname"],"answer":1,"explain":"Die Beziehung wird über Schlüssel und Verbindungslinien umgesetzt, nicht als Raute."},{"id":"sq22","topic":"relationen","question":"Kunde 1:n Auftrag: Wohin kommt Kunden-ID als FS?","options":["In Auftrag","In Kunde nochmals als zweite ID","In eine Liste im Kundenkasten"],"answer":0,"explain":"Die n-Seite speichert den FS. Jeder Auftrag verweist auf seinen einen Kunden."},{"id":"sq23","topic":"relationen","question":"Was verhindert bei Kunde 1:1 Login-Zugang mehrere Zugänge je Kunde?","options":["Ein eindeutiger Kunden-FS in Login-Zugang","Eine beliebige zweite Login-ID","Die Farbe des Kastens"],"answer":0,"explain":"Der Kundenwert darf in Login-Zugang nur einmal vorkommen."},{"id":"sq24","topic":"relationen","question":"Ist ein wiederholter Kunden-FS in mehreren Aufträgen automatisch schädliche Redundanz?","options":["Ja, alle Werte müssen global eindeutig sein","Nein, wiederholt wird der Verweis, nicht der vollständige Kundenname und die Adresse","Ja, wenn er eine Zahl ist"],"answer":1,"explain":"Die eigentlichen Kundendaten stehen einmal in Kunde. Mehrere Aufträge referenzieren denselben Datensatz."},{"id":"sq25","topic":"mn","question":"Wie viele neue Relationen erzeugt eine einfache m:n-Beziehung zusätzlich?","options":["Keine","Eine Zuordnungstabelle","Immer zwei Tabellen"],"answer":1,"explain":"Eine neue Relation speichert die beiden Referenzen und eventuell die Beziehungsattribute."},{"id":"sq26","topic":"mn","question":"Welche neue Zeile verletzt den PS, wenn 70 | 2 schon existiert?","options":["70 | 1","71 | 2","70 | 2"],"answer":2,"explain":"Nur das vollständige Paar muss eindeutig sein. Einzelne Bestandteile dürfen sich wiederholen."},{"id":"sq27","topic":"mn","question":"Wo steht Anmeldedatum bei Mitglied m:n Kurs?","options":["Nur in Mitglied","Nur in Kurs","In Kursanmeldung"],"answer":2,"explain":"Das Datum gehört zur Anmeldung eines konkreten Mitglieds an einem konkreten Kurs."},{"id":"sq28","topic":"text","question":"Was machst du bei einer nicht genannten Identifikation?","options":["Den Namen ohne Begründung für eindeutig erklären","Eine Ergänzung als Annahme kennzeichnen","Die Entität immer weglassen"],"answer":1,"explain":"Nicht genannte Regeln werden nicht als Originalvorgaben ausgegeben."},{"id":"sq29","topic":"text","question":"Du sollst aus einem Text ein relationales Modell erstellen. Was ist sinnvoll?","options":["Beziehungen gedanklich bestimmen, dann die Abbildungsregeln anwenden","Sofort alle Objekte in eine gemeinsame Tabelle schreiben","m:n als Raute im Tabellenmodell stehen lassen"],"answer":0,"explain":"Auch ohne abgegebenes ERM brauchst du die Beziehungen und Kardinalitäten als Grundlage für die Übersetzung."},{"id":"sq30","topic":"text","question":"Wie kontrollierst du die fertige Lösung?","options":["Nur die Anzahl der Kästen zählen","Jeden wichtigen Satz des Texts gegen das Modell prüfen","Nur prüfen, ob alles symmetrisch aussieht"],"answer":1,"explain":"Die Darstellung muss die Fachregeln und Attribute abbilden; reine Optik reicht nicht."},{"id":"sq31","topic":"fehler","question":"Lieferant-ID steht direkt in Artikel, obwohl ein Artikel mehrere Lieferanten hat. Was fehlt?","options":["Eine Zuordnungstabelle Lieferant_Artikel","Ein zweiter Name in Artikel","Ein größerer Zeichenbereich"],"answer":0,"explain":"Ein einzelner Lieferantenwert je Artikel bildet nicht mehrere Lieferanten desselben Artikels ab."},{"id":"sq32","topic":"fehler","question":"Welche konkrete Folge hat ein FS auf der falschen 1-Seite?","options":["Die zulässigen Mehrfachzuordnungen lassen sich nicht sauber als einzelne Werte speichern","Nur die Schrift wird unlesbar","Es ändert sich fachlich nichts"],"answer":0,"explain":"Bei vielen Aufträgen je Kunde würde eine einzelne Auftrags-ID im Kundenkasten nicht genügen."},{"id":"sq33","topic":"fehler","question":"Was ist im ERM „Bosch Automotive AG“ statt „Name“?","options":["Eine Verwechslung von Attribut und Attributwert","Eine alternative Kardinalität","Ein zusammengesetzter Primärschlüssel"],"answer":0,"explain":"Das Modell benennt das Merkmal. Ein bestimmter Firmenname ist ein Wert dieses Merkmals."},{"id":"sq34","topic":"komplex","question":"Welche Aussage entspricht Blatt 10, nicht der festen Parkplatzregel aus Blatt 06?","options":["Ein Standort kann viele Fahrzeuge aufnehmen","Jeder Parkplatz ist genau einem Fahrzeug zugeordnet","Beide Blätter verwenden dieselbe Standortregel"],"answer":0,"explain":"Blatt 10 zeigt Standort 1:n Fahrzeug. Blatt 06 beschreibt die feste 1:1-Zuordnung zu Parkplatz."},{"id":"sq35","topic":"komplex","question":"Auftrag m:n Gerät und Auftrag m:n Techniker. Was entsteht?","options":["Eine einzige Pflicht-Dreiertabelle","Zwei getrennte Zuordnungstabellen","Kein zusätzlicher Kasten"],"answer":1,"explain":"Die zwei Beziehungen sind unabhängig. Eine Dreiertabelle würde eine weitere fachliche Verknüpfung behaupten."},{"id":"sq36","topic":"komplex","question":"Warum hat eine Behandlung in der offenen Praxislösung eine eigene Nummer?","options":["Damit Arzt keine ID braucht","Damit derselbe Patient denselben Arzt mehrfach besuchen kann","Damit alle Termine dasselbe Datum haben"],"answer":1,"explain":"Die eigene Nummer identifiziert den einzelnen wiederholbaren Vorgang, nicht nur das Personenpaar."}],"cards":[{"id":"sk1","title":"Mitarbeiter besitzt Werksausweis","left":"Mitarbeiter","right":"Werksausweis","ca":"0,1","cb":"0,1","text":"Ein Mitarbeiter besitzt einen Werksausweis. Ein Werksausweis gehört einem Mitarbeiter.","tip":"Die Antwort auf „ein Mitarbeiter → wie viele Werksausweis?“ steht im Diagramm bei Werksausweis.","level":1,"source":"06 · S. 2","relationship":"besitzt"},{"id":"sk2","title":"Kunde erteilt Auftrag","left":"Kunde","right":"Auftrag","ca":"0,n","cb":"0,1","text":"Ein Kunde erteilt mehrere Aufträge. Ein Auftrag stammt von einem Kunden.","tip":"Die Antwort auf „ein Kunde → wie viele Auftrag?“ steht im Diagramm bei Auftrag.","level":1,"source":"06 · S. 2","relationship":"erteilt"},{"id":"sk3","title":"Auftrag enthält Produkt","left":"Auftrag","right":"Produkt","ca":"0,n","cb":"0,n","text":"Ein Auftrag enthält mehrere Produkte. Ein Produkt kommt in mehreren Aufträgen vor.","tip":"Die Antwort auf „ein Auftrag → wie viele Produkt?“ steht im Diagramm bei Produkt.","level":1,"source":"06 · S. 2","relationship":"enthält"},{"id":"sk4","title":"Abteilung beschäftigt Mitarbeiter","left":"Abteilung","right":"Mitarbeiter","ca":"0,n","cb":"0,1","text":"Eine Abteilung beschäftigt mehrere Mitarbeiter. Ein Mitarbeiter arbeitet in einer Abteilung.","tip":"Die Antwort auf „ein Abteilung → wie viele Mitarbeiter?“ steht im Diagramm bei Mitarbeiter.","level":1,"source":"06 · S. 2","relationship":"beschäftigt"},{"id":"sk5","title":"Fahrzeug steht auf Parkplatz","left":"Fahrzeug","right":"Parkplatz","ca":"0,1","cb":"0,1","text":"Ein Fahrzeug steht auf einem festen Parkplatz. Der betrachtete Parkplatz ist für genau ein Fahrzeug vorgesehen.","tip":"Die Antwort auf „ein Fahrzeug → wie viele Parkplatz?“ steht im Diagramm bei Parkplatz.","level":1,"source":"06 · S. 2","relationship":"steht auf"},{"id":"sk6","title":"Mitarbeiter besucht Fortbildung","left":"Mitarbeiter","right":"Fortbildung","ca":"0,n","cb":"0,n","text":"Ein Mitarbeiter besucht mehrere Fortbildungen. Eine Fortbildung wird von mehreren Mitarbeitern besucht.","tip":"Die Antwort auf „ein Mitarbeiter → wie viele Fortbildung?“ steht im Diagramm bei Fortbildung.","level":1,"source":"06 · S. 2","relationship":"besucht"}],"glossary":[["Entität","Eine konkrete, eindeutig identifizierbare Einheit, zum Beispiel Kunde mit Kunden-ID 3."],["Entitätstyp","Die gemeinsame Beschreibung gleichartiger Entitäten. Im ERM der Typname im Rechteck, zum Beispiel Kunde."],["Entitätsmenge","Die Menge konkreter Entitäten eines Typs, zum Beispiel alle gespeicherten Kunden."],["Attribut","Ein Merkmal eines Entitäts- oder Beziehungstyps, zum Beispiel Name oder Menge."],["Attributwert","Ein konkreter Wert, zum Beispiel „Bosch AG“ für das Attribut Kundenname."],["Beziehungstyp","Ein fachlicher Zusammenhang zwischen Entitätstypen; im ERM eine Raute mit einem Verb."],["Kardinalität","Die erlaubte Anzahl von Beziehungspartnern. In der Schulnotation wird die Antwort beim Ziel der Leserichtung notiert."],["Primärschlüssel (PS)","Der ausgewählte eindeutige Identifikator einer Zeile. Er kann aus mehreren Attributen gemeinsam bestehen und darf nicht fehlen."],["Fremdschlüssel (FS)","Ein Verweis auf den Schlüssel einer anderen oder derselben Relation. Mehrere Zeilen dürfen in einer 1:n-Beziehung denselben FS-Wert besitzen."],["Natürlicher Schlüssel","Ein bereits fachlich vorhandenes eindeutiges Merkmal, zum Beispiel FIN im Fahrzeugmodell."],["Künstlicher Schlüssel","Eine nur zur Identifikation zusätzlich eingeführte Kennung, zum Beispiel Kunden-ID."],["Zusammengesetzter Schlüssel","Mehrere Attribute bilden gemeinsam genau einen Schlüssel. Die gesamte Kombination muss eindeutig sein."],["Zuordnungstabelle","Eine Relation, die eine m:n-Beziehung mit zwei Referenzen abbildet; häufig bildet das Paar den gemeinsamen PS."],["Beziehungsattribut","Eine Eigenschaft der konkreten Zuordnung, zum Beispiel Menge je Auftrag und Produkt."],["Relation","Der Tabellenbauplan im relationalen Modell. In den Unterrichtszeichnungen: ein Kasten mit Name und Attributzeilen."],["Datensatz","Eine konkrete gespeicherte Zeile; im relationalen Modell auch Tupel genannt."],["Datenbank / Datenbasis","Der strukturierte Datenbestand eines Datenbanksystems."],["DBMS","Datenbankmanagementsystem: die Software zur Verwaltung der Datenbasis und ihrer Zugriffe."],["Datenbanksystem","DBMS und Datenbasis zusammen."],["Informationsstruktur","Die strukturierte Beschreibung der benötigten Informationen, Eingaben, Ausgaben und fachlichen Zusammenhänge."],["Semantisches Datenmodell","Fachliches Modell der Bedeutung der Daten; hier das ER-Modell."],["Logisches Datenmodell","Bauplan für die spätere Umsetzung; hier das relationale Datenmodell."],["Datenbank-Schema","Die implementierte Struktur und ihre Regeln; nach dem Unterrichtsblatt zunächst eine leere Datenbank."],["Redundanz","Mehrfache Speicherung derselben beschreibenden Information. Wiederholte Referenzwerte sind nicht automatisch schädliche Redundanz."],["Datenkontrolle","Regelung von Zugangs- und Zugriffsrechten."],["Input und Output","Input sind benötigte Eingaben. Output sind gewünschte Ergebnisse und Benutzersichten."],["1:n","Ein A kann mehreren B zugeordnet sein; jedes B gehört höchstens einem A."],["m:n","Auf beiden Seiten sind mehrere Partner erlaubt; m und n bedeuten jeweils „mehrere“."],["1:1","Auf beiden Seiten ist höchstens ein Partner erlaubt. Pflichtteilnahme muss aus dem Text hervorgehen."],["Referenzielle Integrität","Ein vorhandener, nicht leerer Fremdschlüsselwert muss einen passenden vorhandenen Zielschlüssel treffen."],["UNIQUE","Technischer Zusatz: Eine Spalte oder Spaltengruppe muss eindeutig sein."],["Min-Max-Notation","Zusatznotation für minimale und maximale Teilnahme. Die lokale Lesart ist nicht die Zahlenplatzierung der Unterrichtsnotation."]]};

makeSchema=function(s){if(!s.school)return oldMakeSchema(s);const sc={tables:[]},map={};for(const e of s.model.entities){if(!e.attrs.some(a=>a.key))throw new Error('Die Originalaufgabe nennt nicht für alle Entitätstypen einen Schlüssel. Ergänze solche IDs in einem eigenen Entwurf ausdrücklich als Annahme.');const t={id:uid(),name:e.name,cols:e.attrs.map(a=>column(a.name,{pk:a.key,nn:true})),uniqueGroups:[]};map[e.id]=t;sc.tables.push(t);}
 function ref(owner,target,r,unique=false,prefix=''){const ks=target.cols.filter(c=>c.pk);const g=uid();return ks.map(k=>{let name=prefix||k.name;if(owner.cols.some(c=>norm(c.name)===norm(name)))name=r.name.replace(/\s+/g,'')+'-'+name;const c=column(name,{pk:false,nn:true,unique:unique&&ks.length===1,refTable:target.id,refCol:k.id,type:k.type,fkGroup:ks.length>1?g:''});owner.cols.push(c);return c;});}
 for(const r of s.model.relations){let a=map[r.a],b=map[r.b],am=maxOf(r.ca),bm=maxOf(r.cb),owner;if(am==='n'&&bm==='n'){owner={id:uid(),name:r.table||a.name+'_'+b.name,cols:[],uniqueGroups:[]};sc.tables.push(owner);[...ref(owner,a,r),...ref(owner,b,r)].forEach(c=>c.pk=true);}else if(am==='n'&&bm==='1'){owner=b;ref(b,a,r);}else if(am==='1'&&bm==='n'){owner=a;ref(a,b,r);}else{const explicit=s.fkOwners?.[r.id];owner=explicit?map[explicit]:(r.cb.startsWith('1')?b:a);const target=owner===a?b:a;const cs=ref(owner,target,r,true,s.id==='u-personal-leitung'&&r.id==='leitet'?'Leiter-Personal-Nr.':'');if(cs.length>1)owner.uniqueGroups.push(cs.map(c=>c.id));}for(const at of r.attrs||[])owner.cols.push(column(at.name,{nn:true}));}

/* Orthogonal path routing avoids passing through relation boxes. */
function routeOrthogonal(start,end,boxes){

 const X=[...new Set(xs)].sort((a,b)=>a-b),Y=[...new Set(ys)].sort((a,b)=>a-b),xi=X.indexOf(start.x),yi=Y.indexOf(start.y),xe=X.indexOf(end.x),ye=Y.indexOf(end.y);

 while(q.length&&count++<13000){q.sort((a,b)=>(a.g+Math.abs(X[a.i]-end.x)+Math.abs(Y[a.j]-end.y))-(b.g+Math.abs(X[b.i]-end.x)+Math.abs(Y[b.j]-end.y)));const a=q.shift();if(a.i===xe&&a.j===ye)return a.path;for(const [di,dj,dir] of [[-1,0,1],[1,0,1],[0,-1,2],[0,1,2]]){const i=a.i+di,j=a.j+dj;if(i<0||j<0||i>=X.length||j>=Y.length||!clear(X[a.i],Y[a.j],X[i],Y[j]))continue;const g=a.g+Math.abs(X[i]-X[a.i])+Math.abs(Y[j]-Y[a.j])+(a.dir&&a.dir!==dir?25:0),key=i+','+j+','+dir;if((best.get(key)??Infinity)<=g)continue;best.set(key,g);q.push({i,j,dir,g,path:a.path.concat([[X[i],Y[j]]])});}}

function schoolSchema(sc,s=null,{id='school-schema',highlight='',empty=false,interactive=false}={}){

 const boxes=sc.tables.map((t,i)=>{const pp=s?.schemaPositions?.[t.name];let x=pp?.[0]??(45+(i%4)*350),y=pp?.[1]??(60+Math.floor(i/4)*390);const w=270,h=53+Math.max(1,t.cols.length)*31;return {t,x,y,w,h};});
 let minX=Math.min(0,...boxes.map(b=>b.x-40)),minY=Math.min(0,...boxes.map(b=>b.y-40)),maxX=Math.max(...boxes.map(b=>b.x+b.w+90)),maxY=Math.max(...boxes.map(b=>b.y+b.h+60)),paths=[],nodes=[];

 for(const b of boxes){nodes.push(`<g><rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="white" stroke="#303846" stroke-width="1.7"/><rect x="${b.x}" y="${b.y}" width="${b.w}" height="36" fill="#edf0f4" stroke="#303846" stroke-width="1.7"/>${stxt(b.x+13,b.y+25,b.t.name,19,'font-weight="700"')}${b.t.cols.map(c=>{const y=rowY(b,c),label=empty?'':c.name,key=c.pk,fs=!!c.refTable;return `<g ${interactive?`data-school="focus-ref" data-col="${c.id}" tabindex="0" role="button" aria-label="${esc(b.t.name+'.'+c.name)}${key?' Primärschlüssel':''}${fs?' Fremdschlüssel':''}"`:""}>${highlight===c.id?`<rect x="${b.x+1}" y="${y-22}" width="${b.w-2}" height="30" fill="#eee9ff"/>`:''}<text x="${b.x+13}" y="${y}" font-size="17" font-family="Arial,Helvetica,sans-serif" fill="#232933"><tspan ${key?'text-decoration="underline" font-weight="600"':fs?'font-style="italic"':''}>${esc(label)}</tspan><tspan font-size="14">${!empty&&(key||fs)?' ('+(key&&fs?'PS, FS':key?'PS':'FS')+')':''}</tspan></text></g>`;}).join('')}</g>`);}
