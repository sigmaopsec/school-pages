alstaat","Ein Sozialstaat verpflichtet sich, soziale Gerechtigkeit und soziale Sicherheit für seine Bürger zu fördern, beispielsweise durch soziale Sicherungssysteme."],["Republik","Eine Republik ist eine Staatsform, in der die Staatsgewalt vom Volk ausgeht und die politischen Amtsträger für eine bestimmte Zeit gewählt werden. Die Legitimation der Herrschaft basiert somit auf dem Staatsvolk."]]},{"id":"ewigkeit","title":"Seite 2 · Artikel 79 GG – Ewigkeitsklausel","text":"Die in Artikel 1 und Artikel 20 GG verankerten Grundsätze dürfen auch durch eine Änderung des Grundgesetzes nicht abgeschafft oder in ihrem Wesensgehalt verändert werden."},{"id":"rechte","title":"Seite 2 · Grundrechte","text":"Die Grundrechte stehen in Artikel 1 bis 19 GG. Die Menschenwürde ist ihre Basis. Menschenrechte gelten für alle Menschen, Bürgerrechte nur für Deutsche. Wichtig sind persönliche Freiheit, Gleichheit, Grundrechtsverwirkung nach Artikel 18 sowie Einschränkungen und Rechtsweg nach Artikel 19."},{"id":"laender","title":"Seite 2 · Bundesländer mit Hauptstädten","text":"Berlin, Bremen und Hamburg sind im Original als Stadtstaaten gekennzeichnet.","table":[["Bundesland","Hauptstadt"],["Baden-Württemberg","Stuttgart"],["Bayern","München"],["Berlin","Berlin"],["Brandenburg","Potsdam"],["Bremen","Bremen"],["Hamburg","Hamburg"],["Hessen","Wiesbaden"],["Mecklenburg-Vorpommern","Schwerin"],["Niedersachsen","Hannover"],["Nordrhein-Westfalen","Düsseldorf"],["Rheinland-Pfalz","Mainz"],["Saarland","Saarbrücken"],["Sachsen","Dresden"],["Sachsen-Anhalt","Magdeburg"],["Schleswig-Holstein","Kiel"],["Thüringen","Erfurt"]]},{"id":"nachweise","title":"Seite 2 · Quellenangaben des Blatts","text":"Bundeszentrale für politische Bildung. (2020). Grundbegriffe der Politik. Bonn: bpb.\n\nGrundgesetz für die Bundesrepublik Deutschland. (2022). München: C.H. Beck.\n\nBundesministerium des Innern und für Heimat. (2023). Staat und Verfassung in Deutschland."}]},{"id":"digital","title":"Grundrechte · digitaler Tag","original":"Grundrechte unter Druck Info Gruppenaufgaben.pdf · 9 Seiten","note":"Textfassung deiner Unterlage mit neu gesetzten Tabellen. Alle sieben Originalfälle sind enthalten. Die Musterlösungen stehen in den Lernbereichen und sind eigene Ausarbeitungen, keine bestätigten Lösungen der Lehrkraft.","sections":[{"id":"ziele","title":"Seite 1 · Freiheit, Sicherheit und Verantwortung","text":"Lernziele\n\nIch erläutere Grundrechte, Grundrechtsbindung sowie Eingriffe, Schranken und Schranken-Schranken.\n\nIch prüfe einen staatlichen Eingriff anhand der Verhältnismäßigkeit.\n\nIch unterscheide gesicherte Informationen von strittigen Bewertungen und vergleiche Quellen.\n\nIch vertrete eine begründete, respektvolle Position in einem Grundrechtskonflikt."},{"id":"info","title":"Seite 1 · Grundrechte verstehen","text":"Grundrechte stehen in Art. 1 bis 19 Grundgesetz (GG). Sie schützen Freiheit, Gleichheit und Würde und begrenzen staatliche Macht. Menschenrechte gelten für alle Menschen; Deutschengrundrechte nur für Deutsche. Der Staat muss Grundrechte nicht nur respektieren, sondern Menschen in bestimmten Konstellationen auch schützen.","table":[["Begriff","Kernidee","Beispiel"],["Menschenwürde (Art. 1 GG)","Jede Person ist gleichwertig; der Staat darf sie nicht zum bloßen Mittel machen.","Keine erniedrigende Behandlung."],["Freiheitsrechte","Sie schützen Handeln, Kommunikation und Privatleben.","Meinung äußern; sich versammeln; Daten schützen."],["Gleichheit (Art. 3 GG)","Diskriminierung ist verboten; Vergleichbares ist gleich zu behandeln.","Keine Benachteiligung wegen Herkunft oder Behinderung."],["Justizgrundrechte","Sie sichern faire rechtsstaatliche Verfahren.","Rechtliches Gehör."]]},{"id":"bindung","title":"Seite 1 · Grundrechtsbindung","text":"Art. 1 Abs. 3 GG bindet Gesetzgebung, vollziehende Gewalt und Rechtsprechung unmittelbar. Staatliches Handeln braucht eine Grundlage und muss Grundrechte beachten. Private sind nicht gleich unmittelbar gebunden; Grundrechte wirken jedoch mittelbar, wenn Gerichte etwa Verträge oder Hausordnungen auslegen."},{"id":"begriffe","title":"Seiten 1 und 2 · Eingriff, Schranke, Schranken-Schranke","text":"","table":[["Schritt","Leitfrage","Merksatz"],["Eingriff","Beeinträchtigt staatliches Handeln einen Schutzbereich?","Zuerst Wirkung auf das Recht klären."],["Schranke","Darf das Recht nach GG oder Gesetz begrenzt werden?","Viele Rechte gelten nicht grenzenlos."],["Schranken-Schranke","Hält die Begrenzung selbst Grenzen ein?","Gesetz, Bestimmtheit, Wesensgehalt und Verhältnismäßigkeit zählen."]]},{"id":"vier","title":"Seite 2 · Verhältnismäßigkeit: Vier Stufen","text":"Wichtig: Ein legitimes Ziel erlaubt nicht automatisch jede Maßnahme. Erst die Prüfung aller vier Stufen zeigt, ob sie verhältnismäßig ist.","table":[["Stufe","Prüffrage","Satzstarter"],["1. Legitimer Zweck","Welches Ziel wird verfolgt?","Der Zweck, … zu schützen, ist legitim."],["2. Geeignetheit","Kann die Maßnahme fördern?","Sie kann beitragen, weil …"],["3. Erforderlichkeit","Gibt es ein gleich wirksames milderes Mittel?","Milder wäre …; es wäre (nicht) gleich wirksam, weil …"],["4. Angemessenheit","Wie schwer wiegt Eingriff gegenüber Nutzen?","Der Eingriff wiegt …; der Nutzen …; daher …"]]},{"id":"auftrag","title":"Seiten 3 bis 9 · Gemeinsamer Arbeitsauftrag","text":"Der folgende Arbeitsauftrag steht auf jeder der sieben Fallkarten. Er wird hier einmal vollständig wiedergegeben.\n\n1. Analysiert: Ordnet mindestens zwei Grundrechte zu und erklärt den Konflikt.\n\n2. Untersucht: Trennt Fakten von offenen Fragen.\n\n3. Bewertet: Prüft die Maßnahme mit Pro/Contra und – soweit staatlich – Verhältnismäßigkeit.\n\n4. Entwickelt einen Kompromiss oder eine Alternative.\n\n5. Beurteilt abschließend in 100–150 Wörtern."},{"id":"fall1","title":"Seite 3 · Fallkarte 1 · Gesichtserkennung am Bahnhof","text":"Unterrichtsfall\n\nSituation\nEine Stadt plant einen sechswöchigen Test mit Gesichtserkennung am Bahnhof, um Personen mit Haftbefehl zu finden. Bilder ohne Treffer sollen rasch gelöscht werden.\n\nOffene / umstrittene Punkte und Perspektiven\nReicht die Grundlage? Ist anlassloses Scannen erforderlich? Sicherheitsbehörde betont Schutz; Reisende befürchten Generalverdacht; Datenschutz fordert Transparenz.\n\nArbeitsauftrag: Die fünf gemeinsamen Arbeitsaufträge dieser Unterlage gelten auch für diese Fallkarte.","table":[["Beteiligte","Betroffene Grundrechte","Gesicherte Fakten"],["Stadt/Polizei; Reisende; Gesuchte; Datenschutzaufsicht.","Informationelle Selbstbestimmung; ggf. Freizügigkeit; Schutz von Leben und körperlicher Unversehrtheit.","Testzeit und Zweck sind genannt. Datenbasis, Fehlerquote und Rechtsgrundlage sind offen."]]},{"id":"fall2","title":"Seite 4 · Fallkarte 2 · Demonstration und Auflagen","text":"Unterrichtsfall\n\nSituation\nFür eine große Klimademonstration ordnet die Behörde eine andere Route, frühere Endzeit und ein Gegenstandsverbot an. Sie verweist auf Rettungswege und erwartete Gegenproteste.\n\nOffene / umstrittene Punkte und Perspektiven\nWie konkret ist die Gefahr? Ist die Ersatzroute wirksam? Demonstrierende betonen Sichtbarkeit; Behörde Schutz und Rettungswege; Anwohnende Belastung.\n\nArbeitsauftrag: Die fünf gemeinsamen Arbeitsaufträge dieser Unterlage gelten auch für diese Fallkarte.","table":[["Beteiligte","Betroffene Grundrechte","Gesicherte Fakten"],["Versammlungsleitung; Teilnehmende; Anwohnende; Polizei/Rettungsdienste.","Versammlungsfreiheit; Meinungsfreiheit; körperliche Unversehrtheit.","Friedliche Versammlung ist angezeigt; Rettungswege müssen frei bleiben; Auflagen sind erlassen."]]},{"id":"fall3","title":"Seite 5 · Fallkarte 3 · Klassenchat, Meme und Persönlichkeitsrecht","text":"Recherchefall\n\nSituation\nIm Klassenchat wird ein bearbeitetes, abwertendes Bild einer Mitschülerin weitergeleitet. Die Schule erwägt pädagogische Maßnahmen und eine befristete Einschränkung der Chatnutzung auf Schulgeräten.\n\nOffene / umstrittene Punkte und Perspektiven\nMeinung, Schmähung oder Mobbing? Welche Zuständigkeit hat die Schule? Betroffene fordert Schutz; Postende Person verweist evtl. auf „Witz“; Schule muss aufklären und schützen.\n\nArbeitsauftrag: Die fünf gemeinsamen Arbeitsaufträge dieser Unterlage gelten auch für diese Fallkarte.","table":[["Beteiligte","Betroffene Grundrechte","Gesicherte Fakten"],["Betroffene Schülerin; postende/weiterleitende Lernende; Schule; Eltern.","Allgemeines Persönlichkeitsrecht; Meinungsfreiheit; Würdeschutz.","Ein bearbeitetes Bild wurde verbreitet. Reichweite, Urheberschaft und Kontext sind zu klären."]]},{"id":"fall4","title":"Seite 6 · Fallkarte 4 · Smartphone-Regel","text":"Unterrichtsfall\n\nSituation\nEine Schule untersagt private Smartphone-Nutzung im Unterricht. Bei Wiederholung wird das Gerät bis Unterrichtsende verwahrt. Ein Kurs verlangt Ausnahmen für medizinische Apps, Übersetzung und Notfälle.\n\nOffene / umstrittene Punkte und Perspektiven\nIst die Regel klar und gleich? Reichen Handyparkplatz oder Stummschaltung? Lehrkraft: Konzentration; Lernende: Eigenverantwortung; Person mit Bedarf: notwendige Ausnahme.\n\nArbeitsauftrag: Die fünf gemeinsamen Arbeitsaufträge dieser Unterlage gelten auch für diese Fallkarte.","table":[["Beteiligte","Betroffene Grundrechte","Gesicherte Fakten"],["Lernende; Lehrkräfte; Schulleitung; Eltern.","Allgemeine Handlungsfreiheit; Kommunikation; Recht auf Bildung und Schutz der Lernumgebung.","Es geht um Unterrichtszeit und befristetes Verwahren; Konzentration ist Ziel; besondere Bedarfe können bestehen."]]},{"id":"fall5","title":"Seite 7 · Fallkarte 5 · Gesundheitsdaten und Jugendcamp","text":"Recherchefall\n\nSituation\nEin Veranstalter erwägt freiwillige Gesundheitsangaben für ein Jugendcamp, um Infektionsrisiken zu senken. Ohne Angaben könnten zusätzliche Schutzmaßnahmen gelten.\n\nOffene / umstrittene Punkte und Perspektiven\nIst die Angabe freiwillig? Welche Daten sind nötig? Vulnerable Person betont Schutz und Teilhabe; Teilnehmende den Datenschutz; Veranstalter Verantwortung.\n\nArbeitsauftrag: Die fünf gemeinsamen Arbeitsaufträge dieser Unterlage gelten auch für diese Fallkarte.","table":[["Beteiligte","Betroffene Grundrechte","Gesicherte Fakten"],["Teilnehmende; Veranstalter; medizinische Beratung; vulnerable Personen.","Informationelle Selbstbestimmung; körperliche Unversehrtheit; Gleichheit; Handlungsfreiheit.","Gesundheitsdaten sind sensibel; Infektionsschutz ist Zweck. Rechtsgrundlage und Datenverarbeitung sind zu recherchieren."]]},{"id":"fall6","title":"Seite 8 · Fallkarte 6 · Religionsausdruck und Neutralität","text":"Unterrichtsfall\n\nSituation\nEine Schülerin möchte an einer öffentlichen Schule ein sichtbares religiöses Symbol tragen. Die Schule diskutiert eine Kleidungsregel; konkrete Störungen sind nicht dokumentiert.\n\nOffene / umstrittene Punkte und Perspektiven\nReichweite der Neutralität gegenüber Lernenden? Verbot ohne Gefahr angemessen? Schülerin: Identität; Schule: Gleichbehandlung; Klasse: Vielfalt und friedliches Lernen.\n\nArbeitsauftrag: Die fünf gemeinsamen Arbeitsaufträge dieser Unterlage gelten auch für diese Fallkarte.","table":[["Beteiligte","Betroffene Grundrechte","Gesicherte Fakten"],["Schülerin; Klasse; Lehrkräfte; Schulleitung.","Religionsfreiheit; Persönlichkeitsentfaltung; Gleichheit; staatliche Neutralität.","Öffentliche Schule und sichtbares Symbol sind gegeben; konkrete Störung ist nicht festgestellt."]]},{"id":"fall7","title":"Seite 9 · Fallkarte 7 · Moderation eines Online-Kommentars","text":"Recherchefall\n\nSituation\nEine kommunale Social-Media-Seite verbirgt einen scharfen kritischen Kommentar. Die Kommune verweist auf Netiquette gegen Beleidigungen und Desinformation; die kommentierende Person verlangt Begründung.\n\nOffene / umstrittene Punkte und Perspektiven\nWerturteil oder Tatsachenbehauptung? Regeln vorhersehbar und gleich angewandt? Person: Kritik braucht Raum; Kommune: Schutz der Debatte; Publikum: transparente Moderation.\n\nArbeitsauftrag: Die fünf gemeinsamen Arbeitsaufträge dieser Unterlage gelten auch für diese Fallkarte.","table":[["Beteiligte","Betroffene Grundrechte","Gesicherte Fakten"],["Kommune; kommentierende Person; andere Nutzende; Plattform.","Meinungsfreiheit; Gleichbehandlung; ggf. Persönlichkeitsrechte.","Kommentar wurde verborgen, Netiquette existiert; Wortlaut und Moderationspraxis müssen geprüft werden."]]}]},{"id":"auszug","title":"Grundgesetz zum Nachschlagen","original":"Auszug GG.pdf · 6 Seiten","note":"Gesetzeswortlaut aus deinem hochgeladenen Auszug. Er ist nicht in einfache Sprache umgeschrieben und wird nicht automatisch aktualisiert. Artikel 12a setzt sich auf Seite 4 fort. Artikel 20 steht im Quellenbereich „Grundwissen“. Zu Artikel 79 enthält dieses Material nur die Erklärung im Grundwissen.","sections":[{"id":"art1","title":"Artikel 1 GG · Seite 1","text":"(1) Die Würde des Menschen ist unantastbar. Sie zu achten und zu schützen ist Verpflichtung aller staatlichen Gewalt.\n\n(2) Das Deutsche Volk bekennt sich darum zu unverletzlichen und unveräußerlichen Menschenrechten als Grundlage jeder menschlichen Gemeinschaft, des Friedens und der Gerechtigkeit in der Welt.\n\n(3) Die nachfolgenden Grundrechte binden Gesetzgebung, vollziehende Gewalt und Rechtsprechung als unmittelbar geltendes Recht."},{"id":"art2","title":"Artikel 2 GG · Seite 1","text":"(1) Jeder hat das Recht auf die freie Entfaltung seiner Persönlichkeit, soweit er nicht die Rechte anderer verletzt und nicht gegen die verfassungsmäßige Ordnung oder das Sittengesetz verstößt.\n\n(2) Jeder hat das Recht auf Leben und körperliche Unversehrtheit. Die Freiheit der Person ist unverletzlich. In diese Rechte darf nur auf Grund eines Gesetzes eingegriffen werden."},{"id":"art3","title":"Artikel 3 GG · Seite 1","text":"(1) Alle Menschen sind vor dem Gesetz gleich.\n\n(2) Männer und Frauen sind gleichberechtigt. Der Staat fördert die tatsächliche Durchsetzung der Gleichberechtigung von Frauen und Männern und wirkt auf die Beseitigung bestehender Nachteile hin.\n\n(3) Niemand darf wegen seines Geschlechtes, seiner Abstammung, seiner Rasse, seiner Sprache, seiner Heimat und Herkunft, seines Glaubens, seiner religiösen oder politischen Anschauungen benachteiligt oder bevorzugt werden. Niemand darf wegen seiner Behinderung benachteiligt werden."},{"id":"art4","title":"Artikel 4 GG · Seite 1","text":"(1) Die Freiheit des Glaubens, des Gewissens und die Freiheit des religiösen und weltanschaulichen Bekenntnisses sind unverletzlich.\n\n(2) Die ungestörte Religionsausübung wird gewährleistet.\n\n(3) Niemand darf gegen sein Gewissen zum Kriegsdienst mit der Waffe gezwungen werden. Das Nähere regelt ein Bundesgesetz."},{"id":"art5","title":"Artikel 5 GG · Seite 1","text":"(1) Jeder hat das Recht, seine Meinung in Wort, Schrift und Bild frei zu äußern und zu verbreiten und sich aus allgemein zugänglichen Quellen ungehindert zu unterrichten. Die Pressefreiheit und die Freiheit der Berichterstattung durch Rundfunk und Film werden gewährleistet. Eine Zensur findet nicht statt.\n\n(2) Diese Rechte finden ihre Schranken in den Vorschriften der allgemeinen Gesetze, den gesetzlichen Bestimmungen zum Schutze der Jugend und in dem Recht der persönlichen Ehre.\n\n(3) Kunst und Wissenschaft, Forschung und Lehre sind frei. Die Freiheit der Lehre entbindet nicht von der Treue zur Verfassung."},{"id":"art6","title":"Artikel 6 GG · Seite 2","text":"(1) Ehe und Familie stehen unter dem besonderen Schutze der staatlichen Ordnung.\n\n(2) Pflege und Erziehung der Kinder sind das natürliche Recht der Eltern und die zuvörderst ihnen obliegende Pflicht. Über ihre Betätigung wacht die staatliche Gemeinschaft.\n\n(3) Gegen den Willen der Erziehungsberechtigten dürfen Kinder nur auf Grund eines Gesetzes von der Familie getrennt werden, wenn die Erziehungsberechtigten versagen oder wenn die Kinder aus anderen Gründen zu verwahrlosen drohen.\n\n(4) Jede Mutter hat Anspruch auf den Schutz und die Fürsorge der Gemeinschaft.\n\n(5) Den unehelichen Kindern sind durch die Gesetzgebung die gleichen Bedingungen für ihre leibliche und seelische Entwicklung und ihre Stellung in der Gesellschaft zu schaffen wie den ehelichen Kindern."},{"id":"art7","title":"Artikel 7 GG · Seite 2","text":"(1) Das gesamte Schulwesen steht unter der Aufsicht des Staates.\n\n(2) Die Erziehungsberechtigten haben das Recht, über die Teilnahme des Kindes am Religionsunterricht zu bestimmen.\n\n(3) Der Religionsunterricht ist in den öffentlichen Schulen mit Ausnahme der bekenntnisfreien Schulen ordentliches Lehrfach. Unbeschadet des staatlichen Aufsichtsrechtes wird der Religionsunterricht in Übereinstimmung mit den Grundsätzen der Religionsgemeinschaften erteilt. Kein Lehrer darf gegen seinen Willen verpflichtet werden, Religionsunterricht zu erteilen.\n\n(4) Das Recht zur Errichtung von privaten Schulen wird gewährleistet. Private Schulen als Ersatz für öffentliche Schulen bedürfen der Genehmigung des Staates und unterstehen den Landesgesetzen. Die Genehmigung ist zu erteilen, wenn die privaten Schulen in ihren Lehrzielen und Einrichtungen sowie in der wissenschaftlichen Ausbildung ihrer Lehrkräfte nicht hinter den öffentlichen Schulen zurückstehen und eine Sonderung der Schüler nach den Besitzverhältnissen der Eltern nicht gefördert wird. Die Genehmigung ist zu versagen, wenn die wirtschaftliche und rechtliche Stellung der Lehrkräfte nicht genügend gesichert ist.\n\n(5) Eine private Volksschule ist nur zuzulassen, wenn die Unterrichtsverwaltung ein besonderes pädagogisches Interesse anerkennt oder, auf Antrag von Erziehungsberechtigten, wenn sie als Gemeinschaftsschule, als Bekenntnis- oder Weltanschauungsschule errichtet werden soll und eine öffentliche Volksschule dieser Art in der Gemeinde nicht besteht.\n\n(6) Vorschulen bleiben aufgehoben."},{"id":"art8","title":"Artikel 8 GG · Seite 2","text":"(1) Alle Deutschen haben das Recht, sich ohne Anmeldung oder Erlaubnis friedlich und ohne Waffen zu versammeln.\n\n(2) Für Versammlungen unter freiem Himmel kann dieses Recht durch Gesetz oder auf Grund eines Gesetzes beschränkt werden."},{"id":"art9","title":"Artikel 9 GG · Seite 2","text":"(1) Alle Deutschen haben das Recht, Vereine und Gesellschaften zu bilden.\n\n(2) Vereinigungen, deren Zwecke oder deren Tätigkeit den Strafgesetzen zuwiderlaufen oder die sich gegen die verfassungsmäßige Ordnung oder gegen den Gedanken der Völkerverständigung richten, sind verboten.\n\n(3) Das Recht, zur Wahrung und Förderung der Arbeits- und Wirtschaftsbedingungen Vereinigungen zu bilden, ist für jedermann und für alle Berufe gewährleistet. Abreden, die dieses Recht einschränken oder zu behindern suchen, sind nichtig, hierauf gerichtete Maßnahmen sind rechtswidrig. Maßnahmen nach den Artikeln 12a, 35 Abs. 2 und 3, Artikel 87a Abs. 4 und Artikel 91 dürfen sich nicht gegen Arbeitskämpfe richten, die zur Wahrung und Förderung der Arbeits- und Wirtschaftsbedingungen von Vereinigungen im Sinne des Satzes 1 geführt werden."},{"id":"art10","title":"Artikel 10 GG · Seite 3","text":"(1) Das Briefgeheimnis sowie das Post- und Fernmeldegeheimnis sind unverletzlich.\n\n(2) Beschränkungen dürfen nur auf Grund eines Gesetzes angeordnet werden. Dient die Beschränkung dem Schutze der freiheitlichen demokratischen Grundordnung oder des Bestandes oder der Sicherung des Bundes oder eines Landes, so kann das Gesetz bestimmen, daß sie dem Betroffenen nicht mitgeteilt wird und daß an die Stelle des Rechtsweges die Nachprüfung durch von der Volksvertretung bestellte Organe und Hilfsorgane tritt."},{"id":"art11","title":"Artikel 11 GG · Seite 3","text":"(1) Alle Deutschen genießen Freizügigkeit im ganzen Bundesgebiet.\n\n(2) Dieses Recht darf nur durch Gesetz oder auf Grund eines Gesetzes und nur für die Fälle eingeschränkt werden, in denen eine ausreichende Lebensgrundlage nicht vorhanden ist und der Allgemeinheit daraus besondere Lasten entstehen würden oder in denen es zur Abwehr einer drohenden Gefahr für den Bestand oder die freiheitliche demokratische Grundordnung des Bundes oder eines Landes, zur Bekämpfung von Seuchengefahr, Naturkatastrophen oder besonders schweren Unglücksfällen, zum Schutze der Jugend vor Verwahrlosung oder um strafbaren Handlungen vorzubeugen, erforderlich ist."},{"id":"art12","title":"Artikel 12 GG · Seite 3","text":"(1) Alle Deutschen haben das Recht, Beruf, Arbeitsplatz und Ausbildungsstätte frei zu wählen. Die Berufsausübung kann durch Gesetz oder auf Grund eines Gesetzes geregelt werden.\n\n(2) Niemand darf zu einer bestimmten Arbeit gezwungen werden, außer im Rahmen einer herkömmlichen allgemeinen, für alle gleichen öffentlichen Dienstleistungspflicht.\n\n(3) Zwangsarbeit ist nur bei einer gerichtlich angeordneten Freiheitsentziehung zulässig."},{"id":"art12a","title":"Artikel 12a GG · Seite 3","text":"(1) Männer können vom vollendeten achtzehnten Lebensjahr an zum Dienst in den Streitkräften, im Bundesgrenzschutz oder in einem Zivilschutzverband verpflichtet werden.\n\n(2) Wer aus Gewissensgründen den Kriegsdienst mit der Waffe verweigert, kann zu einem Ersatzdienst verpflichtet werden. Die Dauer des Ersatzdienstes darf die Dauer des Wehrdienstes nicht übersteigen. Das Nähere regelt ein Gesetz, das die Freiheit der Gewissensentscheidung nicht beeinträchtigen darf und auch eine Möglichkeit des Ersatzdienstes vorsehen muß, die in keinem Zusammenhang mit den Verbänden der Streitkräfte und des Bundesgrenzschutzes steht.\n\n(3) Wehrpflichtige, die nicht zu einem Dienst nach Absatz 1 oder 2 herangezogen sind, können im Verteidigungsfalle durch Gesetz oder auf Grund eines Gesetzes zu zivilen Dienstleistungen für Zwecke der Verteidigung einschließlich des Schutzes der Zivilbevölkerung in Arbeitsverhältnisse verpflichtet werden; Verpflichtungen in öffentlich-rechtliche Dienstverhältnisse sind nur zur Wahrnehmung polizeilicher Aufgaben oder solcher hoheitlichen Aufgaben der öffentlichen Verwaltung, die nur in einem öffentlich-rechtlichen Dienstverhältnis erfüllt werden können, zulässig. Arbeitsverhältnisse nach Satz 1 können bei den Streitkräften, im Bereich ihrer Versorgung sowie bei der öffentlichen Verwaltung begründet werden; Verpflichtungen in Arbeitsverhältnisse im Bereiche der Versorgung der Zivilbevölkerung sind nur zulässig, um ihren lebensnotwendigen Bedarf zu decken oder ihren Schutz sicherzustellen.\n\n(4) Kann im Verteidigungsfalle der Bedarf an zivilen Dienstleistungen im zivilen Sanitäts- und Heilwesen sowie in der ortsfesten militärischen Lazarettorganisation nicht auf freiwilliger Grundlage gedeckt werden, so können Frauen vom vollendeten achtzehnten bis zum vollendeten fünfundfünfzigsten Lebensjahr durch Gesetz oder auf Grund eines Gesetzes zu derartigen Dienstleistungen herangezogen werden. Sie dürfen auf keinen Fall zum Dienst mit der Waffe verpflichtet werden.\n\n(5) Für die Zeit vor dem Verteidigungsfalle können Verpflichtungen nach Absatz 3 nur nach Maßgabe des Artikels 80a Abs. 1 begründet werden. Zur Vorbereitung auf Dienstleistungen nach Absatz 3, für die besondere Kenntnisse oder Fertigkeiten erforderlich sind, kann durch Gesetz oder auf Grund eines Gesetzes die Teilnahme an Ausbildungsveranstaltungen zur Pflicht gemacht werden. Satz 1 findet insoweit keine Anwendung.\n\n(6) Kann im Verteidigungsfalle der Bedarf an Arbeitskräften für die in Absatz 3 Satz 2 genannten Bereiche auf freiwilliger Grundlage nicht gedeckt werden, so kann zur Sicherung dieses Bedarfs die Freiheit der Deutschen, die Ausübung eines Berufs oder den Arbeitsplatz aufzugeben, durch Gesetz oder auf Grund eines Gesetzes eingeschränkt werden. Vor Eintritt des Verteidigungsfalles gilt Absatz 5 Satz 1 entsprechend."},{"id":"art13","title":"Artikel 13 GG · Seite 4","text":"(1) Die Wohnung ist unverletzlich.\n\n(2) Durchsuchungen dürfen nur durch den Richter, bei Gefahr im Verzuge auch durch die in den Gesetzen vorgesehenen anderen Organe angeordnet und nur in der dort vorgeschriebenen Form durchgeführt werden.\n\n(3) Begründen bestimmte Tatsachen den Verdacht, daß jemand eine durch Gesetz einzeln bestimmte besonders schwere Straftat begangen hat, so dürfen zur Verfolgung der Tat auf Grund richterlicher Anordnung technische Mittel zur akustischen Überwachung von Wohnungen, in denen der Beschuldigte sich vermutlich aufhält, eingesetzt werden, wenn die Erforschung des Sachverhalts auf andere Weise unverhältnismäßig erschwert oder aussichtslos wäre. Die Maßnahme ist zu befristen. Die Anordnung erfolgt durch einen mit drei Richtern besetzten Spruchkörper. Bei Gefahr im Verzuge kann sie auch durch einen einzelnen Richter getroffen werden.\n\n(4) Zur Abwehr dringender Gefahren für die öffentliche Sicherheit, insbesondere einer gemeinen Gefahr oder einer Lebensgefahr, dürfen technische Mittel zur Überwachung von Wohnungen nur auf Grund richterlicher Anordnung eingesetzt werden. Bei Gefahr im Verzuge kann die Maßnahme auch durch eine andere gesetzlich bestimmte Stelle angeordnet werden; eine richterliche Entscheidung ist unverzüglich nachzuholen.\n\n(5) Sind technische Mittel ausschließlich zum Schutze der bei einem Einsatz in Wohnungen tätigen Personen vorgesehen, kann die Maßnahme durch eine gesetzlich bestimmte Stelle angeordnet werden. Eine anderweitige Verwertung der hierbei erlangten Erkenntnisse ist nur zum Zwecke der Strafverfolgung oder der Gefahrenabwehr und nur zulässig, wenn zuvor die Rechtmäßigkeit der Maßnahme richterlich festgestellt ist; bei Gefahr im Verzuge ist die richterliche Entscheidung unverzüglich nachzuholen.\n\n(6) Die Bundesregierung unterrichtet den Bundestag jährlich über den nach Absatz 3 sowie über den im Zuständigkeitsbereich des Bundes nach Absatz 4 und, soweit richterlich überprüfungsbedürftig, nach Absatz 5 erfolgten Einsatz technischer Mittel. Ein vom Bundestag gewähltes Gremium übt auf der Grundlage dieses Berichts die parlamentarische Kontrolle aus. Die Länder gewährleisten eine gleichwertige parlamentarische Kontrolle.\n\n(7) Eingriffe und Beschränkungen dürfen im übrigen nur zur Abwehr einer gemeinen Gefahr oder einer Lebensgefahr für einzelne Personen, auf Grund eines Gesetzes auch zur Verhütung dringender Gefahren für die öffentliche Sicherheit und Ordnung, insbesondere zur Behebung der Raumnot, zur Bekämpfung von Seuchengefahr oder zum Schutze gefährdeter Jugendlicher vorgenommen werden.\n\nFußnote Art. 13 Abs. 3: Eingef. durch Art. 1 Nr. 1 G v. 26.3.1998 I 610 mWv 1.4.1998; mit GG Art. 79 Abs. 3 vereinbar gem. BVerfGE v. 3.3.2004 (1 BvR 2378/98, 1 BvR 1084/99)"},{"id":"art14","title":"Artikel 14 GG · Seite 4","text":"(1) Das Eigentum und das Erbrecht werden gewährleistet. Inhalt und Schranken werden durch die Gesetze bestimmt.\n\n(2) Eigentum verpflichtet. Sein Gebrauch soll zugleich dem Wohle der Allgemeinheit dienen.\n\n(3) Eine Enteignung ist nur zum Wohle der Allgemeinheit zulässig. Sie darf nur durch Gesetz oder auf Grund eines Gesetzes erfolgen, das Art und Ausmaß der Entschädigung regelt. Die Entschädigung ist unter gerechter Abwägung der Interessen der Allgemeinheit und der Beteiligten zu bestimmen. Wegen der Höhe der Entschädigung steht im Streitfalle der Rechtsweg vor den ordentlichen Gerichten offen."},{"id":"art15","title":"Artikel 15 GG · Seite 4","text":"Grund und Boden, Naturschätze und Produktionsmittel können zum Zwecke der Vergesellschaftung durch ein Gesetz, das Art und Ausmaß der Entschädigung regelt, in Gemeineigentum oder in andere Formen der Gemeinwirtschaft überführt werden. Für die Entschädigung gilt Artikel 14 Abs. 3 Satz 3 und 4 entsprechend."},{"id":"art16","title":"Artikel 16 GG · Seite 5","text":"(1) Die deutsche Staatsangehörigkeit darf nicht entzogen werden. Der Verlust der Staatsangehörigkeit darf nur auf Grund eines Gesetzes und gegen den Willen des Betroffenen nur dann eintreten, wenn der Betroffene dadurch nicht staatenlos wird.\n\n(2) Kein Deutscher darf an das Ausland ausgeliefert werden. Durch Gesetz kann eine abweichende Regelung für Auslieferungen an einen Mitgliedstaat der Europäischen Union oder an einen internationalen Gerichtshof getroffen werden, soweit rechtsstaatliche Grundsätze gewahrt sind."},{"id":"art16a","title":"Artikel 16a GG · Seite 5","text":"(1) Politisch Verfolgte genießen Asylrecht.\n\n(2) Auf Absatz 1 kann sich nicht berufen, wer aus einem Mitgliedstaat der Europäischen Gemeinschaften oder aus einem anderen Drittstaat einreist, in dem die Anwendung des Abkommens über die Rechtsstellung der Flüchtlinge und der Konvention zum Schutze der Menschenrechte und Grundfreiheiten sichergestellt ist. Die Staaten außerhalb der Europäischen Gemeinschaften, auf die die Voraussetzungen des Satzes 1 zutreffen, werden durch Gesetz, das der Zustimmung des Bundesrates bedarf, bestimmt. In den Fällen des Satzes 1 können aufenthaltsbeendende Maßnahmen unabhängig von einem hiergegen eingelegten Rechtsbehelf vollzogen werden.\n\n(3) Durch Gesetz, das der Zustimmung des Bundesrates bedarf, können Staaten bestimmt werden, bei denen auf Grund der Rechtslage, der Rechtsanwendung und der allgemeinen politischen Verhältnisse gewährleistet erscheint, daß dort weder politische Verfolgung noch unmenschliche oder erniedrigende Bestrafung oder Behandlung stattfindet. Es wird vermutet, daß ein Ausländer aus einem solchen Staat nicht verfolgt wird, solange er nicht Tatsachen vorträgt, die die Annahme begründen, daß er entgegen dieser Vermutung politisch verfolgt wird.\n\n(4) Die Vollziehung aufenthaltsbeendender Maßnahmen wird in den Fällen des Absatzes 3 und in anderen Fällen, die offensichtlich unbegründet sind oder als offensichtlich unbegründet gelten, durch das Gericht nur ausgesetzt, wenn ernstliche Zweifel an der Rechtmäßigkeit der Maßnahme bestehen; der Prüfungsumfang kann eingeschränkt werden und verspätetes Vorbringen unberücksichtigt bleiben. Das Nähere ist durch Gesetz zu bestimmen.\n\n(5) Die Absätze 1 bis 4 stehen völkerrechtlichen Verträgen von Mitgliedstaaten der Europäischen Gemeinschaften untereinander und mit dritten Staaten nicht entgegen, die unter Beachtung der Verpflichtungen aus dem Abkommen über die Rechtsstellung der Flüchtlinge und der Konvention zum Schutze der Menschenrechte und Grundfreiheiten, deren Anwendung in den Vertragsstaaten sichergestellt sein muß, Zuständigkeitsregelungen für die Prüfung von Asylbegehren einschließlich der gegenseitigen Anerkennung von Asylentscheidungen treffen.\n\nFußnote Art. 16a: Eingef. durch Art. 1 Nr. 2 G v. 28.6.1993 I 1002 mWv 30.6.1993; mit Art. 79 Abs. 3 GG (100-1) vereinbar gem. BVerfGE v. 14.5.1996 I 952 (2 BvR 1938/93, 2 BvR 2315/93)"},{"id":"art17","title":"Artikel 17 GG · Seite 5","text":"Jedermann hat das Recht, sich einzeln oder in Gemeinschaft mit anderen schriftlich mit Bitten oder Beschwerden an die zuständigen Stellen und an die Volksvertretung zu wenden."},{"id":"art17a","title":"Artikel 17a GG · Seite 5","text":"(1) Gesetze über Wehrdienst und Ersatzdienst können bestimmen, daß für die Angehörigen der Streitkräfte und des Ersatzdienstes während der Zeit des Wehr- oder Ersatzdienstes das Grundrecht, seine Meinung in Wort, Schrift und Bild frei zu äußern und zu verbreiten (Artikel 5 Abs. 1 Satz 1 erster Halbsatz), das Grundrecht der Versammlungsfreiheit (Artikel 8) und das Petitionsrecht (Artikel 17), soweit es das Recht gewährt, Bitten oder Beschwerden in Gemeinschaft mit anderen vorzubringen, eingeschränkt werden.\n\n(2) Gesetze, die der Verteidigung einschließlich des Schutzes der Zivilbevölkerung dienen, können bestimmen, daß die Grundrechte der Freizügigkeit (Artikel 11) und der Unverletzlichkeit der Wohnung (Artikel 13) eingeschränkt werden."},{"id":"art18","title":"Artikel 18 GG · Seite 6","text":"Wer die Freiheit der Meinungsäußerung, insbesondere die Pressefreiheit (Artikel 5 Abs. 1), die Lehrfreiheit (Artikel 5 Abs. 3), die Versammlungsfreiheit (Artikel 8), die Vereinigungsfreiheit (Artikel 9), das Brief-, Post- und Fernmeldegeheimnis (Artikel 10), das Eigentum (Artikel 14) oder das Asylrecht (Artikel 16a) zum Kampfe gegen die freiheitliche demokratische Grundordnung mißbraucht, verwirkt diese Grundrechte. Die Verwirkung und ihr Ausmaß werden durch das Bundesverfassungsgericht ausgesprochen."},{"id":"art19","title":"Artikel 19 GG · Seite 6","text":"(1) Soweit nach diesem Grundgesetz ein Grundrecht durch Gesetz oder auf Grund eines Gesetzes eingeschränkt werden kann, muß das Gesetz allgemein und nicht nur für den Einzelfall gelten. Außerdem muß das Gesetz das Grundrecht unter Angabe des Artikels nennen.\n\n(2) In keinem Falle darf ein Grundrecht in seinem Wesensgehalt angetastet werden.\n\n(3) Die Grundrechte gelten auch für inländische juristische Personen, soweit sie ihrem Wesen nach auf diese anwendbar sind.\n\n(4) Wird jemand durch die öffentliche Gewalt in seinen Rechten verletzt, so steht ihm der Rechtsweg offen. Soweit eine andere Zuständigkeit nicht begründet ist, ist der ordentliche Rechtsweg gegeben. Artikel 10 Abs. 2 Satz 2 bleibt unberührt."}]},{"id":"lernseite","title":"Ursprüngliche Lernseite","original":"LernstandArt.20Bundeslaender.html · Lesetext","note":"Inhalte der ursprünglichen hochgeladenen Lernseite. Schaltflächen und Programmcode wurden entfernt. Die spätere, erzeugte Lernraum-Datei gilt nicht als Unterrichtsquelle.","sections":[{"id":"grundlagen","title":"Kapitel 1 · Grundlagen","text":"Kapitel 1: Artikel 20 GG und Verfassungsprinzipien\n\nLernziel: Du kannst die zentralen Staatsstrukturprinzipien aus Artikel 20 GG darstellen und voneinander unterscheiden.\n\nArtikel 20 GG in der Sache: Deutschland ist ein demokratischer und sozialer Bundesstaat. Die Staatsgewalt geht vom Volke aus. Sie wird durch Wahlen, Abstimmungen sowie durch besondere Organe der Gesetzgebung, der vollziehenden Gewalt und der Rechtsprechung ausgeübt. Staatliches Handeln ist an Verfassung, Gesetz und Recht gebunden.\n\nRepublik Das Staatsoberhaupt wird nicht dynastisch vererbt. Politische Ämter sind zeitlich begrenzt.\n\nDemokratie Die Staatsgewalt geht vom Volk aus. Wahlen, Parteien und Parlamente sind zentrale Elemente.\n\nSozialstaat Der Staat trägt Verantwortung für sozialen Ausgleich und menschenwürdige Lebensbedingungen.\n\nBundesstaat Deutschland besteht aus dem Bund und 16 Ländern mit eigenen staatlichen Zuständigkeiten.\n\nRechtsstaat Staatliches Handeln ist an Verfassung, Gesetz und Recht gebunden.\n\nGewaltenteilung Gesetzgebung, vollziehende Gewalt und Rechtsprechung werden unterschiedlichen Staatsorganen zugeordnet.\n\nAufgabe 1 · AB I · Operator: Zuordnen\n\nWelches Verfassungsprinzip passt am besten zur Aussage?\n\n„Bundesländer besitzen eigene staatliche Zuständigkeiten und wirken über den Bundesrat an der Bundesgesetzgebung mit.“\n\nDemokratieprinzip\n\nBundesstaatsprinzip\n\nSozialstaatsprinzip\n\nAufgabe 2 · AB II · Operator: Erklären\n\nWelche Aussagen treffen auf das Rechtsstaatsprinzip zu? Wähle alle passenden Aussagen aus.\n\nStaatliche Gewalt ist an Gesetz und Recht gebunden.\n\nDie Regierung darf Gerichtsentscheidungen jederzeit aufheben.\n\nBürgerinnen und Bürger können staatliche Entscheidungen rechtlich überprüfen lassen.\n\nDie Mehrheit darf Grundrechte beliebig abschaffen.\n\nAufgabe 3 · AB II · Operator: Einordnen\n\nWarum spricht man bei Artikel 20 GG von einem besonders geschützten Verfassungskern?\n\nWeil Artikel 20 nur für die Länder gilt.\n\nWeil die Grundsätze aus Artikel 20 durch Artikel 79 Absatz 3 GG besonders geschützt sind.\n\nWeil Artikel 20 ohne gesetzliche Mehrheit geändert werden kann."},{"id":"anwendung","title":"Kapitel 2 · Anwendung","text":"Kapitel 2: Anwendung auf politische Situationen\n\nWende die Verfassungsprinzipien auf konkrete Situationen an. Entscheidend ist nicht nur die Benennung, sondern die Begründung.\n\nFallbeispiel · AB II · Operator: Analysieren\n\nEine Landesregierung erlässt eine Regelung. Betroffene Bürgerinnen und Bürger können dagegen vor unabhängigen Gerichten vorgehen. Ein Gericht hebt die Regelung auf, weil sie gegen ein höherrangiges Gesetz verstößt.\n\nWelche Prinzipien werden hier besonders sichtbar?\n\nRechtsstaatsprinzip und Gewaltenteilung\n\nNur das Sozialstaatsprinzip\n\nAusschließlich das Republikprinzip\n\nFallbeispiel · AB III · Operator: Beurteilen\n\nEine politische Gruppe fordert: „Wenn wir bei einer Wahl die Mehrheit erhalten, dürfen wir alle Gerichte abschaffen und oppositionelle Parteien verbieten.“\n\nWie ist diese Forderung demokratisch und verfassungsrechtlich einzuordnen?\n\nSie ist automatisch zulässig, weil Mehrheiten immer entscheiden.\n\nSie widerspricht dem Rechtsstaatsprinzip, der Gewaltenteilung und dem Schutz der demokratischen Grundordnung.\n\nSie betrifft nur die Verwaltung, nicht die Verfassung.\n\nDarstellung → Anwendung → Rückbezug: Nenne zunächst das einschlägige Prinzip. Wende es anschließend auf die Situation an. Formuliere abschließend, welche Bedeutung dies für die demokratische Ordnung besitzt."},{"id":"laender","title":"Kapitel 3 · Bundesländer","text":"Kapitel 3: Die 16 Bundesländer und ihre Hauptstädte\n\nStadtstaaten sind zugleich Bundesland und Stadt. Bei den Flächenländern ist die Hauptstadt der politische Regierungssitz des Landes.\n\nAufgabe 6 · AB I · Zuordnung\n\nOrdne jedem Bundesland die richtige Hauptstadt zu.\n\nBundesland | Hauptstadt | Besonderheit\n\nBaden-Württemberg | Stuttgart | Flächenland\n\nBayern | München | Freistaat\n\nBerlin | Berlin | Stadtstaat\n\nBrandenburg | Potsdam | Flächenland\n\nBremen | Bremen | Stadtstaat\n\nHamburg | Hamburg | Stadtstaat\n\nHessen | Wiesbaden | Flächenland\n\nMecklenburg-Vorpommern | Schwerin | Flächenland\n\nNiedersachsen | Hannover | Flächenland\n\nNordrhein-Westfalen | Düsseldorf | Flächenland\n\nRheinland-Pfalz | Mainz | Flächenland\n\nSaarland | Saarbrücken | Flächenland\n\nSachsen | Dresden | Freistaat\n\nSachsen-Anhalt | Magdeburg | Flächenland\n\nSchleswig-Holstein | Kiel | Flächenland\n\nThüringen | Erfurt | Freistaat\n\nAufgabe 7 · AB II · Operator: Erklären\n\nWelche Aussage erklärt den Zusammenhang zwischen Artikel 20 Absatz 1 GG und den 16 Bundesländern am besten?\n\nDas Bundesstaatsprinzip verteilt staatliche Zuständigkeiten zwischen Bund und Ländern. Die Länder sind daher nicht bloße Verwaltungsbezirke des Bundes.\n\nDie Länder besitzen keinerlei eigene staatliche Zuständigkeiten.\n\nDas Bundesstaatsprinzip bedeutet, dass jedes Land eine eigene Währung besitzt."}]}]</script>

function paint(root){if(!state.settings.syllables)return;const nodes=[],walk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue.trim()&&!n.parentElement?.closest('script,style,textarea,select,button,.word,.offline,.no-syllables')?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT});while(walk.nextNode())nodes.push(walk.currentNode);for(const n of nodes){const text=n.nodeValue;let at=0,changed=false;const f=document.createDocumentFragment();for(const match of text.matchAll(/[A-Za-zÄÖÜäöüß]+(?:-[A-Za-zÄÖÜäöüß]+)*/g)){const parts=lex.get(match[0].toLocaleLowerCase('de'));if(!parts)continue;changed=true;f.append(text.slice(at,match.index));const word=document.createElement('span');word.className='word';let offset=0;for(let i=0;i<parts.length;i++){const sp=document.createElement('span');sp.className='syllable'+(i%2?' light':'');sp.textContent=match[0].slice(offset,offset+parts[i].length);offset+=parts[i].length;word.append(sp)}f.append(word);at=match.index+match[0].length}if(changed){f.append(text.slice(at));n.replaceWith(f)}}}
function applySettings(repaint=false){const s=state.settings;document.documentElement.style.setProperty('--font',s.font+'px');document.documentElement.style.setProperty('--leading',s.line);document.documentElement.style.setProperty('--spacing',s.spacing?'.035em':'0em');$('#ruler').hidden=!s.ruler;const indicator=$('#home-syllables');if(indicator)indicator.textContent='Silbenfarben '+(s.syllables?'an':'aus');if(repaint){document.querySelectorAll('.word').forEach(n=>n.replaceWith(document.createTextNode(n.textContent)));document.body.normalize();paint(document.body)}}
function table(rows){return`<div class="tablewrap"><table><thead><tr>${rows[0].map(c=>`<th scope="col">${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(row=>`<tr>${row.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function blocks(items){return(items||[]).map(b=>`<section class="readsection">${b.title?`<h3>${esc(b.title)}</h3>`:''}${paras(b.text)}${b.table?table(b.table):''}</section>`).join('')}
function labelRef(ref){const[doc,anchor]=ref.split('#');if(doc==='digital'&&anchor.startsWith('fall')){const n=Number(anchor.slice(4));return`Fallkarte ${n} · Seite ${n+2}`}if(doc==='digital'&&anchor==='vier')return'Infoblatt · vier Stufen · Seite 2';const s=sourceMap.get(doc),part=s?.sections.find(x=>x.id===anchor);return(s?.title||doc)+' · '+(part?.title||'Lesetext')}
function refs(list){return`<div class="refs"><span>Material:</span>${[...new Set(list||[])].map(r=>`<button class="refbtn" data-ref="${esc(r)}">${esc(labelRef(r))}</button>`).join('')}</div>`}
function current(){const v=view(location.hash.slice(1)||state.view);if(v==='start')return{m:null};const[id,stage,index]=v.split('/');return{m:mods.find(m=>m.id===id),stage,index:Number(index)}}
function go(v){const target=view(v);if(location.hash.slice(1)===target)render();else location.hash=target}
function nav(){const{m}=current();$('#nav').innerHTML=`<a class="navitem ${!m?'active':''}" href="#start" ${!m?'aria-current="page"':''}>Übersicht</a>`+['Grundwissen','Hauptteil'].map(g=>`<div class="navgroup">${g}</div>`+mods.filter(m=>m.group===g).map(x=>`<a class="navitem ${m?.id===x.id?'active':''}" href="#${x.id}/learn/0" ${m?.id===x.id?'aria-current="page"':''}><span class="navnum">${String(mods.indexOf(x)+1).padStart(2,'0')}</span><span>${esc(x.short)}</span></a>`).join('')).join('');$('#topic-select').innerHTML='<option value="start">Übersicht</option>'+mods.map(x=>`<option value="${x.id}/learn/0" ${m?.id===x.id?'selected':''}>${esc(x.short)}</option>`).join('');paint($('#nav'))}
const foot=()=>'<footer>Grundlage: deine hochgeladenen Unterlagen. Erklärungen und Musterlösungen: eigene Ausarbeitung. Kein Nachladen aus dem Internet.</footer>';
function home(){return`<div class="eyebrow">Politik und Gesellschaft · deine Unterrichtsmaterialien</div><h1>Dein Lernraum.</h1><p class="lede">Lies die Erklärungen in Ruhe. Schau dir ganze Beispiele an. Löse danach die passenden Aufgaben.</p><div class="meta"><span class="pill">6 belegte Lernbereiche</span><span class="pill">7 Originalfälle</span><span class="pill">30 Aufgaben</span><span class="pill" id="home-syllables">Silbenfarben ${state.settings.syllables?'an':'aus'}</span></div>${['Grundwissen','Hauptteil'].map(g=>`<h2 class="sectiontitle">${g}</h2><div class="cards">${mods.filter(m=>m.group===g).map(m=>`<a class="topiccard" href="#${m.id}/learn/0"><span class="topicindex">${String(mods.indexOf(m)+1).padStart(2,'0')} / ${g}</span><h2>${esc(m.short)}</h2><p>${esc(m.goal)}</p><span class="go">Thema öffnen →</span></a>`).join('')}</div>`).join('')}<div class="notice"><strong>Weniger klicken, vollständig lesen.</strong><p>Erklärungen stehen auf einer durchgehenden Seite. Ein Beispiel oder eine Aufgabe wird immer vollständig angezeigt. „Weiter“ wechselt nur zum nächsten Beispiel oder zur nächsten Aufgabe. Du kannst auch alle fünf untereinander anzeigen.</p></div><section class="gaps"><h2 style="font-size:1.1em">Vier Themen sind noch nicht abgedeckt</h2><p>Bundespräsident, Bundeswirtschaftsministerin, Bundesminister und der Hefteintrag zum Bundesverfassungsgericht stehen in deiner Themenliste. Dazu fehlen passende Unterrichtsinhalte. Diese Fassung ergänzt keinen neuen Prüfungsstoff.</p><details><summary>Welche Unterlagen fehlen?</summary>${D.gaps.map(g=>`<article><h3>${esc(g.title)}</h3><p>${esc(g.text)}</p></article>`).join('')}</details></section><div class="tools"><button class="btn" data-action="sources-open">Unterlagen als Lesetext</button></div><p class="small" id="home-progress" style="margin-top:15px"></p>${foot()}`}
function caseBox(id,full=false){const c=D.cases[id-1];return`<div class="counter">Originalfall · Fallkarte ${c.id} · Seite ${c.sourcePage}</div><div class="scenario">${paras(c.scenario)}</div>${full?`<div class="casefacts"><h3>Angaben unter „Gesicherte Fakten“</h3>${paras(c.facts)}<h3>Offene Punkte und Perspektiven</h3>${paras(c.questions)}</div>`:''}`}
function stages(c){return`<div class="steps4">${c.analysis.map((s,i)=>`<section class="stage"><h3><span class="stagenum" aria-hidden="true">${i+1}</span><span>${esc(s.title)}</span></h3>${paras(s.text)}</section>`).join('')}</div>`}
function analysis(c){return`<section class="readsection"><h3>Einordnung des Konflikts</h3>${paras(c.conflict)}</section>${stages(c)}<section class="readsection"><h3>Ergebnis der Prüfung</h3>${paras(c.result)}</section>`}
function opinion(c){return`<div class="opinion">${paras(c.opinion)}</div><p class="aftertext">${wc(c.opinion)} Wörter · Eine mögliche Beurteilung. Andere Ergebnisse sind möglich, wenn sie am Material nachvollziehbar begründet werden.</p>`}
function example(m,e,i){const c=e.caseId?D.cases[e.caseId-1]:null;let body='';if(e.mode==='four')body=analysis(c);else if(e.mode==='opinion')body=`<h3>Ausformulierter Mustertext</h3>${opinion(c)}<div class="notice"><strong>Was diese Lösung leistet</strong><p>Sie vertritt eine Position, nutzt eine konkrete Quellenangabe und berücksichtigt beide Seiten. Sie nennt eine Alternative und macht deutlich, welche Angaben für das Urteil noch fehlen.</p></div>`;else body=blocks(e.blocks);return`<article class="surface reading" id="example-${i}"><div class="counter">Beispiel ${i+1} von 5 · vollständig erklärt</div><h2>${esc(e.title)}</h2>${c?caseBox(c.id,e.mode==='four'):paras(e.text)}${body}${refs(e.refs||m.refs)}<p class="aftertext">Eigene Ausarbeitung zu den angegebenen Unterrichtsmaterialien.</p></article>`}
function taskModel(t,x){if(!x.model)return'';let body;const c=t.caseId?D.cases[t.caseId-1]:null;if(t.type==='four')body=analysis(c);else if(t.fullCase)body=`<h3>Analyse zum Vergleich mit deinen Notizen</h3>${analysis(c)}<h3 style="margin-top:26px">Abschließende Beurteilung</h3>${opinion(c)}`;else body=blocks(t.model);return`<section class="model reading"><h3 class="modeltitle">Musterlösung · eigene Ausarbeitung</h3>${body}${refs(t.refs)}<div class="criteria"><h3>Deine Lösung selbst prüfen</h3><p class="small">Prüfe deinen eigenen Text. Eine andere Position kann ebenfalls gut begründet sein. Rechtschreibung wird hier nicht automatisch bewertet.</p>${t.criteria.map((c,i)=>`<label class="criterion"><input type="checkbox" data-criterion="${i}" ${x.checks.includes(i)?'checked':''}><span>${esc(c)}</span></label>`).join('')}<button class="btn" data-task-action="review">Als selbst geprüft markieren</button></div></section>`}
function feedback(t,x){if(!x.checked)return'';const yes=correct(t,x);return`<div class="feedback ${yes?'':'bad'}" role="status"><h3>${yes?'Richtig gelöst':'Noch nicht vollständig richtig'}</h3>${paras(t.explanation)}${t.type==='choice'?`<p><strong>Passende ${t.correct.length===1?'Antwort':'Antworten'}:</strong> ${t.correct.map(i=>esc(t.options[i])).join(' ')}</p>`:''}${yes?'':'<p class="small">Du kannst deine Antwort direkt ändern und erneut prüfen.</p>'}</div>`}
function task(m,t,i){const x=ts(t),isWrite=t.type==='writing'||t.type==='four';let fields='';if(t.type==='select')fields=t.pairs.map((p,n)=>`<div class="fieldrow"><label for="${t.id}-${n}">${esc(p.label)}</label><select id="${t.id}-${n}" data-answer="${n}"><option value="">Bitte auswählen</option>${p.options.map(o=>`<option value="${esc(o)}" ${x.answers[n]===o?'selected':''}>${esc(o)}</option>`).join('')}</select><div class="rowfeedback ${x.checked?(x.answers[n]===p.answer?'rightanswer':'wronganswer'):''}">${x.checked?(x.answers[n]===p.answer?'Richtig.':'Richtig ist: '+esc(p.answer)):''}</div></div>`).join('');
 if(t.type==='choice')fields=`<fieldset><legend class="visuallyhidden">${esc(t.prompt)}</legend>${t.options.map((o,n)=>`<label class="option"><input type="${t.correct.length===1?'radio':'checkbox'}" name="${t.id}" data-choice="${n}" ${x.answers.includes(n)?'checked':''}><span>${esc(o)}</span></label>`).join('')}</fieldset>`;
 if(t.type==='four')fields=`<div class="notice">Alle vier Felder gehören zu derselben Prüfung. Du kannst frei nach unten scrollen. Nenne passende Angaben aus der Fallkarte und erkläre ihre Bedeutung.</div>${D.stages.map((h,n)=>`<section class="stage"><h3><span class="stagenum" aria-hidden="true">${n+1}</span><label for="${t.id}-part-${n}">${esc(h)}</label></h3><textarea autocomplete="off" id="${t.id}-part-${n}" data-part="${n}" maxlength="10000" rows="5" placeholder="${esc(['Welches Ziel verfolgt die Maßnahme? Warum ist es zulässig?','Wie kann die Maßnahme das Ziel fördern? Was belegt der Fall?','Welches Mittel wäre milder? Wäre es gleich wirksam?','Wie schwer wiegen Eingriff und Nutzen? Welche Dauer und Ausnahmen sind wichtig?'][n])}">${esc(x.parts[n])}</textarea></section>`).join('')}`;
 if(t.type==='writing')fields=`${t.fullCase?`<div class="instructions"><h3>Die fünf Arbeitsaufträge</h3><ol>${D.orders.map(o=>`<li>${esc(o)}</li>`).join('')}</ol></div><label class="writinglabel" for="${t.id}-notes">Arbeitsnotizen zur Analyse</label><p class="small">Diese Notizen zählen nicht zum Wortlimit der abschließenden Beurteilung.</p><textarea autocomplete="off" id="${t.id}-notes" data-writing="notes" maxlength="20000" rows="7" placeholder="Grundrechte, Fakten, offene Fragen, Pro und Contra, vier Stufen bei staatlichem Handeln, Alternative …">${esc(x.notes)}</textarea>`:''}<label class="writinglabel" for="${t.id}-text">${t.fullCase?'Deine abschließende Beurteilung':'Deine Antwort'}</label><textarea autocomplete="off" id="${t.id}-text" data-writing="text" maxlength="20000" rows="8" placeholder="Schreibe deine begründete Antwort hier.">${esc(x.text)}</textarea><div class="countrow"><span data-count>${wc(x.text)} Wörter</span><span>${t.targetWords?'Ziel: 100 bis 150 Wörter':'Kein festes Wortlimit'}</span></div>`;
 return`<article class="surface reading task" data-task="${t.id}" id="task-${t.id}"><div class="counter">Aufgabe ${i+1} von 5 · ${t.type==='select'?'Zuordnen':t.type==='choice'?'Auswählen':t.type==='four'?'Vier Stufen prüfen':'Begründen'}</div><h2>${esc(t.title)}</h2><p>${esc(t.prompt)}</p>${t.caseId?caseBox(t.caseId,t.type==='four'||t.fullCase):''}${fields}<div class="tools">${isWrite?`<button class="btn primary" data-task-action="model" aria-expanded="${x.model}">${x.model?'Musterlösung schließen':'Musterlösung ansehen'}</button>${t.type==='writing'?'<button class="btn" data-task-action="copy">Antwort kopieren</button>':''}`:'<button class="btn primary" data-task-action="check">Antwort prüfen</button>'}</div><div class="taskfeedback">${isWrite?'':feedback(t,x)}</div><p class="statusnote" ${x.reviewed?'':'hidden'}>${x.reviewed?'Als selbst geprüft markiert. Keine automatische Bewertung des Inhalts.':''}</p>${taskModel(t,x)}${refs(t.refs)}</article>`}
function routePage(m,stage,index){const all=!!state.lists[m.id+'/'+stage];let h=`<div class="eyebrow">${esc(m.group)} · Thema ${mods.indexOf(m)+1} von 6</div><h1>${esc(m.title)}</h1><p class="lede">${esc(m.goal)}</p><nav class="tabs" aria-label="Lernbereich">${[['learn','Lernen'],['examples','5 Beispiele'],['tasks','5 Aufgaben']].map(([s,l])=>`<button class="tab ${stage===s?'active':''}" data-stage="${s}" aria-pressed="${stage===s}">${l}</button>`).join('')}</nav>`;
 if(stage==='learn')return h+`<article class="surface reading">${blocks(m.learn)}${refs(m.refs)}<div class="endnav"><a class="btn quiet" href="#start">← Übersicht</a><button class="btn primary" data-stage="examples">Zu den Beispielen →</button></div></article>`+foot();
 const entries=stage==='examples'?m.examples:m.tasks,label=stage==='examples'?'Beispiel':'Aufgabe';h+=`<div class="toolbar"><div class="indexselect"><label for="item-select">${all?'Auswahl':label}</label><select id="item-select">${entries.map((e,i)=>`<option value="${i}" ${i===index?'selected':''}>${label} ${i+1} von 5</option>`).join('')}</select></div><button class="btn smallbtn" data-action="toggle-list" aria-pressed="${all}">${all?'Einzeln anzeigen':'Alle 5 untereinander'}</button></div>`;
 h+=(all?entries.map((e,i)=>({e,i})):[{e:entries[index],i:index}]).map(({e,i})=>stage==='examples'?example(m,e,i):task(m,e,i)).join('');
 return h+`<nav class="endnav" aria-label="${label} wechseln">${all?`<button class="btn quiet" data-action="page-top">↑ Nach oben</button>`:`<button class="btn quiet" data-action="previous" ${index===0?'disabled':''}>← ${stage==='examples'?'Voriges Beispiel':'Vorige Aufgabe'}</button>`}<button class="btn primary" data-action="next">${all||index===4?(stage==='examples'?'Zu den Aufgaben':'Zur Übersicht'):(stage==='examples'?'Nächstes Beispiel':'Nächste Aufgabe')} →</button></nav>`+foot()}
function render(){const{m,stage,index}=current();state.view=m?`${m.id}/${stage}/${index}`:'start';nav();$('#content').innerHTML=m?routePage(m,stage,index):home();paint($('#content'));save();document.title=m?m.short+' · PuG Lernraum':'PuG Lernraum · Überarbeitete Fassung';window.scrollTo(0,0)}
function replaceTask(id,focus=''){const{m}=current(),t=taskMap.get(id),old=document.getElementById('task-'+id);if(!old||!m)return;const outer=document.createElement('div');outer.innerHTML=task(m,t,m.tasks.indexOf(t));const n=outer.firstElementChild;old.replaceWith(n);paint(n);if(focus)n.querySelector(focus)?.focus({preventScroll:true})}
function invalidate(t,card){const x=ts(t);x.checked=false;x.reviewed=false;card.querySelector('.taskfeedback').replaceChildren();card.querySelectorAll('.rowfeedback').forEach(e=>{e.textContent='';e.className='rowfeedback'});const note=card.querySelector('.statusnote');note.hidden=true;note.textContent='';}
function show(id){const e=document.getElementById(id);if(!e.open)e.showModal()}
function source(ref='grundwissen#art20'){const[doc,anchor]=ref.split('#');sourceId=sourceMap.has(doc)?doc:S[0].id;$('#source-doc').innerHTML=S.map(s=>`<option value="${s.id}" ${s.id===sourceId?'selected':''}>${esc(s.title)}</option>`).join('');renderSource(anchor);show('sources-dialog');requestAnimationFrame(()=>scrollSource(anchor))}
function renderSource(anchor=''){const s=sourceMap.get(sourceId);$('#source-section').innerHTML='<option value="">Ganzes Dokument · Anfang</option>'+s.sections.map(x=>`<option value="${x.id}" ${x.id===anchor?'selected':''}>${esc(x.title)}</option>`).join('');$('#source-body').innerHTML=`<div class="eyebrow">${esc(s.original)}</div><h2>${esc(s.title)}</h2><p class="small">${esc(s.note)}</p><div class="reading">${s.sections.map(x=>`<section class="readsection" id="source-${x.id}"><h3>${esc(x.title)}</h3>${paras(x.text)}${x.table?table(x.table):''}</section>`).join('')}</div>`;paint($('#source-body'));$('#source-body').scrollTop=0}
function scrollSource(anchor){const root=$('#source-body'),e=document.getElementById('source-'+anchor);if(e)root.scrollTop+=e.getBoundingClientRect().top-root.getBoundingClientRect().top-15;else root.scrollTop=0}
function settings(){const s=state.settings;$('#settings-body').innerHTML=`<div class="settingrow"><label for="syllables"><span>Silbenfarben einschalten</span><input id="syllables" data-setting="syllables" type="checkbox" ${s.syllables?'checked':''}></label><p>Standard: aus. Eingeschaltet wechseln dunkles und helleres Grau je Silbe. Jedes Wort beginnt dunkel. Auswahlfelder und Eingabefelder behalten ihre normale Schrift.</p></div><div class="settingrow"><label for="font"><span>Schriftgröße</span> <span id="font-label">${s.font} px</span></label><input id="font" data-setting="font" type="range" min="16" max="28" step="1" value="${s.font}"></div><div class="settingrow"><label for="line"><span>Zeilenabstand</span> <span id="line-label">${s.line.toFixed(2)}</span></label><input id="line" data-setting="line" type="range" min="1.5" max="2.2" step=".05" value="${s.line}"></div><div class="settingrow"><label for="spacing"><span>Mehr Buchstabenabstand</span><input id="spacing" data-setting="spacing" type="checkbox" ${s.spacing?'checked':''}></label></div><div class="settingrow"><label for="ruler-setting"><span>Lesezeile</span><input id="ruler-setting" data-setting="ruler" type="checkbox" ${s.ruler?'checked':''}></label><p>Folgt dem Mauszeiger. Mit Alt und Pfeil nach oben oder unten lässt sie sich verschieben. Auf einem Touchgerät bleibt sie an einer festen Höhe.</p></div><div class="previewline">Demokratie braucht Grundrechte. Wir prüfen die Verhältnismäßigkeit.</div><p class="small" style="margin-top:17px">Die Worttrennhilfe ist vollständig eingebaut. Einzelne Trennungen können von Sprechsilben abweichen. Eigene, unbekannte Wörter bleiben unverändert. Beim Kopieren bleiben die Wörter ganz.</p><div class="tools"><button class="btn" data-action="settings-reset">Leseeinstellungen zurücksetzen</button></div>`;paint($('#settings-body'));show('settings-dialog')}
async function copyAnswer(t){const text=ts(t).text;if(!text.trim()){toast('Schreibe zuerst deine Antwort.');return}try{if(!navigator.clipboard)throw Error();await navigator.clipboard.writeText(text);toast('Antwort kopiert.')}catch(e){const area=document.getElementById(t.id+'-text');area.focus();area.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}toast(ok?'Antwort kopiert.':'Die Antwort ist markiert. Nutze die Kopierfunktion deines Geräts.')}}
function review(t){const x=ts(t);if(t.type==='four'?!x.parts.every(s=>s.trim()):!x.text.trim()){toast(t.type==='four'?'Schreibe zu jeder der vier Stufen deine Begründung.':'Schreibe zuerst deine eigene Antwort.');return}if(t.targetWords&&(wc(x.text)<100||wc(x.text)>150)){toast(`Deine Beurteilung hat ${wc(x.text)} Wörter. Das Ziel sind 100 bis 150 Wörter. Die Notizen zählen nicht dazu.`);return}if(x.checks.length!==t.criteria.length){toast('Prüfe deinen Text mit allen Prüfpunkten. Überarbeite fehlende Teile zuerst.');return}x.reviewed=true;save();replaceTask(t.id,'[data-task-action="review"]');toast('Als selbst geprüft markiert. Der Inhalt wurde nicht automatisch bewertet.')}
document.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;if(b.classList.contains('skip')){e.preventDefault();$('#content').focus();return}if(b.dataset.close){document.getElementById(b.dataset.close).close();return}if(b.dataset.ref){source(b.dataset.ref);return}const{m,stage,index}=current();if(b.dataset.stage&&m){go(`${m.id}/${b.dataset.stage}/0`);return}const action=b.dataset.action;
 if(action==='sources-open')source();if(action==='settings-open')settings();
 if(action==='settings-reset'){state.settings={...D.defaults};applySettings(true);save();settings()}
 if(action==='toggle-list'&&m){const k=m.id+'/'+stage;state.lists[k]=!state.lists[k];save();render()}
 if(action==='page-top')window.scrollTo(0,0);
 if(action==='previous'&&m&&index>0)go(`${m.id}/${stage}/${index-1}`);
 if(action==='next'&&m){if(state.lists[m.id+'/'+stage]||index===4)go(stage==='examples'?`${m.id}/tasks/0`:'start');else go(`${m.id}/${stage}/${index+1}`)}
 if(b.dataset.taskAction){const card=b.closest('[data-task]'),t=taskMap.get(card?.dataset.task);if(!t)return;const x=ts(t),a=b.dataset.taskAction;if(a==='model'){x.model=!x.model;save();replaceTask(t.id,'[data-task-action="model"]')}
  if(a==='check'){if(t.type==='select'&&x.answers.some(s=>!s)){toast('Wähle zuerst in jedem Auswahlfeld eine Antwort.');return}if(t.type==='choice'&&!x.answers.length){toast('Wähle zuerst eine Antwort aus.');return}x.checked=true;save();replaceTask(t.id,'[data-task-action="check"]')}
  if(a==='copy')copyAnswer(t);if(a==='review')review(t);
 }
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.setting){const k=el.dataset.setting;state.settings[k]=el.type==='checkbox'?el.checked:Number(el.value);const repaint=k==='syllables';applySettings(repaint);if(k==='font')$('#font-label').textContent=el.value+' px';if(k==='line')$('#line-label').textContent=Number(el.value).toFixed(2);save();return}const card=el.closest('[data-task]');if(!card)return;const t=taskMap.get(card.dataset.task),x=ts(t);if(el.dataset.writing){x[el.dataset.writing]=el.value;invalidate(t,card);const count=card.querySelector('[data-count]');if(count){const n=wc(x.text);count.textContent=n+' Wörter';count.className=t.targetWords&&n>0&&(n<100||n>150)?'wronganswer':''}save()}else if(el.dataset.part!==undefined){x.parts[Number(el.dataset.part)]=el.value;invalidate(t,card);save()}});
document.addEventListener('change',async e=>{const el=e.target;if(el.id==='topic-select'){go(el.value);return}if(el.id==='item-select'){const{m,stage}=current();if(state.lists[m.id+'/'+stage]){const id=stage==='tasks'?'task-'+m.tasks[Number(el.value)].id:'example-'+el.value;document.getElementById(id)?.scrollIntoView({block:'start'})}else go(`${m.id}/${stage}/${el.value}`);return}if(el.id==='source-doc'){sourceId=el.value;renderSource();return}if(el.id==='source-section'){scrollSource(el.value);return}
 const card=el.closest('[data-task]');if(!card)return;const t=taskMap.get(card.dataset.task),x=ts(t);if(el.dataset.answer!==undefined){x.answers[Number(el.dataset.answer)]=el.value;invalidate(t,card);save()}if(el.dataset.choice!==undefined){x.answers=[...card.querySelectorAll('[data-choice]:checked')].map(e=>Number(e.dataset.choice));invalidate(t,card);save()}if(el.dataset.criterion!==undefined){x.checks=[...card.querySelectorAll('[data-criterion]:checked')].map(e=>Number(e.dataset.criterion));x.reviewed=false;const n=card.querySelector('.statusnote');n.hidden=true;save()}
});
document.addEventListener('mousemove',e=>{if(state.settings.ruler)$('#ruler').style.top=Math.max(0,e.clientY-18)+'px'});
document.addEventListener('keydown',e=>{if(state.settings.ruler&&e.altKey&&['ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const r=$('#ruler');r.style.top=Math.max(0,Math.min(innerHeight-r.offsetHeight,r.getBoundingClientRect().top+(e.key==='ArrowUp'?-24:24)))+'px'}});
window.addEventListener('pageshow',e=>{if(e.persisted)location.reload()});window.addEventListener('hashchange',render);applySettings();render();
})();

</script>
</body>
</html>
