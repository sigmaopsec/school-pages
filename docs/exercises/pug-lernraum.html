<script id="content-data" type="application/json">{"version":2,"defaults":{"syllables":false,"font":18,"line":1.75,"spacing":false,"ruler":false},"modules":[{"id":"art20","title":"Artikel 20 verstehen","short":"Artikel 20","group":"Grundwissen","goal":"Du ordnest die Staatsprinzipien zu. Bei einem Fall begründest du deine Wahl.","refs":["grundwissen#prinzipien","lernseite#grundlagen"],"learn":[{"title":"Der Bauplan des Staates","text":"Dein Grundwissen nennt Artikel 20 eine „Verfassung in Kurzform“. Gemeint ist: Der Artikel beschreibt wichtige Regeln für den Aufbau des Staates. Du musst nicht jedes Gesetzeswort auswendig lernen. Wichtig ist, die Begriffe zu verstehen und am Material anzuwenden."},{"title":"Die fünf Staatsprinzipien","text":"Lies die Begriffe zunächst als Übersicht. Eine einfache Zuordnung braucht keine ausführliche Fallprüfung.","table":[["Prinzip","Bedeutung"],["Bundesstaat","Bund und 16 Länder besitzen eigene staatliche Strukturen."],["Demokratie","Die Staatsgewalt geht vom Volk aus. Wahlen und Abstimmungen sind wichtige Formen der Beteiligung."],["Rechtsstaat","Staatliches Handeln ist an Gesetz und Recht gebunden. Unabhängige Gerichte kontrollieren es."],["Sozialstaat","Der Staat fördert soziale Sicherheit und soziale Gerechtigkeit."],["Republik","Das Amt des Staatsoberhaupts wird nicht vererbt. Politische Ämter sind zeitlich begrenzt."]]},{"title":"Drei Staatsgewalten, nicht drei Prüfschritte","text":"Artikel 20 unterscheidet Gesetzgebung, vollziehende Gewalt und Rechtsprechung. Ihre Trennung begrenzt staatliche Macht.","table":[["Staatsgewalt","Aufgabe"],["Gesetzgebung","Gesetze beschließen."],["Vollziehende Gewalt","Gesetze ausführen und staatlich handeln."],["Rechtsprechung","Rechtsfragen durch unabhängige Gerichte entscheiden."]]},{"title":"Wann du begründen sollst","text":"Bei einer Auswahlfrage wählst du die passende Antwort. Bei „Erklären“ oder „Beurteilen“ zeigst du zusätzlich den Zusammenhang mit dem Fall. Die ursprüngliche Lernseite empfiehlt dafür: Prinzip nennen, am Fall erklären und die Bedeutung für die demokratische Ordnung zeigen. Das ist eine Schreibhilfe für solche Fälle, kein Schema für jede Wissensfrage."},{"title":"Widerstand ist eine besondere Ausnahme","text":"Artikel 20 Absatz 4 steht in deinem Grundwissen. Er nennt ein Recht zum Widerstand für Deutsche, wenn jemand die dort geschützte Ordnung beseitigen will und andere Abhilfe nicht möglich ist. Eine bloße Meinungsverschiedenheit mit der Regierung erfüllt diese Voraussetzungen nicht."}],"examples":[{"title":"Bund und Länder","text":"Aus der ursprünglichen Lernseite: Bundesländer besitzen eigene staatliche Zuständigkeiten und wirken über den Bundesrat an der Bundesgesetzgebung mit.","blocks":[{"title":"Passende Zuordnung","text":"Hier passt das Bundesstaatsprinzip. Entscheidend sind die eigenen staatlichen Zuständigkeiten der Länder und ihre Mitwirkung. Die Aussage beschreibt nicht in erster Linie soziale Sicherheit oder die zeitliche Begrenzung politischer Ämter."}],"refs":["lernseite#grundlagen"]},{"title":"Wahlen und Abstimmungen","text":"Das Grundwissen beschreibt Demokratie als Herrschaft des Volkes.","blocks":[{"title":"So wird der Begriff deutlich","text":"In Artikel 20 steht, dass alle Staatsgewalt vom Volke ausgeht. Wahlen und Abstimmungen machen die Beteiligung des Volkes sichtbar. Deshalb ordnest du diese Aussage dem Demokratieprinzip zu, auch wenn andere Staatsprinzipien ebenfalls wichtig bleiben."}],"refs":["grundwissen#prinzipien"]},{"title":"Soziale Sicherheit","text":"Das Grundwissen nennt soziale Sicherungssysteme als Beispiel.","blocks":[{"title":"Passende Zuordnung","text":"Hier geht es um das Sozialstaatsprinzip. Der Staat soll soziale Sicherheit und soziale Gerechtigkeit fördern. Die Frage verlangt den Grundsatz, nicht einzelne Leistungen oder deren genaue Höhe."}],"refs":["grundwissen#prinzipien"]},{"title":"Ein Gericht kontrolliert eine Regelung","text":"Aus der ursprünglichen Lernseite: Eine Landesregierung erlässt eine Regelung. Betroffene können vor unabhängigen Gerichten dagegen vorgehen. Ein Gericht hebt die Regelung wegen eines Verstoßes gegen höherrangiges Recht auf.","blocks":[{"title":"Zwei Prinzipien sind sichtbar","text":"Das Rechtsstaatsprinzip zeigt sich daran, dass die Regierung an Recht gebunden ist. Die gerichtliche Kontrolle macht außerdem die Gewaltenteilung sichtbar. Das Gericht prüft die Regelung unabhängig von der Stelle, die sie erlassen hat. Der Fall zeigt damit, dass staatliche Macht rechtlich begrenzt wird."}],"refs":["lernseite#anwendung"]},{"title":"Ein Amt wird nicht vererbt","text":"Die ursprüngliche Lernseite erklärt das Republikprinzip durch nicht erbliche und zeitlich begrenzte politische Ämter.","blocks":[{"title":"Republik von Demokratie unterscheiden","text":"Republik beschreibt hier die Form des Staates, besonders die nicht erbliche Staatsspitze. Demokratie beschreibt dagegen, dass die politische Macht vom Volk ausgeht. Die Begriffe hängen im Material zusammen, beantworten aber unterschiedliche Fragen."}],"refs":["lernseite#grundlagen"]}],"tasks":[{"title":"Staatsprinzipien zuordnen","type":"select","prompt":"Wähle zu jeder Aussage den passenden Begriff.","refs":["grundwissen#prinzipien","lernseite#grundlagen"],"pairs":[{"label":"Eigene staatliche Strukturen von Bund und Ländern","answer":"Bundesstaat","options":["Bundesstaat","Demokratie","Rechtsstaat","Sozialstaat","Republik"]},{"label":"Die politische Macht geht vom Volk aus","answer":"Demokratie","options":["Bundesstaat","Demokratie","Rechtsstaat","Sozialstaat","Republik"]},{"label":"Staatliches Handeln ist an Recht gebunden","answer":"Rechtsstaat","options":["Bundesstaat","Demokratie","Rechtsstaat","Sozialstaat","Republik"]},{"label":"Soziale Sicherheit und Gerechtigkeit fördern","answer":"Sozialstaat","options":["Bundesstaat","Demokratie","Rechtsstaat","Sozialstaat","Republik"]},{"label":"Die Staatsspitze wird nicht vererbt","answer":"Republik","options":["Bundesstaat","Demokratie","Rechtsstaat","Sozialstaat","Republik"]}],"explanation":"Entscheidend ist jeweils das Merkmal in der Aussage. Mehrere Prinzipien können im wirklichen Staat zusammenwirken. Bei dieser Zuordnung wird aber das unmittelbar angesprochene Prinzip gesucht.","id":"art20-1"},{"title":"Kontrolle einer Landesregierung","type":"choice","prompt":"Ein unabhängiges Gericht hebt eine rechtswidrige Regelung der Landesregierung auf. Welche Zuordnung erklärt den Fall am besten?","refs":["lernseite#anwendung"],"options":["Bundesstaat und Sozialstaat","Rechtsstaat und Gewaltenteilung","Republik und Sozialstaat"],"correct":[1],"explanation":"Rechtsstaat bedeutet hier, dass die Regierung an höherrangiges Recht gebunden bleibt. Gewaltenteilung zeigt sich in der unabhängigen Kontrolle durch das Gericht. Das Urteil ist also nicht bloß eine andere politische Meinung der Regierung.","id":"art20-2"},{"title":"Was gehört zum Rechtsstaat?","type":"choice","prompt":"Wähle alle zutreffenden Aussagen aus.","refs":["lernseite#grundlagen"],"options":["Staatliche Gewalt ist an Gesetz und Recht gebunden.","Die Regierung darf Gerichtsentscheidungen jederzeit aufheben.","Betroffene können staatliche Entscheidungen rechtlich überprüfen lassen.","Eine gewählte Mehrheit darf Grundrechte beliebig abschaffen."],"correct":[0,2],"explanation":"Bindung an das Recht und rechtliche Kontrolle gehören zusammen. Eine Regierung kann ein unabhängiges Urteil nicht beliebig beseitigen. Auch eine gewählte Mehrheit bleibt an verfassungsrechtliche Grenzen gebunden.","id":"art20-3"},{"title":"Staatsgewalten zuordnen","type":"select","prompt":"Wähle die Staatsgewalt, die zur beschriebenen Aufgabe passt.","refs":["grundwissen#art20","lernseite#grundlagen"],"pairs":[{"label":"Gesetze beschließen","answer":"Gesetzgebung","options":["Gesetzgebung","Vollziehende Gewalt","Rechtsprechung"]},{"label":"Gesetze ausführen","answer":"Vollziehende Gewalt","options":["Gesetzgebung","Vollziehende Gewalt","Rechtsprechung"]},{"label":"Einen Rechtsstreit unabhängig entscheiden","answer":"Rechtsprechung","options":["Gesetzgebung","Vollziehende Gewalt","Rechtsprechung"]}],"explanation":"Die drei Begriffe bezeichnen unterschiedliche staatliche Aufgaben. Ihre Trennung dient der Begrenzung von Macht. Sie sind keine drei Schritte einer Verhältnismäßigkeitsprüfung.","id":"art20-4"},{"title":"Die Forderung einer politischen Gruppe","type":"writing","prompt":"Die ursprüngliche Lernseite nennt diese Forderung: „Wenn wir bei einer Wahl die Mehrheit erhalten, dürfen wir alle Gerichte abschaffen und oppositionelle Parteien verbieten.“ Beurteile sie mit den Staatsprinzipien.","refs":["lernseite#anwendung","grundwissen#ewigkeit"],"model":[{"title":"Mögliche Begründung","text":"Die Forderung widerspricht dem Rechtsstaatsprinzip und der Gewaltenteilung. Wenn alle Gerichte abgeschafft würden, fehlte eine unabhängige Kontrolle staatlicher Macht. Betroffene könnten staatliches Handeln dann nicht mehr in der beschriebenen Weise überprüfen lassen."},{"title":"Bedeutung für die Demokratie","text":"Eine Wahlmehrheit berechtigt außerdem nicht dazu, die demokratische Ordnung durch das Ausschalten der Opposition zu beseitigen. Die Grundsätze aus Artikel 20 stehen nach dem Grundwissen unter dem Schutz der Ewigkeitsklausel. Deshalb wird die Forderung nicht allein dadurch zulässig, dass die Gruppe zuvor eine Wahl gewonnen hat."}],"criteria":["Ich nenne die betroffenen Prinzipien.","Ich erkläre die Folgen am konkreten Fall.","Ich begründe, warum eine Wahlmehrheit nicht jede Maßnahme erlaubt."],"id":"art20-5"}]},{"id":"art79","title":"Artikel 79: die Ewigkeitsklausel","short":"Artikel 79","group":"Grundwissen","goal":"Du erklärst, welchen Verfassungskern das Grundwissen besonders schützt.","refs":["grundwissen#ewigkeit","lernseite#grundlagen"],"learn":[{"title":"Das steht in deinem Grundwissen","text":"Die Grundsätze in Artikel 1 und Artikel 20 dürfen auch durch eine Änderung des Grundgesetzes nicht abgeschafft oder in ihrem Wesensgehalt verändert werden. Diesen Schutz nennt dein Material Ewigkeitsklausel."},{"title":"Grundsatz ist nicht gleich jedes Detail","text":"Die Menschenwürde und die Staatsprinzipien gehören zum geschützten Kern. Das bedeutet nicht, dass jeder Satz jedes Gesetzes für immer unverändert bleibt. In diesem Lernbereich geht es nur um die Erklärung aus deinem Grundwissen, nicht um zusätzliche Abstimmungsregeln oder Gesetzgebungsverfahren."},{"title":"Die Verbindung zu Artikel 20","text":"Artikel 20 beschreibt die Staatsprinzipien. Artikel 79 Absatz 3 schützt ihre grundlegende Bedeutung. In einer begründeten Antwort verbindest du daher den betroffenen Grundsatz mit diesem besonderen Schutz."}],"examples":[{"title":"Menschenwürde","text":"Begriff aus dem Material: Menschenwürde. Bezug: Artikel 1.","blocks":[{"title":"Bedeutung der Ewigkeitsklausel","text":"Die Menschenwürde bildet im Grundwissen die Basis der Grundrechte. Gerade dieser Grundsatz gehört zum geschützten Kern. Er darf nicht dadurch aufgegeben werden, dass eine Änderung des Grundgesetzes beschlossen wird."}],"refs":["grundwissen#ewigkeit","grundwissen#prinzipien"]},{"title":"Demokratie","text":"Begriff aus dem Material: Demokratie. Bezug: Artikel 20.","blocks":[{"title":"Bedeutung der Ewigkeitsklausel","text":"Die politische Macht geht vom Volk aus. Diesen Grundsatz schützt die Ewigkeitsklausel auch gegenüber Änderungen des Grundgesetzes. Demokratie wäre nicht dauerhaft gesichert, wenn eine Mehrheit ihren Kern beliebig beseitigen dürfte."}],"refs":["grundwissen#ewigkeit","grundwissen#prinzipien"]},{"title":"Rechtsstaat","text":"Begriff aus dem Material: Rechtsstaat. Bezug: Artikel 20.","blocks":[{"title":"Bedeutung der Ewigkeitsklausel","text":"Die Bindung staatlicher Macht an Recht und Gesetz gehört zu den Staatsprinzipien aus dem Grundwissen. Die Ewigkeitsklausel schützt diesen Grundsatz. Die Unabhängigkeit der rechtlichen Kontrolle kann deshalb nicht mit dem Hinweis auf einen politischen Wahlsieg beiseitegeschoben werden."}],"refs":["grundwissen#ewigkeit","grundwissen#prinzipien"]},{"title":"Sozialstaat","text":"Begriff aus dem Material: Sozialstaat. Bezug: Artikel 20.","blocks":[{"title":"Bedeutung der Ewigkeitsklausel","text":"Das Grundwissen nennt soziale Sicherheit und soziale Gerechtigkeit. Geschützt ist dieser staatliche Grundauftrag. Aus der knappen Erklärung des Blatts folgt dagegen nicht, dass jede einzelne soziale Regel unverändert bleiben muss."}],"refs":["grundwissen#ewigkeit","grundwissen#prinzipien"]},{"title":"Bundesstaat","text":"Begriff aus dem Material: Bundesstaat. Bezug: Artikel 20.","blocks":[{"title":"Bedeutung der Ewigkeitsklausel","text":"Der Bund besteht aus Ländern mit eigenen staatlichen Strukturen. Das ist ein Grundsatz aus Artikel 20 und damit Teil des geschützten Kerns. Die Lernaufgabe verlangt hier den Zusammenhang mit der Ewigkeitsklausel, nicht zusätzliche Regeln zu Verfassungsänderungen."}],"refs":["grundwissen#ewigkeit","grundwissen#prinzipien"]}],"tasks":[{"title":"Den Schutz richtig beschreiben","type":"choice","prompt":"Welche Aussage gibt die Ewigkeitsklausel aus dem Grundwissen richtig wieder?","refs":["grundwissen#ewigkeit"],"options":["Der gesamte Wortlaut aller Gesetze bleibt unverändert.","Die Grundsätze aus Artikel 1 und Artikel 20 sind auch gegen ihre Abschaffung durch eine Grundgesetzänderung geschützt.","Der besondere Schutz endet nach einer Wahl."],"correct":[1],"explanation":"Geschützt sind grundlegende Prinzipien, nicht jedes einzelne Gesetzesdetail. Der Schutz gilt gerade auch gegenüber einer Änderung des Grundgesetzes. Ein Wahlergebnis hebt ihn nicht auf.","id":"art79-1"},{"title":"Geschützte Grundsätze zuordnen","type":"select","prompt":"Ordne die Begriffe ihrer Grundlage im Material zu. Du kannst die Quelle geöffnet lassen.","refs":["grundwissen#ewigkeit","grundwissen#prinzipien"],"pairs":[{"label":"Menschenwürde","answer":"Artikel 1","options":["Artikel 1","Artikel 20"]},{"label":"Demokratie","answer":"Artikel 20","options":["Artikel 1","Artikel 20"]},{"label":"Rechtsstaat","answer":"Artikel 20","options":["Artikel 1","Artikel 20"]},{"label":"Sozialstaat","answer":"Artikel 20","options":["Artikel 1","Artikel 20"]}],"explanation":"Das Grundwissen nennt Artikel 1 und Artikel 20 als Bezugspunkte der Ewigkeitsklausel. Artikel 1 betrifft die Menschenwürde. Die hier genannten Staatsprinzipien gehören zu Artikel 20.","id":"art79-2"},{"title":"Grundsatz oder unveränderliches Detail?","type":"choice","prompt":"Welche Schlussfolgerung ist durch die Erklärung im Grundwissen gedeckt?","refs":["grundwissen#ewigkeit","grundwissen#prinzipien"],"options":["Der Sozialstaat als Grundsatz ist geschützt. Daraus folgt nicht, dass jede einzelne soziale Regel unverändert bleiben muss.","Jede einzelne Sozialleistung muss nach der Ewigkeitsklausel für immer dieselbe Höhe behalten.","Der Sozialstaat gehört nicht zu den Staatsprinzipien."],"correct":[0],"explanation":"Das Blatt spricht von Grundsätzen und ihrem Wesensgehalt. Der Sozialstaat ist einer dieser Grundsätze. Eine genaue Höhe einzelner Leistungen nennt das Material nicht und legt sie damit auch nicht für immer fest.","id":"art79-3"},{"title":"Eine Mehrheit will Gerichte abschaffen","type":"choice","prompt":"Die politische Gruppe aus der ursprünglichen Lernseite beruft sich auf ihren Wahlsieg. Welche Begründung weist ihre Forderung am besten zurück?","refs":["lernseite#anwendung","grundwissen#ewigkeit"],"options":["Die Gerichte sind nur deshalb geschützt, weil jede frühere Entscheidung richtig war.","Eine Mehrheit kann alle Gerichte abschaffen, solange sie das vorher angekündigt hat.","Eine Wahlmehrheit darf den geschützten Kern von Rechtsstaat und Demokratie nicht beseitigen."],"correct":[2],"explanation":"Die unabhängige rechtliche Kontrolle gehört zum Rechtsstaat. Ihr Schutz hängt nicht davon ab, ob jede einzelne Gerichtsentscheidung überzeugt. Auch eine angekündigte politische Forderung bleibt an die geschützten Verfassungsgrundsätze gebunden.","id":"art79-4"},{"title":"Artikel 20 und Artikel 79 verbinden","type":"writing","prompt":"Erkläre, warum die ursprüngliche Lernseite Artikel 20 als Teil eines besonders geschützten Verfassungskerns beschreibt.","refs":["lernseite#grundlagen","grundwissen#ewigkeit"],"model":[{"title":"Mögliche Erklärung","text":"Artikel 20 beschreibt grundlegende Prinzipien des Staates, etwa Demokratie, Rechtsstaat und Sozialstaat. Diese Prinzipien bestimmen, wie politische Macht ausgeübt und begrenzt wird. Sie sind daher nicht bloß nebensächliche Einzelregeln."},{"title":"Der besondere Schutz","text":"Das Grundwissen erklärt, dass die Grundsätze aus Artikel 1 und Artikel 20 auch durch eine Änderung des Grundgesetzes nicht abgeschafft oder in ihrem Wesensgehalt verändert werden dürfen. Diesen Schutz enthält die Ewigkeitsklausel. Deshalb kann eine Mehrheit den grundlegenden Aufbau des Staates nicht beliebig beseitigen."}],"criteria":["Ich nenne mindestens ein Prinzip aus Artikel 20.","Ich erkläre den Schutz gegen eine Abschaffung durch Grundgesetzänderung.","Ich verwechsle den geschützten Grundsatz nicht mit jedem Gesetzesdetail."],"id":"art79-5"}]},{"id":"laender","title":"Die 16 Länder und ihre Hauptstädte","short":"Bundesländer","group":"Grundwissen","goal":"Du ordnest allen 16 Bundesländern die richtige Hauptstadt zu.","refs":["grundwissen#laender","lernseite#laender"],"learn":[{"title":"Hier genügt eine Zuordnung","text":"Bei dieser Aufgabe brauchst du keine Fallprüfung und keine Stellungnahme. Du wählst zu jedem Bundesland seine Hauptstadt. Die fünf Übungsgruppen decken zusammen alle 16 Länder ab."},{"title":"Die vollständige Übersicht","text":"Diese Paare stehen in deinem Grundwissen. Berlin, Bremen und Hamburg sind dort als Stadtstaaten markiert.","table":[["Bundesland","Hauptstadt"],["Baden-Württemberg","Stuttgart"],["Bayern","München"],["Berlin","Berlin"],["Brandenburg","Potsdam"],["Bremen","Bremen"],["Hamburg","Hamburg"],["Hessen","Wiesbaden"],["Mecklenburg-Vorpommern","Schwerin"],["Niedersachsen","Hannover"],["Nordrhein-Westfalen","Düsseldorf"],["Rheinland-Pfalz","Mainz"],["Saarland","Saarbrücken"],["Sachsen","Dresden"],["Sachsen-Anhalt","Magdeburg"],["Schleswig-Holstein","Kiel"],["Thüringen","Erfurt"]]},{"title":"So übst du mit wenig Aufwand","text":"Lies eine kleine Gruppe. Wechsle dann zu „Aufgaben“ und nutze die Auswahlfelder. Nach dem Prüfen siehst du jede richtige Zuordnung und kannst falsche Antworten direkt ändern."}],"examples":[{"title":"Drei Länder: Baden-Württemberg, Bayern, Hessen","text":"Diese Zuordnungen stammen aus deinem Grundwissen.","blocks":[{"title":"Land und Hauptstadt","text":"","table":[["Bundesland","Hauptstadt"],["Baden-Württemberg","Stuttgart"],["Bayern","München"],["Hessen","Wiesbaden"]]},{"title":"Darauf achten","text":"Zu Hessen gehört Wiesbaden. Die Lernaufgabe fragt nach der Hauptstadt, nicht nach einer anderen bekannten Stadt des Landes."}],"refs":["grundwissen#laender"]},{"title":"Drei Länder im Norden","text":"Diese Zuordnungen stammen aus deinem Grundwissen.","blocks":[{"title":"Land und Hauptstadt","text":"","table":[["Bundesland","Hauptstadt"],["Schleswig-Holstein","Kiel"],["Niedersachsen","Hannover"],["Mecklenburg-Vorpommern","Schwerin"]]},{"title":"Darauf achten","text":"Präge dir die drei Paare als ganze Zuordnungen ein. Mecklenburg-Vorpommern hat Schwerin als Hauptstadt."}],"refs":["grundwissen#laender"]},{"title":"Die drei Stadtstaaten","text":"Diese Zuordnungen stammen aus deinem Grundwissen.","blocks":[{"title":"Land und Hauptstadt","text":"","table":[["Bundesland","Hauptstadt"],["Berlin","Berlin"],["Bremen","Bremen"],["Hamburg","Hamburg"]]},{"title":"Darauf achten","text":"Bei Berlin, Bremen und Hamburg sind der Name des Bundeslandes und der Name seiner Hauptstadt gleich. Dein Grundwissen kennzeichnet diese drei Länder als Stadtstaaten."}],"refs":["grundwissen#laender"]},{"title":"Vier Länder: Sachsen bis Brandenburg","text":"Diese Zuordnungen stammen aus deinem Grundwissen.","blocks":[{"title":"Land und Hauptstadt","text":"","table":[["Bundesland","Hauptstadt"],["Sachsen","Dresden"],["Sachsen-Anhalt","Magdeburg"],["Thüringen","Erfurt"],["Brandenburg","Potsdam"]]},{"title":"Darauf achten","text":"Sachsen und Sachsen-Anhalt sind zwei verschiedene Bundesländer. Dazu gehören Dresden und Magdeburg. Brandenburg hat Potsdam als Hauptstadt."}],"refs":["grundwissen#laender"]},{"title":"Drei Länder: Nordrhein-Westfalen bis Saarland","text":"Diese Zuordnungen stammen aus deinem Grundwissen.","blocks":[{"title":"Land und Hauptstadt","text":"","table":[["Bundesland","Hauptstadt"],["Nordrhein-Westfalen","Düsseldorf"],["Rheinland-Pfalz","Mainz"],["Saarland","Saarbrücken"]]},{"title":"Darauf achten","text":"Zu Nordrhein-Westfalen gehört Düsseldorf. Rheinland-Pfalz hat Mainz als Hauptstadt, das Saarland Saarbrücken."}],"refs":["grundwissen#laender"]}],"tasks":[{"title":"Hauptstädte: Gruppe 1","type":"select","prompt":"Ordne jedem Bundesland seine Hauptstadt zu. Wähle die Namen aus, statt sie abzuschreiben.","refs":["grundwissen#laender"],"pairs":[{"label":"Baden-Württemberg","answer":"Stuttgart","options":["München","Stuttgart","Wiesbaden"]},{"label":"Bayern","answer":"München","options":["München","Stuttgart","Wiesbaden"]},{"label":"Hessen","answer":"Wiesbaden","options":["München","Stuttgart","Wiesbaden"]}],"explanation":"Zu Hessen gehört Wiesbaden. Die Lernaufgabe fragt nach der Hauptstadt, nicht nach einer anderen bekannten Stadt des Landes.","id":"laender-1"},{"title":"Hauptstädte: Gruppe 2","type":"select","prompt":"Ordne jedem Bundesland seine Hauptstadt zu. Wähle die Namen aus, statt sie abzuschreiben.","refs":["grundwissen#laender"],"pairs":[{"label":"Schleswig-Holstein","answer":"Kiel","options":["Hannover","Kiel","Schwerin"]},{"label":"Niedersachsen","answer":"Hannover","options":["Hannover","Kiel","Schwerin"]},{"label":"Mecklenburg-Vorpommern","answer":"Schwerin","options":["Hannover","Kiel","Schwerin"]}],"explanation":"Präge dir die drei Paare als ganze Zuordnungen ein. Mecklenburg-Vorpommern hat Schwerin als Hauptstadt.","id":"laender-2"},{"title":"Hauptstädte: Gruppe 3","type":"select","prompt":"Ordne jedem Bundesland seine Hauptstadt zu. Wähle die Namen aus, statt sie abzuschreiben.","refs":["grundwissen#laender"],"pairs":[{"label":"Berlin","answer":"Berlin","options":["Berlin","Bremen","Hamburg"]},{"label":"Bremen","answer":"Bremen","options":["Berlin","Bremen","Hamburg"]},{"label":"Hamburg","answer":"Hamburg","options":["Berlin","Bremen","Hamburg"]}],"explanation":"Bei Berlin, Bremen und Hamburg sind der Name des Bundeslandes und der Name seiner Hauptstadt gleich. Dein Grundwissen kennzeichnet diese drei Länder als Stadtstaaten.","id":"laender-3"},{"title":"Hauptstädte: Gruppe 4","type":"select","prompt":"Ordne jedem Bundesland seine Hauptstadt zu. Wähle die Namen aus, statt sie abzuschreiben.","refs":["grundwissen#laender"],"pairs":[{"label":"Sachsen","answer":"Dresden","options":["Dresden","Erfurt","Magdeburg","Potsdam"]},{"label":"Sachsen-Anhalt","answer":"Magdeburg","options":["Dresden","Erfurt","Magdeburg","Potsdam"]},{"label":"Thüringen","answer":"Erfurt","options":["Dresden","Erfurt","Magdeburg","Potsdam"]},{"label":"Brandenburg","answer":"Potsdam","options":["Dresden","Erfurt","Magdeburg","Potsdam"]}],"explanation":"Sachsen und Sachsen-Anhalt sind zwei verschiedene Bundesländer. Dazu gehören Dresden und Magdeburg. Brandenburg hat Potsdam als Hauptstadt.","id":"laender-4"},{"title":"Hauptstädte: Gruppe 5","type":"select","prompt":"Ordne jedem Bundesland seine Hauptstadt zu. Wähle die Namen aus, statt sie abzuschreiben.","refs":["grundwissen#laender"],"pairs":[{"label":"Nordrhein-Westfalen","answer":"Düsseldorf","options":["Düsseldorf","Mainz","Saarbrücken"]},{"label":"Rheinland-Pfalz","answer":"Mainz","options":["Düsseldorf","Mainz","Saarbrücken"]},{"label":"Saarland","answer":"Saarbrücken","options":["Düsseldorf","Mainz","Saarbrücken"]}],"explanation":"Zu Nordrhein-Westfalen gehört Düsseldorf. Rheinland-Pfalz hat Mainz als Hauptstadt, das Saarland Saarbrücken.","id":"laender-5"}]},{"id":"digital","title":"Digitaler Tag: Grundrechte am Fall","short":"Digitaler Tag","group":"Hauptteil","goal":"Du erkennst den Konflikt. Du trennst Fakten, offene Fragen und Bewertungen.","refs":["digital#info","digital#begriffe","auszug#art1"],"learn":[{"title":"Was Grundrechte schützen","text":"Das Infoblatt nennt Freiheit, Gleichheit und Würde. Menschenrechte gelten für alle Menschen. Manche Rechte sind im Wortlaut Deutschen vorbehalten. Das Blatt nennt sie Deutschengrundrechte. Für deine Fälle nutzt du den bereitgestellten Gesetzestext, statt die Artikel auswendig aufzusagen.","table":[["Begriff aus dem Blatt","Kernidee"],["Menschenwürde","Jede Person ist gleichwertig. Sie darf nicht zum bloßen Mittel gemacht werden."],["Freiheitsrechte","Sie schützen Handeln, Kommunikation und Privatleben."],["Gleichheit","Vergleichbares ist gleich zu behandeln. Diskriminierung ist verboten."],["Justizgrundrechte","Sie sichern faire rechtsstaatliche Verfahren."]]},{"title":"Wer handelt?","text":"Der Staat ist unmittelbar an Grundrechte gebunden. Das gilt für Gesetzgebung, Verwaltung und Gerichte. Private sind nicht in derselben Weise unmittelbar gebunden. Grundrechte wirken aber mittelbar, wenn Gerichte zum Beispiel Verträge oder Hausordnungen auslegen. Deshalb trennst du im Klassenchat das private Weiterleiten von einer staatlichen schulischen Maßnahme. Beim Jugendcamp ist zunächst offen, ob der Veranstalter staatlich oder privat ist."},{"title":"Drei Begriffe für die Einordnung","text":"Diese Begriffe erklären unterschiedliche Fragen. Sie sind nicht die vier Stufen der Verhältnismäßigkeit.","table":[["Begriff","Frage"],["Eingriff","Beeinträchtigt staatliches Handeln einen geschützten Bereich?"],["Schranke","Darf dieses Recht nach dem Grundgesetz oder einem Gesetz begrenzt werden?"],["Schranken-Schranke","Hält die Begrenzung ihre eigenen Grenzen ein? Dazu gehört die Verhältnismäßigkeit."]]},{"title":"Fakten nicht mit Annahmen verwechseln","text":"Ein Fakt ist eine im Material gesicherte Angabe. Eine offene Frage ist noch nicht beantwortet. Eine Bewertung ist eine begründete Einschätzung. Beispiel aus Fallkarte 1: Eine rasche Löschung ist geplant. Damit ist noch nicht bewiesen, dass die Löschung zuverlässig funktioniert."},{"title":"Quellen anwenden statt nur nennen","text":"Nenne die Fallkarte und die passende Angabe. Erkläre dann, was diese Angabe für dein Urteil bedeutet. Beispiel: „Fallkarte 4, Seite 6, begrenzt die Verwahrung auf das Unterrichtsende. Das verringert die Dauer des Eingriffs.“ Ein bloßer Quellenname ersetzt diese Erklärung nicht."},{"title":"Grenzen und Rechtsschutz","text":"Das Grundwissen verweist auf Artikel 18 und Artikel 19. Im GG-Auszug steht: Über Grundrechtsverwirkung nach Artikel 18 entscheidet das Bundesverfassungsgericht. Artikel 19 schützt unter anderem den Wesensgehalt von Grundrechten und eröffnet den Rechtsweg bei Verletzungen durch öffentliche Gewalt. Daraus wird hier kein zusätzlicher Lernblock über Aufbau oder Verfahren des Gerichts gemacht."}],"examples":[{"title":"Gesichtserkennung: geplant ist nicht bewiesen","text":"","blocks":[{"title":"Fakten und offene Angaben","text":"Der Test soll sechs Wochen dauern. Die rasche Löschung ist eine geplante Schutzmaßnahme. Wie zuverlässig die Erkennung arbeitet und ob die Grundlage ausreicht, bleibt offen. Eine Lösung darf deshalb keine erfundene Fehlerquote als Beleg verwenden."},{"title":"Der Konflikt","text":"Die Erfassung von Gesichtern betrifft die informationelle Selbstbestimmung der Reisenden. Dem steht das Interesse an Sicherheit gegenüber. Die Fallkarte nennt dazu den Schutz von Leben und körperlicher Unversehrtheit. Sie sagt aber nicht, dass alle gesuchten Personen eine konkrete Gefahr für andere darstellen."}],"caseId":1,"mode":"basic","refs":["digital#fall1"]},{"title":"Demonstration: mehr als ein Interesse","text":"","blocks":[{"title":"Den Konflikt erklären","text":"Die Demonstrierenden wollen ihre Meinung gemeinsam und sichtbar äußern. Deshalb sind Versammlungsfreiheit und Meinungsfreiheit betroffen. Die Behörde verweist auf Rettungswege und Sicherheit; hier ist die körperliche Unversehrtheit anderer Menschen zu berücksichtigen. Jede der drei Auflagen braucht eine eigene Begründung."},{"title":"Offene Frage ernst nehmen","text":"Die Behörde verweist auf erwartete Gegenproteste. Die Fallkarte fragt aber ausdrücklich, wie konkret die Gefahr ist. Deshalb wird aus der Erwartung nicht automatisch eine gesicherte Gewalttat. Du prüfst die Begründung der einzelnen Auflagen."}],"caseId":2,"mode":"basic","refs":["digital#fall2"]},{"title":"Klassenchat: privat und staatlich trennen","text":"","blocks":[{"title":"Die handelnden Personen unterscheiden","text":"Das allgemeine Persönlichkeitsrecht schützt die betroffene Schülerin. Die weiterleitende Person könnte sich auf Meinungsfreiheit berufen; das beendet den Konflikt aber nicht. Das private Weiterleiten ist von einer möglichen staatlichen Maßnahme der Schule zu unterscheiden. Die folgende Prüfung gilt für die Einschränkung auf Schulgeräten, soweit die Schule staatlich handelt."},{"title":"Nicht vorschnell urteilen","text":"Das bearbeitete Bild wurde verbreitet; das ist im Fall gesichert. Die Urheberschaft und der Zusammenhang stehen dagegen noch nicht fest. Schutz der Schülerin und Sachverhaltsklärung sind deshalb nötig, ohne einzelnen Lernenden unbelegte Handlungen zuzuschreiben."}],"caseId":3,"mode":"basic","refs":["digital#fall3"]},{"title":"Smartphone: auf die genaue Regel achten","text":"","blocks":[{"title":"Die Maßnahme präzise lesen","text":"Die Fallkarte betrifft private Nutzung im Unterricht. Sie nennt bei Wiederholung eine Verwahrung bis Unterrichtsende, nicht einen Entzug für mehrere Tage. Wer eine längere Dauer in seine Lösung schreibt, bewertet einen anderen Fall."},{"title":"Besondere Bedarfe beachten","text":"Der Kurs nennt medizinische Apps, Übersetzung und Notfälle. Diese Angaben gehören zur Abwägung und sind kein zusätzlich erfundener Prüfungsstoff. Du prüfst, wie klare Ausnahmen mit dem Ziel eines konzentrierten Unterrichts vereinbar sind."}],"caseId":4,"mode":"basic","refs":["digital#fall4"]},{"title":"Jugendcamp: eine wichtige Angabe fehlt","text":"","blocks":[{"title":"Staatliche oder private Verantwortung?","text":"Datenschutz und freie Entscheidung der Teilnehmenden stehen dem Schutz vor Infektionen gegenüber. Die Fallkarte nennt außerdem Gleichheit, weil Personen ohne Angaben anders behandelt werden könnten. Ob der Veranstalter staatlich oder privat ist, bleibt offen. Die vier Stufen sind deshalb nur bei staatlichem Handeln eine unmittelbare Grundrechtsprüfung; sonst dienen sie hier als begründete Abwägung."},{"title":"Freiwilligkeit nicht einfach voraussetzen","text":"Die Gesundheitsangaben werden als freiwillig bezeichnet. Zugleich könnten Personen ohne Angaben zusätzliche Schutzmaßnahmen treffen. Deshalb fragt das Material, ob die Entscheidung wirklich freiwillig ist. Wie stark die Folgen belasten, ist noch zu klären."}],"caseId":5,"mode":"basic","refs":["digital#fall5"]}],"tasks":[{"title":"Rechte den Fallkarten zuordnen","type":"select","prompt":"Wähle das jeweils besonders angesprochene Recht. Weitere Rechte können im Fall ebenfalls betroffen sein.","refs":["digital#fall2","digital#fall6","digital#fall7"],"pairs":[{"label":"Eine friedliche Demonstration erhält Auflagen","answer":"Versammlungsfreiheit","options":["Religionsfreiheit","Versammlungsfreiheit","Meinungsfreiheit"]},{"label":"Eine Schülerin möchte ein religiöses Symbol tragen","answer":"Religionsfreiheit","options":["Religionsfreiheit","Versammlungsfreiheit","Meinungsfreiheit"]},{"label":"Die Kommune verbirgt einen kritischen Kommentar","answer":"Meinungsfreiheit","options":["Religionsfreiheit","Versammlungsfreiheit","Meinungsfreiheit"]}],"explanation":"Ordne das Recht zu, auf das die jeweilige Handlung am unmittelbarsten verweist. Bei der Demonstration kommt etwa die Meinungsfreiheit hinzu. Eine richtige Zuordnung ersetzt bei einer Stellungnahme noch nicht die Erklärung des Konflikts.","id":"digital-1"},{"title":"Fakt, Frage oder Bewertung?","type":"select","prompt":"Ordne die Aussagen zu Fallkarte 1 ein. Ein angekündigter Plan ist nicht dasselbe wie ein nachgewiesener Erfolg.","refs":["digital#fall1"],"pairs":[{"label":"Die Stadt plant einen Test für sechs Wochen.","answer":"Gesicherte Angabe","options":["Gesicherte Angabe","Offene Frage","Bewertung"]},{"label":"Wie hoch ist die Fehlerquote?","answer":"Offene Frage","options":["Gesicherte Angabe","Offene Frage","Bewertung"]},{"label":"Der geplante Test ist aus meiner Sicht zu belastend.","answer":"Bewertung","options":["Gesicherte Angabe","Offene Frage","Bewertung"]},{"label":"Bilder ohne Treffer sollen rasch gelöscht werden.","answer":"Gesicherte Angabe","options":["Gesicherte Angabe","Offene Frage","Bewertung"]}],"explanation":"Die letzte Aussage ist als Absicht im Material belegt. Sie beweist nicht, dass später tatsächlich fehlerfrei gelöscht wird. Die Bewertung braucht eine Begründung; die Fehlerquote müsste erst ermittelt werden.","id":"digital-2"},{"title":"Die drei Begriffe unterscheiden","type":"select","prompt":"Wähle zu jeder Frage den passenden Begriff. Es geht hier noch nicht um die vier Stufen.","refs":["digital#begriffe"],"pairs":[{"label":"Beeinträchtigt staatliches Handeln ein geschütztes Recht?","answer":"Eingriff","options":["Eingriff","Schranke","Schranken-Schranke"]},{"label":"Darf das Recht nach Grundgesetz oder Gesetz begrenzt werden?","answer":"Schranke","options":["Eingriff","Schranke","Schranken-Schranke"]},{"label":"Ist diese Begrenzung selbst verhältnismäßig?","answer":"Schranken-Schranke","options":["Eingriff","Schranke","Schranken-Schranke"]}],"explanation":"Zuerst wird die Beeinträchtigung eingeordnet. Danach geht es um eine mögliche rechtliche Begrenzung und um die Grenzen dieser Begrenzung. Die Verhältnismäßigkeit gehört zu dieser letzten Frage und hat im Infoblatt vier eigene Stufen.","id":"digital-3"},{"title":"Wer ist unmittelbar gebunden?","type":"choice","prompt":"Wähle alle Aussagen, die zum Infoblatt und den Fallkarten passen.","refs":["digital#info","digital#fall3","digital#fall5","digital#fall7"],"options":["Die Kommune ist als staatliche Stelle unmittelbar an Grundrechte gebunden.","Das private Weiterleiten im Chat ist automatisch eine staatliche Maßnahme.","Beim Jugendcamp muss zunächst geklärt werden, ob der Veranstalter staatlich oder privat ist.","Private sind überhaupt nie von der Wirkung der Grundrechte betroffen."],"correct":[0,2],"explanation":"Staatliche Stellen sind unmittelbar gebunden. Bei privaten Beziehungen erklärt das Infoblatt eine mittelbare Wirkung über die Auslegung durch Gerichte. Die Trägerschaft des Camps ist nicht genannt und darf daher nicht einfach erfunden werden.","id":"digital-4"},{"title":"Religion: einen Beleg richtig verwenden","type":"writing","prompt":"Erkläre den Konflikt aus Fallkarte 6. Nutze die Angabe, dass konkrete Störungen nicht dokumentiert sind. Unterscheide diese Angabe von deinem Urteil.","refs":["digital#fall6"],"caseId":6,"model":[{"title":"Konflikt und Quellenangabe","text":"Das Symbol betrifft Religionsfreiheit und Persönlichkeitsentfaltung der Schülerin. Die Schule nennt Neutralität und Gleichbehandlung. Staatliche Neutralität ist dabei eine Anforderung an den Staat und nicht selbst ein Grundrecht der Schule. Es muss geprüft werden, ob sie ein Verbot gegenüber einer Schülerin überhaupt trägt."},{"title":"Bedeutung des Belegs","text":"Fallkarte 6 auf Seite 8 nennt keine dokumentierte konkrete Störung. Das ist ein Grund, eine pauschale Verbotsforderung besonders kritisch zu prüfen. Daraus folgt nicht, dass in jeder denkbaren Situation eine Störung unmöglich wäre. Nach dem vorliegenden Material fehlt aber eine konkrete Belastung, die dem Eingriff in die Religionsfreiheit gegenübergestellt werden könnte."}],"criteria":["Ich nenne mindestens zwei betroffene Rechte oder unterscheide Rechte und staatliche Ziele.","Ich gebe die Quellenangabe richtig wieder.","Ich kennzeichne mein Urteil und behaupte keine erfundenen Störungen."],"id":"digital-5"}]},{"id":"verhaeltnis","title":"Verhältnismäßigkeit: vier Stufen","short":"Verhältnismäßigkeit","group":"Hauptteil","goal":"Du prüfst Zweck, Wirkung, mildere Mittel und die Abwägung. Du nutzt Angaben aus den Fallkarten.","refs":["digital#vier","digital#begriffe"],"learn":[{"title":"Vier Stufen, nicht drei","text":"Das Infoblatt nennt genau die folgenden vier Stufen. Alle stehen auf dieser Seite. Die fünf Arbeitsaufträge der Fallkarten sind eine andere Einteilung und ersetzen diese Prüfung nicht."},{"title":"1. Legitimer Zweck","text":"Frage: Welches zulässige Ziel wird verfolgt?\nNenne das konkrete Ziel des Falls, etwa Schutz freier Rettungswege oder konzentrierten Unterricht. Ein bloßes „Das Ziel ist gut“ erklärt noch nicht, was geschützt wird.\nSatzstarter aus dem Blatt: „Der Zweck, … zu schützen, ist legitim.“"},{"title":"2. Geeignetheit","text":"Frage: Kann die Maßnahme das Ziel fördern?\nErkläre den Zusammenhang zwischen Handlung und Ziel. Die Maßnahme muss das Problem nicht vollständig lösen. Fehlen Angaben zur Wirkung, benenne diese Grenze.\nSatzstarter: „Sie kann beitragen, weil …“"},{"title":"3. Erforderlichkeit","text":"Frage: Gibt es ein gleich wirksames, milderes Mittel?\nNenne eine konkrete Alternative. Vergleiche sowohl die Belastung als auch die Wirkung. „Milder“ allein genügt nicht.\nSatzstarter: „Milder wäre …; es wäre (nicht) gleich wirksam, weil …“"},{"title":"4. Angemessenheit","text":"Frage: Wie schwer wiegt der Eingriff gegenüber dem Nutzen?\nVergleiche die konkreten Folgen. Dauer, Reichweite und Ausnahmen können wichtig sein. Die Angabe „bis Unterrichtsende“ begrenzt zum Beispiel die Dauer einer Verwahrung.\nSatzstarter: „Der Eingriff wiegt …; der Nutzen …; daher …“"},{"title":"Die Quelle muss etwas zur Prüfung beitragen","text":"Nenne Fallkarte und Seite. Gib die konkrete Angabe wieder und erkläre ihre Bedeutung für die jeweilige Stufe. Fehlt eine Rechtsgrundlage oder eine Fehlerquote, schreibe das ausdrücklich. Eine plausible Vermutung ist noch kein gesicherter Fakt."},{"title":"Vor und nach den vier Stufen","text":"Vorher klärst du die staatliche Maßnahme, betroffene Rechte und die rechtliche Grundlage. Nachher formulierst du ein Ergebnis, das zu deiner Prüfung passt. Diese Einordnung und das Ergebnis sind keine fünfte oder sechste Stufe der Verhältnismäßigkeit. Wenn eine Bedingung offenbleibt, muss dein Urteil diese Unsicherheit zeigen."}],"examples":[{"title":"Smartphone-Regel","text":"","blocks":[],"caseId":4,"mode":"four","refs":["digital#fall4","digital#vier"]},{"title":"Demonstration und Auflagen","text":"","blocks":[],"caseId":2,"mode":"four","refs":["digital#fall2","digital#vier"]},{"title":"Gesichtserkennung am Bahnhof","text":"","blocks":[],"caseId":1,"mode":"four","refs":["digital#fall1","digital#vier"]},{"title":"Religionsausdruck und Neutralität","text":"","blocks":[],"caseId":6,"mode":"four","refs":["digital#fall6","digital#vier"]},{"title":"Moderation eines Online-Kommentars","text":"","blocks":[],"caseId":7,"mode":"four","refs":["digital#fall7","digital#vier"]}],"tasks":[{"title":"Die vier Stufen in der richtigen Reihenfolge","type":"select","prompt":"Ordne jeder Position die richtige Stufe zu.","refs":["digital#vier"],"pairs":[{"label":"Stufe 1","answer":"Legitimer Zweck","options":["Erforderlichkeit","Legitimer Zweck","Angemessenheit","Geeignetheit"]},{"label":"Stufe 2","answer":"Geeignetheit","options":["Erforderlichkeit","Legitimer Zweck","Angemessenheit","Geeignetheit"]},{"label":"Stufe 3","answer":"Erforderlichkeit","options":["Erforderlichkeit","Legitimer Zweck","Angemessenheit","Geeignetheit"]},{"label":"Stufe 4","answer":"Angemessenheit","options":["Erforderlichkeit","Legitimer Zweck","Angemessenheit","Geeignetheit"]}],"explanation":"Zuerst wird das Ziel geprüft. Danach folgen der Beitrag zum Ziel, der Vergleich mit gleich wirksamen milderen Mitteln und die Abwägung. Die Einordnung eines Eingriffs ist davon zu unterscheiden.","id":"verhaeltnis-1"},{"title":"Belege einer Prüfstufe zuordnen","type":"select","prompt":"Wähle die Stufe, zu der die jeweilige Begründung bei der Smartphone-Regel unmittelbar passt.","refs":["digital#fall4","digital#vier"],"pairs":[{"label":"Konzentrierten Unterricht zu schützen, ist ein zulässiges Ziel.","answer":"Legitimer Zweck","options":["Legitimer Zweck","Geeignetheit","Erforderlichkeit","Angemessenheit"]},{"label":"Das Unterbinden privater Nutzung kann Ablenkung verringern.","answer":"Geeignetheit","options":["Legitimer Zweck","Geeignetheit","Erforderlichkeit","Angemessenheit"]},{"label":"Es ist zu prüfen, ob Stummschaltung gleich wirksam und weniger belastend ist.","answer":"Erforderlichkeit","options":["Legitimer Zweck","Geeignetheit","Erforderlichkeit","Angemessenheit"]},{"label":"Die Rückgabe bis Unterrichtsende begrenzt die Belastung gegenüber dem Nutzen für das Lernen.","answer":"Angemessenheit","options":["Legitimer Zweck","Geeignetheit","Erforderlichkeit","Angemessenheit"]}],"explanation":"Die Quelle nennt Ziel, Dauer und mögliche Alternativen. In deiner Lösung erklärst du jeweils deren Bedeutung. Eine reine Wiederholung der Fallkarte wäre noch keine Anwendung der Quelle.","id":"verhaeltnis-2"},{"title":"Ein milderes Mittel richtig prüfen","type":"choice","prompt":"Die Fallkarte nennt Stummschaltung als Alternative. Welche Begründung prüft die Erforderlichkeit richtig?","refs":["digital#fall4","digital#vier"],"options":["Stummschaltung belastet weniger. Deshalb ist jede andere Maßnahme automatisch unzulässig.","Stummschaltung ist weniger belastend. Zusätzlich ist zu prüfen, ob sie die konkrete Störung gleich wirksam beendet.","Sobald Konzentration ein legitimes Ziel ist, braucht man keine Alternative mehr zu prüfen."],"correct":[1],"explanation":"Die Erforderlichkeit verbindet zwei Bedingungen: geringere Belastung und gleiche Wirksamkeit. Ob Stummschaltung ausreicht, muss am konkreten Verhalten beurteilt werden. Ein legitimes Ziel allein überspringt diese Prüfung nicht.","id":"verhaeltnis-3"},{"title":"Gesichtserkennung vollständig prüfen","type":"four","prompt":"Prüfe den Test aus Fallkarte 1 in allen vier Stufen. Nutze die Fallangaben und kennzeichne, was noch offen ist.","refs":["digital#fall1","digital#vier"],"caseId":1,"criteria":["Ich habe alle vier Stufen getrennt geprüft.","Ich habe mindestens eine genaue Fallangabe mit ihrer Bedeutung verbunden.","Ich habe beim milderen Mittel auch die gleiche Wirksamkeit geprüft.","Ich habe fehlende Angaben nicht durch erfundene Fakten ersetzt."],"id":"verhaeltnis-4"},{"title":"Die Smartphone-Regel vollständig prüfen","type":"four","prompt":"Prüfe genau die Regel aus Fallkarte 4. Berücksichtige Unterrichtsende, mögliche mildere Mittel und die verlangten Ausnahmen.","refs":["digital#fall4","digital#vier"],"caseId":4,"criteria":["Ich habe alle vier Stufen am konkreten Fall ausgeführt.","Ich habe die begrenzte Dauer aus der Quelle berücksichtigt.","Ich habe mildere Mittel und ihre Wirksamkeit verglichen.","Ich habe besondere Bedarfe und die offene Rechtsgrundlage berücksichtigt."],"id":"verhaeltnis-5"}]},{"id":"stellung","title":"Eine begründete Stellungnahme schreiben","short":"Stellungnahme","group":"Hauptteil","goal":"Du bearbeitest die Originalfälle und schreibst eine begründete Beurteilung mit 100 bis 150 Wörtern.","refs":["digital#auftrag","digital#fall1"],"learn":[{"title":"Die fünf Arbeitsaufträge der Fallkarten","text":"Die Fallkarten haben fünf Arbeitsaufträge. Das ist die Aufgabenstellung, keine allgemeine Fünf-Schritt-Methode für den ganzen Lernraum. Du siehst sie immer vollständig und kannst deine Analyse auf derselben Seite notieren.","table":[["Arbeitsauftrag","Was du tun sollst"],["1","Ordne mindestens zwei Grundrechte zu und erkläre den Konflikt."],["2","Trenne gesicherte Fakten von offenen Fragen."],["3","Bewerte Pro und Contra. Prüfe bei staatlichem Handeln die Verhältnismäßigkeit in vier Stufen."],["4","Entwickle einen Kompromiss oder eine Alternative."],["5","Beurteile abschließend in 100 bis 150 Wörtern."]]},{"title":"Analyse und Schlussurteil unterscheiden","text":"Die vier Stufen gehören in die Analyse einer staatlichen Maßnahme. Der abschließende Text fasst deine begründete Position zusammen. Die Vorgabe von 100 bis 150 Wörtern bezieht sich auf diese abschließende Beurteilung, nicht auf alle Arbeitsnotizen zusammen."},{"title":"Eine gute Begründung","text":"Nenne deine Position und den konkreten Grundrechtskonflikt. Nutze wenigstens eine genaue Angabe aus der Fallkarte. Erkläre Argumente beider Seiten und prüfe eine Alternative. Dein Ergebnis muss zu diesen Gründen passen. Ein Gegenargument wird nicht dadurch falsch, dass du am Ende anders urteilst."},{"title":"Offene Punkte gehören ins Urteil","text":"Bei Gesichtserkennung fehlen Angaben zur Fehlerquote. Beim Kommentar fehlt der Wortlaut. Beim Camp ist die Trägerschaft offen. Solche Lücken können ein bedingtes Urteil verlangen. Schreibe, unter welchen Voraussetzungen du zustimmen oder ablehnen würdest, statt Fakten zu erfinden."},{"title":"Selbst prüfen, nicht automatisch benoten","text":"Die Mustertexte zeigen eine mögliche gut begründete Lösung. Sie sind keine Lösungen deiner Lehrkraft und nicht die einzig zulässige Meinung. Deine eigene Begründung kann zu einem anderen Ergebnis kommen, wenn sie die Quelle richtig nutzt. Der Lernraum zählt Wörter und bietet Prüfpunkte; er bewertet keine freien Texte automatisch."}],"examples":[{"title":"Stellungnahme: Smartphone-Regel","text":"","blocks":[],"caseId":4,"mode":"opinion","refs":["digital#fall4"]},{"title":"Stellungnahme: Demonstration und Auflagen","text":"","blocks":[],"caseId":2,"mode":"opinion","refs":["digital#fall2"]},{"title":"Stellungnahme: Gesichtserkennung am Bahnhof","text":"","blocks":[],"caseId":1,"mode":"opinion","refs":["digital#fall1"]},{"title":"Stellungnahme: Religionsausdruck und Neutralität","text":"","blocks":[],"caseId":6,"mode":"opinion","refs":["digital#fall6"]},{"title":"Stellungnahme: Moderation eines Online-Kommentars","text":"","blocks":[],"caseId":7,"mode":"opinion","refs":["digital#fall7"]}],"tasks":[{"title":"Klassenchat, Meme und Persönlichkeitsrecht","type":"writing","prompt":"Bearbeite die fünf Arbeitsaufträge dieser Originalfallkarte. Nutze die Notizen für deine Analyse. Schreibe danach deine abschließende Beurteilung mit 100 bis 150 Wörtern.","refs":["digital#fall3"],"caseId":3,"fullCase":true,"targetWords":[100,150],"criteria":["Ich habe mindestens zwei Grundrechte und ihren Konflikt erklärt.","Ich habe Fakten, offene Fragen und mein Urteil getrennt.","Ich habe Pro und Contra sowie bei staatlichem Handeln alle vier Stufen geprüft.","Ich habe eine Alternative oder einen Kompromiss begründet.","Mein Schlussurteil nutzt einen konkreten Quellenbeleg und berücksichtigt offene Angaben."],"id":"stellung-1"},{"title":"Gesundheitsdaten und Jugendcamp","type":"writing","prompt":"Bearbeite die fünf Arbeitsaufträge dieser Originalfallkarte. Nutze die Notizen für deine Analyse. Schreibe danach deine abschließende Beurteilung mit 100 bis 150 Wörtern.","refs":["digital#fall5"],"caseId":5,"fullCase":true,"targetWords":[100,150],"criteria":["Ich habe mindestens zwei Grundrechte und ihren Konflikt erklärt.","Ich habe Fakten, offene Fragen und mein Urteil getrennt.","Ich habe Pro und Contra sowie bei staatlichem Handeln alle vier Stufen geprüft.","Ich habe eine Alternative oder einen Kompromiss begründet.","Mein Schlussurteil nutzt einen konkreten Quellenbeleg und berücksichtigt offene Angaben."],"id":"stellung-2"},{"title":"Gesichtserkennung am Bahnhof","type":"writing","prompt":"Bearbeite die fünf Arbeitsaufträge dieser Originalfallkarte. Nutze die Notizen für deine Analyse. Schreibe danach deine abschließende Beurteilung mit 100 bis 150 Wörtern.","refs":["digital#fall1"],"caseId":1,"fullCase":true,"targetWords":[100,150],"criteria":["Ich habe mindestens zwei Grundrechte und ihren Konflikt erklärt.","Ich habe Fakten, offene Fragen und mein Urteil getrennt.","Ich habe Pro und Contra sowie bei staatlichem Handeln alle vier Stufen geprüft.","Ich habe eine Alternative oder einen Kompromiss begründet.","Mein Schlussurteil nutzt einen konkreten Quellenbeleg und berücksichtigt offene Angaben."],"id":"stellung-3"},{"title":"Demonstration und Auflagen","type":"writing","prompt":"Bearbeite die fünf Arbeitsaufträge dieser Originalfallkarte. Nutze die Notizen für deine Analyse. Schreibe danach deine abschließende Beurteilung mit 100 bis 150 Wörtern.","refs":["digital#fall2"],"caseId":2,"fullCase":true,"targetWords":[100,150],"criteria":["Ich habe mindestens zwei Grundrechte und ihren Konflikt erklärt.","Ich habe Fakten, offene Fragen und mein Urteil getrennt.","Ich habe Pro und Contra sowie bei staatlichem Handeln alle vier Stufen geprüft.","Ich habe eine Alternative oder einen Kompromiss begründet.","Mein Schlussurteil nutzt einen konkreten Quellenbeleg und berücksichtigt offene Angaben."],"id":"stellung-4"},{"title":"Moderation eines Online-Kommentars","type":"writing","prompt":"Bearbeite die fünf Arbeitsaufträge dieser Originalfallkarte. Nutze die Notizen für deine Analyse. Schreibe danach deine abschließende Beurteilung mit 100 bis 150 Wörtern.","refs":["digital#fall7"],"caseId":7,"fullCase":true,"targetWords":[100,150],"criteria":["Ich habe mindestens zwei Grundrechte und ihren Konflikt erklärt.","Ich habe Fakten, offene Fragen und mein Urteil getrennt.","Ich habe Pro und Contra sowie bei staatlichem Handeln alle vier Stufen geprüft.","Ich habe eine Alternative oder einen Kompromiss begründet.","Mein Schlussurteil nutzt einen konkreten Quellenbeleg und berücksichtigt offene Angaben."],"id":"stellung-5"}]}],"cases":[{"id":1,"title":"Gesichtserkennung am Bahnhof","sourcePage":3,"scenario":"Eine Stadt plant einen sechswöchigen Test mit Gesichtserkennung am Bahnhof, um Personen mit Haftbefehl zu finden. Bilder ohne Treffer sollen rasch gelöscht werden.","actors":"Stadt/Polizei; Reisende; Gesuchte; Datenschutzaufsicht.","rights":"Informationelle Selbstbestimmung; ggf. Freizügigkeit; Schutz von Leben und körperlicher Unversehrtheit.","facts":"Testzeit und Zweck sind genannt. Datenbasis, Fehlerquote und Rechtsgrundlage sind offen.","questions":"Reicht die Grundlage? Ist anlassloses Scannen erforderlich? Sicherheitsbehörde betont Schutz; Reisende befürchten Generalverdacht; Datenschutz fordert Transparenz.","conflict":"Die Erfassung von Gesichtern betrifft die informationelle Selbstbestimmung der Reisenden. Dem steht das Interesse an Sicherheit gegenüber. Die Fallkarte nennt dazu den Schutz von Leben und körperlicher Unversehrtheit. Sie sagt aber nicht, dass alle gesuchten Personen eine konkrete Gefahr für andere darstellen.","analysis":[{"title":"Legitimer Zweck","text":"Gesuchte Personen zu finden, kann der Strafverfolgung und der Sicherheit dienen. Damit verfolgt die Stadt grundsätzlich ein zulässiges Ziel. Fallkarte 1, Seite 3, nennt den Zweck des Tests, belegt aber noch nicht den Nutzen dieser konkreten Technik."},{"title":"Geeignetheit","text":"Ein Abgleich von Gesichtern kann helfen, gesuchte Personen zu erkennen. Das setzt voraus, dass Datenbasis und Verfahren ausreichend zuverlässig sind. Weil die Fallkarte gerade die Fehlerquote offenlässt, ist die tatsächliche Eignung nur unter dieser Bedingung anzunehmen."},{"title":"Erforderlichkeit","text":"Gezielte Kontrollen könnten weniger unbeteiligte Reisende erfassen und wären damit eine denkbare mildere Alternative. Es muss aber geprüft werden, ob sie die gesuchten Personen gleich wirksam finden. Dazu fehlen Angaben; deshalb ist die Erforderlichkeit des flächigen Scannens nicht nachgewiesen."},{"title":"Angemessenheit","text":"Die Maßnahme erfasst auch Reisende, gegen die kein Verdacht besteht; Fehlzuordnungen können zusätzlich belasten. Die sechs Wochen und die geplante rasche Löschung begrenzen den Eingriff, beseitigen ihn aber nicht. Ohne Angaben zu Fehlern, tatsächlicher Löschung und Sicherheitsgewinn lässt sich das Gewicht des Nutzens nicht zuverlässig mit dem Eingriff vergleichen."}],"result":"Der Test ist nicht schon deshalb verhältnismäßig, weil sein Ziel legitim ist. Nach dem Material bleiben Eignung, Alternativen und Nutzen teilweise offen. Auch eine tragfähige Rechtsgrundlage muss geklärt werden; die vier Stufen ersetzen diese Prüfung nicht.","opinion":"Ich halte eine Zustimmung zu dem geplanten Test derzeit für nicht ausreichend begründet. Fallkarte 1 auf Seite 3 nennt zwar sechs Wochen und eine rasche Löschung von Bildern ohne Treffer. Sie lässt aber Rechtsgrundlage, Datenbasis und Fehlerquote offen. Für den Test spricht, dass er beim Finden gesuchter Personen helfen könnte. Dagegen steht der Eingriff in die informationelle Selbstbestimmung vieler unbeteiligter Reisender. Dem steht das in der Fallkarte genannte Interesse am Schutz von Leben und körperlicher Unversehrtheit gegenüber. Die Befristung verringert die Belastung, beweist aber nicht die Erforderlichkeit. Zunächst sollten gezielte Kontrollen als milderes Mittel auf gleiche Wirksamkeit geprüft werden. Mein Urteil könnte sich ändern, wenn eine tragfähige Grundlage, zuverlässige Ergebnisse und ausreichende Schutzmaßnahmen belegt sind."},{"id":2,"title":"Demonstration und Auflagen","sourcePage":4,"scenario":"Für eine große Klimademonstration ordnet die Behörde eine andere Route, frühere Endzeit und ein Gegenstandsverbot an. Sie verweist auf Rettungswege und erwartete Gegenproteste.","actors":"Versammlungsleitung; Teilnehmende; Anwohnende; Polizei/Rettungsdienste.","rights":"Versammlungsfreiheit; Meinungsfreiheit; körperliche Unversehrtheit.","facts":"Friedliche Versammlung ist angezeigt; Rettungswege müssen frei bleiben; Auflagen sind erlassen.","questions":"Wie konkret ist die Gefahr? Ist die Ersatzroute wirksam? Demonstrierende betonen Sichtbarkeit; Behörde Schutz und Rettungswege; Anwohnende Belastung.","conflict":"Die Demonstrierenden wollen ihre Meinung gemeinsam und sichtbar äußern. Deshalb sind Versammlungsfreiheit und Meinungsfreiheit betroffen. Die Behörde verweist auf Rettungswege und Sicherheit; hier ist die körperliche Unversehrtheit anderer Menschen zu berücksichtigen. Jede der drei Auflagen braucht eine eigene Begründung.","analysis":[{"title":"Legitimer Zweck","text":"Rettungswege freizuhalten und Menschen vor Verletzungen zu schützen, sind legitime Ziele. Fallkarte 2, Seite 4, nennt beide Sicherheitsaspekte. Das Ziel darf aber nicht darin bestehen, eine unliebsame Meinung aus dem öffentlichen Raum zu verdrängen."},{"title":"Geeignetheit","text":"Eine andere Route kann Rettungswege freihalten, wenn diese sonst tatsächlich blockiert wären. Bei der früheren Endzeit und dem Gegenstandsverbot muss die Behörde jeweils erklären, wie die Auflage eine konkrete Gefahr verringert. Die bloße Erwartung von Gegenprotesten belegt diese Wirkung noch nicht für jede Auflage."},{"title":"Erforderlichkeit","text":"Ein freigehaltener Korridor oder eine kleinere Änderung der Route wären denkbare mildere Mittel. Für das Gegenstandsverbot wäre zu prüfen, ob ein Verbot nur konkret gefährlicher Gegenstände ausreicht. Die Behörde muss vergleichen, ob solche gezielten Maßnahmen die Sicherheit ebenso wirksam gewährleisten."},{"title":"Angemessenheit","text":"Die Auflagen können Dauer und Sichtbarkeit der Demonstration deutlich begrenzen. Dem steht das hohe Gewicht freier Rettungswege und körperlicher Unversehrtheit gegenüber. Eine noch gut sichtbare Ersatzroute kann eher vertretbar sein als eine Verlagerung ohne Publikum; zur tatsächlichen Ersatzroute und Gefahr fehlen jedoch Angaben."}],"result":"Eine pauschale Zustimmung zu allen Auflagen lässt sich aus der Fallkarte nicht begründen. Route, Endzeit und Gegenstandsverbot sind getrennt zu prüfen. Vertretbar sind gezielte Auflagen, wenn sie belegte Gefahren begrenzen und die Versammlung nicht stärker als nötig beeinträchtigen.","opinion":"Ich befürworte nur solche Auflagen, die eine konkrete Gefahr begrenzen und die Demonstration weiterhin sichtbar lassen. Fallkarte 2 auf Seite 4 nennt freie Rettungswege als notwendige Bedingung. Das spricht für geeignete Schutzmaßnahmen und betrifft die körperliche Unversehrtheit. Gleichzeitig schützen Versammlungsfreiheit und Meinungsfreiheit die friedliche Demonstration. Eine andere Route, eine frühere Endzeit und ein Gegenstandsverbot dürfen deshalb nicht pauschal zusammen gerechtfertigt werden. Für jede Auflage muss die Behörde Nutzen und Erforderlichkeit erklären. Als milderer Kompromiss kommen freigehaltene Rettungskorridore und gezielte Verbote gefährlicher Gegenstände in Betracht. Ob sie gleich wirksam sind, ist zu prüfen. Ohne genauere Angaben zur Gefahr und zur Ersatzroute bleibt mein Urteil bedingt. Bloße Befürchtungen reichen als Begründung für weitreichende Einschränkungen nicht aus."},{"id":3,"title":"Klassenchat, Meme und Persönlichkeitsrecht","sourcePage":5,"scenario":"Im Klassenchat wird ein bearbeitetes, abwertendes Bild einer Mitschülerin weitergeleitet. Die Schule erwägt pädagogische Maßnahmen und eine befristete Einschränkung der Chatnutzung auf Schulgeräten.","actors":"Betroffene Schülerin; postende/weiterleitende Lernende; Schule; Eltern.","rights":"Allgemeines Persönlichkeitsrecht; Meinungsfreiheit; Würdeschutz.","facts":"Ein bearbeitetes Bild wurde verbreitet. Reichweite, Urheberschaft und Kontext sind zu klären.","questions":"Meinung, Schmähung oder Mobbing? Welche Zuständigkeit hat die Schule? Betroffene fordert Schutz; Postende Person verweist evtl. auf „Witz“; Schule muss aufklären und schützen.","conflict":"Das allgemeine Persönlichkeitsrecht schützt die betroffene Schülerin. Die weiterleitende Person könnte sich auf Meinungsfreiheit berufen; das beendet den Konflikt aber nicht. Das private Weiterleiten ist von einer möglichen staatlichen Maßnahme der Schule zu unterscheiden. Die folgende Prüfung gilt für die Einschränkung auf Schulgeräten, soweit die Schule staatlich handelt.","analysis":[{"title":"Legitimer Zweck","text":"Die Schule will die betroffene Schülerin schützen und weitere abwertende Verbreitung verhindern. Das ist grundsätzlich ein legitimer Zweck. Fallkarte 3, Seite 5, belegt die Verbreitung eines bearbeiteten Bildes, lässt aber Urheberschaft und Kontext offen."},{"title":"Geeignetheit","text":"Eine Einschränkung der Chatnutzung auf Schulgeräten kann die Weiterleitung über diese Geräte erschweren. Sie verhindert jedoch nicht automatisch die Nutzung privater Geräte. Pädagogische Maßnahmen können ebenfalls zum Schutz beitragen; ihre konkrete Ausgestaltung ist im Fall noch nicht beschrieben."},{"title":"Erforderlichkeit","text":"Gespräche, die Aufforderung zum Löschen und gezielte Maßnahmen gegen nachgewiesene Weiterleitung wären denkbare mildere Mittel. Ob sie den Schutz gleich wirksam erreichen, hängt von Reichweite und weiterem Verhalten ab. Weil diese Angaben fehlen, darf eine pauschale Einschränkung für alle nicht ohne Vergleich als erforderlich gelten."},{"title":"Angemessenheit","text":"Der Schutz der Schülerin wiegt schwer, weil die Verbreitung ihre Persönlichkeit beeinträchtigen kann. Eine Beschränkung auf Schulgeräten ist weniger weitreichend als ein allgemeines Kommunikationsverbot, kann aber auch unbeteiligte Lernende treffen. Dauer, betroffener Personenkreis und schulische Zuständigkeit müssen deshalb vor einer abschließenden Bewertung geklärt werden."}],"result":"Zuerst sind Schutz und Sachverhaltsklärung nötig, nicht eine unbelegte Schuldzuweisung. Die Verhältnismäßigkeit betrifft hier die schulische Maßnahme; private Kommunikation ist nicht automatisch staatliches Handeln. Das Material erlaubt weder ein pauschales Verbot jeder Chatnutzung noch die Aussage, ein „Witz“ sei stets geschützt.","opinion":"Ich halte gezielten Schutz der Schülerin für notwendig, lehne aber eine unbegründete Einschränkung für die ganze Klasse ab. Fallkarte 3 auf Seite 5 belegt die Verbreitung eines bearbeiteten Bildes. Urheberschaft, Reichweite und Kontext sind noch offen. Das allgemeine Persönlichkeitsrecht der Schülerin steht einer Berufung auf Meinungsfreiheit gegenüber. Die Bezeichnung als Witz löst diesen Konflikt nicht. Für eine befristete Einschränkung auf Schulgeräten spricht, dass sie weitere Verbreitung erschweren könnte. Dagegen spricht, dass sie unbeteiligte Lernende treffen und private Geräte nicht erfassen kann. Zuerst sollten Gespräche, Löschung und gezielte Maßnahmen geprüft werden. Eine weitergehende Beschränkung ist nur überzeugend, wenn mildere Mittel nicht gleich wirksam schützen. Die Schule muss außerdem ihre Zuständigkeit klären und ihr Vorgehen nachvollziehbar begründen."},{"id":4,"title":"Smartphone-Regel","sourcePage":6,"scenario":"Eine Schule untersagt private Smartphone-Nutzung im Unterricht. Bei Wiederholung wird das Gerät bis Unterrichtsende verwahrt. Ein Kurs verlangt Ausnahmen für medizinische Apps, Übersetzung und Notfälle.","actors":"Lernende; Lehrkräfte; Schulleitung; Eltern.","rights":"Allgemeine Handlungsfreiheit; Kommunikation; Recht auf Bildung und Schutz der Lernumgebung.","facts":"Es geht um Unterrichtszeit und befristetes Verwahren; Konzentration ist Ziel; besondere Bedarfe können bestehen.","questions":"Ist die Regel klar und gleich? Reichen Handyparkplatz oder Stummschaltung? Lehrkraft: Konzentration; Lernende: Eigenverantwortung; Person mit Bedarf: notwendige Ausnahme.","conflict":"Die Regel begrenzt die private Nutzung und Kommunikation der Lernenden. Auf der anderen Seite stehen konzentriertes Lernen und eine geschützte Lernumgebung. Medizinische Apps können außerdem für die Gesundheit notwendig sein. Die folgende staatliche Eingriffsprüfung setzt voraus, dass die Schule öffentlich handelt; die konkrete Rechtsgrundlage nennt die Fallkarte nicht.","analysis":[{"title":"Legitimer Zweck","text":"Konzentrierten Unterricht und die Lernumgebung zu schützen, ist ein legitimes Ziel. Fallkarte 4, Seite 6, nennt Konzentration ausdrücklich als Zweck. Das Ziel rechtfertigt aber nicht automatisch jede Form oder Dauer des Geräteentzugs."},{"title":"Geeignetheit","text":"Ein Verbot privater Nutzung kann Ablenkungen im Unterricht verringern. Die Verwahrung bei wiederholtem Verstoß kann dazu beitragen, dass die Nutzung tatsächlich endet. Damit ist ein Beitrag zum Ziel nachvollziehbar; eine Aussage, jedes Smartphone störe immer, wäre dagegen nicht durch die Quelle belegt."},{"title":"Erforderlichkeit","text":"Die Fallkarte nennt Handyparkplatz und Stummschaltung als mögliche mildere Mittel. Es ist zu prüfen, ob diese Maßnahmen im konkreten Fall ebenso wirksam gegen die Störung helfen. Bei wiederholter Nutzung trotz einer milderen Regel kann eine befristete Verwahrung eher erforderlich sein; ein solcher Verlauf muss aber festgestellt werden."},{"title":"Angemessenheit","text":"Die Begrenzung auf die Unterrichtszeit und die Rückgabe bis Unterrichtsende verringern die Belastung. Gegen ein ausnahmsloses Vorgehen sprechen medizinische Anwendungen sowie begründete Bedarfe für Übersetzung und Notfälle. Mit klaren Ausnahmen und verlässlicher Rückgabe kann der Nutzen für den Unterricht eher in einem angemessenen Verhältnis zum Eingriff stehen."}],"result":"Die Regel ist in einer klar begrenzten Form begründbar, aber nicht ohne Prüfung von Alternativen und Ausnahmen. Aus dem Blatt folgt kein allgemeines Recht der Schule auf beliebig lange Verwahrung. Zuständigkeit und Rechtsgrundlage bleiben zusätzlich zu klären.","opinion":"Ich halte eine begrenzte Regel zur privaten Smartphone-Nutzung für vertretbar, aber nicht ein ausnahmsloses Verbot. Fallkarte 4 auf Seite 6 nennt Konzentration als Ziel und eine Verwahrung nur bis Unterrichtsende. Das spricht für einen zeitlich begrenzten Eingriff. Zugleich sind die allgemeine Handlungsfreiheit und die Kommunikation der Lernenden betroffen. Medizinische Anwendungen berühren zudem den Schutz der Gesundheit. Vor einer Verwahrung sollten Stummschaltung oder Handyparkplatz als mildere Mittel geprüft werden. Sie müssen den Unterricht gleich wirksam schützen. Bei wiederholten Verstößen kann die befristete Verwahrung eher nötig sein. Als Kompromiss befürworte ich klare Regeln, verlässliche Rückgabe und begründete Ausnahmen für medizinische Apps, Übersetzung und Notfälle. Eine abschließende rechtliche Bewertung setzt außerdem eine passende Rechtsgrundlage voraus."},{"id":5,"title":"Gesundheitsdaten und Jugendcamp","sourcePage":7,"scenario":"Ein Veranstalter erwägt freiwillige Gesundheitsangaben für ein Jugendcamp, um Infektionsrisiken zu senken. Ohne Angaben könnten zusätzliche Schutzmaßnahmen gelten.","actors":"Teilnehmende; Veranstalter; medizinische Beratung; vulnerable Personen.","rights":"Informationelle Selbstbestimmung; körperliche Unversehrtheit; Gleichheit; Handlungsfreiheit.","facts":"Gesundheitsdaten sind sensibel; Infektionsschutz ist Zweck. Rechtsgrundlage und Datenverarbeitung sind zu recherchieren.","questions":"Ist die Angabe freiwillig? Welche Daten sind nötig? Vulnerable Person betont Schutz und Teilhabe; Teilnehmende den Datenschutz; Veranstalter Verantwortung.","conflict":"Datenschutz und freie Entscheidung der Teilnehmenden stehen dem Schutz vor Infektionen gegenüber. Die Fallkarte nennt außerdem Gleichheit, weil Personen ohne Angaben anders behandelt werden könnten. Ob der Veranstalter staatlich oder privat ist, bleibt offen. Die vier Stufen sind deshalb nur bei staatlichem Handeln eine unmittelbare Grundrechtsprüfung; sonst dienen sie hier als begründete Abwägung.","analysis":[{"title":"Legitimer Zweck","text":"Das Senken von Infektionsrisiken schützt die körperliche Unversehrtheit und ist ein legitimes Ziel. Besonders gefährdete Personen haben ein nachvollziehbares Interesse an sicherer Teilnahme. Daraus folgt aber noch nicht, dass jede Gesundheitsangabe für dieses Ziel benötigt wird."},{"title":"Geeignetheit","text":"Gesundheitsangaben können Schutzmaßnahmen unterstützen, wenn sie für das konkrete Infektionsrisiko aussagekräftig sind. Fallkarte 5, Seite 7, nennt weder die genauen Daten noch ihre Verwendung. Ohne diese Angaben ist eine zuverlässige Bewertung der Eignung noch nicht möglich."},{"title":"Erforderlichkeit","text":"Denkbare mildere Mittel wären allgemeine Schutzmaßnahmen oder die Abfrage weniger, tatsächlich benötigter Daten. Verglichen werden muss, ob sie das Infektionsrisiko gleich wirksam senken. Auch die zusätzlichen Maßnahmen für Personen ohne Angaben müssen beschrieben werden, bevor man sie als mild oder belastend bewerten kann."},{"title":"Angemessenheit","text":"Der Gesundheitsschutz hat großes Gewicht, besonders für gefährdete Teilnehmende. Dem stehen sensible persönliche Daten und mögliche Nachteile bei einer verweigerten Angabe gegenüber. Eine nur angeblich freiwillige Entscheidung unter erheblichem Druck wäre besonders problematisch; das tatsächliche Ausmaß solcher Nachteile ist aber offen."}],"result":"Eine Zustimmung ohne nähere Angaben wäre nicht ausreichend begründet. Zuerst müssen Trägerschaft, Datenumfang, Verwendung und Folgen einer Nichtangabe geklärt werden. Eine Bedingung oder offene Frage darf in der Lösung nicht als bewiesene Tatsache erscheinen.","opinion":"Ich befürworte Schutz vor Infektionen, aber keine pauschale Abfrage von Gesundheitsdaten. Fallkarte 5 auf Seite 7 lässt offen, welche Daten erhoben und wie sie verarbeitet werden. Die körperliche Unversehrtheit gefährdeter Personen spricht für wirksame Vorsorge. Die informationelle Selbstbestimmung spricht dafür, sensible Angaben auf das Nötige zu begrenzen. Zusätzliche Maßnahmen bei fehlenden Angaben können sinnvoll sein, dürfen die behauptete Freiwilligkeit aber nicht durch unangemessenen Druck entwerten. Als Kompromiss sollten allgemeine Schutzmaßnahmen und eine sparsame Datenerhebung auf gleiche Wirksamkeit geprüft werden. Auch die Folgen einer Nichtangabe müssen transparent sein. Ob eine unmittelbare staatliche Grundrechtsprüfung nötig ist, hängt vom Veranstalter ab; seine Trägerschaft ist nicht genannt. Solange Datenumfang, Verwendung und Rechtsgrundlage ungeklärt sind, bleibt meine Zustimmung an Bedingungen gebunden."},{"id":6,"title":"Religionsausdruck und Neutralität","sourcePage":8,"scenario":"Eine Schülerin möchte an einer öffentlichen Schule ein sichtbares religiöses Symbol tragen. Die Schule diskutiert eine Kleidungsregel; konkrete Störungen sind nicht dokumentiert.","actors":"Schülerin; Klasse; Lehrkräfte; Schulleitung.","rights":"Religionsfreiheit; Persönlichkeitsentfaltung; Gleichheit; staatliche Neutralität.","facts":"Öffentliche Schule und sichtbares Symbol sind gegeben; konkrete Störung ist nicht festgestellt.","questions":"Reichweite der Neutralität gegenüber Lernenden? Verbot ohne Gefahr angemessen? Schülerin: Identität; Schule: Gleichbehandlung; Klasse: Vielfalt und friedliches Lernen.","conflict":"Das Symbol betrifft Religionsfreiheit und Persönlichkeitsentfaltung der Schülerin. Die Schule nennt Neutralität und Gleichbehandlung. Staatliche Neutralität ist dabei eine Anforderung an den Staat und nicht selbst ein Grundrecht der Schule. Es muss geprüft werden, ob sie ein Verbot gegenüber einer Schülerin überhaupt trägt.","analysis":[{"title":"Legitimer Zweck","text":"Friedliches Lernen und eine gleichberechtigte Behandlung sind legitime Ziele. Auch staatliche Neutralität ist für eine öffentliche Schule zu beachten. Daraus folgt aber nicht ohne Begründung das Ziel, jedes sichtbare religiöse Zeichen von Lernenden zu entfernen."},{"title":"Geeignetheit","text":"Ein Verbot würde zwar das Symbol aus dem Unterricht entfernen. Ob dies friedliches Lernen tatsächlich fördert, ist damit noch nicht belegt. Nach Fallkarte 6, Seite 8, sind konkrete Störungen nicht dokumentiert; die Schule muss deshalb den Zusammenhang zwischen Symbol und behauptetem Problem erklären."},{"title":"Erforderlichkeit","text":"Gemeinsame Regeln für respektvolles Verhalten und gezieltes Eingreifen bei tatsächlichen Störungen wären denkbare mildere Mittel. Sie würden religiösen Ausdruck nicht pauschal verbieten. Es fehlt bisher eine Begründung, warum solche Mittel das friedliche Zusammenleben nicht gleich wirksam schützen könnten."},{"title":"Angemessenheit","text":"Ein Verbot würde den persönlichen Glaubensausdruck der Schülerin erheblich begrenzen. Dem steht in der Fallkarte kein belegter konkreter Sicherheitsgewinn gegenüber. Ohne dokumentierte Störung und ohne nachvollziehbare Begründung wiegt die Belastung daher stärker als der bisher erkennbare Nutzen des Verbots."}],"result":"Nach den vorliegenden Angaben spricht mehr gegen ein pauschales Verbot. Das ist eine am Material begründete Bewertung und kein Urteil über jede denkbare Kleidungsvorschrift. Neue, belegte Umstände könnten eine erneute Prüfung verlangen.","opinion":"Ich lehne ein pauschales Verbot des religiösen Symbols nach den vorliegenden Angaben ab. Fallkarte 6 auf Seite 8 hält fest, dass konkrete Störungen nicht dokumentiert sind. Die Religionsfreiheit und die Persönlichkeitsentfaltung der Schülerin sprechen für das Tragen des Symbols. Für eine schulische Regel sprechen friedliches Lernen und Gleichbehandlung. Staatliche Neutralität bedeutet jedoch nicht ohne Weiteres, dass Lernende keine Religion zeigen dürfen. Ein Verbot würde die Schülerin deutlich belasten, ohne dass das Material einen entsprechenden Nutzen belegt. Als milderer Weg kommen gemeinsame Regeln für respektvolles Verhalten und gezielte Maßnahmen bei tatsächlichen Störungen in Betracht. Daher überzeugt mich ein allgemeines Verbot nicht. Sollten später konkrete Gefahren nachgewiesen werden, müssten mögliche Maßnahmen erneut und einzeln auf ihre Verhältnismäßigkeit geprüft werden."},{"id":7,"title":"Moderation eines Online-Kommentars","sourcePage":9,"scenario":"Eine kommunale Social-Media-Seite verbirgt einen scharfen kritischen Kommentar. Die Kommune verweist auf Netiquette gegen Beleidigungen und Desinformation; die kommentierende Person verlangt Begründung.","actors":"Kommune; kommentierende Person; andere Nutzende; Plattform.","rights":"Meinungsfreiheit; Gleichbehandlung; ggf. Persönlichkeitsrechte.","facts":"Kommentar wurde verborgen, Netiquette existiert; Wortlaut und Moderationspraxis müssen geprüft werden.","questions":"Werturteil oder Tatsachenbehauptung? Regeln vorhersehbar und gleich angewandt? Person: Kritik braucht Raum; Kommune: Schutz der Debatte; Publikum: transparente Moderation.","conflict":"Das Verbergen durch die Kommune betrifft Meinungsfreiheit und Gleichbehandlung. Falls der Kommentar andere Personen angreift, können deren Persönlichkeitsrechte hinzukommen. Die Kommune handelt als staatliche Stelle; ihre Entscheidung ist von Handlungen des privaten Plattformbetreibers zu unterscheiden. Der bloße Verweis auf eine Netiquette ersetzt die rechtliche Begründung nicht.","analysis":[{"title":"Legitimer Zweck","text":"Andere Menschen vor Beleidigungen zu schützen und eine faire Debatte zu ermöglichen, sind legitime Ziele. Das Unterdrücken bloß unbequemer Kritik wäre dagegen kein tragfähiger Zweck. Fallkarte 7, Seite 9, nennt die Begründung der Kommune, enthält aber nicht den Wortlaut des Kommentars."},{"title":"Geeignetheit","text":"Das Verbergen kann die Verbreitung eines rechtsverletzenden Inhalts begrenzen. Ob es hier zu einem legitimen Schutz beiträgt, lässt sich erst anhand des tatsächlichen Inhalts beurteilen. Scharfe Kritik darf nicht allein wegen ihrer Schärfe mit Beleidigung oder einer falschen Tatsachenbehauptung gleichgesetzt werden."},{"title":"Erforderlichkeit","text":"Eine Rückfrage, ein sachlicher Hinweis oder die Begrenzung nur der problematischen Teile wären denkbare mildere Mittel. Bei einem konkret verletzenden Inhalt könnten sie aber weniger wirksam sein als das Verbergen. Weil der Wortlaut fehlt, ist dieser Vergleich im vorliegenden Fall noch offen."},{"title":"Angemessenheit","text":"Die Entfernung beschränkt die öffentliche Sichtbarkeit der Kritik an einer staatlichen Stelle. Dem können schutzwürdige Persönlichkeitsrechte und eine geordnete Debatte gegenüberstehen. Ohne klare Begründung, Prüfung des Wortlauts und gleichmäßige Anwendung der Regeln ist eine abschließende Rechtfertigung des Eingriffs nicht möglich."}],"result":"Die Kommune sollte den konkreten Grund nachvollziehbar erklären und den Kommentar anhand einer einheitlichen Praxis prüfen. Aus der Existenz einer Netiquette folgt nicht, dass jede Entfernung zulässig ist. Ebenso wenig ist allein wegen des fehlenden Wortlauts bewiesen, dass die Moderation in jedem Fall unzulässig war.","opinion":"Ich halte das Verbergen des Kommentars auf Grundlage der vorhandenen Angaben für nicht ausreichend begründet. Fallkarte 7 auf Seite 9 nennt eine Netiquette, enthält aber nicht den Wortlaut. Die Meinungsfreiheit schützt auch scharfe Kritik an der Kommune. Gleichbehandlung verlangt zudem eine einheitliche Anwendung der Regeln. Für eine Entfernung können der Schutz anderer Personen und eine faire Debatte sprechen. Ob der Kommentar tatsächlich beleidigt oder falsche Tatsachen verbreitet, ist jedoch offen. Zuerst sollte die Kommune den konkreten Grund nennen und mildere Mittel wie eine Rückfrage oder einen sachlichen Hinweis prüfen. Bei einem belegten schweren Angriff könnte Verbergen eher gerechtfertigt sein. Reine Kritik darf dagegen nicht bloß wegen ihrer Unbequemlichkeit verschwinden. Mein Urteil bleibt deshalb vom tatsächlichen Inhalt abhängig."}],"states":[["Baden-Württemberg","Stuttgart"],["Bayern","München"],["Berlin","Berlin"],["Brandenburg","Potsdam"],["Bremen","Bremen"],["Hamburg","Hamburg"],["Hessen","Wiesbaden"],["Mecklenburg-Vorpommern","Schwerin"],["Niedersachsen","Hannover"],["Nordrhein-Westfalen","Düsseldorf"],["Rheinland-Pfalz","Mainz"],["Saarland","Saarbrücken"],["Sachsen","Dresden"],["Sachsen-Anhalt","Magdeburg"],["Schleswig-Holstein","Kiel"],["Thüringen","Erfurt"]],"orders":["Ordne mindestens zwei Grundrechte zu und erkläre den Konflikt.","Trenne gesicherte Fakten von offenen Fragen.","Bewerte Pro und Contra. Prüfe bei staatlichem Handeln die Verhältnismäßigkeit in vier Stufen.","Entwickle einen Kompromiss oder eine Alternative.","Beurteile abschließend in 100 bis 150 Wörtern."],"stages":["Legitimer Zweck","Geeignetheit","Erforderlichkeit","Angemessenheit"],"gaps":[{"title":"Bundespräsident","text":"Das Thema steht in deiner Themenliste. Die hochgeladenen Unterlagen enthalten dazu keinen eigenen Lerninhalt. Deshalb gibt es hier keine zusätzlich erfundenen Fragen zu Person, Wahl oder Aufgaben."},{"title":"Bundeswirtschaftsministerin","text":"Das Thema steht in deiner Themenliste. Eine dazugehörige Unterrichtsseite oder Namensliste ist nicht enthalten. Deshalb wird keine externe Ministerliste als Prüfungsstoff ergänzt."},{"title":"Bundesminister","text":"In den vorhandenen Unterlagen steht keine Liste der abzufragenden Minister oder Ressorts. Ohne diese Grundlage bleiben Zuordnungen und Fragen dazu ausgespart."},{"title":"Hefteintrag: Bundesverfassungsgericht","text":"Der eigentliche Hefteintrag fehlt. Artikel 18 im GG-Auszug nennt das Gericht im Zusammenhang mit Grundrechtsverwirkung. Das ersetzt keinen Hefteintrag zu Aufbau oder weiteren Aufgaben. Dazu werden keine zusätzlichen Prüfungsfragen erstellt."}]}</script>
<script id="source-data" type="application/json">[{"id":"grundwissen","title":"Grundwissen","original":"Grundwissen.pdf · 2 Seiten","note":"Textfassung deiner Unterlage. Die Seitenangaben beziehen sich auf das PDF. Kopfzeilen für Name, Klasse und Datum sind weggelassen.","sections":[{"id":"art20","title":"Seite 1 · Artikel 20 GG","text":"Artikel 20 GG wird auch als \"Verfassung in Kurzform\" bezeichnet.\n\n(1) Die Bundesrepublik Deutschland ist ein demokratischer und sozialer Bundesstaat. \n(2) Alle Staatsgewalt geht vom Volke aus. Sie wird vom Volke in Wahlen und Abstimmungen und durch besondere Organe der Gesetzgebung, der vollziehenden Gewalt und der Rechtsprechung ausgeübt. \n(3) Die Gesetzgebung ist an die verfassungsmäßige Ordnung, die vollziehende Gewalt und die Rechtsprechung sind an Gesetz und Recht gebunden. \n(4) Gegen jeden, der es unternimmt, diese Ordnung zu beseitigen, haben alle Deutschen das Recht zum Widerstand, wenn andere Abhilfe nicht möglich ist.\n\nArtikel 20 GG beschreibt die Strukturprinzipien der Bundesrepublik."},{"id":"prinzipien","title":"Seiten 1 und 2 · Staatsprinzipien","text":"","table":[["Begriff","Erklärung aus dem Grundwissen"],["Bundesstaat","Ein Bundesstaat ist ein Zusammenschluss mehrerer Gliedstaaten zu einem gemeinsamen Gesamtstaat. Im Unterschied zu einem lockeren Staatenbund verfügt er über eine zentrale Staatsgewalt und eine gemeinsame Regierung. Die Bundesrepublik Deutschland ist ein Bundesstaat, der aus 16 Bundesländern besteht, die jeweils eigene staatliche Strukturen besitzen."],["Demokratie","Der Begriff stammt aus dem Griechischen („demos“ = Volk, „kratos“ = Herrschaft) und bedeutet „Herrschaft des Volkes“. In einer Demokratie geht die politische Macht vom Volk aus und wird in der Regel durch gewählte Vertreter ausgeübt."],["Rechtsstaat","Ein Rechtsstaat ist ein Staat, in dem staatliches Handeln an Recht und Gesetz gebunden ist. Er gewährleistet Grundrechte und unterliegt der Kontrolle unabhängiger Gerichte."],["Sozi
