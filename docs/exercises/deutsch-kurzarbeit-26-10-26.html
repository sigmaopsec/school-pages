(function(root,factory){if(typeof module==="object"&&module.exports)module.exports=factory();else root.SMFData=factory();})(typeof globalThis!=="undefined"?globalThis:this,function(){return {"forms":{"A":[{"id":"mock:A:name:1","term":"metapher","terms":["metapher"],"kind":"input","mode":"definition","category":"bild","material":true,"level":4,"points":2,"prompt":"Benenne das bildhafte Mittel in „das Herz brechen“.","text":"Jemandem das Herz brechen.","answers":["Metapher"],"answer":"Metapher","explanation":"Ein Ausdruck ist bildlich gemeint, nicht wörtlich. Eine Metapher überträgt einen Ausdruck aufgrund einer wahrgenommenen Ähnlichkeit in einen anderen Bedeutungsbereich.","section":"A · Stilmittel benennen"},{"id":"mock:A:name:2","term":"vergleich","terms":["vergleich"],"kind":"input","mode":"definition","category":"bild","material":true,"level":4,"points":2,"prompt":"Welches Mittel verbindet Leser und Kind?","text":"Der Leser ist neugierig wie ein Kind.","answers":["Vergleich"],"answer":"Vergleich","explanation":"Zwei Dinge werden ausdrücklich mit „wie“ oder „als“ verbunden. Ein Vergleich setzt Sachverhalte anhand eines gemeinsamen Merkmals ausdrücklich in Beziehung, häufig durch „wie“ oder „als“.","section":"A · Stilmittel benennen"},{"id":"mock:A:name:3","term":"anapher","terms":["anapher"],"kind":"input","mode":"definition","category":"muster","material":true,"level":4,"points":2,"prompt":"Wie heißt die Wiederholung der Satzanfänge?","text":"Wir brauchen Geschichten. Wir brauchen Zeit. Wir brauchen Ruhe.","answers":["Anapher","Anaphora"],"answer":"Anapher","explanation":"Gleiche Wörter am Anfang aufeinanderfolgender Einheiten. Eine Anapher wiederholt Wörter oder Wortgruppen am Anfang aufeinanderfolgender Sätze, Verse oder vergleichbarer Einheiten.","section":"A · Stilmittel benennen"},{"id":"mock:A:name:4","term":"epipher","terms":["epipher"],"kind":"input","mode":"definition","category":"muster","material":true,"level":4,"points":2,"prompt":"Wie heißt die Wiederholung am Ende beider Sätze?","text":"Wir wünschen uns Ruhe. Zum Lesen brauchen wir Ruhe.","answers":["Epipher"],"answer":"Epipher","explanation":"Gleiche Wörter am Ende aufeinanderfolgender Einheiten. Eine Epipher wiederholt Wörter oder Wortgruppen am Ende aufeinanderfolgender Sätze, Verse oder vergleichbarer Einheiten.","section":"A · Stilmittel benennen"},{"id":"mock:A:name:5","term":"alliteration","terms":["alliteration"],"kind":"input","mode":"definition","category":"muster","material":true,"level":4,"points":2,"prompt":"Benenne das Mittel, das auf den Anfangslauten beruht.","text":"Bücher bilden Brücken.","answers":["Alliteration"],"answer":"Alliteration","explanation":"Benachbarte Wörter beginnen mit demselben Laut. Eine Alliteration wiederholt den Anfangslaut betonter Stammsilben benachbarter oder eng verbundener Wörter.","section":"A · Stilmittel benennen"},{"id":"mock:A:name:6","term":"hyperbel","terms":["hyperbel"],"kind":"input","mode":"definition","category":"bild","material":true,"level":4,"points":2,"prompt":"Benenne das Mittel in der Zeitangabe „eine Ewigkeit“.","text":"Ich habe eine Ewigkeit auf dieses Buch gewartet.","answers":["Hyperbel"],"answer":"Hyperbel","explanation":"Eine Aussage ist deutlich übertrieben. Eine Hyperbel übersteigert einen Sachverhalt über das glaubhafte oder sachlich angemessene Maß hinaus.","section":"A · Stilmittel benennen"},{"id":"mock:A:multi:1","term":"chiasmus","terms":["chiasmus","antithese"],"kind":"multi","mode":"hard","category":"muster","material":true,"level":4,"points":2,"prompt":"Welche zwei der angebotenen Mittel sind in dieser Stelle nachweisbar?","text":"Der Einsatz war groß, klein war der Gewinn.","answer":["chiasmus","antithese"],"options":[{"value":"parallelismus","label":"Parallelismus"},{"value":"chiasmus","label":"Chiasmus"},{"value":"antithese","label":"Antithese"},{"value":"alliteration","label":"Alliteration"}],"explanation":"Der Bauplan kreuzt sich: Subjekt – Eigenschaft / Eigenschaft – Subjekt. „Groß“ und „klein“ bilden außerdem einen Gegensatz.","section":"B · Ähnliche Merkmale unterscheiden"},{"id":"mock:A:multi:2","term":"akkumulation","terms":["akkumulation","asyndeton"],"kind":"multi","mode":"hard","category":"muster","material":true,"level":4,"points":2,"prompt":"Welche zwei der angebotenen Mittel sind in dieser Stelle nachweisbar?","text":"Bücher, Hefte, Stifte liegen auf dem Tisch.","answer":["akkumulation","asyndeton"],"options":[{"value":"polysyndeton","label":"Polysyndeton"},{"value":"akkumulation","label":"Akkumulation"},{"value":"epipher","label":"Epipher"},{"value":"asyndeton","label":"Asyndeton"}],"explanation":"Mehrere Unterrichtsmaterialien werden einzeln genannt; das ist eine Akkumulation. Zwischen ihnen fehlen Bindewörter; das ist zugleich ein Asyndeton.","section":"B · Ähnliche Merkmale unterscheiden"},{"id":"mock:A:effect:1","term":"metapher","terms":["metapher"],"kind":"effect","mode":"effect","category":"bild","material":true,"level":4,"points":2,"prompt":"Welche Wirkungsdeutung ist am besten am Bild belegt?","text":"In einem Kommentar zur Leseförderung: „Die Bibliothek ist ein Fenster zur Welt.“","options":[{"value":"0","label":"Die Bibliothek gibt Zugang zu anderen Erfahrungen; das Bild unterstützt ihren Wert für die Lesenden."},{"value":"1","label":"Der Satz begründet, dass der Bibliotheksraum größere Fenster erhalten muss."},{"value":"2","label":"Das Bild warnt davor, dass Lesen die Außenwelt grundsätzlich verdrängt."},{"value":"3","label":"Der Satz erklärt ausschließlich die technische Funktion eines Fensters."}],"answer":"0","explanation":"Das Fenster steht für Zugang und neue Aussichten. Im Zusammenhang der Leseförderung macht das den Wert von Büchern anschaulich.","section":"C · Wirkung erklären"},{"id":"mock:A:effect:2","term":"rhetorische-frage","terms":["rhetorische-frage"],"kind":"effect","mode":"effect","category":"ansprache","material":true,"level":4,"points":2,"prompt":"Welche Funktion hat die Frage im Kommentar?","text":"„Wer möchte Geschichten nur nach ihrem Speicherbedarf bewerten?“","options":[{"value":"0","label":"Sie fordert eine genaue Angabe der Dateigröße."},{"value":"1","label":"Sie legt nahe, dass Speicherplatz als einziges Bewertungskriterium nicht ausreicht."},{"value":"2","label":"Sie gibt Lesenden eine neutrale Auswahl zwischen zwei Dateiformaten."},{"value":"3","label":"Sie lobt den Speicherbedarf als einziges wichtiges Merkmal."}],"answer":"1","explanation":"Die nahegelegte Antwort lautet: Das sollte niemand tun. So unterstützt die Frage die Kritik an einer rein technischen Bewertung.","section":"C · Wirkung erklären"},{"id":"mock:A:choice:1","term":"anrede","terms":["anrede"],"kind":"choice","mode":"meaning","category":"ansprache","material":true,"level":4,"points":2,"prompt":"Welche Aussage passt zur Checkliste aus deinem Unterricht?","text":"Ein materialgestützter Kommentar soll entstehen.","options":[{"value":"0","label":"Nur das Material verwenden, das zur eigenen Meinung passt."},{"value":"1","label":"Die Originalformulierungen möglichst unverändert übernehmen."},{"value":"2","label":"Alle bereitgestellten Materialien sinnvoll verwenden und Bezüge kennzeichnen."},{"value":"3","label":"Die eigene Position bis zum Schluss vollständig verschweigen."}],"answer":"2","explanation":"Das Kommentarblatt fordert die Verwendung aller Materialien und eine Kennzeichnung, zum Beispiel „vgl. M1“. Eigene Formulierungen bleiben wichtig.","section":"D · Kommentargrundlagen","trackTerm":false},{"id":"mock:A:choice:2","term":"antithese","terms":["antithese"],"kind":"choice","mode":"meaning","category":"gegensatz","material":true,"level":4,"points":2,"prompt":"Was unterscheidet den Kommentar nach deinen Unterlagen von einer schematischen Erörterung?","text":"","options":[{"value":"0","label":"Er muss ohne eigene Position nur neutral informieren."},{"value":"1","label":"Er darf Fakten durch Stilmittel ersetzen."},{"value":"2","label":"Er bewertet einen Sachverhalt und kann seine Argumentation freier, pointierter und sprachlich variabler aufbauen."},{"value":"3","label":"Er bespricht ausschließlich den sprachlichen Aufbau eines fremden Artikels."}],"answer":"2","explanation":"Der Kommentar bezieht sich auf den Sachverhalt, zeigt eine begründete Position und nutzt einen offeneren Argumentationsaufbau.","section":"D · Kommentargrundlagen","trackTerm":false},{"id":"mock:A:analysis","term":"metapher","terms":["metapher","anapher","chiasmus","rhetorische-frage"],"kind":"write","mode":"analysis","category":"bild","material":true,"level":4,"points":8,"prompt":"Untersuche zwei Stilmittel. Formuliere etwa 70 bis 100 Wörter: Textbeleg mit Satznummer, Begriff, Merkmal und konkrete Wirkung im Zusammenhang.","text":"(1) Manche erklären das gedruckte Buch zum Auslaufmodell.\n(2) Doch Bücher sind Fenster in andere Leben.\n(3) Wir brauchen Geschichten, wir brauchen Zeit, wir brauchen Ruhe.\n(4) Der Reader spart Platz, das Papier bietet ein anderes Lesegefühl.\n(5) Nicht das Gerät soll unser Lesen bestimmen, sondern unser Lesen die Wahl des Geräts.\n(6) Wer wollte uns vorschreiben, auf welchem Weg wir in eine Geschichte eintreten?","model":"Die Verfasserin verteidigt die freie Wahl des Lesemediums. Mit der Metapher „Fenster in andere Leben“ (Satz 2) beschreibt sie Bücher als Zugang zu fremden Erfahrungen. Das Bild macht deutlich, dass der Wert des Lesens über das verwendete Gerät hinausgeht. Die Anapher „wir brauchen“ (Satz 3) wiederholt dieselbe Wortgruppe am Anfang dreier Satzteile. Dadurch erscheinen Geschichten, Zeit und Ruhe als zusammengehörige Bedürfnisse. Der Nachdruck unterstützt die Position, dass die Bedingungen des Lesens wichtiger sind als ein Streit über Papier und Bildschirm. Auch andere treffend belegte Befunde sind möglich.","rubric":["Ich benenne mindestens zwei passende Stilmittel und belege beide mit kurzen, genauen Zitaten samt Satznummer.","Ich erkläre für beide Befunde das konkrete sprachliche Merkmal statt nur den Namen zu nennen.","Ich erläutere jeweils, welche Aussage durch das Mittel hervorgehoben oder anschaulich gemacht wird.","Ich verbinde die Wirkungen mit der Haltung des Textes und formuliere einen zusammenhängenden, verständlichen Absatz."],"explanation":"Je vollständig erfülltem Kriterium 2 Punkte in der Selbstkontrolle. Eine andere, am Text belegte Deutung ist möglich. Der freie Text wird nicht automatisch sprachlich bewertet.","section":"E · Analyse ausformulieren"},{"id":"mock:A:comment","term":"rhetorische-frage","terms":["rhetorische-frage","antithese"],"kind":"write","mode":"comment","category":"ansprache","material":true,"level":4,"points":8,"prompt":"Soll das gedruckte Buch neben dem Reader seinen Platz behalten? Schreibe einen kurzen Kommentarabsatz mit Überschrift (etwa 90 bis 120 Wörter). Beziehe beide Materialien ein. Begründe deine Position, berücksichtige einen Einwand und verwende mindestens ein passendes Stilmittel.","text":"M1 · Fiktive Übungsposition, keine Studie\nEine Leserin bevorzugt einen Reader: Viele Bücher passen auf ein Gerät. Für sie ist die Platzersparnis ein wichtiges Argument.\n\nM2 · Fiktive Übungsposition, keine Studie\nEin Leser bevorzugt gedruckte Bücher: Er schätzt die Haptik und möchte beim Lesen kein digitales Gerät in der Hand halten.","model":"Blättern statt aussortieren\n\nDas gedruckte Buch verdient auch in einer digitalen Welt seinen Platz. Zwar ist der Reader praktisch: Eine große Auswahl benötigt kaum Platz, wie die Übungsposition M1 betont (vgl. M1). Doch Bequemlichkeit ist nicht das einzige Kriterium für gutes Lesen. Wer die Haptik des Papiers schätzt, verbindet das Buch mit einem persönlichen Leseerlebnis (vgl. M2). Warum sollten wir diese Möglichkeit aufgeben? Ein Reader kann das Regal ergänzen, muss es aber nicht ersetzen. Die Entscheidung sollte deshalb bei den Lesenden liegen. Nicht Papier gegen Bildschirm, sondern mehr Raum für Geschichten: Darauf kommt es an.","rubric":["Eine passende Überschrift und eine klare Position beantworten die Leitfrage.","Mein Argument ist nachvollziehbar begründet. Beide Übungsmaterialien sind sinnvoll verwendet und mit M1/M2 gekennzeichnet.","Ich greife einen Einwand auf und antworte darauf. Mindestens ein erkennbares Stilmittel unterstützt meine Aussage.","Der Absatz ist zusammenhängend, sachlich wertend und sprachlich sorgfältig. Der Schluss bringt die Position auf den Punkt; der Umfang liegt ungefähr bei 90 bis 120 Wörtern."],"explanation":"Je vollständig erfülltem Kriterium 2 Punkte in der Selbstkontrolle. Eine andere, am Text belegte Deutung ist möglich. Der freie Text wird nicht automatisch sprachlich bewertet.","section":"F · Selbst schreiben","trackTerm":false}],"B":[{"id":"mock:B:name:1","term":"personifikation","terms":["personifikation"],"kind":"input","mode":"definition","category":"bild","material":true,"level":4,"points":2,"prompt":"Wie heißt die Gestaltung der Windbewegung?","text":"Der Wind spielte mit ihren Haaren.","answers":["Personifikation"],"answer":"Personifikation","explanation":"Etwas Nichtmenschliches handelt menschlich. Eine Personifikation schreibt Nichtmenschlichem menschliche Eigenschaften, Handlungen oder eine menschliche Gestalt zu.","section":"A · Stilmittel benennen"},{"id":"mock:B:name:2","term":"oxymoron","terms":["oxymoron"],"kind":"input","mode":"definition","category":"gegensatz","material":true,"level":4,"points":2,"prompt":"Benenne die widersprüchliche Wortverbindung.","text":"Seine Antwort war beredtes Schweigen.","answers":["Oxymoron"],"answer":"Oxymoron","explanation":"Widersprüchliche Ausdrücke werden eng verbunden. Ein Oxymoron verbindet semantisch widersprüchliche Ausdrücke zu einer engen sprachlichen Einheit.","section":"A · Stilmittel benennen"},{"id":"mock:B:name:3","term":"ellipse","terms":["ellipse"],"kind":"input","mode":"definition","category":"satz","material":true,"level":4,"points":2,"prompt":"Benenne die besondere Verkürzung des Satzes.","text":"Je schneller, desto besser.","answers":["Ellipse"],"answer":"Ellipse","explanation":"Satzteile fehlen, lassen sich aber aus dem Zusammenhang ergänzen. Eine Ellipse lässt syntaktisch erwartbare Satzbestandteile aus, die aus dem sprachlichen oder situativen Kontext erschließbar sind.","section":"A · Stilmittel benennen"},{"id":"mock:B:name:4","term":"correctio","terms":["correctio"],"kind":"input","mode":"definition","category":"satz","material":true,"level":4,"points":2,"prompt":"Wie heißt die ausdrückliche Korrektur der ersten Bewertung?","text":"Das war schlecht, nein, geradezu miserabel.","answers":["Correctio","Korrektur"],"answer":"Correctio","explanation":"Eine Aussage wird ausdrücklich zurückgenommen und verbessert. Eine Correctio nimmt einen zunächst gewählten Ausdruck zurück und ersetzt ihn ausdrücklich durch einen passenderen, häufig stärkeren.","section":"A · Stilmittel benennen"},{"id":"mock:B:name:5","term":"klimax","terms":["klimax"],"kind":"input","mode":"definition","category":"satz","material":true,"level":4,"points":2,"prompt":"Benenne die Entwicklung innerhalb der Reihe.","text":"Gut, besser, der Allerbeste.","answers":["Klimax"],"answer":"Klimax","explanation":"Eine Reihe steigert sich in Bedeutung, Stärke oder Umfang. Eine Klimax ist eine stufenweise Steigerung semantisch zusammenhängender Ausdrücke oder Aussagen.","section":"A · Stilmittel benennen"},{"id":"mock:B:name:6","term":"euphemismus","terms":["euphemismus"],"kind":"input","mode":"definition","category":"bild","material":true,"level":4,"points":2,"prompt":"Benenne die beschönigende Bezeichnung.","text":"„Entschlafen“ statt „sterben“.","answers":["Euphemismus"],"answer":"Euphemismus","explanation":"Ein unangenehmer Sachverhalt wird milder oder schöner bezeichnet. Ein Euphemismus ersetzt eine als hart, anstößig oder belastend empfundene Bezeichnung durch einen mildernden Ausdruck.","section":"A · Stilmittel benennen"},{"id":"mock:B:multi:1","term":"anapher","terms":["anapher","parallelismus"],"kind":"multi","mode":"hard","category":"muster","material":true,"level":4,"points":2,"prompt":"Welche zwei der angebotenen Mittel sind in dieser Stelle nachweisbar?","text":"Wir lesen morgens. Wir lesen abends.","answer":["anapher","parallelismus"],"options":[{"value":"chiasmus","label":"Chiasmus"},{"value":"epipher","label":"Epipher"},{"value":"parallelismus","label":"Parallelismus"},{"value":"anapher","label":"Anapher"}],"explanation":"Die Satzanfänge wiederholen sich. Beide Sätze haben außerdem denselben grammatischen Bauplan.","section":"B · Ähnliche Merkmale unterscheiden"},{"id":"mock:B:multi:2","term":"hyperbel","terms":["hyperbel","klimax"],"kind":"multi","mode":"hard","category":"bild","material":true,"level":4,"points":2,"prompt":"Welche zwei der angebotenen Mittel sind in dieser Stelle nachweisbar?","text":"Ich wartete Stunden, Jahre, Ewigkeiten.","answer":["hyperbel","klimax"],"options":[{"value":"hyperbel","label":"Hyperbel"},{"value":"litotes","label":"Litotes"},{"value":"klimax","label":"Klimax"},{"value":"euphemismus","label":"Euphemismus"}],"explanation":"Die Zeiträume wachsen. „Ewigkeiten“ überschreitet zusätzlich die wörtlich mögliche Wartezeit.","section":"B · Ähnliche Merkmale unterscheiden"},{"id":"mock:B:effect:1","term":"antithese","terms":["antithese"],"kind":"effect","mode":"effect","category":"gegensatz","material":true,"level":4,"points":2,"prompt":"Welche Erklärung passt zum Gegensatz?","text":"In einem Kommentar: „Nicht mehr Bücher besitzen, sondern mehr Bücher lesen.“","options":[{"value":"0","label":"Die Formulierung begründet eine Preissteigerung."},{"value":"1","label":"Sie macht den Unterschied zwischen bloßem Ansammeln und tatsächlichem Lesen sichtbar."},{"value":"2","label":"Sie erklärt, dass Lesen nur mit eigenen Büchern möglich ist."},{"value":"3","label":"Sie bewertet beide Tätigkeiten als vollständig gleichwertig."}],"answer":"1","explanation":"Der Gegensatz wertet die aktive Beschäftigung mit Geschichten gegenüber bloßem Besitz auf.","section":"C · Wirkung erklären"},{"id":"mock:B:effect:2","term":"anapher","terms":["anapher"],"kind":"effect","mode":"effect","category":"muster","material":true,"level":4,"points":2,"prompt":"Welche Wirkung ist konkret am Beispiel begründet?","text":"„Wir brauchen Zeit. Wir brauchen Ruhe.“","options":[{"value":"0","label":"Die Wiederholung verbindet beide Bedürfnisse und gibt der Forderung Nachdruck."},{"value":"1","label":"Die wiederholte Form beweist, dass ein Reader schädlich ist."},{"value":"2","label":"Die Formulierung stellt Zeit und Ruhe als unvereinbare Gegensätze dar."},{"value":"3","label":"Die Sätze machen keine Forderung, sondern stellen zwei offene Fragen."}],"answer":"0","explanation":"Der gleiche Anfang bindet die Bedürfnisse zusammen. Daraus folgt keine empirische Aussage über Lesegeräte.","section":"C · Wirkung erklären"},{"id":"mock:B:choice:1","term":"anrede","terms":["anrede"],"kind":"choice","mode":"meaning","category":"ansprache","material":true,"level":4,"points":2,"prompt":"Welche Vorbereitung passt zu den sieben Planungsschritten?","text":"","options":[{"value":"0","label":"Zuerst den Schluss auswendig lernen, danach ein beliebiges Thema wählen."},{"value":"1","label":"Material auswerten, Position bestimmen, Stoff sammeln und auswählen, Argumente ordnen, Einstieg und Schluss planen."},{"value":"2","label":"Nur sprachliche Mittel sammeln und die Argumentation weglassen."},{"value":"3","label":"Den Originaltext abschreiben und zuletzt eine Überschrift ergänzen."}],"answer":"1","explanation":"Diese Reihenfolge bildet das Planungsblatt ab. Ein Schreibplan ordnet die ausgewählten Argumente.","section":"D · Kommentargrundlagen","trackTerm":false},{"id":"mock:B:choice:2","term":"ironie","terms":["ironie"],"kind":"choice","mode":"meaning","category":"gegensatz","material":true,"level":4,"points":2,"prompt":"Welche sprachliche Gestaltung fordert das Kommentarblatt?","text":"","options":[{"value":"0","label":"Sachlich, aber nicht neutral; die eigene Position muss erkennbar und begründet sein."},{"value":"1","label":"Ausschließlich Umgangssprache und möglichst viele Übertreibungen."},{"value":"2","label":"Keine eigene Wertung und keine rhetorischen Mittel."},{"value":"3","label":"Grundsätzlich Vergangenheitsform und ungeprüfte Behauptungen."}],"answer":"0","explanation":"Das Blatt nennt sachliche Positionierung, Präsens und gezielt eingesetzte sprachliche Mittel.","section":"D · Kommentargrundlagen","trackTerm":false},{"id":"mock:B:analysis","term":"antithese","terms":["antithese","parallelismus","asyndeton","rhetorische-frage"],"kind":"write","mode":"analysis","category":"gegensatz","material":true,"level":4,"points":8,"prompt":"Untersuche zwei Stilmittel. Formuliere etwa 70 bis 100 Wörter: Textbeleg mit Satznummer, Begriff, Merkmal und konkrete Wirkung im Zusammenhang.","text":"(1) Ein voller Speicher ist noch kein voller Kopf.\n(2) Auf meinem Reader liegen hundert Geschichten; in meinem Alltag fehlt ihnen oft die Zeit.\n(3) Ich will nicht mehr Bücher besitzen, ich will mehr Bücher lesen.\n(4) Auf Papier oder auf dem Bildschirm: Eine Geschichte braucht Aufmerksamkeit.\n(5) Wir kaufen, laden, sammeln.\n(6) Doch wer liest all das?\n(7) Geben wir den Geschichten Raum, nicht nur Speicherplatz.","model":"Der Text fordert dazu auf, tatsächlich zu lesen, statt nur Bücher anzusammeln. Der parallel gebaute Gegensatz „mehr Bücher besitzen“ und „mehr Bücher lesen“ (Satz 3) stellt bloßen Besitz und aktive Beschäftigung einander gegenüber. Der ähnliche Satzbau macht den Unterschied besonders deutlich. Das Asyndeton „kaufen, laden, sammeln“ (Satz 5) reiht Tätigkeiten ohne Bindewort. Die kurze Abfolge verdichtet den Eindruck ständigen Ansammelns. Dass „lesen“ in dieser Reihe fehlt, unterstützt die Kritik. Die rhetorische Frage in Satz 6 kann zusätzlich als Zweifel daran gedeutet werden, dass alle gesammelten Texte überhaupt gelesen werden.","rubric":["Ich benenne mindestens zwei passende Stilmittel und belege beide mit kurzen, genauen Zitaten samt Satznummer.","Ich erkläre für beide Befunde das konkrete sprachliche Merkmal statt nur den Namen zu nennen.","Ich erläutere jeweils, welche Aussage durch das Mittel hervorgehoben oder anschaulich gemacht wird.","Ich verbinde die Wirkungen mit der Haltung des Textes und formuliere einen zusammenhängenden, verständlichen Absatz."],"explanation":"Je vollständig erfülltem Kriterium 2 Punkte in der Selbstkontrolle. Eine andere, am Text belegte Deutung ist möglich. Der freie Text wird nicht automatisch sprachlich bewertet.","section":"E · Analyse ausformulieren"},{"id":"mock:B:comment","term":"metapher","terms":["metapher","rhetorische-frage"],"kind":"write","mode":"comment","category":"bild","material":true,"level":4,"points":8,"prompt":"Ist eine große digitale Büchersammlung wichtiger als regelmäßige Lesezeit? Schreibe einen kurzen Kommentarabsatz mit Überschrift (etwa 90 bis 120 Wörter). Beziehe beide Materialien ein. Begründe deine Position, berücksichtige einen Einwand und verwende mindestens ein passendes Stilmittel.","text":"M1 · Fiktive Übungsposition, keine Studie\nEin Leser meint: Eine große digitale Bibliothek erleichtert die Auswahl. Wenn viele Texte sofort bereitstehen, findet er eher etwas Passendes.\n\nM2 · Fiktive Übungsposition, keine Studie\nEine Leserin entgegnet: Auch eine große Bibliothek ersetzt keine Lesezeit. Ihr ist es wichtiger, wenige Bücher aufmerksam zu lesen, als viele nur zu besitzen.","model":"Mehr lesen, weniger sammeln\n\nEine volle Bibliothek ist noch kein gelesenes Buch. Natürlich hat eine große digitale Auswahl Vorteile: Wer viele Texte sofort aufrufen kann, findet leichter etwas Passendes (vgl. M1). Trotzdem entsteht der Wert einer Geschichte erst, wenn man sich mit ihr beschäftigt. Darauf verweist die zweite Übungsposition mit ihrem Hinweis auf die begrenzte Lesezeit (vgl. M2). Deshalb sollten wir nicht nur neue Titel sammeln, sondern bewusst Zeit für die vorhandenen einplanen. Was nützen hundert ungelesene Bücher? Lieber eine Geschichte aufmerksam lesen als zehn weitere bloß abspeichern. Ob das auf Papier oder auf einem Reader geschieht, ist zweitrangig.","rubric":["Eine passende Überschrift und eine klare Position beantworten die Leitfrage.","Mein Argument ist nachvollziehbar begründet. Beide Übungsmaterialien sind sinnvoll verwendet und mit M1/M2 gekennzeichnet.","Ich greife einen Einwand auf und antworte darauf. Mindestens ein erkennbares Stilmittel unterstützt meine Aussage.","Der Absatz ist zusammenhängend, sachlich wertend und sprachlich sorgfältig. Der Schluss bringt die Position auf den Punkt; der Umfang liegt ungefähr bei 90 bis 120 Wörtern."],"explanation":"Je vollständig erfülltem Kriterium 2 Punkte in der Selbstkontrolle. Eine andere, am Text belegte Deutung ist möglich. Der freie Text wird nicht automatisch sprachlich bewertet.","section":"F · Selbst schreiben","trackTerm":false}]},"practice":{"text":"In einer Schulbibliothek stehen nicht nur Regale. Dort öffnen Bücher Türen zu unbekannten Erfahrungen. Wir brauchen solche Orte zum Lesen. Wir brauchen solche Orte zum Nachdenken. Wer würde diese Möglichkeiten freiwillig aufgeben? Ein Reader spart Platz; ein gedrucktes Buch bietet ein anderes Lesegefühl. Beides darf seinen Platz haben.","model":"Die Metapher „öffnen Bücher Türen“ stellt Lesen als Zugang zu unbekannten Erfahrungen dar. Bücher öffnen keine wirklichen Türen; übertragen wird das Erreichen neuer Räume und Möglichkeiten. So unterstreicht der Text den Wert einer Schulbibliothek. Die Anapher „Wir brauchen solche Orte“ wiederholt denselben Satzanfang und verstärkt die Forderung nach ihrem Erhalt. Beide Mittel stützen die Position, dass das Lesen wichtiger ist als die ausschließliche Entscheidung für ein Medium.","rubric":["Ich benenne mindestens zwei passende Stilmittel und belege beide mit kurzen, genauen Zitaten samt Satznummer.","Ich erkläre für beide Befunde das konkrete sprachliche Merkmal statt nur den Namen zu nennen.","Ich erläutere jeweils, welche Aussage durch das Mittel hervorgehoben oder anschaulich gemacht wird.","Ich verbinde die Wirkungen mit der Haltung des Textes und formuliere einen zusammenhängenden, verständlichen Absatz."],"commentMaterials":"M1 · Fiktive Übungsposition, keine Studie\nEine Lehrkraft möchte weniger gedruckte Bücher aufbewahren. Den frei werdenden Platz würde sie gern für zusätzliche Leseplätze nutzen.\n\nM2 · Fiktive Übungsposition, keine Studie\nEine Schülerin möchte weiterhin gedruckte Bücher ausleihen. Sie schätzt das Blättern und möchte frei zwischen Papier und Reader wählen.","commentPrompt":"Soll eine Schulbibliothek nur noch digitale Bücher anbieten?","commentModel":"Platz zum Lesen, Platz für Bücher\n\nEine Schulbibliothek sollte gedruckte und digitale Bücher anbieten. Zusätzliche Leseplätze sind sinnvoll; deshalb ist der Vorschlag der Lehrkraft verständlich (vgl. M1). Doch mehr Platz darf nicht bedeuten, dass eine ganze Leseform verschwindet. Die Schülerin verweist darauf, dass auch das Blättern und die freie Wahl zum Leseerlebnis gehören können (vgl. M2). Eine Bibliothek öffnet Türen zu Geschichten. Warum sollte sie dabei eine Tür schließen? Statt alle Regale auszuräumen, könnte sie ihre Auswahl gezielt verkleinern und um digitale Titel ergänzen. So entstehen Leseplätze, ohne gedruckte Bücher vollständig zu verdrängen. Entscheidend ist eine vielfältige Auswahl, nicht ein einziges erlaubtes Medium.","commentRubric":["Eine passende Überschrift und eine klare Position beantworten die Leitfrage.","Mein Argument ist nachvollziehbar begründet. Beide Übungsmaterialien sind sinnvoll verwendet und mit M1/M2 gekennzeichnet.","Ich greife einen Einwand auf und antworte darauf. Mindestens ein erkennbares Stilmittel unterstützt meine Aussage.","Der Absatz ist zusammenhängend, sachlich wertend und sprachlich sorgfältig. Der Schluss bringt die Position auf den Punkt; der Umfang liegt ungefähr bei 90 bis 120 Wörtern."]},"notice":"Diese Kurzarbeiten sind Übungsentwürfe anhand deiner Fotos. Die tatsächlichen Aufgaben, Schwerpunkte und Bewertungsmaßstäbe deiner Lehrkraft sind nicht bekannt.","sections":[{"name":"A · Stilmittel benennen","tasks":"6 kurze Beispiele","minutes":6,"points":12},{"name":"B · Ähnliche Merkmale unterscheiden","tasks":"2 Mehrfachbefunde","minutes":3,"points":4},{"name":"C · Wirkung erklären","tasks":"2 konkrete Deutungen","minutes":3,"points":4},{"name":"D · Kommentargrundlagen","tasks":"2 Fragen aus deinen Blättern","minutes":2,"points":4},{"name":"E · Analyse ausformulieren","tasks":"70 bis 100 Wörter","minutes":7,"points":8},{"name":"F · Selbst schreiben","tasks":"90 bis 120 Wörter","minutes":9,"points":8}]};});

<script>
/* Pure functions for a short study session. No network or browser dependency. */
(function(root,factory){
 if(typeof module==='object'&&module.exports)module.exports=factory(require('./content.js'),require('./core.js'),require('./focus-content.js'));
 else root.SMF=factory(root.SMD,root.SMC,root.SMFData);
})(typeof globalThis!=='undefined'?globalThis:this,function(D,C,X){
'use strict';
const ids=new Set(D.terms.map(t=>t.id));
const removed=/\b(?:antiklimax|anadiplose|enjambement|synekdoche|sarkasmus|totum pro parte)\b/i;
function plan(minutes=90){
 const n=[60,90,120].includes(Number(minutes))?Number(minutes):90;
 const times={60:[12,5,5,5,30,3],90:[22,10,10,10,30,8],120:[30,15,15,15,30,15]}[n];
 const parts=[
 ['recognize','Merkmale erkennen','Originalbeispiel ansehen, Merkmal verstehen, anschließend ohne Hilfe benennen.','learn'],
 ['compare','Verwechslungen klären','Anfang oder Ende? Gegensatz oder Wortwiderspruch? Gleicher oder gekreuzter Satzbau?','compare'],
 ['effect','Wirkung konkret erklären','Nicht „macht den Text interessant“, sondern: Welche Aussage wird wie betont?','effects'],
 ['write','Einen kurzen Absatz schreiben','Textbeleg, Begriff, Merkmal und Wirkung verbinden. Anschließend einen Kommentarabsatz üben.','effects/write'],
 ['mock','30-Minuten-Kurzarbeit','Erst bearbeiten, dann Lösungen und Punkteraster ansehen.','exam'],
 ['errors','Nur die Lücken nacharbeiten','Falsche Antworten wiederholen. Freie Texte mit den Kriterien vergleichen.','training']
 ];
 return parts.map(([id,title,description,route],i)=>({id,title,description,route,minutes:times[i]}));
}
function questionAllowed(q){
 return !!q&&Array.isArray(q.terms)&&q.terms.length>0&&q.terms.every(id=>ids.has(id))&&(!q.term||ids.has(q.term))&&!removed.test(JSON.stringify(q));
}
function evidence(state,id){
 const latest=new Map();
 for(const ev of state.history||[]){if(ev.term!==id||ev.self||!ev.qid)continue;latest.set(ev.qid,ev);}
 const recent=[...latest.values()].sort((a,b)=>(a.at||0)-(b.at||0)).slice(-12),good=recent.filter(x=>x.ratio>=.8);
 const modes=new Set(good.map(x=>x.question?.mode||x.mode));
 const wrong=recent.filter(x=>x.ratio<.8).length;
 const level=good.length>=4&&modes.size>=2&&!wrong?3:good.length>=2&&!wrong?2:recent.length?1:0;
 return {attempts:recent.length,correct:good.length,wrong,level,accuracy:recent.length?Math.round(recent.reduce((s,x)=>s+x.ratio,0)/recent.length*100):null};
}
function status(state,id){return ['Noch nicht geprüft','Noch üben','Zweimal richtig','Mehrfach richtig'][evidence(state,id).level];}
function summary(state){
 const allowed=(state.history||[]).filter(x=>!x.self&&(!x.term||ids.has(x.term)));
 const studied=D.terms.filter(t=>evidence(state,t.id).attempts>0);
 const known=studied.filter(t=>evidence(state,t.id).level>=2);
 const errors=Object.values(state.errors||{}).filter(x=>questionAllowed(x.question));
 const primaryKnown=known.filter(t=>t.focus.priority===1).length;
 return {studied:studied.length,known:known.length,primaryKnown,primaryTotal:D.focusPriorityIds.length,errors:errors.length,
 attempts:allowed.length,accuracy:allowed.length?Math.round(allowed.reduce((s,x)=>s+x.ratio,0)/allowed.length*100):null,
 effects:allowed.filter(x=>(x.question?.mode||x.mode)==='effect').length,
 comparisons:allowed.filter(x=>(x.question?.mode||x.mode)==='hard').length,
 mockCount:(state.exams||[]).filter(x=>x.config?.focusEdition===2).length};
}
function ordered(state,scope='priority'){
 let terms=D.terms.filter(t=>scope!=='priority'||t.focus.priority===1);
 const now=Date.now();
 return [...terms].sort((a,b)=>{
  const weight=t=>evidence(state,t.id).wrong*5+(state.progress[t.id]?.due<=now?3:0)+(evidence(state,t.id).level<2?2:0);
  return weight(b)-weight(a)||a.focus.priority-b.focus.priority||D.terms.indexOf(a)-D.terms.indexOf(b);
 }).map(t=>t.id);
}
function recommend(state){
 const stats=summary(state);
 if(stats.errors>=3)return {title:'Diese Fehler kosten noch Punkte.',text:`${stats.errors} Aufgaben waren noch nicht sicher. Wiederhole zuerst diese Merkmale.`,action:'focus-errors',label:'Meine Fehler üben'};
 const next=ordered(state).find(id=>evidence(state,id).level<2);
 if(next)return {title:'Erkenne das Merkmal. Nicht nur den Namen.',text:'Beginne mit den 23 Begriffen aus den Zuordnungsaufgaben und den hervorgehobenen Tabelleneinträgen.',action:'focus-learn',label:'Mit Erkennungsmerkmalen starten'};
 if(stats.effects<4)return {title:'Jetzt die Wirkung in Worte fassen.',text:'Die wichtigsten Begriffe sind wiederholt richtig erkannt. Übe nun, ihre konkrete Funktion zu erklären.',route:'effects',label:'Wirkung trainieren'};
 if(!state.settings?.focusWriting?.analysis?.trim())return {title:'Ein eigener Analysesatz fehlt noch.',text:'Verbinde ein kurzes Zitat mit Begriff, Merkmal und konkreter Aussage. Prüfe deinen Absatz danach selbst.',route:'effects/write',label:'Kurzen Absatz schreiben'};
 return {title:'Teste den Abruf unter Zeitdruck.',text:'Die Kurzarbeit dauert 30 Minuten. Sie enthält auch eine Analyse und einen kurzen Kommentarabsatz.',route:'exam',label:'Zur Probekurzarbeit'};
}
function mock(variant='A',now=Date.now()){
 const v=variant==='B'?'B':'A';
 const questions=JSON.parse(JSON.stringify(X.forms[v]));
 if(!questions.every(questionAllowed))throw Error('Die Kurzarbeit enthält einen nicht erlaubten Unterrichtsbegriff.');
 return {id:'kurz-'+v+'-'+now.toString(36),questions,index:0,answers:{},feedbacks:{},models:{},startedAt:now,deadline:now+30*60000,
 level:4,full:false,config:{focusEdition:2,variant:v,minutes:30,feedback:'end',material:true},review:false,focusEdition:2};
}
function examGaps(ex){
 const questions=(ex.questions||[]).filter(q=>q.kind!=='write'&&(ex.results?.[q.id]?.ratio||0)<.8);
 return {questions,terms:[...new Set(questions.filter(q=>q.trackTerm!==false).map(q=>q.term))],commentBasics:questions.some(q=>q.trackTerm===false)};
}
function blankWriting(){return {analysis:'',comment:'',analysisChecks:[false,false,false,false],commentChecks:[false,false,false,false],analysisReveal:false,commentReveal:false,tab:'analysis'};}
function phaseState(state,id){
 const stats=summary(state),w=state.settings.focusWriting||blankWriting();
 if(id==='recognize')return {done:stats.primaryKnown>=stats.primaryTotal,detail:`${stats.primaryKnown} / ${stats.primaryTotal} zuerst empfohlene Begriffe mehrfach richtig`};
 if(id==='compare')return {done:stats.comparisons>=4,detail:`${stats.comparisons} Mehrfachbefunde bearbeitet`};
 if(id==='effect')return {done:stats.effects>=4,detail:`${stats.effects} Wirkungsaufgaben bearbeitet`};
 if(id==='write')return {done:C.words(w.analysis)>=50&&w.analysisChecks?.filter(Boolean).length>=3,detail:w.analysis?.trim()?'Eigener Absatz gespeichert · Kriterien selbst prüfen':'Noch kein eigener Absatz gespeichert'};
 if(id==='mock')return {done:stats.mockCount>0,detail:`${stats.mockCount} Kurzarbeiten abgegeben`};
 return {done:stats.mockCount>0&&stats.errors===0,detail:stats.errors?`${stats.errors} Aufgaben im Fehlertraining`:'Aktuell keine gespeicherten Fehler'};
}
// Keep removed learning data in an exportable archive instead of destroying user work.
function restrictState(state){
 const archived={};
 function keepObject(key,predicate){const kept={},rest={};for(const [k,v] of Object.entries(state[key]||{}))(predicate(k,v)?kept:rest)[k]=v;state[key]=kept;if(Object.keys(rest).length)archived[key]=rest;}
 keepObject('seen',id=>ids.has(id));keepObject('progress',id=>ids.has(id));
 keepObject('errors',(_,v)=>questionAllowed(v.question));
 keepObject('confusions',key=>key.split('|').every(id=>ids.has(id)));
 const oldHistory=state.history.filter(x=>x.term&&!ids.has(x.term));
 if(oldHistory.length)archived.history=oldHistory;
 state.history=state.history.filter(x=>!x.term||ids.has(x.term));
 state.bookmarks=(state.bookmarks||[]).filter(id=>ids.has(id));
 const oldExams=(state.exams||[]).filter(x=>x.config?.focusEdition!==2||!x.questions.every(questionAllowed));
 if(oldExams.length)archived.exams=oldExams;
 state.exams=(state.exams||[]).filter(x=>x.config?.focusEdition===2&&x.questions.every(questionAllowed));
 for(const key of ['activeExam','activeSession'])if(state[key]&&(!state[key].focusEdition||!state[key].questions.every(questionAllowed))){archived[key]=state[key];state[key]=null;}
 if(state.settings.focusEdition!==2){
  for(const key of ['drafts','labs','lessons'])if(Object.keys(state[key]||{}).length){archived[key]=state[key];state[key]={};}
 }
 if(Object.keys(archived).length){
  state.settings.previousEditions=Array.isArray(state.settings.previousEditions)?state.settings.previousEditions:[];
  state.settings.previousEditions.push({at:Date.now(),data:archived});
 }
 state.settings.focusEdition=2;
 state.settings.focusMinutes=[60,90,120].includes(Number(state.settings.focusMinutes))?Number(state.settings.focusMinutes):90;
 const w=state.settings.focusWriting;
