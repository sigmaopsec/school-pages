function tag(text,style=''){return `<span class="tag ${style}">${text}</span>`;}
function progress(value){return `<div class="progress" role="progressbar" aria-label="Fortschritt" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(value)}"><span style="width:${Math.min(100,Math.max(0,value))}%"></span></div>`;}
const statuses=['Neu','In Bearbeitung','Weitgehend verstanden','Im Trainer prüfungssicher'];
function status(id){let m=C.mastery(S.state,id);return `<span class="status-label"><i class="status-dot s${m}"></i> ${statuses[m]}</span>`;}
function cat(id){return D.categories.find(c=>c.id===id)?.name||'';}
function empty(title,text,ic='book'){return `<div class="empty">${icon(ic)}<h3>${title}</h3><p>${text}</p></div>`;}
function ring(n,total){let pct=Math.min(1,total?n/total:0),r=58,len=2*Math.PI*r;return `<div class="ring"><svg viewBox="0 0 140 140" aria-label="${n} von ${total}"><circle cx="70" cy="70" r="58" fill="none" stroke="var(--surface2)" stroke-width="9"/><circle cx="70" cy="70" r="58" fill="none" stroke="var(--brand)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${len*pct} ${len}"/></svg><div class="ring-center"><strong>${n}<small style="font-size:17px;color:var(--muted)"> / ${total}</small></strong><span>heute bearbeitet</span></div></div>`;}
function save(){return true;}
let toastTimer;
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('visible'),4500);}
function dialog(title,html,actions){const el=document.getElementById('app-dialog');el.innerHTML=`<h2>${title}</h2>${html}<div class="dialog-actions">${actions||button('Schließen','close-dialog','','secondary')}</div>`;el.showModal();}
const nav=[['dashboard','Dein Prüfungsplan','home'],['catalog','Merkmale erkennen','book'],['compare','Nicht verwechseln','compare'],['training','Kurztraining','bolt'],['effects','Wirkung & Schreiben','pen'],['exam','30-Minuten-Kurzarbeit','award']];
function route(){const [view,...args]=(location.hash.slice(1)||'dashboard').split('/');return {view,args};}
function go(path){if(location.hash==='#'+path)render(false);else location.hash=path;}
function render(keep=true){let {view,args}=route();let y=scrollY,focus=document.activeElement?.id,sel=document.activeElement?.selectionStart;const ae=document.activeElement;const focusButton=ae?.dataset?.action?[ae.dataset.action,ae.dataset.index,ae.dataset.value,ae.dataset.context]:null;const parent=({detail:'catalog',learn:'catalog',path:'dashboard',lesson:'dashboard',pair:'compare',session:'training',flashcards:'training',labtext:'lab',examrun:'exam',examresult:'exam'})[view]||view;let title=nav.find(x=>x[0]===parent)?.[1]||'Einstellungen';
 document.body.classList.toggle('dark',S.state.settings.theme==='dark');
 let main;try{main=S.views[view]?S.views[view](...args):empty('Seite nicht gefunden','Wähle einen Bereich in der Navigation.');}catch(err){console.error(err);main=pageTop('Hinweis','Diese Ansicht konnte nicht geladen werden.')+`<div class="info error">${e(err.message)}</div><p class="mt">${button('Zur Übersicht','navigate','data-route="dashboard"')}</p>`;}
 document.getElementById('app').innerHTML=`<div class="mobile-overlay ${S.ui.menu?'show':''}" data-action="menu"></div><aside class="sidebar ${S.ui.menu?'open':''}" aria-label="Hauptnavigation"><a class="brand" href="#dashboard"><span class="brand-mark">${icon('book')}</span><span class="brand-name">Stilmittel<span style="font-weight:450"> Akademie</span><small>Prüfungsfokus.</small></span></a><div class="nav-label">DEIN PRÜFUNGSSTOFF</div><nav>${nav.slice(0,4).map(([v,n,ic])=>`<a href="#${v}" class="nav-item ${parent===v?'active':''}" ${parent===v?'aria-current="page"':''}>${icon(ic)}${n}</a>`).join('')}<div class="nav-label">PUNKTE IM SCHREIBTEIL</div>${nav.slice(4).map(([v,n,ic])=>`<a href="#${v}" class="nav-item ${parent===v?'active':''}" ${parent===v?'aria-current="page"':''}>${icon(ic)}${n}</a>`).join('')}</nav><div class="sidebar-foot"><a href="#settings" class="nav-item ${parent==='settings'?'active':''}">${icon('settings')}Einstellungen</a><a href="#sources" class="nav-item ${parent==='sources'?'active':''}">${icon('info')}Material & Fachhinweise</a><div class="local-card">${icon('shield')}<strong>Dein Wissen. Deine Daten.</strong>Nur bis zum Neuladen. Ohne Konto. Ohne Tracking.</div></div></aside><div class="shell"><header class="topbar"><a class="return-link" href="../">← Lernräume</a><button class="icon-btn mobile-menu" type="button" data-action="menu" aria-label="Navigation öffnen" aria-expanded="${!!S.ui.menu}">${icon('menu')}</button><div class="crumb"><span>Prüfungsfokus &nbsp; / &nbsp; </span><b>${title}</b></div><div class="row"><form id="global-search-form" class="searchbox" role="search">${icon('search')}<input id="global-search" aria-label="Stilmittel suchen" placeholder="Ein Stilmittel suchen …" autocomplete="off"><span class="kbd">↵</span></form><button class="icon-btn" data-action="theme" aria-label="Farbschema wechseln" type="button">${icon(S.state.settings.theme==='dark'?'sun':'moon')}</button><a href="#settings" class="avatar" aria-label="Profil und Einstellungen">${e((S.state.settings.name||'Du').slice(0,2).toUpperCase())}</a></div></header><main class="main" id="main-content" tabindex="-1">${storageWarning?`<div id="storage-warning" class="info warning mb">${e(storageWarning)}</div>`:''}${main}<div class="footer-note">STILMITTEL AKADEMIE &nbsp; · &nbsp; Nur dein Stoff. Erkennen. Erklären. &nbsp; · &nbsp; Nur bis zum Neuladen · ohne Tracking.</div></main></div>`;
 document.title=title+' · Stilmittel Akademie';S.state.lastRoute=view;save();
 if(keep){scrollTo(0,y);if(focus){const el=document.getElementById(focus);el?.focus({preventScroll:true});try{if(sel!==null)el?.setSelectionRange(sel,sel);}catch(_){}}if(!focus&&focusButton){const [action,index,value,ctx]=focusButton;const node=[...document.querySelectorAll('[data-action]')].find(x=>x.dataset.action===action&&x.dataset.index===index&&x.dataset.value===value&&x.dataset.context===ctx);node?.focus({preventScroll:true});}}else scrollTo(0,0);
 S.afterRender?.(view,args);
}
function chart(){const now=new Date(),days=[];for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);let key=C.dayKey(d.getTime());days.push({label:d.toLocaleDateString('de',{weekday:'short'}),n:S.state.history.filter(x=>C.dayKey(x.at)===key).length,today:i===0});}let max=Math.max(5,...days.map(d=>d.n));return `<div class="activity-chart" role="img" aria-label="Übungen der letzten sieben Tage: ${days.map(d=>d.label+' '+d.n).join(', ')}">${days.map(d=>`<div class="chart-col ${d.today?'today':''}"><b>${d.n}</b><div class="bar" style="height:${d.n/max*91}px"></div><small>${d.label}</small></div>`).join('')}</div>`;}
function pathCard(p){const done=p.lessons.filter(l=>S.state.lessons[l.id]?.done).length;return `<a class="card clickable path-card" href="#path/${p.id}"><div class="row between"><div class="path-icon no-margin">${icon(p.id==='start'?'spark':p.id==='pruefung'?'award':p.id==='kommentar'?'pen':'path')}</div>${tag('STUFE '+p.level,p.level===1?'green':p.level===4?'purple':'')}</div><h3>${e(p.name)}</h3><p>${e(p.subtitle)}</p>${progress(done/p.lessons.length*100)}<div class="row between progress-label"><span>${done} / ${p.lessons.length} Lektionen abgeschlossen</span>${icon('arrow')}</div></a>`;}
function heroArt(){return `<div class="hero-art" aria-hidden="true"><svg viewBox="0 0 250 220"><circle cx="132" cy="112" r="95" fill="#32644f"/><circle cx="132" cy="112" r="80" fill="none" stroke="#518067" stroke-dasharray="3 7"/><g transform="rotate(-10 120 110)"><rect x="52" y="32" width="136" height="164" rx="12" fill="#e1edc5"/><rect x="62" y="25" width="136" height="163" rx="9" fill="#f8f8ed"/><path d="M79 158h99M79 168h61" stroke="#ccd5ba" stroke-width="4" stroke-linecap="round"/><rect x="76" y="108" width="100" height="15" rx="3" fill="#dceba7"/><path d="M80 115h92M80 136h86" stroke="#8da18a" stroke-width="3" stroke-linecap="round"/><text x="78" y="88" font-family="Georgia,serif" font-size="53" fill="#315541">Aa.</text></g><g transform="rotate(12 192 153)"><rect x="158" y="140" width="63" height="45" rx="10" fill="#f2bc7e"/><path d="M175 158l7 7 17-16" stroke="#6d4d2e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M40 62v12M34 68h12M215 72v12M209 78h12" stroke="#a3c895" stroke-width="2" stroke-linecap="round"/></svg></div>`;}
const S=window.SM={D,C,Q,key:KEY,state,F,art:heroArt,ui:{scope:'priority',menu:false,search:'',category:'',material:true,status:'',mode:'recognize',trainingLevel:4,count:10,trainingCategory:'',draftTopic:state.settings.lastDraftTopic||'buch',workshopTab:'editor',pairQuiz:{},labSelection:[]},views:{},handlers:{},inputs:{},changes:{},icon,e,button,pageTop,tag,progress,status,statuses,cat,empty,save,toast,dialog,go,render,route,ring,pathCard};
S.views.sources=function(){return pageTop('MATERIAL & QUALITÄT','Deine Unterlagen bestimmen den Stoff.','47 ausdrücklich genannte Begriffe. Neue Übungssätze, aber keine zusätzlichen Lernbegriffe. Die tatsächliche Prüfung ist nicht bekannt.')+`<div class="card mb"><h2>Die neun Fotos als Grundlage</h2><div class="stack">${D.corrections.map((text,i)=>`<div class="step-text"><span class="circle-num">${i+1}</span><p>${e(text)}</p></div>`).join('')}</div></div><div class="grid two"><div class="card"><h2>Quellen und Transparenz</h2><div class="source-list">${D.sources.map(s=>`<h3>${s.url?`<a href="${e(s.url)}" target="_blank" rel="noopener noreferrer">${e(s.title)} ↗</a>`:e(s.title)}</h3><p class="small muted">${e(s.note)}</p>`).join('')}</div></div><div class="card"><h2>Keine unsichtbare KI-Bewertung</h2><p class="small">Zuordnung, Fachbegriffe und festgelegte Wortmarkierungen werden nach einer hinterlegten Lösung geprüft. Freie Beispiele, Wirkungsdeutungen, Analysen und Kommentare werden mit Musterlösungen und Selbstkontrolle bearbeitet. Die Anwendung versteht diese freien Texte nicht automatisch.</p><p class="small">Markierungsgrenzen können variieren. Eine formal abweichende, fachlich plausible Zitiergrenze kann die automatische Punktzahl mindern. Die Mustererklärung und deine begründete Einordnung sind deshalb wichtiger als der Prozentwert allein.</p><p class="small">Es werden keine Noten berechnet und keine externen Anfragen für die Lernfunktionen gesendet. Die Lerntexte sind Übungsmaterial, keine verbindliche Prüfungsordnung.</p></div></div>`;};
Object.assign(S.handlers,{
 'navigate':el=>go(el.dataset.route),'menu':()=>{S.ui.menu=!S.ui.menu;render();},'theme':()=>{S.state.settings.theme=S.state.settings.theme==='dark'?'light':'dark';save();render();},'close-dialog':()=>document.getElementById('app-dialog').close(),
 'save-settings':()=>{S.state.settings.name=document.getElementById('settings-name').value.trim().slice(0,80);save();toast('Einstellungen gespeichert.');render();},
 'recommend':()=>{const r=F.recommend(S.state);if(r.route)go(r.route);else S.handlers[r.action]?.();}
});
document.addEventListener('click',ev=>{if(ev.target.closest('.skip-link')){ev.preventDefault();document.getElementById('main-content')?.focus();return;}const el=ev.target.closest('[data-action]');if(el){const fn=S.handlers[el.dataset.action];if(fn){ev.preventDefault();fn(el,ev);}}});
document.addEventListener('input',ev=>{const el=ev.target;S.inputs[el.id]?.(el,ev);if(el.dataset.input&&S.inputs[el.dataset.input])S.inputs[el.dataset.input](el,ev);});
document.addEventListener('change',ev=>{const el=ev.target;S.changes[el.id]?.(el,ev);if(el.dataset.change&&S.changes[el.dataset.change])S.changes[el.dataset.change](el,ev);});
document.addEventListener('submit',ev=>{if(ev.target.id==='global-search-form'){ev.preventDefault();S.ui.search=document.getElementById('global-search').value;go('catalog');}});
window.addEventListener('hashchange',()=>{S.ui.menu=false;render(false);});
document.addEventListener('DOMContentLoaded',()=>{render(false);S.startClock?.();});
})();

</script>
<script>
/* Compact material cards and comparison practice. */
(function(){'use strict';
const S=window.SM,{D,C,Q,F,e,icon,button,pageTop,tag,progress,empty}=S;
function scopeLabel(t){return t.focus.priority===1?'ZUERST LERNEN':t.focus.priority===3?'HANDSCHRIFTLICHE RANDNOTIZ':'AUCH IN DEINER TABELLE';}
function termStatus(t){const ev=F.evidence(S.state,t.id);return `<span class="status-label"><i class="status-dot s${ev.level}"></i> ${e(F.status(S.state,t.id))}</span>`;}
S.status=id=>Q.by[id]?termStatus(Q.by[id]):'';
function signalMap(){return `<details class="card mb signal-map"><summary>Ein Satz ist auffällig. Worauf schaue ich zuerst?</summary><div class="grid two mt">${D.recognitionMap.map(x=>`<div class="signal-row"><h3>${e(x.cue)}</h3><p class="small">${e(x.rule)}</p><div class="row wrap">${x.ids.map(id=>`<a class="text-link small" href="#detail/${id}">${e(Q.by[id].name)}</a>`).join(' · ')}</div></div>`).join('')}</div><p class="small muted mt">Die Fragen lenken deine Suche. Mehrere Mittel können gleichzeitig zutreffen. Belege jedes Merkmal am Satz.</p></details>`;}
S.views.catalog=function(){
 const needle=C.norm(S.ui.search||''),scope=S.ui.scope||'priority';
 let terms=D.terms.filter(t=>(needle||scope==='all'||scope==='errors'||(scope==='priority'?t.focus.priority===1:t.focus.priority!==1))&&(!needle||C.norm(t.name+' '+t.aliases.join(' ')+' '+t.focus.cue+' '+t.focus.example).includes(needle)));
 if(scope==='errors'&&!needle)terms=terms.filter(t=>F.evidence(S.state,t.id).wrong||Object.values(S.state.errors).some(x=>x.question?.terms?.includes(t.id)));
 terms.sort((a,b)=>a.focus.priority-b.focus.priority||a.name.localeCompare(b.name,'de'));
 return pageTop('MERKMALE STATT LANGE THEORIE','Was sehe ich? Wie heißt es?','Lerne jeweils das Signal und ein Beispiel. Die genaue Definition bleibt bei Bedarf aufklappbar.')+
 `<div class="info mb">${D.focusPriorityIds.length} Begriffe stehen zuerst, weil sie in Zuordnungsaufgaben oder im Fettdruck vorkommen. Die übrigen ${D.terms.length-D.focusPriorityIds.length} stehen ebenfalls in deinen Fotos und können nicht sicher ausgeschlossen werden.</div>`+
 `<div class="catalog-controls card mb"><label class="field grow">Begriff, Merkmal oder Beispiel suchen<input id="catalog-search" value="${e(S.ui.search||'')}" placeholder="z. B. Satzanfang, Gegensatz, Herz …" autocomplete="off"></label><label class="field">Stoffauswahl<select id="focus-scope">${[['priority','Zuerst lernen · 23'],['all','Alle Begriffe · 47'],['remaining','Übrige Tabellenbegriffe · 24'],['errors','Meine unsicheren Begriffe']].map(([v,l])=>`<option value="${v}" ${scope===v?'selected':''}>${l}</option>`).join('')}</select></label>${button('Nacheinander lernen '+icon('arrow'),'focus-learn',`data-scope="${scope==='priority'?'priority':'all'}"`,'secondary')}</div>`+
 signalMap()+`<div class="section-title"><h2>${terms.length} passende Begriffe</h2>${needle?tag('SUCHE IN ALLEN 47 BEGRIFFEN'):tag('NUR DEINE FOTOS')}</div><div class="grid three">${terms.map(t=>`<a class="card clickable focus-term-card" href="#detail/${t.id}"><div class="row between wrap">${tag(scopeLabel(t),t.focus.priority===1?'green':'')}${termStatus(t)}</div><h2>${e(t.name)}</h2><p class="focus-cue">${e(t.focus.cue)}</p><div class="focus-example">${C.highlight(t.focus.example)}</div><span class="text-link mt">Am Beispiel verstehen ${icon('arrow')}</span></a>`).join('')}</div>${!terms.length?empty('Keine passenden Begriffe','Ändere den Suchtext oder die Stoffauswahl. Bei „Meine unsicheren Begriffe“ erscheinen nur tatsächlich bearbeitete Fehler.'):''}`;
};
function explanation(t,compact=false){return `<section class="card focus-explanation"><div class="row between wrap mb">${tag('DAS ENTSCHEIDENDE MERKMAL','green')}${termStatus(t)}</div><h2 class="focus-signal">${e(t.focus.cue)}</h2><p>${e(t.simple)}</p><div class="focus-example large">${C.highlight(t.focus.example)}</div><p class="small muted">${e(t.focus.source)}</p><div class="focus-explain-grid"><div><h3>Warum dieses Mittel?</h3><p>${e(t.focus.why)}</p></div><div><h3>Welche Wirkung passt hier?</h3><p>${e(t.focus.effect)}</p></div></div><p class="small muted">Die Wirkung gehört zu dieser Formulierung und ihrem Zusammenhang, nicht automatisch zu jedem Vorkommen des Mittels.</p></section>${!compact?`<details class="card mt"><summary>Definition, Gegenbeispiel und Verwechslungen</summary><div class="mt"><h3>Definition für die Kurzarbeit</h3><p>${e(t.definition)}</p><h3>Gerade kein Beispiel</h3><p class="question-text">${e(t.counter.text)}</p><p>${e(t.counter.why)}</p>${t.confusion.length?'<h3>Nicht verwechseln</h3>'+t.confusion.map(([id,text])=>`<p><a class="text-link" href="#detail/${id}">${e(Q.by[id].name)}:</a> ${e(text)}</p>`).join(''):''}<div class="info"><b>Merksatz:</b> ${e(t.memory)}</div></div></details>`:''}`;}
S.views.detail=function(id){
 const t=Q.by[id];if(!t)return empty('Nicht im aktuellen Unterrichtsstoff','Dieser Begriff gehört nicht zu den 47 übernommenen Einträgen. Öffne die Übersicht.');
 S.state.seen[id]=S.state.seen[id]||Date.now();
 return `<a class="back" href="#catalog">${icon('back')} Merkmale erkennen</a>`+pageTop(scopeLabel(t),e(t.name),e(t.focus.source))+
 (t.id==='apostrophe'?'<div class="info warning mb">Nur eine handschriftliche Randnotiz. Die Gleichsetzung mit jeder Anrede ist fachlich zu weit. Die normalen Anreden aus dem Arbeitsblatt zuerst unter „Anrede“ lernen.</div>':'')+
 explanation(t)+`<section class="card mt"><h2>Jetzt ohne Erklärung prüfen</h2><p class="small muted">Nur deine Antworten verändern den Übungsstatus. Das Öffnen dieser Karte zählt nicht als Können.</p><div class="row wrap">${button('Merkmal erklären','detail-train',`data-id="${id}" data-mode="feature"`)}${button('Beispiele erkennen','detail-train',`data-id="${id}" data-mode="recognize"`,'secondary')}${button('Begriff selbst nennen','detail-train',`data-id="${id}" data-mode="definition"`,'secondary')}</div></section>`;
};
function queue(){
 let q=S.state.settings.focusQueue;
 if(!q||!Array.isArray(q.ids)||!q.ids.length||q.ids.some(id=>!Q.by[id])){q={ids:F.ordered(S.state),index:0,scope:'priority'};S.state.settings.focusQueue=q;}
 q.index=Math.min(q.ids.length,Math.max(0,Number(q.index)||0));return q;
}
S.views.learn=function(){
 const q=queue();
 if(q.index>=q.ids.length)return pageTop('ERKENNUNGSRUNDE','Die Beispiele sind durchgesehen.','Jetzt zählt, was du ohne die Karte abrufen kannst.')+`<section class="card"><h2>Lesen ist noch kein Leistungsnachweis.</h2><p>Prüfe die Begriffe jetzt in gemischter Reihenfolge. Danach sind Verwechslungen und konkrete Wirkungen an der Reihe.</p><div class="row wrap">${button('10 Begriffe prüfen','focus-round','data-mode="mixed"')}${button('Nicht verwechseln','navigate','data-route="compare"','secondary')}${button('Runde neu beginnen','focus-restart','','ghost')}</div></section>`;
 const t=Q.by[q.ids[q.index]];
 return `<a class="back" href="#dashboard">${icon('back')} Zurück zum Prüfungsplan</a>`+pageTop('EIN MERKMAL NACH DEM ANDEREN',e(t.name),`${q.index+1} von ${q.ids.length} · ${e(t.focus.source)}`)+
 `<div class="mb">${progress(q.index/q.ids.length*100)}</div>`+explanation(t,true)+
 `<div class="question-actions mt"><span class="small muted">${q.index?'Du kannst jederzeit zurückblättern.':'Erst das Merkmal verstehen, dann ohne Hilfe benennen.'}</span><div class="row wrap">${q.index?button('Zurück','focus-prev-card','','secondary'):''}${button('Ohne Hilfe prüfen '+icon('arrow'),'focus-learn-test')}${button('Nächstes Merkmal','focus-next-card','','secondary')}</div></div>`+
 `<p class="small muted">„Nächstes Merkmal“ blättert nur weiter. Es vergibt keine Lernpunkte.</p>`;
};
S.views.compare=function(){return pageTop('HIER GEHEN LEICHT PUNKTE VERLOREN','Ähnlich. Aber nicht dasselbe.','Die Unterscheidungen verwenden ausschließlich Begriffe, die in deinen Fotos stehen.')+`<div class="grid two">${D.pairs.map(p=>`<a class="card clickable" href="#pair/${p.id}"><span class="eyebrow">MERKMALE VERGLEICHEN</span><h2 class="mt-small">${e(Q.by[p.a].name)} <span class="muted">/</span> ${e(Q.by[p.b].name)}</h2><p class="small">${e(p.explanation)}</p><span class="text-link">Beispiele nebeneinander ${icon('arrow')}</span></a>`).join('')}</div><section class="card mt"><h2>Auch beides kann stimmen.</h2><p>„Der Einsatz war groß, klein war der Gewinn“ ist ein Chiasmus und eine Antithese. Die Kreuzstellung betrifft den Bauplan, der Gegensatz die Bedeutung.</p>${button('Mehrfachbefunde üben','focus-round','data-mode="hard"')}</section>`;};
S.views.pair=function(id){const p=D.pairs.find(p=>p.id===id);if(!p)return empty('Vergleich nicht gefunden','Öffne die Vergleichsübersicht.');return `<a class="back" href="#compare">${icon('back')} Nicht verwechseln</a>`+pageTop('DER ENTSCHEIDENDE UNTERSCHIED',e(Q.by[p.a].name)+' / '+e(Q.by[p.b].name),'Prüfe das Merkmal direkt an den Wörtern.')+`<div class="grid two">${[p.a,p.b].map(id=>{const t=Q.by[id];return `<section class="card"><h2>${e(t.name)}</h2><p class="focus-cue">${e(t.focus.cue)}</p><div class="focus-example large">${C.highlight(t.focus.example)}</div><p>${e(t.focus.why)}</p></section>`;}).join('')}</div><section class="card mt"><h2>So trennst du sie.</h2><p>${e(p.explanation)}</p><div class="info"><b>Bei Überschneidungen:</b> ${e(p.overlap)}</div><div class="mt">${button('Diese zwei Begriffe prüfen','pair-train',`data-id="${id}"`)}</div></section>`;};
Object.assign(S.handlers,{
 'focus-learn':el=>{const scope=el?.dataset?.scope;let q=S.state.settings.focusQueue;if(!q||q.index>=q.ids.length||(scope&&q.scope!==scope))S.state.settings.focusQueue={ids:F.ordered(S.state,scope||'priority'),index:0,scope:scope||'priority'};S.save();S.go('learn');},
 'focus-restart':()=>{S.state.settings.focusQueue={ids:F.ordered(S.state),index:0,scope:'priority'};S.save();S.go('learn');},
 'focus-next-card':()=>{const q=queue();q.index=Math.min(q.ids.length,q.index+1);S.save();S.go('learn');},
 'focus-prev-card':()=>{const q=queue();q.index=Math.max(0,q.index-1);S.save();S.render(false);},
 'focus-learn-test':()=>{const q=queue(),id=q.ids[q.index];S.startSession({mode:'feature',terms:[id],count:1,level:4});const ss=S.state.activeSession;ss.questions=[Q.bank().find(x=>x.id===id+':feature'),Q.bank().find(x=>x.id===id+':recognize:0')];ss.focusReturn=true;S.save();S.render(false);},
 'detail-train':el=>S.startSession({mode:el.dataset.mode,terms:[el.dataset.id],count:el.dataset.mode==='recognize'?3:1,level:4}),
 'pair-train':el=>{const p=D.pairs.find(x=>x.id===el.dataset.id);S.startSession({mode:'mixed',terms:[p.a,p.b],count:6,level:4});},
 'focus-all':()=>{S.ui.scope='all';S.ui.search='';S.go('catalog');}
});
S.inputs['catalog-search']=el=>{S.ui.search=el.value;S.render();};
S.changes['focus-scope']=el=>{S.ui.scope=el.value;S.render();};
})();

</script>
<script>
(function(){'use strict';const S=window.SM,{D,C,Q,e,icon,button,pageTop,tag,progress,empty}=S;
const configHTML=()=>`<div class="card training-config"><label class="field">Lernstufe<select id="training-level">${['Absoluter Anfänger','Grundlagen','Fortgeschritten','Prüfungsniveau'].map((s,i)=>`<option value="${i+1}" ${S.ui.trainingLevel===i+1?'selected':''}>${i+1} · ${s}</option>`).join('')}</select></label><label class="field">Umfang<select id="training-count">${[5,10,20,40].map(n=>`<option value="${n}" ${S.ui.count===n?'selected':''}>${n} Aufgaben</option>`).join('')}</select></label><label class="field config-category">Stoffauswahl<select id="training-category"><option value="">Alle Kategorien</option>${D.categories.map(c=>`<option value="${c.id}" ${S.ui.trainingCategory===c.id?'selected':''}>${e(c.short)}</option>`).join('')}</select></label>${button('Training starten','start-training')}${S.ui.mode==='cards'?`<label class="field config-category">Kartenrichtung<select id="card-mode"><option value="term">Begriff → Definition</option><option value="definition" ${S.ui.cardMode==='definition'?'selected':''}>Definition → Begriff</option><option value="example" ${S.ui.cardMode==='example'?'selected':''}>Beispiel → Begriff</option><option value="effect" ${S.ui.cardMode==='effect'?'selected':''}>Begriff → mögliche Wirkung</option></select></label>`:''}</div>`;
S.startSession=function(config){let mode=config.mode||'mixed',level=Number(config.level)||2,count=Number(config.count)||10;let questions;
if(Array.isArray(config.questions))questions=JSON.parse(JSON.stringify(config.questions.filter(S.F.questionAllowed)));
else if(mode==='cards'){const ts=D.terms.filter(t=>(!config.terms?.length||config.terms.includes(t.id))&&(!config.categories?.length||config.categories.includes(t.category))&&t.level<=Math.max(2,level));questions=C.shuffle(ts,Date.now()).sort((a,b)=>(S.state.progress[b.id]?.due<=Date.now()?1:0)-(S.state.progress[a.id]?.due<=Date.now()?1:0)).slice(0,count).map(t=>({id:'card:'+t.id,kind:'flashcard',term:t.id,level:t.level}));}
else questions=Q.select({...config,level,count,modes:[mode]},S.state);
if(!questions.length){S.toast(mode==='mistakes'?'Es sind keine offenen Fehler gespeichert. Wähle einen anderen Modus.':'Für diese Kombination gibt es keine Aufgaben. Wähle eine höhere Stufe oder eine andere Kategorie.');return;}
S.state.activeSession={id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),mode,level,questions,index:0,answers:{},feedbacks:{},models:{},startedAt:Date.now(),lessonId:config.lessonId||null,cardMode:S.ui.cardMode||'term',cardBack:false,completed:false};S.ui.matchLeft=null;S.save();S.go('session');if(questions.length<count)S.toast(`Diese Auswahl enthält ${questions.length} unterschiedliche Aufgaben. Die Runde wurde entsprechend angepasst.`);};
function active(ctx){return ctx==='exam'?S.state.activeExam:S.state.activeSession;}
function current(ctx){const s=active(ctx);return s?.questions[s.index];}
function answerPresent(q,a){if(q.kind==='write')return !!a?.text?.trim();if(q.kind==='order'||q.kind==='multi'||q.kind==='mark')return Array.isArray(a)&&a.length>0;if(q.kind==='match')return a&&Object.keys(a).length>0;if(q.kind==='odd')return !!a?.choice;return a!==undefined&&a!==null&&String(a).trim()!=='';}
S.answerPresent=answerPresent;
function setAnswer(ctx,val){const s=active(ctx),q=current(ctx);if(!s||!q)return;if(ctx!=='exam'&&s.feedbacks[q.id])return;s.answers[q.id]=val;if(ctx==='exam'&&s.feedbacks)s.feedbacks[q.id]=null;S.save();}
S.questionHTML=function(q,answer,ctx='train',feedback=null){let locked=!!feedback&&ctx!=='exam';const multi=q.kind==='multi',sel=Array.isArray(answer)?answer:[],pick=answer?.choice??answer;let input='';const attr=`data-context="${ctx}"`;
if(['choice','multi','odd','effect','error'].includes(q.kind))input=`<div class="answer-list">${q.options.map((o,i)=>{let selected=multi?sel.includes(o.value):String(pick??'')===String(o.value),correct=feedback&&(multi?q.answer.includes(o.value):q.answer===o.value),wrong=feedback&&selected&&!correct;return `<button type="button" class="answer-option ${selected?'selected':''} ${correct?'correct':''} ${wrong?'incorrect':''}" data-action="answer-option" ${attr} data-value="${e(o.value)}" aria-pressed="${selected}" ${locked?'disabled':''}><span class="option-letter">${multi?(selected?'✓':'○'):String.fromCharCode(65+i)}</span><span>${e(o.label)}</span></button>`;}).join('')}</div>${q.kind==='odd'?`<label class="field mt">Deine Begründung <span class="small muted">Wird mit der Musterbegründung verglichen, nicht automatisch sprachlich bewertet.</span><textarea id="odd-reason" data-input="odd-reason" ${attr} ${locked?'disabled':''} placeholder="Das Beispiel passt nicht, weil …">${e(answer?.reason||'')}</textarea></label>`:''}`;
else if(q.kind==='input'||q.kind==='gap')input=`<label class="field">Deine Antwort<input id="q-answer" class="answer-input" autocomplete="off" spellcheck="false" data-input="q-input" ${attr} value="${e(answer||'')}" ${locked?'disabled':''} placeholder="Fachbegriff eingeben"></label>`;
else if(q.kind==='mark'){input=`<p class="token-note">Wörter antippen oder mit Tab und Leertaste auswählen. Erneutes Antippen entfernt die Auswahl.</p><div class="word-area" aria-label="Wörter zum Markieren">${C.tokens(q.text).map((t,i)=>`<button type="button" class="word-token ${sel.includes(i)?'selected':''} ${feedback&&q.answer.includes(i)?'solution':''} ${feedback&&sel.includes(i)&&!q.answer.includes(i)?'missed':''}" data-action="mark-word" ${attr} data-index="${i}" aria-pressed="${sel.includes(i)}" ${locked?'disabled':''}>${e(t.text)}</button> `).join('')}</div><span class="small muted">${sel.length} Wörter ausgewählt</span>`;}
else if(q.kind==='order'){let chosen=Array.isArray(answer)?answer:[],left=C.shuffle(q.items,C.hash(q.id)).filter(x=>!chosen.includes(x.value));input=`<p class="small muted">Tippe Bausteine in der gewünschten Reihenfolge an. In der Lösungszeile kannst du sie wieder entfernen.</p><div class="order-zone" aria-label="Deine Reihenfolge">${chosen.map((v,i)=>`<button class="chip active" data-action="remove-order" data-index="${i}" ${attr} ${locked?'disabled':''}>${e(q.items.find(x=>x.value===v)?.label)} ×</button>`).join('')||'<span class="small muted">Hier entsteht dein Satz.</span>'}</div><div class="row wrap">${left.map(x=>button(e(x.label),'add-order',`${attr} data-value="${x.value}" ${locked?'disabled':''}`,'secondary')).join('')}</div>`;}
else if(q.kind==='match'){let a=answer||{},leftChosen=S.ui.matchLeft;input=`<div class="match-grid"><div class="match-col">${q.left.map((x,i)=>`<button class="match-item ${leftChosen===x.value?'selected':''} ${a[x.value]?'connected':''}" data-action="match-left" ${attr} data-value="${x.value}" ${locked?'disabled':''}><b>${i+1}.</b> ${e(x.label)}${a[x.value]?`<br><span class="tag green">${e(Q.by[a[x.value]]?.name||a[x.value])}</span>`:''}</button>`).join('')}</div><div class="match-col">${C.shuffle(q.right,C.hash(q.id)).map(x=>`<button class="match-item ${Object.values(a).includes(x.value)?'connected':''}" data-action="match-right" ${attr} data-value="${x.value}" ${locked?'disabled':''}>${e(x.label)}</button>`).join('')}</div></div><p class="small muted mt-small">${Object.keys(a).length} von ${q.left.length} Paaren verbunden. Eine neue Zuordnung ersetzt die vorherige.</p>`;}
else if(q.kind==='write'){let s=active(ctx),reveal=(ctx==='train'&&s?.models?.[q.id])||!!feedback;input=`<label class="field">Dein Text<textarea id="q-free" data-input="q-input" ${attr} rows="8" ${locked?'disabled':''} placeholder="Formuliere zuerst selbst. Die Musterlösung bleibt bis zur Kontrolle verborgen.">${e(answer?.text||'')}</textarea></label><p class="small muted" id="q-wordcount">${C.words(answer?.text||'')} Wörter · keine automatische Inhaltsbewertung</p>${reveal?`<details open class="mt"><summary>Musterlösung</summary><p style="white-space:pre-line">${e(q.model)}</p></details><div class="info mt-small">Dies ist eine Selbstkontrolle. Setze nur Kriterien, die dein Text tatsächlich erfüllt. Die Anwendung versteht deine freie Antwort nicht automatisch.</div><div class="criteria">${q.rubric.map((r,i)=>`<label class="check"><input type="checkbox" data-change="q-rubric" ${attr} data-index="${i}" ${answer?.rubric?.[i]?'checked':''} ${locked?'disabled':''}>${e(r)}</label>`).join('')}</div>`:''}`;}
return `<section class="card question-card"><div class="row between wrap mb">${tag(q.kind==='write'?'OFFENE AUFGABE · SELBSTKONTROLLE':q.kind==='multi'?'MEHRFACHAUSWAHL':q.kind==='mark'?'WORTMARKIERUNG':q.kind==='match'?'PAARE ZUORDNEN':'WISSEN ANWENDEN',q.kind==='write'?'purple':'')}<span class="small muted">${q.points} Punkte</span></div><h2>${e(q.prompt)}</h2>${q.text&&q.kind!=='mark'?`<div class="question-text ${q.text.length>430?'long':''}">${e(q.text)}</div>`:''}${input}${ctx==='train'&&active(ctx)?.level<4&&!feedback&&active(ctx)?.mode!=='hard'&&q.hint?`<details class="hint"><summary>Einen Hinweis anzeigen</summary><p>${e(q.hint)}</p></details>`:''}${feedback?S.feedbackHTML(q,feedback):''}</section>`;};
S.feedbackHTML=function(q,f){const g=f.grade||f;return `<div class="feedback ${g.pending?'partial':g.ratio>=.8?'':g.ratio>0?'partial':'bad'}" role="status"><h3>${g.pending?'Noch nicht bewertet':g.self?'Deine Selbstkontrolle':g.ratio===1?'Richtig.':g.ratio>=.8?'Weitgehend richtig.':g.ratio>0?'Ein Teil stimmt bereits.':'Hier lohnt sich ein genauer Blick.'} ${!g.pending?`<span class="small">${g.score} / ${g.max} Punkte</span>`:''}</h3>${q.marked?`<div class="answer-quote">${C.highlight(q.marked)}</div>`:''}<p>${e(q.explanation)}</p>${['input','gap'].includes(q.kind)?`<p><b>Gesuchter Begriff:</b> ${e(q.answers[0])}</p>`:''}${q.kind==='multi'?`<p><b>Passend:</b> ${q.answer.map(id=>e(Q.by[id]?.name||id)).join(', ')}.</p><p class="small">Je richtiges Ziel ein Anteil; jedes falsche zusätzliche Kreuz zieht einen solchen Anteil ab. Mindestens 0 Punkte.</p>`:''}${q.kind==='mark'?'<p class="small">Teilpunkte beruhen auf der Übereinstimmung der ausgewählten und hinterlegten Wörter (F1). Fehlende und zu viele Wörter senken die Übereinstimmung; gerundet wird auf halbe Punkte.</p>':''}${q.kind==='order'?`<p><b>Eine Lösung gemäß Vorgabe:</b> ${q.answer.map(v=>e(q.items.find(x=>x.value===v)?.label)).join(' ')}</p>`:''}${q.kind==='match'?`<p>${q.left.map(x=>`${Number(x.value)+1} → ${e(Q.by[q.answer[x.value]]?.name||q.answer[x.value])}`).join(' · ')}</p>`:''}${!g.self&&g.ratio<.8?`<div class="info mt-small"><b>Für den nächsten Versuch:</b> ${e(Q.by[q.term]?.recognize||'Prüfe zunächst die sprachliche Form, dann die Bedeutung.')}</div>`:''}</div>`;};
S.recordQuestion=function(q,answer,g,id,mode){if(g.pending)return;const event={id,term:q.trackTerm===false?null:q.term,mode,ratio:g.ratio,self:!!g.self,level:q.level,at:Date.now(),qid:q.id,question:q,answer,selectedTerm:typeof answer==='string'&&Q.by[answer]?answer:undefined};C.record(S.state,event);};
S.views.session=function(){const s=S.state.activeSession;if(!s)return pageTop('TRAINING','Starte deine nächste Runde.','Noch keine aktive Übung.')+button('Training auswählen','navigate','data-route="training"');if(s.completed)return sessionResult(s);if(s.mode==='cards')return flashcards(s);
let q=s.questions[s.index],a=s.answers[q.id],f=s.feedbacks[q.id];const m=Q.modes.find(m=>m.id===s.mode);
return `<div class="question-frame"><a class="back" href="#training">${icon('back')} Trainingsübersicht · Runde bleibt bis zum Neuladen erhalten</a><div class="question-top"><div class="row between"><div><span class="eyebrow">${e(m?.name||'Lerncheck')}</span><h2 class="mt-small no-margin">Aufgabe ${s.index+1} von ${s.questions.length}</h2></div>${tag('NUR DEIN UNTERRICHTSSTOFF','green')}</div>${progress(s.index/s.questions.length*100)}</div>${S.questionHTML(q,a,'train',f)}<div class="question-actions"><span class="small muted">${q.kind==='write'?'Selbstkontrolle, keine KI-Note':'Antworten bleiben nur bis zum Neuladen.'}</span>${f?button((s.index+1===s.questions.length?'Runde auswerten':'Nächste Aufgabe')+' '+icon('arrow'),'next-question'):q.kind==='write'&&!s.models[q.id]?button('Muster und Kriterien ansehen','show-model'):button(q.kind==='write'?'Selbstkontrolle speichern':'Antwort prüfen','check-answer')}</div></div>`;};
function sessionResult(s){let fs=Object.values(s.feedbacks),auto=fs.filter(f=>!f.grade.self),self=fs.filter(f=>f.grade.self),score=auto.reduce((a,f)=>a+f.grade.score,0),max=auto.reduce((a,f)=>a+f.grade.max,0),ratio=max?score/max:0;let lesson=s.lessonId&&S.state.lessons[s.lessonId];return `<div class="question-frame">`+pageTop('RUNDE ABGESCHLOSSEN',s.mode==='cards'?'Abrufen statt nur überfliegen.':'Ein Schritt sicherer.',s.mode==='cards'?'Deine Selbsteinschätzungen haben die nächsten Wiederholungstermine angepasst.':'Die Auswertung trennt objektiv geprüfte Antworten und deine Selbstkontrollen.')+`<div class="card mb"><div class="row between wrap"><div><span class="eyebrow">${max?'OBJEKTIV GEPRÜFT':'SELBST EINGESCHÄTZT'}</span><div class="result-score">${max?Math.round(ratio*100)+' %':fs.length}<small>${max?' · '+score+' / '+max+' Punkte':' Karten / Aufgaben'}</small></div></div>${icon('award')}</div><p class="small muted">${self.length?self.length+' Aufgaben mit Selbstkontrolle. Diese zählen nicht zur objektiven Trefferquote.':'Keine Schulnote, sondern Rückmeldung zu dieser Übungsrunde.'}</p>${lesson?.done?'<div class="info good">Lerncheck bestanden. Der Lernpfad wurde aktualisiert.</div>':s.lessonId?'<div class="info warning">Für den Abschluss dieser Lektion sind 70 % im objektiven Lerncheck erforderlich. Wiederhole die unsicheren Merkmale und versuche es erneut.</div>':''}<div class="row wrap mt">${button('Neue Runde','navigate','data-route="training"')}${button('Meine Fehler wiederholen','repeat-mistakes','','secondary')}${s.lessonId?button('Zurück zum Lernpfad','navigate',`data-route="lesson/${s.lessonId}"`,'secondary'):button('Zur Übersicht','navigate','data-route="dashboard"','secondary')}</div></div>${s.mode!=='cards'?s.questions.map((q,i)=>`<details class="card mb"><summary>${i+1}. ${e(Q.by[q.term]?.name||'Aufgabe')} · ${s.feedbacks[q.id]?.grade.score||0} / ${q.points} Punkte${q.kind==='write'?' · Selbstkontrolle':''}</summary>${S.feedbackHTML(q,s.feedbacks[q.id])}</details>`).join(''):''}</div>`;}
function flashcards(s){const q=s.questions[s.index],t=Q.by[q.term],back=s.cardBack,mode=s.cardMode;let front=mode==='definition'?t.definition:mode==='example'?C.plain(t.examples[0].text):t.name;let answer=mode==='term'?t.definition:mode==='effect'?t.examples[1].effect:t.name;
return `<div class="question-frame"><a class="back" href="#training">${icon('back')} Trainingsübersicht</a><div class="question-top"><div class="row between"><h2>Karte ${s.index+1} von ${s.questions.length}</h2>${tag('SELBSTEINSCHÄTZUNG','purple')}</div>${progress(s.index/s.questions.length*100)}</div><button type="button" class="flashcard" data-action="card-flip" style="width:100%" aria-label="Karte umdrehen"><span class="eyebrow">${back?'RÜCKSEITE · VERGLEICHE MIT DEINER ANTWORT':'VORDERSEITE · ERST ABRUFEN, DANN UMDREHEN'}</span><span class="${back?'back-text':'front'}">${e(back?answer:front)}</span>${back?`<span class="small muted mt">${e(mode==='example'?t.examples[0].why:mode==='effect'?'Wirkung im konkreten Kommentar: '+C.plain(t.examples[1].text):t.memory)}</span>`:''}<span class="small muted mt">${icon('repeat')} &nbsp; ${back?'Erneut umdrehen':'Antippen oder Enter drücken'}</span></button>${back?`<p class="small muted mt">Wie gut konntest du die Antwort vor dem Umdrehen abrufen?</p><div class="ratings">${button('Schwer · 10 Minuten','rate-card','data-ratio="0.2"','secondary')}${button('Mittel · 1 Tag','rate-card','data-ratio="0.7"','secondary')}${button('Leicht · längeres Intervall','rate-card','data-ratio="1"')}</div>`:`<div class="info mt">${mode==='effect'?'Nenne eine mögliche Wirkung mit einem passenden Kontext. Wirkungen sind nicht für jedes Beispiel gleich.':'Sprich oder notiere deine Antwort, bevor du die Karte umdrehst. Wiedererkennen ist leichter als selbstständiges Abrufen.'}</div>`}</div>`;}
function finishSession(s){s.completed=true;s.finishedAt=Date.now();let auto=Object.values(s.feedbacks).filter(f=>!f.grade.self),max=auto.reduce((a,f)=>a+f.grade.max,0),score=auto.reduce((a,f)=>a+f.grade.score,0);if(s.lessonId&&max&&score/max>=.7)S.state.lessons[s.lessonId]={done:true,at:Date.now(),ratio:score/max,self:false};S.save();S.render(false);}
Object.assign(S.handlers,{
 'choose-mode':el=>{S.ui.mode=el.dataset.mode;if(S.ui.mode==='hard')S.ui.trainingLevel=4;S.render();document.querySelector('.training-config')?.scrollIntoView({block:'center',behavior:'smooth'});},
 'start-training':()=>S.startSession({mode:S.ui.mode,level:S.ui.trainingLevel,count:S.ui.count,categories:S.ui.trainingCategory?[S.ui.trainingCategory]:undefined}),
 'answer-option':el=>{const ctx=el.dataset.context,q=current(ctx),s=active(ctx);if(!q)return;let val=el.dataset.value,a=s.answers[q.id];if(q.kind==='multi'){let ar=Array.isArray(a)?[...a]:[];setAnswer(ctx,ar.includes(val)?ar.filter(x=>x!==val):[...ar,val]);}else if(q.kind==='odd')setAnswer(ctx,{choice:val,reason:a?.reason||''});else setAnswer(ctx,val);S.render();},
 'mark-word':el=>{const ctx=el.dataset.context,q=current(ctx),s=active(ctx),i=Number(el.dataset.index);let a=Array.isArray(s.answers[q.id])?[...s.answers[q.id]]:[];setAnswer(ctx,a.includes(i)?a.filter(x=>x!==i):[...a,i]);S.render();},
 'add-order':el=>{const ctx=el.dataset.context,q=current(ctx),s=active(ctx);let a=[...(s.answers[q.id]||[])];if(!a.includes(el.dataset.value))a.push(el.dataset.value);setAnswer(ctx,a);S.render();},
 'remove-order':el=>{const ctx=el.dataset.context,q=current(ctx),s=active(ctx),a=[...(s.answers[q.id]||[])];a.splice(Number(el.dataset.index),1);setAnswer(ctx,a);S.render();},
 'match-left':el=>{S.ui.matchLeft=el.dataset.value;S.render();},
 'match-right':el=>{if(S.ui.matchLeft===null||S.ui.matchLeft===undefined){S.toast('Wähle zuerst links eine Definition.');return;}const ctx=el.dataset.context,q=current(ctx),s=active(ctx);let a={...(s.answers[q.id]||{})};for(const k in a)if(a[k]===el.dataset.value)delete a[k];a[S.ui.matchLeft]=el.dataset.value;setAnswer(ctx,a);S.ui.matchLeft=null;S.render();},
 'show-model':()=>{const s=S.state.activeSession,q=s.questions[s.index];if(!s.answers[q.id]?.text?.trim()){S.toast('Formuliere zuerst einen eigenen Versuch.');document.getElementById('q-free')?.focus();return;}s.models[q.id]=true;S.save();S.render();},
 'check-answer':()=>{const s=S.state.activeSession;if(!s)return;const q=s.questions[s.index];if(s.feedbacks[q.id])return;let a=s.answers[q.id];if(!answerPresent(q,a)){S.toast('Gib zuerst eine Antwort ein.');return;}if(q.kind==='write'){a={...a,rated:true,rubric:a.rubric||q.rubric.map(()=>false)};s.answers[q.id]=a;}const g=C.grade(q,a);s.feedbacks[q.id]={grade:g};S.recordQuestion(q,a,g,s.id+':'+q.id,s.mode);S.save();S.render();document.querySelector('.feedback')?.scrollIntoView({block:'nearest',behavior:'smooth'});},
 'next-question':()=>{const s=S.state.activeSession;if(!s||!s.feedbacks[s.questions[s.index].id])return;if(s.index+1>=s.questions.length)finishSession(s);else{s.index++;S.ui.matchLeft=null;S.save();S.render(false);}},
 'repeat-mistakes':()=>S.startSession({mode:'mistakes',level:4,count:10}),
 'card-flip':()=>{const s=S.state.activeSession;if(!s||s.mode!=='cards')return;s.cardBack=!s.cardBack;S.save();S.render();},
 'rate-card':el=>{const s=S.state.activeSession;if(!s?.cardBack)return;let q=s.questions[s.index],ratio=Number(el.dataset.ratio);const g={score:ratio,max:1,ratio,self:true,pending:false};s.feedbacks[q.id]={grade:g};C.record(S.state,{id:s.id+':'+q.id,term:q.term,mode:'cards',ratio,self:true,level:q.level,at:Date.now()});s.cardBack=false;if(s.index+1>=s.questions.length)finishSession(s);else{s.index++;S.save();S.render(false);}}
});
S.inputs['q-input']=el=>{const ctx=el.dataset.context,q=current(ctx);if(!q)return;setAnswer(ctx,q.kind==='write'?{...(active(ctx).answers[q.id]||{}),text:el.value,rated:false}:el.value);if(q.kind==='write'){const c=document.getElementById('q-wordcount');if(c)c.textContent=C.words(el.value)+' Wörter · keine automatische Inhaltsbewertung';}};
S.inputs['odd-reason']=el=>{const ctx=el.dataset.context,q=current(ctx);setAnswer(ctx,{...(active(ctx).answers[q.id]||{}),reason:el.value});};
S.changes['q-rubric']=el=>{const ctx=el.dataset.context,q=current(ctx),s=active(ctx),a=s.answers[q.id]||{text:''},r=[...(a.rubric||q.rubric.map(()=>false))];r[Number(el.dataset.index)]=el.checked;setAnswer(ctx,{...a,rubric:r});};
for(const [id,key,number] of [['training-level','trainingLevel',true],['training-count','count',true],['training-category','trainingCategory',false],['card-mode','cardMode',false]])S.changes[id]=el=>{S.ui[key]=number?Number(el.value):el.value;};
})();

</script>
<script>
(function(){'use strict';const S=window.SM,{D,C,Q,e,icon,button,pageTop,tag,progress,empty}=S;
function timeString(ms){let sec=Math.max(0,Math.ceil(ms/1000));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;}
function clock(ex){return ex.deadline?`<span id="exam-clock" class="exam-clock ${ex.deadline-Date.now()<120000?'urgent':''}" role="timer" aria-label="Restzeit">${icon('clock')} ${timeString(ex.deadline-Date.now())}</span>`:tag('Ohne Zeitlimit');}
S.views.examrun=function(){const ex=S.state.activeExam;if(!ex)return pageTop('PRÜFUNG','Keine laufende Prüfung.','Wähle zuerst die gewünschten Einstellungen.')+button('Prüfung konfigurieren','navigate','data-route="exam"');let q=ex.questions[ex.index],answered=ex.questions.filter(q=>S.answerPresent(q,ex.answers[q.id])).length;
let header=`<div class="page-top"><div class="row between wrap"><div><span class="eyebrow">KURZARBEIT · VARIANTE ${e(ex.config?.variant||'A')} · 30 MINUTEN</span><h1 style="font-size:32px;margin-top:12px">${ex.review?'Noch einmal prüfen.':'Konzentriert bei der Sache.'}</h1></div>${clock(ex)}</div><div class="row between mb"><span class="small muted">${answered} von ${ex.questions.length} Antworten erfasst</span><a class="text-link" href="#exam">Verlassen · nur bis zum Neuladen</a></div>${progress(answered/ex.questions.length*100)}</div>`;
if(ex.review)return header+`<div class="card"><h2>Antworten vor der Abgabe kontrollieren</h2><p class="small muted">${ex.questions.length-answered} Aufgaben sind noch unbeantwortet. Du kannst jede Antwort erneut öffnen und ändern. Hier werden noch keine Lösungen verraten.</p>${ex.questions.map((q,i)=>`<div class="exam-review-item"><span class="circle-num">${i+1}</span><div class="grow"><p>${e(q.prompt.slice(0,150))}</p><span class="small muted">${S.answerPresent(q,ex.answers[q.id])?'Antwort gespeichert':'Noch offen'} · ${q.points} Punkte${q.kind==='write'?' · freie Antwort':''}</span></div>${button('Öffnen','exam-jump',`data-index="${i}"`,'secondary small')}</div>`).join('')}<div class="row between wrap mt">${button('Zurück zur Aufgabe','exam-back-review','','secondary')}${button('Prüfung abgeben','confirm-exam-submit')}</div></div>`;
return header+`<div class="exam-layout"><div><p class="eyebrow mb">${e(q.section||'Aufgabe')}</p>${S.questionHTML(q,ex.answers[q.id],'exam',ex.config.feedback==='direct'?ex.feedbacks[q.id]:null)}<div class="question-actions">${button(icon('back')+' Zurück','exam-prev',ex.index===0?'disabled':'','secondary')}${ex.config.feedback==='direct'&&q.kind!=='write'?button('Zwischenfeedback','exam-check','','secondary'):''}${button((ex.index+1===ex.questions.length?'Antworten kontrollieren':'Weiter / überspringen')+' '+icon('arrow'),'exam-next')}</div></div><aside class="card exam-side"><div class="row between mb"><h3 class="no-margin">Aufgaben</h3><span class="small muted">${ex.index+1} / ${ex.questions.length}</span></div><div class="review-grid">${ex.questions.map((x,i)=>`<button type="button" class="review-dot ${i===ex.index?'current':''} ${S.answerPresent(x,ex.answers[x.id])?'answered':''}" data-action="exam-jump" data-index="${i}" aria-label="Aufgabe ${i+1}, ${S.answerPresent(x,ex.answers[x.id])?'beantwortet':'offen'}">${i+1}</button>`).join('')}</div><p class="small muted mt">${ex.config.feedback==='end'?'Lösungen bleiben bis zur Abgabe verborgen.':'Zwischenfeedback ist für objektive Aufgaben aktiviert. Freie Texte werden nach Abgabe selbst geprüft.'}</p><div class="stack">${button('Antworten kontrollieren','exam-review','','secondary')}${button('Vorzeitig abgeben','confirm-exam-submit','','ghost')}</div></aside></div>`;};
function finalize(timed=false){const ex=S.state.activeExam;if(!ex)return;ex.finishedAt=Date.now();ex.timedOut=timed;ex.results={};ex.questions.forEach(q=>{const a=ex.answers[q.id],g=C.grade(q,a);ex.results[q.id]=g;S.recordQuestion(q,a,g,ex.id+':'+q.id,'exam');});let a=ex.questions.filter(q=>q.kind!=='write'),max=a.reduce((n,q)=>n+q.points,0),score=a.reduce((n,q)=>n+ex.results[q.id].score,0);if(ex.lessonId&&max&&score/max>=.7)S.state.lessons[ex.lessonId]={done:true,at:Date.now(),ratio:score/max,self:false};S.state.exams.push(ex);if(S.state.exams.length>500)S.state.exams.shift();S.state.activeExam=null;S.save();const d=document.getElementById('app-dialog');if(d.open)d.close();S.go('examresult/'+ex.id);if(timed)S.toast('Die Zeit ist abgelaufen. Der gespeicherte Stand wurde abgegeben.');}
S.examTotals=function(ex){let automatic=ex.questions.filter(q=>q.kind!=='write'),free=ex.questions.filter(q=>q.kind==='write');return {autoScore:automatic.reduce((n,q)=>n+(ex.results[q.id]?.score||0),0),autoMax:automatic.reduce((n,q)=>n+q.points,0),selfScore:free.reduce((n,q)=>n+(ex.results[q.id]?.score||0),0),selfMax:free.reduce((n,q)=>n+q.points,0),pending:free.filter(q=>!ex.results[q.id]||ex.results[q.id].pending).length,max:ex.questions.reduce((n,q)=>n+q.points,0)};};
function answerText(q,a){if(a===undefined||a===null)return 'Keine Antwort abgegeben.';if(q.kind==='write')return a.text||'Keine freie Antwort abgegeben.';if(q.kind==='mark')return (Array.isArray(a)?a:[]).sort((a,b)=>a-b).map(i=>C.tokens(q.text)[i]?.text||'').join(' ')||'Nichts markiert.';if(q.kind==='order')return (a||[]).map(v=>q.items.find(x=>x.value===v)?.label||'').join(' ');if(q.kind==='match')return Object.entries(a||{}).map(([k,v])=>(Number(k)+1)+': '+(Q.by[v]?.name||v)).join(' · ');if(q.kind==='multi')return a.map(v=>q.options.find(o=>o.value===v)?.label||v).join(', ');if(q.options){let pick=a?.choice??a;return (q.options.find(o=>o.value===pick)?.label||'Keine Auswahl')+(a?.reason?'\nBegründung: '+a.reason:'');}return String(a);}
S.views.examresult=function(id){const ex=S.state.exams.find(x=>x.id===id);if(!ex)return pageTop('AUSWERTUNG','Keine Prüfung gefunden.','Die Ergebniskennung ist in diesem lokalen Lernstand nicht vorhanden.')+button('Zur Prüfungsauswahl','navigate','data-route="exam"');const t=S.examTotals(ex),wrong=ex.questions.filter(q=>q.kind!=='write'&&(ex.results[q.id]?.ratio||0)<.8),gaps=S.F.examGaps(ex),ids=gaps.terms;return `<a class="back" href="#exam">${icon('back')} Zur 30-Minuten-Kurzarbeit</a>`+pageTop('DEINE AUSWERTUNG',ex.timedOut?'Zeit vorbei. Wissen sichtbar.':'Ein ehrlicher Blick auf deinen Stand.',`${new Date(ex.finishedAt).toLocaleDateString('de')} · Variante ${e(ex.config?.variant||'A')} · ${ex.questions.length} Aufgaben · Bearbeitungszeit ${Math.max(1,Math.round((ex.finishedAt-ex.startedAt)/60000))} Minuten`)+`<div class="grid two mb"><section class="card"><span class="eyebrow">OBJEKTIV GEPRÜFTER ANTEIL</span><div class="result-score">${t.autoMax?Math.round(t.autoScore/t.autoMax*100)+' %':'—'}</div><h3>${t.autoScore} von ${t.autoMax} Punkten</h3><p class="small muted">${wrong.length} objektive Aufgaben noch nicht weitgehend sicher. Teilpunkte sind enthalten. Keine Notenumrechnung.</p></section><section class="card"><span class="eyebrow">FREIE SCHREIBAUFGABEN</span><div class="result-score" style="font-size:43px">${t.pending?t.pending+' offen':t.selfMax?t.selfScore+' / '+t.selfMax:'Keine'}</div><p class="small muted">${t.selfMax?'Diese '+t.selfMax+' möglichen Punkte erfordern Selbstkontrolle. Sie sind kein automatisch verifiziertes Sprachurteil.':'Diese Simulation enthält nur objektiv bewertbare Aufgaben.'}</p><div class="info">${t.pending?`Noch kein vollständiger Gesamtwert. Maximal sind insgesamt ${t.max} Punkte möglich.`:`Gesamt: ${t.autoScore+t.selfScore} / ${t.max} Punkte (${t.max?Math.round((t.autoScore+t.selfScore)/t.max*100):0} %).${t.selfMax?' Dieser Gesamtwert enthält deine Selbstbewertungen.':''}`}</div></section></div><section class="card mb"><h2>Das solltest du als Nächstes üben</h2>${wrong.length?`<p class="small muted">Diese Empfehlung folgt aus den Aufgaben dieser Prüfung, bei denen weniger als 80 % der möglichen Lösung erreicht wurden.</p><div class="row wrap">${ids.map(id=>`<a class="chip" href="#detail/${id}">${e(Q.by[id]?.name||id)}</a>`).join('')}${gaps.commentBasics?'<a class="chip" href="#effects/comment">Kommentargrundlagen</a>':''}</div><div class="row wrap mt"></div>`:`<p>Der objektive Teil enthält keine ausgeprägten Lücken. Prüfe besonders die selbst formulierten Antworten anhand des Rasters.</p><div class="row wrap"></div>`}</section><div class="section-title"><h2>Aufgaben, Lösungen und Begründungen</h2>${tag(ex.questions.length+' Aufgaben')}</div>${ex.questions.map((q,i)=>{const g=ex.results[q.id]||{pending:true,self:true},a=ex.answers[q.id];return `<details class="card mb" ${q.kind==='write'&&g.pending?'open':''}><summary><span class="row between wrap"><span>${i+1}. ${q.kind==='write'?'Freie Schreibaufgabe':q.trackTerm===false?'Kommentargrundlagen':e(Q.by[q.term]?.name||'Aufgabe')}</span>${tag(g.pending?'Selbstkontrolle offen':g.score+' / '+q.points+' Punkte',g.pending?'purple':g.ratio>=.8?'green':g.ratio>0?'gold':'red')}</span></summary><p class="mt"><b>Auftrag:</b> ${e(q.prompt)}</p>${q.text?`<div class="question-text ${q.text.length>400?'long':''}">${e(q.text)}</div>`:''}<h3>Deine Antwort</h3><div class="info" style="white-space:pre-line">${e(answerText(q,a))}</div>${q.kind==='write'?`<h3 class="mt">Muster und Orientierung</h3><p style="white-space:pre-line;font-size:13px">${e(q.model)}</p><div class="info warning">Die folgenden Punkte vergibst du selbst. Ein gesetztes Häkchen bedeutet nicht, dass die Anwendung den Text inhaltlich geprüft hat.</div><div class="criteria">${q.rubric.map((r,ri)=>`<label class="check"><input type="checkbox" data-change="exam-self-rubric" data-exam="${ex.id}" data-question="${q.id}" data-index="${ri}" ${a?.rubric?.[ri]?'checked':''} ${!a?.text?.trim()?'disabled':''}>${e(r)} <small class="muted">(${q.points/q.rubric.length} Punkte)</small></label>`).join('')}</div>${button('Selbstkontrolle übernehmen','exam-self-save',`data-exam="${ex.id}" data-question="${q.id}"`,'secondary')}<p class="small muted mt-small">Bei leerer Antwort bleiben alle Kriterien unerfüllt. Eine ehrliche 0-Punkte-Selbstkontrolle ist möglich.</p>`:S.feedbackHTML(q,{grade:g})}</details>`;}).join('')}`;};
Object.assign(S.handlers,{
 'exam-next':()=>{const ex=S.state.activeExam;if(!ex)return;if(ex.index+1<ex.questions.length)ex.index++;else ex.review=true;S.ui.matchLeft=null;S.save();S.render(false);},
 'exam-prev':()=>{const ex=S.state.activeExam;if(ex&&ex.index>0){ex.index--;S.ui.matchLeft=null;S.save();S.render(false);}},
 'exam-jump':el=>{const ex=S.state.activeExam;if(!ex)return;ex.index=Math.max(0,Math.min(ex.questions.length-1,Number(el.dataset.index)||0));ex.review=false;S.ui.matchLeft=null;S.save();S.render(false);},
 'exam-review':()=>{const ex=S.state.activeExam;if(ex){ex.review=true;S.save();S.render(false);}},
 'exam-back-review':()=>{S.state.activeExam.review=false;S.save();S.render(false);},
 'exam-check':()=>{const ex=S.state.activeExam,q=ex.questions[ex.index];if(!S.answerPresent(q,ex.answers[q.id])){S.toast('Gib zuerst eine Antwort ein.');return;}ex.feedbacks[q.id]={grade:C.grade(q,ex.answers[q.id])};S.save();S.render();},
 'confirm-exam-submit':()=>{const ex=S.state.activeExam;if(!ex)return;const missing=ex.questions.filter(q=>!S.answerPresent(q,ex.answers[q.id])).length;S.dialog('Prüfung endgültig abgeben?',`<p>${missing?`Noch ${missing} Aufgaben sind unbeantwortet. Sie erhalten im objektiven Teil 0 Punkte.`:'Zu jeder Aufgabe ist eine Antwort gespeichert.'}</p><p class="small muted">Nach der Abgabe sind objektive Antworten nicht mehr veränderbar. Freie Texte kannst du anschließend anhand der Kriterien selbst bewerten.</p>`,button('Weiterarbeiten','close-dialog','','secondary')+button('Jetzt abgeben','submit-exam'));},
 'submit-exam':()=>finalize(false),
 'exam-gaps':el=>{const ex=S.state.exams.find(x=>x.id===el.dataset.id);if(!ex)return;const questions=S.F.examGaps(ex).questions;S.startSession({mode:'mistakes',questions,count:questions.length,level:4});},
 'exam-self-save':el=>{let ex=S.state.exams.find(x=>x.id===el.dataset.exam),q=ex.questions.find(q=>q.id===el.dataset.question),a=ex.answers[q.id]||{text:'',rubric:q.rubric.map(()=>false)};if(!a.text?.trim())a.rubric=q.rubric.map(()=>false);a.rated=true;ex.answers[q.id]=a;ex.results[q.id]=C.grade(q,a);S.recordQuestion(q,a,ex.results[q.id],ex.id+':self:'+q.id,'exam-self');S.save();S.toast('Selbstkontrolle gespeichert und gesondert ausgewiesen.');S.render();},
});
S.changes['exam-self-rubric']=el=>{const ex=S.state.exams.find(x=>x.id===el.dataset.exam),q=ex.questions.find(q=>q.id===el.dataset.question);const a=ex.answers[q.id]||{text:''};a.rubric=a.rubric||q.rubric.map(()=>false);a.rubric[Number(el.dataset.index)]=el.checked;a.rated=false;ex.answers[q.id]=a;ex.results[q.id]=C.grade(q,a);S.save();};
S.startClock=function(){setInterval(()=>{const ex=S.state.activeExam;if(!ex?.deadline)return;const left=ex.deadline-Date.now();if(left<=0){finalize(true);return;}const el=document.getElementById('exam-clock');if(el){el.innerHTML=icon('clock')+' '+timeString(left);el.classList.toggle('urgent',left<120000);}},1000);};
})();

</script>
<script>
/* Short writing practice. Content quality is always assessed by the learner. */
(function(){'use strict';
const S=window.SM,{D,C,F,e,icon,button,pageTop,tag}=S,X=window.SMFData;
function writing(){return S.state.settings.focusWriting||(S.state.settings.focusWriting=F.blankWriting());}
function tabs(active){return `<nav class="focus-tabs mb" aria-label="Wirkung und Schreiben"><a class="${active==='effect'?'active':''}" href="#effects">Wirkung erkennen</a><a class="${active==='analysis'?'active':''}" href="#effects/write">Analyse schreiben</a><a class="${active==='comment'?'active':''}" href="#effects/comment">Kommentarabsatz</a></nav>`;}
function modelAndChecks(type){
 const w=writing(),revealed=w[type+'Reveal'],checks=w[type+'Checks']||[];
 const rubric=type==='analysis'?X.practice.rubric:X.practice.commentRubric;
 const model=type==='analysis'?X.practice.model:X.practice.commentModel;
 return `<section class="card mt"><h2>Erst selbst schreiben. Dann vergleichen.</h2><p class="small muted">Dein Text bleibt bis zum Neuladen erhalten. Er wird nicht automatisch inhaltlich bewertet. Eine andere treffend belegte Lösung ist möglich.</p>${!revealed?button('Muster und Kriterien aufdecken','focus-reveal-writing',`data-type="${type}"`):`<details open><summary>Musterabsatz</summary><p class="mt" style="white-space:pre-line">${e(model)}</p></details><div class="info mt"><b>Selbstkontrolle:</b> Je erfülltem Kriterium 2 selbst eingeschätzte Punkte. Prüfe den Inhalt, nicht die Ähnlichkeit mit dem Wortlaut des Musters.</div><div class="criteria">${rubric.map((r,i)=>`<label class="check"><input type="checkbox" data-change="focus-writing-check" data-type="${type}" data-index="${i}" ${checks[i]?'checked':''} ${!w[type].trim()?'disabled':''}>${e(r)}</label>`).join('')}</div><p class="focus-self-score" id="focus-self-score"><b>${checks.filter(Boolean).length*2} / 8 Punkte · selbst eingeschätzt</b></p>`}</section>`;
}
function editor(type){const w=writing(),isAnalysis=type==='analysis',low=isAnalysis?70:90,high=isAnalysis?100:120;
 return `<section class="card"><div class="row between wrap mb"><h2>${isAnalysis?'Dein Analyseabsatz':'Dein Kommentarabsatz'}</h2>${tag('ENTWURF DIESER SITZUNG')}</div><label class="field">${isAnalysis?'Erkläre mindestens zwei Befunde in einem zusammenhängenden Absatz.':'Schreibe mit Überschrift, Position, Begründung, Einwand und pointiertem Schluss.'}<textarea id="focus-writing-text" data-input="focus-writing-text" data-type="${type}" rows="10" maxlength="100000" placeholder="${isAnalysis?'Die Formulierung „…“ zeigt …, weil … . Dadurch wird … hervorgehoben. Das unterstützt … .':'Deine Überschrift\n\nDein eigener Kommentarabsatz …'}">${e(w[type])}</textarea></label><div class="row between wrap mt-small"><span class="small muted" id="focus-writing-count">${C.words(w[type])} Wörter · Übungsziel ${low} bis ${high}</span></div></section>`;
}
S.views.effects=function(mode){
 const type=mode==='write'?'analysis':mode==='comment'?'comment':'effect';
 if(type==='effect')return pageTop('HIER WIRD AUS BENENNEN EINE ANALYSE','Was bewirkt es genau hier?','Für den Schreibteil brauchst du keine leere Standardfloskel, sondern einen am Beispiel erklärten Zusammenhang.')+tabs(type)+
 `<div class="grid two"><section class="card"><span class="tag red">ZU UNGENAU</span><h2 class="mt">„Das macht den Text interessanter.“</h2><p class="small muted">Das könnte unter fast jedem Text stehen. Es erklärt weder das Bild noch seine Funktion.</p></section><section class="card"><span class="tag green">KONKRET AM BEISPIEL</span><h2 class="mt">„Bücher öffnen Türen.“</h2><p>Die Metapher stellt Bücher als Zugang zu neuen Erfahrungen dar. Wie eine Tür einen Raum erschließt, ermöglicht Lesen neue Einblicke. In einem Plädoyer für die Bibliothek unterstreicht das ihren Wert.</p></section></div>`+
 `<section class="card mt"><h2>Vier Bausteine reichen.</h2><div class="focus-analysis-steps"><div><b>1. Beleg + Begriff</b><p>„öffnen Bücher Türen“ ist eine Metapher.</p></div><div><b>2. Merkmal</b><p>Die Türen sind bildlich, nicht wörtlich gemeint.</p></div><div><b>3. Konkrete Aussage</b><p>Lesen gibt Zugang zu neuen Erfahrungen.</p></div><div><b>4. Funktion im Text</b><p>Das unterstützt die Forderung nach einer Bibliothek.</p></div></div><div class="info">Die Wirkung ist nicht im Namen eingebaut. Eine Wiederholung kann etwa einen Wunsch verstärken; du musst sagen, welcher Wunsch hier gemeint ist.</div><div class="row wrap mt">${button('5 Wirkungen zuordnen','focus-effect-practice')}<a class="button secondary" href="#effects/write">Jetzt selbst formulieren ${icon('arrow')}</a></div></section>`+
 `<section class="card mt"><h3>Eine Formulierung, die du anpassen musst</h3><p class="focus-example">Mit [Begriff] „[kurzes Zitat]“ stellt der Text [konkrete Sache] als [Bild / Gegensatz / Bewertung] dar. Dadurch wird [bestimmte Aussage] hervorgehoben; das unterstützt [Haltung / Forderung].</p><p class="small muted">Ersetze alle Klammern mit Inhalt aus dem Text. Nicht jede Figur ist ein Bild. Verwende nur passende Teile der Formulierung.</p></section>`;
 if(type==='analysis')return pageTop('SCHREIBTRAINING · ETWA 70 BIS 100 WÖRTER','Zwei Befunde. Ein klarer Absatz.','Suche kurze Belege. Benenne die Mittel, zeige ihre Merkmale und erkläre ihre Funktion im Zusammenhang.')+tabs(type)+
 `<section class="card mb"><div class="row between wrap"><h2>Übungstext: Warum eine Bibliothek?</h2>${tag('NEU FORMULIERT · GLEICHER LERNSTOFF')}</div><p class="focus-reading">${e(X.practice.text)}</p><p class="small muted">Ein eigener Übungstext zum Buchthema, keine Vorlage der tatsächlichen Kurzarbeit. Untersuche mindestens zwei sprachliche Mittel.</p></section>`+
 `<details class="card mb"><summary>Beim ersten Versuch: eine knappe Schreibhilfe</summary><p>1. Zitat und Begriff nennen. 2. Die sprachliche Besonderheit zeigen. 3. Erklären, was damit konkret ausgedrückt wird. 4. Die Wirkung mit der Haltung des Textes verbinden.</p><p class="small muted">In der Probekurzarbeit bleibt diese Hilfe ausgeblendet.</p></details>`+editor(type)+modelAndChecks(type);
 return pageTop('SCHREIBTRAINING · ETWA 90 BIS 120 WÖRTER','Kurz Stellung beziehen.','Ein argumentativer Absatz statt eines vollständigen 500- oder 800-Wörter-Kommentars.')+tabs(type)+
 `<section class="card mb"><h2>${e(X.practice.commentPrompt)}</h2><p class="small">Schreibe einen Kommentarabsatz mit Überschrift. Nutze beide Übungspositionen, begründe deine Haltung, berücksichtige einen Einwand und setze ein Stilmittel sinnvoll ein.</p><div class="focus-reading" style="white-space:pre-line">${e(X.practice.commentMaterials)}</div><div class="info mt">Bezüge kennzeichnest du zum Beispiel mit „(vgl. M1)“. Die Materialien sind erfunden; sie sind keine echten Studien oder Aussagen realer Befragter.</div></section>`+
 `<details class="card mb"><summary>Die sieben Planungsschritte aus deinem Blatt</summary><div class="mt">${D.steps.map((x,i)=>`<div class="step-text"><span class="circle-num">${i+1}</span><div><h3>${e(x.title)}</h3><p class="small">${e(x.text)}</p></div></div>`).join('')}</div><div class="info">Das Blatt beschreibt auch längere Kommentare. Für diesen kurzen Absatz konzentrierst du dich auf ein ausgeführtes Argument und einen Einwand. Sachlich, aber mit erkennbarer Position; überwiegend Präsens.</div></details>`+editor(type)+modelAndChecks(type);
};
Object.assign(S.handlers,{
 'focus-effect-practice':()=>S.startSession({mode:'effect',terms:D.focusPriorityIds,count:5,level:4}),
 'focus-reveal-writing':el=>{const w=writing(),type=el.dataset.type;if(!w[type]?.trim()){S.toast('Schreibe zuerst einen eigenen Versuch. Es reicht auch ein kurzer Absatz.');document.getElementById('focus-writing-text')?.focus();return;}w[type+'Reveal']=true;S.save();S.render();},
});
S.inputs['focus-writing-text']=el=>{const type=el.dataset.type,w=writing();w[type]=el.value;w[type+'Checks']=[false,false,false,false];S.save();const count=document.getElementById('focus-writing-count');if(count)count.textContent=C.words(el.value)+' Wörter · Übungsziel '+(type==='analysis'?'70 bis 100':'90 bis 120');document.querySelectorAll('[data-change="focus-writing-check"]').forEach(x=>{x.checked=false;x.disabled=!el.value.trim();});const score=document.getElementById('focus-self-score');if(score)score.textContent='Text geändert · Kriterien erneut prüfen. 0 / 8 selbst eingeschätzte Punkte.';};
S.changes['focus-writing-check']=el=>{const type=el.dataset.type,w=writing();w[type+'Checks'][Number(el.dataset.index)]=!!el.checked&&!!w[type].trim();S.save();const score=document.getElementById('focus-self-score');if(score)score.textContent=(w[type+'Checks'].filter(Boolean).length*2)+' / 8 Punkte · selbst eingeschätzt';};
})();

</script>
<script>
/* Exam focused navigation and study plan. Loaded after the shared engines. */
(function(){'use strict';
const S=window.SM,{D,C,Q,F,e,icon,button,pageTop,tag,progress,empty}=S,X=window.SMFData;
const modes=[
 ['feature','Merkmal verstehen','Welche sprachliche Eigenschaft erkennst du?','scan'],
 ['recognize','Stilmittel erkennen','Kurze Beispiele, ein passender Fachbegriff.','book'],
 ['definition','Ohne Auswahl benennen','Den Fachbegriff selbst eingeben.','type'],
 ['mark','Wörter markieren','Den entscheidenden Beleg antippen.','pen'],
 ['hard','Mehrere Mittel erkennen','Überschneidungen und Verwechslungen prüfen.','compare'],
 ['effect','Konkrete Wirkung','Die Deutung wählen, die zum Satz passt.','spark']
];
const startSession=S.startSession;
S.startSession=function(cfg={}){
 const config={level:4,count:10,material:true,...cfg};
 startSession(config);
 if(S.state.activeSession&&!S.state.activeSession.completed){S.state.activeSession.focusEdition=2;S.save();}
};
const sessionView=S.views.session;
S.views.session=function(){const html=sessionView();const ss=S.state.activeSession;return html+(ss?.completed&&ss.focusReturn?`<section class="card question-frame mt"><h2>Weiter zum nächsten Erkennungsmerkmal</h2><p>Deine Antworten sind gespeichert. Bei Fehlern bleibt der Begriff im Fehlertraining.</p>${button('Nächstes Merkmal '+icon('arrow'),'focus-next-card')}${button('Zum Prüfungsplan','navigate','data-route="dashboard"','secondary')}</section>`:'');};
function planCards(){
 return F.plan(S.state.settings.focusMinutes).map((p,i)=>{const done=F.phaseState(S.state,p.id);return `<article class="focus-plan-row"><span class="circle-num ${done.done?'complete':''}">${done.done?icon('check'):String(i+1).padStart(2,'0')}</span><div class="grow"><h3>${e(p.title)}</h3><p class="small muted">${e(p.description)}</p><span class="small muted">${e(done.detail)}</span></div><div class="focus-plan-action">${tag(p.minutes+' MIN',p.id==='mock'?'gold':'')}${p.id==='recognize'?button('Starten','focus-learn','','secondary small'):p.id==='errors'?button('Fehler üben','focus-errors','','secondary small'):`<a class="button secondary small" href="#${p.route}">Öffnen ${icon('arrow')}</a>`}</div></article>`;}).join('');
}
S.views.dashboard=function(){
 const stats=F.summary(S.state),rec=F.recommend(S.state),minutes=S.state.settings.focusMinutes;
 const recent=S.state.exams.slice(-2).reverse();
 return `<div class="page-top"><div class="row between wrap"><span class="eyebrow">DEUTSCH · KLASSE 12 · DEINE UNTERRICHTSFOTOS</span>${tag('PRÜFUNGSFOKUS','green')}</div><h1>Erkennen. Erklären. Punkte sammeln.</h1><p class="subtitle">Kein kompletter Rhetorikkurs. Dein kurzer Weg durch genau die Merkmale und Aufgaben aus deinen Unterlagen.</p></div>`+
 `<div class="dashboard-grid mb"><section class="hero focus-hero"><div class="hero-copy"><div class="eyebrow">${icon('scan')} DEIN NÄCHSTER SCHRITT</div><h2>${e(rec.title)}</h2><p>${e(rec.text)}</p>${rec.route?`<a class="button soft" href="#${rec.route}">${e(rec.label)} ${icon('arrow')}</a>`:button(e(rec.label)+' '+icon('arrow'),rec.action,'','soft')}</div>${S.art()}</section><section class="card focus-budget"><span class="eyebrow">WIE VIEL LERNZEIT HAST DU?</span><div class="focus-time-value">${minutes}<span>Minuten</span></div><div class="time-options" role="group" aria-label="Lernzeit auswählen">${[60,90,120].map(n=>`<button type="button" class="time-option ${n===minutes?'active':''}" data-action="focus-time" data-minutes="${n}" aria-pressed="${n===minutes}">${n} min</button>`).join('')}</div><p class="small muted">Die 30 Minuten für die Probekurzarbeit sind bereits enthalten. Die übrigen Zeiten sind Richtwerte, kein Lernerfolgsversprechen.</p></section></div>`+
 `<div class="grid four mb">${[['book',stats.studied+' / 47','Begriffe tatsächlich geübt'],['check',stats.primaryKnown+' / 23','Zuerst lernen · mehrfach richtig'],['repeat',String(stats.errors),'Offene Fehleraufgaben'],['chart',stats.accuracy===null?'—':stats.accuracy+' %','Trefferquote · objektiver Teil']].map(([ic,num,label])=>`<section class="card stat"><span class="stat-icon">${icon(ic)}</span><strong>${num}</strong><span class="label">${label}</span></section>`).join('')}</div>`+
 `<div class="focus-main-grid"><section class="card"><div class="row between wrap mb"><div><span class="eyebrow">DEINE ${minutes} MINUTEN</span><h2 class="mt-small">Ein Plan. Sechs Schritte.</h2></div>${tag('FREI WÄHLBAR')}</div><p class="small muted">Starte bei deiner größten Lücke. Kein Bereich ist gesperrt. Erfasste Antworten, nicht bloß geöffnete Seiten, bestimmen den Übungsstand.</p>${planCards()}</section><aside class="stack"><section class="card"><span class="eyebrow">KLAR BEGRENZTER STOFF</span><h2 class="mt">23 zuerst. 24 danach.</h2><p>Die erste Gruppe stammt aus deinen Zuordnungsaufgaben und den fett gedruckten Tabelleneinträgen.</p><p class="small muted">Die weiteren Begriffe stehen ebenfalls in den Fotos. Ohne genaue Stoffeingrenzung der Lehrkraft lässt sich keiner davon sicher ausschließen.</p>${button('Alle 47 Merkmale ansehen','focus-all','','secondary')}</section><section class="card focus-mock-card"><span class="eyebrow">WIE IN EINER KURZARBEIT ÜBEN</span><div class="focus-mock-number">30 <span>min</span></div><h3>40 Punkte · mit Schreibteil</h3><p class="small">Benennen, unterscheiden, Wirkung erklären. Dazu ein kurzer Analyseabsatz und ein Kommentarabsatz.</p><a class="button" href="#exam">Kurzarbeit öffnen ${icon('arrow')}</a><p class="small muted mt">Plausibler Übungsentwurf, keine Vorhersage der echten Prüfung.</p></section></aside></div>`+
 (recent.length?`<section class="card mt"><h2>Deine letzten Kurzarbeiten</h2>${recent.map(ex=>{const t=S.examTotals(ex);return `<a class="list-row" href="#examresult/${ex.id}"><span class="circle-num">${e(ex.config.variant)}</span><span class="grow"><strong>${t.autoScore} / ${t.autoMax} objektive Punkte</strong><small>${t.pending?t.pending+' Schreibteile noch offen':t.selfScore+' / '+t.selfMax+' selbst eingeschätzte Schreibpunkte'} · ${new Date(ex.finishedAt).toLocaleDateString('de')}</small></span>${icon('arrow')}</a>`;}).join('')}</section>`:'');
};
S.views.training=function(){
 const scope=S.ui.trainingScope||'priority',count=Number(S.ui.focusCount)||10;
 return pageTop('KURZE RUNDEN · DIREKTES FEEDBACK','Genau das üben, was noch fehlt.','Keine langen Kurse und keine zusätzlichen Begriffe. Jede Antwort bekommt eine Erklärung am sprachlichen Merkmal.')+
 (S.state.activeSession&&!S.state.activeSession.completed?`<div class="info mb row between wrap"><span>Deine letzte Runde ist noch offen.</span><a class="button secondary" href="#session">Runde fortsetzen ${icon('arrow')}</a></div>`:'')+
 `<section class="card mb"><div class="row wrap between"><label class="field grow">Welche Begriffe?<select id="focus-training-scope"><option value="priority" ${scope==='priority'?'selected':''}>23 zuerst empfohlene Begriffe</option><option value="all" ${scope==='all'?'selected':''}>Alle 47 Begriffe aus den Fotos</option><option value="remaining" ${scope==='remaining'?'selected':''}>24 weitere Begriffe</option></select></label><label class="field">Rundenlänge<select id="focus-training-count">${[5,10,15].map(n=>`<option value="${n}" ${count===n?'selected':''}>${n} Aufgaben</option>`).join('')}</select></label><div class="row wrap">${button('Gemischte Runde','focus-round','data-mode="mixed"')}${button('Nur meine Fehler','focus-errors','','secondary')}</div></div></section>`+
 `<div class="grid three">${modes.map(([id,name,desc,ic])=>`<section class="card focus-mode"><span class="stat-icon">${icon(ic)}</span><h2>${name}</h2><p class="small muted">${desc}</p>${button('Runde starten '+icon('arrow'),'focus-round',`data-mode="${id}"`,'secondary')}</section>`).join('')}</div><div class="info mt">Wiederholte Fehler und fällige Begriffe werden bei der Auswahl bevorzugt. Schreibaufgaben findest du unter <a href="#effects/write">Wirkung & Schreiben</a>; dort wird ehrlich mit Musterlösungen und Selbstkontrolle gearbeitet.</div>`;
};
S.views.exam=function(){
 const variant=S.ui.mockVariant||'A';
 return pageTop('30 MINUTEN · NUR DEIN UNTERRICHTSSTOFF','Deine Probekurzarbeit.','Zwei Varianten, jeweils 14 Aufgaben und 40 Punkte. Beide verbinden Stilmittel mit einem kurzen Schreibteil.')+
 `<div class="info mb">${e(X.notice)}</div>`+
 (S.state.activeExam?`<div class="info warning mb row between wrap"><span><b>Variante ${e(S.state.activeExam.config.variant)} läuft bereits.</b> Der Countdown läuft auch beim Wechseln der Seite weiter.</span><a class="button secondary" href="#examrun">Fortsetzen ${icon('arrow')}</a></div>`:'')+
 `<div class="focus-main-grid"><section class="card"><h2>So ist die Kurzarbeit aufgebaut</h2><div class="focus-exam-overview">${X.sections.map((x,i)=>`<div class="focus-exam-section"><span class="circle-num">${String.fromCharCode(65+i)}</span><div class="grow"><strong>${e(x.name.slice(4))}</strong><span class="small muted">${e(x.tasks)} · Richtzeit ${x.minutes} Minuten</span></div><b>${x.points} P.</b></div>`).join('')}</div><div class="info mt"><b>30 Minuten insgesamt.</b> 24 Punkte sind objektiv prüfbar. Die 16 Punkte für freie Texte bleiben bis zu deiner Selbstkontrolle offen. Es wird keine Schulnote geschätzt.</div></section><aside class="stack"><section class="card"><h2>Bereit für den Versuch?</h2><label class="field mb">Variante<select id="focus-mock-variant"><option value="A" ${variant==='A'?'selected':''}>A · Gedrucktes Buch und Reader</option><option value="B" ${variant==='B'?'selected':''}>B · Bücher besitzen oder lesen</option></select></label><p class="small">Die Aufgaben verlangen nur Begriffe und Arbeitsweisen aus deinen Unterlagen. Die Texte sind für diese Übung neu geschrieben.</p>${button('30 Minuten starten '+icon('arrow'),'focus-start-mock')}<p class="small muted mt">Der Countdown beginnt sofort. Antworten sind änderbar und bleiben nur bis zum Neuladen erhalten. Nach Ablauf wird der aktuelle Stand abgegeben.</p></section><section class="card"><h3>Keine Lösungen vorab</h3><p class="small">Während der Bearbeitung gibt es keine Hinweise oder Muster. Du kannst Fragen überspringen und vor der Abgabe zurückgehen. Nach der Abgabe folgen Lösungen, Erklärungen und die Selbstkontrolle.</p><p class="small muted">Für die kurzen Schreibteile gelten die hier angegebenen Wortbereiche. Die 500 / 800 Wörter auf deinem Unterrichtsblatt gehören zu anderen Aufgabenformaten.</p></section></aside></div>`+
 (S.state.exams.length?`<section class="card mt"><h2>Bisherige Versuche</h2>${S.state.exams.slice().reverse().map(ex=>`<a class="list-row" href="#examresult/${ex.id}"><span class="circle-num">${e(ex.config.variant)}</span><span class="grow"><strong>Variante ${e(ex.config.variant)}</strong><small>${new Date(ex.finishedAt).toLocaleString('de')}</small></span>${icon('arrow')}</a>`).join('')}</section>`:'');
};
S.views.settings=function(){return pageTop('DEIN LERNRAUM','Einstellungen für diese Sitzung.','Antworten, Entwürfe und Fortschritt bleiben nur bis zum Neuladen erhalten.')+`<section class="card"><h2>Profil</h2><label class="field mb">Anzeigename<input id="settings-name" maxlength="80" value="${e(S.state.settings.name)}" placeholder="Optional"></label>${button('Einstellungen übernehmen','save-settings')}${button('Hell / dunkel wechseln','theme','','secondary')}<p class="small muted mt">Beim Neuladen beginnt alles neu. Die Lernzeit wählst du im Prüfungsplan.</p></section>`;};
function termsForTraining(){return S.ui.trainingScope==='all'?D.terms.map(t=>t.id):S.ui.trainingScope==='remaining'?D.terms.filter(t=>t.focus.priority!==1).map(t=>t.id):D.focusPriorityIds;}
function beginMock(){S.state.activeExam=F.mock(S.ui.mockVariant||'A');S.state.activeExam.id+='-'+Math.random().toString(36).slice(2,6);S.save();S.go('examrun');}
Object.assign(S.handlers,{
 'focus-time':el=>{const n=Number(el.dataset.minutes);if([60,90,120].includes(n)){S.state.settings.focusMinutes=n;S.save();S.render();}},
 'focus-round':el=>S.startSession({mode:el?.dataset?.mode||'mixed',terms:termsForTraining(),count:Number(S.ui.focusCount)||10,level:4}),
 'focus-errors':()=>{if(!F.summary(S.state).errors){S.toast('Noch keine offenen Fehler. Eine gemischte Runde zeigt dir mögliche Lücken.');S.go('training');return;}S.startSession({mode:'mistakes',count:10,level:4});},
 'focus-start-mock':()=>{if(S.state.activeExam)S.dialog('Laufende Kurzarbeit ersetzen?', '<p>Der bisherige laufende Versuch wird ersetzt. Abgeschlossene Versuche bleiben erhalten. Du kannst stattdessen zur laufenden Kurzarbeit zurückkehren.</p>',button('Abbrechen','close-dialog','','secondary')+button('Neu beginnen','focus-confirm-mock'));else beginMock();},
 'focus-confirm-mock':()=>{document.getElementById('app-dialog').close();beginMock();},
});
S.changes['focus-training-scope']=el=>{S.ui.trainingScope=el.value;S.render();};
S.changes['focus-training-count']=el=>{S.ui.focusCount=Number(el.value);};
S.changes['focus-mock-variant']=el=>{S.ui.mockVariant=el.value==='B'?'B':'A';};
// Old bookmarks lead to the focused replacement instead of an empty or expanded course.
S.views.paths=S.views.dashboard;S.views.path=S.views.dashboard;S.views.lesson=S.views.dashboard;
S.views.lab=()=>S.views.effects('write');S.views.labtext=()=>S.views.effects('write');S.views.workshop=()=>S.views.effects('comment');
})();

</script>
