e Bewertung knapp und zugespitzt auf den Punkt.","focus":{"cue":"Satzteile fehlen, lassen sich aber aus dem Zusammenhang ergänzen.","example":"[[Je schneller, desto besser.]]","why":"Ein vollständiger Satz könnte „Je schneller es geht, desto besser ist es“ lauten.","effect":"Die Verkürzung bringt die Bewertung knapp und zugespitzt auf den Punkt.","source":"Foto 4 und Foto 7","priority":1}},{"id":"inversion","name":"Inversion","category":"satz","level":3,"material":true,"simple":"Die Wörter stehen in einer auffällig veränderten Reihenfolge. Dadurch fällt ein Teil besonders auf.","definition":"Eine Inversion weicht von der im Kontext gewöhnlichen Wortstellung ab, häufig durch markierte Voranstellung oder poetische Umordnung.","recognize":"Vergleiche mit einer unauffälligen Fassung. Im Deutschen ist die Voranstellung eines Objekts oft grammatisch normal; rhetorische Markiertheit braucht Kontext.","examples":[{"text":"[[Vergessen habe ich den Schlüssel]], nicht verloren.","why":"Die Voranstellung von „vergessen“ wird durch den ausdrücklichen Gegensatz zu „verloren“ markiert.","effect":"Die Art des Missgeschicks wird hervorgehoben und gegen ein Missverständnis abgegrenzt.","context":"Alltag"},{"text":"[[Gerecht soll die Regel sein]], nicht bloß bequem.","why":"Das betonte Prädikativ „gerecht“ steht an der Spitze; der Nachsatz macht die Schwerpunktsetzung erkennbar.","effect":"Die Regel wird am Maßstab der Gerechtigkeit ausgerichtet und nicht an leichter Verwaltung.","context":"Kommentar / Rede"},{"text":"[[In seinen Händen die letzte Blüte lag]].","why":"Gegenüber „Die letzte Blüte lag in seinen Händen“ ist die Verbendstellung im Aussagesatz poetisch ungewöhnlich.","effect":"Die verzögerte Nennung des Verbs hält das Bild der Hände und der Blüte länger im Blick.","context":"Literarischer Modelltext"}],"effect":"Die Regel wird am Maßstab der Gerechtigkeit ausgerichtet und nicht an leichter Verwaltung.","confusion":[["chiasmus","Chiasmus verlangt mindestens zwei überkreuz angeordnete Einheiten. Inversion kann innerhalb eines einzelnen Satzes auftreten."]],"counter":{"text":"Heute fährt der Bus später.","why":"Ein Adverbial im Vorfeld mit Verbzweitstellung ist normal. Ohne besondere Markierung sollte man das nicht vorschnell als rhetorische Inversion werten."},"memory":"Ungewöhnliche Ordnung braucht einen begründeten Vergleich.","aliases":[],"classExample":"„Stilmittel kann ich keine mehr sehen.“ Die Voranstellung ist nur im passenden Kontext als rhetorisch markiert zu deuten.","exam":"Die Formulierung „In seinen Armen das Kind war tot.“ zeigt Inversion. Nach dem vorangestellten Ort steht nicht sofort das finite Verb; die gewöhnliche Wortstellung ist verändert. Die ungewöhnliche Folge hebt zunächst den Ort und schließlich die Todesfeststellung hervor.","focus":{"cue":"Die gewöhnliche Satzstellung wird auffällig verändert.","example":"[[In seinen Armen das Kind war tot.]]","why":"Nach dem vorangestellten Ort steht nicht sofort das finite Verb; die gewöhnliche Wortstellung ist verändert.","effect":"Die ungewöhnliche Folge hebt zunächst den Ort und schließlich die Todesfeststellung hervor.","source":"Foto 7","priority":1}},{"id":"parenthese","name":"Parenthese","category":"satz","level":3,"material":true,"simple":"Eine Zusatzbemerkung wird in einen Satz eingeschoben. Ohne sie bleibt der Satz grammatisch erhalten.","definition":"Eine Parenthese ist ein syntaktisch eigenständiger Einschub in einen übergeordneten Satz, häufig durch Gedankenstriche, Klammern oder Kommas abgegrenzt.","recognize":"Entferne den Einschub probeweise. Der umgebende Satz muss weiter funktionieren; der Einschub steht zusätzlich daneben.","examples":[{"text":"Mein Bruder [[– du kennst ihn ja –]] kommt morgen.","why":"Die Bemerkung ist eigenständig eingeschoben; „Mein Bruder kommt morgen“ bleibt vollständig.","effect":"Die Anrede schafft Nähe und bezieht gemeinsames Wissen ein.","context":"Alltag"},{"text":"Die neue Regel [[– das wird oft vergessen –]] gilt auch für Lehrkräfte.","why":"Der Hauptsatz bleibt ohne Einschub vollständig. Die Bemerkung kommentiert die Wahrnehmung der Regel.","effect":"Der Einschub korrigiert eine mögliche Schieflage in der Debatte und lenkt die Aufmerksamkeit auf gleiche Verpflichtungen.","context":"Kommentar / Rede"},{"text":"Sie öffnete [[– ihre Hände zitterten –]] den letzten Brief.","why":"Die Beschreibung der Hände unterbricht den sonst zusammenhängenden Handlungssatz.","effect":"Der Einschub verzögert das Öffnen und macht die emotionale Anspannung körperlich sichtbar.","context":"Literarischer Modelltext"}],"effect":"Der Einschub korrigiert eine mögliche Schieflage in der Debatte und lenkt die Aufmerksamkeit auf gleiche Verpflichtungen.","confusion":[["epiphrase","Die Parenthese unterbricht einen Satz; die Epiphrase folgt einem schon vollständigen Satz als Nachtrag."]],"counter":{"text":"Sie öffnet den Brief, weil sie neugierig ist.","why":"Der kausale Nebensatz ist regulär in das Satzgefüge eingebunden, kein eigenständiger parenthetischer Kommentar."},"memory":"Zusatz hinein, Hauptsatz bleibt.","aliases":[],"classExample":"„Ich möchte Ihnen, ich fasse mich ganz kurz, über die Vorgänge berichten.“","exam":"Die Formulierung „Ich möchte Ihnen, ich fasse mich ganz kurz, über die Vorgänge berichten.“ zeigt Parenthese. Der eingeschobene Satz lässt sich herausnehmen; der umgebende Satz bleibt vollständig. Der Sprecher kommentiert nebenbei sein eigenes Vorgehen und wendet sich direkt an das Publikum.","focus":{"cue":"Ein Einschub unterbricht den Satz.","example":"Ich möchte Ihnen, [[ich fasse mich ganz kurz]], über die Vorgänge berichten.","why":"Der eingeschobene Satz lässt sich herausnehmen; der umgebende Satz bleibt vollständig.","effect":"Der Sprecher kommentiert nebenbei sein eigenes Vorgehen und wendet sich direkt an das Publikum.","source":"Foto 9","priority":2}},{"id":"correctio","name":"Correctio","category":"satz","level":3,"material":true,"simple":"Eine Formulierung wird sofort berichtigt oder verstärkt. Man hört dem präziseren Ausdruck beim Entstehen zu.","definition":"Eine Correctio nimmt einen zunächst gewählten Ausdruck zurück und ersetzt ihn ausdrücklich durch einen passenderen, häufig stärkeren.","recognize":"Suche eine erkennbare Selbstkorrektur, etwa „nein“, „besser gesagt“ oder „was sage ich“. Eine bloße Reihe reicht nicht.","examples":[{"text":"Das war gut, [[nein, großartig]].","why":"Der erste Ausdruck wird ausdrücklich durch den stärkeren ersetzt.","effect":"Das Lob gewinnt Nachdruck und wirkt spontan begeistert.","context":"Alltag"},{"text":"Das ist eine Schwierigkeit, [[besser gesagt: ein strukturelles Problem]].","why":"Eine zunächst eher begrenzte Bezeichnung wird zugunsten einer grundsätzlicheren korrigiert.","effect":"Die Korrektur verschiebt die Debatte von einzelnen Pannen zu dauerhaften Ursachen und stützt weitergehende Forderungen.","context":"Kommentar / Rede"},{"text":"Er hatte sie vermisst, [[nein, er hatte sein ganzes Leben auf sie gewartet]].","why":"Die erste Aussage wird ausdrücklich als unzureichend zurückgenommen.","effect":"Die emotionale Reichweite des Gefühls wächst; die Figur erscheint von ihrer Sehnsucht überwältigt.","context":"Literarischer Modelltext"}],"effect":"Die Korrektur verschiebt die Debatte von einzelnen Pannen zu dauerhaften Ursachen und stützt weitergehende Forderungen.","confusion":[["klimax","Die Klimax steigert in einer Folge. Correctio ersetzt einen Ausdruck durch einen anderen."]],"counter":{"text":"Die Aufgabe ist schwierig und zeitaufwendig.","why":"Die zweite Eigenschaft ergänzt die erste, ohne sie zurückzunehmen."},"memory":"Erst gesagt, dann bewusst verbessert.","aliases":["Korrektur"],"classExample":"„Die Schulaufgabe ist schlecht, nein geradezu miserabel ausgefallen.“","exam":"Die Formulierung „Die Schulaufgabe ist schlecht, nein geradezu miserabel ausgefallen.“ zeigt Correctio. „Nein“ korrigiert die erste Bewertung durch eine stärkere. Die Selbstkorrektur steigert den Nachdruck der negativen Bewertung.","focus":{"cue":"Eine Aussage wird ausdrücklich zurückgenommen und verbessert.","example":"Die Schulaufgabe ist schlecht, [[nein geradezu miserabel]] ausgefallen.","why":"„Nein“ korrigiert die erste Bewertung durch eine stärkere.","effect":"Die Selbstkorrektur steigert den Nachdruck der negativen Bewertung.","source":"Foto 4 und Foto 7","priority":1}},{"id":"zeugma","name":"Zeugma","category":"satz","level":4,"material":true,"simple":"Ein Wort gehört gleichzeitig zu zwei Satzteilen, passt aber zu ihnen auf verschiedene Weise. Daraus kann ein überraschender Doppelsinn entstehen.","definition":"Ein Zeugma bezieht ein gemeinsames Satzglied, häufig ein Verb, auf mehrere Glieder, obwohl die Verbindungen semantisch oder syntaktisch unterschiedlich funktionieren.","recognize":"Löse die Verbindungen getrennt auf und prüfe den Bedeutungswechsel. In dieser App steht die semantisch auffällige Form im Vordergrund; der Fachbegriff wird teils weiter verwendet.","examples":[{"text":"Er [[schlug das Fenster und den Weg nach Hause ein]].","why":"„Einschlagen“ bedeutet beim Fenster zerstören, beim Weg eine Richtung wählen. Ein Verb trägt beide Bedeutungen.","effect":"Der unvermittelte Wechsel erzeugt einen sprachlichen Überraschungseffekt.","context":"Alltag"},{"text":"Mit der neuen Regel [[verlor die Schule Geld und ihr Gesicht]].","why":"Geld verlieren ist materiell gemeint; das Gesicht verlieren bedeutet Ansehen verlieren.","effect":"Die Verbindung koppelt finanzielle Folgen an einen Vertrauensverlust und macht die Kritik pointiert.","context":"Kommentar / Rede"},{"text":"Sie [[fasste seinen Arm und neuen Mut]].","why":"Einen Arm fassen meint körperliches Greifen, Mut fassen einen inneren Wandel.","effect":"Die gemeinsame Form verbindet körperliche Nähe und emotionale Stärkung in einem knappen Bild.","context":"Literarischer Modelltext"}],"effect":"Die Verbindung koppelt finanzielle Folgen an einen Vertrauensverlust und macht die Kritik pointiert.","confusion":[["ellipse","Ein gemeinsam genutztes Verb kann als Auslassungsstruktur beschrieben werden. Für das auffällige Zeugma ist der Bedeutungs- oder Konstruktionssprung entscheidend."]],"counter":{"text":"Sie trägt Bücher und Hefte.","why":"„Tragen“ passt zu beiden Objekten in derselben Bedeutung; der charakteristische Sprung fehlt."},"memory":"Ein gemeinsames Wort arbeitet in zwei Bedeutungen.","aliases":[],"classExample":"„Er schlug das Fenster und den Weg zum Bahnhof ein.“","exam":"Die Formulierung „Er schlug das Fenster und den Weg zum Bahnhof ein.“ zeigt Zeugma. „Einschlagen“ bedeutet beim Fenster zerbrechen, beim Weg eine Richtung wählen. Die überraschende Verbindung kann komisch wirken und macht die beiden Bedeutungen sichtbar.","focus":{"cue":"Ein Ausdruck wird mit zwei Teilen in unterschiedlicher Bedeutung verbunden.","example":"Er [[schlug]] [[das Fenster]] und [[den Weg zum Bahnhof]] [[ein]].","why":"„Einschlagen“ bedeutet beim Fenster zerbrechen, beim Weg eine Richtung wählen.","effect":"Die überraschende Verbindung kann komisch wirken und macht die beiden Bedeutungen sichtbar.","source":"Foto 9; handschriftlicher Zusatz","priority":2}},{"id":"epiphrase","name":"Epiphrase","category":"satz","level":4,"material":true,"simple":"Ein Satz scheint schon fertig. Dann folgt noch ein Zusatz, der ihn ergänzt oder anders gewichtet.","definition":"Eine Epiphrase erweitert einen syntaktisch bereits abgeschlossenen Satz durch einen nachgestellten Zusatz.","recognize":"Prüfe, ob vor dem Nachtrag bereits ein vollständiger Satz steht. Verwechsle den Begriff nicht mit einer Epipher.","examples":[{"text":"Ich komme mit [[– aber nur heute]].","why":"„Ich komme mit“ ist vollständig; die zeitliche Einschränkung wird nachgetragen.","effect":"Die zunächst klare Zusage wird nachträglich begrenzt.","context":"Alltag"},{"text":"Die Technik muss allen dienen [[– auch denen ohne eigenes Gerät]].","why":"Der Hauptsatz ist abgeschlossen, bevor die ausdrücklich eingeschlossene Gruppe folgt.","effect":"Der Nachtrag konkretisiert das Wort „allen“ und macht eine sonst leicht übersehene Gruppe sichtbar.","context":"Kommentar / Rede"},{"text":"Er hatte alles zurückgelassen [[– bis auf die Angst]].","why":"Die vollständige Aussage erhält eine nachträgliche Ausnahme.","effect":"Die Korrektur des zunächst umfassenden „alles“ macht die Angst als unentrinnbaren Rest erfahrbar.","context":"Literarischer Modelltext"}],"effect":"Der Nachtrag konkretisiert das Wort „allen“ und macht eine sonst leicht übersehene Gruppe sichtbar.","confusion":[["parenthese","Die Parenthese wird in einen noch laufenden Satz eingeschoben; die Epiphrase schließt an einen schon vollständigen Satz an."],["epipher","Epipher bedeutet Wiederholung am Ende mehrerer Einheiten. Die ähnliche Schreibweise darf nicht täuschen."]],"counter":{"text":"Sie weiß, dass er kommt.","why":"Der Nebensatz ist das reguläre Objekt zu „weiß“, kein nachträglicher Zusatz zu einer schon vollständig bestimmten Aussage."},"memory":"Ein vollständiger Satz bekommt einen Nachtrag.","aliases":[],"classExample":"„Mein Retter seid Ihr und mein Engel.“ Die zweite Bezeichnung kann als nachgetragene Ergänzung verstanden werden.","exam":"Die Formulierung „Mein Retter seid Ihr und mein Engel.“ zeigt Epiphrase. Nach „Mein Retter seid Ihr“ folgt eine zusätzliche Bezeichnung. Der Nachtrag verstärkt die dankbare Verehrung für die angesprochene Person.","focus":{"cue":"Ein scheinbar fertiger Satz erhält einen Nachtrag.","example":"Mein Retter seid Ihr [[und mein Engel]].","why":"Nach „Mein Retter seid Ihr“ folgt eine zusätzliche Bezeichnung.","effect":"Der Nachtrag verstärkt die dankbare Verehrung für die angesprochene Person.","source":"Foto 7","priority":2}},{"id":"klimax","name":"Klimax","category":"satz","level":3,"material":true,"simple":"Mehrere Ausdrücke werden Schritt für Schritt stärker. Die Reihenfolge führt zu einem Höhepunkt.","definition":"Eine Klimax ist eine stufenweise Steigerung semantisch zusammenhängender Ausdrücke oder Aussagen.","recognize":"Benenne den Maßstab der Steigerung, etwa Intensität, Umfang oder Bedeutung. Eine bloße Aufzählung ist nicht genug.","examples":[{"text":"Sie [[flüsterte, sprach, schrie]].","why":"Die Lautstärke steigt in drei Stufen an.","effect":"Der Satz macht eine zunehmende Erregung hörbar vorstellbar.","context":"Alltag"},{"text":"Die Regel trifft [[eine Klasse, die ganze Schule, die gesamte Stadt]].","why":"Der Kreis der Betroffenen wird stufenweise größer.","effect":"Die Steigerung weitet den Blick und begründet, warum das Thema öffentliche Aufmerksamkeit verdient.","context":"Kommentar / Rede"},{"text":"Aus dem Zweifel wurde [[Unruhe, aus Unruhe Furcht, aus Furcht Entsetzen]].","why":"Die Gefühlsstärke nimmt mit jedem Glied zu; die Übergänge wiederholen zugleich das vorherige Schlusswort.","effect":"Die Folge lässt die Angst als sich aufbauenden Prozess erleben und führt auf einen emotionalen Höhepunkt.","context":"Literarischer Modelltext"}],"effect":"Die Steigerung weitet den Blick und begründet, warum das Thema öffentliche Aufmerksamkeit verdient.","confusion":[["hyperbel","Eine Klimax muss nicht übertreiben. „Leise, laut, lauter“ kann sachlich zutreffen."]],"counter":{"text":"Auf dem Tisch liegen Äpfel, Birnen und Pflaumen.","why":"Zwischen den Früchten besteht kein erkennbarer Steigerungsmaßstab."},"memory":"Nicht nur mehrere: in erkennbar steigender Ordnung.","aliases":[],"classExample":"„gut, besser, der Allerbeste“; „bunt, bunter, Stabilo“ ist eine werbliche, spielerisch abgewandelte Steigerung, nicht ohne Kontext zwingend Ironie.","exam":"Die Formulierung „gut, besser, der Allerbeste“ zeigt Klimax. Jedes Glied ist stärker als das vorherige. Die Steigerung führt die positive Bewertung zu einem Höhepunkt.","focus":{"cue":"Eine Reihe steigert sich in Bedeutung, Stärke oder Umfang.","example":"[[gut, besser, der Allerbeste]]","why":"Jedes Glied ist stärker als das vorherige.","effect":"Die Steigerung führt die positive Bewertung zu einem Höhepunkt.","source":"Foto 4 und Foto 7","priority":1}},{"id":"rhetorische-frage","name":"Rhetorische Frage","category":"ansprache","level":2,"material":true,"simple":"Eine Frage wird gestellt, obwohl keine offene Antwort erwartet wird. Sie soll eine bestimmte Antwort nahelegen.","definition":"Eine rhetorische Frage hat die Form einer Frage, dient im Kontext aber vor allem als indirekte Behauptung, Aufforderung oder Bekräftigung.","recognize":"Prüfe die Gesprächssituation: Wird wirklich eine unbekannte Information erfragt oder erscheint die Antwort als bereits feststehend?","examples":[{"text":"Vor einem völlig vollen Rucksack: [[Soll ich etwa noch den Schrank einpacken?]]","why":"Die Frage erwartet keine Packanweisung. Sie behauptet indirekt, dass die Forderung überzogen ist.","effect":"Sie weist die Erwartung zurück und betont die bereits erreichte Grenze.","context":"Alltag"},{"text":"[[Wer möchte in einer Schule lernen, in der niemand zuhört?]]","why":"Die Rede legt „niemand“ als Antwort nahe, statt eine Befragung zu beginnen.","effect":"Die Frage bindet das Publikum an die Forderung nach einer respektvollen Gesprächskultur.","context":"Kommentar / Rede"},{"text":"[[Wozu noch rufen, wenn selbst das Echo ihn verlassen hatte?]]","why":"Der Kontext legt die Aussichtslosigkeit einer weiteren Suche nahe.","effect":"Die Frage lässt die Resignation der Figur als inneren Gedankengang hervortreten.","context":"Literarischer Modelltext"}],"effect":"Die Frage bindet das Publikum an die Forderung nach einer respektvollen Gesprächskultur.","confusion":[["anrede","Eine Anrede benennt die Angesprochenen. Eine rhetorische Frage kann sich an sie richten, muss sie aber nicht ausdrücklich nennen."]],"counter":{"text":"Wann fährt der nächste Bus? Die Person kennt die Abfahrtszeit nicht.","why":"Hier wird wirklich eine fehlende Information gesucht."},"memory":"Frageform, aber keine ergebnisoffene Nachfrage.","aliases":[],"classExample":"„Wer glaubt denn das noch?“","exam":"Die Formulierung „Wer glaubt denn das noch?“ zeigt Rhetorische Frage. Im kritischen Zusammenhang wird nicht nach Namen gefragt, sondern Zweifel ausgedrückt. Die Frage legt nahe, dass die Behauptung unglaubwürdig ist, und wirbt um Zustimmung.","focus":{"cue":"Eine Frage erwartet keine echte Auskunft, sondern legt eine Antwort nahe.","example":"[[Wer glaubt denn das noch?]]","why":"Im kritischen Zusammenhang wird nicht nach Namen gefragt, sondern Zweifel ausgedrückt.","effect":"Die Frage legt nahe, dass die Behauptung unglaubwürdig ist, und wirbt um Zustimmung.","source":"Foto 9","priority":1}},{"id":"anrede","name":"Anrede","category":"ansprache","level":2,"material":true,"simple":"Der Text spricht sein Publikum direkt an. Man merkt, an wen die Worte gerichtet sind.","definition":"Eine Anrede bezeichnet oder adressiert die angesprochene Person oder Gruppe ausdrücklich.","recognize":"Suche Namen, Anredeformeln oder direkte Bezeichnungen des Publikums. Erkläre, welche Beziehung dadurch hergestellt wird.","examples":[{"text":"[[Liebe Lea]], kannst du mir helfen?","why":"Die Angesprochene wird unmittelbar benannt.","effect":"Die Bitte richtet sich persönlich an eine bestimmte Person.","context":"Alltag"},{"text":"[[Liebe Mitschülerinnen und Mitschüler]], diese Entscheidung betrifft uns alle.","why":"Die Rede benennt ihre unmittelbare Zielgruppe.","effect":"Die Anrede schafft einen gemeinsamen Bezugsrahmen und bereitet die Aufforderung zur Beteiligung vor.","context":"Kommentar / Rede"},{"text":"[[Du, meine ferne Schwester]], hörst du das Meer in diesen Zeilen?","why":"Die angesprochene Person ist abwesend; dadurch ist zugleich die speziellere Apostrophe möglich.","effect":"Der direkte Bezug überbrückt sprachlich die räumliche Trennung und macht die Sehnsucht persönlich.","context":"Literarischer Modelltext"}],"effect":"Die Anrede schafft einen gemeinsamen Bezugsrahmen und bereitet die Aufforderung zur Beteiligung vor.","confusion":[["apostrophe","Apostrophe ist die besondere Hinwendung zu Abwesenden, Toten oder nichtmenschlichen Instanzen. Nicht jede gewöhnliche Publikumsanrede ist eine Apostrophe."]],"counter":{"text":"Die Klasse wartet im Raum.","why":"Die Klasse wird erwähnt, aber nicht angesprochen."},"memory":"Über jemanden sprechen ist nicht dasselbe wie jemanden ansprechen.","aliases":[],"classExample":"„Meine Damen und Herren …“; „Mensch Leute, jetzt seid doch mal leise …“","exam":"Die Formulierung „Meine Damen und Herren …“ zeigt Anrede. Die Formulierung richtet sich unmittelbar an das Publikum. Die Anrede stellt Kontakt her und bezieht die Zuhörenden ein.","focus":{"cue":"Lesende oder Zuhörende werden ausdrücklich angesprochen.","example":"[[Meine Damen und Herren]] …","why":"Die Formulierung richtet sich unmittelbar an das Publikum.","effect":"Die Anrede stellt Kontakt her und bezieht die Zuhörenden ein.","source":"Foto 4 und Foto 7","priority":1}},{"id":"ausruf","name":"Ausruf","category":"ansprache","level":2,"material":true,"simple":"Eine Äußerung bringt ein Gefühl besonders deutlich zum Ausdruck. Sie kann Freude, Ärger oder Erstaunen zeigen.","definition":"Ein Ausruf beziehungsweise eine Exclamatio ist eine affektiv hervorgehobene Äußerung, häufig in exklamativer Form und mit Ausrufezeichen.","recognize":"Bestimme das ausgedrückte Gefühl. Ein Ausrufezeichen ist ein Indiz, aber nicht allein die ganze Analyse.","examples":[{"text":"[[Was für ein schöner Tag!]]","why":"Die Äußerung stellt keine Frage, sondern drückt begeisterte Bewertung aus.","effect":"Die Freude wird unmittelbar und lebhaft vermittelt.","context":"Alltag"},{"text":"[[Wie kurzsichtig ist diese Entscheidung!]]","why":"Die exklamative Form drückt starke Kritik aus.","effect":"Der Kommentar setzt eine klare Wertung und fordert das Publikum zur emotionalen Stellungnahme auf.","context":"Kommentar / Rede"},{"text":"[[Endlich, endlich Licht!]]","why":"Die verkürzte Äußerung verbindet Ausruf, Wiederholung und Ellipse.","effect":"Die plötzliche Erleichterung tritt in den Vordergrund; die vorangehende Dunkelheit erscheint als belastend.","context":"Literarischer Modelltext"}],"effect":"Der Kommentar setzt eine klare Wertung und fordert das Publikum zur emotionalen Stellungnahme auf.","confusion":[["imperativ","Imperativ fordert zu einer Handlung auf; Ausruf kann nur ein Gefühl äußern."],["emphase","Emphase hebt einen Ausdruck nachdrücklich hervor. Ein Ausruf ist eine mögliche Form, aber nicht die einzige."]],"counter":{"text":"Heute ist ein schöner Tag.","why":"Die neutrale Feststellung hat ohne weitere Markierung keine ausgeprägte Ausrufform."},"memory":"Gefühl in hervorgehobener Äußerungsform.","aliases":["Exclamatio"],"classExample":"„Ach! Weh uns!“","exam":"Die Formulierung „Ach! Weh uns!“ zeigt Ausruf. Die Ausrufe drücken Klage und Betroffenheit aus. Die Notlage erscheint emotional und dringlich.","focus":{"cue":"Ein Ausruf drückt eine starke Regung aus.","example":"[[Ach! Weh uns!]]","why":"Die Ausrufe drücken Klage und Betroffenheit aus.","effect":"Die Notlage erscheint emotional und dringlich.","source":"Foto 7","priority":2}},{"id":"imperativ","name":"Befehl / Imperativ","category":"ansprache","level":2,"material":true,"simple":"Jemand wird zu einer Handlung aufgefordert. Das kann ein Befehl, aber auch eine Bitte oder ein Rat sein.","definition":"Der Imperativ ist eine grammatische Aufforderungsform. Rhetorisch kann er unter anderem appellieren, anweisen, warnen oder um etwas bitten.","recognize":"Suche auffordernde Verbformen wie „lies“ oder „hört“. Unterscheide die Form von der sozialen Funktion: Nicht jeder Imperativ ist ein schroffer Befehl.","examples":[{"text":"[[Schließ bitte die Tür]].","why":"„Schließ“ ist eine Aufforderungsform; „bitte“ mildert ihren Ton.","effect":"Die angesprochene Person soll unmittelbar handeln, ohne dass der Satz zwingend herrisch wirkt.","context":"Alltag"},{"text":"[[Prüft die Quelle]], bevor ihr die Nachricht teilt.","why":"Der Imperativ weist dem Publikum eine konkrete Handlung zu.","effect":"Der Kommentar übersetzt die Forderung nach Verantwortung in einen überprüfbaren Handlungsschritt.","context":"Kommentar / Rede"},{"text":"[[Bleib]], flüsterte sie, als die Schritte schon verklangen.","why":"Die Aufforderungsform verlangt das Verbleiben einer Person.","effect":"Im leisen, verspäteten Kontext wirkt sie eher wie eine verzweifelte Bitte als wie ein durchsetzbarer Befehl.","context":"Literarischer Modelltext"}],"effect":"Der Kommentar übersetzt die Forderung nach Verantwortung in einen überprüfbaren Handlungsschritt.","confusion":[["ausruf","„Was für ein Tag!“ äußert ein Gefühl, fordert aber keine Handlung."],["rhetorische-frage","Auch eine Frage kann indirekt auffordern. Der Imperativ ist dagegen eine ausdrücklich auffordernde grammatische Form."]],"counter":{"text":"Sie schließt die Tür.","why":"Die Aussage beschreibt eine Handlung und fordert nicht zu ihr auf."},"memory":"Auffordern heißt nicht automatisch befehlen.","aliases":["Befehl","Imperativ","Aufforderung"],"classExample":"„Geh!“","exam":"Die Formulierung „Geh!“ zeigt Befehl / Imperativ. Die Verbform fordert die angesprochene Person unmittelbar zum Handeln auf. Die Aufforderung wirkt direkt; ob sie streng, dringend oder bittend klingt, ergibt sich aus dem Kontext.","focus":{"cue":"Eine Aufforderung steht in der Befehlsform.","example":"[[Geh!]]","why":"Die Verbform fordert die angesprochene Person unmittelbar zum Handeln auf.","effect":"Die Aufforderung wirkt direkt; ob sie streng, dringend oder bittend klingt, ergibt sich aus dem Kontext.","source":"Foto 7","priority":2}},{"id":"emphase","name":"Emphase","category":"ansprache","level":3,"material":true,"simple":"Ein Wort wird besonders nachdrücklich hervorgehoben. Im Text kann das durch Wiederholung, Stellung oder Zuspitzung geschehen.","definition":"Emphase bezeichnet die nachdrückliche Hervorhebung eines Ausdrucks, oft mit einer gegenüber der neutralen Verwendung intensivierten Bedeutung.","recognize":"Benenne das konkret hervorgehobene Wort und das sprachliche Signal. Nicht jede wichtige Aussage ist schon Emphase.","examples":[{"text":"Ich brauche [[Ruhe. Wirklich Ruhe]].","why":"Der zentrale Begriff wird isoliert und ausdrücklich verstärkt wiederholt.","effect":"Das Bedürfnis erhält Nachdruck und soll nicht als beiläufiger Wunsch verstanden werden.","context":"Alltag"},{"text":"Es geht hier um [[Menschen]], nicht um bloße Kennzahlen.","why":"„Menschen“ wird durch den Kontrast zu Kennzahlen mit besonderem ethischen Gewicht aufgeladen.","effect":"Die Hervorhebung verlangt, individuelle Folgen in die Entscheidung einzubeziehen und nicht nur messbare Ergebnisse.","context":"Kommentar / Rede"},{"text":"Ein [[Zuhause]] wollte sie, nicht nur ein Dach.","why":"„Zuhause“ meint emphatisch mehr als eine Unterkunft: Zugehörigkeit und Geborgenheit.","effect":"Die verstärkte Bedeutung macht die emotionale Dimension ihrer Suche sichtbar.","context":"Literarischer Modelltext"}],"effect":"Die Hervorhebung verlangt, individuelle Folgen in die Entscheidung einzubeziehen und nicht nur messbare Ergebnisse.","confusion":[["ausruf","Emphase kann ohne Ausrufezeichen entstehen. Ein Ausruf ist eine bestimmte Äußerungsform."],["repetitio","Wiederholung kann Emphase erzeugen, ist aber nur eines von mehreren möglichen Mitteln."]],"counter":{"text":"Die Tabelle enthält zwanzig Zeilen.","why":"Ohne weitere Markierung ist kein Ausdruck besonders nachdrücklich hervorgehoben."},"memory":"Welches Wort wird wie besonders gewichtig?","aliases":[],"classExample":"„Menschen! Menschen!“ – Nachdruck im Zusammenhang mit der folgenden Wertung.","exam":"Die Formulierung „Menschen! Menschen!“ zeigt Emphase. Die wiederholten Ausrufe rücken das Wort „Menschen“ nachdrücklich ins Zentrum. Im wertenden Zusammenhang kann der Nachdruck eine Forderung an Menschlichkeit verstärken.","focus":{"cue":"Ein Ausdruck wird besonders nachdrücklich hervorgehoben.","example":"[[Menschen! Menschen!]]","why":"Die wiederholten Ausrufe rücken das Wort „Menschen“ nachdrücklich ins Zentrum.","effect":"Im wertenden Zusammenhang kann der Nachdruck eine Forderung an Menschlichkeit verstärken.","source":"Foto 7","priority":2}},{"id":"neologismus","name":"Neologismus","category":"wort","level":3,"material":true,"simple":"Ein neues Wort oder eine neue Wortbedeutung wird gebildet. Damit lässt sich etwas neuartig benennen.","definition":"Ein Neologismus ist eine im jeweiligen sprachgeschichtlichen Kontext neue Wortbildung oder Wortbedeutung; kreative Einmalbildungen werden als okkasionelle Neubildungen genauer unterschieden.","recognize":"Begründe die Neuheit im Entstehungskontext. Ein Wort ist nicht neu, nur weil du es noch nicht kennst.","examples":[{"text":"Nach dem Lernen bin ich im [[Gedankenstauzimmer]].","why":"Das eigens gebildete Kompositum verbindet Gedanken, Stau und Zimmer zu einer neuen Benennung.","effect":"Die Neubildung macht die überfüllte innere Lage spielerisch anschaulich.","context":"Alltag"},{"text":"Wir brauchen keine [[Klickgehorsamkeit]], sondern begründete Entscheidungen.","why":"Der Modelltext bildet das Wort aus „Klick“ und „Gehorsamkeit“.","effect":"Die Wortschöpfung kritisiert unreflektiertes digitales Mitmachen und stellt ihm selbstständiges Denken gegenüber.","context":"Kommentar / Rede"},{"text":"Ein [[Erinnerungsflimmern]] lag über dem verlassenen Garten.","why":"Die neue Zusammensetzung verbindet Erinnerung mit einem flüchtigen optischen Eindruck.","effect":"Die Wortbildung verdichtet eine unsichere, bewegliche Wahrnehmung der Vergangenheit.","context":"Literarischer Modelltext"}],"effect":"Die Wortschöpfung kritisiert unreflektiertes digitales Mitmachen und stellt ihm selbstständiges Denken gegenüber.","confusion":[["archaismus","Archaismus ist im Entstehungskontext veraltet; Neologismus ist neu."],["metapher","Eine Neubildung kann zugleich metaphorisch sein. Neuheit und Übertragung sind verschiedene Merkmale."]],"counter":{"text":"Das heute geläufige Wort „Smartphone“ wird in einem aktuellen Alltagssatz benutzt.","why":"Die frühere Neuheit macht ein längst etabliertes Wort nicht dauerhaft zum aktuellen Neologismus."},"memory":"Neu im damaligen Kontext, nicht nur neu für dich.","aliases":[],"classExample":"„Smombie“; „Wutbürger“. Solche Wörter sind nur im jeweiligen Entstehungskontext neu.","exam":"Die Formulierung „Smombie“ zeigt Neologismus. Das Wort verbindet Bestandteile von „Smartphone“ und „Zombie“. Die Neubildung benennt ein Verhalten knapp und bewertet unaufmerksame Handynutzung kritisch.","focus":{"cue":"Ein Wort ist im Entstehungszusammenhang neu gebildet.","example":"[[Smombie]]","why":"Das Wort verbindet Bestandteile von „Smartphone“ und „Zombie“.","effect":"Die Neubildung benennt ein Verhalten knapp und bewertet unaufmerksame Handynutzung kritisch.","source":"Foto 9","priority":2}},{"id":"archaismus","name":"Archaismus","category":"wort","level":3,"material":true,"simple":"Ein absichtlich alt wirkendes Wort wird verwendet. Es gehört im Entstehungszeitpunkt nicht mehr zum gewöhnlichen Sprachgebrauch.","definition":"Ein Archaismus ist ein zur Entstehungszeit des Textes bereits veralteter sprachlicher Ausdruck oder eine veraltete Form.","recognize":"Bestimme den zeitlichen Bezug. Ein heute alter Text verwendet nicht automatisch Archaismen, wenn seine Sprache damals üblich war.","examples":[{"text":"In einem heutigen Gespräch: „Ich muss jetzt [[hinfort]].“","why":"„Hinfort“ ist gegenüber heutigen alltäglichen Alternativen deutlich altertümlich markiert.","effect":"Die Wortwahl kann scherzhaft feierlich oder bewusst altmodisch wirken.","context":"Alltag"},{"text":"Die Schule ist kein [[Obrigkeitsstaat]]. Wir brauchen keine Befehle nach dem Muster „Ihr [[sollet]] gehorchen“.","why":"Die altertümliche Verbform „sollet“ wird in einer heutigen Kritik bewusst zitiert.","effect":"Der historische Ton verbindet autoritäre Erwartungen mit einem überholten Rollenverständnis.","context":"Kommentar / Rede"},{"text":"Ein [[güldner]] Schein lag auf dem Wasser, schrieb die heutige Erzählerin.","why":"Die ältere Form wird im heutigen Entstehungskontext bewusst statt „goldener“ eingesetzt.","effect":"Sie verleiht der Szene einen märchenhaften, historisierenden Klang.","context":"Literarischer Modelltext"}],"effect":"Der historische Ton verbindet autoritäre Erwartungen mit einem überholten Rollenverständnis.","confusion":[["neologismus","Beide Begriffe sind zeitabhängig, aber in entgegengesetzter Richtung."]],"counter":{"text":"Ein mittelalterlicher Text verwendet ein damals gewöhnliches Wort.","why":"Heute veraltet zu sein genügt nicht: Entscheidend ist der Sprachgebrauch in seiner eigenen Entstehungszeit."},"memory":"Schon damals veraltet, nicht bloß heute alt.","aliases":[],"classExample":"„Wams“; „gülden“. Entscheidend ist jeweils die Entstehungszeit des Textes.","exam":"Die Formulierung „gülden statt golden“ zeigt Archaismus. Die ältere Wortform wird in einem späteren Text bewusst aufgegriffen. Der Ausdruck kann altertümlich, feierlich oder bewusst fremd wirken.","focus":{"cue":"Ein Ausdruck war schon bei Entstehung des Textes veraltet.","example":"[[gülden]] statt golden","why":"Die ältere Wortform wird in einem späteren Text bewusst aufgegriffen.","effect":"Der Ausdruck kann altertümlich, feierlich oder bewusst fremd wirken.","source":"Foto 7","priority":2}},{"id":"onomatopoesie","name":"Onomatopoesie","category":"wort","level":3,"material":true,"simple":"Wörter ahmen Geräusche nach. Ihr Klang erinnert an das, was sie bezeichnen.","definition":"Onomatopoesie beziehungsweise Lautmalerei gestaltet sprachliche Ausdrücke so, dass ihr Lautbild ein bezeichnetes Geräusch nachahmt oder nahelegt.","recognize":"Sprich den Ausdruck aus und benenne das nachgeahmte Geräusch. Ein allgemeiner Gleichklang ist noch keine Lautmalerei.","examples":[{"text":"[[Platsch!]] Der Stein fällt ins Wasser.","why":"Die Lautfolge ahmt das Geräusch des Aufpralls im Wasser nach.","effect":"Das Ereignis wird akustisch unmittelbar vorstellbar.","context":"Alltag"},{"text":"[[Ping, ping, ping]]: Jede Meldung unterbricht den Unterricht.","why":"Das Signalwort bildet die kurzen Benachrichtigungstöne nach.","effect":"Der Kommentar lässt die wiederholte Störung hörbar werden und begründet so den Wunsch nach Ruhephasen.","context":"Kommentar / Rede"},{"text":"Im Ofen [[knisterte und knackte]] das letzte Holz.","why":"Die Lautgestalt der Verben erinnert an kurze trockene Geräusche des Feuers.","effect":"Die Szene gewinnt einen akustischen Hintergrund, der Nähe und körperliche Wahrnehmung vermittelt.","context":"Literarischer Modelltext"}],"effect":"Der Kommentar lässt die wiederholte Störung hörbar werden und begründet so den Wunsch nach Ruhephasen.","confusion":[["alliteration","Gleiche Anfangslaute können melodisch sein, ohne ein konkretes Geräusch nachzuahmen."]],"counter":{"text":"Mia malt Muster.","why":"Die m-Laute wiederholen sich, ahmen aber kein bezeichnetes Geräusch nach."},"memory":"Das Wort lässt ein Geräusch hören.","aliases":["Lautmalerei","Onomatopöie","Onomatopoiie"],"classExample":"„Es knistert und knastert“; „Die Katze miaut.“","exam":"Die Formulierung „Es knistert und knastert.“ zeigt Onomatopoesie. Der Wortklang erinnert an die bezeichneten Geräusche. Die Szene wird akustisch vorstellbar und dadurch sinnlich lebendig.","focus":{"cue":"Ein Wort ahmt einen Laut oder ein Geräusch nach.","example":"Es [[knistert]] und [[knastert]].","why":"Der Wortklang erinnert an die bezeichneten Geräusche.","effect":"Die Szene wird akustisch vorstellbar und dadurch sinnlich lebendig.","source":"Foto 9","priority":2}},{"id":"allusion","name":"Allusion","category":"wort","level":3,"material":true,"simple":"Ein Text spielt auf etwas Bekanntes an, ohne alles zu erklären. Man versteht mehr, wenn man den Bezug erkennt.","definition":"Eine Allusion ist eine indirekte Anspielung auf bekannte Texte, Personen, Ereignisse oder kulturelle Zusammenhänge.","recognize":"Benenne den Bezug und zeige das Textsignal. Eine bloße Ähnlichkeit ohne Anhaltspunkt ist keine sichere Anspielung.","examples":[{"text":"Nach der misslungenen Reparatur: Das war mein [[Waterloo]].","why":"Die Formulierung spielt auf die historisch bekannte Niederlage Napoleons an.","effect":"Die persönliche Niederlage wird durch den bekannten Bezug zugespitzt, oft auch selbstironisch.","context":"Alltag"},{"text":"[[Sein oder online sein]]: So eng dürfen wir die Frage nach Teilhabe nicht stellen.","why":"Die Formulierung verändert die bekannte Shakespeare-Frage „Sein oder Nichtsein“.","effect":"Die Anspielung verleiht der scheinbar alltäglichen Frage kulturelles Gewicht und macht zugleich die falsche Alternative sichtbar.","context":"Kommentar / Rede"},{"text":"Sie wartete auf einen [[Faden durch dieses Labyrinth]].","why":"Die Kombination aus Faden und Labyrinth ruft den Mythos vom Ariadnefaden auf.","effect":"Die Orientierungslosigkeit wird mit einem kulturell bekannten Bild des rettenden Weges verbunden.","context":"Literarischer Modelltext"}],"effect":"Die Anspielung verleiht der scheinbar alltäglichen Frage kulturelles Gewicht und macht zugleich die falsche Alternative sichtbar.","confusion":[["metapher","Eine Allusion setzt einen erkennbaren Bezug zu Vorwissen voraus; eine Metapher kann ohne bestimmten Prätext funktionieren."],["wortspiel","Veränderte bekannte Formulierungen können gleichzeitig Anspielung und Wortspiel sein."]],"counter":{"text":"Er findet einen Faden auf dem Boden.","why":"Ohne weitere Signale ist das keine begründbare Anspielung auf einen Mythos."},"memory":"Bekannter Bezug, nur angedeutet.","aliases":[],"classExample":"„sein Waterloo erleben“","exam":"Die Formulierung „sein Waterloo erleben“ zeigt Allusion. Der Ortsname spielt auf eine bekannte Niederlage an, statt sie ausführlich zu erklären. Die Anspielung lässt einen Misserfolg besonders einschneidend erscheinen, wenn das Bezugswissen vorhanden ist.","focus":{"cue":"Eine bekannte Person, Geschichte oder Begebenheit wird angedeutet.","example":"sein [[Waterloo]] erleben","why":"Der Ortsname spielt auf eine bekannte Niederlage an, statt sie ausführlich zu erklären.","effect":"Die Anspielung lässt einen Misserfolg besonders einschneidend erscheinen, wenn das Bezugswissen vorhanden ist.","source":"Foto 7","priority":2}},{"id":"wortspiel","name":"Wortspiel","category":"wort","level":3,"material":true,"simple":"Mit verschiedenen Bedeutungen oder ähnlichen Klängen wird gespielt. Ein Ausdruck lässt sich überraschend doppelt verstehen.","definition":"Ein Wortspiel nutzt Mehrdeutigkeit, Lautähnlichkeit oder gezielte Veränderung von Wörtern und Wendungen für einen überraschenden Bedeutungswechsel.","recognize":"Erkläre die beiden Lesarten oder die veränderte Vorlage. Nur zu sagen „klingt lustig“ reicht nicht.","examples":[{"text":"Der Bäcker [[kriegt es gebacken]].","why":"Die Wendung bedeutet etwas schaffen und passt zugleich wörtlich zum Backen.","effect":"Der Doppelsinn erzeugt einen leicht verständlichen humorvollen Effekt.","context":"Alltag"},{"text":"Wer Bildung [[abschreibt]], sollte nicht nur an Kopieren denken.","why":"„Abschreiben“ kann Kopieren oder das Aufgeben einer Sache bedeuten.","effect":"Der Bedeutungswechsel lenkt von einer technischen Handlung zur gesellschaftlichen Geringschätzung von Bildung.","context":"Kommentar / Rede"},{"text":"Sie war [[außer sich]], und zum ersten Mal fand sie dort Ruhe.","why":"Die feste Wendung für starke Erregung wird räumlich weitergeführt, als gäbe es ein „dort“ außerhalb des Selbst.","effect":"Die Umdeutung macht eine innere Entfremdung überraschend sichtbar und bricht die gewohnte Redensart auf.","context":"Literarischer Modelltext"}],"effect":"Der Bedeutungswechsel lenkt von einer technischen Handlung zur gesellschaftlichen Geringschätzung von Bildung.","confusion":[["zeugma","Zeugma ist ein bestimmter Bau mit gemeinsamem Satzglied. Ein Wortspiel kann auch ohne diese Konstruktion entstehen."]],"counter":{"text":"Der Bäcker backt ein Brot.","why":"Es liegt nur die wörtliche Bedeutung vor; ein zweiter Sinn wird nicht aktiviert."},"memory":"Zwei Bedeutungen treffen in einer Formulierung zusammen.","aliases":[],"classExample":"„Wer nie vom Weg abkommt, bleibt auf der Strecke!“","exam":"Die Formulierung „Wer nie vom Weg abkommt, bleibt auf der Strecke!“ zeigt Wortspiel. Wörter aus dem Bereich des Gehens werden zugleich in übertragenen Wendungen gebraucht. Der überraschende Doppelsinn macht die Aussage über das Abweichen von Gewohnheiten einprägsam.","focus":{"cue":"Eine Formulierung nutzt Doppelsinn, Wortähnlichkeit oder Wortverdrehung.","example":"Wer nie vom [[Weg]] abkommt, bleibt auf der [[Strecke]]!","why":"Wörter aus dem Bereich des Gehens werden zugleich in übertragenen Wendungen gebraucht.","effect":"Der überraschende Doppelsinn macht die Aussage über das Abweichen von Gewohnheiten einprägsam.","source":"Foto 9","priority":2}},{"id":"synonym","name":"Synonym","category":"wort","level":2,"material":true,"simple":"Zwei Wörter haben dieselbe oder eine sehr ähnliche Bedeutung. Im Zusammenhang können ihre Nuancen trotzdem wichtig sein.","definition":"Synonyme sind Ausdrücke mit gleicher oder ähnlicher Bedeutung; vollständige Austauschbarkeit in allen Kontexten ist selten. Synonymie ist zunächst eine Bedeutungsbeziehung, keine automatische rhetorische Figur.","recognize":"Prüfe, ob die Wörter im konkreten Zusammenhang dasselbe bezeichnen. Beachte Unterschiede in Ton, Wertung und Gebrauch.","examples":[{"text":"Das Licht [[leuchtet]]; anders gesagt: Es [[scheint]].","why":"Die Verben liegen im beschriebenen Kontext semantisch nahe beieinander.","effect":"Der Wechsel kann Wiederholung vermeiden, ohne den Gegenstand zu verändern.","context":"Alltag"},{"text":"Der Entwurf ist [[mutig]], seine Umsetzung [[couragiert]].","why":"Die beiden Adjektive bringen ähnliche positive Bewertungen mit leicht unterschiedlichem Ton zum Ausdruck.","effect":"Die Variation führt die zustimmende Wertung fort, ohne exakt dasselbe Wort zu wiederholen.","context":"Kommentar / Rede"},{"text":"Er [[ging]] durch die Stadt, [[schritt]] über den Platz, [[wanderte]] am Fluss entlang.","why":"Die Verben gehören zum Bereich der Fortbewegung, setzen aber unterschiedliche Nuancen; sie sind nur kontextuell annähernd synonym.","effect":"Die Variation verhindert monotone Wiederholung und differenziert Tempo und Haltung der Bewegung.","context":"Literarischer Modelltext"}],"effect":"Die Variation führt die zustimmende Wertung fort, ohne exakt dasselbe Wort zu wiederholen.","confusion":[["tautologie","Synonyme können eine Tautologie bilden, wenn sie redundant nebeneinander dieselbe Aussage wiederholen. Jeder Synonymwechsel ist aber noch keine Tautologie."]],"counter":{"text":"Hell und dunkel","why":"Die Wörter stehen in einem Gegensatz statt in einer Bedeutungsähnlichkeit."},"memory":"Ähnlicher Sinn heißt nicht immer völlig austauschbar.","aliases":["Synonymie"],"classExample":"„leuchten“ für „scheinen“","exam":"Die Formulierung „leuchten für scheinen“ zeigt Synonym. Die Wörter können in passenden Zusammenhängen eine ähnliche Helligkeitswahrnehmung bezeichnen. Eine passende Wortwahl kann Wiederholungen vermeiden oder eine Bedeutungsnuance betonen.","focus":{"cue":"Ein anderes Wort hat eine gleiche oder ähnliche Bedeutung.","example":"[[leuchten]] für [[scheinen]]","why":"Die Wörter können in passenden Zusammenhängen eine ähnliche Helligkeitswahrnehmung bezeichnen.","effect":"Eine passende Wortwahl kann Wiederholungen vermeiden oder eine Bedeutungsnuance betonen.","source":"Foto 9","priority":2}},{"id":"apostrophe","name":"Apostrophe","category":"ansprache","level":3,"material":true,"simple":"Der Text wendet sich plötzlich an jemanden Abwesenden oder an etwas, das nicht antworten kann. Das darf auch eine Idee sein.","definition":"Eine Apostrophe ist die rhetorische Hinwendung zu Abwesenden, Verstorbenen, Dingen oder abstrakten Instanzen, die als ansprechbar behandelt werden.","recognize":"Prüfe, wer angesprochen wird und ob diese Instanz in der tatsächlichen Kommunikationssituation antworten könnte.","examples":[{"text":"[[O Zeit, bleib kurz stehen!]]","why":"Die abstrakte Zeit wird wie ein ansprechbares Gegenüber angerufen.","effect":"Das unerfüllbare Ansprechen macht den Wunsch nach einer Pause emotional deutlich.","context":"Alltag"},{"text":"[[Zukunft, was werden wir dir hinterlassen?]]","why":"Die Zukunft wird direkt als Gegenüber angesprochen, obwohl sie keine reale Gesprächspartnerin ist.","effect":"Die Rede vergegenwärtigt die Folgen heutiger Entscheidungen und bindet Verantwortung an kommende Generationen.","context":"Kommentar / Rede"},{"text":"[[Du schweigendes Meer, bewahre ihre Namen]].","why":"Ein Naturraum wird angesprochen und erhält die Aufgabe des Erinnerns.","effect":"Die unerwiderbare Anrede macht Trauer und den Wunsch nach bleibendem Gedenken eindringlich.","context":"Literarischer Modelltext"}],"effect":"Die Rede vergegenwärtigt die Folgen heutiger Entscheidungen und bindet Verantwortung an kommende Generationen.","confusion":[["anrede","Die gewöhnliche Anrede richtet sich an das reale Publikum. Apostrophe benennt eine besondere, oft unmögliche Gesprächssituation."],["personifikation","Eine Apostrophe kann personifizieren, wenn Dinge als ansprechbar und handlungsfähig behandelt werden."]],"counter":{"text":"Liebe Zuhörerinnen und Zuhörer, willkommen.","why":"Das ist eine normale Anrede des anwesenden Publikums, nicht die spezifische Apostrophe."},"memory":"Anrede an ein abwesendes oder nicht antwortfähiges Gegenüber.","aliases":[],"classExample":"Handschriftlich bei der Anrede ergänzt. Die einfache Publikumsanrede ist jedoch nicht automatisch eine Apostrophe.","exam":"Die Formulierung „O Hoffnung, bleib bei mir!“ zeigt Apostrophe. Die abstrakte Hoffnung wird direkt angeredet. Eine normale Publikumsanrede allein genügt dafür nicht. Die Anrufung kann den Wunsch nach Hoffnung eindringlich und emotional machen.","focus":{"cue":"Eine besondere Anrede wendet sich etwa an Abwesendes oder Abstraktes.","example":"[[O Hoffnung]], bleib bei mir!","why":"Die abstrakte Hoffnung wird direkt angeredet. Eine normale Publikumsanrede allein genügt dafür nicht.","effect":"Die Anrufung kann den Wunsch nach Hoffnung eindringlich und emotional machen.","source":"Foto 4; handschriftliche Randnotiz, Beispiel zur fachlichen Klärung ergänzt","priority":3}}],"categories":[{"id":"bild","name":"Bilder & Übertragung","short":"Bildsprache"},{"id":"muster","name":"Wiederholung & Muster","short":"Muster"},{"id":"gegensatz","name":"Gegensätze & Widersprüche","short":"Gegensätze"},{"id":"satz","name":"Satzbau & Formulierung","short":"Satzbau"},{"id":"ansprache","name":"Ansprache & Hervorhebung","short":"Ansprache"},{"id":"wort","name":"Wortwahl & Klang","short":"Wortwahl"}],"pairs":[{"id":"anapher--epipher","a":"anapher","b":"epipher","explanation":"Entscheidend ist die Position der identischen Wörter: Anapher am Anfang, Epipher am Ende mehrerer Einheiten. Markiere deshalb zuerst die Einheitsgrenzen.","overlap":"„Wir fordern Zeit. Wir brauchen Zeit.“ enthält sowohl die Anapher „Wir“ als auch die Epipher „Zeit“."},{"id":"metapher--vergleich","a":"metapher","b":"vergleich","explanation":"„Die Bibliothek ist ein Fenster“ überträgt die Bezeichnung. „Die Bibliothek ist wie ein Fenster“ stellt die Beziehung ausdrücklich her. Bestimme jeweils das gemeinsame Merkmal.","overlap":"Ein Vergleich kann innerhalb eines größeren metaphorischen Bildes stehen. „Wie“ allein genügt nicht: „Ich weiß, wie es geht“ ist kein Vergleich."},{"id":"metapher--personifikation","a":"metapher","b":"personifikation","explanation":"Bei der Metapher wird ein Bedeutungsbereich übertragen. Bei der Personifikation werden speziell menschliche Züge auf Nichtmenschliches übertragen.","overlap":"„Die Hoffnung klopft an“ ist präzise Personifikation und zugleich im weiteren Sinn metaphorisch. Die App fragt bei eindeutigen Auswahlaufgaben nach dem hervorgehobenen Merkmal."},{"id":"metapher--allegorie","a":"metapher","b":"allegorie","explanation":"Eine Metapher kann in einer einzelnen Übertragung bestehen. Die Allegorie stellt einen abstrakten Zusammenhang in einer ausdeutbaren Gestalt oder zusammenhängenden Bildhandlung dar.","overlap":"Eine Allegorie verwendet oft mehrere Metaphern und Personifikationen. Länge allein entscheidet nicht."},{"id":"antithese--oxymoron","a":"antithese","b":"oxymoron","explanation":"Antithese stellt Gegensätze gegenüber: „Draußen laut, drinnen still.“ Oxymoron verbindet sie eng: „laute Stille“.","overlap":"Ein Oxymoron kann als besonders verdichteter Gegensatz beschrieben werden. Für genaue Benennung ist die enge Verbindung wichtig."},{"id":"oxymoron--paradoxon","a":"oxymoron","b":"paradoxon","explanation":"Oxymoron: widersprüchliche Wortverbindung. Paradoxon: scheinbar widersprüchlicher Gedanke, dessen Sinn durch Deutung erkennbar wird.","overlap":"Ein paradox wirkender Satz kann ein Oxymoron enthalten. Erkläre, welche Ebene du jeweils untersuchst."},{"id":"parallelismus--chiasmus","a":"parallelismus","b":"chiasmus","explanation":"Parallelismus bewahrt den Bauplan A–B / A–B. Chiasmus kreuzt ihn zu A–B / B–A. Benenne die grammatischen oder semantischen Rollen.","overlap":"Ein längerer Text kann beide Anordnungen enthalten. Ein Gegensatz allein sagt noch nichts über den Bauplan."},{"id":"tautologie--pleonasmus","a":"tautologie","b":"pleonasmus","explanation":"Tautologie wiederholt denselben Inhalt meist durch gleichrangige Wörter: „voll und ganz“. Pleonasmus ergänzt ein bereits enthaltenes Merkmal: „lautlose Stille“.","overlap":"Die Begriffsgrenzen werden in verschiedenen Systematiken nicht ganz einheitlich gezogen. Eine genaue Erklärung der Redundanz ist wichtiger als ein bloßes Etikett."},{"id":"akkumulation--asyndeton","a":"akkumulation","b":"asyndeton","explanation":"Akkumulation beschreibt die Häufung zusammengehörender Einzelbegriffe. Asyndeton beschreibt ihre Verbindung ohne Konjunktionen. Inhalt und Satzform sind verschiedene Ebenen.","overlap":"„Bücher, Hefte, Stifte“ ist sowohl Akkumulation als auch Asyndeton. „Er kam, sah, ging“ ist sicher asyndetisch, aber keine typische Aufzählung von Unterbegriffen."},{"id":"asyndeton--polysyndeton","a":"asyndeton","b":"polysyndeton","explanation":"Asyndeton: „Bücher, Hefte, Stifte“. Polysyndeton: „Bücher und Hefte und Stifte“. Ein normales letztes „und“ macht noch kein Polysyndeton.","overlap":"Beide können eine Akkumulation gliedern. Welche Wirkung entsteht, hängt unter anderem von Satzlänge, Rhythmus und Kontext ab."},{"id":"hyperbel--klimax","a":"hyperbel","b":"klimax","explanation":"Hyperbel übertreibt. Klimax steigert in einer erkennbaren Folge. Frage deshalb einmal nach dem Realitätsmaß und einmal nach der Reihenfolge.","overlap":"„Ich wartete Stunden, Jahre, Ewigkeiten“ kann eine Klimax mit hyperbolischem Schluss sein."},{"id":"euphemismus--litotes","a":"euphemismus","b":"litotes","explanation":"Euphemismus mildert oder beschönigt. Litotes bejaht durch Verneinung des Gegenteils. Die erste Bezeichnung beschreibt vor allem eine Funktion, die zweite ein Formmuster.","overlap":"„Nicht gerade geschickt“ kann als Litotes eine Kritik mildern und dabei euphemistisch wirken. „Personalanpassung“ benötigt keine Verneinung."},{"id":"metonymie--pars-pro-toto","a":"metonymie","b":"pars-pro-toto","explanation":"Metonymie ersetzt durch einen sachlich verbundenen Ausdruck: „Goethe“ steht für Goethes Werk. Pars pro toto ersetzt ausdrücklich das Ganze durch einen Teil: „Klinge“ steht für das Schwert.","overlap":"Beide beruhen nicht auf bloßer Bildähnlichkeit. Prüfe für Pars pro toto die konkrete Teil-Ganzes-Beziehung; diese genaue Benennung reicht hier aus."},{"id":"repetitio--figura-etymologica","a":"repetitio","b":"figura-etymologica","explanation":"Repetitio wiederholt dasselbe sprachliche Element. Figura etymologica verbindet verschiedene Wörter derselben Wortfamilie: „einen Traum träumen“.","overlap":"Beide erzeugen Wiederklänge. Nur gleiche Buchstaben oder zufällig ähnliche Wörter beweisen noch keine gemeinsame Wortfamilie."}],"intro":[],"paths":[],"labs":[],"topics":[],"steps":[{"title":"Material sorgfältig auswerten","text":"Lies alle Materialien. Markiere zentrale Informationen und verschiedene Positionen in unterschiedlichen Farben. Notiere eigene Stichwörter und unterscheide Behauptung, Beleg und Bewertung.","field":"materialsNotes"},{"title":"Eine Position festlegen","text":"Prüfe die Aufgabenstellung: Ist eine Position vorgegeben? Formuliere deine eigene Antwort auf die Leitfrage. Notiere ein starkes Gegenargument und einen möglichen begründeten Umgang damit.","field":"position"},{"title":"Eine Stoffsammlung erstellen","text":"Sammle Aussagen aus allen Materialien mit Materialnummer. Ergänze eigene Überlegungen, ohne sie als belegte Fakten auszugeben.","field":"arguments"},{"title":"Die Stoffsammlung sichten","text":"Wähle vier bis sechs tragfähige Ideen. Prüfe, welche Belege verfügbar sind und welche Punkte sich wiederholen. Kurze Kommentare brauchen eine klare Auswahl.","field":"selection"},{"title":"Einen Schreibplan erstellen","text":"Ordne deine Argumente. Der Unterricht schlägt eine Steigerung vom schwächeren zum stärkeren Argument vor. Ein Kommentar erlaubt auch andere überzeugende Anordnungen. Halte die gewählte Logik fest.","field":"plan"},{"title":"Interesse in der Einleitung wecken","text":"Führe in den Sachverhalt ein und mache deine Position erkennbar. Möglich sind eine konkrete Szene, eine Zuspitzung, eine Frage oder ein korrekt zugeordnetes Zitat. Erfunde keine Zitate.","field":"intro"},{"title":"Den Schluss planen","text":"Bündle deine Position und runde sie pointiert ab. Ein begründeter Appell, ein Ausblick oder die Rückkehr zum Einstiegsbild kann passen. Kein neues Hauptargument erst im Schluss.","field":"ending"}],"checks":["Ich bearbeite die Leitfrage und berücksichtige eine eventuell vorgegebene Position.","Meine Position ist früh erkennbar und bleibt begründet.","Ich nutze alle Materialien und kennzeichne Bezüge mit Materialnummern.","Ich unterscheide Quelleninhalte, eigene Schlussfolgerungen und ungesicherte Annahmen.","Meine Argumente enthalten nachvollziehbare Begründungen und passende Belege.","Ich stelle mindestens ein relevantes Gegenargument fair dar und gehe darauf ein.","Die Reihenfolge ist nachvollziehbar; ich wiederhole nicht bloß dieselbe Aussage.","Meine Stilmittel haben eine konkrete Funktion und passen zu Zielgruppe und Erscheinungsort.","Der Ton ist sachlich, aber klar wertend; Umgangssprache bleibt dosiert.","Ich schreibe überwiegend im Präsens; Vorzeitigkeit kennzeichne ich passend, etwa im Perfekt.","Einleitung und Schluss bilden einen sinnvollen Rahmen.","Ich habe Wortumfang, Satzbau, Rechtschreibung und genaue Zitate kontrolliert."],"corrections":["Die Reihenfolge „zuerst lernen“ folgt den Zuordnungsaufgaben und fett gedruckten Einträgen deiner Fotos. Sie sagt nicht voraus, was die Lehrkraft tatsächlich auswählt. Alle übrigen Tabellenbegriffe bleiben erreichbar.","„Der Einsatz war groß, klein war der Gewinn“ enthält sowohl Chiasmus als auch Antithese. Ein Beispiel kann mehrere Merkmale gleichzeitig haben.","„Wir sind vier Mädchen, wir sind 22 Jungen“ ist parallel gebaut und wiederholt zugleich den Anfang. Anapher und Parallelismus schließen einander nicht aus.","Die handschriftliche Bezeichnung Apostrophe bei einer normalen Anrede wird nicht unbesehen übernommen. Sie bleibt als Randnotiz mit kurzer fachlicher Abgrenzung erhalten.","„Mit Taschenlampen bewaffnet“ ist zunächst bildlich. Eine Übertreibung muss zusätzlich begründet werden. Eine einzelne Schlussformulierung belegt noch keine Epipher; dazu braucht es wiederholte Enden.","Bei Pars pro toto bezeichnet ein Teil das Ganze, nicht automatisch auch die umgekehrte Richtung. Ungewöhnliche Wortstellung und Ironie müssen aus dem Zusammenhang erkennbar sein.","Die 500 Wörter für Schulaufgaben und 800 Wörter für Abiturübungen stehen auf deinem Kommentarblatt. Daraus folgt keine solche Wortzahl für eine 30-Minuten-Kurzarbeit. Hier werden bewusst kurze Absätze geübt."],"sources":[{"title":"Foto 1 · Sieben Planungsschritte","note":"Material auswerten, Position bestimmen, Stoff sammeln, auswählen, ordnen, Einstieg und Schluss planen. Präsens; sachlich, aber nicht neutral."},{"title":"Foto 2 · Zuordnung rhetorischer Mittel","note":"Metapher, Figura etymologica, Parallelismus, Anapher und Epipher mit Unterrichtsbeispielen."},{"title":"Foto 3 · Notizen zum Strandkommentar","note":"Unterschied zur Erörterung, Argumente, Gegenargumente und sprachliche Mittel. Die nicht vorliegende Originalvorlage wird nicht nachgebildet."},{"title":"Foto 4 · Zuordnungsaufgabe","note":"Benennen anhand kurzer Beispiele; handschriftliche Lösungen werden kritisch geprüft."},{"title":"Foto 5 · Checkliste Kommentar","note":"Position, Überschrift, Einleitung, Hauptteil, Schluss, Adressatenbezug und Kennzeichnung aller Materialien."},{"title":"Foto 6 · Stoffsammlung zum gedruckten Buch","note":"Gedrucktes Buch und digitales Lesen, Speicherplatz, Konzentration, kultureller Wert und mögliche Überschriften."},{"title":"Foto 7 · Erste Stilmitteltabelle","note":"Akkumulation bis Klimax. Fettdruck dient als Hinweis für die Lernreihenfolge, nicht als sichere Prüfungsankündigung."},{"title":"Foto 8 · Beispiel einer Einleitung","note":"Zitateinstieg, Hinführung zum Buchthema, Materialverweis. Die dortigen Zahlen werden nicht als aktuelle Marktdaten übernommen."},{"title":"Foto 9 · Zweite Stilmitteltabelle","note":"Litotes bis Zweierfigur sowie der handschriftliche Zusatz Zeugma."}],"recognitionMap":[{"cue":"Gleicher Anfang oder gleiches Ende?","ids":["anapher","epipher"],"rule":"Anfang → Anapher. Ende → Epipher. Nur wiederholter Satzbau → Parallelismus."},{"cue":"Wörter klingen oder gehören zusammen?","ids":["alliteration","figura-etymologica","repetitio"],"rule":"Anfangslaut → Alliteration. Wortfamilie → Figura etymologica. Gleiches Wort → Repetitio."},{"cue":"Ein Bild statt einer wörtlichen Aussage?","ids":["metapher","vergleich","personifikation"],"rule":"Mit „wie“ oder „als“ verbunden → Vergleich. Menschliche Handlung → Personifikation. Sonstige Bildübertragung → Metapher."},{"cue":"Gegensatz oder Widerspruch?","ids":["antithese","oxymoron","paradoxon"],"rule":"Gegensätzliche Seiten → Antithese. Widerspruch in enger Wortverbindung → Oxymoron. Scheinbar widersprüchlicher Gedanke → Paradoxon."},{"cue":"Eine Reihe oder Steigerung?","ids":["akkumulation","asyndeton","polysyndeton","klimax"],"rule":"Einzelbegriffe gesammelt → Akkumulation. Ohne Bindewörter → Asyndeton. Viele Bindewörter → Polysyndeton. Zunehmende Stärke → Klimax."},{"cue":"Satz verkürzt, umgestellt oder ergänzt?","ids":["ellipse","inversion","parenthese","epiphrase"],"rule":"Etwas fehlt → Ellipse. Auffällige Umstellung → Inversion. Einschub → Parenthese. Nachtrag → Epiphrase."},{"cue":"Gleicher oder überkreuzter Bauplan?","ids":["parallelismus","chiasmus"],"rule":"AB – AB → Parallelismus. AB – BA → Chiasmus."},{"cue":"Zu stark, beschönigend oder indirekt?","ids":["hyperbel","euphemismus","litotes","ironie"],"rule":"Übertrieben → Hyperbel. Beschönigend → Euphemismus. Hervorhebung durch Abschwächung oder Verneinung → Litotes. Gegenteilige gemeinte Wertung → Ironie."}],"focusPriorityIds":["metapher","vergleich","personifikation","euphemismus","hyperbel","anapher","epipher","parallelismus","chiasmus","alliteration","figura-etymologica","asyndeton","akkumulation","zweierfigur","antithese","oxymoron","ironie","ellipse","inversion","correctio","klimax","rhetorische-frage","anrede"],"focusVersion":2};});

<script>
/* Pure learning and scoring functions. No browser dependency. */
(function(root,factory){if(typeof module==='object'&&module.exports)module.exports=factory();else root.SMC=factory();})(typeof globalThis!=='undefined'?globalThis:this,function(){
'use strict';
const DAY=86400000;
function fresh(){return {version:1,seen:{},progress:{},history:[],errors:{},confusions:{},exams:[],drafts:{},labs:{},lessons:{},bookmarks:[],settings:{name:'',theme:'light',dailyGoal:10},activeSession:null,activeExam:null,lastRoute:'dashboard'};}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function plain(s){return String(s).replace(/\[\[|\]\]/g,'');}
function highlight(s){return esc(s).replace(/\[\[([\s\S]*?)\]\]/g,'<mark>$1</mark>').replace(/\n/g,'<br>');}
function norm(s){return String(s??'').trim().toLocaleLowerCase('de').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();}
function words(s){return String(s||'').trim().split(/\s+/).filter(x=>/[\p{L}\p{N}]/u.test(x)).length;}
function hash(str){let h=2166136261;for(const c of String(str)){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(arr,seed=Date.now()){const out=[...arr];let x=Number(seed)>>>0;const rnd=()=>{x=(Math.imul(1664525,x)+1013904223)>>>0;return x/4294967296;};for(let i=out.length-1;i>0;i--){let j=Math.floor(rnd()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
function dayKey(ms=Date.now()){let d=new Date(ms);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function tokens(s){let out=[],m;const re=/\S+/gu;while((m=re.exec(s)))out.push({text:m[0],start:m.index,end:m.index+m[0].length});return out;}
function marked(s){let text='',ranges=[],last=0,m;const re=/\[\[([\s\S]*?)\]\]/g;while((m=re.exec(s))){text+=s.slice(last,m.index);const start=text.length;text+=m[1];ranges.push([start,text.length]);last=m.index+m[0].length;}text+=s.slice(last);const tok=tokens(text);return {text,tokens:tok,answer:tok.map((t,i)=>ranges.some(([a,b])=>t.start<b&&t.end>a)?i:null).filter(x=>x!==null)};}
function quoteIndices(text,quote){let start=text.indexOf(quote);if(start<0)return [];let end=start+quote.length;return tokens(text).map((t,i)=>t.start<end&&t.end>start?i:null).filter(x=>x!==null);}
function grade(q,answer){const max=q.points||2;let ratio=0,pending=false,self=false;
 if(q.kind==='write'){
  if(answer&&typeof answer==='object'&&answer.rated&&Array.isArray(answer.rubric)){ratio=answer.rubric.filter(Boolean).length/(q.rubric?.length||6);self=true;}else return {score:0,max,ratio:0,pending:true,self:true};
 }else if(q.kind==='choice'||q.kind==='odd'||q.kind==='error'||q.kind==='effect')ratio=String(answer?.choice??answer??'')===String(q.answer)?1:0;
 else if(q.kind==='input'||q.kind==='gap')ratio=(q.answers||[q.answer]).map(norm).includes(norm(answer))&&norm(answer)!==''?1:0;
 else if(q.kind==='multi') {let a=new Set(Array.isArray(answer)?answer:[]),good=new Set(q.answer),hit=[...a].filter(x=>good.has(x)).length,bad=[...a].filter(x=>!good.has(x)).length;ratio=Math.max(0,(hit-bad)/Math.max(1,good.size));}
 else if(q.kind==='mark'){let a=new Set(Array.isArray(answer)?answer:[]),g=new Set(q.answer),hit=[...a].filter(x=>g.has(x)).length;ratio=2*hit/(a.size+g.size||1);}
 else if(q.kind==='order'){const a=Array.isArray(answer)?answer:[];ratio=q.answer.filter((x,i)=>x===a[i]).length/q.answer.length;}
 else if(q.kind==='match'){let keys=Object.keys(q.answer);ratio=keys.filter(k=>answer&&String(answer[k])===String(q.answer[k])).length/keys.length;}
 return {score:Math.round(Math.min(1,Math.max(0,ratio))*max*2)/2,max,ratio:Math.min(1,Math.max(0,ratio)),pending,self};}
function schedule(prev={},ratio=1,now=Date.now()){
 const p=Number.isFinite(prev.interval)?prev.interval:0;let interval;
 if(ratio<.5)interval=10/1440;
 else if(ratio<.8)interval=1;
 else if(p<1)interval=1;
 else if(p<3)interval=3;
 else interval=Math.min(90,Math.round(p*(ratio>=.95?2.2:1.5)));
 return {...prev,interval,due:now+interval*DAY,last:now,lapses:(prev.lapses||0)+(ratio<.5?1:0)};
}
function record(s,event){
 if(!event||!event.id||s.history.some(e=>e.id===event.id))return false;
 const e={...event,at:event.at??Date.now(),ratio:Math.max(0,Math.min(1,event.ratio||0))};s.history.push(e);if(s.history.length>15000)s.history.splice(0,s.history.length-15000);
 if(e.term){s.seen[e.term]=s.seen[e.term]||e.at;s.progress[e.term]=schedule(s.progress[e.term],e.ratio,e.at);}
 if(e.qid&&!e.self){if(e.ratio<.8&&e.question)s.errors[e.qid]={question:e.question,at:e.at,term:e.term,answer:e.answer,ratio:e.ratio};else if(e.ratio>=.8)delete s.errors[e.qid];}
 if(e.selectedTerm&&e.term&&e.selectedTerm!==e.term&&!e.self){let k=e.term+'|'+e.selectedTerm;s.confusions[k]=(s.confusions[k]||0)+1;}
 return true;
}
function historyFor(s,id){return s.history.filter(e=>e.term===id&&!e.self);}
function mastery(s,id){const es=historyFor(s,id).slice(-12);if(!es.length)return s.seen[id]?1:0;const avg=es.reduce((a,e)=>a+e.ratio,0)/es.length;
 const hard=es.filter(e=>e.level>=3&&e.ratio>=.8),days=new Set(hard.map(e=>dayKey(e.at)));
 if(es.length>=8&&avg>=.85&&hard.length>=3&&days.size>=2)return 3;
 if(es.length>=5&&avg>=.75)return 2;return 1;
}
function level(s){const es=s.history.filter(e=>!e.self),distinct=new Set(es.map(e=>e.term).filter(Boolean)).size;const ratio=es.length?es.reduce((a,e)=>a+e.ratio,0)/es.length:0;
 if(es.length>=100&&distinct>=30&&ratio>=.8&&es.filter(e=>e.level>=3&&e.ratio>=.8).length>=20)return 4;
 if(es.length>=40&&distinct>=15&&ratio>=.7)return 3;
 if(es.length>=12&&distinct>=5&&ratio>=.6)return 2;return 1;
}
function stats(s,now=Date.now()){
 const es=s.history.filter(e=>!e.self),sum=es.reduce((a,e)=>a+e.ratio,0);let today=dayKey(now);const days=new Set(s.history.map(e=>dayKey(e.at)));let streak=0,d=new Date(now);if(!days.has(today))d.setDate(d.getDate()-1);for(let n=0;n<3650&&days.has(dayKey(d.getTime()));n++){streak++;d.setDate(d.getDate()-1);}
 return {attempts:es.length,correct:es.filter(e=>e.ratio>=.999).length,accuracy:es.length?Math.round(sum/es.length*100):0,seen:Object.keys(s.seen).length,secure:Object.keys(s.seen).filter(id=>mastery(s,id)===3).length,due:Object.values(s.progress).filter(p=>p.due<=now).length,today:s.history.filter(e=>dayKey(e.at)===today).length,streak};
}
function modeStats(s){const groups={};for(const e of s.history){if(e.self)continue;let mode=e.question?.mode||e.mode||'mixed';let g=groups[mode]||(groups[mode]={mode,attempts:0,sum:0});g.attempts++;g.sum+=e.ratio;}return Object.values(groups).map(g=>({mode:g.mode,attempts:g.attempts,accuracy:Math.round(g.sum/g.attempts*100)})).sort((a,b)=>a.accuracy-b.accuracy||b.attempts-a.attempts);}
function recommendation(s,terms,now=Date.now()){
 const due=terms.filter(t=>s.progress[t.id]?.due<=now).sort((a,b)=>s.progress[a.id].due-s.progress[b.id].due);
 if(due.length)return {type:'due',title:`${due.length} Wiederholungen sind fällig`,text:'Diese Begriffe sind nach deinem letzten Ergebnis wieder an der Reihe.',terms:due.map(t=>t.id)};
 const errs=Object.values(s.errors);if(errs.length)return {type:'mistakes',title:'Aus Fehlern sichere Kriterien machen',text:`${errs.length} Aufgaben warten im Fehlertraining auf einen neuen Versuch.`,terms:[...new Set(errs.map(e=>e.term))]};
 const next=terms.filter(t=>!s.seen[t.id]).sort((a,b)=>a.level-b.level).slice(0,5);
 if(next.length)return {type:'new',title:s.history.length?'Dein nächster Lernschritt':'Beginne mit Sprache, die wirkt',text:s.history.length?'Erweitere dein Repertoire mit diesen noch unbekannten Mitteln.':'Der Einstieg erklärt Bilder, Wiederholungen und Wirkung ohne Vorwissen.',terms:next.map(t=>t.id)};
 return {type:'review',title:'Wissen in einen Text übertragen',text:'Alle Begriffe sind geöffnet. Prüfe jetzt deine Belege und Wirkungsdeutungen im Textlabor.',terms:terms.filter(t=>mastery(s,t.id)<3).slice(0,8).map(t=>t.id)};
}
function validate(input){
 if(!input||typeof input!=='object'||Array.isArray(input)||input.version!==1)throw Error('Unbekanntes oder beschädigtes Dateiformat.');
 let count=0;function walk(x,depth=0){if(depth>18)throw Error('Daten sind zu tief verschachtelt.');if(++count>250000)throw Error('Datensatz ist zu groß.');if(typeof x==='string'&&x.length>250000)throw Error('Textfeld ist zu groß.');if(x&&typeof x==='object')for(const k of Object.keys(x)){if(['__proto__','constructor','prototype'].includes(k))throw Error('Unzulässiger Datenbestandteil.');walk(x[k],depth+1);}}walk(input);
 const result=fresh();for(const k of ['seen','progress','errors','confusions','drafts','labs','lessons','settings']){if(input[k]===undefined||!input[k]||typeof input[k]!=='object'||Array.isArray(input[k]))throw Error('Fehlendes oder ungültiges Feld: '+k);result[k]=input[k];}
 for(const k of ['history','exams','bookmarks']){if(!Array.isArray(input[k]))throw Error('Ungültige Liste: '+k);result[k]=input[k];}
 if(input.history.length>15000||input.exams.length>500)throw Error('Zu viele gespeicherte Einträge.');
 for(const e of input.history){if(!e||typeof e.id!=='string'||!Number.isFinite(e.at)||!Number.isFinite(e.ratio)||e.ratio<0||e.ratio>1)throw Error('Ungültiger Lerneintrag.');}
 for(const p of Object.values(input.progress)){if(!p||!Number.isFinite(p.due)||!Number.isFinite(p.interval)||p.interval<0)throw Error('Ungültiger Wiederholungsplan.');}
 for(const v of Object.values(input.seen))if(!Number.isFinite(v))throw Error('Ungültiger Lernzeitpunkt.');
 const obj=x=>x&&typeof x==='object'&&!Array.isArray(x);
 const strings=(x,keys)=>keys.every(k=>x[k]===undefined||typeof x[k]==='string');
 const bools=x=>Array.isArray(x)&&x.every(v=>typeof v==='boolean'||v===null);
 const indices=x=>Array.isArray(x)&&x.every(v=>Number.isInteger(v)&&v>=0);
 const question=q=>obj(q)&&typeof q.id==='string'&&typeof q.prompt==='string'&&['choice','input','gap','odd','error','effect','write','mark','order','match','multi'].includes(q.kind)&&Number.isFinite(q.points)&&q.points>0&&Array.isArray(q.terms)&&q.terms.every(t=>typeof t==='string');
 for(const d of Object.values(input.drafts)){
  if(!obj(d)||!strings(d,['title','position','materialsNotes','arguments','selection','plan','intro','body','ending'])||!bools(d.checks)||!Array.isArray(d.annotations))throw Error('Ungültiger Kommentarentwurf.');
  for(const a of d.annotations)if(!obj(a)||typeof a.term!=='string'||typeof a.quote!=='string'||!Number.isInteger(a.start)||!Number.isInteger(a.end))throw Error('Ungültige Kommentarmarkierung.');
 }
 for(const l of Object.values(input.labs)){
  if(!obj(l)||!Array.isArray(l.annotations)||!strings(l,['analysis'])||(l.criteria!==undefined&&!bools(l.criteria)))throw Error('Ungültige Textanalyse.');
  for(const a of l.annotations)if(!obj(a)||!indices(a.indices)||typeof a.term!=='string'||!strings(a,['effect','fn']))throw Error('Ungültiger Textbefund.');
  if(l.pending&&(!obj(l.pending)||!indices(l.pending.indices)||!strings(l.pending,['term','effect','fn'])))throw Error('Ungültige Textauswahl.');
 }
 for(const ex of input.exams)if(!obj(ex)||typeof ex.id!=='string'||!Number.isFinite(ex.finishedAt)||!Array.isArray(ex.questions)||!ex.questions.every(question)||!obj(ex.answers)||!obj(ex.results))throw Error('Ungültige Prüfung.');
 for(const er of Object.values(input.errors))if(!obj(er)||!question(er.question))throw Error('Ungültiger Fehlerspeicher.');
 for(const n of Object.values(input.confusions))if(!Number.isInteger(n)||n<0)throw Error('Ungültiger Fehlerzähler.');
 for(const l of Object.values(input.lessons))if(!obj(l)||typeof l.done!=='boolean')throw Error('Ungültiger Lektionsstatus.');
 if(!input.bookmarks.every(x=>typeof x==='string'))throw Error('Ungültige Merkliste.');
 result.settings={...fresh().settings,...input.settings};result.settings.name=String(result.settings.name||'').slice(0,80);result.settings.dailyGoal=Math.max(1,Math.min(100,Number(result.settings.dailyGoal)||10));
 result.settings.theme=['light','dark'].includes(result.settings.theme)?result.settings.theme:'light';
 result.lastRoute=typeof input.lastRoute==='string'?input.lastRoute:'dashboard';
 // Imported sessions are deliberately cleared. Progress, drafts and finished exams remain.
 result.activeExam=null;result.activeSession=null;return result;
}
return {DAY,fresh,esc,plain,highlight,norm,words,hash,shuffle,dayKey,tokens,marked,quoteIndices,grade,schedule,record,mastery,level,stats,modeStats,recommendation,validate};
