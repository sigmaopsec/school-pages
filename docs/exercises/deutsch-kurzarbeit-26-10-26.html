<script>
(function(){'use strict';const S=window.SM,{D,C,Q,e,icon,button,pageTop,tag,progress,empty}=S;
const configHTML=()=>`<div class="card training-config"><label class="field">Lernstufe<select id="training-level">${['Absoluter Anfänger','Grundlagen','Fortgeschritten','Prüfungsniveau'].map((s,i)=>`<option value="${i+1}" ${S.ui.trainingLevel===i+1?'selected':''}>${i+1} · ${s}</option>`).join('')}</select></label><label class="field">Umfang<select id="training-count">${[5,10,20,40].map(n=>`<option value="${n}" ${S.ui.count===n?'selected':''}>${n} Aufgaben</option>`).join('')}</select></label><label class="field config-category">Stoffauswahl<select id="training-category"><option value="">Alle Kategorien</option>${D.categories.map(c=>`<option value="${c.id}" ${S.ui.trainingCategory===c.id?'selected':''}>${e(c.short)}</option>`).join('')}</select></label>${button('Training starten','start-training')}${S.ui.mode==='cards'?`<label class="field config-category">Kartenrichtung<select id="card-mode"><option value="term">Begriff → Definition</option><option value="definition" ${S.ui.cardMode==='definition'?'selected':''}>Definition → Begriff</option><option value="example" ${S.ui.cardMode==='example'?'selected':''}>Beispiel → Begriff</option><option value="effect" ${S.ui.cardMode==='effect'?'selected':''}>Begriff → mögliche Wirkung</option></select></label>`:''}</div>`;
S.views.training=function(){const mode=Q.modes.find(x=>x.id===S.ui.mode);return pageTop('DEIN TRAININGSRAUM','Aus Wiedererkennen wird Wissen.','Wähle einen Modus. Deine Fehler und fälligen Wiederholungen beeinflussen, welche Aufgaben zuerst kommen.')+`${S.state.activeSession&&!S.state.activeSession.completed?`<div class="info mb row between wrap"><span>Übungsrunde in dieser Sitzung: ${S.state.activeSession.index+1} von ${S.state.activeSession.questions.length}.</span>${button('Runde fortsetzen','navigate','data-route="session"','secondary small')}</div>`:''}<div class="row between mb"><h2 class="no-margin">${e(mode.name)}</h2>${tag(S.ui.mode==='mistakes'?Object.keys(S.state.errors).length+' offene Fehler':Q.bank().length+' Aufgaben im Gesamtbestand')}</div>${configHTML()}<div class="grid three">${Q.modes.map(m=>`<button type="button" class="card clickable mode-card ${S.ui.mode===m.id?'selected':''}" data-action="choose-mode" data-mode="${m.id}" aria-pressed="${S.ui.mode===m.id}"><span class="letter">MODUS ${m.letter}</span><div class="mode-icon">${icon(m.icon)}</div><h3>${m.name}</h3><p>${m.desc}</p></button>`).join('')}</div><div class="info mt">Freie Formulierungen erhalten eine Musterlösung und ein Kriterienraster. Nur Aufgaben mit hinterlegter objektiver Lösung zählen zur Trefferquote. Schwierig bedeutet hier nicht nur mehr Fachwörter, sondern präzisere Belege und kontextbezogene Deutung.</div>`;};
S.startSession=function(config){let mode=config.mode||'mixed',level=Number(config.level)||2,count=Number(config.count)||10;let questions;
if(mode==='cards'){const ts=D.terms.filter(t=>(!config.terms?.length||config.terms.includes(t.id))&&(!config.categories?.length||config.categories.includes(t.category))&&t.level<=Math.max(2,level));questions=C.shuffle(ts,Date.now()).sort((a,b)=>(S.state.progress[b.id]?.due<=Date.now()?1:0)-(S.state.progress[a.id]?.due<=Date.now()?1:0)).slice(0,count).map(t=>({id:'card:'+t.id,kind:'flashcard',term:t.id,level:t.level}));}
else questions=Q.select({...config,level,count,modes:[mode]},S.state);
if(!questions.length){S.toast(mode==='mistakes'?'Es sind keine offenen Fehler gespeichert. Wähle einen anderen Modus.':'Für diese Kombination gibt es keine Aufgaben. Wähle eine höhere Stufe oder eine andere Kategorie.');return;}
S.state.activeSession={id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),mode,level,questions,index:0,answers:{},feedbacks:{},models:{},startedAt:Date.now(),lessonId:config.lessonId||null,cardMode:S.ui.cardMode||'term',cardBack:false,completed:false};S.ui.matchLeft=null;S.save();S.go('session');if(questions.length<count)S.toast(`Diese Auswahl enthält ${questions.length} unterschiedliche Aufgaben. Die Runde wurde entsprechend angepasst.`);};
function active(ctx){return ctx==='exam'?S.state.activeExam:S.state.activeSession;}
function current(ctx){const s=active(ctx);return s?.questions[s.index];}
function answerPresent(q,a){if(q.kind==='write')return !!a?.text?.trim();if(q.kind==='order'||q.kind==='multi'||q.kind==='mark')return Array.isArray(a)&&a.length>0;if(q.kind==='match')return a&&Object.keys(a).length>0;if(q.kind==='odd')return !!a?.choice;return a!==undefined&&a!==null&&String(a).trim()!=='';}
S.answerPresent=answerPresent;
function setAnswer(ctx,val){const s=active(ctx),q=current(ctx);if(!s||!q)return;if(ctx!=='exam'&&s.feedbacks[q.id])return;s.answers[q.id]=val;if(ctx==='exam'&&s.feedbacks)s.feedbacks[q.id]=null;S.save();}
S.questionHTML=function(q,answer,ctx='train',feedback=null){let locked=!!feedback&&ctx!=='exam';const multi=q.kind==='multi',sel=Array.isArray(answer)?answer:[],pick=answer?.choice??answer;let input='';const attr=`data-context="${ctx}"`;
if(['choice','multi','odd','effect','error'].includes(q.kind))input=`<div class="answer-list">${q.options.map((o,i)=>{let selected=multi?sel.includes(o.value):String(pick??'')===String(o.value),correct=feedback&&(multi?q.answer.includes(o.value):q.answer===o.value),wrong=feedback&&selected&&!correct;return `<button type="button" class="answer-option ${selected?'selected':''} ${correct?'correct':''} ${wrong?'incorrect':''}" data-action="answer-option" ${attr} data-value="${e(o.value)}" aria-pressed="${selected}" ${locked?'disabled':''}><span class="option-letter">${multi?(selected?'✓':'○'):String.fromCharCode(65+i)}</span><span>${e(o.label)}</span></button>`;}).join('')}</div>${q.kind==='odd'?`<label class="field mt">Deine Begründung <span class="small muted">Wird mit der Musterbegründung verglichen, nicht automatisch sprachlich bewertet.</span><textarea id="odd-reason" data-input="odd-reason" ${attr} ${locked?'disabled':''} placeholder="Das Beispiel passt nicht, weil …">${e(answer?.reason||'')}</textarea></label>`:''}`;
else if(q.kind==='input'||q.kind==='gap')input=`<label class="field">Deine Antwort<input id="q-answer" class="answer-input" autocomplete="off" spellcheck="false" data-input="q-input" ${attr} value="${e(answer||'')}" ${locked?'disabled':''} placeholder="Fachbegriff eingeben"></label>`;
else if(q.kind==='mark'){input=`<p class="token-note">Wörter antippen oder mit Tab und Leertaste auswählen. Erneutes Antippen entfernt die Auswahl.</p><div class="word-area" aria-label="Wörter zum Markieren">${C.tokens(q.text).map((t,i)=>`<button type="button" class="word-token ${sel.includes(i)?'selected':''} ${feedback&&q.answer.includes(i)?'solution':''} ${feedback&&sel.includes(i)&&!q.answer.includes(i)?'missed':''}" data-action="mark-word" ${attr} data-index="${i}" aria-pressed="${sel.includes(i)}" ${locked?'disabled':''}>${e(t.text)}</button> `).join('')}</div><span class="small muted">${sel.length} Wörter ausgewählt</span>`;}
else if(q.kind==='order'){let chosen=Array.isArray(answer)?answer:[],left=C.shuffle(q.items,C.hash(q.id)).filter(x=>!chosen.includes(x.value));input=`<p class="small muted">Tippe Bausteine in der gewünschten Reihenfolge an. In der Lösungszeile kannst du sie wieder entfernen.</p><div class="order-zone" aria-label="Deine Reihenfolge">${chosen.map((v,i)=>`<button class="chip active" data-action="remove-order" data-index="${i}" ${attr} ${locked?'disabled':''}>${e(q.items.find(x=>x.value===v)?.label)} ×</button>`).join('')||'<span class="small muted">Hier entsteht dein Satz.</span>'}</div><div class="row wrap">${left.map(x=>button(e(x.label),'add-order',`${attr} data-value="${x.value}" ${locked?'disabled':''}`,'secondary')).join('')}</div>`;}
else if(q.kind==='match'){let a=answer||{},leftChosen=S.ui.matchLeft;input=`<div class="match-grid"><div class="match-col">${q.left.map((x,i)=>`<button class="match-item ${leftChosen===x.value?'selected':''} ${a[x.value]?'connected':''}" data-action="match-left" ${attr} data-value="${x.value}" ${locked?'disabled':''}><b>${i+1}.</b> ${e(x.label)}${a[x.value]?`<br><span class="tag green">${e(Q.by[a[x.value]]?.name||a[x.value])}</span>`:''}</button>`).join('')}</div><div class="match-col">${C.shuffle(q.right,C.hash(q.id)).map(x=>`<button class="match-item ${Object.values(a).includes(x.value)?'connected':''}" data-action="match-right" ${attr} data-value="${x.value}" ${locked?'disabled':''}>${e(x.label)}</button>`).join('')}</div></div><p class="small muted mt-small">${Object.keys(a).length} von ${q.left.length} Paaren verbunden. Eine neue Zuordnung ersetzt die vorherige.</p>`;}
else if(q.kind==='write'){let s=active(ctx),reveal=(ctx==='train'&&s?.models?.[q.id])||!!feedback;input=`<label class="field">Dein Text<textarea id="q-free" data-input="q-input" ${attr} rows="8" ${locked?'disabled':''} placeholder="Formuliere zuerst selbst. Die Musterlösung bleibt bis zur Kontrolle verborgen.">${e(answer?.text||'')}</textarea></label><p class="small muted" id="q-wordcount">${C.words(answer?.text||'')} Wörter · keine automatische Inhaltsbewertung</p>${reveal?`<details open class="mt"><summary>Musterlösung</summary><p style="white-space:pre-line">${e(q.model)}</p></details><div class="info mt-small">Dies ist eine Selbstkontrolle. Setze nur Kriterien, die dein Text tatsächlich erfüllt. Die Anwendung versteht deine freie Antwort nicht automatisch.</div><div class="criteria">${q.rubric.map((r,i)=>`<label class="check"><input type="checkbox" data-change="q-rubric" ${attr} data-index="${i}" ${answer?.rubric?.[i]?'checked':''} ${locked?'disabled':''}>${e(r)}</label>`).join('')}</div>`:''}`;}
return `<section class="card question-card"><div class="row between wrap mb">${tag(q.kind==='write'?'OFFENE AUFGABE · SELBSTKONTROLLE':q.kind==='multi'?'MEHRFACHAUSWAHL':q.kind==='mark'?'WORTMARKIERUNG':q.kind==='match'?'PAARE ZUORDNEN':'WISSEN ANWENDEN',q.kind==='write'?'purple':'')}<span class="small muted">${q.points} Punkte</span></div><h2>${e(q.prompt)}</h2>${q.text&&q.kind!=='mark'?`<div class="question-text ${q.text.length>430?'long':''}">${e(q.text)}</div>`:''}${input}${ctx==='train'&&active(ctx)?.level<4&&!feedback&&active(ctx)?.mode!=='hard'&&q.hint?`<details class="hint"><summary>Einen Hinweis anzeigen</summary><p>${e(q.hint)}</p></details>`:''}${feedback?S.feedbackHTML(q,feedback):''}</section>`;};
S.feedbackHTML=function(q,f){const g=f.grade||f;return `<div class="feedback ${g.pending?'partial':g.ratio>=.8?'':g.ratio>0?'partial':'bad'}" role="status"><h3>${g.pending?'Noch nicht bewertet':g.self?'Deine Selbstkontrolle':g.ratio===1?'Richtig begründet.':g.ratio>=.8?'Weitgehend richtig.':g.ratio>0?'Ein Teil stimmt bereits.':'Hier lohnt sich ein genauer Blick.'} ${!g.pending?`<span class="small">${g.score} / ${g.max} Punkte</span>`:''}</h3>${q.marked?`<div class="answer-quote">${C.highlight(q.marked)}</div>`:''}<p>${e(q.explanation)}</p>${['input','gap'].includes(q.kind)?`<p><b>Gesuchter Begriff:</b> ${e(q.answers[0])}</p>`:''}${q.kind==='multi'?`<p><b>Passend:</b> ${q.answer.map(id=>e(Q.by[id]?.name||id)).join(', ')}.</p><p class="small">Je richtiges Ziel ein Anteil; jedes falsche zusätzliche Kreuz zieht einen solchen Anteil ab. Mindestens 0 Punkte.</p>`:''}${q.kind==='mark'?'<p class="small">Teilpunkte beruhen auf der Übereinstimmung der ausgewählten und hinterlegten Wörter (F1). Fehlende und zu viele Wörter senken die Übereinstimmung; gerundet wird auf halbe Punkte.</p>':''}${q.kind==='order'?`<p><b>Eine Lösung gemäß Vorgabe:</b> ${q.answer.map(v=>e(q.items.find(x=>x.value===v)?.label)).join(' ')}</p>`:''}${q.kind==='match'?`<p>${q.left.map(x=>`${Number(x.value)+1} → ${e(Q.by[q.answer[x.value]]?.name||q.answer[x.value])}`).join(' · ')}</p>`:''}${!g.self&&g.ratio<.8?`<div class="info mt-small"><b>Für den nächsten Versuch:</b> ${e(Q.by[q.term]?.recognize||'Prüfe zunächst die sprachliche Form, dann die Bedeutung.')}</div>`:''}</div>`;};
S.recordQuestion=function(q,answer,g,id,mode){if(g.pending)return;const event={id,term:q.term,mode,ratio:g.ratio,self:!!g.self,level:q.level,at:Date.now(),qid:q.id,question:q,answer,selectedTerm:typeof answer==='string'&&Q.by[answer]?answer:undefined};C.record(S.state,event);};
S.views.session=function(){const s=S.state.activeSession;if(!s)return pageTop('TRAINING','Starte deine nächste Runde.','Noch keine aktive Übung.')+button('Training auswählen','navigate','data-route="training"');if(s.completed)return sessionResult(s);if(s.mode==='cards')return flashcards(s);
let q=s.questions[s.index],a=s.answers[q.id],f=s.feedbacks[q.id];const m=Q.modes.find(m=>m.id===s.mode);
return `<div class="question-frame"><a class="back" href="#training">${icon('back')} Trainingsübersicht · Runde bleibt bis zum Neuladen erhalten</a><div class="question-top"><div class="row between"><div><span class="eyebrow">${e(m?.name||'Lerncheck')}</span><h2 class="mt-small no-margin">Aufgabe ${s.index+1} von ${s.questions.length}</h2></div>${tag('Stufe '+s.level,'green')}</div>${progress(s.index/s.questions.length*100)}</div>${S.questionHTML(q,a,'train',f)}<div class="question-actions"><span class="small muted">${q.kind==='write'?'Selbstkontrolle, keine KI-Note':'Antworten bleiben nur bis zum Neuladen.'}</span>${f?button((s.index+1===s.questions.length?'Runde auswerten':'Nächste Aufgabe')+' '+icon('arrow'),'next-question'):q.kind==='write'&&!s.models[q.id]?button('Muster und Kriterien ansehen','show-model'):button(q.kind==='write'?'Selbstkontrolle speichern':'Antwort prüfen','check-answer')}</div></div>`;};
function sessionResult(s){let fs=Object.values(s.feedbacks),auto=fs.filter(f=>!f.grade.self),self=fs.filter(f=>f.grade.self),score=auto.reduce((a,f)=>a+f.grade.score,0),max=auto.reduce((a,f)=>a+f.grade.max,0),ratio=max?score/max:0;let lesson=s.lessonId&&S.state.lessons[s.lessonId];return `<div class="question-frame">`+pageTop('RUNDE ABGESCHLOSSEN',s.mode==='cards'?'Abrufen statt nur überfliegen.':'Ein Schritt sicherer.',s.mode==='cards'?'Deine Selbsteinschätzungen haben die nächsten Wiederholungstermine angepasst.':'Die Auswertung trennt objektiv geprüfte Antworten und deine Selbstkontrollen.')+`<div class="card mb"><div class="row between wrap"><div><span class="eyebrow">${max?'OBJEKTIV GEPRÜFT':'SELBST EINGESCHÄTZT'}</span><div class="result-score">${max?Math.round(ratio*100)+' %':fs.length}<small>${max?' · '+score+' / '+max+' Punkte':' Karten / Aufgaben'}</small></div></div>${icon('award')}</div><p class="small muted">${self.length?self.length+' Aufgaben mit Selbstkontrolle. Diese zählen nicht zur objektiven Trefferquote.':'Keine Schulnote, sondern Rückmeldung zu dieser Übungsrunde.'}</p>${lesson?.done?'<div class="info good">Lerncheck bestanden. Der Lernpfad wurde aktualisiert.</div>':s.lessonId?'<div class="info warning">Für den Abschluss dieser Lektion sind 70 % im objektiven Lerncheck erforderlich. Wiederhole die unsicheren Merkmale und versuche es erneut.</div>':''}<div class="row wrap mt">${button('Neue Runde','navigate','data-route="training"')}${button('Meine Fehler wiederholen','repeat-mistakes','','secondary')}${s.lessonId?button('Zurück zum Lernpfad','navigate',`data-route="lesson/${s.lessonId}"`,'secondary'):button('Zur Übersicht','navigate','data-route="dashboard"','secondary')}</div></div>${s.mode!=='cards'?s.questions.map((q,i)=>`<details class="card mb"><summary>${i+1}. ${e(Q.by[q.term]?.name||'Aufgabe')} · ${s.feedbacks[q.id]?.grade.score||0} / ${q.points} Punkte${q.kind==='write'?' · Selbstkontrolle':''}</summary>${S.feedbackHTML(q,s.feedbacks[q.id])}</details>`).join(''):''}</div>`;}
function flashcards(s){const q=s.questions[s.index],t=Q.by[q.term],back=s.cardBack,mode=s.cardMode;let front=mode==='definition'?t.definition:mode==='example'?C.plain(t.examples[0].text):t.name;let answer=mode==='term'?t.definition:mode==='effect'?t.examples[1].effect:t.name;
return `<div class="question-frame"><a class="back" href="#training">${icon('back')} Trainingsübersicht</a><div class="question-top"><div class="row between"><h2>Karte ${s.index+1} von ${s.questions.length}</h2>${tag('SELBSTEINSCHÄTZUNG','purple')}</div>${progress(s.index/s.questions.length*100)}</div><button type="button" class="flashcard" data-action="card-flip" style="width:100%" aria-label="Karte umdrehen"><span class="eyebrow">${back?'RÜCKSEITE · VERGLEICHE MIT DEINER ANTWORT':'VORDERSEITE · ERST ABRUFEN, DANN UMDREHEN'}</span><span class="${back?'back-text':'front'}">${e(back?answer:front)}</span>${back?`<span class="small muted mt">${e(mode==='example'?t.examples[0].why:mode==='effect'?'Wirkung im konkreten Kommentar: '+C.plain(t.examples[1].text):t.memory)}</span>`:''}<span class="small muted mt">${icon('repeat')} &nbsp; ${back?'Erneut umdrehen':'Antippen oder Enter drücken'}</span></button>${back?`<p class="small muted mt">Wie gut konntest du die Antwort vor dem Umdrehen abrufen?</p><div class="ratings">${button('Schwer · 10 Minuten','rate-card','data-ratio="0.2"','secondary')}${button('Mittel · 1 Tag','rate-card','data-ratio="0.7"','secondary')}${button('Leicht · längeres Intervall','rate-card','data-ratio="1"')}</div>`:`<div class="info mt">${mode==='effect'?'Nenne eine mögliche Wirkung mit einem passenden Kontext. Wirkungen sind nicht für jedes Beispiel gleich.':'Sprich oder notiere deine Antwort, bevor du die Karte umdrehst. Wiedererkennen ist leichter als selbstständiges Abrufen.'}</div>`}</div>`;}
function finishSession(s){s.completed=true;s.finishedAt=Date.now();let auto=Object.values(s.feedbacks).filter(f=>!f.grade.self),max=auto.reduce((a,f)=>a+f.grade.max,0),score=auto.reduce((a,f)=>a+f.grade.score,0);if(s.lessonId&&max&&score/max>=.7)S.state.lessons[s.lessonId]={done:true,at:Date.now(),ratio:score/max,self:false};S.save();S.render(false);}
Object.assign(S.handlers,{
 'choose-mode':el=>{S.ui.mode=el.dataset.mode;if(S.ui.mode==='hard')S.ui.trainingLevel=4;S.render();document.querySelector('.training-config')?.scrollIntoView({block:'center',behavior:'smooth'});},
 'start-training':()=>S.startSession({mode:S.ui.mode,level:S.ui.trainingLevel,count:S.ui.count,categories:S.ui.trainingCategory?[S.ui.trainingCategory]:undefined}),
 'answer-option':el=>{const ctx=el.dataset.context,q=current(ctx),s=active(ctx);if(!q)return;let val=el.dataset.value,a=s.answers[q.id];if(q.kind==='multi'){let ar=Array.isArray(a)?[...a]:[];setAnswer(ctx,ar.includes(val)?ar.filter(x=>x!==val):[...ar,val]);}else if(q.kind==='odd')setAnswer(ctx,{choice:val,reason:a?.reason||''});else setAnswer(ctx,val);S.render();},
 'mark-word':el=>{const ctx=el.dataset.context,q=current(ctx),s=active(ctx),i=Number(el.dataset.index);let a=Array.isArray(s.answers[q.id])?[...s.answers[q.id]]:[];setAnswer(ctx,a.includes(i)?a.filter(x=>x!==i):[...a,i]);S.render();},
 'add-order':el=>{const ctx=el.dataset.context,q=current(ctx),s=active(ctx);let a=[...(s.answers[q.id]||[])];if(!a.includes(el.dataset.value))a.push(el.dataset.value);setAnswer(ctx,a);S.render();},
 'remove-order':el=>{const ctx=el.dataset.context,q=current(ctx),s=active(ctx),a=[...(s.answers[q.id]||[])];a.splice(Number(el.dataset.index),1);setAnswer(ctx,a);S.render();},
 'match-left':el=>{S.ui.matchLeft=el.dataset.value;S.render();},
 'match-right':el=>{if(S.ui.matchLeft===null||S.ui.matchLeft===undefined){S.toast('Wähle zuerst links eine Definition.');return;}const ctx=el.dataset.context,q=current(ctx),s=active(ctx);let a={...(s.answers[q.id]||{})};for(const k in a)if(a[k]===el.dataset.value)delete a[k];a[S.ui.matchLeft]=el.dataset.value;setAnswer(ctx,a);S.ui.matchLeft=null;S.render();},
 'show-model':()=>{const s=S.state.activeSession,q=s.questions[s.index];if(!s.answers[q.id]?.text?.trim()){S.toast('Formuliere zuerst einen eigenen Versuch.');document.getElementById('q-free')?.focus();return;}s.models[q.id]=true;S.save();S.render();},
 'check-answer':()=>{const s=S.state.activeSession;if(!s)return;const q=s.questions[s.index];if(s.feedbacks[q.id])return;let a=s.answers[q.id];if(!answerPresent(q,a)){S.toast('Gib zuerst eine Antwort ein.');return;}if(q.kind==='write'){a={...a,rated:true,rubric:a.rubric||q.rubric.map(()=>false)};s.answers[q.id]=a;}const g=C.grade(q,a);s.feedbacks[q.id]={grade:g};S.recordQuestion(q,a,g,s.id+':'+q.id,s.mode);S.save();S.render();document.querySelector('.feedback')?.scrollIntoView({block:'nearest',behavior:'smooth'});},
 'next-question':()=>{const s=S.state.activeSession;if(!s||!s.feedbacks[s.questions[s.index].id])return;if(s.index+1>=s.questions.length)finishSession(s);else{s.index++;S.ui.matchLeft=null;S.save();S.render(false);}},
 'repeat-mistakes':()=>S.startSession({mode:'mistakes',level:4,count:10}),
 'card-flip':()=>{const s=S.state.activeSession;if(!s||s.mode!=='cards')return;s.cardBack=!s.cardBack;S.save();S.render();},
 'rate-card':el=>{const s=S.state.activeSession;if(!s?.cardBack)return;let q=s.questions[s.index],ratio=Number(el.dataset.ratio);const g={score:ratio,max:1,ratio,self:true,pending:false};s.feedbacks[q.id]={grade:g};C.record(S.state,{id:s.id+':'+q.id,term:q.term,mode:'cards',ratio,self:true,level:q.level,at:Date.now()});s.cardBack=false;if(s.index+1>=s.questions.length)finishSession(s);else{s.index++;S.save();S.render(false);}}
});
S.inputs['q-input']=el=>{const ctx=el.dataset.context,q=current(ctx);if(!q)return;setAnswer(ctx,q.kind==='write'?{...(active(ctx).answers[q.id]||{}),text:el.value,rated:false}:el.value);if(q.kind==='write'){const c=document.getElementById('q-wordcount');if(c)c.textContent=C.words(el.value)+' Wörter · keine automatische Inhaltsbewertung';}};
S.inputs['odd-reason']=el=>{const ctx=el.dataset.context,q=current(ctx);setAnswer(ctx,{...(active(ctx).answers[q.id]||{}),reason:el.value});};
S.changes['q-rubric']=el=>{const ctx=el.dataset.context,q=current(ctx),s=active(ctx),a=s.answers[q.id]||{text:''},r=[...(a.rubric||q.rubric.map(()=>false))];r[Number(el.dataset.index)]=el.checked;setAnswer(ctx,{...a,rubric:r});};
for(const [id,key,number] of [['training-level','trainingLevel',true],['training-count','count',true],['training-category','trainingCategory',false],['card-mode','cardMode',false]])S.changes[id]=el=>{S.ui[key]=number?Number(el.value):el.value;};
})();

</script>
<script>
(function(){'use strict';const S=window.SM,{D,C,Q,e,icon,button,pageTop,tag,progress,empty}=S;
const kinds=[['recognize','Stilmittel erkennen'],['definition','Begriff selbst eingeben'],['meaning','Definition auswählen'],['mark','Textstellen markieren'],['effect','Wirkung zuordnen'],['error','Analysefehler finden'],['hard','Mehrfachbefunde'],['construct','Bausteine anordnen'],['match','Paare zuordnen'],['write','Eigene Beispiele'],['analysis','Freie Textanalyse']];
S.views.exam=function(){const cfg=S.ui.examConfig||{level:3,count:'20',minutes:30,material:false,categories:D.categories.map(c=>c.id),modes:['recognize','definition','mark','effect'],feedback:'end',target:500};S.ui.examConfig=cfg;
return pageTop('PRÜFUNGSSIMULATION','Zeig, was wirklich sitzt.','Eine ruhige Prüfungsumgebung mit nachvollziehbarer Bewertung. Ohne Hilfen und ohne erfundene Notenprognose.')+`${S.state.activeExam?`<div class="info mb row between wrap"><span>Prüfung in dieser Sitzung. ${S.state.activeExam.deadline?'Die Zeit läuft beim Wechsel zwischen Bereichen weiter. Neuladen setzt alles zurück.':'Ohne Zeitlimit.'}</span>${button('Prüfung fortsetzen','navigate','data-route="examrun"','secondary')}</div>`:''}<div class="grid two"><section class="card"><h2>Deine Prüfung zusammenstellen</h2><div class="grid two mb"><label class="field">Schwierigkeitsgrad<select id="exam-level">${['Absoluter Anfänger','Grundlagen','Fortgeschritten','Prüfungsniveau'].map((x,i)=>`<option value="${i+1}" ${cfg.level===i+1?'selected':''}>${i+1} · ${x}</option>`).join('')}</select></label><label class="field">Prüfungsumfang<select id="exam-count">${[['10','10 Aufgaben'],['20','20 Aufgaben'],['40','40 Aufgaben'],['full','Vollständige Probeklausur']].map(([v,l])=>`<option value="${v}" ${cfg.count===v?'selected':''}>${l}</option>`).join('')}</select></label><label class="field">Zeitlimit in Minuten<input type="number" id="exam-minutes" min="0" max="300" value="${cfg.minutes}"><small class="muted">0 = ohne Zeitlimit</small></label><label class="field">Rückmeldung<select id="exam-feedback"><option value="end" ${cfg.feedback==='end'?'selected':''}>Erst nach Abgabe</option><option value="direct" ${cfg.feedback==='direct'?'selected':''}>Direkt auf Wunsch</option></select></label></div><label class="check mb"><input type="checkbox" id="exam-material" ${cfg.material?'checked':''}>Nur Begriffe aus meinen Unterrichtsunterlagen</label><fieldset><legend>Kategorien</legend><div class="grid two">${D.categories.map(c=>`<label class="check"><input type="checkbox" class="exam-category" value="${c.id}" ${cfg.categories.includes(c.id)?'checked':''}>${e(c.short)}</label>`).join('')}</div></fieldset><fieldset><legend>Aufgabentypen</legend><div class="grid two">${kinds.map(([v,l])=>`<label class="check"><input type="checkbox" class="exam-kind" value="${v}" ${cfg.modes.includes(v)?'checked':''}>${l}</label>`).join('')}</div></fieldset><label class="field mb">Kommentarumfang in der Probeklausur<select id="exam-target"><option value="500" ${cfg.target===500?'selected':''}>Etwa 500 Wörter · Schulaufgabe</option><option value="800" ${cfg.target===800?'selected':''}>Etwa 800 Wörter · Abiturtraining</option></select></label>${button('Prüfung starten '+icon('arrow'),'prepare-exam')}</section><aside class="stack"><section class="card"><h2>So wird bewertet</h2><div class="step-text"><span class="circle-num">1</span><p>Begriffe und eindeutige Auswahlaufgaben: volle Punkte für die hinterlegte Lösung, sonst 0.</p></div><div class="step-text"><span class="circle-num">2</span><p>Mehrfachauswahl: richtige Ziele geben Anteile. Zusätzliche falsche Kreuze ziehen Anteile ab; die Punktzahl fällt nicht unter 0.</p></div><div class="step-text"><span class="circle-num">3</span><p>Markierungen: Teilpunkte nach Wortübereinstimmung. Zu viel und zu wenig markierte Wörter senken die Wertung.</p></div><div class="step-text"><span class="circle-num">4</span><p>Zuordnung und Reihenfolge: Teilpunkte je richtigem Paar beziehungsweise richtiger Position.</p></div><div class="step-text"><span class="circle-num">5</span><p>Freie Texte: Musterlösung und Selbstkontrolle nach Abgabe. Offene Punkte bleiben sichtbar; objektive und selbst eingeschätzte Ergebnisse werden getrennt.</p></div></section><section class="card"><h3>Die vollständige Probeklausur</h3><p class="small muted">16 Kurzaufgaben aus deiner Auswahl, zwei Textanalysen und ein materialgestützter Kommentar. Die langen Schreibaufgaben werden unabhängig von den ausgewählten Kurzaufgabentypen ergänzt. Die beiden Textanalysen berücksichtigen deine Kategorie- und Stofffilter. Sind dafür zu wenige Texte verfügbar, wird der Start mit einem Hinweis verhindert.</p><p class="small muted">Der Kommentar verwendet ausdrücklich fiktive Übungsmaterialien. Die Wortziele 500 / 800 stammen aus deinen Unterlagen und sind keine allgemeine Prüfungsordnung.</p><p class="small">Plane das Zeitlimit passend zum Umfang. 0 Minuten deaktiviert den Countdown. Bei Zeitablauf wird der gespeicherte Stand automatisch abgegeben.</p></section><section class="card"><h3>Nur für diese Sitzung</h3><p class="small muted">Antworten, Frageposition und Endzeit bleiben nur bis zum Neuladen erhalten. Du kannst zurückblättern, überspringen und vor der Abgabe kontrollieren. Beim Neuladen beginnt die Prüfung neu.</p></section></aside></div>${S.state.exams.length?`<section class="card mt"><h2>Deine bisherigen Simulationen</h2>${S.state.exams.slice().reverse().map(ex=>`<a class="list-row" href="#examresult/${ex.id}"><span class="circle-num">${icon('award')}</span><span class="grow"><strong>${ex.full?'Probeklausur':ex.questions.length+' Aufgaben'} · Stufe ${ex.level}</strong><small>${new Date(ex.finishedAt).toLocaleString('de',{dateStyle:'medium',timeStyle:'short'})}</small></span>${icon('arrow')}</a>`).join('')}</section>`:''}`;};
function config(){return {level:Number(document.getElementById('exam-level').value),count:document.getElementById('exam-count').value,minutes:Math.min(300,Math.max(0,Number(document.getElementById('exam-minutes').value)||0)),material:document.getElementById('exam-material').checked,categories:[...document.querySelectorAll('.exam-category:checked')].map(x=>x.value),modes:[...document.querySelectorAll('.exam-kind:checked')].map(x=>x.value),feedback:document.getElementById('exam-feedback').value,target:Number(document.getElementById('exam-target').value)};}
function startExam(cfg){const full=cfg.count==='full';let modes=full?cfg.modes.filter(x=>!['analysis','write'].includes(x)):cfg.modes;let questions=Q.select({...cfg,count:full?16:Number(cfg.count),modes},S.state,Date.now());
if(!questions.length){S.toast('Für diese Auswahl gibt es keine Aufgaben. Passe Stufe, Kategorien oder Typen an.');return;}
if(full){let analyses=Q.bank().filter(q=>q.mode==='analysis'&&(!cfg.material||q.material)&&q.terms.every(id=>cfg.categories.includes(Q.by[id].category)));if(analyses.length<2){S.toast('Für die Probeklausur werden zwei passende Labortexte benötigt. Wähle mehr Kategorien oder alle Stilmittel.');return;}questions.push(...C.shuffle(analyses,Date.now()).slice(0,2));let t=D.topics[0];questions.push({id:'comment:'+t.id,kind:'write',mode:'comment',term:'metapher',terms:['metapher'],level:4,points:24,prompt:`Verfasse einen materialgestützten Kommentar mit etwa ${cfg.target} Wörtern: ${t.question} Nutze alle drei Materialien. Gib deinem Text eine passende Überschrift.`,text:'Alle folgenden Materialien sind fiktive Übungstexte, keine realen Studien.\n\n'+t.materials.map(m=>m.id+' · '+m.title+'\n'+m.text).join('\n\n'),rubric:['Eine klare, begründete Position beantwortet die Leitfrage.','Alle Materialien sind sinnvoll verarbeitet und korrekt gekennzeichnet.','Die Argumente sind nachvollziehbar belegt; ein Gegenargument wird fair behandelt.','Überschrift, Einleitung, Hauptteil und Schluss bilden eine erkennbare Struktur.','Die Sprache ist sachlich wertend, adressatengerecht und rhetorisch funktional.','Der Text ist sprachlich sorgfältig und liegt ungefähr im geforderten Wortumfang.'],model:t.headline+'\n\n'+t.intro+'\n\nBeispiel für einen Argumentationsabschnitt: '+t.argument+'\n\nMöglicher Schluss: '+t.ending+'\n\nDies ist ein Struktur- und Abschnittsmuster, kein vollständiger Kommentar im Zielumfang. Entwickle die ausgewählten Argumente eigenständig.',explanation:'Jedes vollständig erfüllte Kriterium entspricht 4 selbst eingeschätzten Punkten. Es gibt keine automatische semantische Bewertung.'});}
const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);S.state.activeExam={id,questions,index:0,answers:{},feedbacks:{},models:{},startedAt:Date.now(),deadline:cfg.minutes?Date.now()+cfg.minutes*60000:null,level:cfg.level,full,config:cfg,review:false,lessonId:S.ui.lessonActive||null};S.ui.lessonActive=null;S.save();S.go('examrun');if(!full&&questions.length<Number(cfg.count))S.toast(`Der Filter liefert ${questions.length} unterschiedliche Aufgaben. Dieser tatsächliche Umfang wird gewertet.`);}
function timeString(ms){let sec=Math.max(0,Math.ceil(ms/1000));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;}
function clock(ex){return ex.deadline?`<span id="exam-clock" class="exam-clock ${ex.deadline-Date.now()<120000?'urgent':''}" role="timer" aria-label="Restzeit">${icon('clock')} ${timeString(ex.deadline-Date.now())}</span>`:tag('Ohne Zeitlimit');}
S.views.examrun=function(){const ex=S.state.activeExam;if(!ex)return pageTop('PRÜFUNG','Keine laufende Prüfung.','Wähle zuerst die gewünschten Einstellungen.')+button('Prüfung konfigurieren','navigate','data-route="exam"');let q=ex.questions[ex.index],answered=ex.questions.filter(q=>S.answerPresent(q,ex.answers[q.id])).length;
let header=`<div class="page-top"><div class="row between wrap"><div><span class="eyebrow">${ex.full?'PROBEKLAUSUR':'PRÜFUNGSSIMULATION'} · STUFE ${ex.level}</span><h1 style="font-size:32px;margin-top:12px">${ex.review?'Noch einmal prüfen.':'Konzentriert bei der Sache.'}</h1></div>${clock(ex)}</div><div class="row between mb"><span class="small muted">${answered} von ${ex.questions.length} Antworten erfasst</span><a class="text-link" href="#exam">Verlassen · nur bis zum Neuladen</a></div>${progress(answered/ex.questions.length*100)}</div>`;
if(ex.review)return header+`<div class="card"><h2>Antworten vor der Abgabe kontrollieren</h2><p class="small muted">${ex.questions.length-answered} Aufgaben sind noch unbeantwortet. Du kannst jede Antwort erneut öffnen und ändern. Hier werden noch keine Lösungen verraten.</p>${ex.questions.map((q,i)=>`<div class="exam-review-item"><span class="circle-num">${i+1}</span><div class="grow"><p>${e(q.prompt.slice(0,150))}</p><span class="small muted">${S.answerPresent(q,ex.answers[q.id])?'Antwort gespeichert':'Noch offen'} · ${q.points} Punkte${q.kind==='write'?' · freie Antwort':''}</span></div>${button('Öffnen','exam-jump',`data-index="${i}"`,'secondary small')}</div>`).join('')}<div class="row between wrap mt">${button('Zurück zur Aufgabe','exam-back-review','','secondary')}${button('Prüfung abgeben','confirm-exam-submit')}</div></div>`;
return header+`<div class="exam-layout"><div>${S.questionHTML(q,ex.answers[q.id],'exam',ex.config.feedback==='direct'?ex.feedbacks[q.id]:null)}<div class="question-actions">${button(icon('back')+' Zurück','exam-prev',ex.index===0?'disabled':'','secondary')}${ex.config.feedback==='direct'&&q.kind!=='write'?button('Zwischenfeedback','exam-check','','secondary'):''}${button((ex.index+1===ex.questions.length?'Antworten kontrollieren':'Weiter / überspringen')+' '+icon('arrow'),'exam-next')}</div></div><aside class="card exam-side"><div class="row between mb"><h3 class="no-margin">Aufgaben</h3><span class="small muted">${ex.index+1} / ${ex.questions.length}</span></div><div class="review-grid">${ex.questions.map((x,i)=>`<button type="button" class="review-dot ${i===ex.index?'current':''} ${S.answerPresent(x,ex.answers[x.id])?'answered':''}" data-action="exam-jump" data-index="${i}" aria-label="Aufgabe ${i+1}, ${S.answerPresent(x,ex.answers[x.id])?'beantwortet':'offen'}">${i+1}</button>`).join('')}</div><p class="small muted mt">${ex.config.feedback==='end'?'Lösungen bleiben bis zur Abgabe verborgen.':'Zwischenfeedback ist für objektive Aufgaben aktiviert. Freie Texte werden nach Abgabe selbst geprüft.'}</p><div class="stack">${button('Antworten kontrollieren','exam-review','','secondary')}${button('Vorzeitig abgeben','confirm-exam-submit','','ghost')}</div></aside></div>`;};
function finalize(timed=false){const ex=S.state.activeExam;if(!ex)return;ex.finishedAt=Date.now();ex.timedOut=timed;ex.results={};ex.questions.forEach(q=>{const a=ex.answers[q.id],g=C.grade(q,a);ex.results[q.id]=g;S.recordQuestion(q,a,g,ex.id+':'+q.id,'exam');});let a=ex.questions.filter(q=>q.kind!=='write'),max=a.reduce((n,q)=>n+q.points,0),score=a.reduce((n,q)=>n+ex.results[q.id].score,0);if(ex.lessonId&&max&&score/max>=.7)S.state.lessons[ex.lessonId]={done:true,at:Date.now(),ratio:score/max,self:false};S.state.exams.push(ex);if(S.state.exams.length>500)S.state.exams.shift();S.state.activeExam=null;S.save();const d=document.getElementById('app-dialog');if(d.open)d.close();S.go('examresult/'+ex.id);if(timed)S.toast('Die Zeit ist abgelaufen. Der gespeicherte Stand wurde abgegeben.');}
S.examTotals=function(ex){let automatic=ex.questions.filter(q=>q.kind!=='write'),free=ex.questions.filter(q=>q.kind==='write');return {autoScore:automatic.reduce((n,q)=>n+(ex.results[q.id]?.score||0),0),autoMax:automatic.reduce((n,q)=>n+q.points,0),selfScore:free.reduce((n,q)=>n+(ex.results[q.id]?.score||0),0),selfMax:free.reduce((n,q)=>n+q.points,0),pending:free.filter(q=>!ex.results[q.id]||ex.results[q.id].pending).length,max:ex.questions.reduce((n,q)=>n+q.points,0)};};
function answerText(q,a){if(a===undefined||a===null)return 'Keine Antwort abgegeben.';if(q.kind==='write')return a.text||'Keine freie Antwort abgegeben.';if(q.kind==='mark')return (Array.isArray(a)?a:[]).sort((a,b)=>a-b).map(i=>C.tokens(q.text)[i]?.text||'').join(' ')||'Nichts markiert.';if(q.kind==='order')return (a||[]).map(v=>q.items.find(x=>x.value===v)?.label||'').join(' ');if(q.kind==='match')return Object.entries(a||{}).map(([k,v])=>(Number(k)+1)+': '+(Q.by[v]?.name||v)).join(' · ');if(q.kind==='multi')return a.map(v=>q.options.find(o=>o.value===v)?.label||v).join(', ');if(q.options){let pick=a?.choice??a;return (q.options.find(o=>o.value===pick)?.label||'Keine Auswahl')+(a?.reason?'\nBegründung: '+a.reason:'');}return String(a);}
S.views.examresult=function(id){const ex=S.state.exams.find(x=>x.id===id);if(!ex)return pageTop('AUSWERTUNG','Keine Prüfung gefunden.','Die Ergebniskennung ist in diesem lokalen Lernstand nicht vorhanden.')+button('Zur Prüfungsauswahl','navigate','data-route="exam"');const t=S.examTotals(ex),wrong=ex.questions.filter(q=>q.kind!=='write'&&(ex.results[q.id]?.ratio||0)<.8),ids=[...new Set(wrong.map(q=>q.term))];return `<a class="back" href="#exam">${icon('back')} Alle Prüfungssimulationen</a>`+pageTop('DEINE AUSWERTUNG',ex.timedOut?'Zeit vorbei. Wissen sichtbar.':'Ein ehrlicher Blick auf deinen Stand.',`${new Date(ex.finishedAt).toLocaleDateString('de')} · ${ex.questions.length} Aufgaben · Bearbeitungszeit ${Math.max(1,Math.round((ex.finishedAt-ex.startedAt)/60000))} Minuten`)+`<div class="grid two mb"><section class="card"><span class="eyebrow">OBJEKTIV GEPRÜFTER ANTEIL</span><div class="result-score">${t.autoMax?Math.round(t.autoScore/t.autoMax*100)+' %':'—'}</div><h3>${t.autoScore} von ${t.autoMax} Punkten</h3><p class="small muted">${wrong.length} objektive Aufgaben noch nicht weitgehend sicher. Teilpunkte sind enthalten. Keine Notenumrechnung.</p></section><section class="card"><span class="eyebrow">FREIE SCHREIBAUFGABEN</span><div class="result-score" style="font-size:43px">${t.pending?t.pending+' offen':t.selfMax?t.selfScore+' / '+t.selfMax:'Keine'}</div><p class="small muted">${t.selfMax?'Diese '+t.selfMax+' möglichen Punkte erfordern Selbstkontrolle. Sie sind kein automatisch verifiziertes Sprachurteil.':'Diese Simulation enthält nur objektiv bewertbare Aufgaben.'}</p><div class="info">${t.pending?`Noch kein vollständiger Gesamtwert. Maximal sind insgesamt ${t.max} Punkte möglich.`:`Gesamt: ${t.autoScore+t.selfScore} / ${t.max} Punkte (${t.max?Math.round((t.autoScore+t.selfScore)/t.max*100):0} %).${t.selfMax?' Dieser Gesamtwert enthält deine Selbstbewertungen.':''}`}</div></section></div><section class="card mb"><h2>Das solltest du als Nächstes üben</h2>${ids.length?`<p class="small muted">Diese Empfehlung folgt aus den Aufgaben dieser Prüfung, bei denen weniger als 80 % der möglichen Lösung erreicht wurden.</p><div class="row wrap">${ids.map(id=>`<a class="chip" href="#detail/${id}">${e(Q.by[id]?.name||id)}</a>`).join('')}</div><div class="row wrap mt"></div>`:`<p>Der objektive Teil enthält keine ausgeprägten Lücken. Übertrage das Wissen jetzt auf einen neuen Text.</p><div class="row wrap"></div>`}</section><div class="section-title"><h2>Aufgaben, Lösungen und Begründungen</h2>${tag(ex.questions.length+' Aufgaben')}</div>${ex.questions.map((q,i)=>{const g=ex.results[q.id]||{pending:true,self:true},a=ex.answers[q.id];return `<details class="card mb" ${q.kind==='write'&&g.pending?'open':''}><summary><span class="row between wrap"><span>${i+1}. ${q.kind==='write'?'Freie Schreibaufgabe':e(Q.by[q.term]?.name||'Aufgabe')}</span>${tag(g.pending?'Selbstkontrolle offen':g.score+' / '+q.points+' Punkte',g.pending?'purple':g.ratio>=.8?'green':g.ratio>0?'gold':'red')}</span></summary><p class="mt"><b>Auftrag:</b> ${e(q.prompt)}</p>${q.text?`<div class="question-text ${q.text.length>400?'long':''}">${e(q.text)}</div>`:''}<h3>Deine Antwort</h3><div class="info" style="white-space:pre-line">${e(answerText(q,a))}</div>${q.kind==='write'?`<h3 class="mt">Muster und Orientierung</h3><p style="white-space:pre-line;font-size:13px">${e(q.model)}</p><div class="info warning">Die folgenden Punkte vergibst du selbst. Ein gesetztes Häkchen bedeutet nicht, dass die Anwendung den Text inhaltlich geprüft hat.</div><div class="criteria">${q.rubric.map((r,ri)=>`<label class="check"><input type="checkbox" data-change="exam-self-rubric" data-exam="${ex.id}" data-question="${q.id}" data-index="${ri}" ${a?.rubric?.[ri]?'checked':''} ${!a?.text?.trim()?'disabled':''}>${e(r)} <small class="muted">(${q.points/q.rubric.length} Punkte)</small></label>`).join('')}</div>${button('Selbstkontrolle übernehmen','exam-self-save',`data-exam="${ex.id}" data-question="${q.id}"`,'secondary')}<p class="small muted mt-small">Bei leerer Antwort bleiben alle Kriterien unerfüllt. Eine ehrliche 0-Punkte-Selbstkontrolle ist möglich.</p>`:S.feedbackHTML(q,{grade:g})}</details>`;}).join('')}`;};
Object.assign(S.handlers,{
 'prepare-exam':()=>{const cfg=config();S.ui.examConfig=cfg;if(!cfg.categories.length||!cfg.modes.length){S.toast('Wähle mindestens eine Kategorie und einen Aufgabentyp.');return;}if(cfg.count==='full'&&!cfg.modes.some(x=>!['write','analysis'].includes(x))){S.toast('Wähle für die Kurzaufgaben mindestens einen objektiven Aufgabentyp.');return;}if(S.state.activeExam){S.dialog('Neue Prüfung beginnen?',`<p>Der bisherige laufende Prüfungsentwurf wird ersetzt. Bereits abgeschlossene Prüfungen bleiben erhalten.</p>`,button('Abbrechen','close-dialog','','secondary')+button('Neue Prüfung beginnen','start-new-exam'));}else startExam(cfg);},
 'start-new-exam':()=>{document.getElementById('app-dialog').close();startExam(S.ui.examConfig);},
 'exam-next':()=>{const ex=S.state.activeExam;if(!ex)return;if(ex.index+1<ex.questions.length)ex.index++;else ex.review=true;S.ui.matchLeft=null;S.save();S.render(false);},
 'exam-prev':()=>{const ex=S.state.activeExam;if(ex&&ex.index>0){ex.index--;S.ui.matchLeft=null;S.save();S.render(false);}},
 'exam-jump':el=>{const ex=S.state.activeExam;if(!ex)return;ex.index=Math.max(0,Math.min(ex.questions.length-1,Number(el.dataset.index)||0));ex.review=false;S.ui.matchLeft=null;S.save();S.render(false);},
 'exam-review':()=>{const ex=S.state.activeExam;if(ex){ex.review=true;S.save();S.render(false);}},
 'exam-back-review':()=>{S.state.activeExam.review=false;S.save();S.render(false);},
 'exam-check':()=>{const ex=S.state.activeExam,q=ex.questions[ex.index];if(!S.answerPresent(q,ex.answers[q.id])){S.toast('Gib zuerst eine Antwort ein.');return;}ex.feedbacks[q.id]={grade:C.grade(q,ex.answers[q.id])};S.save();S.render();},
 'confirm-exam-submit':()=>{const ex=S.state.activeExam;if(!ex)return;const missing=ex.questions.filter(q=>!S.answerPresent(q,ex.answers[q.id])).length;S.dialog('Prüfung endgültig abgeben?',`<p>${missing?`Noch ${missing} Aufgaben sind unbeantwortet. Sie erhalten im objektiven Teil 0 Punkte.`:'Zu jeder Aufgabe ist eine Antwort gespeichert.'}</p><p class="small muted">Nach der Abgabe sind objektive Antworten nicht mehr veränderbar. Freie Texte kannst du anschließend anhand der Kriterien selbst bewerten.</p>`,button('Weiterarbeiten','close-dialog','','secondary')+button('Jetzt abgeben','submit-exam'));},
 'submit-exam':()=>finalize(false),
 'exam-gaps':el=>{let ex=S.state.exams.find(x=>x.id===el.dataset.id),ids=[...new Set(ex.questions.filter(q=>q.kind!=='write'&&ex.results[q.id].ratio<.8).map(q=>q.term))];S.startSession({mode:'mixed',terms:ids,count:10,level:4});},
 'exam-self-save':el=>{let ex=S.state.exams.find(x=>x.id===el.dataset.exam),q=ex.questions.find(q=>q.id===el.dataset.question),a=ex.answers[q.id]||{text:'',rubric:q.rubric.map(()=>false)};if(!a.text?.trim())a.rubric=q.rubric.map(()=>false);a.rated=true;ex.answers[q.id]=a;ex.results[q.id]=C.grade(q,a);S.recordQuestion(q,a,ex.results[q.id],ex.id+':self:'+q.id,'exam-self');S.save();S.toast('Selbstkontrolle gespeichert und gesondert ausgewiesen.');S.render();},
});
S.changes['exam-self-rubric']=el=>{const ex=S.state.exams.find(x=>x.id===el.dataset.exam),q=ex.questions.find(q=>q.id===el.dataset.question);const a=ex.answers[q.id]||{text:''};a.rubric=a.rubric||q.rubric.map(()=>false);a.rubric[Number(el.dataset.index)]=el.checked;a.rated=false;ex.answers[q.id]=a;ex.results[q.id]=C.grade(q,a);S.save();};
S.startClock=function(){setInterval(()=>{const ex=S.state.activeExam;if(!ex?.deadline)return;const left=ex.deadline-Date.now();if(left<=0){finalize(true);return;}const el=document.getElementById('exam-clock');if(el){el.innerHTML=icon('clock')+' '+timeString(left);el.classList.toggle('urgent',left<120000);}},1000);};
})();

</script>
<script>
(function(){'use strict';const S=window.SM,{D,C,Q,e,icon,button,pageTop,tag,progress,empty}=S;
const colors=['#dcebbd','#f2d9af','#cedfe9','#e4d3eb','#f0cfc3','#d2e5df'];
const analysisCriteria=['Ich habe die Haltung beziehungsweise das Anliegen des Textes verstanden.','Meine Begriffe passen zu den nachgewiesenen Merkmalen.','Meine Zitate sind genau und sinnvoll begrenzt.','Ich erkläre die Bedeutung der Formulierung im Kontext.','Ich verbinde die Wirkung mit der Argumentation oder Darstellung.','Meine Analyse bildet einen zusammenhängenden, sprachlich nachvollziehbaren Text.'];
function labState(id){if(!S.state.labs[id])S.state.labs[id]={annotations:[],analysis:'',criteria:[],revealed:false,pending:{indices:[],term:'',effect:'',fn:''}};let v=S.state.labs[id];v.pending=v.pending||{indices:[],term:'',effect:'',fn:''};v.annotations=v.annotations||[];return v;}
function currentLab(){const r=S.route();return D.labs.find(l=>l.id===r.args[0]);}
function quoteFromIndices(text,indices){const ts=C.tokens(text),a=[...new Set(indices)].sort((a,b)=>a-b);let groups=[],start=null,end=null;for(const i of a){if(!ts[i])continue;if(end!==null&&i===end+1)end=i;else{if(start!==null)groups.push(text.slice(ts[start].start,ts[end].end));start=end=i;}}if(start!==null)groups.push(text.slice(ts[start].start,ts[end].end));return groups.join(' … ');}
S.views.lab=function(){return pageTop('TEXTLABOR','Mehr als ein einzelner Satz.','Acht eigene Übungstexte. Finde Belege, ordne Stilmittel zu und erkläre ihre Funktion im Zusammenhang.')+`${S.ui.lessonActive?'<div class="info mb">Wähle einen Text für deinen Lernpfad. Die praktische Lektion wird nach einer ausgearbeiteten Analyse und ehrlicher Kriterienkontrolle abgeschlossen.</div>':''}<div class="grid two">${D.labs.map((l,i)=>{const st=S.state.labs[l.id];return `<article class="card lab-card"><div class="row between mb">${tag(l.genre,i%2?'purple':'green')}${tag('Stufe '+l.level)}</div><h2 style="font:28px/1.3 var(--serif)">${e(l.title)}</h2><p class="small muted">${e(l.text.slice(0,185))}…</p><div class="row between wrap mt"><span class="small muted">${C.words(l.text)} Wörter · ${st?.annotations?.length||0} eigene Befunde</span>${button(st?.analysis?'Analyse fortsetzen':'Text untersuchen','open-lab',`data-id="${l.id}"`,'secondary')}</div></article>`;}).join('')}</div><div class="info mt"><b>Keine fremden Originaltexte:</b> Alle Texte wurden für diese Lernplattform formuliert. Die Musteranalysen zeigen gut begründbare Befunde, nicht zwingend jede mögliche Beobachtung.</div>`;};
S.views.labtext=function(id){const l=D.labs.find(x=>x.id===id);if(!l)return empty('Text nicht gefunden','Wähle einen der Labortexte.');const st=labState(id),pending=st.pending,ts=C.tokens(l.text),selected=pending.indices||[];let matches=l.annotations.filter(ref=>st.annotations.some(a=>{if(a.term!==ref.term)return false;const set=new Set(C.quoteIndices(l.text,ref.quote)),got=new Set(a.indices),hit=[...got].filter(x=>set.has(x)).length;return 2*hit/(set.size+got.size||1)>=.5;})).length;
let sentence=1;const textHTML=ts.map((t,i)=>{let starts=i===0||/[.!?]$/.test(ts[i-1].text);if(i>0&&starts)sentence++;const marks=st.annotations.filter(a=>a.indices.includes(i)),color=marks.length?colors[D.categories.findIndex(c=>c.id===Q.by[marks[0].term]?.category)%colors.length]:'';return `${starts?`<span class="small muted" style="font-family:var(--sans);font-size:9px;vertical-align:super;margin-right:3px" aria-label="Satz ${sentence}">${sentence}</span>`:''}<button type="button" class="word-token ${selected.includes(i)?'selected':''} ${marks.length?'lab-marked':''} ${marks.length>1?'lab-multiple':''}" style="${color?'--mark-color:'+color:''}" data-action="lab-word" data-index="${i}" aria-pressed="${selected.includes(i)}" title="${marks.map(a=>e(Q.by[a.term]?.name||a.term)).join(', ')}">${e(t.text)}</button> `;}).join('');
return `<a class="back" href="#lab">${icon('back')} Alle Labortexte</a>`+pageTop('TEXTLABOR · '+e(l.genre).toUpperCase(),e(l.title),e(l.prompt))+`<div class="lab-layout"><div class="stack"><section class="card"><div class="row between mb">${tag('EIGENER MODELLTEXT')}${tag('Stufe '+l.level,'purple')}</div><p class="small muted">Tippe die relevanten Wörter an. Die kleinen Zahlen kennzeichnen Sätze. Du kannst dieselbe Stelle später einem weiteren Mittel zuordnen.</p><div class="lab-text" aria-label="Text zum Untersuchen">${textHTML}</div><div class="row between wrap mt"><span class="small muted">${selected.length} Wörter ausgewählt · ${st.annotations.length} gespeicherte Befunde</span></div></section></div><aside class="stack" style="align-self:start"><section class="card"><h3>Eine Textstelle untersuchen</h3><div class="info mb" style="font:17px/1.7 var(--serif)">${selected.length?e(quoteFromIndices(l.text,selected)):'Wähle zuerst Wörter im Text aus.'}</div><label class="field mb">Stilmittel<select id="lab-term"><option value="">Begriff auswählen</option>${D.terms.slice().sort((a,b)=>a.name.localeCompare(b.name,'de')).map(t=>`<option value="${t.id}" ${pending.term===t.id?'selected':''}>${e(t.name)}</option>`).join('')}</select></label><label class="field mb">Wirkung in diesem Zusammenhang<textarea id="lab-effect" rows="3" style="min-height:95px" placeholder="Welche Vorstellung oder Wertung legt die Formulierung nahe?">${e(pending.effect)}</textarea></label><label class="field mb">Funktion für Aussage oder Argumentation<textarea id="lab-function" rows="3" style="min-height:95px" placeholder="Warum steht diese Formulierung gerade an dieser Stelle?">${e(pending.fn)}</textarea></label>${button('Befund speichern','lab-add')}</section><section class="card"><h3>Deine Befunde</h3>${st.annotations.length?st.annotations.map((a,i)=>`<article class="annotation" style="--mark-color:${colors[D.categories.findIndex(c=>c.id===Q.by[a.term]?.category)%colors.length]}"><div class="annotation-header"><strong>${e(Q.by[a.term]?.name||a.term)}</strong><button class="icon-btn" data-action="lab-remove" data-index="${i}" aria-label="Befund entfernen">${icon('trash')}</button></div><blockquote>„${e(quoteFromIndices(l.text,a.indices))}“</blockquote><p><b>Wirkung:</b> ${e(a.effect)}</p><p><b>Funktion:</b> ${e(a.fn)}</p></article>`).join(''):empty('Noch kein Befund','Markiere eine Stelle und begründe deine Zuordnung.','pen')}</section></aside></div>${st.revealed?`<section class="card mt"><div class="row between wrap"><h2>Musterbefunde</h2>${tag(matches+' / '+l.annotations.length+' Musterstellen formal getroffen','green')}</div><p class="small muted">Der formale Abgleich prüft Begriff und mindestens 50 % Wortüberlappung (F1). Er bewertet nicht deine freien Wirkungsdeutungen. Zusätzliche begründete Befunde können ebenfalls zutreffen.</p>${l.annotations.map((a,i)=>`<article class="example-block"><div class="row between">${tag(Q.by[a.term].name)}<a class="text-link" href="#detail/${a.term}">Begriff nachlesen ${icon('arrow')}</a></div><blockquote>„${e(a.quote)}“</blockquote><p><b>Sprachliches Merkmal:</b> ${e(a.feature)}</p><p><b>Funktion im Kontext:</b> ${e(a.effect)}</p></article>`).join('')}</section><section class="card mt"><h2>Eine mögliche zusammenhängende Analyse</h2><p style="line-height:1.9">${e(l.model)}</p><h3 class="mt">Ehrliche Selbstkontrolle</h3><div class="info">Prüfe deinen eigenen Text anhand der Kriterien. Das Setzen eines Häkchens ist deine Einschätzung und keine automatische Inhaltsbewertung.</div><div class="criteria">${analysisCriteria.map((r,i)=>`<label class="check"><input type="checkbox" data-change="lab-criterion" data-index="${i}" ${st.criteria?.[i]?'checked':''}>${e(r)}</label>`).join('')}</div>${button('Selbstkontrolle abschließen','lab-finish')}${st.completed?'<p class="small mt" style="color:var(--good)">Selbstkontrolle gespeichert. Die freien Aussagen wurden nicht automatisch geprüft.</p>':''}</section>`:''}`;};
S.views.effects=function(){const stage=S.ui.effectStage||1;const st=labState('effect-coach');return pageTop('WIRKUNG ERKLÄREN','Nicht nur „macht den Text interessant“.','Von einer beobachtbaren Form zu einer begründeten Deutung. Trainiere in vier Schritten.')+`<div class="tabbar">${['1 · Konkret statt allgemein','2 · Den Analysesatz bauen','3 · Selbst überarbeiten','4 · Frei analysieren'].map((x,i)=>`<button data-action="effect-stage" data-stage="${i+1}" class="${stage===i+1?'active':''}">${x}</button>`).join('')}</div>${stage===1?`<div class="grid two"><section class="card"><span class="tag red">ZU ALLGEMEIN</span><blockquote class="definition mt">„Der Autor benutzt eine Metapher, damit der Text interessanter wird.“</blockquote><p class="small muted">Kein genaues Zitat, kein erklärtes Bild, keine konkrete Aussage und keine Funktion im Gedankengang. Diese Formulierung könnte unter fast jedem Text stehen.</p></section><section class="card"><span class="tag green">KONTEXTBEZOGEN</span><blockquote class="definition mt" style="font-size:22px">„Die Bezeichnung des Buches als ‚Fenster zur Welt‘ verbindet Lesen mit dem Zugang zu unbekannten Erfahrungen. Im Plädoyer gegen die Abschaffung gedruckter Bücher betont das ihren Bildungswert.“</blockquote><p class="small muted">Das Bild wird aufgeschlüsselt und an das konkrete Anliegen gebunden. Die Wirkung wird begründet, nicht als sichere Reaktion aller Leser behauptet.</p></section></div><div class="card mt"><h2>Fünf Fragen für jede Analyse</h2><div class="grid three">${[['Beleg','Welche Wörter genau?'],['Begriff','Welches sprachliche Mittel?'],['Merkmal','Wie ist die Form gebaut?'],['Bedeutung','Was legt sie inhaltlich nahe?'],['Funktion','Was leistet sie gerade hier?']].map(([a,b])=>`<div class="info"><b>${a}</b><br>${b}</div>`).join('')}</div><div class="row wrap mt">${button('Wirkungen unterscheiden','effect-training')}${button('Weiter zu den Bausteinen '+icon('arrow'),'effect-stage','data-stage="2"','secondary')}</div></div>`:stage===2?effectBuilder(st):stage===3?`<section class="card"><h2>Eine schwache Analyse verbessern</h2><div class="question-text">Wir brauchen Räume zum Lesen. Wir brauchen Zeit zum Denken. Wir brauchen Mut zur Diskussion.</div><div class="info mb"><b>Ausgangssatz:</b> „Die Anapher macht den Text interessanter und überzeugt den Leser.“</div><p class="small muted">Überarbeite die Analyse in zwei bis vier Sätzen. Erkläre das wiederholte Muster, die Verbindung der Forderungen und die mögliche Funktion in einer Rede über Schule.</p><textarea id="effect-rewrite" rows="7">${e(st.analysis)}</textarea><div class="row wrap mt">${button('Mit einem Muster vergleichen','effect-model')}${button('Weiter zur freien Analyse','effect-stage','data-stage="4"','secondary')}</div>${st.revealed?`<div class="info mt"><b>Mögliche Überarbeitung:</b> Die Wortgruppe „Wir brauchen“ eröffnet drei aufeinanderfolgende Sätze und bildet eine Anapher. Der gemeinsame Anfang verbindet Lesen, Denken und Diskussion zu einem zusammengehörenden Bildungsprogramm. In der Rede verleiht die Wiederholung den Forderungen Nachdruck und lädt das Publikum ein, sie als gemeinsame Aufgabe zu verstehen.</div><div class="criteria">${analysisCriteria.slice(1,5).map((r,i)=>`<label class="check"><input type="checkbox" data-change="effect-criterion" data-index="${i}" ${st.criteria?.[i]?'checked':''}>${e(r)}</label>`).join('')}</div><p class="small muted">Selbstkontrolle. Es wurde keine automatische Sprachbewertung durchgeführt.</p>`:''}</section>`:`<section class="card"><h2>Jetzt ohne Satzgerüst</h2><p>Untersuche einen unbekannten Text. Beginne mit der Gesamtaussage. Wähle zwei bis drei aussagekräftige Stellen statt möglichst vieler Etiketten. Formuliere eine zusammenhängende Analyse, bevor du die Musterlösung öffnest.</p><div class="info mb">Vermeide Wirkungsbehauptungen wie „Der Leser wird auf jeden Fall überzeugt“. Begründe vorsichtiger: Die Formulierung legt eine bestimmte Sicht nahe, wertet etwas auf oder unterstützt eine Forderung.</div>${button('Ins Textlabor '+icon('arrow'),'navigate','data-route="lab"')}</section>`}`;};
const builderParts=[
{label:'Das sprachliche Merkmal',options:['Die Bibliothek wird als Fenster bezeichnet; die Eigenschaft des Zugangs wird übertragen.','Eine identische Wortgruppe steht an mehreren Satzenden.','Die Anzahl der Bücher wird in drei Stufen gesteigert.']},
{label:'Die erschlossene Bedeutung',options:['Lesen ermöglicht Einblicke in unbekannte Lebenswelten.','Die Bibliothek hat nachweislich besonders große Glasflächen.','Gedruckte Bücher sind grundsätzlich kostenlos.']},
{label:'Die Funktion im Kommentar',options:['Das Bild stützt die Forderung, den Bildungswert der Bibliothek zu bewahren.','Die Formulierung beweist alle wirtschaftlichen Aussagen des Textes.','Die Wirkung ist in jedem denkbaren Text genau dieselbe.']}
];
function effectBuilder(st){let values=st.builder||{};return `<section class="card"><h2>Beleg → Merkmal → Bedeutung → Funktion</h2><div class="question-text">Die Schulbibliothek ist ein <mark>Fenster zur Welt</mark>. Deshalb sollte sie nicht aus dem Schulalltag verschwinden.</div><p class="small muted">Der Begriff „Metapher“ ist vorgegeben. Wähle die drei passenden Erläuterungen.</p><div class="stack">${builderParts.map((p,i)=>`<label class="field">${p.label}<select data-change="effect-builder" data-index="${i}"><option value="">Wähle eine Erklärung</option>${C.shuffle(p.options.map((label,j)=>({label,value:j})),45+i).map(o=>`<option value="${o.value}" ${String(values[i])===String(o.value)?'selected':''}>${e(o.label)}</option>`).join('')}</select></label>`).join('')}</div><div class="row wrap mt">${button('Zusammenhang prüfen','effect-check')}${button('Selbst überarbeiten','effect-stage','data-stage="3"','secondary')}</div>${st.builderResult!==undefined?`<div class="feedback ${st.builderResult===3?'':st.builderResult?'partial':'bad'}"><h3>${st.builderResult} von 3 Zuordnungen richtig</h3><p>Durch die Metapher „Fenster zur Welt“ wird die Bibliothek als Zugang zu unbekannten Lebenswelten dargestellt. Das Bild stützt im Kommentar die Forderung nach ihrem Erhalt. Die Bedeutung entsteht aus der Übertragung, nicht aus einer Behauptung über tatsächliche Fenster.</p></div>`:''}</section>`;}
function draft(id=S.ui.draftTopic){if(!S.state.drafts[id])S.state.drafts[id]={title:'',position:'',materialsNotes:'',arguments:'',selection:'',plan:'',intro:'',body:'',ending:'',checks:[],annotations:[],target:500,updatedAt:Date.now()};let d=S.state.drafts[id];d.annotations=d.annotations||[];d.checks=d.checks||[];return d;}
function draftText(d){return [d.title,d.intro,d.body,d.ending].filter(Boolean).join('\n\n');}
function draftPreview(d){return ['title','intro','body','ending'].map(field=>{let text=d[field]||'';if(!text)return '';let tok=C.tokens(text),last=0,out='';for(const t of tok){out+=e(text.slice(last,t.start));let a=d.annotations.find(a=>a.field===field&&text.slice(a.start,a.end)===a.quote&&t.start<a.end&&t.end>a.start);out+=a?`<mark title="${e(Q.by[a.term]?.name||a.term)}">${e(t.text)}</mark>`:e(t.text);last=t.end;}out+=e(text.slice(last));return `<${field==='title'?'h3':'p'} style="white-space:pre-line">${out}</${field==='title'?'h3':'p'}>`;}).join('');}
function materialsHTML(topic){return `<div class="info warning mb"><b>Fiktive Übungsmaterialien.</b> Diese Texte wurden für die Aufgabe formuliert. Sie sind keine realen Studien, Nachrichten oder erhobenen Statistiken. Positionen dürfen diskutiert werden; Zahlen oder Quellen dürfen nicht hinzuerfunden werden.</div>${topic.materials.map(m=>`<article class="material"><div class="row between wrap"><h3>${m.id} · ${e(m.title)}</h3>${button('Bezug ('+m.id+') einfügen','insert-material',`data-ref="${m.id}"`,'ghost small')}</div><p>${e(m.text)}</p></article>`).join('')}<div class="info mt"><b>Materialnutzung:</b> Inhalte in eigenen Worten wiedergeben und z. B. „(vgl. M1)“ ergänzen. Direkte Zitate genau kennzeichnen. Nicht nur „M1 sagt …“ aneinanderreihen, sondern die Materialien für deine Argumentation nutzen.</div>`;}
S.views.workshop=function(){const t=D.topics.find(x=>x.id===S.ui.draftTopic)||D.topics[0];S.ui.draftTopic=t.id;const d=draft(t.id),tab=S.ui.workshopTab||'editor',wc=C.words(draftText(d)),target=d.target||500;
return pageTop('KOMMENTARWERKSTATT','Eine Position. Gute Gründe. Deine Stimme.','Plane mit den sieben Schritten aus deinem Unterricht. Schreibe anschließend einen zusammenhängenden Kommentar und prüfe ihn selbst.')+`${S.ui.lessonActive?`<div class="info mb">Dieser Entwurf gehört zu einer praktischen Lernpfadlektion. Der Abschluss erfordert einen ausgearbeiteten Text und eine Kriterienkontrolle, nicht nur das Öffnen der Werkstatt.</div>`:''}<div class="workshop-top"><label class="field">Übungsthema<select id="workshop-topic">${D.topics.map(x=>`<option value="${x.id}" ${x.id===t.id?'selected':''}>${e(x.title)}</option>`).join('')}</select></label><label class="field">Zielumfang<select id="workshop-target"><option value="500" ${target===500?'selected':''}>Etwa 500 Wörter · Schulaufgabe</option><option value="800" ${target===800?'selected':''}>Etwa 800 Wörter · Abiturtraining</option></select></label></div><div class="info mb"><b>Dein Schreibauftrag:</b> ${e(t.question)}<br>Schreibe für die Jugendseite einer fiktiven Schulzeitung. Beziehe eine begründete Position und verarbeite alle drei Übungsmaterialien.</div><div class="tabbar">${[['editor','Schreiben'],['plan','Die 7 Planungsschritte'],['materials','Materialien & Muster'],['guide','Was einen Kommentar ausmacht']].map(([v,label])=>`<button data-action="workshop-tab" data-tab="${v}" class="${tab===v?'active':''}">${label}</button>`).join('')}</div>${tab==='editor'?`<div class="editor-toolbar"><span id="draft-count" class="word-count">${wc} / ca. ${target} Wörter</span><span id="draft-saved" class="small muted">Nur bis zum Neuladen</span><div class="row wrap">${button('Kriterien prüfen','draft-evaluate','','small')}</div></div><section class="card"><label class="field mb">Deine Position<input id="draft-position" data-input="draft-input" data-field="position" value="${e(d.position)}" placeholder="Meine begründete Antwort auf die Leitfrage lautet …"></label><label class="field editor-section">Überschrift<input id="draft-title" data-input="draft-input" data-field="title" value="${e(d.title)}" placeholder="Eine prägnante, zum Anlass passende Überschrift"></label>${[['intro','Einleitung','Sachverhalt und Position einführen. Interesse wecken.'],['body','Hauptteil','Argumente entfalten, Materialien nutzen und Gegenargumente prüfen.'],['ending','Schluss','Position bündeln, sinnvoll zuspitzen und abrunden.']].map(([f,label,ph])=>`<label class="field editor-section ${f}">${label}<textarea id="draft-${f}" data-input="draft-input" data-field="${f}" placeholder="${ph}">${e(d[f])}</textarea></label>`).join('')}</section><section class="card mt"><h2>Eigene Stilmittel bewusst markieren</h2><p class="small muted">Wähle einen Textausschnitt in einem Schreibfeld aus, bestimme den Begriff und speichere die Markierung. Alternativ kannst du eine genaue Textstelle unten eingeben. Die Markierung ist deine Zuordnung, keine automatische Erkennung.</p><div class="grid two mb"><label class="field">Begriff<select id="workshop-term">${D.terms.map(t=>`<option value="${t.id}">${e(t.name)}</option>`).join('')}</select></label><label class="field">Textausschnitt alternativ eingeben<input id="workshop-manual-quote" placeholder="Muss genau so im Entwurf vorkommen"></label></div><label class="field mb">Beabsichtigte Funktion<input id="workshop-mark-note" placeholder="Warum passt dieses Mittel genau hier?"></label>${button('Textstelle als Stilmittel markieren','draft-mark','','secondary')}<div class="mt">${d.annotations.map((a,i)=>`<div class="annotation"><div class="row between"><strong>${e(Q.by[a.term]?.name||a.term)}</strong><button class="icon-btn" data-action="draft-unmark" data-index="${i}" aria-label="Markierung entfernen">${icon('trash')}</button></div><p>„${e(a.quote)}“</p><p class="small muted">${e(a.note||'Noch keine Funktion notiert.')}${(d[a.field]||'').slice(a.start,a.end)!==a.quote?' · Die Textstelle wurde verändert. Markiere sie bei Bedarf neu.':''}</p></div>`).join('')||'<p class="small muted">Noch keine eigenen Markierungen gespeichert.</p>'}</div><details class="mt"><summary>Kommentar mit deinen Markierungen ansehen</summary><div class="mt">${draftPreview(d)||'<p class="muted">Der Entwurf ist noch leer.</p>'}</div></details></section><section class="card mt"><h2>Checkliste vor der Abgabe</h2><div class="criteria">${D.checks.map((text,i)=>`<label class="check"><input type="checkbox" data-change="draft-check" data-index="${i}" ${d.checks[i]?'checked':''}>${e(text)}</label>`).join('')}</div>${button('Entwurf anhand des Rasters prüfen','draft-evaluate')}</section>`:tab==='plan'?`<div class="planning">${D.steps.map((step,i)=>`<details ${i===0?'open':''}><summary>${i+1}. ${e(step.title)}</summary><p class="small muted">${e(step.text)}</p><label class="field">Deine Notizen<textarea data-input="draft-input" data-field="${step.field}" id="plan-${step.field}">${e(d[step.field]||'')}</textarea></label></details>`).join('')}</div><div class="row wrap mt">${button('Zum Schreiben wechseln '+icon('arrow'),'workshop-tab','data-tab="editor"')}${button('Materialien öffnen','workshop-tab','data-tab="materials"','secondary')}</div>`:tab==='materials'?`<section class="card"><h2>Drei Perspektiven auf deine Leitfrage</h2>${materialsHTML(t)}</section><section class="card mt"><h2>Muster, nicht fertige Abgabe</h2><p class="small muted">Die folgenden Abschnitte zeigen mögliche Formen. Sie sind kein vollständiger Kommentar im Zielumfang und keine einzig richtige Position.</p><div class="example-block"><h3>Mögliche Überschrift</h3><blockquote>${e(t.headline)}</blockquote></div><div class="example-block"><h3>Möglicher Einstieg</h3><p>${e(t.intro)}</p></div><div class="example-block"><h3>Beispiel für eine Argumentationsbewegung</h3><p>${e(t.argument)}</p></div><div class="example-block"><h3>Möglicher Schluss</h3><p>${e(t.ending)}</p></div></section>`:workshopGuide()}`;};
function workshopGuide(){return `<div class="grid two"><section class="card"><h2>Was ein Kommentar leistet</h2><p>Ein Kommentar nimmt zu einem Sachverhalt Stellung. Er erläutert Hintergründe, deutet Zusammenhänge und begründet eine erkennbare Meinung. Er kommentiert das Ereignis oder Problem, nicht bloß die Form eines Ausgangstextes.</p><p>Eine Erörterung untersucht eine Fragestellung häufig systematischer und nach einem deutlicher schulisch gegliederten Aufbau. Der Kommentar erlaubt eine freiere Reihenfolge, stärkere sprachliche Zuspitzung und eine kreative Überschrift. Trotzdem braucht er überprüfbare Gründe und einen roten Faden.</p></section><section class="card"><h2>Eine Position entwickeln</h2><p>Beantworte die Leitfrage zunächst in einem Satz. Eine differenzierte Position kann Bedingungen nennen: „Digitale Geräte sind sinnvoll, wenn …“ Prüfe, ob der Auftrag eine bestimmte Haltung vorgibt.</p><p>Denke Zielgruppe und Erscheinungsort mit. Eine Jugendseite erlaubt einen anderen Einstieg als eine fachliche Stellungnahme. Sachlich heißt nicht neutral: Du darfst werten, musst die Wertung aber begründen.</p></section><section class="card"><h2>Ein Argument entfalten</h2><div class="step-text"><span class="circle-num">1</span><p><b>Behauptung:</b> Welche Aussage stützt deine Position?</p></div><div class="step-text"><span class="circle-num">2</span><p><b>Begründung:</b> Warum ist die Aussage plausibel? Welcher Zusammenhang trägt sie?</p></div><div class="step-text"><span class="circle-num">3</span><p><b>Beleg oder Beispiel:</b> Was aus dem Material stützt sie? Ein Beispiel ersetzt nicht automatisch einen allgemeinen Nachweis.</p></div><div class="step-text"><span class="circle-num">4</span><p><b>Rückbindung:</b> Was folgt daraus für deine Leitfrage?</p></div></section><section class="card"><h2>Gegenargumente fair behandeln</h2><p>Gib einen relevanten Einwand in seiner starken Form wieder. Räume ein, was berechtigt ist. Erkläre dann, warum deine Position trotzdem trägt oder unter welchen Bedingungen sie angepasst werden muss.</p><div class="info">„Zwar können digitale Geräte den Zugriff erleichtern. Daraus folgt jedoch nicht, dass gedruckte Bücher entbehrlich sind. Unterschiedliche Lesesituationen verlangen unterschiedliche Zugänge.“</div></section><section class="card"><h2>Überschrift und Einleitung</h2><p>Eine Überschrift soll Interesse wecken und eine erste Perspektive andeuten. Metapher, Frage oder Gegensatz können helfen. Sie müssen zum Anliegen passen und dürfen nicht bloß spektakulär klingen.</p><p>Die Einleitung führt zu einem konkreten Sachverhalt und macht die Position erkennbar. Möglich sind eine kurze Szene, eine zugespitzte Beobachtung oder eine begründete Frage. Verwende nur überprüfbare, korrekt zugeordnete Zitate.</p></section><section class="card"><h2>Ein Schluss mit Funktion</h2><p>Der Schluss bekräftigt und verdichtet die Position. Er kann ein Einstiegsbild aufgreifen, eine Konsequenz zeigen oder einen begründeten Appell formulieren.</p><p>Vermeide neue Hauptargumente und eine bloße Wiederholung aller Absätze. Die letzte Aussage soll aus deiner Argumentation folgen, nicht nur gut klingen.</p></section></div><section class="card mt"><h2>Sprachliche Gestaltung aus deinen Unterlagen</h2><p>Schreibe sachlich, aber nicht neutral. Nutze rhetorische Mittel gezielt zur Unterstützung deiner Aussagen. Variiere die Länge und den Aufbau deiner Argumente. Umgangssprache ist in Maßen möglich, sofern Zielgruppe und Anlass passen.</p><p>Verwende überwiegend Präsens. Für Vorzeitigkeit kann je nach Zusammenhang Perfekt passen. Formuliere Materialien in eigenen Worten und kennzeichne übernommene Aussagen, etwa mit „(vgl. M2)“. Erfundene Studien, Zahlen und Zitate sind keine Belege.</p><div class="info">Ein gut gewähltes Stilmittel macht einen Gedanken präziser. Fünf unpassende Stilmittel machen ihn nicht automatisch überzeugender.</div></section>`;}
function persistDraft(el){const d=draft();d[el.dataset.field]=el.value;d.updatedAt=Date.now();const ok=S.save();const c=document.getElementById('draft-count');if(c)c.textContent=C.words(draftText(d))+' / ca. '+d.target+' Wörter';const saved=document.getElementById('draft-saved');if(saved)saved.textContent='Nur bis zum Neuladen';}
Object.assign(S.handlers,{
 'open-lab':el=>{const st=labState(el.dataset.id);if(S.ui.lessonActive){st.lessonId=S.ui.lessonActive;S.ui.lessonActive=null;S.save();}S.go('labtext/'+el.dataset.id);},
 'lab-word':el=>{const l=currentLab();if(!l)return;const st=labState(l.id),i=Number(el.dataset.index);let ar=st.pending.indices;st.pending.indices=ar.includes(i)?ar.filter(x=>x!==i):[...ar,i];S.save();S.render();},
 'lab-clear':()=>{labState(currentLab().id).pending.indices=[];S.save();S.render();},
 'lab-add':()=>{const l=currentLab(),st=labState(l.id),p=st.pending;if(!p.indices.length||!Q.by[p.term]){S.toast('Wähle eine Textstelle und einen Stilmittelbegriff.');return;}if(!p.effect.trim()||!p.fn.trim()){S.toast('Notiere eine Wirkung und eine Funktion im Zusammenhang.');return;}st.annotations.push({id:'a'+Date.now().toString(36),indices:[...p.indices],term:p.term,effect:p.effect.trim(),fn:p.fn.trim()});st.pending={indices:[],term:'',effect:'',fn:''};st.completed=false;S.save();S.render();S.toast('Eigener Befund gespeichert.');},
 'lab-remove':el=>{const st=labState(currentLab().id);st.annotations.splice(Number(el.dataset.index),1);st.completed=false;S.save();S.render();},
 'lab-reveal':()=>{const st=labState(currentLab().id);st.revealed=true;S.save();S.render();S.toast('Musterbefunde geöffnet. Vergleiche sie mit deiner eigenen Begründung.');},
 'lab-finish':()=>{const l=currentLab(),st=labState(l.id);if(C.words(st.analysis)<60||st.annotations.length<2){S.toast('Für den Abschluss: mindestens zwei eigene Befunde und eine zusammenhängende Analyse ab 60 Wörtern.');return;}if((st.criteria||[]).filter(Boolean).length<4){S.toast('Prüfe deine Analyse: Mindestens vier Kriterien sollten nach deiner ehrlichen Einschätzung erfüllt sein.');return;}st.completed=true;st.completedAt=Date.now();if(st.lessonId)S.state.lessons[st.lessonId]={done:true,self:true,at:Date.now()};const hash=C.hash(st.analysis+JSON.stringify(st.annotations));C.record(S.state,{id:'lab:'+l.id+':'+hash,term:st.annotations[0].term,mode:'lab',ratio:st.criteria.filter(Boolean).length/6,self:true,level:l.level,at:Date.now()});S.save();S.render();S.toast('Selbstkontrolle gespeichert'+(st.lessonId?' und Lernpfad aktualisiert.':'.'));},
 'effect-stage':el=>{S.ui.effectStage=Number(el.dataset.stage);S.render(false);},
 'effect-training':()=>S.startSession({mode:'effect',count:8,level:3,lessonId:S.ui.lessonActive||null}),
 'effect-check':()=>{const st=labState('effect-coach');if([0,1,2].some(i=>st.builder?.[i]===undefined||st.builder[i]==='')){S.toast('Wähle in jedem Feld eine Erklärung.');return;}st.builderResult=[0,1,2].filter(i=>String(st.builder[i])==='0').length;C.record(S.state,{id:'effect-builder:'+C.hash(JSON.stringify(st.builder)),term:'metapher',mode:'effect-builder',ratio:st.builderResult/3,level:3,at:Date.now()});if(S.ui.lessonActive&&st.builderResult===3)S.state.lessons[S.ui.lessonActive]={done:true,at:Date.now(),self:false};S.save();S.render();},
 'effect-model':()=>{const st=labState('effect-coach');if(!st.analysis.trim()){S.toast('Schreibe zuerst eine eigene Überarbeitung.');return;}st.revealed=true;S.save();S.render();},
 'workshop-tab':el=>{S.ui.workshopTab=el.dataset.tab;S.render(false);},
 'draft-mark':()=>{const d=draft(),term=document.getElementById('workshop-term').value,manual=document.getElementById('workshop-manual-quote').value.trim(),note=document.getElementById('workshop-mark-note').value.trim();let sel=S.ui.draftSelection;if(manual){sel=null;for(const field of ['intro','body','ending','title']){let pos=(d[field]||'').indexOf(manual);if(pos>=0){sel={field,start:pos,end:pos+manual.length,quote:manual};break;}}}if(!sel||!sel.quote||(d[sel.field]||'').slice(sel.start,sel.end)!==sel.quote){S.toast('Wähle eine aktuelle Textstelle oder gib einen genauen Ausschnitt aus deinem Entwurf ein.');return;}d.annotations.push({...sel,term,note});S.ui.draftSelection=null;S.save();S.render();S.toast('Deine Stilmittelzuordnung wurde gespeichert.');},
 'draft-unmark':el=>{draft().annotations.splice(Number(el.dataset.index),1);S.save();S.render();},
 'insert-material':el=>{let d=draft(),sel=S.ui.draftSelection,field=sel?.field||'body',text=d[field]||'',at=sel?.end??text.length,insert=' (vgl. '+el.dataset.ref+')';d[field]=text.slice(0,at)+insert+text.slice(at);d.updatedAt=Date.now();S.save();S.toast('Materialkennzeichnung im '+({intro:'Einleitungstext',body:'Hauptteil',ending:'Schluss',title:'Titel'}[field]||'Hauptteil')+' eingefügt.');},
 'draft-evaluate':()=>{const d=draft(),text=draftText(d),n=C.words(text),checked=d.checks.filter(Boolean).length,refs=['M1','M2','M3'].filter(m=>new RegExp('\\b'+m+'\\b').test(text));let complete=n>=d.target*.8&&checked>=8&&['title','intro','body','ending'].every(f=>d[f]?.trim());if(complete&&S.ui.lessonActive){S.state.lessons[S.ui.lessonActive]={done:true,self:true,at:Date.now()};S.ui.lessonActive=null;S.save();}S.dialog('Dein Entwurf im Kriterienraster',`<p><b>${n} Wörter</b> bei einem Übungsziel von etwa ${d.target}.</p><p><b>${checked} von ${D.checks.length} Kriterien</b> hast du selbst bestätigt.</p><p><b>Materialkennzeichnungen erkannt:</b> ${refs.length?refs.join(', '):'noch keine'}. Das prüft nur das Vorkommen der Zeichen, nicht die korrekte oder sinnvolle Materialnutzung.</p><p><b>${d.annotations.length} eigene Stilmittelmarkierungen</b> gespeichert.</p><div class="info ${complete?'good':'warning'}">${complete?'Der Entwurf hat ausreichenden Umfang und eine weitgehend ausgefüllte Selbstkontrolle. Eine zugeordnete Lernpfadlektion ist damit als Selbstkontrolle abgeschlossen.':'Für den praktischen Lernpfadabschluss braucht es mindestens 80 % des Zielumfangs, alle vier Textteile und mindestens acht ehrlich bestätigte Kriterien.'}</div><p class="small muted mt">Dies ist keine KI-Bewertung. Argumentationsqualität, Sprachrichtigkeit und tatsächliche Wirkung wurden nicht automatisch geprüft.</p>`);}
});
S.changes['lab-term']=el=>{labState(currentLab().id).pending.term=el.value;S.save();};
S.inputs['lab-effect']=el=>{labState(currentLab().id).pending.effect=el.value;S.save();};
S.inputs['lab-function']=el=>{labState(currentLab().id).pending.fn=el.value;S.save();};
S.inputs['lab-analysis']=el=>{const st=labState(currentLab().id);st.analysis=el.value;st.completed=false;S.save();document.getElementById('lab-wordcount').textContent=C.words(el.value)+' Wörter';};
S.changes['lab-criterion']=el=>{const st=labState(currentLab().id);st.criteria=st.criteria||[];st.criteria[Number(el.dataset.index)]=el.checked;S.save();};
S.inputs['effect-rewrite']=el=>{labState('effect-coach').analysis=el.value;S.save();};
S.changes['effect-criterion']=el=>{const st=labState('effect-coach');st.criteria=st.criteria||[];st.criteria[Number(el.dataset.index)]=el.checked;S.save();};
S.changes['effect-builder']=el=>{const st=labState('effect-coach');st.builder=st.builder||{};st.builder[el.dataset.index]=el.value;delete st.builderResult;S.save();};
S.changes['workshop-topic']=el=>{S.ui.draftTopic=el.value;S.state.settings.lastDraftTopic=el.value;S.save();S.ui.draftSelection=null;S.render(false);};
S.changes['workshop-target']=el=>{draft().target=Number(el.value);S.save();S.render();};
S.inputs['draft-input']=persistDraft;
S.changes['draft-check']=el=>{draft().checks[Number(el.dataset.index)]=el.checked;S.save();};
function capture(){let el=document.activeElement;if(el?.matches('textarea[data-input="draft-input"],#draft-title')){let a=el.selectionStart,b=el.selectionEnd;if(a!==b)S.ui.draftSelection={field:el.dataset.field,start:a,end:b,quote:el.value.slice(a,b)};}}
document.addEventListener('selectionchange',capture);document.addEventListener('pointerup',capture);document.addEventListener('keyup',capture);
})();
