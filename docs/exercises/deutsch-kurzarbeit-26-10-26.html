ert einen syntaktisch bereits abgeschlossenen Satz durch einen nachgestellten Zusatz.","recognize":"Prüfe, ob vor dem Nachtrag bereits ein vollständiger Satz steht. Verwechsle den Begriff nicht mit einer Epipher.","examples":[{"text":"Ich komme mit [[– aber nur heute]].","why":"„Ich komme mit“ ist vollständig; die zeitliche Einschränkung wird nachgetragen.","effect":"Die zunächst klare Zusage wird nachträglich begrenzt.","context":"Alltag"},{"text":"Die Technik muss allen dienen [[– auch denen ohne eigenes Gerät]].","why":"Der Hauptsatz ist abgeschlossen, bevor die ausdrücklich eingeschlossene Gruppe folgt.","effect":"Der Nachtrag konkretisiert das Wort „allen“ und macht eine sonst leicht übersehene Gruppe sichtbar.","context":"Kommentar / Rede"},{"text":"Er hatte alles zurückgelassen [[– bis auf die Angst]].","why":"Die vollständige Aussage erhält eine nachträgliche Ausnahme.","effect":"Die Korrektur des zunächst umfassenden „alles“ macht die Angst als unentrinnbaren Rest erfahrbar.","context":"Literarischer Modelltext"}],"effect":"Der Nachtrag konkretisiert das Wort „allen“ und macht eine sonst leicht übersehene Gruppe sichtbar.","confusion":[["parenthese","Die Parenthese wird in einen noch laufenden Satz eingeschoben; die Epiphrase schließt an einen schon vollständigen Satz an."],["epipher","Epipher bedeutet Wiederholung am Ende mehrerer Einheiten. Die ähnliche Schreibweise darf nicht täuschen."]],"counter":{"text":"Sie weiß, dass er kommt.","why":"Der Nebensatz ist das reguläre Objekt zu „weiß“, kein nachträglicher Zusatz zu einer schon vollständig bestimmten Aussage."},"memory":"Ein vollständiger Satz bekommt einen Nachtrag.","aliases":[],"classExample":"„Mein Retter seid Ihr und mein Engel.“ Die zweite Bezeichnung kann als nachgetragene Ergänzung verstanden werden.","exam":"Die Formulierung „Die Technik muss allen dienen – auch denen ohne eigenes Gerät.“ zeigt das sprachliche Mittel „Epiphrase“. Der Hauptsatz ist abgeschlossen, bevor die ausdrücklich eingeschlossene Gruppe folgt. Der Nachtrag konkretisiert das Wort „allen“ und macht eine sonst leicht übersehene Gruppe sichtbar."},{"id":"klimax","name":"Klimax","category":"satz","level":3,"material":true,"simple":"Mehrere Ausdrücke werden Schritt für Schritt stärker. Die Reihenfolge führt zu einem Höhepunkt.","definition":"Eine Klimax ist eine stufenweise Steigerung semantisch zusammenhängender Ausdrücke oder Aussagen.","recognize":"Benenne den Maßstab der Steigerung, etwa Intensität, Umfang oder Bedeutung. Eine bloße Aufzählung ist nicht genug.","examples":[{"text":"Sie [[flüsterte, sprach, schrie]].","why":"Die Lautstärke steigt in drei Stufen an.","effect":"Der Satz macht eine zunehmende Erregung hörbar vorstellbar.","context":"Alltag"},{"text":"Die Regel trifft [[eine Klasse, die ganze Schule, die gesamte Stadt]].","why":"Der Kreis der Betroffenen wird stufenweise größer.","effect":"Die Steigerung weitet den Blick und begründet, warum das Thema öffentliche Aufmerksamkeit verdient.","context":"Kommentar / Rede"},{"text":"Aus dem Zweifel wurde [[Unruhe, aus Unruhe Furcht, aus Furcht Entsetzen]].","why":"Die Gefühlsstärke nimmt mit jedem Glied zu; die Übergänge wiederholen zugleich das vorherige Schlusswort.","effect":"Die Folge lässt die Angst als sich aufbauenden Prozess erleben und führt auf einen emotionalen Höhepunkt.","context":"Literarischer Modelltext"}],"effect":"Die Steigerung weitet den Blick und begründet, warum das Thema öffentliche Aufmerksamkeit verdient.","confusion":[["hyperbel","Eine Klimax muss nicht übertreiben. „Leise, laut, lauter“ kann sachlich zutreffen."],["antiklimax","Antiklimax führt abwärts oder lässt den erwarteten Höhepunkt ins Geringfügige kippen."]],"counter":{"text":"Auf dem Tisch liegen Äpfel, Birnen und Pflaumen.","why":"Zwischen den Früchten besteht kein erkennbarer Steigerungsmaßstab."},"memory":"Nicht nur mehrere: in erkennbar steigender Ordnung.","aliases":[],"classExample":"„gut, besser, der Allerbeste“; „bunt, bunter, Stabilo“ ist eine werbliche, spielerisch abgewandelte Steigerung, nicht ohne Kontext zwingend Ironie.","exam":"Die Formulierung „Die Regel trifft eine Klasse, die ganze Schule, die gesamte Stadt.“ zeigt das sprachliche Mittel „Klimax“. Der Kreis der Betroffenen wird stufenweise größer. Die Steigerung weitet den Blick und begründet, warum das Thema öffentliche Aufmerksamkeit verdient."},{"id":"antiklimax","name":"Antiklimax","category":"satz","level":3,"material":false,"simple":"Eine Folge wird immer kleiner oder unwichtiger. Manchmal endet ein großer Anfang überraschend banal.","definition":"Eine Antiklimax ordnet Ausdrücke in absteigender Bedeutung oder Intensität oder lässt eine erwartete Steigerung in einen deutlich niedrigeren Bereich umschlagen.","recognize":"Benenne den abnehmenden Maßstab. Achte darauf, ob der Schluss eine Erwartung gezielt enttäuscht.","examples":[{"text":"Für den Urlaub plante er [[eine Weltreise, einen Ausflug, einen Gang zum Kiosk]].","why":"Der räumliche und organisatorische Umfang sinkt mit jedem Glied.","effect":"Die Folge macht den schrumpfenden Plan humorvoll sichtbar.","context":"Alltag"},{"text":"Versprochen wurden [[Bildungsgerechtigkeit, moderne Schulen und schließlich zwei neue Ladekabel]].","why":"Der Satz fällt von großen politischen Zielen zu einer kleinen Anschaffung ab.","effect":"Der banale Schluss legt die Lücke zwischen Anspruch und Umsetzung offen und erzeugt satirische Kritik.","context":"Kommentar / Rede"},{"text":"Er fürchtete [[den Untergang, die Niederlage, die nächste Rechnung]].","why":"Die Bedrohungen gehen vom umfassend Katastrophalen zum Alltäglichen über.","effect":"Der Abstieg bricht das Pathos und zeigt, wie existenzielle Angst in alltäglichen Sorgen landet.","context":"Literarischer Modelltext"}],"effect":"Der banale Schluss legt die Lücke zwischen Anspruch und Umsetzung offen und erzeugt satirische Kritik.","confusion":[["klimax","Die Richtung ist umgekehrt: Klimax steigert, Antiklimax senkt oder bricht die Steigerung."]],"counter":{"text":"Er flüstert, spricht, schreit.","why":"Die Intensität steigt; das ist eine Klimax."},"memory":"Der erwartete Höhepunkt wird zum Abstieg.","aliases":[],"classExample":"Ergänzung zum fotografierten Unterrichtsstoff.","exam":"Die Formulierung „Versprochen wurden Bildungsgerechtigkeit, moderne Schulen und schließlich zwei neue Ladekabel.“ zeigt das sprachliche Mittel „Antiklimax“. Der Satz fällt von großen politischen Zielen zu einer kleinen Anschaffung ab. Der banale Schluss legt die Lücke zwischen Anspruch und Umsetzung offen und erzeugt satirische Kritik."},{"id":"rhetorische-frage","name":"Rhetorische Frage","category":"ansprache","level":2,"material":true,"simple":"Eine Frage wird gestellt, obwohl keine offene Antwort erwartet wird. Sie soll eine bestimmte Antwort nahelegen.","definition":"Eine rhetorische Frage hat die Form einer Frage, dient im Kontext aber vor allem als indirekte Behauptung, Aufforderung oder Bekräftigung.","recognize":"Prüfe die Gesprächssituation: Wird wirklich eine unbekannte Information erfragt oder erscheint die Antwort als bereits feststehend?","examples":[{"text":"Vor einem völlig vollen Rucksack: [[Soll ich etwa noch den Schrank einpacken?]]","why":"Die Frage erwartet keine Packanweisung. Sie behauptet indirekt, dass die Forderung überzogen ist.","effect":"Sie weist die Erwartung zurück und betont die bereits erreichte Grenze.","context":"Alltag"},{"text":"[[Wer möchte in einer Schule lernen, in der niemand zuhört?]]","why":"Die Rede legt „niemand“ als Antwort nahe, statt eine Befragung zu beginnen.","effect":"Die Frage bindet das Publikum an die Forderung nach einer respektvollen Gesprächskultur.","context":"Kommentar / Rede"},{"text":"[[Wozu noch rufen, wenn selbst das Echo ihn verlassen hatte?]]","why":"Der Kontext legt die Aussichtslosigkeit einer weiteren Suche nahe.","effect":"Die Frage lässt die Resignation der Figur als inneren Gedankengang hervortreten.","context":"Literarischer Modelltext"}],"effect":"Die Frage bindet das Publikum an die Forderung nach einer respektvollen Gesprächskultur.","confusion":[["anrede","Eine Anrede benennt die Angesprochenen. Eine rhetorische Frage kann sich an sie richten, muss sie aber nicht ausdrücklich nennen."]],"counter":{"text":"Wann fährt der nächste Bus? Die Person kennt die Abfahrtszeit nicht.","why":"Hier wird wirklich eine fehlende Information gesucht."},"memory":"Frageform, aber keine ergebnisoffene Nachfrage.","aliases":[],"classExample":"„Wer glaubt denn das noch?“","exam":"Die Formulierung „Wer möchte in einer Schule lernen, in der niemand zuhört?“ zeigt das sprachliche Mittel „Rhetorische Frage“. Die Rede legt „niemand“ als Antwort nahe, statt eine Befragung zu beginnen. Die Frage bindet das Publikum an die Forderung nach einer respektvollen Gesprächskultur."},{"id":"anrede","name":"Anrede","category":"ansprache","level":2,"material":true,"simple":"Der Text spricht sein Publikum direkt an. Man merkt, an wen die Worte gerichtet sind.","definition":"Eine Anrede bezeichnet oder adressiert die angesprochene Person oder Gruppe ausdrücklich.","recognize":"Suche Namen, Anredeformeln oder direkte Bezeichnungen des Publikums. Erkläre, welche Beziehung dadurch hergestellt wird.","examples":[{"text":"[[Liebe Lea]], kannst du mir helfen?","why":"Die Angesprochene wird unmittelbar benannt.","effect":"Die Bitte richtet sich persönlich an eine bestimmte Person.","context":"Alltag"},{"text":"[[Liebe Mitschülerinnen und Mitschüler]], diese Entscheidung betrifft uns alle.","why":"Die Rede benennt ihre unmittelbare Zielgruppe.","effect":"Die Anrede schafft einen gemeinsamen Bezugsrahmen und bereitet die Aufforderung zur Beteiligung vor.","context":"Kommentar / Rede"},{"text":"[[Du, meine ferne Schwester]], hörst du das Meer in diesen Zeilen?","why":"Die angesprochene Person ist abwesend; dadurch ist zugleich die speziellere Apostrophe möglich.","effect":"Der direkte Bezug überbrückt sprachlich die räumliche Trennung und macht die Sehnsucht persönlich.","context":"Literarischer Modelltext"}],"effect":"Die Anrede schafft einen gemeinsamen Bezugsrahmen und bereitet die Aufforderung zur Beteiligung vor.","confusion":[["apostrophe","Apostrophe ist die besondere Hinwendung zu Abwesenden, Toten oder nichtmenschlichen Instanzen. Nicht jede gewöhnliche Publikumsanrede ist eine Apostrophe."]],"counter":{"text":"Die Klasse wartet im Raum.","why":"Die Klasse wird erwähnt, aber nicht angesprochen."},"memory":"Über jemanden sprechen ist nicht dasselbe wie jemanden ansprechen.","aliases":[],"classExample":"„Meine Damen und Herren …“; „Mensch Leute, jetzt seid doch mal leise …“","exam":"Die Formulierung „Liebe Mitschülerinnen und Mitschüler, diese Entscheidung betrifft uns alle.“ zeigt das sprachliche Mittel „Anrede“. Die Rede benennt ihre unmittelbare Zielgruppe. Die Anrede schafft einen gemeinsamen Bezugsrahmen und bereitet die Aufforderung zur Beteiligung vor."},{"id":"ausruf","name":"Ausruf","category":"ansprache","level":2,"material":true,"simple":"Eine Äußerung bringt ein Gefühl besonders deutlich zum Ausdruck. Sie kann Freude, Ärger oder Erstaunen zeigen.","definition":"Ein Ausruf beziehungsweise eine Exclamatio ist eine affektiv hervorgehobene Äußerung, häufig in exklamativer Form und mit Ausrufezeichen.","recognize":"Bestimme das ausgedrückte Gefühl. Ein Ausrufezeichen ist ein Indiz, aber nicht allein die ganze Analyse.","examples":[{"text":"[[Was für ein schöner Tag!]]","why":"Die Äußerung stellt keine Frage, sondern drückt begeisterte Bewertung aus.","effect":"Die Freude wird unmittelbar und lebhaft vermittelt.","context":"Alltag"},{"text":"[[Wie kurzsichtig ist diese Entscheidung!]]","why":"Die exklamative Form drückt starke Kritik aus.","effect":"Der Kommentar setzt eine klare Wertung und fordert das Publikum zur emotionalen Stellungnahme auf.","context":"Kommentar / Rede"},{"text":"[[Endlich, endlich Licht!]]","why":"Die verkürzte Äußerung verbindet Ausruf, Wiederholung und Ellipse.","effect":"Die plötzliche Erleichterung tritt in den Vordergrund; die vorangehende Dunkelheit erscheint als belastend.","context":"Literarischer Modelltext"}],"effect":"Der Kommentar setzt eine klare Wertung und fordert das Publikum zur emotionalen Stellungnahme auf.","confusion":[["imperativ","Imperativ fordert zu einer Handlung auf; Ausruf kann nur ein Gefühl äußern."],["emphase","Emphase hebt einen Ausdruck nachdrücklich hervor. Ein Ausruf ist eine mögliche Form, aber nicht die einzige."]],"counter":{"text":"Heute ist ein schöner Tag.","why":"Die neutrale Feststellung hat ohne weitere Markierung keine ausgeprägte Ausrufform."},"memory":"Gefühl in hervorgehobener Äußerungsform.","aliases":["Exclamatio"],"classExample":"„Ach! Weh uns!“","exam":"Die Formulierung „Wie kurzsichtig ist diese Entscheidung!“ zeigt das sprachliche Mittel „Ausruf“. Die exklamative Form drückt starke Kritik aus. Der Kommentar setzt eine klare Wertung und fordert das Publikum zur emotionalen Stellungnahme auf."},{"id":"imperativ","name":"Befehl / Imperativ","category":"ansprache","level":2,"material":true,"simple":"Jemand wird zu einer Handlung aufgefordert. Das kann ein Befehl, aber auch eine Bitte oder ein Rat sein.","definition":"Der Imperativ ist eine grammatische Aufforderungsform. Rhetorisch kann er unter anderem appellieren, anweisen, warnen oder um etwas bitten.","recognize":"Suche auffordernde Verbformen wie „lies“ oder „hört“. Unterscheide die Form von der sozialen Funktion: Nicht jeder Imperativ ist ein schroffer Befehl.","examples":[{"text":"[[Schließ bitte die Tür]].","why":"„Schließ“ ist eine Aufforderungsform; „bitte“ mildert ihren Ton.","effect":"Die angesprochene Person soll unmittelbar handeln, ohne dass der Satz zwingend herrisch wirkt.","context":"Alltag"},{"text":"[[Prüft die Quelle]], bevor ihr die Nachricht teilt.","why":"Der Imperativ weist dem Publikum eine konkrete Handlung zu.","effect":"Der Kommentar übersetzt die Forderung nach Verantwortung in einen überprüfbaren Handlungsschritt.","context":"Kommentar / Rede"},{"text":"[[Bleib]], flüsterte sie, als die Schritte schon verklangen.","why":"Die Aufforderungsform verlangt das Verbleiben einer Person.","effect":"Im leisen, verspäteten Kontext wirkt sie eher wie eine verzweifelte Bitte als wie ein durchsetzbarer Befehl.","context":"Literarischer Modelltext"}],"effect":"Der Kommentar übersetzt die Forderung nach Verantwortung in einen überprüfbaren Handlungsschritt.","confusion":[["ausruf","„Was für ein Tag!“ äußert ein Gefühl, fordert aber keine Handlung."],["rhetorische-frage","Auch eine Frage kann indirekt auffordern. Der Imperativ ist dagegen eine ausdrücklich auffordernde grammatische Form."]],"counter":{"text":"Sie schließt die Tür.","why":"Die Aussage beschreibt eine Handlung und fordert nicht zu ihr auf."},"memory":"Auffordern heißt nicht automatisch befehlen.","aliases":["Befehl","Imperativ","Aufforderung"],"classExample":"„Geh!“","exam":"Die Formulierung „Prüft die Quelle, bevor ihr die Nachricht teilt.“ zeigt das sprachliche Mittel „Befehl / Imperativ“. Der Imperativ weist dem Publikum eine konkrete Handlung zu. Der Kommentar übersetzt die Forderung nach Verantwortung in einen überprüfbaren Handlungsschritt."},{"id":"emphase","name":"Emphase","category":"ansprache","level":3,"material":true,"simple":"Ein Wort wird besonders nachdrücklich hervorgehoben. Im Text kann das durch Wiederholung, Stellung oder Zuspitzung geschehen.","definition":"Emphase bezeichnet die nachdrückliche Hervorhebung eines Ausdrucks, oft mit einer gegenüber der neutralen Verwendung intensivierten Bedeutung.","recognize":"Benenne das konkret hervorgehobene Wort und das sprachliche Signal. Nicht jede wichtige Aussage ist schon Emphase.","examples":[{"text":"Ich brauche [[Ruhe. Wirklich Ruhe]].","why":"Der zentrale Begriff wird isoliert und ausdrücklich verstärkt wiederholt.","effect":"Das Bedürfnis erhält Nachdruck und soll nicht als beiläufiger Wunsch verstanden werden.","context":"Alltag"},{"text":"Es geht hier um [[Menschen]], nicht um bloße Kennzahlen.","why":"„Menschen“ wird durch den Kontrast zu Kennzahlen mit besonderem ethischen Gewicht aufgeladen.","effect":"Die Hervorhebung verlangt, individuelle Folgen in die Entscheidung einzubeziehen und nicht nur messbare Ergebnisse.","context":"Kommentar / Rede"},{"text":"Ein [[Zuhause]] wollte sie, nicht nur ein Dach.","why":"„Zuhause“ meint emphatisch mehr als eine Unterkunft: Zugehörigkeit und Geborgenheit.","effect":"Die verstärkte Bedeutung macht die emotionale Dimension ihrer Suche sichtbar.","context":"Literarischer Modelltext"}],"effect":"Die Hervorhebung verlangt, individuelle Folgen in die Entscheidung einzubeziehen und nicht nur messbare Ergebnisse.","confusion":[["ausruf","Emphase kann ohne Ausrufezeichen entstehen. Ein Ausruf ist eine bestimmte Äußerungsform."],["repetitio","Wiederholung kann Emphase erzeugen, ist aber nur eines von mehreren möglichen Mitteln."]],"counter":{"text":"Die Tabelle enthält zwanzig Zeilen.","why":"Ohne weitere Markierung ist kein Ausdruck besonders nachdrücklich hervorgehoben."},"memory":"Welches Wort wird wie besonders gewichtig?","aliases":[],"classExample":"„Menschen! Menschen!“ – Nachdruck im Zusammenhang mit der folgenden Wertung.","exam":"Die Formulierung „Es geht hier um Menschen, nicht um bloße Kennzahlen.“ zeigt das sprachliche Mittel „Emphase“. „Menschen“ wird durch den Kontrast zu Kennzahlen mit besonderem ethischen Gewicht aufgeladen. Die Hervorhebung verlangt, individuelle Folgen in die Entscheidung einzubeziehen und nicht nur messbare Ergebnisse."},{"id":"neologismus","name":"Neologismus","category":"wort","level":3,"material":true,"simple":"Ein neues Wort oder eine neue Wortbedeutung wird gebildet. Damit lässt sich etwas neuartig benennen.","definition":"Ein Neologismus ist eine im jeweiligen sprachgeschichtlichen Kontext neue Wortbildung oder Wortbedeutung; kreative Einmalbildungen werden als okkasionelle Neubildungen genauer unterschieden.","recognize":"Begründe die Neuheit im Entstehungskontext. Ein Wort ist nicht neu, nur weil du es noch nicht kennst.","examples":[{"text":"Nach dem Lernen bin ich im [[Gedankenstauzimmer]].","why":"Das eigens gebildete Kompositum verbindet Gedanken, Stau und Zimmer zu einer neuen Benennung.","effect":"Die Neubildung macht die überfüllte innere Lage spielerisch anschaulich.","context":"Alltag"},{"text":"Wir brauchen keine [[Klickgehorsamkeit]], sondern begründete Entscheidungen.","why":"Der Modelltext bildet das Wort aus „Klick“ und „Gehorsamkeit“.","effect":"Die Wortschöpfung kritisiert unreflektiertes digitales Mitmachen und stellt ihm selbstständiges Denken gegenüber.","context":"Kommentar / Rede"},{"text":"Ein [[Erinnerungsflimmern]] lag über dem verlassenen Garten.","why":"Die neue Zusammensetzung verbindet Erinnerung mit einem flüchtigen optischen Eindruck.","effect":"Die Wortbildung verdichtet eine unsichere, bewegliche Wahrnehmung der Vergangenheit.","context":"Literarischer Modelltext"}],"effect":"Die Wortschöpfung kritisiert unreflektiertes digitales Mitmachen und stellt ihm selbstständiges Denken gegenüber.","confusion":[["archaismus","Archaismus ist im Entstehungskontext veraltet; Neologismus ist neu."],["metapher","Eine Neubildung kann zugleich metaphorisch sein. Neuheit und Übertragung sind verschiedene Merkmale."]],"counter":{"text":"Das heute geläufige Wort „Smartphone“ wird in einem aktuellen Alltagssatz benutzt.","why":"Die frühere Neuheit macht ein längst etabliertes Wort nicht dauerhaft zum aktuellen Neologismus."},"memory":"Neu im damaligen Kontext, nicht nur neu für dich.","aliases":[],"classExample":"„Smombie“; „Wutbürger“. Solche Wörter sind nur im jeweiligen Entstehungskontext neu.","exam":"Die Formulierung „Wir brauchen keine Klickgehorsamkeit, sondern begründete Entscheidungen.“ zeigt das sprachliche Mittel „Neologismus“. Der Modelltext bildet das Wort aus „Klick“ und „Gehorsamkeit“. Die Wortschöpfung kritisiert unreflektiertes digitales Mitmachen und stellt ihm selbstständiges Denken gegenüber."},{"id":"archaismus","name":"Archaismus","category":"wort","level":3,"material":true,"simple":"Ein absichtlich alt wirkendes Wort wird verwendet. Es gehört im Entstehungszeitpunkt nicht mehr zum gewöhnlichen Sprachgebrauch.","definition":"Ein Archaismus ist ein zur Entstehungszeit des Textes bereits veralteter sprachlicher Ausdruck oder eine veraltete Form.","recognize":"Bestimme den zeitlichen Bezug. Ein heute alter Text verwendet nicht automatisch Archaismen, wenn seine Sprache damals üblich war.","examples":[{"text":"In einem heutigen Gespräch: „Ich muss jetzt [[hinfort]].“","why":"„Hinfort“ ist gegenüber heutigen alltäglichen Alternativen deutlich altertümlich markiert.","effect":"Die Wortwahl kann scherzhaft feierlich oder bewusst altmodisch wirken.","context":"Alltag"},{"text":"Die Schule ist kein [[Obrigkeitsstaat]]. Wir brauchen keine Befehle nach dem Muster „Ihr [[sollet]] gehorchen“.","why":"Die altertümliche Verbform „sollet“ wird in einer heutigen Kritik bewusst zitiert.","effect":"Der historische Ton verbindet autoritäre Erwartungen mit einem überholten Rollenverständnis.","context":"Kommentar / Rede"},{"text":"Ein [[güldner]] Schein lag auf dem Wasser, schrieb die heutige Erzählerin.","why":"Die ältere Form wird im heutigen Entstehungskontext bewusst statt „goldener“ eingesetzt.","effect":"Sie verleiht der Szene einen märchenhaften, historisierenden Klang.","context":"Literarischer Modelltext"}],"effect":"Der historische Ton verbindet autoritäre Erwartungen mit einem überholten Rollenverständnis.","confusion":[["neologismus","Beide Begriffe sind zeitabhängig, aber in entgegengesetzter Richtung."]],"counter":{"text":"Ein mittelalterlicher Text verwendet ein damals gewöhnliches Wort.","why":"Heute veraltet zu sein genügt nicht: Entscheidend ist der Sprachgebrauch in seiner eigenen Entstehungszeit."},"memory":"Schon damals veraltet, nicht bloß heute alt.","aliases":[],"classExample":"„Wams“; „gülden“. Entscheidend ist jeweils die Entstehungszeit des Textes.","exam":"Die Formulierung „Die Schule ist kein Obrigkeitsstaat. Wir brauchen keine Befehle nach dem Muster „Ihr sollet gehorchen“.“ zeigt das sprachliche Mittel „Archaismus“. Die altertümliche Verbform „sollet“ wird in einer heutigen Kritik bewusst zitiert. Der historische Ton verbindet autoritäre Erwartungen mit einem überholten Rollenverständnis."},{"id":"onomatopoesie","name":"Onomatopoesie","category":"wort","level":3,"material":true,"simple":"Wörter ahmen Geräusche nach. Ihr Klang erinnert an das, was sie bezeichnen.","definition":"Onomatopoesie beziehungsweise Lautmalerei gestaltet sprachliche Ausdrücke so, dass ihr Lautbild ein bezeichnetes Geräusch nachahmt oder nahelegt.","recognize":"Sprich den Ausdruck aus und benenne das nachgeahmte Geräusch. Ein allgemeiner Gleichklang ist noch keine Lautmalerei.","examples":[{"text":"[[Platsch!]] Der Stein fällt ins Wasser.","why":"Die Lautfolge ahmt das Geräusch des Aufpralls im Wasser nach.","effect":"Das Ereignis wird akustisch unmittelbar vorstellbar.","context":"Alltag"},{"text":"[[Ping, ping, ping]]: Jede Meldung unterbricht den Unterricht.","why":"Das Signalwort bildet die kurzen Benachrichtigungstöne nach.","effect":"Der Kommentar lässt die wiederholte Störung hörbar werden und begründet so den Wunsch nach Ruhephasen.","context":"Kommentar / Rede"},{"text":"Im Ofen [[knisterte und knackte]] das letzte Holz.","why":"Die Lautgestalt der Verben erinnert an kurze trockene Geräusche des Feuers.","effect":"Die Szene gewinnt einen akustischen Hintergrund, der Nähe und körperliche Wahrnehmung vermittelt.","context":"Literarischer Modelltext"}],"effect":"Der Kommentar lässt die wiederholte Störung hörbar werden und begründet so den Wunsch nach Ruhephasen.","confusion":[["alliteration","Gleiche Anfangslaute können melodisch sein, ohne ein konkretes Geräusch nachzuahmen."]],"counter":{"text":"Mia malt Muster.","why":"Die m-Laute wiederholen sich, ahmen aber kein bezeichnetes Geräusch nach."},"memory":"Das Wort lässt ein Geräusch hören.","aliases":["Lautmalerei","Onomatopöie","Onomatopoiie"],"classExample":"„Es knistert und knastert“; „Die Katze miaut.“","exam":"Die Formulierung „Ping, ping, ping: Jede Meldung unterbricht den Unterricht.“ zeigt das sprachliche Mittel „Onomatopoesie“. Das Signalwort bildet die kurzen Benachrichtigungstöne nach. Der Kommentar lässt die wiederholte Störung hörbar werden und begründet so den Wunsch nach Ruhephasen."},{"id":"allusion","name":"Allusion","category":"wort","level":3,"material":true,"simple":"Ein Text spielt auf etwas Bekanntes an, ohne alles zu erklären. Man versteht mehr, wenn man den Bezug erkennt.","definition":"Eine Allusion ist eine indirekte Anspielung auf bekannte Texte, Personen, Ereignisse oder kulturelle Zusammenhänge.","recognize":"Benenne den Bezug und zeige das Textsignal. Eine bloße Ähnlichkeit ohne Anhaltspunkt ist keine sichere Anspielung.","examples":[{"text":"Nach der misslungenen Reparatur: Das war mein [[Waterloo]].","why":"Die Formulierung spielt auf die historisch bekannte Niederlage Napoleons an.","effect":"Die persönliche Niederlage wird durch den bekannten Bezug zugespitzt, oft auch selbstironisch.","context":"Alltag"},{"text":"[[Sein oder online sein]]: So eng dürfen wir die Frage nach Teilhabe nicht stellen.","why":"Die Formulierung verändert die bekannte Shakespeare-Frage „Sein oder Nichtsein“.","effect":"Die Anspielung verleiht der scheinbar alltäglichen Frage kulturelles Gewicht und macht zugleich die falsche Alternative sichtbar.","context":"Kommentar / Rede"},{"text":"Sie wartete auf einen [[Faden durch dieses Labyrinth]].","why":"Die Kombination aus Faden und Labyrinth ruft den Mythos vom Ariadnefaden auf.","effect":"Die Orientierungslosigkeit wird mit einem kulturell bekannten Bild des rettenden Weges verbunden.","context":"Literarischer Modelltext"}],"effect":"Die Anspielung verleiht der scheinbar alltäglichen Frage kulturelles Gewicht und macht zugleich die falsche Alternative sichtbar.","confusion":[["metapher","Eine Allusion setzt einen erkennbaren Bezug zu Vorwissen voraus; eine Metapher kann ohne bestimmten Prätext funktionieren."],["wortspiel","Veränderte bekannte Formulierungen können gleichzeitig Anspielung und Wortspiel sein."]],"counter":{"text":"Er findet einen Faden auf dem Boden.","why":"Ohne weitere Signale ist das keine begründbare Anspielung auf einen Mythos."},"memory":"Bekannter Bezug, nur angedeutet.","aliases":[],"classExample":"„sein Waterloo erleben“","exam":"Die Formulierung „Sein oder online sein: So eng dürfen wir die Frage nach Teilhabe nicht stellen.“ zeigt das sprachliche Mittel „Allusion“. Die Formulierung verändert die bekannte Shakespeare-Frage „Sein oder Nichtsein“. Die Anspielung verleiht der scheinbar alltäglichen Frage kulturelles Gewicht und macht zugleich die falsche Alternative sichtbar."},{"id":"wortspiel","name":"Wortspiel","category":"wort","level":3,"material":true,"simple":"Mit verschiedenen Bedeutungen oder ähnlichen Klängen wird gespielt. Ein Ausdruck lässt sich überraschend doppelt verstehen.","definition":"Ein Wortspiel nutzt Mehrdeutigkeit, Lautähnlichkeit oder gezielte Veränderung von Wörtern und Wendungen für einen überraschenden Bedeutungswechsel.","recognize":"Erkläre die beiden Lesarten oder die veränderte Vorlage. Nur zu sagen „klingt lustig“ reicht nicht.","examples":[{"text":"Der Bäcker [[kriegt es gebacken]].","why":"Die Wendung bedeutet etwas schaffen und passt zugleich wörtlich zum Backen.","effect":"Der Doppelsinn erzeugt einen leicht verständlichen humorvollen Effekt.","context":"Alltag"},{"text":"Wer Bildung [[abschreibt]], sollte nicht nur an Kopieren denken.","why":"„Abschreiben“ kann Kopieren oder das Aufgeben einer Sache bedeuten.","effect":"Der Bedeutungswechsel lenkt von einer technischen Handlung zur gesellschaftlichen Geringschätzung von Bildung.","context":"Kommentar / Rede"},{"text":"Sie war [[außer sich]], und zum ersten Mal fand sie dort Ruhe.","why":"Die feste Wendung für starke Erregung wird räumlich weitergeführt, als gäbe es ein „dort“ außerhalb des Selbst.","effect":"Die Umdeutung macht eine innere Entfremdung überraschend sichtbar und bricht die gewohnte Redensart auf.","context":"Literarischer Modelltext"}],"effect":"Der Bedeutungswechsel lenkt von einer technischen Handlung zur gesellschaftlichen Geringschätzung von Bildung.","confusion":[["zeugma","Zeugma ist ein bestimmter Bau mit gemeinsamem Satzglied. Ein Wortspiel kann auch ohne diese Konstruktion entstehen."]],"counter":{"text":"Der Bäcker backt ein Brot.","why":"Es liegt nur die wörtliche Bedeutung vor; ein zweiter Sinn wird nicht aktiviert."},"memory":"Zwei Bedeutungen treffen in einer Formulierung zusammen.","aliases":[],"classExample":"„Wer nie vom Weg abkommt, bleibt auf der Strecke!“","exam":"Die Formulierung „Wer Bildung abschreibt, sollte nicht nur an Kopieren denken.“ zeigt das sprachliche Mittel „Wortspiel“. „Abschreiben“ kann Kopieren oder das Aufgeben einer Sache bedeuten. Der Bedeutungswechsel lenkt von einer technischen Handlung zur gesellschaftlichen Geringschätzung von Bildung."},{"id":"synonym","name":"Synonym","category":"wort","level":2,"material":true,"simple":"Zwei Wörter haben dieselbe oder eine sehr ähnliche Bedeutung. Im Zusammenhang können ihre Nuancen trotzdem wichtig sein.","definition":"Synonyme sind Ausdrücke mit gleicher oder ähnlicher Bedeutung; vollständige Austauschbarkeit in allen Kontexten ist selten. Synonymie ist zunächst eine Bedeutungsbeziehung, keine automatische rhetorische Figur.","recognize":"Prüfe, ob die Wörter im konkreten Zusammenhang dasselbe bezeichnen. Beachte Unterschiede in Ton, Wertung und Gebrauch.","examples":[{"text":"Das Licht [[leuchtet]]; anders gesagt: Es [[scheint]].","why":"Die Verben liegen im beschriebenen Kontext semantisch nahe beieinander.","effect":"Der Wechsel kann Wiederholung vermeiden, ohne den Gegenstand zu verändern.","context":"Alltag"},{"text":"Der Entwurf ist [[mutig]], seine Umsetzung [[couragiert]].","why":"Die beiden Adjektive bringen ähnliche positive Bewertungen mit leicht unterschiedlichem Ton zum Ausdruck.","effect":"Die Variation führt die zustimmende Wertung fort, ohne exakt dasselbe Wort zu wiederholen.","context":"Kommentar / Rede"},{"text":"Er [[ging]] durch die Stadt, [[schritt]] über den Platz, [[wanderte]] am Fluss entlang.","why":"Die Verben gehören zum Bereich der Fortbewegung, setzen aber unterschiedliche Nuancen; sie sind nur kontextuell annähernd synonym.","effect":"Die Variation verhindert monotone Wiederholung und differenziert Tempo und Haltung der Bewegung.","context":"Literarischer Modelltext"}],"effect":"Die Variation führt die zustimmende Wertung fort, ohne exakt dasselbe Wort zu wiederholen.","confusion":[["tautologie","Synonyme können eine Tautologie bilden, wenn sie redundant nebeneinander dieselbe Aussage wiederholen. Jeder Synonymwechsel ist aber noch keine Tautologie."]],"counter":{"text":"Hell und dunkel","why":"Die Wörter stehen in einem Gegensatz statt in einer Bedeutungsähnlichkeit."},"memory":"Ähnlicher Sinn heißt nicht immer völlig austauschbar.","aliases":["Synonymie"],"classExample":"„leuchten“ für „scheinen“","exam":"Die Formulierung „Der Entwurf ist mutig, seine Umsetzung couragiert.“ zeigt das sprachliche Mittel „Synonym“. Die beiden Adjektive bringen ähnliche positive Bewertungen mit leicht unterschiedlichem Ton zum Ausdruck. Die Variation führt die zustimmende Wertung fort, ohne exakt dasselbe Wort zu wiederholen."},{"id":"sarkasmus","name":"Sarkasmus","category":"gegensatz","level":3,"material":false,"simple":"Sarkasmus ist scharfer, oft verletzender Spott. Er kann ironisch formuliert sein, muss es aber nicht.","definition":"Sarkasmus bezeichnet beißenden, bitteren oder herabsetzenden Spott als Haltung beziehungsweise Äußerungsweise, nicht eine festgelegte grammatische Form.","recognize":"Prüfe die angreifende oder verletzende Stoßrichtung. Unterscheide sie davon, ob die Formulierung auch ironisch das Gegenteil sagt.","examples":[{"text":"Nach einem Fehler: „[[Dein Plan ist so nutzlos wie ein Regenschirm mit Löchern]].“","why":"Die direkte Abwertung ist spöttisch und verletzend; es wird nicht das Gegenteil eines Lobes gemeint.","effect":"Die Äußerung setzt die angesprochene Person herab und kann die Gesprächsbereitschaft zerstören.","context":"Alltag"},{"text":"Nach jahrelanger Untätigkeit: „[[Beeindruckend, wie entschlossen man hier nichts tut]].“","why":"Das scheinbare Lob wird mit offener Kritik verbunden. Die Äußerung ist zugleich ironisch und sarkastisch.","effect":"Der Spott verschärft den Angriff auf die Verantwortlichen, kann aber auch sachliche Verständigung erschweren.","context":"Kommentar / Rede"},{"text":"„[[Dein großes Herz hat offenbar nur Platz für dich selbst]]“, sagte sie.","why":"Der Bezug auf ein „großes Herz“ wird in eine scharfe Kritik an Selbstbezogenheit verkehrt.","effect":"Der Satz zeigt eine verletzte Beziehung und greift das moralische Selbstbild der anderen Person an.","context":"Literarischer Modelltext"}],"effect":"Der Spott verschärft den Angriff auf die Verantwortlichen, kann aber auch sachliche Verständigung erschweren.","confusion":[["ironie","Ironie betrifft die Differenz zwischen Gesagtem und Gemeintem. Sarkasmus betrifft den scharfen Spott. Beide können, müssen aber nicht zusammen auftreten."]],"counter":{"text":"Der Plan berücksichtigt die Kosten nicht.","why":"Sachliche Kritik ist ohne spöttische oder verletzende Zuspitzung kein Sarkasmus."},"memory":"Ironie ist eine Form; Sarkasmus ist scharfer Spott.","aliases":[],"classExample":"Ergänzung zum fotografierten Unterrichtsstoff.","exam":"Die Formulierung „Nach jahrelanger Untätigkeit: „Beeindruckend, wie entschlossen man hier nichts tut.““ zeigt das sprachliche Mittel „Sarkasmus“. Das scheinbare Lob wird mit offener Kritik verbunden. Die Äußerung ist zugleich ironisch und sarkastisch. Der Spott verschärft den Angriff auf die Verantwortlichen, kann aber auch sachliche Verständigung erschweren."},{"id":"apostrophe","name":"Apostrophe","category":"ansprache","level":3,"material":true,"simple":"Der Text wendet sich plötzlich an jemanden Abwesenden oder an etwas, das nicht antworten kann. Das darf auch eine Idee sein.","definition":"Eine Apostrophe ist die rhetorische Hinwendung zu Abwesenden, Verstorbenen, Dingen oder abstrakten Instanzen, die als ansprechbar behandelt werden.","recognize":"Prüfe, wer angesprochen wird und ob diese Instanz in der tatsächlichen Kommunikationssituation antworten könnte.","examples":[{"text":"[[O Zeit, bleib kurz stehen!]]","why":"Die abstrakte Zeit wird wie ein ansprechbares Gegenüber angerufen.","effect":"Das unerfüllbare Ansprechen macht den Wunsch nach einer Pause emotional deutlich.","context":"Alltag"},{"text":"[[Zukunft, was werden wir dir hinterlassen?]]","why":"Die Zukunft wird direkt als Gegenüber angesprochen, obwohl sie keine reale Gesprächspartnerin ist.","effect":"Die Rede vergegenwärtigt die Folgen heutiger Entscheidungen und bindet Verantwortung an kommende Generationen.","context":"Kommentar / Rede"},{"text":"[[Du schweigendes Meer, bewahre ihre Namen]].","why":"Ein Naturraum wird angesprochen und erhält die Aufgabe des Erinnerns.","effect":"Die unerwiderbare Anrede macht Trauer und den Wunsch nach bleibendem Gedenken eindringlich.","context":"Literarischer Modelltext"}],"effect":"Die Rede vergegenwärtigt die Folgen heutiger Entscheidungen und bindet Verantwortung an kommende Generationen.","confusion":[["anrede","Die gewöhnliche Anrede richtet sich an das reale Publikum. Apostrophe benennt eine besondere, oft unmögliche Gesprächssituation."],["personifikation","Eine Apostrophe kann personifizieren, wenn Dinge als ansprechbar und handlungsfähig behandelt werden."]],"counter":{"text":"Liebe Zuhörerinnen und Zuhörer, willkommen.","why":"Das ist eine normale Anrede des anwesenden Publikums, nicht die spezifische Apostrophe."},"memory":"Anrede an ein abwesendes oder nicht antwortfähiges Gegenüber.","aliases":[],"classExample":"Handschriftlich bei der Anrede ergänzt. Die einfache Publikumsanrede ist jedoch nicht automatisch eine Apostrophe.","exam":"Die Formulierung „Zukunft, was werden wir dir hinterlassen?“ zeigt das sprachliche Mittel „Apostrophe“. Die Zukunft wird direkt als Gegenüber angesprochen, obwohl sie keine reale Gesprächspartnerin ist. Die Rede vergegenwärtigt die Folgen heutiger Entscheidungen und bindet Verantwortung an kommende Generationen."},{"id":"synekdoche","name":"Synekdoche","category":"bild","level":4,"material":false,"simple":"Ein engerer und ein weiterer Begriff vertreten einander. Besonders häufig steht ein Teil für das Ganze oder umgekehrt.","definition":"Eine Synekdoche ersetzt einen Ausdruck durch einen begrifflich umfangsbezogenen Ausdruck, etwa Teil für Ganzes, Ganzes für Teil oder Art für Gattung.","recognize":"Benenne die Umfangsbeziehung und ihre Richtung. Die Systematik überschneidet sich je nach Rhetorikmodell mit Metonymie.","examples":[{"text":"Wir brauchen [[ein Dach über dem Kopf]].","why":"Der Gebäudeteil Dach steht für eine Unterkunft als Ganzes; genauer liegt Pars pro toto vor.","effect":"Die Formulierung konzentriert sich auf das Grundbedürfnis nach Schutz.","context":"Alltag"},{"text":"[[Die Schule]] hat heute abgestimmt; gemeint ist die Schulkonferenz.","why":"Das Ganze „Schule“ steht im ausdrücklich genannten Kontext für ein Teilgremium: Totum pro parte.","effect":"Die Formulierung kann die Entscheidung umfassender legitimiert erscheinen lassen, als es die genaue Zuständigkeit zeigt.","context":"Kommentar / Rede"},{"text":"Kein [[Sterblicher]] kannte den Weg hinter die letzte Tür.","why":"Ein charakterisierender Gattungsbegriff bezeichnet hier die Menschen.","effect":"Die Wahl des umfassenden Begriffs betont die menschliche Begrenztheit angesichts des Unbekannten.","context":"Literarischer Modelltext"}],"effect":"Die Formulierung kann die Entscheidung umfassender legitimiert erscheinen lassen, als es die genaue Zuständigkeit zeigt.","confusion":[["pars-pro-toto","Pars pro toto ist die speziellere Teil-für-Ganzes-Form."],["metonymie","Die Grenzen hängen vom Modell ab. In einer Analyse ist die konkrete Beziehung wichtiger als ein bloßes Etikett."]],"counter":{"text":"Die Feder schreibt schneller als das Schwert.","why":"Das kann mit Instrumenten und Handlungen arbeiten; ohne genaueres Verhältnis ist eine einfache Teil-Ganzes-Zuordnung nicht hinreichend."},"memory":"Begrifflicher Umfang: Teil, Ganzes, Art, Gattung.","aliases":[],"classExample":"Ergänzung zum fotografierten Unterrichtsstoff.","exam":"Die Formulierung „Die Schule hat heute abgestimmt; gemeint ist die Schulkonferenz.“ zeigt das sprachliche Mittel „Synekdoche“. Das Ganze „Schule“ steht im ausdrücklich genannten Kontext für ein Teilgremium: Totum pro parte. Die Formulierung kann die Entscheidung umfassender legitimiert erscheinen lassen, als es die genaue Zuständigkeit zeigt."},{"id":"anadiplose","name":"Anadiplose","category":"muster","level":4,"material":false,"simple":"Das Ende einer Einheit wird am Anfang der nächsten wiederholt. So greifen die Gedanken ineinander.","definition":"Eine Anadiplose wiederholt das Schlusswort oder die Schlusswortgruppe einer Einheit zu Beginn der unmittelbar folgenden Einheit.","recognize":"Suche das Muster „… X. X …“. Anders als bei Anapher oder Epipher wechselt die Position von Ende zu Anfang.","examples":[{"text":"Ich brauche [[Ruhe. Ruhe]] hilft mir beim Lernen.","why":"Das Schlusswort des ersten Satzes eröffnet den zweiten Satz.","effect":"Die Wiederholung verbindet Bedürfnis und Begründung eng miteinander.","context":"Alltag"},{"text":"Verantwortung braucht [[Wissen. Wissen]] braucht offene Fragen.","why":"Das erste Schlusswort wird zum Ausgangspunkt der nächsten Aussage.","effect":"Die Rede entwickelt eine nachvollziehbare Gedankenkette, in der eine Voraussetzung zur nächsten führt.","context":"Kommentar / Rede"},{"text":"Im Haus blieb nur [[Stille. Stille]], die länger dauerte als die Nacht.","why":"Das Schlusswort wird am Beginn der angeschlossenen Beschreibung erneut aufgenommen.","effect":"Die Stille wird festgehalten und entfaltet; die Wiederholung verzögert den Fortgang und verstärkt ihre Präsenz.","context":"Literarischer Modelltext"}],"effect":"Die Rede entwickelt eine nachvollziehbare Gedankenkette, in der eine Voraussetzung zur nächsten führt.","confusion":[["anapher","Anapher: Anfang zu Anfang. Anadiplose: Ende zu Anfang."],["epipher","Epipher: Ende zu Ende. Anadiplose verbindet zwei Einheiten über die Grenze hinweg."]],"counter":{"text":"Ruhe hilft. Ruhe tut gut.","why":"Das ist eine Anapher, weil dieselben Wörter an beiden Anfängen stehen."},"memory":"Das Ende wird zum nächsten Anfang.","aliases":[],"classExample":"Ergänzung zum fotografierten Unterrichtsstoff.","exam":"Die Formulierung „Verantwortung braucht Wissen. Wissen braucht offene Fragen.“ zeigt das sprachliche Mittel „Anadiplose“. Das erste Schlusswort wird zum Ausgangspunkt der nächsten Aussage. Die Rede entwickelt eine nachvollziehbare Gedankenkette, in der eine Voraussetzung zur nächsten führt."},{"id":"enjambement","name":"Enjambement","category":"satz","level":4,"material":false,"simple":"Ein Satz geht in einem Gedicht über das Zeilenende hinaus. Der Satzschluss und der Versschluss fallen nicht zusammen.","definition":"Ein Enjambement ist das Übergreifen einer syntaktischen Einheit über eine Versgrenze hinweg.","recognize":"Unterscheide echte Versgrenzen von automatischem Bildschirmumbruch. Suche, was grammatisch in der nächsten Verszeile fortgesetzt wird.","examples":[{"text":"Ich warte auf\n[[deine Antwort]].","why":"Die Präposition „auf“ wird erst im folgenden Vers durch ihr Objekt ergänzt.","effect":"Die Versgrenze erzeugt eine kurze Erwartung, bevor das ersehnte Gegenüber genannt wird.","context":"Alltag"},{"text":"Wir bauen eine Schule\n[[für alle, nicht für wenige]].","why":"Der zweite Vers ergänzt die zunächst vollständig wirkende Aussage um ihre soziale Ausrichtung.","effect":"Der Versübergang hebt den Anspruch auf Teilhabe hervor und stellt ihn verzögert ins Zentrum.","context":"Kommentar / Rede"},{"text":"Sie hielt im Dunkel eine\n[[Handvoll ungesagter Worte]].","why":"Der Artikel vor dem Zeilenende verlangt die Fortsetzung im nächsten Vers.","effect":"Der starke Einschnitt verzögert die Benennung und macht das Zurückhalten der Worte formal erfahrbar.","context":"Literarischer Modelltext"}],"effect":"Der Versübergang hebt den Anspruch auf Teilhabe hervor und stellt ihn verzögert ins Zentrum.","confusion":[["ellipse","Beim Enjambement wird die Syntax im nächsten Vers fortgesetzt; bei der Ellipse bleiben erwartbare Bestandteile ausgelassen."]],"counter":{"text":"Ein normaler Prosasatz wird auf einem schmalen Display automatisch umgebrochen.","why":"Technischer Zeilenumbruch ist keine vom Text gestaltete Versgrenze."},"memory":"Versende ist nicht Satzende.","aliases":[],"classExample":"Ergänzung zum fotografierten Unterrichtsstoff.","exam":"Die Formulierung „Wir bauen eine Schule\nfür alle, nicht für wenige.“ zeigt das sprachliche Mittel „Enjambement“. Der zweite Vers ergänzt die zunächst vollständig wirkende Aussage um ihre soziale Ausrichtung. Der Versübergang hebt den Anspruch auf Teilhabe hervor und stellt ihn verzögert ins Zentrum."}],"categories":[{"id":"bild","name":"Bilder & Übertragung","short":"Bildsprache"},{"id":"muster","name":"Wiederholung & Muster","short":"Muster"},{"id":"gegensatz","name":"Gegensätze & Widersprüche","short":"Gegensätze"},{"id":"satz","name":"Satzbau & Formulierung","short":"Satzbau"},{"id":"ansprache","name":"Ansprache & Hervorhebung","short":"Ansprache"},{"id":"wort","name":"Wortwahl & Klang","short":"Wortwahl"}],"pairs":[{"id":"anapher--epipher","a":"anapher","b":"epipher","explanation":"Entscheidend ist die Position der identischen Wörter: Anapher am Anfang, Epipher am Ende mehrerer Einheiten. Markiere deshalb zuerst die Einheitsgrenzen.","overlap":"„Wir fordern Zeit. Wir brauchen Zeit.“ enthält sowohl die Anapher „Wir“ als auch die Epipher „Zeit“."},{"id":"metapher--vergleich","a":"metapher","b":"vergleich","explanation":"„Die Bibliothek ist ein Fenster“ überträgt die Bezeichnung. „Die Bibliothek ist wie ein Fenster“ stellt die Beziehung ausdrücklich her. Bestimme jeweils das gemeinsame Merkmal.","overlap":"Ein Vergleich kann innerhalb eines größeren metaphorischen Bildes stehen. „Wie“ allein genügt nicht: „Ich weiß, wie es geht“ ist kein Vergleich."},{"id":"metapher--personifikation","a":"metapher","b":"personifikation","explanation":"Bei der Metapher wird ein Bedeutungsbereich übertragen. Bei der Personifikation werden speziell menschliche Züge auf Nichtmenschliches übertragen.","overlap":"„Die Hoffnung klopft an“ ist präzise Personifikation und zugleich im weiteren Sinn metaphorisch. Die App fragt bei eindeutigen Auswahlaufgaben nach dem hervorgehobenen Merkmal."},{"id":"metapher--allegorie","a":"metapher","b":"allegorie","explanation":"Eine Metapher kann in einer einzelnen Übertragung bestehen. Die Allegorie stellt einen abstrakten Zusammenhang in einer ausdeutbaren Gestalt oder zusammenhängenden Bildhandlung dar.","overlap":"Eine Allegorie verwendet oft mehrere Metaphern und Personifikationen. Länge allein entscheidet nicht."},{"id":"antithese--oxymoron","a":"antithese","b":"oxymoron","explanation":"Antithese stellt Gegensätze gegenüber: „Draußen laut, drinnen still.“ Oxymoron verbindet sie eng: „laute Stille“.","overlap":"Ein Oxymoron kann als besonders verdichteter Gegensatz beschrieben werden. Für genaue Benennung ist die enge Verbindung wichtig."},{"id":"oxymoron--paradoxon","a":"oxymoron","b":"paradoxon","explanation":"Oxymoron: widersprüchliche Wortverbindung. Paradoxon: scheinbar widersprüchlicher Gedanke, dessen Sinn durch Deutung erkennbar wird.","overlap":"Ein paradox wirkender Satz kann ein Oxymoron enthalten. Erkläre, welche Ebene du jeweils untersuchst."},{"id":"parallelismus--chiasmus","a":"parallelismus","b":"chiasmus","explanation":"Parallelismus bewahrt den Bauplan A–B / A–B. Chiasmus kreuzt ihn zu A–B / B–A. Benenne die grammatischen oder semantischen Rollen.","overlap":"Ein längerer Text kann beide Anordnungen enthalten. Ein Gegensatz allein sagt noch nichts über den Bauplan."},{"id":"tautologie--pleonasmus","a":"tautologie","b":"pleonasmus","explanation":"Tautologie wiederholt denselben Inhalt meist durch gleichrangige Wörter: „voll und ganz“. Pleonasmus ergänzt ein bereits enthaltenes Merkmal: „lautlose Stille“.","overlap":"Die Begriffsgrenzen werden in verschiedenen Systematiken nicht ganz einheitlich gezogen. Eine genaue Erklärung der Redundanz ist wichtiger als ein bloßes Etikett."},{"id":"akkumulation--asyndeton","a":"akkumulation","b":"asyndeton","explanation":"Akkumulation beschreibt die Häufung zusammengehörender Einzelbegriffe. Asyndeton beschreibt ihre Verbindung ohne Konjunktionen. Inhalt und Satzform sind verschiedene Ebenen.","overlap":"„Bücher, Hefte, Stifte“ ist sowohl Akkumulation als auch Asyndeton. „Er kam, sah, ging“ ist sicher asyndetisch, aber keine typische Aufzählung von Unterbegriffen."},{"id":"asyndeton--polysyndeton","a":"asyndeton","b":"polysyndeton","explanation":"Asyndeton: „Bücher, Hefte, Stifte“. Polysyndeton: „Bücher und Hefte und Stifte“. Ein normales letztes „und“ macht noch kein Polysyndeton.","overlap":"Beide können eine Akkumulation gliedern. Welche Wirkung entsteht, hängt unter anderem von Satzlänge, Rhythmus und Kontext ab."},{"id":"ironie--sarkasmus","a":"ironie","b":"sarkasmus","explanation":"Ironie betrifft die erkennbare Differenz zwischen Gesagtem und Gemeintem. Sarkasmus bezeichnet beißenden, oft verletzenden Spott.","overlap":"„Ein Genie bist du ja!“ nach einem Fehler kann beides sein. Direkte herabsetzende Kritik kann sarkastisch sein, ohne ironisch das Gegenteil zu sagen."},{"id":"hyperbel--klimax","a":"hyperbel","b":"klimax","explanation":"Hyperbel übertreibt. Klimax steigert in einer erkennbaren Folge. Frage deshalb einmal nach dem Realitätsmaß und einmal nach der Reihenfolge.","overlap":"„Ich wartete Stunden, Jahre, Ewigkeiten“ kann eine Klimax mit hyperbolischem Schluss sein."},{"id":"euphemismus--litotes","a":"euphemismus","b":"litotes","explanation":"Euphemismus mildert oder beschönigt. Litotes bejaht durch Verneinung des Gegenteils. Die erste Bezeichnung beschreibt vor allem eine Funktion, die zweite ein Formmuster.","overlap":"„Nicht gerade geschickt“ kann als Litotes eine Kritik mildern und dabei euphemistisch wirken. „Personalanpassung“ benötigt keine Verneinung."},{"id":"metonymie--pars-pro-toto","a":"metonymie","b":"pars-pro-toto","explanation":"Metonymie nutzt sachliche Nachbarschaft, etwa Autor für Werk. Pars pro toto nutzt ausdrücklich Teil für Ganzes, etwa „Segel“ für „Schiff“.","overlap":"In manchen Systematiken werden Teil-Ganzes-Ersetzungen der Metonymie untergeordnet. Hier wird der speziellere Begriff bevorzugt, wenn genau diese Beziehung gefragt ist."},{"id":"repetitio--figura-etymologica","a":"repetitio","b":"figura-etymologica","explanation":"Repetitio wiederholt dasselbe sprachliche Element. Figura etymologica verbindet verschiedene Wörter derselben Wortfamilie: „einen Traum träumen“.","overlap":"Beide erzeugen Wiederklänge. Nur gleiche Buchstaben oder zufällig ähnliche Wörter beweisen noch keine gemeinsame Wortfamilie."}],"intro":[{"title":"Sprache verändert den Blick","text":"Vergleiche „Die Tasche ist schwer“ mit „Die Tasche wiegt eine Tonne“. Beide Sätze können dieselbe Tasche beschreiben. Der zweite vermittelt viel deutlicher, wie anstrengend das Tragen ist. Sprache informiert also nicht nur. Sie kann Gefühle ausdrücken, Bilder erzeugen und Einstellungen beeinflussen.","example":"Die Tasche wiegt [[eine Tonne]].","takeaway":"Nicht nur fragen: Was wird gesagt? Auch fragen: Wie wird es gesagt?"},{"title":"Was ist ein Stilmittel?","text":"Ein Stilmittel ist eine auffällige Art, Sprache zu gestalten. Dazu gehören Bilder, Wiederholungen, Gegensätze und besondere Satzformen. Du benutzt solche Mittel wahrscheinlich schon: „Ich warte ewig“ oder „Mein Handy spinnt“. Du musst nicht erst die Fachnamen kennen, um den Unterschied zu bemerken.","example":"Ich warte [[ewig]].","takeaway":"Erst das sprachliche Muster verstehen, dann seinen Namen lernen."},{"title":"Form und Wirkung sind verschieden","text":"Die Form ist das, was du am Satz zeigen kannst: Ein Wort wird wiederholt, zwei Dinge werden verglichen oder etwas wird übertrieben. Die Wirkung ist deine begründete Deutung im Zusammenhang. Eine Wiederholung kann Druck machen, Freude ausdrücken oder Eintönigkeit darstellen. Der Name allein legt das nicht fest.","example":"[[Noch einmal. Noch einmal.]]","takeaway":"Merkmal nachweisen → Aussage erklären → Funktion im Kontext begründen."},{"title":"So findest du den Anfang","text":"Lies zuerst den ganzen Satz. Was fällt auf? Nimm ein verdächtiges Wort einmal wörtlich. Passt das? Vergleiche Anfänge und Enden. Suche Gegensätze. Prüfe, wer handelt. Erkläre deine Beobachtung erst in eigenen Worten. Danach wählst du den passenden Fachbegriff.","example":"Die Zeit [[rennt]].","takeaway":"Beobachten ist wichtiger als Begriffe zu erraten."},{"title":"Ein Satz, mehrere richtige Beobachtungen","text":"„Wir brauchen Zeit. Wir brauchen Ruhe.“ wiederholt den Anfang und denselben Satzbau. Das ist Anapher und Parallelismus. In Aufgaben musst du genau lesen, welches Merkmal gefragt ist. In einer eigenen Analyse darfst du mehrere Mittel nennen, wenn du jedes nachweisen kannst.","example":"[[Wir brauchen]] Zeit. [[Wir brauchen]] Ruhe.","takeaway":"Mehrfachzuordnungen sind möglich. Jede braucht ihren eigenen Beleg."},{"title":"Vom Erkennen zur guten Analyse","text":"„Der Autor macht den Text interessant“ erklärt wenig. Besser: „Die Bezeichnung der Bibliothek als Fenster zur Welt verbindet Lesen mit dem Zugang zu unbekannten Erfahrungen. Im Plädoyer für den Erhalt der Bibliothek betont das ihren Bildungswert.“ Das verknüpft Beleg, sprachliches Merkmal, Aussage und Absicht.","example":"Die Bibliothek ist ein [[Fenster zur Welt]].","takeaway":"Beschreibe nicht irgendeine Wirkung, sondern die Funktion genau hier."}],"paths":[{"id":"start","name":"Ich weiß noch gar nichts","subtitle":"Ohne Vorwissen beginnen. Muster sehen, Begriffe verstehen.","level":1,"lessons":[{"id":"start-1","title":"Sprache wirkt","text":"Vergleiche „Die Tasche ist schwer“ mit „Die Tasche wiegt eine Tonne“. Beide Sätze können dieselbe Tasche beschreiben. Der zweite vermittelt viel deutlicher, wie anstrengend das Tragen ist. Sprache informiert also nicht nur. Sie kann Gefühle ausdrücken, Bilder erzeugen und Einstellungen beeinflussen. Ein Stilmittel ist eine auffällige Art, Sprache zu gestalten. Dazu gehören Bilder, Wiederholungen, Gegensätze und besondere Satzformen. Du benutzt solche Mittel wahrscheinlich schon: „Ich warte ewig“ oder „Mein Handy spinnt“. Du musst nicht erst die Fachnamen kennen, um den Unterschied zu bemerken.","terms":["hyperbel","vergleich","metapher"],"activity":"practice"},{"id":"start-2","title":"Bilder im Alltag","text":"Lies zuerst den ganzen Satz. Was fällt auf? Nimm ein verdächtiges Wort einmal wörtlich. Passt das? Vergleiche Anfänge und Enden. Suche Gegensätze. Prüfe, wer handelt. Erkläre deine Beobachtung erst in eigenen Worten. Danach wählst du den passenden Fachbegriff.","terms":["metapher","vergleich","personifikation"],"activity":"practice"},{"id":"start-3","title":"Klang und Wiederholung","text":"Lies laut. Alliteration verbindet Anfangslaute, Anapher verbindet Satzanfänge. Bestimme zuerst, was genau wiederkehrt.","terms":["alliteration","anapher","repetitio"],"activity":"practice"},{"id":"start-4","title":"Wirkung braucht Kontext","text":"Die Form ist das, was du am Satz zeigen kannst: Ein Wort wird wiederholt, zwei Dinge werden verglichen oder etwas wird übertrieben. Die Wirkung ist deine begründete Deutung im Zusammenhang. Eine Wiederholung kann Druck machen, Freude ausdrücken oder Eintönigkeit darstellen. Der Name allein legt das nicht fest.","terms":["antithese","ironie","rhetorische-frage","hyperbel"],"activity":"effect"}]},{"id":"wichtig","name":"Die wichtigsten Stilmittel","subtitle":"Die Basis für Unterricht und Klausur festigen.","level":2,"lessons":[{"id":"wichtig-1","title":"Bilder sicher bestimmen","text":"Benutze bei Bildern drei Fragen: Was ist wörtlich gemeint? Was wird übertragen? Ist das übertragene Merkmal menschlich?","terms":["metapher","vergleich","personifikation"],"activity":"practice"},{"id":"wichtig-2","title":"Gegensatz und Übertreibung","text":"Suche entweder zwei gegensätzliche Seiten oder eine deutlich übersteigerte Aussage. Diese beiden Kriterien dürfen nicht vermischt werden.","terms":["antithese","hyperbel","ironie"],"activity":"practice"},{"id":"wichtig-3","title":"Muster und Publikum","text":"Achte auf Laut, Position und Gesprächssituation. Eine Wiederholung ist etwas anderes als eine Frage, die Zustimmung nahelegt.","terms":["alliteration","anapher","rhetorische-frage"],"activity":"practice"},{"id":"wichtig-4","title":"Erster Transfer","text":"Begründe deine Wahl am markierten Merkmal. Ein kurzer Beleg ist stärker als das Auflisten vieler Fachwörter.","terms":["ellipse","parallelismus","imperativ"],"activity":"practice"}]},{"id":"unterschiede","name":"Schwierige Unterschiede","subtitle":"Ähnliche Begriffe mit klaren Kriterien trennen.","level":3,"lessons":[{"id":"unterschiede-1","title":"Anfang, Ende, Bauplan","text":"Trenne Wortwiederholung von Struktur. Markiere zuerst die Einheitsgrenzen und bestimme dann die Position wiederkehrender Wörter.","terms":["anapher","epipher","parallelismus","chiasmus"],"activity":"compare"},{"id":"unterschiede-2","title":"Bilder präzisieren","text":"Ähnlichkeit, Vermenschlichung, sachliche Nachbarschaft und Teil-Ganzes-Beziehung sind verschiedene Kriterien.","terms":["metapher","personifikation","metonymie","pars-pro-toto"],"activity":"compare"},{"id":"unterschiede-3","title":"Widerspruch ist nicht gleich Widerspruch","text":"Unterscheide getrennte Gegensätze, enge widersprüchliche Wortverbindungen und scheinbar widersprüchliche Gedanken.","terms":["antithese","oxymoron","paradoxon"],"activity":"compare"},{"id":"unterschiede-4","title":"Häufung und Redundanz","text":"Prüfe getrennt: Was wird gesammelt? Wie sind die Glieder verbunden? Wiederholt sich Bedeutung oder ein Wortstamm?","terms":["akkumulation","asyndeton","polysyndeton","tautologie","pleonasmus","figura-etymologica"],"activity":"compare"}]},{"id":"alle","name":"Alle Stilmittel kennenlernen","subtitle":"Sechs Kategorien systematisch erschließen.","level":3,"lessons":[{"id":"alle-1","title":"Bilder & Übertragung","text":"Lies die Porträts dieser Kategorie. Achte besonders auf Erkennungsmerkmal, Gegenbeispiel und eine konkrete Wirkung. Der anschließende Check zählt als Lernnachweis.","terms":["metapher","vergleich","personifikation","allegorie","metonymie","pars-pro-toto","periphrase","synaesthesie","euphemismus","hyperbel","litotes","symbol","synekdoche"],"activity":"practice"},{"id":"alle-2","title":"Wiederholung & Muster","text":"Lies die Porträts dieser Kategorie. Achte besonders auf Erkennungsmerkmal, Gegenbeispiel und eine konkrete Wirkung. Der anschließende Check zählt als Lernnachweis.","terms":["anapher","epipher","repetitio","parallelismus","chiasmus","alliteration","figura-etymologica","tautologie","pleonasmus","polysyndeton","asyndeton","akkumulation","zweierfigur","anadiplose"],"activity":"practice"},{"id":"alle-3","title":"Gegensätze & Widersprüche","text":"Lies die Porträts dieser Kategorie. Achte besonders auf Erkennungsmerkmal, Gegenbeispiel und eine konkrete Wirkung. Der anschließende Check zählt als Lernnachweis.","terms":["antithese","oxymoron","paradoxon","ironie","sarkasmus"],"activity":"practice"},{"id":"alle-4","title":"Satzbau & Formulierung","text":"Lies die Porträts dieser Kategorie. Achte besonders auf Erkennungsmerkmal, Gegenbeispiel und eine konkrete Wirkung. Der anschließende Check zählt als Lernnachweis.","terms":["ellipse","inversion","parenthese","correctio","zeugma","epiphrase","klimax","antiklimax","enjambement"],"activity":"practice"},{"id":"alle-5","title":"Ansprache & Hervorhebung","text":"Lies die Porträts dieser Kategorie. Achte besonders auf Erkennungsmerkmal, Gegenbeispiel und eine konkrete Wirkung. Der anschließende Check zählt als Lernnachweis.","terms":["rhetorische-frage","anrede","ausruf","imperativ","emphase","apostrophe"],"activity":"practice"},{"id":"alle-6","title":"Wortwahl & Klang","text":"Lies die Porträts dieser Kategorie. Achte besonders auf Erkennungsmerkmal, Gegenbeispiel und eine konkrete Wirkung. Der anschließende Check zählt als Lernnachweis.","terms":["neologismus","archaismus","onomatopoesie","allusion","wortspiel","synonym"],"activity":"practice"}]},{"id":"wirkung","name":"Wirkungen richtig erklären","subtitle":"Von Satzbausteinen zur eigenständigen Analyse.","level":3,"lessons":[{"id":"wirkung-1","title":"Beobachtung statt Floskel","text":"Eine Analyse beginnt mit einem nachweisbaren Merkmal. „Interessant“ oder „anschaulich“ allein beschreibt noch nicht, was genau verstanden werden soll.","terms":["metapher","vergleich"],"activity":"effect"},{"id":"wirkung-2","title":"Bild und Aussage verbinden","text":"Benenne zuerst Bildspender und gemeinte Sache. Erkläre dann, welche Eigenschaft durch das Bild hervorgehoben wird.","terms":["metapher","personifikation"],"activity":"effect"},{"id":"wirkung-3","title":"Die Funktion im Argument","text":"Frage, was die Stelle gerade tut: begründet sie eine Forderung, entkräftet sie eine Gegenposition oder macht sie eine Folge sichtbar?","terms":["antithese","rhetorische-frage","hyperbel"],"activity":"effect"},{"id":"wirkung-4","title":"Selbstständig formulieren","text":"Verbinde Textbeleg, Begriff, Merkmal, Bedeutung und Funktion. Die freie Antwort wird mit einem transparenten Raster selbst kontrolliert.","terms":[],"activity":"lab"}]},{"id":"analyse","name":"Textanalyse auf Oberstufenniveau","subtitle":"Belege finden, deuten und in Zusammenhang bringen.","level":4,"lessons":[{"id":"analyse-1","title":"Den Text als Ganzes verstehen","text":"Lies vor dem Markieren. Wer spricht? An wen? Mit welchem Anliegen? Einzelne Bilder erhalten ihre Bedeutung im Zusammenhang.","terms":[],"activity":"lab"},{"id":"analyse-2","title":"Belege präzise sichern","text":"Zitiere nur den entscheidenden Ausschnitt. Notiere die Satznummer. Ein sehr langer Beleg ist nicht automatisch genauer.","terms":[],"activity":"lab"},{"id":"analyse-3","title":"Mehrfachzuordnungen begründen","text":"Trenne Ebenen: Wortwiederholung, Satzbau und Bedeutung. Vermeide wahlloses Aufzählen ohne Erklärung.","terms":[],"activity":"lab"},{"id":"analyse-4","title":"Eine zusammenhängende Analyse","text":"Ordne Beobachtungen nach ihrer Funktion für die Textaussage. Verwende Übergänge und erkläre auch das Zusammenspiel der Mittel.","terms":[],"activity":"lab"}]},{"id":"pruefung","name":"Prüfungsvorbereitung","subtitle":"Lücken schließen und unter Prüfungsbedingungen arbeiten.","level":4,"lessons":[{"id":"pruefung-1","title":"Grundbegriffe abrufen","text":"Wähle erst eine Antwort, bevor du eine Lösung ansiehst. Unterscheide wirkliches Abrufen von bloßem Wiedererkennen.","terms":["metapher","anapher","antithese","ellipse","hyperbel"],"activity":"practice"},{"id":"pruefung-2","title":"Fehler gezielt aufarbeiten","text":"Nutze die gespeicherten falschen Antworten. Lies nach einem Fehler den Unterschied und löse später eine neue Variante.","terms":[],"activity":"mistakes"},{"id":"pruefung-3","title":"Anspruchsvolle Mehrfachbefunde","text":"Nenne mehrere Mittel nur dann, wenn du jedes Merkmal zeigen kannst. Falsche zusätzliche Kreuze mindern die Punktzahl.","terms":[],"activity":"hard"},{"id":"pruefung-4","title":"Probeklausur","text":"Bearbeite eine Simulation ohne Zwischenlösungen. Freie Schreibanteile bleiben bis zur Kriterienkontrolle als offen gekennzeichnet.","terms":[],"activity":"exam"}]},{"id":"kommentar","name":"Kommentar schreiben","subtitle":"Position entwickeln und sprachlich überzeugend gestalten.","level":3,"lessons":[{"id":"kommentar-1","title":"Vom Material zur Position","text":"Werte zunächst alle Materialien aus. Trenne Aussagen, Belege und eigene Schlussfolgerungen. Beachte eine eventuell vorgegebene Position.","terms":[],"activity":"workshop"},{"id":"kommentar-2","title":"Argumente und Gegenargumente","text":"Eine Behauptung braucht Begründung und einen passenden Beleg. Stelle Gegenpositionen fair dar und antworte auf ihren stärksten Punkt.","terms":[],"activity":"workshop"},{"id":"kommentar-3","title":"Einleitung, Hauptteil, Schluss","text":"Die Einleitung führt zum Sachverhalt und positioniert. Der Hauptteil begründet. Der Schluss bündelt die Meinung und gibt einen begründeten Ausblick oder Appell.","terms":[],"activity":"workshop"},{"id":"kommentar-4","title":"Stil bewusst einsetzen","text":"Ein Stilmittel soll die Aussage stützen, nicht nur Schmuck sein. Prüfe Ton, Zielgruppe, Materialbezüge und die konkrete Wirkung deiner Formulierungen.","terms":[],"activity":"workshop"}]}],"labs":[{"id":"buch","title":"Ein Fenster bleibt offen","genre":"Kommentar","level":2,"text":"Ein gedrucktes Buch ist kein Relikt, das man aus Höflichkeit im Regal duldet. Es ist ein Fenster zur Welt. Natürlich lässt sich ein Text auch auf einem Bildschirm lesen. Ein leichter Reader kann auf Reisen praktisch sein, und digitale Ausgaben lassen sich durchsuchen. Doch die Frage ist nicht, welches Gerät gewinnen muss. Wir brauchen Bücher. Wir brauchen Zugänge. Wir brauchen die Freiheit, beides zu nutzen. Wer hätte etwas davon, wenn eine neue Möglichkeit nur durch das Verschwinden einer anderen bestehen dürfte? Eine Schule sollte deshalb das Lesen fördern und nicht einen Wettbewerb zwischen Papier und Bildschirm veranstalten.","annotations":[{"quote":"ein Fenster zur Welt","term":"metapher","feature":"Die Bibliothek beziehungsweise das Buch wird mit einer Öffnung zu neuen Erfahrungen verbunden.","effect":"Das Bild wertet das gedruckte Buch als Zugang zu unbekannten Lebenswelten auf und widerspricht seiner Abwertung als bloßes Relikt."},{"quote":"Wir brauchen Bücher. Wir brauchen Zugänge. Wir brauchen die Freiheit","term":"anapher","feature":"Drei Einheiten beginnen mit „Wir brauchen“.","effect":"Die gleich einsetzenden Forderungen verbinden gedruckte und digitale Zugänge unter dem gemeinsamen Ziel der Wahlfreiheit."},{"quote":"Wer hätte etwas davon, wenn eine neue Möglichkeit nur durch das Verschwinden einer anderen bestehen dürfte?","term":"rhetorische-frage","feature":"Die Frage legt eine verneinende Antwort nahe.","effect":"Sie greift die Vorstellung eines notwendigen Verdrängungswettbewerbs an und führt zur Forderung nach einem Nebeneinander."}],"prompt":"Untersuche, wie die sprachliche Gestaltung die Haltung des Textes vermittelt. Belege deine Beobachtungen, benenne die Mittel und erläutere ihre Funktion im Zusammenhang.","model":"In „ein Fenster zur Welt“ liegt Metapher vor. Die Bibliothek beziehungsweise das Buch wird mit einer Öffnung zu neuen Erfahrungen verbunden. Das Bild wertet das gedruckte Buch als Zugang zu unbekannten Lebenswelten auf und widerspricht seiner Abwertung als bloßes Relikt. In „Wir brauchen Bücher. Wir brauchen Zugänge. Wir brauchen die Freiheit“ liegt Anapher vor. Drei Einheiten beginnen mit „Wir brauchen“. Die gleich einsetzenden Forderungen verbinden gedruckte und digitale Zugänge unter dem gemeinsamen Ziel der Wahlfreiheit. In „Wer hätte etwas davon, wenn eine neue Möglichkeit nur durch das Verschwinden einer anderen bestehen dürfte?“ liegt Rhetorische Frage vor. Die Frage legt eine verneinende Antwort nahe. Sie greift die Vorstellung eines notwendigen Verdrängungswettbewerbs an und führt zur Forderung nach einem Nebeneinander."},{"id":"pause","title":"Das Recht auf einen stillen Moment","genre":"Zeitungsähnlicher Kommentar","level":3,"text":"Ping, ping, ping. Noch bevor die Pause beginnt, sind drei neue Meldungen da. Die kleine Anzeige fordert Aufmerksamkeit, und oft bekommt sie sie sofort. Das Smartphone ist damit nicht automatisch ein Gegner des Lernens. Es kann organisieren, erklären und verbinden. Aber ein Gerät sollte uns dienen, nicht wir dem Gerät. Eine schulische Regel muss deshalb mehr leisten als ein pauschales Verbot. Sie muss begründen, wann ein Werkzeug gebraucht wird und wann Ruhe wichtiger ist. Ein paar Minuten ohne Bildschirm sind kein Rückschritt. Sie können Raum schaffen, in dem ein Gedanke einmal nicht unterbrochen wird.","annotations":[{"quote":"Ping, ping, ping.","term":"onomatopoesie","feature":"Die Lautfolge ahmt Benachrichtigungstöne nach.","effect":"Die Wiederholung lässt die Störung hörbar werden und bereitet das Argument für Ruhephasen vor."},{"quote":"ein Gerät sollte uns dienen, nicht wir dem Gerät","term":"chiasmus","feature":"Die Rollen von Gerät und Menschen werden überkreuz vertauscht.","effect":"Die Konstruktion stellt die gewünschte dienende Funktion der problematischen Abhängigkeit gegenüber."},{"quote":"organisieren, erklären und verbinden","term":"akkumulation","feature":"Mehrere Nutzungsmöglichkeiten werden gesammelt.","effect":"Der Text räumt Vorteile ein und macht seine spätere Einschränkung differenzierter als ein grundsätzliches Technikverbot."}],"prompt":"Untersuche, wie die sprachliche Gestaltung die Haltung des Textes vermittelt. Belege deine Beobachtungen, benenne die Mittel und erläutere ihre Funktion im Zusammenhang.","model":"In „Ping, ping, ping.“ liegt Onomatopoesie vor. Die Lautfolge ahmt Benachrichtigungstöne nach. Die Wiederholung lässt die Störung hörbar werden und bereitet das Argument für Ruhephasen vor. In „ein Gerät sollte uns dienen, nicht wir dem Gerät“ liegt Chiasmus vor. Die Rollen von Gerät und Menschen werden überkreuz vertauscht. Die Konstruktion stellt die gewünschte dienende Funktion der problematischen Abhängigkeit gegenüber. In „organisieren, erklären und verbinden“ liegt Akkumulation vor. Mehrere Nutzungsmöglichkeiten werden gesammelt. Der Text räumt Vorteile ein und macht seine spätere Einschränkung differenzierter als ein grundsätzliches Technikverbot."},{"id":"ki","title":"Denken lässt sich nicht abgeben","genre":"Argumentative Stellungnahme","level":4,"text":"Eine Antwort ist schnell kopiert. Eine Begründung ist damit noch nicht verstanden. Wenn eine Schule künstliche Intelligenz im Unterricht nutzt, sollte sie diesen Unterschied sichtbar machen. Wir brauchen offene Aufgaben, wir brauchen überprüfbare Quellen, wir brauchen Zeit für Rückfragen. Die Technik verspricht eine Abkürzung; Lernen verlangt manchmal den Umweg. Das ist kein Widerspruch gegen jedes Hilfsmittel. Es ist eine Warnung vor einer schönen Fassade, hinter der niemand wohnt. Wer eine erzeugte Antwort verbessert, muss ihre Schwächen erkennen können. Genau diese Fähigkeit gehört ins Zentrum des Unterrichts. Eine Schule, die nur perfekte Ergebnisse sammelt, könnte das Nachdenken gerade dort übersehen, wo es mühsam und unordentlich wird.","annotations":[{"quote":"Wir brauchen offene Aufgaben, wir brauchen überprüfbare Quellen, wir brauchen Zeit für Rückfragen.","term":"anapher","feature":"Die drei Teilsätze beginnen identisch.","effect":"Die Wiederholung verbindet die Bedingungen verantwortlicher Nutzung und verleiht ihnen programmatischen Nachdruck."},{"quote":"Die Technik verspricht eine Abkürzung; Lernen verlangt manchmal den Umweg.","term":"antithese","feature":"Abkürzung und Umweg bilden gegensätzliche Vorstellungen des Lernprozesses.","effect":"Der Gegensatz stellt Effizienz und notwendige geistige Arbeit gegenüber, ohne Hilfsmittel pauschal abzulehnen."},{"quote":"einer schönen Fassade, hinter der niemand wohnt","term":"metapher","feature":"Eine äußerlich gelungene Antwort wird als unbewohntes Gebäude beschrieben.","effect":"Das Bild verdeutlicht den Unterschied zwischen überzeugender Oberfläche und fehlendem Verständnis."}],"prompt":"Untersuche, wie die sprachliche Gestaltung die Haltung des Textes vermittelt. Belege deine Beobachtungen, benenne die Mittel und erläutere ihre Funktion im Zusammenhang.","model":"In „Wir brauchen offene Aufgaben, wir brauchen überprüfbare Quellen, wir brauchen Zeit für Rückfragen.“ liegt Anapher vor. Die drei Teilsätze beginnen identisch. Die Wiederholung verbindet die Bedingungen verantwortlicher Nutzung und verleiht ihnen programmatischen Nachdruck. In „Die Technik verspricht eine Abkürzung; Lernen verlangt manchmal den Umweg.“ liegt Antithese vor. Abkürzung und Umweg bilden gegensätzliche Vorstellungen des Lernprozesses. Der Gegensatz stellt Effizienz und notwendige geistige Arbeit gegenüber, ohne Hilfsmittel pauschal abzulehnen. In „einer schönen Fassade, hinter der niemand wohnt“ liegt Metapher vor. Eine äußerlich gelungene Antwort wird als unbewohntes Gebäude beschrieben. Das Bild verdeutlicht den Unterschied zwischen überzeugender Oberfläche und fehlendem Verständnis."},{"id":"klima","title":"Nicht nur der nächste Sommer","genre":"Gesellschaftliche Rede","level":4,"text":"Liebe Zuhörerinnen und Zuhörer, eine Entscheidung endet nicht am Rand unseres Kalenders. Ihre Folgen reichen weiter. Zukunft, was werden wir dir hinterlassen? Wir können Verantwortung nicht zugleich feierlich bekennen und im Alltag vergessen. Es geht nicht um den perfekten Menschen, der niemals einen Fehler macht. Es geht um Regeln, die verantwortliches Handeln erleichtern. Eine Schule kann kleine Schritte planen, Erfahrungen prüfen und daraus lernen. Sie darf dabei nicht so tun, als löse ein einzelnes Plakat bereits jedes Problem. Wir brauchen Mut statt Mauern. Die Aufgabe ist groß, aber Größe ist kein Grund, überhaupt nicht anzufangen.","annotations":[{"quote":"Liebe Zuhörerinnen und Zuhörer","term":"anrede","feature":"Die Rede nennt ihre reale Zielgruppe ausdrücklich.","effect":"Die Anrede stellt eine gemeinsame Kommunikationssituation her und bereitet die Einbeziehung des Publikums vor."},{"quote":"Zukunft, was werden wir dir hinterlassen?","term":"apostrophe","feature":"Die abstrakte Zukunft wird als Gegenüber angerufen.","effect":"Kommende Folgen werden emotional gegenwärtig; zugleich enthält die Stelle eine rhetorische Frage und Personifikation."},{"quote":"Mut statt Mauern","term":"alliteration","feature":"Die wichtigen Wörter beginnen mit demselben m-Laut.","effect":"Der Gleichklang macht die knappe Gegenüberstellung merkbar und schließt die Rede mit einer handlungsorientierten Formel."}],"prompt":"Untersuche, wie die sprachliche Gestaltung die Haltung des Textes vermittelt. Belege deine Beobachtungen, benenne die Mittel und erläutere ihre Funktion im Zusammenhang.","model":"In „Liebe Zuhörerinnen und Zuhörer“ liegt Anrede vor. Die Rede nennt ihre reale Zielgruppe ausdrücklich. Die Anrede stellt eine gemeinsame Kommunikationssituation her und bereitet die Einbeziehung des Publikums vor. In „Zukunft, was werden wir dir hinterlassen?“ liegt Apostrophe vor. Die abstrakte Zukunft wird als Gegenüber angerufen. Kommende Folgen werden emotional gegenwärtig; zugleich enthält die Stelle eine rhetorische Frage und Personifikation. In „Mut statt Mauern“ liegt Alliteration vor. Die wichtigen Wörter beginnen mit demselben m-Laut. Der Gleichklang macht die knappe Gegenüberstellung merkbar und schließt die Rede mit einer handlungsorientierten Formel."},{"id":"bahnhof","title":"Der letzte Zug","genre":"Literarischer Modelltext","level":3,"text":"Der Bahnhof hielt den Atem an. Auf der Anzeige fehlte nur noch ein Zug, und Mara wusste nicht, ob sie auf ihn wartete oder auf den Mut, einzusteigen. Kein Ruf. Kein Schritt. Nur das Summen der Lampe über ihr. In der Tasche lag der Schlüssel zur alten Wohnung. Er passte seit Wochen in kein Schloss mehr. Trotzdem schloss sich ihre Hand um das kalte Metall. Als die Schienen zu singen begannen, stand sie auf. Sie fasste ihren Koffer und neuen Mut. Zum ersten Mal hörte sie das Geräusch der Ankunft nicht als Versprechen einer Rückkehr, sondern als Möglichkeit des Aufbruchs.","annotations":[{"quote":"Der Bahnhof hielt den Atem an.","term":"personifikation","feature":"Der unbelebte Ort erhält eine menschliche Tätigkeit.","effect":"Das angehaltene Atmen überträgt Maras Spannung auf die ganze Umgebung."},{"quote":"Kein Ruf. Kein Schritt.","term":"ellipse","feature":"Die Sätze lassen ergänzbare Prädikate und weitere Satzglieder weg.","effect":"Die knappen Wahrnehmungsfragmente verdichten die Stille. Zugleich wiederholt sich der Anfang „Kein“."},{"quote":"Sie fasste ihren Koffer und neuen Mut.","term":"zeugma","feature":"„Fassen“ verbindet körperliches Greifen mit dem inneren Gewinnen von Mut.","effect":"Die doppelte Verwendung bindet die konkrete Abreise an Maras persönliche Entscheidung."}],"prompt":"Untersuche, wie die sprachliche Gestaltung die Haltung des Textes vermittelt. Belege deine Beobachtungen, benenne die Mittel und erläutere ihre Funktion im Zusammenhang.","model":"In „Der Bahnhof hielt den Atem an.“ liegt Personifikation vor. Der unbelebte Ort erhält eine menschliche Tätigkeit. Das angehaltene Atmen überträgt Maras Spannung auf die ganze Umgebung. In „Kein Ruf. Kein Schritt.“ liegt Ellipse vor. Die Sätze lassen ergänzbare Prädikate und weitere Satzglieder weg. Die knappen Wahrnehmungsfragmente verdichten die Stille. Zugleich wiederholt sich der Anfang „Kein“. In „Sie fasste ihren Koffer und neuen Mut.“ liegt Zeugma vor. „Fassen“ verbindet körperliches Greifen mit dem inneren Gewinnen von Mut. Die doppelte Verwendung bindet die konkrete Abreise an Maras persönliche Entscheidung."},{"id":"debatte","title":"Ein Raum für Widerspruch","genre":"Kommentar","level":4,"text":"Eine offene Debatte kann unbequem sein. Gerade deshalb verdient sie Schutz. Wer nur die eigene Meinung hören will, führt kein Gespräch, sondern hält sich einen Spiegel vor. Das bedeutet nicht, jede Äußerung von Kritik zu befreien. Freiheit braucht Verantwortung. Verantwortung braucht die Bereitschaft, Folgen wahrzunehmen. Eine Grenze lässt sich nicht allein daran erkennen, ob ein Satz jemandem missfällt. Wir müssen genauer fragen: Welche Behauptung wird aufgestellt, wen betrifft sie, und wie wird sie begründet? Eine Debatte ohne Widerspruch wäre eine lebendige Erstarrung. Sie sähe nach Austausch aus und ließe doch alles unverändert.","annotations":[{"quote":"hält sich einen Spiegel vor","term":"metapher","feature":"Das Gespräch nur mit Bestätigung wird als Betrachtung des eigenen Spiegelbilds beschrieben.","effect":"Die Metapher kritisiert Selbstbestätigung anstelle echter Auseinandersetzung."},{"quote":"Freiheit braucht Verantwortung. Verantwortung braucht","term":"anadiplose","feature":"Das Schlusswort der ersten Aussage eröffnet die folgende.","effect":"Die Wiederholung entwickelt eine Argumentationskette von Freiheit zu verantwortlicher Wahrnehmung der Folgen."},{"quote":"lebendige Erstarrung","term":"oxymoron","feature":"Lebendigkeit und Erstarrung werden widersprüchlich in einer engen Wortgruppe verbunden.","effect":"Die Formel entlarvt einen Austausch, der äußerlich aktiv wirkt, aber keine Bewegung im Denken zulässt."}],"prompt":"Untersuche, wie die sprachliche Gestaltung die Haltung des Textes vermittelt. Belege deine Beobachtungen, benenne die Mittel und erläutere ihre Funktion im Zusammenhang.","model":"In „hält sich einen Spiegel vor“ liegt Metapher vor. Das Gespräch nur mit Bestätigung wird als Betrachtung des eigenen Spiegelbilds beschrieben. Die Metapher kritisiert Selbstbestätigung anstelle echter Auseinandersetzung. In „Freiheit braucht Verantwortung. Verantwortung braucht“ liegt Anadiplose vor. Das Schlusswort der ersten Aussage eröffnet die folgende. Die Wiederholung entwickelt eine Argumentationskette von Freiheit zu verantwortlicher Wahrnehmung der Folgen. In „lebendige Erstarrung“ liegt Oxymoron vor. Lebendigkeit und Erstarrung werden widersprüchlich in einer engen Wortgruppe verbunden. Die Formel entlarvt einen Austausch, der äußerlich aktiv wirkt, aber keine Bewegung im Denken zulässt."},{"id":"daten","title":"Was eine Zahl nicht erzählt","genre":"Sachnaher Essay","level":4,"text":"Eine Tabelle ordnet Beobachtungen. Sie kann Unterschiede sichtbar machen, aber sie nimmt uns die Deutung nicht ab. Wer eine Klasse mit einer einzigen Zahl beschreibt, sollte fragen, welche Erfahrungen darin keinen Platz finden. Hinter dem Durchschnitt stehen unterschiedliche Wege: Fragen, Umwege, Irrtümer, Fortschritte. Ein Ergebnis ist nicht wertlos, nur weil es nicht alles erklärt. Es ist auch nicht vollständig, nur weil es präzise aussieht. Die Statistik schweigt über manches, das wir wissen müssten. Deshalb braucht eine begründete Entscheidung beides: nachvollziehbare Zahlen und die Bereitschaft, ihre Grenzen zu benennen. Nicht weniger Genauigkeit, sondern mehr.","annotations":[{"quote":"Fragen, Umwege, Irrtümer, Fortschritte","term":"akkumulation","feature":"Einzelne Bestandteile des Lernens werden unter einem gemeinsamen Bereich gesammelt.","effect":"Die Häufung macht die Vielfalt sichtbar, die durch eine einzige Kennzahl verdeckt werden kann. Die Reihung ist zugleich asyndetisch."},{"quote":"Die Statistik schweigt","term":"personifikation","feature":"Einer Darstellung von Daten wird menschliches Schweigen zugeschrieben.","effect":"Die Aussage lenkt auf begrenzte Aussagekraft, ohne daraus eine grundsätzliche Wertlosigkeit von Zahlen abzuleiten."},{"quote":"Nicht weniger Genauigkeit, sondern mehr.","term":"antithese","feature":"Die Mengenbegriffe weniger und mehr werden ausdrücklich gegenübergestellt.","effect":"Der Schluss deutet die ergänzende qualitative Betrachtung als Gewinn an Genauigkeit und entkräftet einen möglichen Einwand."}],"prompt":"Untersuche, wie die sprachliche Gestaltung die Haltung des Textes vermittelt. Belege deine Beobachtungen, benenne die Mittel und erläutere ihre Funktion im Zusammenhang.","model":"In „Fragen, Umwege, Irrtümer, Fortschritte“ liegt Akkumulation vor. Einzelne Bestandteile des Lernens werden unter einem gemeinsamen Bereich gesa
