(function(root,factory){if(typeof module==="object"&&module.exports)module.exports=factory();else root.SMD=factory();})(typeof globalThis!=="undefined"?globalThis:this,function(){return {"terms":[{"id":"metapher","name":"Metapher","category":"bild","level":2,"material":true,"simple":"Ein Wort wird als Bild verwendet. Gemeint ist etwas anderes als seine wörtliche Bedeutung.","definition":"Eine Metapher überträgt einen Ausdruck aufgrund einer wahrgenommenen Ähnlichkeit in einen anderen Bedeutungsbereich.","recognize":"Prüfe, ob die wörtliche Lesart im Zusammenhang passt. Benenne das Bild und die Eigenschaft, die übertragen wird.","examples":[{"text":"Mein Zimmer ist ein [[Schlachtfeld]].","why":"Das Zimmer ist kein Kriegsgebiet. Die Unordnung wird mit der Verwüstung eines Schlachtfeldes verbunden.","effect":"Das Bild lässt die Unordnung besonders groß und chaotisch erscheinen.","context":"Alltag"},{"text":"Die Schulbibliothek ist ein [[Fenster zur Welt]].","why":"Ein Raum mit Büchern wird als Fenster bezeichnet. Übertragen wird die Möglichkeit, neue Aussichten und Erfahrungen zu gewinnen.","effect":"Im Plädoyer für eine Bibliothek erscheint Lesen als Zugang zu unbekannten Lebenswelten; das stützt die Forderung nach Förderung.","context":"Kommentar / Rede"},{"text":"Über ihren Erinnerungen lag ein [[Mantel aus Staub]].","why":"Staub und Mantel beschreiben nicht wörtlich die Erinnerung. Sie übertragen das Bild des Bedeckens auf das Vergessen.","effect":"Die Vergangenheit erscheint schwer zugänglich und lange unbeachtet; so wird die Distanz der Figur zu ihrem früheren Leben erfahrbar.","context":"Literarischer Modelltext"}],"effect":"Im Plädoyer für eine Bibliothek erscheint Lesen als Zugang zu unbekannten Lebenswelten; das stützt die Forderung nach Förderung.","confusion":[["vergleich","Ein Vergleich nennt die Beziehung ausdrücklich, etwa mit „wie“. Eine Metapher überträgt die Bezeichnung."],["personifikation","Eine Personifikation überträgt gerade menschliche Eigenschaften. Sie kann zugleich metaphorisch sein."]],"counter":{"text":"Das Zimmer ist zwanzig Quadratmeter groß.","why":"Die Größenangabe bleibt wörtlich; es wird kein fremder Bedeutungsbereich übertragen."},"memory":"Ein Bild wird zur Bezeichnung.","aliases":[],"classExample":"„Jemandem das Herz brechen“; „Stilmitteldschungel“; „ein Meer von Menschen“","exam":"Die Formulierung „Die Schulbibliothek ist ein Fenster zur Welt.“ zeigt das sprachliche Mittel „Metapher“. Ein Raum mit Büchern wird als Fenster bezeichnet. Übertragen wird die Möglichkeit, neue Aussichten und Erfahrungen zu gewinnen. Im Plädoyer für eine Bibliothek erscheint Lesen als Zugang zu unbekannten Lebenswelten; das stützt die Forderung nach Förderung."},{"id":"vergleich","name":"Vergleich","category":"bild","level":2,"material":true,"simple":"Zwei Dinge werden miteinander verglichen. Ein gemeinsames Merkmal verbindet sie.","definition":"Ein Vergleich setzt Sachverhalte anhand eines gemeinsamen Merkmals ausdrücklich in Beziehung, häufig durch „wie“ oder „als“.","recognize":"Suche Vergleichspartikel und bestimme die beiden verglichenen Größen sowie das gemeinsame Merkmal. Nicht jedes „wie“ ist ein Stilmittel.","examples":[{"text":"Der Rucksack ist schwer [[wie ein Stein]].","why":"Rucksack und Stein werden durch „wie“ verbunden; das gemeinsame Merkmal ist die Schwere.","effect":"Die körperliche Belastung wird anschaulich und leicht vorstellbar.","context":"Alltag"},{"text":"Eine Debatte ohne Zuhören ist [[wie ein Spiel ohne Regeln]].","why":"Die Debatte und das Spiel teilen den Mangel an einer Voraussetzung für faires Miteinander.","effect":"Der Vergleich begründet im Kommentar, warum Zuhören keine Nebensache, sondern Voraussetzung einer sinnvollen Debatte ist.","context":"Kommentar / Rede"},{"text":"Ihr Blick glitt über ihn hinweg [[wie Licht über kaltes Wasser]].","why":"Die Bewegung des Blicks wird ausdrücklich mit dem Gleiten von Licht verglichen.","effect":"Das flüchtige, unberührte Bild vermittelt Distanz; eine erwartete menschliche Nähe bleibt aus.","context":"Literarischer Modelltext"}],"effect":"Der Vergleich begründet im Kommentar, warum Zuhören keine Nebensache, sondern Voraussetzung einer sinnvollen Debatte ist.","confusion":[["metapher","„Die Debatte ist ein Schlachtfeld“ überträgt die Bezeichnung. „Wie ein Schlachtfeld“ stellt die Beziehung ausdrücklich her."]],"counter":{"text":"Ich weiß, wie das Gerät funktioniert.","why":"„Wie“ leitet hier eine indirekte Frage ein und vergleicht keine Größen."},"memory":"Wie oder als verbindet zwei Größen; die gemeinsame Eigenschaft zählt.","aliases":[],"classExample":"„stark wie ein Löwe“","exam":"Die Formulierung „Eine Debatte ohne Zuhören ist wie ein Spiel ohne Regeln.“ zeigt das sprachliche Mittel „Vergleich“. Die Debatte und das Spiel teilen den Mangel an einer Voraussetzung für faires Miteinander. Der Vergleich begründet im Kommentar, warum Zuhören keine Nebensache, sondern Voraussetzung einer sinnvollen Debatte ist."},{"id":"personifikation","name":"Personifikation","category":"bild","level":2,"material":true,"simple":"Etwas Nichtmenschliches verhält sich wie ein Mensch. Zum Beispiel kann ein Wind im Text flüstern.","definition":"Eine Personifikation schreibt Nichtmenschlichem menschliche Eigenschaften, Handlungen oder eine menschliche Gestalt zu.","recognize":"Frage: Wer handelt, und ist diese Handlung typisch menschlich? Auch Abstrakta wie Hoffnung können als Personen auftreten.","examples":[{"text":"Der Wecker [[schreit]] mich an.","why":"Dem Gerät wird ein menschlicher Ausdruck von Lautstärke und Ärger zugeschrieben.","effect":"Der Weckton wirkt aufdringlich; der Satz vermittelt den Widerwillen der geweckten Person.","context":"Alltag"},{"text":"Die Statistik [[verschweigt]] die Geschichten hinter den Zahlen.","why":"Eine Statistik kann keine bewusste Entscheidung zum Verschweigen treffen. Sie wird als handelnde Person dargestellt.","effect":"Der Kommentar lenkt den Blick auf Erfahrungen, die eine bloße Zahlenübersicht nicht zeigt, und fordert eine ergänzende Betrachtung.","context":"Kommentar / Rede"},{"text":"Die Hoffnung [[setzte sich an ihr Bett und wartete]].","why":"Das abstrakte Gefühl erhält einen Körper und menschliche Geduld.","effect":"Hoffnung wird als stille Begleiterin erfahrbar; das Bild betont Trost trotz anhaltender Unsicherheit.","context":"Literarischer Modelltext"}],"effect":"Der Kommentar lenkt den Blick auf Erfahrungen, die eine bloße Zahlenübersicht nicht zeigt, und fordert eine ergänzende Betrachtung.","confusion":[["metapher","Personifikation ist eine besondere Form bildlicher Übertragung. „Ein Meer von Fragen“ ist bildlich, aber nicht menschlich."],["allegorie","Eine ausgeführte Personifikation kann Teil einer Allegorie sein. Nicht jede Vermenschlichung bildet ein ganzes Deutungssystem."]],"counter":{"text":"Der Hund läuft über den Hof.","why":"Laufen ist für einen Hund eine wörtliche, natürliche Tätigkeit und keine Vermenschlichung."},"memory":"Nichtmenschliches bekommt menschliche Züge.","aliases":[],"classExample":"„Der Wind spielte mit ihren Haaren.“","exam":"Die Formulierung „Die Statistik verschweigt die Geschichten hinter den Zahlen.“ zeigt das sprachliche Mittel „Personifikation“. Eine Statistik kann keine bewusste Entscheidung zum Verschweigen treffen. Sie wird als handelnde Person dargestellt. Der Kommentar lenkt den Blick auf Erfahrungen, die eine bloße Zahlenübersicht nicht zeigt, und fordert eine ergänzende Betrachtung."},{"id":"allegorie","name":"Allegorie","category":"bild","level":3,"material":true,"simple":"Eine ganze Figur oder Bildfolge steht für eine abstrakte Idee. Mehrere Einzelheiten des Bildes passen zu dieser Idee.","definition":"Eine Allegorie stellt einen abstrakten Zusammenhang durch eine ausdeutbare konkrete Gestalt oder eine zusammenhängende Bildhandlung dar.","recognize":"Suche einen abstrakten Bezug und mehrere passende Bildelemente. Eine bloße lange Beschreibung ist noch keine Allegorie.","examples":[{"text":"Auf dem Plakat trägt die [[Gerechtigkeit eine Waage und verbundene Augen]].","why":"Die Figur verkörpert Gerechtigkeit. Waage und Augenbinde stehen für Abwägen und Unparteilichkeit.","effect":"Eine abstrakte Vorstellung wird zu einem einprägsamen Bild mit deutbaren Einzelheiten.","context":"Alltag"},{"text":"Die Demokratie ist ein [[Garten: Rechte sind seine Wurzeln, Beteiligung ist das Wasser, Gleichgültigkeit lässt ihn verdorren]].","why":"Garten, Wurzeln, Wasser und Verdorren bilden ein zusammenhängendes Modell politischer Bedingungen.","effect":"Die Bildfolge macht demokratische Teilhabe als dauernde Pflege verständlich und stützt den Aufruf, sich einzubringen.","context":"Kommentar / Rede"},{"text":"[[Die Zeit kam als Wanderin. Sie trug die Jahre im Beutel und ließ an jeder Tür eine Erinnerung zurück.]]","why":"Die Wanderin verkörpert Zeit; ihr Gepäck und ihre Besuche gestalten das Vergehen und Zurückbleiben von Erfahrungen aus.","effect":"Der Lebenslauf erscheint als Begegnung mit einer unaufhaltsam weiterziehenden Gestalt.","context":"Literarischer Modelltext"}],"effect":"Die Bildfolge macht demokratische Teilhabe als dauernde Pflege verständlich und stützt den Aufruf, sich einzubringen.","confusion":[["metapher","Eine einzelne Übertragung kann schon Metapher sein. Die Allegorie entfaltet einen abstrakten Zusammenhang in einem ausdeutbaren Bildgefüge."],["symbol","Ein Symbol verdichtet Bedeutung in einem Zeichen, ohne dass jedes Bildelement systematisch zugeordnet sein muss."]],"counter":{"text":"Ein Gärtner gießt die Blumen.","why":"Ohne erkennbaren zweiten Bedeutungszusammenhang ist dies eine wörtliche Handlung."},"memory":"Ein zusammenhängendes Bild macht eine Idee sichtbar.","aliases":[],"classExample":"Justitia als Darstellung der Gerechtigkeit; Fortuna als Darstellung des Glücks.","exam":"Die Formulierung „Die Demokratie ist ein Garten: Rechte sind seine Wurzeln, Beteiligung ist das Wasser, Gleichgültigkeit lässt ihn verdorren.“ zeigt das sprachliche Mittel „Allegorie“. Garten, Wurzeln, Wasser und Verdorren bilden ein zusammenhängendes Modell politischer Bedingungen. Die Bildfolge macht demokratische Teilhabe als dauernde Pflege verständlich und stützt den Aufruf, sich einzubringen."},{"id":"metonymie","name":"Metonymie","category":"bild","level":3,"material":true,"simple":"Ein Wort ersetzt ein anderes, weil die Dinge sachlich zusammengehören. Zum Beispiel steht der Autor für sein Werk.","definition":"Eine Metonymie ersetzt eine Bezeichnung durch eine sachlich benachbarte, etwa Autor für Werk, Ort für Institution oder Gefäß für Inhalt.","recognize":"Benutze keine bloße Ähnlichkeit als Begründung. Benenne die reale Beziehung zwischen gemeintem und genanntem Gegenstand.","examples":[{"text":"Ich lese gerade [[Schiller]].","why":"Gelesen wird ein Werk, nicht die Person. Der Autor steht für seinen Text.","effect":"Die knappe Bezeichnung setzt gemeinsames Wissen über Autor und Werk voraus.","context":"Alltag"},{"text":"[[Das Rathaus]] muss die Entscheidung endlich erklären.","why":"Gemeint ist die zuständige Stadtverwaltung, nicht das Gebäude. Der Arbeitsort ersetzt die Institution.","effect":"Der Kommentar bündelt Verantwortung bei einer öffentlichen Stelle und formuliert eine klare Forderung.","context":"Kommentar / Rede"},{"text":"Am Abend schwieg [[die ganze Straße]].","why":"Nicht der Straßenbelag, sondern die dort lebenden Menschen werden als schweigend beschrieben.","effect":"Die Ortsbezeichnung fasst die Bewohner zu einer Gemeinschaft zusammen; dadurch wirkt die Stille umfassend.","context":"Literarischer Modelltext"}],"effect":"Der Kommentar bündelt Verantwortung bei einer öffentlichen Stelle und formuliert eine klare Forderung.","confusion":[["metapher","Die Metapher arbeitet mit Ähnlichkeit; die Metonymie mit sachlicher Nachbarschaft."],["pars-pro-toto","Beim Pars pro toto ist die Beziehung speziell Teil zu Ganzem. Manche Systematiken ordnen es der Metonymie unter; in dieser App wird genauer unterschieden."]],"counter":{"text":"Die Stadt ist ein Ameisenhaufen.","why":"Das beruht auf einer Ähnlichkeit vieler Bewegungen, nicht auf sachlicher Nachbarschaft."},"memory":"Nähe statt Ähnlichkeit: Autor, Werk; Ort, Institution.","aliases":[],"classExample":"„Goethe lesen“; „eine Tasse trinken“; „Tempo“ für Papiertaschentuch.","exam":"Die Formulierung „Das Rathaus muss die Entscheidung endlich erklären.“ zeigt das sprachliche Mittel „Metonymie“. Gemeint ist die zuständige Stadtverwaltung, nicht das Gebäude. Der Arbeitsort ersetzt die Institution. Der Kommentar bündelt Verantwortung bei einer öffentlichen Stelle und formuliert eine klare Forderung."},{"id":"pars-pro-toto","name":"Pars pro toto","category":"bild","level":3,"material":true,"simple":"Ein Teil steht für das Ganze. Gemeint ist mehr, als das Wort wörtlich nennt.","definition":"Pars pro toto ist eine Form der Synekdoche, bei der ein Teil stellvertretend für ein Ganzes genannt wird.","recognize":"Prüfe eine echte Teil-Ganzes-Beziehung und die Richtung: Genannt ist der Teil, gemeint das Ganze. Die Gegenrichtung heißt Totum pro parte.","examples":[{"text":"Wir brauchen noch zwei [[helfende Hände]].","why":"Die Hände stehen für die Menschen, die bei der Arbeit helfen.","effect":"Der Ausdruck rückt die praktische Unterstützung und nicht die Person als Ganzes in den Vordergrund.","context":"Alltag"},{"text":"Jeder [[Kopf]] in dieser Klasse zählt.","why":"Gemeint ist jeder Schüler beziehungsweise jede Schülerin, nicht nur ein Körperteil.","effect":"Die Formulierung betont, dass alle Mitglieder der Lerngruppe berücksichtigt werden sollen.","context":"Kommentar / Rede"},{"text":"Am Horizont kehrten drei [[Segel]] in den Hafen zurück.","why":"Die Segel stehen für die vollständigen Segelschiffe.","effect":"Das auffällige sichtbare Detail prägt die Wahrnehmung der fernen Schiffe und verdichtet die Szene.","context":"Literarischer Modelltext"}],"effect":"Die Formulierung betont, dass alle Mitglieder der Lerngruppe berücksichtigt werden sollen.","confusion":[["metonymie","Metonymie kann andere sachliche Beziehungen nutzen, etwa Autor und Werk. Pars pro toto nennt genau einen Teil."],["synekdoche","Synekdoche ist der weitere Begriff; Pars pro toto ist eine bestimmte Richtung der Ersetzung."]],"counter":{"text":"Sie repariert das Segel des Bootes.","why":"Hier ist tatsächlich nur das Segel gemeint; es ersetzt nicht das Boot."},"memory":"Genannt: der Teil. Gemeint: das Ganze.","aliases":[],"classExample":"„Klinge“ statt „Schwert“. Die im Blatt zusätzlich genannte umgekehrte Richtung heißt genauer Totum pro parte.","exam":"Die Formulierung „Jeder Kopf in dieser Klasse zählt.“ zeigt das sprachliche Mittel „Pars pro toto“. Gemeint ist jeder Schüler beziehungsweise jede Schülerin, nicht nur ein Körperteil. Die Formulierung betont, dass alle Mitglieder der Lerngruppe berücksichtigt werden sollen."},{"id":"periphrase","name":"Periphrase","category":"bild","level":3,"material":true,"simple":"Du nennst etwas nicht direkt. Stattdessen beschreibst du es mit kennzeichnenden Merkmalen.","definition":"Eine Periphrase umschreibt eine Person oder Sache durch charakteristische Merkmale anstelle ihrer direkten Bezeichnung.","recognize":"Frage, welcher direkte Name durch die Wortgruppe ersetzt wird. Die Umschreibung muss im Kontext zuordenbar sein.","examples":[{"text":"Kannst du mir den [[kleinen Helfer gegen den Regen]] reichen? Gemeint ist der Schirm.","why":"Der Gegenstand wird über seine Funktion statt über seinen Namen bezeichnet.","effect":"Die bekannte Alltagssache wirkt spielerisch und persönlich.","context":"Alltag"},{"text":"Auch [[die Menschen, die nachts unsere Straßen reinigen]], verdienen mehr Aufmerksamkeit.","why":"Die Berufsbezeichnung wird durch eine charakteristische Tätigkeit ersetzt.","effect":"Der Kommentar macht die konkrete Arbeit sichtbar und unterstützt die Forderung nach gesellschaftlicher Anerkennung.","context":"Kommentar / Rede"},{"text":"Sie suchte [[den Ort, an dem ihre ersten Schritte Spuren hinterlassen hatten]].","why":"Die Umschreibung ersetzt im Kontext das Elternhaus oder die frühere Heimat.","effect":"Der Ort wird mit biografischer Erinnerung verbunden; die Rückkehr erhält eine emotionale Bedeutung.","context":"Literarischer Modelltext"}],"effect":"Der Kommentar macht die konkrete Arbeit sichtbar und unterstützt die Forderung nach gesellschaftlicher Anerkennung.","confusion":[["euphemismus","Eine Periphrase muss nichts beschönigen. Ein Euphemismus mildert ausdrücklich einen problematischen Sachverhalt."],["metapher","Eine Umschreibung kann bildlich sein, muss es aber nicht."]],"counter":{"text":"Der Schirm liegt im Flur.","why":"Der Gegenstand wird unmittelbar benannt."},"memory":"Beschreiben statt direkt benennen.","aliases":[],"classExample":"„Das Land, wo die Zitronen blühn“ als Umschreibung Italiens.","exam":"Die Formulierung „Auch die Menschen, die nachts unsere Straßen reinigen, verdienen mehr Aufmerksamkeit.“ zeigt das sprachliche Mittel „Periphrase“. Die Berufsbezeichnung wird durch eine charakteristische Tätigkeit ersetzt. Der Kommentar macht die konkrete Arbeit sichtbar und unterstützt die Forderung nach gesellschaftlicher Anerkennung."},{"id":"synaesthesie","name":"Synästhesie","category":"bild","level":3,"material":true,"simple":"Wörter aus verschiedenen Sinnen werden verbunden. Ein Klang kann zum Beispiel als süß beschrieben werden.","definition":"Eine Synästhesie verbindet sprachlich Wahrnehmungen aus unterschiedlichen Sinnesbereichen.","recognize":"Ordne die beteiligten Wörter Sinnen zu: Sehen, Hören, Riechen, Schmecken oder Tasten. Zwei Wörter aus demselben Sinn reichen nicht.","examples":[{"text":"Die Sängerin hat eine [[warme Stimme]].","why":"Wärme gehört zum Tasten und Temperaturempfinden, Stimme zum Hören.","effect":"Der Klang erscheint angenehm und geborgen; die körperliche Empfindung wird auf den Höreindruck übertragen.","context":"Alltag"},{"text":"Die Werbung verspricht einen [[samtweichen Klang]].","why":"Die tastbare Eigenschaft des Samts wird auf einen Höreindruck bezogen.","effect":"Die Werbung macht eine schwer beschreibbare Klangqualität sinnlich vorstellbar und wertet sie positiv.","context":"Kommentar / Rede"},{"text":"Aus dem offenen Fenster fiel [[goldene Musik]] in die Gasse.","why":"Die sichtbare Farbe und der Glanz von Gold werden mit hörbarer Musik verbunden.","effect":"Der Klang bekommt Leuchtkraft und Kostbarkeit; die Szene wirkt sinnlich verdichtet.","context":"Literarischer Modelltext"}],"effect":"Die Werbung macht eine schwer beschreibbare Klangqualität sinnlich vorstellbar und wertet sie positiv.","confusion":[["metapher","Synästhesie ist eine besondere Übertragung zwischen Sinnesgebieten. Nicht jede Metapher verbindet Sinne."]],"counter":{"text":"Die Musik ist laut.","why":"Lautstärke gehört zum Hören. Es findet kein Wechsel des Sinnesbereichs statt."},"memory":"Ein Sinn spricht mit den Wörtern eines anderen.","aliases":["Synästhesie","Synaesthesie"],"classExample":"„Golden wehn die Töne, süß spricht das Herz.“","exam":"Die Formulierung „Die Werbung verspricht einen samtweichen Klang.“ zeigt das sprachliche Mittel „Synästhesie“. Die tastbare Eigenschaft des Samts wird auf einen Höreindruck bezogen. Die Werbung macht eine schwer beschreibbare Klangqualität sinnlich vorstellbar und wertet sie positiv."},{"id":"euphemismus","name":"Euphemismus","category":"bild","level":3,"material":true,"simple":"Etwas Unangenehmes wird milder oder freundlicher bezeichnet. Das kann schonend sein oder Probleme verdecken.","definition":"Ein Euphemismus ersetzt eine als hart, anstößig oder belastend empfundene Bezeichnung durch einen mildernden Ausdruck.","recognize":"Formuliere den Sachverhalt möglichst neutral und vergleiche die Wertung. Entscheidend ist die beschönigende Wirkung im Kontext.","examples":[{"text":"Die Familie sagt: Er ist [[von uns gegangen]].","why":"Der Tod wird durch eine mildere Umschreibung ersetzt.","effect":"Die Formulierung kann in einem Trauergespräch Rücksicht nehmen und emotionalen Schmerz abfedern.","context":"Alltag"},{"text":"Die Firma nennt den Abbau von Arbeitsplätzen [[Personalanpassung]].","why":"Die konkrete Entlassung wird durch einen neutral klingenden Verwaltungsausdruck ersetzt.","effect":"Der Begriff kann die Folgen für Betroffene verdecken; ein kritischer Kommentar kann diese Verschleierung offenlegen.","context":"Kommentar / Rede"},{"text":"Man sagte, das Dorf werde [[weichen müssen]], während bereits die Häuser fielen.","why":"Die Zerstörung und der Verlust der Heimat erscheinen als sanftes, fast freiwilliges Zurücktreten.","effect":"Der Gegensatz zur sichtbaren Zerstörung macht die beschönigende Amtssprache kritisch erkennbar.","context":"Literarischer Modelltext"}],"effect":"Der Begriff kann die Folgen für Betroffene verdecken; ein kritischer Kommentar kann diese Verschleierung offenlegen.","confusion":[["litotes","Litotes bejaht durch Verneinung des Gegenteils. Euphemismus beschreibt eine beschönigende Funktion, nicht eine bestimmte Negationsform."],["periphrase","Nicht jede Umschreibung beschönigt; beide Mittel können gemeinsam auftreten."]],"counter":{"text":"Dreißig Beschäftigte werden entlassen.","why":"Die Aussage benennt den Sachverhalt direkt, ohne ihn sprachlich abzumildern."},"memory":"Milde Wörter können harte Wirklichkeit verdecken.","aliases":[],"classExample":"„entschlafen“ statt „sterben“","exam":"Die Formulierung „Die Firma nennt den Abbau von Arbeitsplätzen Personalanpassung.“ zeigt das sprachliche Mittel „Euphemismus“. Die konkrete Entlassung wird durch einen neutral klingenden Verwaltungsausdruck ersetzt. Der Begriff kann die Folgen für Betroffene verdecken; ein kritischer Kommentar kann diese Verschleierung offenlegen."},{"id":"hyperbel","name":"Hyperbel","category":"bild","level":2,"material":true,"simple":"Etwas wird absichtlich sehr stark übertrieben. Die Aussage ist nicht wörtlich gemeint.","definition":"Eine Hyperbel übersteigert einen Sachverhalt über das glaubhafte oder sachlich angemessene Maß hinaus.","recognize":"Prüfe, ob die Aussage als auffällige Übertreibung erkennbar ist. Ein bloßer großer Zahlenwert ist nicht automatisch eine Hyperbel.","examples":[{"text":"Ich habe dir das schon [[tausendmal]] erklärt.","why":"Die Zahl ist im üblichen Gespräch nicht als genau gezählte Häufigkeit gemeint.","effect":"Die Übertreibung betont Ungeduld und den Eindruck ständiger Wiederholung.","context":"Alltag"},{"text":"Wer jedes Klingeln beantwortet, kommt [[nie mehr zum Denken]].","why":"Es wird absolute Unmöglichkeit behauptet, obwohl Denkpausen weiter möglich sind.","effect":"Die Zuspitzung dramatisiert die Ablenkung durch Benachrichtigungen und stützt die Forderung nach störungsfreien Lernphasen.","context":"Kommentar / Rede"},{"text":"Sie wartete, bis [[ganze Zeitalter zwischen zwei Atemzügen]] vergangen waren.","why":"Zwischen Atemzügen vergehen keine Zeitalter; die Dauer wird extrem überhöht.","effect":"Die übersteigerte Zeitwahrnehmung vermittelt Anspannung und subjektiv endloses Warten.","context":"Literarischer Modelltext"}],"effect":"Die Zuspitzung dramatisiert die Ablenkung durch Benachrichtigungen und stützt die Forderung nach störungsfreien Lernphasen.","confusion":[["klimax","Klimax braucht eine steigende Folge. Eine Hyperbel kann aus nur einem übertriebenen Ausdruck bestehen."]],"counter":{"text":"Die Fahrt dauerte tatsächlich drei Stunden.","why":"Eine zutreffende Dauerangabe ist keine Übertreibung."},"memory":"Übertreibung ist nicht wörtlich zu nehmen.","aliases":[],"classExample":"„Es dauert eine Ewigkeit“; „Ich weiß alles.“","exam":"Die Formulierung „Wer jedes Klingeln beantwortet, kommt nie mehr zum Denken.“ zeigt das sprachliche Mittel „Hyperbel“. Es wird absolute Unmöglichkeit behauptet, obwohl Denkpausen weiter möglich sind. Die Zuspitzung dramatisiert die Ablenkung durch Benachrichtigungen und stützt die Forderung nach störungsfreien Lernphasen."},{"id":"litotes","name":"Litotes","category":"bild","level":3,"material":true,"simple":"Du sagst etwas, indem du das Gegenteil verneinst. „Nicht schlecht“ kann im Kontext ein vorsichtiges Lob sein.","definition":"Eine Litotes formuliert eine Aussage durch Verneinung ihres Gegenteils, häufig als Untertreibung oder indirekte Verstärkung.","recognize":"Suche die Verneinung und das verneinte Gegenmerkmal. Bestimme dann anhand des Kontextes, wie stark die positive Aussage gemeint ist.","examples":[{"text":"Nach einer hervorragenden Präsentation sagt jemand: Das war [[nicht schlecht]].","why":"Verneint wird „schlecht“; im Lobkontext ist eine deutlich positive Bewertung gemeint.","effect":"Das Lob wirkt zurückhaltend und kann gerade dadurch Anerkennung hervorheben.","context":"Alltag"},{"text":"Die Folgekosten sind [[nicht unerheblich]].","why":"Die geringe Bedeutung der Kosten wird verneint; gemeint sind spürbare Kosten.","effect":"Die zurückhaltende Form mahnt zur Vorsicht, ohne die Warnung plakativ zu übertreiben.","context":"Kommentar / Rede"},{"text":"Sie ging diesen Weg [[nicht ohne Furcht]].","why":"Furchtlosigkeit wird verneint; die Figur empfindet Angst.","effect":"Die indirekte Form lässt die Angst beherrscht erscheinen und unterstreicht, dass der Aufbruch trotzdem erfolgt.","context":"Literarischer Modelltext"}],"effect":"Die zurückhaltende Form mahnt zur Vorsicht, ohne die Warnung plakativ zu übertreiben.","confusion":[["euphemismus","Euphemismus beschönigt etwas; eine Litotes muss nicht beschönigen und kann eine Kritik verstärken."],["hyperbel","Hyperbel übersteigert offen; Litotes kann durch scheinbar zurückhaltende Negation wirken."]],"counter":{"text":"Ich habe das Buch nicht gelesen.","why":"Die Aussage verneint eine Handlung direkt, ohne dadurch das Gegenteil einer Eigenschaft positiv auszudrücken."},"memory":"Das Gegenteil verneinen, statt direkt bejahen.","aliases":[],"classExample":"„nicht schlecht“; „nicht gerade ein Held“; „Er war nicht ehrlich zu dir.“ Die Deutung als indirekte Verstärkung benötigt Kontext.","exam":"Die Formulierung „Die Folgekosten sind nicht unerheblich.“ zeigt das sprachliche Mittel „Litotes“. Die geringe Bedeutung der Kosten wird verneint; gemeint sind spürbare Kosten. Die zurückhaltende Form mahnt zur Vorsicht, ohne die Warnung plakativ zu übertreiben."},{"id":"symbol","name":"Symbol","category":"bild","level":3,"material":false,"simple":"Ein konkretes Zeichen trägt eine weitere Bedeutung. Ein Schlüssel kann in einer Geschichte etwa für einen neuen Zugang stehen.","definition":"Ein Symbol ist ein wahrnehmbares Zeichen oder Motiv, das im kulturellen oder textlichen Zusammenhang über sich hinaus auf eine weitere Bedeutung verweist.","recognize":"Prüfe den Kontext und mögliche Wiederholungen. Die Zusatzbedeutung muss am Text oder an einer verständlichen Konvention begründet werden.","examples":[{"text":"Auf der Karte steht eine [[weiße Taube]] für Frieden.","why":"Die Vogelgestalt wird als bekanntes Friedenszeichen verwendet.","effect":"Der abstrakte Wunsch wird ohne ausführliche Erklärung sichtbar.","context":"Alltag"},{"text":"Im Kommentar steht die [[offene Tür]] der Bibliothek für Zugang zu Bildung.","why":"Das konkrete Motiv verweist auf gesellschaftliche Offenheit und Teilhabe.","effect":"Es bündelt die Forderung, Bildung nicht nur formal, sondern tatsächlich zugänglich zu machen.","context":"Kommentar / Rede"},{"text":"Auch nach der Heimkehr hielt sie den [[rostigen Schlüssel]] fest; keine Tür ließ sich damit mehr öffnen.","why":"Im Zusammenhang verweist der unbrauchbare Schlüssel auf verlorene Zugehörigkeit, nicht nur auf ein Werkzeug.","effect":"Das Motiv verdichtet die unerfüllbare Sehnsucht nach einem früheren Zuhause.","context":"Literarischer Modelltext"}],"effect":"Es bündelt die Forderung, Bildung nicht nur formal, sondern tatsächlich zugänglich zu machen.","confusion":[["allegorie","Bei der Allegorie lassen sich mehrere Bildelemente systematisch ausdeuten. Das Symbol kann offener und mehrdeutig bleiben."]],"counter":{"text":"Sie öffnet mit dem Schlüssel die Haustür.","why":"Ohne weiteren Kontext ist das lediglich die praktische Verwendung eines Gegenstands."},"memory":"Ein Zeichen verweist über sich hinaus.","aliases":[],"classExample":"Ergänzung zum fotografierten Unterrichtsstoff.","exam":"Die Formulierung „Im Kommentar steht die offene Tür der Bibliothek für Zugang zu Bildung.“ zeigt das sprachliche Mittel „Symbol“. Das konkrete Motiv verweist auf gesellschaftliche Offenheit und Teilhabe. Es bündelt die Forderung, Bildung nicht nur formal, sondern tatsächlich zugänglich zu machen."},{"id":"anapher","name":"Anapher","category":"muster","level":2,"material":true,"simple":"Mehrere Sätze oder Satzteile beginnen mit demselben Wort. So entsteht ein wiederkehrender Anfang.","definition":"Eine Anapher wiederholt Wörter oder Wortgruppen am Anfang aufeinanderfolgender Sätze, Verse oder vergleichbarer Einheiten.","recognize":"Vergleiche die Anfänge mehrerer Einheiten. Gleiche Satzstruktur allein reicht nicht; die Wörter am Anfang müssen sich wiederholen.","examples":[{"text":"[[Ich will]] schlafen. [[Ich will]] Ruhe.","why":"Die beiden Sätze beginnen mit derselben Wortgruppe „Ich will“.","effect":"Die Wiederholung betont das Bedürfnis und wirkt nachdrücklich.","context":"Alltag"},{"text":"[[Wir brauchen]] Räume zum Lesen. [[Wir brauchen]] Zeit zum Denken. [[Wir brauchen]] Mut zur Diskussion.","why":"Drei Forderungen setzen mit genau denselben Wörtern ein.","effect":"Der gemeinsame Anfang verbindet die Forderungen zu einem Programm und erhöht ihre Eindringlichkeit.","context":"Kommentar / Rede"},{"text":"[[Noch]] stand ihr Stuhl am Fenster. [[Noch]] hing ihr Mantel an der Tür. [[Noch]] wartete das Haus.","why":"„Noch“ steht jeweils am Satzanfang; im letzten Satz tritt zusätzlich eine Personifikation auf.","effect":"Die Wiederholung hält die Spuren einer abwesenden Person fest und lässt einen bevorstehenden Verlust spürbar werden.","context":"Literarischer Modelltext"}],"effect":"Der gemeinsame Anfang verbindet die Forderungen zu einem Programm und erhöht ihre Eindringlichkeit.","confusion":[["epipher","Epipher wiederholt am Ende, Anapher am Anfang."],["parallelismus","Parallelismus betrifft die Satzstruktur. Eine Anapher kann mit ihm zusammen auftreten."]],"counter":{"text":"Heute lese ich. Morgen schreibe ich.","why":"Die Anfänge sind verschieden; wiederholt wird „ich“ am Ende."},"memory":"Anapher: am Anfang.","aliases":["Anaphora"],"classExample":"„Ich wollte rennen, ich wollte fliegen, ich wollte alles erreichen!“","exam":"Die Formulierung „Wir brauchen Räume zum Lesen. Wir brauchen Zeit zum Denken. Wir brauchen Mut zur Diskussion.“ zeigt das sprachliche Mittel „Anapher“. Drei Forderungen setzen mit genau denselben Wörtern ein. Der gemeinsame Anfang verbindet die Forderungen zu einem Programm und erhöht ihre Eindringlichkeit."},{"id":"epipher","name":"Epipher","category":"muster","level":3,"material":true,"simple":"Mehrere Sätze oder Satzteile enden mit denselben Wörtern. Der Schluss kehrt immer wieder.","definition":"Eine Epipher wiederholt Wörter oder Wortgruppen am Ende aufeinanderfolgender Sätze, Verse oder vergleichbarer Einheiten.","recognize":"Vergleiche die Enden. Eine einmalige Formulierung kann ohne weitere Textstelle nicht als Epipher nachgewiesen werden.","examples":[{"text":"Am Morgen fehlt mir [[Zeit]]. Am Abend fehlt mir [[Zeit]].","why":"Beide Sätze schließen mit demselben Wort.","effect":"Das wiederholte Ende macht Zeitmangel zum beherrschenden Problem.","context":"Alltag"},{"text":"Die Schule braucht [[Vertrauen]]. Die Familien brauchen [[Vertrauen]]. Die ganze Debatte braucht [[Vertrauen]].","why":"Die Einheiten münden jeweils in „Vertrauen“.","effect":"Das Schlüsselwort wird zum gemeinsamen Ziel verschiedener Beteiligter; die Rede bündelt ihre Forderung darauf.","context":"Kommentar / Rede"},{"text":"Er suchte im Haus [[nach ihr]]. Er fragte den Wind [[nach ihr]]. Er lauschte der Nacht [[nach ihr]].","why":"Die drei Sätze enden identisch; Wind und Nacht ergänzen bildhafte Sprache.","effect":"Jede Suchbewegung kehrt zu derselben Person zurück. Das verstärkt den Eindruck von Sehnsucht und Ausweglosigkeit.","context":"Literarischer Modelltext"}],"effect":"Das Schlüsselwort wird zum gemeinsamen Ziel verschiedener Beteiligter; die Rede bündelt ihre Forderung darauf.","confusion":[["anapher","Der Unterschied ist die Position der wiederholten Wörter."],["epiphrase","Epiphrase ist ein Nachtrag zu einem abgeschlossenen Satz, keine Wiederholung am Satzende."]],"counter":{"text":"Wir warten auf Antworten.","why":"Ein einzelner Satz weist keine wiederholten Enden nach."},"memory":"Epipher: am Ende.","aliases":[],"classExample":"„Wir wollen gute Noten. Nichts ist uns wichtiger als gute Noten.“","exam":"Die Formulierung „Die Schule braucht Vertrauen. Die Familien brauchen Vertrauen. Die ganze Debatte braucht Vertrauen.“ zeigt das sprachliche Mittel „Epipher“. Die Einheiten münden jeweils in „Vertrauen“. Das Schlüsselwort wird zum gemeinsamen Ziel verschiedener Beteiligter; die Rede bündelt ihre Forderung darauf."},{"id":"repetitio","name":"Repetitio","category":"muster","level":2,"material":true,"simple":"Ein Wort oder eine Wortgruppe wird wiederholt. Wichtiges bleibt dadurch im Ohr.","definition":"Repetitio bezeichnet die Wiederholung sprachlicher Elemente; Anapher und Epipher sind positionsgebundene Sonderformen.","recognize":"Suche tatsächlich wiederkehrende Wörter. Ähnliche Bedeutungen allein sind keine wörtliche Wiederholung.","examples":[{"text":"[[Weiter, weiter]]!","why":"Dasselbe Wort steht zweimal unmittelbar hintereinander.","effect":"Die Wiederholung treibt an und verstärkt den Handlungsdruck.","context":"Alltag"},{"text":"Wir warten auf Ergebnisse und [[warten und warten]].","why":"Das Verb kehrt mehrfach zurück, ohne dass es um einen wechselnden Wortstamm geht.","effect":"Die gedehnte Wiederholung bildet die als quälend empfundene Verzögerung nach und kritisiert Untätigkeit.","context":"Kommentar / Rede"},{"text":"[[Fort]] war der Klang, [[fort]] das Licht, [[fort]] die Wärme.","why":"„Fort“ wird wiederholt, jeweils am Anfang der verkürzten Einheiten; daher ist auch Anapher zutreffend.","effect":"Die wiederholte Abwesenheit lässt den Verlust mehrere Wahrnehmungsbereiche erfassen.","context":"Literarischer Modelltext"}],"effect":"Die gedehnte Wiederholung bildet die als quälend empfundene Verzögerung nach und kritisiert Untätigkeit.","confusion":[["figura-etymologica","Figura etymologica verbindet verschiedene Wörter desselben Stamms; Repetitio wiederholt ein Element."],["anapher","Anapher ist die genauere Bezeichnung, wenn die Wiederholung jeweils am Anfang steht."]],"counter":{"text":"Sie ist mutig und tapfer.","why":"Die Bedeutungen ähneln sich, die Wörter sind aber nicht identisch."},"memory":"Dasselbe sprachliche Element kommt wieder.","aliases":["Wiederholung"],"classExample":"„Bald da, bald dort.“ Zusätzlich wiederholt sich ein Einheitsanfang.","exam":"Die Formulierung „Wir warten auf Ergebnisse und warten und warten.“ zeigt das sprachliche Mittel „Repetitio“. Das Verb kehrt mehrfach zurück, ohne dass es um einen wechselnden Wortstamm geht. Die gedehnte Wiederholung bildet die als quälend empfundene Verzögerung nach und kritisiert Untätigkeit."},{"id":"parallelismus","name":"Parallelismus","category":"muster","level":3,"material":true,"simple":"Mehrere Satzteile haben denselben Bauplan. Die Wörter dürfen unterschiedlich sein.","definition":"Ein Parallelismus ordnet entsprechende Satzglieder in aufeinanderfolgenden Einheiten in gleicher syntaktischer Folge an.","recognize":"Bestimme die Funktionen der Satzteile, etwa Subjekt, Prädikat und Objekt. Vergleiche ihren Bauplan statt nur einzelne Wörter.","examples":[{"text":"[[Mia liest Bücher]]. [[Ben schreibt Briefe]].","why":"Beide Sätze folgen dem Schema Subjekt – Prädikat – Objekt.","effect":"Die gleich gebauten Aussagen stellen die Tätigkeiten gleichrangig nebeneinander.","context":"Alltag"},{"text":"[[Wir schützen Daten]]. [[Wir stärken Rechte]].","why":"Die Forderungen haben denselben grammatischen Aufbau; zusätzlich beginnt jede mit „Wir“.","effect":"Der gleichmäßige Satzbau verbindet Datenschutz und Rechte als zusammengehörende Ziele.","context":"Kommentar / Rede"},{"text":"[[Der Tag brachte Fragen]]. [[Die Nacht trug Antworten]].","why":"Die Einheiten folgen demselben Bauplan, auch wenn die Tätigkeiten metaphorisch beschrieben sind.","effect":"Die formale Entsprechung stellt Tag und Nacht als aufeinander bezogene Erfahrungsräume dar.","context":"Literarischer Modelltext"}],"effect":"Der gleichmäßige Satzbau verbindet Datenschutz und Rechte als zusammengehörende Ziele.","confusion":[["chiasmus","Parallelismus: A–B / A–B. Chiasmus: A–B / B–A."],["anapher","Gleicher Satzbau verlangt keine identischen Anfangswörter; Anapher verlangt sie."]],"counter":{"text":"Mia liest Bücher, während Ben von seinen Briefen erzählt.","why":"Die grammatischen Strukturen sind hier nicht parallel aufgebaut."},"memory":"Gleicher Bauplan, nicht zwingend gleiche Wörter.","aliases":[],"classExample":"„Wir sind vier Mädchen, wir sind 22 Jungen.“","exam":"Die Formulierung „Wir schützen Daten. Wir stärken Rechte.“ zeigt das sprachliche Mittel „Parallelismus“. Die Forderungen haben denselben grammatischen Aufbau; zusätzlich beginnt jede mit „Wir“. Der gleichmäßige Satzbau verbindet Datenschutz und Rechte als zusammengehörende Ziele."},{"id":"chiasmus","name":"Chiasmus","category":"muster","level":3,"material":true,"simple":"Zwei Satzteile sind über Kreuz gebaut. Eine Reihenfolge wird im zweiten Teil umgedreht.","definition":"Ein Chiasmus stellt syntaktisch oder semantisch entsprechende Elemente über Kreuz nach dem Muster A–B / B–A.","recognize":"Benenne ausdrücklich, welche Elemente die Rollen A und B übernehmen. Ein Gegensatz allein beweist keine Kreuzstellung.","examples":[{"text":"[[Ich mag den Sommer; den Winter magst du]].","why":"Zuerst steht die Person vor der Jahreszeit, dann die Jahreszeit vor der Person: Subjekt – Objekt / Objekt – Subjekt.","effect":"Der umgekehrte Bau hebt die unterschiedlichen Vorlieben hervor.","context":"Alltag"},{"text":"[[Die Technik soll dem Menschen dienen, nicht der Mensch der Technik]].","why":"Die Rollen von Mensch und Technik werden im zweiten Teil überkreuz getauscht.","effect":"Die Kreuzstellung stellt die gewünschte Rangordnung der problematischen Umkehrung gegenüber und verdichtet die Kritik.","context":"Kommentar / Rede"},{"text":"[[Hell war der Morgen, der Abend war dunkel]].","why":"Im ersten Teil steht die Eigenschaft vor dem Subjekt, im zweiten das Subjekt vor der Eigenschaft.","effect":"Der spiegelnde Aufbau betont den Wandel von Helligkeit zu Dunkelheit; zugleich liegt eine Antithese vor.","context":"Literarischer Modelltext"}],"effect":"Die Kreuzstellung stellt die gewünschte Rangordnung der problematischen Umkehrung gegenüber und verdichtet die Kritik.","confusion":[["parallelismus","Parallelismus bewahrt die Reihenfolge, Chiasmus kehrt sie um."],["antithese","Antithese beschreibt einen Bedeutungsgegensatz. Chiasmus beschreibt die Anordnung. Beides kann gleichzeitig vorliegen."]],"counter":{"text":"Der Morgen ist hell, der Abend ist dunkel.","why":"Es gibt einen Gegensatz, aber beide Einheiten haben denselben Aufbau."},"memory":"A–B wird zu B–A.","aliases":[],"classExample":"„Der Einsatz war groß, klein war der Gewinn.“ Zugleich liegt ein Gegensatz zwischen groß und klein vor.","exam":"Die Formulierung „Die Technik soll dem Menschen dienen, nicht der Mensch der Technik.“ zeigt das sprachliche Mittel „Chiasmus“. Die Rollen von Mensch und Technik werden im zweiten Teil überkreuz getauscht. Die Kreuzstellung stellt die gewünschte Rangordnung der problematischen Umkehrung gegenüber und verdichtet die Kritik."},{"id":"alliteration","name":"Alliteration","category":"muster","level":2,"material":true,"simple":"Benachbarte wichtige Wörter beginnen mit demselben Laut. Der Klang verbindet sie.","definition":"Eine Alliteration wiederholt den Anfangslaut betonter Stammsilben benachbarter oder eng verbundener Wörter.","recognize":"Höre auf den Laut, nicht nur auf den Buchstaben. Kleine Verbindungswörter können dazwischenstehen.","examples":[{"text":"[[Mila malt Muster]].","why":"Die betonten Wörter beginnen hörbar mit dem Laut m.","effect":"Der Gleichklang macht den Satz rhythmisch und leicht merkbar.","context":"Alltag"},{"text":"Wir brauchen [[Mut statt Mauern]].","why":"Die bedeutungstragenden Wörter „Mut“ und „Mauern“ haben denselben Anfangslaut.","effect":"Der Klang koppelt die Alternative eng und macht die politische Forderung einprägsam.","context":"Kommentar / Rede"},{"text":"[[Leise lag das Licht]] auf den verlassenen Wegen.","why":"Die l-Anlaute wiederholen sich in mehreren benachbarten Wörtern.","effect":"Der sanfte Gleichklang kann hier die ruhige, gedämpfte Atmosphäre unterstützen.","context":"Literarischer Modelltext"}],"effect":"Der Klang koppelt die Alternative eng und macht die politische Forderung einprägsam.","confusion":[["anapher","Alliteration wiederholt einen Laut; Anapher ganze Wörter an Einheitsanfängen."],["onomatopoesie","Lautmalerei ahmt einen bezeichneten Klang nach. Alliteration verlangt keine Geräuschnachahmung."]],"counter":{"text":"Chemie und Chor","why":"Die Anfangsbuchstaben sind gleich, die üblichen deutschen Anfangslaute unterscheiden sich."},"memory":"Gleicher Anfangslaut, nicht nur gleicher Buchstabe.","aliases":[],"classExample":"„Stefanie strahlt stundenlang“; „Daniel Dauerdöser denkt: Das dauert doch noch.“","exam":"Die Formulierung „Wir brauchen Mut statt Mauern.“ zeigt das sprachliche Mittel „Alliteration“. Die bedeutungstragenden Wörter „Mut“ und „Mauern“ haben denselben Anfangslaut. Der Klang koppelt die Alternative eng und macht die politische Forderung einprägsam."},{"id":"figura-etymologica","name":"Figura etymologica","category":"muster","level":3,"material":true,"simple":"Verschiedene Wörter aus derselben Wortfamilie stehen eng zusammen. Oft wird ein Verb mit einem verwandten Nomen verbunden.","definition":"Eine Figura etymologica verbindet etymologisch beziehungsweise wortstammverwandte Ausdrücke in enger syntaktischer Beziehung.","recognize":"Suche unterschiedliche Wörter mit gemeinsamem Stamm. Bloße Flexionsformen oder eine identische Wortwiederholung sind nicht das typische Muster.","examples":[{"text":"Sie [[träumt einen schönen Traum]].","why":"Das Verb „träumen“ und das Nomen „Traum“ gehören zur selben Wortfamilie.","effect":"Die Verbindung hebt das Träumen und seinen Inhalt nachdrücklich hervor.","context":"Alltag"},{"text":"Wer [[Freiheit erkämpft]], muss auch bereit sein, den [[Kampf]] für sie fortzusetzen.","why":"Das Verb „erkämpfen“ und das Nomen „Kampf“ sind stammverwandt und inhaltlich verbunden.","effect":"Die Wortverwandtschaft bindet erreichte Freiheit an fortdauernde Anstrengung und stützt die Aufforderung zu Engagement.","context":"Kommentar / Rede"},{"text":"Er wollte ein [[Leben leben]], das seinen Namen verdiente.","why":"Nomen und Verb besitzen denselben Stamm und bilden eine enge Verbindung.","effect":"Die Figur betont den Anspruch auf ein bewusst gestaltetes, nicht bloß vergehendes Leben.","context":"Literarischer Modelltext"}],"effect":"Die Wortverwandtschaft bindet erreichte Freiheit an fortdauernde Anstrengung und stützt die Aufforderung zu Engagement.","confusion":[["repetitio","„Kampf, Kampf“ wiederholt dasselbe Wort. „Einen Kampf kämpfen“ verbindet unterschiedliche stammverwandte Wörter."]],"counter":{"text":"Sie träumt und träumt.","why":"Das ist Wiederholung desselben Verbs, nicht die typische Verbindung verschiedener Wörter einer Wortfamilie."},"memory":"Verwandte Wörter, gemeinsamer Stamm.","aliases":["Etymologische Figur"],"classExample":"„Wir arbeiten in Arbeiten nicht gerne alleine.“ Die Formulierung ist im Arbeitsblatt ungewöhnlich; prüfungstauglicher ist eine klar erkennbare Wortfamilienverbindung wie „einen Traum träumen“.","exam":"Die Formulierung „Wer Freiheit erkämpft, muss auch bereit sein, den Kampf für sie fortzusetzen.“ zeigt das sprachliche Mittel „Figura etymologica“. Das Verb „erkämpfen“ und das Nomen „Kampf“ sind stammverwandt und inhaltlich verbunden. Die Wortverwandtschaft bindet erreichte Freiheit an fortdauernde Anstrengung und stützt die Aufforderung zu Engagement."},{"id":"tautologie","name":"Tautologie","category":"muster","level":3,"material":true,"simple":"Eine Bedeutung wird mit ähnlichen Wörtern noch einmal gesagt. Beide Ausdrücke stehen meist gleichrangig nebeneinander.","definition":"Als rhetorische Figur bezeichnet Tautologie die Wiederholung desselben Inhalts mit bedeutungsgleichen oder sehr ähnlichen, häufig gleichrangigen Ausdrücken.","recognize":"Prüfe, ob beide Glieder weitgehend dasselbe sagen. Hier geht es um die rhetorische Verwendung, nicht um den logischen Fachbegriff einer immer wahren Aussage.","examples":[{"text":"Das ist [[voll und ganz]] richtig.","why":"Die beiden gleichrangigen Ausdrücke bekräftigen weitgehend denselben Grad der Zustimmung.","effect":"Die Dopplung unterstreicht die uneingeschränkte Zustimmung.","context":"Alltag"},{"text":"Diese Entscheidung ist [[endgültig und abschließend]].","why":"Beide Adjektive betonen das Ende weiterer Entscheidungen in derselben Sache.","effect":"Die doppelte Festlegung kann Entschlossenheit signalisieren und weitere Einwände sprachlich abwehren.","context":"Kommentar / Rede"},{"text":"Er stand [[einsam und allein]] am verschlossenen Tor.","why":"Die gleichrangigen Ausdrücke bündeln den Zustand fehlender Begleitung; ihre Bedeutungsnuancen bleiben im Kontext mitzudenken.","effect":"Die Häufung verstärkt hier den Eindruck von Verlassenheit, statt neue Handlung zu berichten.","context":"Literarischer Modelltext"}],"effect":"Die doppelte Festlegung kann Entschlossenheit signalisieren und weitere Einwände sprachlich abwehren.","confusion":[["pleonasmus","Pleonasmus fügt einem Begriff ein schon enthaltenes Merkmal hinzu, etwa „weißer Schimmel“. Tautologie verwendet meist gleichrangige Ausdrücke."],["synonym","Synonymie ist eine Bedeutungsbeziehung. Erst ihre redundante Verwendung im Ausdruck ergibt die rhetorische Figur."]],"counter":{"text":"Das Zimmer ist klein und dunkel.","why":"Die Eigenschaften sind verschieden und wiederholen nicht dieselbe Bedeutung."},"memory":"Gleichrangige Wörter sagen fast dasselbe.","aliases":[],"classExample":"„nackt und bloß“; „voll und ganz“","exam":"Die Formulierung „Diese Entscheidung ist endgültig und abschließend.“ zeigt das sprachliche Mittel „Tautologie“. Beide Adjektive betonen das Ende weiterer Entscheidungen in derselben Sache. Die doppelte Festlegung kann Entschlossenheit signalisieren und weitere Einwände sprachlich abwehren."},{"id":"pleonasmus","name":"Pleonasmus","category":"muster","level":3,"material":true,"simple":"Ein Wort bekommt eine Ergänzung, deren Bedeutung schon in ihm steckt. Die zusätzliche Information ist eigentlich nicht nötig.","definition":"Ein Pleonasmus fügt einem Ausdruck ein semantisch bereits enthaltenes Merkmal hinzu und kann dadurch verstärken oder unbeabsichtigt redundant wirken.","recognize":"Prüfe die Wortbedeutung im jeweiligen Kontext. Ein Zusatz ist nicht schon deshalb überflüssig, weil er häufig zu einer Sache passt.","examples":[{"text":"Auf der Wiese steht ein [[weißer Schimmel]].","why":"Ein Schimmel bezeichnet in der üblichen Wortbedeutung bereits ein weißes oder sehr helles Pferd.","effect":"Der Zusatz kann die Farbe anschaulich hervorheben, liefert in diesem Kontext aber keine eigenständige Unterscheidung.","context":"Alltag"},{"text":"Die Anschaffung wird als [[kostenlose Gratiszugabe]] angepriesen.","why":"„Gratis“ bedeutet bereits kostenlos. Das zusätzliche Adjektiv wiederholt dieselbe Eigenschaft.","effect":"Die doppelte Betonung lässt den Preisvorteil besonders wichtig erscheinen und kann die Aufmerksamkeit von anderen Kosten ablenken.","context":"Kommentar / Rede"},{"text":"In der Nacht blieb nur die [[lautlose Stille]].","why":"Stille schließt das Fehlen hörbarer Geräusche schon ein.","effect":"Die zusätzliche Betonung des Lautlosen verdichtet die gespannte Ruhe der Szene.","context":"Literarischer Modelltext"}],"effect":"Die doppelte Betonung lässt den Preisvorteil besonders wichtig erscheinen und kann die Aufmerksamkeit von anderen Kosten ablenken.","confusion":[["tautologie","Tautologie reiht ähnliche Ausdrücke meist gleichrangig; beim Pleonasmus steckt die Zusatzbedeutung bereits im Bezugswort."]],"counter":{"text":"Ein rotes Auto fährt vorbei.","why":"Rot ist nicht schon im Begriff Auto enthalten und fügt ein echtes Merkmal hinzu."},"memory":"Die Ergänzung steckt schon im Grundwort.","aliases":[],"classExample":"„weißer Schimmel“; „alter Greis“","exam":"Die Formulierung „Die Anschaffung wird als kostenlose Gratiszugabe angepriesen.“ zeigt das sprachliche Mittel „Pleonasmus“. „Gratis“ bedeutet bereits kostenlos. Das zusätzliche Adjektiv wiederholt dieselbe Eigenschaft. Die doppelte Betonung lässt den Preisvorteil besonders wichtig erscheinen und kann die Aufmerksamkeit von anderen Kosten ablenken."},{"id":"polysyndeton","name":"Polysyndeton","category":"muster","level":3,"material":true,"simple":"Viele Glieder einer Reihe werden einzeln mit „und“ oder „oder“ verbunden. Die Bindewörter kehren auffällig oft wieder.","definition":"Ein Polysyndeton verbindet mehrere Glieder einer Reihung durch wiederholt gesetzte Konjunktionen.","recognize":"Zähle die Bindewörter zwischen den Gliedern. Ein einziges „und“ am Ende einer gewöhnlichen Liste genügt nicht.","examples":[{"text":"Im Rucksack sind [[Bücher und Hefte und Stifte und Zettel]].","why":"Zwischen den Elementen steht jeweils erneut „und“.","effect":"Jeder Gegenstand erhält Gewicht; die Liste wirkt länger und angehäuft.","context":"Alltag"},{"text":"Wir brauchen [[Zeit und Geld und Räume und Menschen]], die Verantwortung übernehmen.","why":"Die wiederholte Konjunktion bindet die Voraussetzungen gleichrangig zusammen.","effect":"Die Reihung betont, dass keine einzelne Maßnahme genügt; mehrere Bedingungen müssen gemeinsam erfüllt sein.","context":"Kommentar / Rede"},{"text":"Sie hörte [[den Regen und die Schritte und das Atmen und ihr eigenes Herz]].","why":"Die Wahrnehmungen werden durch wiederholtes „und“ einzeln angeschlossen.","effect":"Die langsame Folge lässt die Aufmerksamkeit der Figur von Geräusch zu Geräusch wandern und steigert die Anspannung.","context":"Literarischer Modelltext"}],"effect":"Die Reihung betont, dass keine einzelne Maßnahme genügt; mehrere Bedingungen müssen gemeinsam erfüllt sein.","confusion":[["asyndeton","Asyndeton lässt Konjunktionen weg; Polysyndeton häuft sie."],["akkumulation","Akkumulation betrifft inhaltlich zusammengehörende Begriffe. Sie kann zusätzlich polysyndetisch gebaut sein."]],"counter":{"text":"Bücher, Hefte und Stifte liegen da.","why":"Das ist eine gewöhnliche Aufzählung mit einem einzigen abschließenden Bindewort."},"memory":"Viele Glieder, viele Bindewörter.","aliases":[],"classExample":"„Und es wallet und siedet und brauset und zischt.“","exam":"Die Formulierung „Wir brauchen Zeit und Geld und Räume und Menschen, die Verantwortung übernehmen.“ zeigt das sprachliche Mittel „Polysyndeton“. Die wiederholte Konjunktion bindet die Voraussetzungen gleichrangig zusammen. Die Reihung betont, dass keine einzelne Maßnahme genügt; mehrere Bedingungen müssen gemeinsam erfüllt sein."},{"id":"asyndeton","name":"Asyndeton","category":"muster","level":3,"material":true,"simple":"Eine Reihe kommt ohne Bindewörter wie „und“ aus. Die Glieder stehen direkt nebeneinander.","definition":"Ein Asyndeton reiht Wörter, Wortgruppen oder Sätze ohne verbindende Konjunktionen aneinander.","recognize":"Prüfe, ob eine erkennbare Reihung vorliegt und die Verknüpfungswörter fehlen. Kommas allein beweisen keine Reihung.","examples":[{"text":"Er [[packt, rennt, stolpert]].","why":"Drei gleichrangige Verben sind nur durch Kommas verbunden.","effect":"Die unverbundene Folge vermittelt Tempo und eine rasche Abfolge von Handlungen.","context":"Alltag"},{"text":"Wir brauchen [[Bücher, Räume, Ruhe]].","why":"Die drei Forderungsgegenstände werden ohne „und“ gereiht.","effect":"Die knappe Liste wirkt pointiert und drängend; sie konzentriert den Kommentar auf konkrete Bedürfnisse.","context":"Kommentar / Rede"},{"text":"[[Die Tür fiel zu, die Schritte verstummten, das Haus atmete Dunkelheit]].","why":"Die Teilsätze folgen ohne Konjunktion aufeinander.","effect":"Die dicht aufeinanderfolgenden Eindrücke geben der Szene einen gedrängten Rhythmus; die letzte Personifikation verstärkt die Atmosphäre.","context":"Literarischer Modelltext"}],"effect":"Die knappe Liste wirkt pointiert und drängend; sie konzentriert den Kommentar auf konkrete Bedürfnisse.","confusion":[["polysyndeton","Dort werden die Bindewörter gerade mehrfach gesetzt."],["akkumulation","Eine Akkumulation ist eine inhaltliche Häufung; ein Asyndeton ist die Form der Verknüpfung. Beides ist kombinierbar."]],"counter":{"text":"Er packt und rennt und stolpert.","why":"Die Reihung enthält wiederholte Bindewörter und ist polysyndetisch."},"memory":"Reihung ohne Bindewörter.","aliases":[],"classExample":"„Herr Fuchs denkt nach, schaut, lächelt.“","exam":"Die Formulierung „Wir brauchen Bücher, Räume, Ruhe.“ zeigt das sprachliche Mittel „Asyndeton“. Die drei Forderungsgegenstände werden ohne „und“ gereiht. Die knappe Liste wirkt pointiert und drängend; sie konzentriert den Kommentar auf konkrete Bedürfnisse."},{"id":"akkumulation","name":"Akkumulation","category":"muster","level":3,"material":true,"simple":"Mehrere zusammengehörende Einzelheiten werden gesammelt genannt. So entsteht ein breites Bild eines Bereichs.","definition":"Eine Akkumulation häuft mehrere inhaltlich zusammengehörende Unterbegriffe oder Einzelheiten unter einem genannten oder erschließbaren Oberbegriff.","recognize":"Finde die gemeinsamen Oberbegriffe und mindestens mehrere Einzelglieder. Die Art der Bindewörter ist für die Einordnung nicht entscheidend.","examples":[{"text":"Auf dem Tisch liegen [[Äpfel, Birnen, Pflaumen, Trauben]].","why":"Die Früchte sind mehrere Unterbegriffe des gemeinsamen Bereichs Obst.","effect":"Die Häufung lässt das Angebot vielfältig und reich erscheinen.","context":"Alltag"},{"text":"Die Schließung trifft [[Kinder, Eltern, Lehrkräfte und Ehrenamtliche]].","why":"Verschiedene Gruppen werden unter dem gemeinsamen Aspekt der Betroffenheit gesammelt.","effect":"Die Reihe zeigt die Breite der Folgen und stützt das Argument, dass die Entscheidung nicht nur eine kleine Gruppe betrifft.","context":"Kommentar / Rede"},{"text":"[[Briefe, Bilder, Fahrkarten, getrocknete Blüten]] lagen in der Schublade.","why":"Die Dinge gehören als Erinnerungsstücke zu einem gemeinsamen Bedeutungsfeld.","effect":"Die Gegenstände lassen ein vergangenes Leben aus vielen konkreten Spuren entstehen, ohne es ausführlich zu erzählen.","context":"Literarischer Modelltext"}],"effect":"Die Reihe zeigt die Breite der Folgen und stützt das Argument, dass die Entscheidung nicht nur eine kleine Gruppe betrifft.","confusion":[["asyndeton","Akkumulation fragt nach der inhaltlichen Sammlung, Asyndeton nach fehlenden Konjunktionen."],["zweierfigur","Im Unterricht wird die Zweierfigur gesondert für zwei gliedernde Begriffe verwendet; Akkumulation meint eine umfangreichere Häufung."]],"counter":{"text":"Der Bus hält. Danach beginnt die Stunde.","why":"Das ist eine zeitliche Abfolge, keine Sammlung zusammengehörender Unterbegriffe."},"memory":"Viele Einzelheiten ergeben einen gemeinsamen Bereich.","aliases":["Accumulatio"],"classExample":"„Frauen, Männer, Kinder, Alte, Junge – jeder wollte kommen.“","exam":"Die Formulierung „Die Schließung trifft Kinder, Eltern, Lehrkräfte und Ehrenamtliche.“ zeigt das sprachliche Mittel „Akkumulation“. Verschiedene Gruppen werden unter dem gemeinsamen Aspekt der Betroffenheit gesammelt. Die Reihe zeigt die Breite der Folgen und stützt das Argument, dass die Entscheidung nicht nur eine kleine Gruppe betrifft."},{"id":"zweierfigur","name":"Zweierfigur","category":"muster","level":3,"material":true,"simple":"Zwei zusammengehörende Ausdrücke bilden ein Paar. Sie können gemeinsam einen größeren Bereich vertreten.","definition":"In den vorliegenden Unterrichtsmaterialien bezeichnet Zweierfigur die Paarung zweier Unterbegriffe anstelle eines zusammenfassenden Oberbegriffs.","recognize":"Prüfe, welche Gesamtheit das Paar vertritt. Der Unterrichtsbegriff ist weiter gefasst und nicht in allen Rhetoriksystemen gleich gebräuchlich.","examples":[{"text":"[[Jung und Alt]] feiern mit.","why":"Zwei Altersgruppen stehen zusammen für Menschen verschiedener Altersstufen.","effect":"Das Paar vermittelt, dass niemand aufgrund des Alters ausgeschlossen wird.","context":"Alltag"},{"text":"Die Regel soll für [[Lehrende und Lernende]] gelten.","why":"Zwei Rollen bezeichnen gemeinsam die zentralen Beteiligten des Unterrichts.","effect":"Die Paarung betont gemeinsame Verantwortung und einen Anspruch auf gleiche Geltung.","context":"Kommentar / Rede"},{"text":"[[Tag und Nacht]] bewachte sie das Licht am Fenster.","why":"Die beiden Tagesphasen stehen zusammen für die gesamte Zeit.","effect":"Das Paar lässt die Dauer der Wachsamkeit umfassend erscheinen.","context":"Literarischer Modelltext"}],"effect":"Die Paarung betont gemeinsame Verantwortung und einen Anspruch auf gleiche Geltung.","confusion":[["akkumulation","Die Akkumulation sammelt mehrere Unterbegriffe; hier wird bewusst ein Paar gebildet."],["tautologie","Bei einer Tautologie ähneln sich die Bedeutungen. „Jung und Alt“ nennt unterschiedliche, gemeinsam umfassende Bereiche."]],"counter":{"text":"Brot und Schraubenzieher liegen hier.","why":"Ohne einen erkennbaren gemeinsamen Oberbegriff oder eine gestaltende Funktion ist nicht jede Zweierliste eine rhetorische Zweierfigur."},"memory":"Zwei Begriffe vertreten gemeinsam einen Bereich.","aliases":[],"classExample":"„Mann und Frau“; „Pech und Schwefel“. Solche Paarformeln können je nach Kontext weitere Figuren überlagern.","exam":"Die Formulierung „Die Regel soll für Lehrende und Lernende gelten.“ zeigt das sprachliche Mittel „Zweierfigur“. Zwei Rollen bezeichnen gemeinsam die zentralen Beteiligten des Unterrichts. Die Paarung betont gemeinsame Verantwortung und einen Anspruch auf gleiche Geltung."},{"id":"antithese","name":"Antithese","category":"gegensatz","level":2,"material":true,"simple":"Zwei gegensätzliche Gedanken werden einander gegenübergestellt. Der Unterschied soll deutlich werden.","definition":"Eine Antithese stellt inhaltlich gegensätzliche Begriffe, Aussagen oder Vorstellungen in einen erkennbaren Zusammenhang.","recognize":"Benenne beide Seiten und den Gegensatz. Ein „aber“ allein beweist noch keine Antithese.","examples":[{"text":"[[Du lachst, ich weine]].","why":"Lachen und Weinen bilden im Kontext gegensätzliche emotionale Reaktionen.","effect":"Die direkte Gegenüberstellung hebt die unterschiedliche Stimmung hervor.","context":"Alltag"},{"text":"[[Die Geräte werden moderner, die Lernräume bleiben rückständig]].","why":"Die Modernität der Technik wird der Rückständigkeit der Lernumgebung gegenübergestellt.","effect":"Der Gegensatz kritisiert einen einseitigen Fortschrittsbegriff und begründet, dass Ausstattung und pädagogische Bedingungen gemeinsam verbessert werden müssen.","context":"Kommentar / Rede"},{"text":"[[Draußen feierte die Stadt; in ihr blieb alles still]].","why":"Öffentlicher Jubel und innere Stille stehen sich gegenüber.","effect":"Der Gegensatz macht die Isolation der Figur mitten im gesellschaftlichen Leben spürbar.","context":"Literarischer Modelltext"}],"effect":"Der Gegensatz kritisiert einen einseitigen Fortschrittsbegriff und begründet, dass Ausstattung und pädagogische Bedingungen gemeinsam verbessert werden müssen.","confusion":[["oxymoron","Eine Antithese stellt Gegensätze gegenüber. Ein Oxymoron verbindet sie eng zu einem widersprüchlichen Ausdruck."],["chiasmus","Chiasmus ist eine Kreuzstellung der Elemente. Eine Antithese braucht keinen solchen Satzbau."]],"counter":{"text":"Sie liest, und er schreibt.","why":"Zwei unterschiedliche Tätigkeiten sind ohne weiteren Kontext noch keine gegensätzlichen Positionen."},"memory":"Gegensätze werden einander gegenübergestellt.","aliases":[],"classExample":"„Heiß ist die Liebe, kalt ist der Schnee.“ Das Beispiel ist zusätzlich parallel gebaut.","exam":"Die Formulierung „Die Geräte werden moderner, die Lernräume bleiben rückständig.“ zeigt das sprachliche Mittel „Antithese“. Die Modernität der Technik wird der Rückständigkeit der Lernumgebung gegenübergestellt. Der Gegensatz kritisiert einen einseitigen Fortschrittsbegriff und begründet, dass Ausstattung und pädagogische Bedingungen gemeinsam verbessert werden müssen."},{"id":"oxymoron","name":"Oxymoron","category":"gegensatz","level":3,"material":true,"simple":"Zwei widersprüchliche Wörter werden eng verbunden. Die Kombination klingt zunächst unmöglich.","definition":"Ein Oxymoron verbindet semantisch widersprüchliche Ausdrücke zu einer engen sprachlichen Einheit.","recognize":"Prüfe die innere Spannung innerhalb der Wortgruppe. Ein bloßer Gegensatz zwischen zwei Sätzen genügt nicht.","examples":[{"text":"Im Raum herrscht [[beredtes Schweigen]].","why":"Schweigen scheint gerade nicht zu sprechen; „beredt“ schreibt ihm dennoch Mitteilungsfähigkeit zu.","effect":"Die Verbindung macht deutlich, dass Nichtsprechen eine starke Botschaft vermitteln kann.","context":"Alltag"},{"text":"Eine Debatte ohne Widerspruch ist eine [[lebendige Erstarrung]].","why":"Lebendigkeit und Erstarrung schließen sich auf der wörtlichen Ebene aus.","effect":"Der widersprüchliche Ausdruck kritisiert einen scheinbar aktiven Austausch, in dem sich tatsächlich nichts bewegt.","context":"Kommentar / Rede"},{"text":"Sie trug eine [[bittere Süße]] in der Erinnerung.","why":"Geschmacklich gegensätzliche Eigenschaften werden eng zusammengefügt.","effect":"Die Verbindung erfasst die Gleichzeitigkeit von schöner Erinnerung und schmerzlichem Verlust.","context":"Literarischer Modelltext"}],"effect":"Der widersprüchliche Ausdruck kritisiert einen scheinbar aktiven Austausch, in dem sich tatsächlich nichts bewegt.","confusion":[["antithese","Antithese stellt die gegensätzlichen Seiten deutlicher getrennt gegenüber."],["paradoxon","Paradoxon betrifft eine scheinbar widersprüchliche Aussage oder einen Gedanken. Das Oxymoron ist die enge sprachliche Verbindung."]],"counter":{"text":"Der Tee ist heiß, das Wasser daneben kalt.","why":"Die Gegensätze gehören zu verschiedenen Gegenständen und werden nicht widersprüchlich in einer Einheit verbunden."},"memory":"Widerspruch in einer engen Wortverbindung.","aliases":[],"classExample":"„alter Knabe“; „beredtes Schweigen“; „bittere Süße“","exam":"Die Formulierung „Eine Debatte ohne Widerspruch ist eine lebendige Erstarrung.“ zeigt das sprachliche Mittel „Oxymoron“. Lebendigkeit und Erstarrung schließen sich auf der wörtlichen Ebene aus. Der widersprüchliche Ausdruck kritisiert einen scheinbar aktiven Austausch, in dem sich tatsächlich nichts bewegt."},{"id":"paradoxon","name":"Paradoxon","category":"gegensatz","level":3,"material":true,"simple":"Eine Aussage scheint sich selbst zu widersprechen. Beim Nachdenken kann ein sinnvoller Gedanke erkennbar werden.","definition":"Ein Paradoxon formuliert einen scheinbaren Widerspruch oder eine Aussage gegen die gewöhnliche Erwartung, die eine weiterführende Deutung eröffnet.","recognize":"Erkläre zuerst den Widerspruch und dann, unter welcher Perspektive die Aussage verständlich wird. Unsinn ohne begründbare Lesart genügt nicht.","examples":[{"text":"[[Weniger Auswahl kann mehr Freiheit bedeuten]].","why":"Weniger Möglichkeiten scheinen Freiheit zu mindern; zugleich können sie von Entscheidungsdruck entlasten.","effect":"Die Aussage regt dazu an, Freiheit nicht nur als Zahl der Optionen zu verstehen.","context":"Alltag"},{"text":"[[Wer jede Meinung verbietet, schützt am Ende keine eigene Meinung mehr]].","why":"Das vermeintliche Absichern der eigenen Position führt zum Verlust der Möglichkeit, sie frei zu äußern.","effect":"Die paradoxe Konsequenz macht auf ein Grundproblem umfassender Verbote aufmerksam und fordert konsistente Regeln.","context":"Kommentar / Rede"},{"text":"[[Er fand sich erst, als er sich verlor]].","why":"Selbstverlust scheint Selbsterkenntnis auszuschließen; gemeint ist der Verlust einer alten, fremdbestimmten Identität.","effect":"Die Spannung fasst einen persönlichen Wandel zusammen, der nicht als einfacher Gewinn erzählt werden kann.","context":"Literarischer Modelltext"}],"effect":"Die paradoxe Konsequenz macht auf ein Grundproblem umfassender Verbote aufmerksam und fordert konsistente Regeln.","confusion":[["oxymoron","Ein Oxymoron verbindet widersprüchliche Ausdrücke eng. Das Paradoxon entfaltet den Widerspruch auf der Ebene einer Aussage."]],"counter":{"text":"Der Stein ist rund und liegt am Weg.","why":"Die Eigenschaften widersprechen einander weder scheinbar noch tatsächlich."},"memory":"Scheinbarer Widerspruch, begründbarer tieferer Sinn.","aliases":[],"classExample":"„Ich weiß, dass ich nichts weiß.“","exam":"Die Formulierung „Wer jede Meinung verbietet, schützt am Ende keine eigene Meinung mehr.“ zeigt das sprachliche Mittel „Paradoxon“. Das vermeintliche Absichern der eigenen Position führt zum Verlust der Möglichkeit, sie frei zu äußern. Die paradoxe Konsequenz macht auf ein Grundproblem umfassender Verbote aufmerksam und fordert konsistente Regeln."},{"id":"ironie","name":"Ironie","category":"gegensatz","level":2,"material":true,"simple":"Jemand sagt etwas, meint es aber erkennbar anders. Oft ist das Gegenteil gemeint. Der Zusammenhang ist entscheidend.","definition":"Ironie erzeugt eine erkennbare Distanz zwischen dem wörtlich Gesagten und dem Gemeinten, häufig durch eine Aussage, deren Gegenteil der Kontext nahelegt.","recognize":"Suche einen Widerspruch zwischen Aussage und Situation. Ohne Kontext oder Tonfall lässt sich Ironie oft nicht sicher bestimmen.","examples":[{"text":"Der Bus fährt vor der Nase weg. „[[Das läuft ja großartig]].“","why":"Das Lob passt nicht zur ärgerlichen Situation; tatsächlich wird der Ablauf kritisiert.","effect":"Die ironische Form drückt Ärger mit sprachlicher Distanz aus.","context":"Alltag"},{"text":"Das Schulnetz fällt zum dritten Mal aus. „[[So sieht also die perfekte Digitalisierung aus]].“","why":"Das scheinbare Lob wird durch die geschilderten Ausfälle widerlegt.","effect":"Die Ironie entlarvt eine Erfolgserzählung als unzureichend und verschärft die Kritik an fehlender Zuverlässigkeit.","context":"Kommentar / Rede"},{"text":"Er betrachtete das undichte Dach. „[[Ein Palast]], gewiss“, sagte er und stellte den Eimer darunter.","why":"Die tatsächliche Wohnsituation widerspricht der prachtvollen Bezeichnung.","effect":"Die Figur hält durch ironische Distanz ihren Ärger oder ihre Enttäuschung aus, ohne sie direkt auszusprechen.","context":"Literarischer Modelltext"}],"effect":"Die Ironie entlarvt eine Erfolgserzählung als unzureichend und verschärft die Kritik an fehlender Zuverlässigkeit.","confusion":[["sarkasmus","Sarkasmus bezeichnet scharfen, häufig verletzenden Spott. Er kann ironisch sein, muss aber nicht das Gegenteil sagen."]],"counter":{"text":"Die Lösung funktioniert. „Das hast du gut gemacht.“","why":"Das Lob passt zur Situation; ohne gegenteilige Hinweise besteht kein Ironiesignal."},"memory":"Nicht nur Wörter lesen: Situation und Haltung prüfen.","aliases":[],"classExample":"„Schulaufgaben machen ja so großen Spaß.“ Nur der passende Kontext begründet eine ironische Lesart.","exam":"Die Formulierung „Das Schulnetz fällt zum dritten Mal aus. „So sieht also die perfekte Digitalisierung aus.““ zeigt das sprachliche Mittel „Ironie“. Das scheinbare Lob wird durch die geschilderten Ausfälle widerlegt. Die Ironie entlarvt eine Erfolgserzählung als unzureichend und verschärft die Kritik an fehlender Zuverlässigkeit."},{"id":"ellipse","name":"Ellipse","category":"satz","level":2,"material":true,"simple":"Ein Satz lässt Wörter weg, die man aus dem Zusammenhang ergänzen kann. Trotzdem versteht man die Aussage.","definition":"Eine Ellipse lässt syntaktisch erwartbare Satzbestandteile aus, die aus dem sprachlichen oder situativen Kontext erschließbar sind.","recognize":"Ergänze die fehlenden Bestandteile in einem vollständigen Satz. Nicht jede kurze Äußerung ist automatisch eine Ellipse.","examples":[{"text":"[[Noch einen Kaffee?]]","why":"Ergänzbar ist etwa „Möchtest du noch einen Kaffee?“; Verb und Subjekt bleiben unausgesprochen.","effect":"Die Verkürzung passt zur direkten Alltagssituation und wirkt unkompliziert.","context":"Alltag"},{"text":"[[Mehr Zeit zum Denken. Weniger Druck durch Noten.]]","why":"Die Forderungen lassen sich etwa zu „Wir brauchen mehr Zeit ...“ ergänzen.","effect":"Die verkürzten Sätze stellen die Ziele schlagwortartig heraus und verleihen dem Kommentar Nachdruck.","context":"Kommentar / Rede"},{"text":"[[Kein Laut. Kein Schritt. Nur das Licht im Flur.]]","why":"Vollständige Aussagen wie „Es war kein Laut zu hören“ werden auf Wahrnehmungsfragmente verkürzt.","effect":"Die abgehackten Eindrücke lassen Stille und gespannte Aufmerksamkeit unmittelbar erscheinen.","context":"Literarischer Modelltext"}],"effect":"Die verkürzten Sätze stellen die Ziele schlagwortartig heraus und verleihen dem Kommentar Nachdruck.","confusion":[["epiphrase","Epiphrase fügt nach einem vollständigen Satz etwas hinzu. Ellipse lässt erwartbare Teile weg."],["asyndeton","Asyndeton lässt Verbindungskonjunktionen einer Reihung weg; Ellipse betrifft fehlende Satzbestandteile."]],"counter":{"text":"Sie schläft.","why":"Der kurze Satz enthält Subjekt und Prädikat und ist vollständig."},"memory":"Fehlende Satzteile lassen sich sinnvoll ergänzen.","aliases":[],"classExample":"„Je schneller, desto besser.“; „Lieber zwei Stunden als gar kein Schlaf.“","exam":"Die Formulierung „Mehr Zeit zum Denken. Weniger Druck durch Noten.“ zeigt das sprachliche Mittel „Ellipse“. Die Forderungen lassen sich etwa zu „Wir brauchen mehr Zeit ...“ ergänzen. Die verkürzten Sätze stellen die Ziele schlagwortartig heraus und verleihen dem Kommentar Nachdruck."},{"id":"inversion","name":"Inversion","category":"satz","level":3,"material":true,"simple":"Die Wörter stehen in einer auffällig veränderten Reihenfolge. Dadurch fällt ein Teil besonders auf.","definition":"Eine Inversion weicht von der im Kontext gewöhnlichen Wortstellung ab, häufig durch markierte Voranstellung oder poetische Umordnung.","recognize":"Vergleiche mit einer unauffälligen Fassung. Im Deutschen ist die Voranstellung eines Objekts oft grammatisch normal; rhetorische Markiertheit braucht Kontext.","examples":[{"text":"[[Vergessen habe ich den Schlüssel]], nicht verloren.","why":"Die Voranstellung von „vergessen“ wird durch den ausdrücklichen Gegensatz zu „verloren“ markiert.","effect":"Die Art des Missgeschicks wird hervorgehoben und gegen ein Missverständnis abgegrenzt.","context":"Alltag"},{"text":"[[Gerecht soll die Regel sein]], nicht bloß bequem.","why":"Das betonte Prädikativ „gerecht“ steht an der Spitze; der Nachsatz macht die Schwerpunktsetzung erkennbar.","effect":"Die Regel wird am Maßstab der Gerechtigkeit ausgerichtet und nicht an leichter Verwaltung.","context":"Kommentar / Rede"},{"text":"[[In seinen Händen die letzte Blüte lag]].","why":"Gegenüber „Die letzte Blüte lag in seinen Händen“ ist die Verbendstellung im Aussagesatz poetisch ungewöhnlich.","effect":"Die verzögerte Nennung des Verbs hält das Bild der Hände und der Blüte länger im Blick.","context":"Literarischer Modelltext"}],"effect":"Die Regel wird am Maßstab der Gerechtigkeit ausgerichtet und nicht an leichter Verwaltung.","confusion":[["chiasmus","Chiasmus verlangt mindestens zwei überkreuz angeordnete Einheiten. Inversion kann innerhalb eines einzelnen Satzes auftreten."]],"counter":{"text":"Heute fährt der Bus später.","why":"Ein Adverbial im Vorfeld mit Verbzweitstellung ist normal. Ohne besondere Markierung sollte man das nicht vorschnell als rhetorische Inversion werten."},"memory":"Ungewöhnliche Ordnung braucht einen begründeten Vergleich.","aliases":[],"classExample":"„Stilmittel kann ich keine mehr sehen.“ Die Voranstellung ist nur im passenden Kontext als rhetorisch markiert zu deuten.","exam":"Die Formulierung „Gerecht soll die Regel sein, nicht bloß bequem.“ zeigt das sprachliche Mittel „Inversion“. Das betonte Prädikativ „gerecht“ steht an der Spitze; der Nachsatz macht die Schwerpunktsetzung erkennbar. Die Regel wird am Maßstab der Gerechtigkeit ausgerichtet und nicht an leichter Verwaltung."},{"id":"parenthese","name":"Parenthese","category":"satz","level":3,"material":true,"simple":"Eine Zusatzbemerkung wird in einen Satz eingeschoben. Ohne sie bleibt der Satz grammatisch erhalten.","definition":"Eine Parenthese ist ein syntaktisch eigenständiger Einschub in einen übergeordneten Satz, häufig durch Gedankenstriche, Klammern oder Kommas abgegrenzt.","recognize":"Entferne den Einschub probeweise. Der umgebende Satz muss weiter funktionieren; der Einschub steht zusätzlich daneben.","examples":[{"text":"Mein Bruder [[– du kennst ihn ja –]] kommt morgen.","why":"Die Bemerkung ist eigenständig eingeschoben; „Mein Bruder kommt morgen“ bleibt vollständig.","effect":"Die Anrede schafft Nähe und bezieht gemeinsames Wissen ein.","context":"Alltag"},{"text":"Die neue Regel [[– das wird oft vergessen –]] gilt auch für Lehrkräfte.","why":"Der Hauptsatz bleibt ohne Einschub vollständig. Die Bemerkung kommentiert die Wahrnehmung der Regel.","effect":"Der Einschub korrigiert eine mögliche Schieflage in der Debatte und lenkt die Aufmerksamkeit auf gleiche Verpflichtungen.","context":"Kommentar / Rede"},{"text":"Sie öffnete [[– ihre Hände zitterten –]] den letzten Brief.","why":"Die Beschreibung der Hände unterbricht den sonst zusammenhängenden Handlungssatz.","effect":"Der Einschub verzögert das Öffnen und macht die emotionale Anspannung körperlich sichtbar.","context":"Literarischer Modelltext"}],"effect":"Der Einschub korrigiert eine mögliche Schieflage in der Debatte und lenkt die Aufmerksamkeit auf gleiche Verpflichtungen.","confusion":[["epiphrase","Die Parenthese unterbricht einen Satz; die Epiphrase folgt einem schon vollständigen Satz als Nachtrag."]],"counter":{"text":"Sie öffnet den Brief, weil sie neugierig ist.","why":"Der kausale Nebensatz ist regulär in das Satzgefüge eingebunden, kein eigenständiger parenthetischer Kommentar."},"memory":"Zusatz hinein, Hauptsatz bleibt.","aliases":[],"classExample":"„Ich möchte Ihnen, ich fasse mich ganz kurz, über die Vorgänge berichten.“","exam":"Die Formulierung „Die neue Regel – das wird oft vergessen – gilt auch für Lehrkräfte.“ zeigt das sprachliche Mittel „Parenthese“. Der Hauptsatz bleibt ohne Einschub vollständig. Die Bemerkung kommentiert die Wahrnehmung der Regel. Der Einschub korrigiert eine mögliche Schieflage in der Debatte und lenkt die Aufmerksamkeit auf gleiche Verpflichtungen."},{"id":"correctio","name":"Correctio","category":"satz","level":3,"material":true,"simple":"Eine Formulierung wird sofort berichtigt oder verstärkt. Man hört dem präziseren Ausdruck beim Entstehen zu.","definition":"Eine Correctio nimmt einen zunächst gewählten Ausdruck zurück und ersetzt ihn ausdrücklich durch einen passenderen, häufig stärkeren.","recognize":"Suche eine erkennbare Selbstkorrektur, etwa „nein“, „besser gesagt“ oder „was sage ich“. Eine bloße Reihe reicht nicht.","examples":[{"text":"Das war gut, [[nein, großartig]].","why":"Der erste Ausdruck wird ausdrücklich durch den stärkeren ersetzt.","effect":"Das Lob gewinnt Nachdruck und wirkt spontan begeistert.","context":"Alltag"},{"text":"Das ist eine Schwierigkeit, [[besser gesagt: ein strukturelles Problem]].","why":"Eine zunächst eher begrenzte Bezeichnung wird zugunsten einer grundsätzlicheren korrigiert.","effect":"Die Korrektur verschiebt die Debatte von einzelnen Pannen zu dauerhaften Ursachen und stützt weitergehende Forderungen.","context":"Kommentar / Rede"},{"text":"Er hatte sie vermisst, [[nein, er hatte sein ganzes Leben auf sie gewartet]].","why":"Die erste Aussage wird ausdrücklich als unzureichend zurückgenommen.","effect":"Die emotionale Reichweite des Gefühls wächst; die Figur erscheint von ihrer Sehnsucht überwältigt.","context":"Literarischer Modelltext"}],"effect":"Die Korrektur verschiebt die Debatte von einzelnen Pannen zu dauerhaften Ursachen und stützt weitergehende Forderungen.","confusion":[["klimax","Die Klimax steigert in einer Folge. Correctio ersetzt einen Ausdruck durch einen anderen."]],"counter":{"text":"Die Aufgabe ist schwierig und zeitaufwendig.","why":"Die zweite Eigenschaft ergänzt die erste, ohne sie zurückzunehmen."},"memory":"Erst gesagt, dann bewusst verbessert.","aliases":["Korrektur"],"classExample":"„Die Schulaufgabe ist schlecht, nein geradezu miserabel ausgefallen.“","exam":"Die Formulierung „Das ist eine Schwierigkeit, besser gesagt: ein strukturelles Problem.“ zeigt das sprachliche Mittel „Correctio“. Eine zunächst eher begrenzte Bezeichnung wird zugunsten einer grundsätzlicheren korrigiert. Die Korrektur verschiebt die Debatte von einzelnen Pannen zu dauerhaften Ursachen und stützt weitergehende Forderungen."},{"id":"zeugma","name":"Zeugma","category":"satz","level":4,"material":true,"simple":"Ein Wort gehört gleichzeitig zu zwei Satzteilen, passt aber zu ihnen auf verschiedene Weise. Daraus kann ein überraschender Doppelsinn entstehen.","definition":"Ein Zeugma bezieht ein gemeinsames Satzglied, häufig ein Verb, auf mehrere Glieder, obwohl die Verbindungen semantisch oder syntaktisch unterschiedlich funktionieren.","recognize":"Löse die Verbindungen getrennt auf und prüfe den Bedeutungswechsel. In dieser App steht die semantisch auffällige Form im Vordergrund; der Fachbegriff wird teils weiter verwendet.","examples":[{"text":"Er [[schlug das Fenster und den Weg nach Hause ein]].","why":"„Einschlagen“ bedeutet beim Fenster zerstören, beim Weg eine Richtung wählen. Ein Verb trägt beide Bedeutungen.","effect":"Der unvermittelte Wechsel erzeugt einen sprachlichen Überraschungseffekt.","context":"Alltag"},{"text":"Mit der neuen Regel [[verlor die Schule Geld und ihr Gesicht]].","why":"Geld verlieren ist materiell gemeint; das Gesicht verlieren bedeutet Ansehen verlieren.","effect":"Die Verbindung koppelt finanzielle Folgen an einen Vertrauensverlust und macht die Kritik pointiert.","context":"Kommentar / Rede"},{"text":"Sie [[fasste seinen Arm und neuen Mut]].","why":"Einen Arm fassen meint körperliches Greifen, Mut fassen einen inneren Wandel.","effect":"Die gemeinsame Form verbindet körperliche Nähe und emotionale Stärkung in einem knappen Bild.","context":"Literarischer Modelltext"}],"effect":"Die Verbindung koppelt finanzielle Folgen an einen Vertrauensverlust und macht die Kritik pointiert.","confusion":[["ellipse","Ein gemeinsam genutztes Verb kann als Auslassungsstruktur beschrieben werden. Für das auffällige Zeugma ist der Bedeutungs- oder Konstruktionssprung entscheidend."]],"counter":{"text":"Sie trägt Bücher und Hefte.","why":"„Tragen“ passt zu beiden Objekten in derselben Bedeutung; der charakteristische Sprung fehlt."},"memory":"Ein gemeinsames Wort arbeitet in zwei Bedeutungen.","aliases":[],"classExample":"„Er schlug das Fenster und den Weg zum Bahnhof ein.“","exam":"Die Formulierung „Mit der neuen Regel verlor die Schule Geld und ihr Gesicht.“ zeigt das sprachliche Mittel „Zeugma“. Geld verlieren ist materiell gemeint; das Gesicht verlieren bedeutet Ansehen verlieren. Die Verbindung koppelt finanzielle Folgen an einen Vertrauensverlust und macht die Kritik pointiert."},{"id":"epiphrase","name":"Epiphrase","category":"satz","level":4,"material":true,"simple":"Ein Satz scheint schon fertig. Dann folgt noch ein Zusatz, der ihn ergänzt oder anders gewichtet.","definition":"Eine Epiphrase erweit
