mmelt. Die Häufung macht die Vielfalt sichtbar, die durch eine einzige Kennzahl verdeckt werden kann. Die Reihung ist zugleich asyndetisch. In „Die Statistik schweigt“ liegt Personifikation vor. Einer Darstellung von Daten wird menschliches Schweigen zugeschrieben. Die Aussage lenkt auf begrenzte Aussagekraft, ohne daraus eine grundsätzliche Wertlosigkeit von Zahlen abzuleiten. In „Nicht weniger Genauigkeit, sondern mehr.“ liegt Antithese vor. Die Mengenbegriffe weniger und mehr werden ausdrücklich gegenübergestellt. Der Schluss deutet die ergänzende qualitative Betrachtung als Gewinn an Genauigkeit und entkräftet einen möglichen Einwand."},{"id":"netz","title":"Alles verbunden, nicht alles nah","genre":"Literarischer Essay","level":4,"text":"Jeden Abend füllte sich ihr Bildschirm mit Gesichtern. Bekannte, Freunde, Fremde, Namen ohne Stimme. Sie konnte alle erreichen und wusste oft nicht, wen sie anrufen sollte. Weniger Entfernung bedeutete nicht immer mehr Nähe. Das Netz war ein Platz voller offener Türen, doch hinter manchen führte kein Weg in ein Gespräch. Sie legte das Gerät beiseite und hörte unten zwei Menschen lachen. Kein großes Ereignis. Kein neuer Anfang. Nur ein Lachen, das kein Symbol brauchte. Vielleicht, dachte sie, beginnt Nähe manchmal dort, wo niemand mehr versucht, sie vorzuzeigen.","annotations":[{"quote":"Bekannte, Freunde, Fremde, Namen ohne Stimme.","term":"akkumulation","feature":"Die Folge sammelt unterschiedliche Arten digitaler Kontakte.","effect":"Die Vielzahl kontrastiert mit dem späteren Mangel an einem konkreten Gesprächspartner."},{"quote":"Weniger Entfernung bedeutete nicht immer mehr Nähe.","term":"paradoxon","feature":"Technisch verringerte Distanz scheint Nähe zu erzeugen, führt aber nicht zwingend zu persönlicher Verbundenheit.","effect":"Die Aussage fordert dazu auf, technische Erreichbarkeit und emotionale Beziehung auseinanderzuhalten."},{"quote":"ein Platz voller offener Türen","term":"metapher","feature":"Das digitale Netz wird als räumlicher Ort mit Zugangsmöglichkeiten dargestellt.","effect":"Das Bild macht Möglichkeiten sichtbar, deren Einlösung der folgende Satz ausdrücklich in Zweifel zieht."}],"prompt":"Untersuche, wie die sprachliche Gestaltung die Haltung des Textes vermittelt. Belege deine Beobachtungen, benenne die Mittel und erläutere ihre Funktion im Zusammenhang.","model":"In „Bekannte, Freunde, Fremde, Namen ohne Stimme.“ liegt Akkumulation vor. Die Folge sammelt unterschiedliche Arten digitaler Kontakte. Die Vielzahl kontrastiert mit dem späteren Mangel an einem konkreten Gesprächspartner. In „Weniger Entfernung bedeutete nicht immer mehr Nähe.“ liegt Paradoxon vor. Technisch verringerte Distanz scheint Nähe zu erzeugen, führt aber nicht zwingend zu persönlicher Verbundenheit. Die Aussage fordert dazu auf, technische Erreichbarkeit und emotionale Beziehung auseinanderzuhalten. In „ein Platz voller offener Türen“ liegt Metapher vor. Das digitale Netz wird als räumlicher Ort mit Zugangsmöglichkeiten dargestellt. Das Bild macht Möglichkeiten sichtbar, deren Einlösung der folgende Satz ausdrücklich in Zweifel zieht."}],"topics":[{"id":"buch","title":"Zukunft des gedruckten Buches","question":"Soll unsere Schule gedruckte Bücher auch dann gezielt fördern, wenn digitale Angebote wachsen?","position":"Gedruckte Bücher bleiben wichtig, digitale Angebote ergänzen sie.","headline":"Blättern oder Wischen? Die falsche Alternative","materials":[{"id":"M1","title":"Perspektive A","text":"Digitale Ausgaben lassen sich durchsuchen und auf einem Gerät sammeln. Für manche Lesesituationen ist das praktisch."},{"id":"M2","title":"Perspektive B","text":"Gedruckte Bücher können ohne Benachrichtigungen genutzt und direkt ausgeliehen werden. Das konkrete Leseerlebnis ist nicht für alle Menschen gleich."},{"id":"M3","title":"Fiktiver schulischer Entscheidungsrahmen","text":"Eine fiktive Schule muss ihr Bibliotheksbudget auf gedruckte Anschaffungen und digitale Zugänge verteilen. Alle Lernenden sollen ein nutzbares Angebot erhalten."}],"intro":"Manche Debatten beginnen mit einer einfachen Wahl. Doch bei der Frage „Soll unsere Schule gedruckte Bücher auch dann gezielt fördern, wenn digitale Angebote wachsen?“ reicht ein schnelles Ja oder Nein nicht aus. Gedruckte Bücher bleiben wichtig, digitale Angebote ergänzen sie.","argument":"Ein wichtiges Kriterium ist, ob die Regel im Alltag für unterschiedliche Lernende nutzbar ist. Das Übungsmaterial M3 beschreibt einen Entscheidungsrahmen, in dem eine gemeinsame Lösung gefunden werden muss (vgl. M3). Deshalb reicht es nicht, nur den Vorteil aus M1 zu nennen. Auch der Einwand aus M2 muss geprüft werden. Eine überzeugende Position benennt, unter welchen Bedingungen ihr Vorschlag trägt und wo eine Ausnahme nötig bleibt.","ending":"Eine gute Regel erkennt man nicht daran, wie eindeutig sie klingt, sondern daran, wie begründet sie mit unterschiedlichen Bedürfnissen umgeht. Gedruckte Bücher bleiben wichtig, digitale Angebote ergänzen sie."},{"id":"digital","title":"Digitale Medien im Unterricht","question":"Soll digitaler Unterricht Vorrang vor analogen Arbeitsweisen bekommen?","position":"Das Lernziel soll über das Werkzeug entscheiden.","headline":"Nicht das Gerät macht den Unterricht","materials":[{"id":"M1","title":"Perspektive A","text":"Digitale Werkzeuge können gemeinsames Bearbeiten und schnelle Überarbeitung erleichtern. Ihr Nutzen hängt von Aufgabe und Verfügbarkeit ab."},{"id":"M2","title":"Perspektive B","text":"Analoge Arbeit kann ohne Geräteausfall funktionieren und bewusst langsames Nachdenken unterstützen. Auch sie muss zum Lernziel passen."},{"id":"M3","title":"Fiktiver schulischer Entscheidungsrahmen","text":"Die fiktive Schulkonferenz plant Unterrichtsregeln. Einige Räume besitzen Geräte, andere nicht. Eine Regel soll auch bei fehlender Ausstattung praktikabel sein."}],"intro":"Manche Debatten beginnen mit einer einfachen Wahl. Doch bei der Frage „Soll digitaler Unterricht Vorrang vor analogen Arbeitswe für unterschiedliche Lernende nutzbar ist. Das Übungsmaterial M3 beschreibt einen Entscheidungsrahmen, in dem eine gemeinsame Lösung gefunden werden muss (vgl. M3). Deshalb reicht es nicht, nur den Vorteil aus M1 zu nennen. Auch der Einwand aus M2 muss geprüft werden. Eine überzeugende Position benennt, unter welchen Bedingungen ihr Vorschlag trägt und wo eine Ausnahme nötig bleibt.","ending":"Eine gute Regel erkennt man nicht daran, wie eindeutig sie klingt, sondern daran, wie begründet sie mit unterschiedlichen Bedürfnissen umgeht. Verlässliche Ruhephasen und begründete Ausnahmen sind besser als unklare Regeln."},{"id":"umwelt","title":"Umweltschutz","question":"Wie viel Verantwortung soll eine Schule für umweltbewusstes Handeln übernehmen?","position":"Schulische Regeln sollen wirksames gemeinsames Handeln erleichtern, ohne Einzelne pauschal zu beschuldigen.","headline":"Verantwortung braucht mehr als ein Plakat","materials":[{"id":"M1","title":"Perspektive A","text":"Eine fiktive Umweltgruppe schlägt wiederverwendbare Materialien, überprüfbare Sparziele und die Reparatur vorhandener Geräte vor."},{"id":"M2","title":"Perspektive B","text":"Eine Gegenposition verlangt, Zeit, Geld und unterschiedliche Möglichkeiten der Familien mitzudenken. Nicht jede Person kann jede vorgeschlagene Maßnahme gleich leicht umsetzen."},{"id":"M3","title":"Fiktiver schulischer Entscheidungsrahmen","text":"Ein Modellprojekt soll eine Maßnahme auswählen, ihren Ausgangszustand festhalten und später prüfen, was sich tatsächlich geändert hat. Es werden keine erfundenen Messwerte vorgegeben."}],"intro":"Manche Debatten beginnen mit einer einfachen Wahl. Doch bei der Frage „Wie viel Verantwortung soll eine Schule für umweltbewusstes Handeln übernehmen?“ reicht ein schnelles Ja oder Nein nicht aus. Schulische Regeln sollen wirksames gemeinsames Handeln erleichtern, ohne Einzelne pauschal zu beschuldigen.","argument":"Ein wichtiges Kriterium ist, ob die Regel im Alltag für unterschiedliche Lernende nutzbar ist. Das Übungsmaterial M3 beschreibt einen Entscheidungsrahmen, in dem eine gemeinsame Lösung gefunden werden muss (vgl. M3). Deshalb reicht es nicht, nur den Vorteil aus M1 zu nennen. Auch der Einwand aus M2 muss geprüft werden. Eine überzeugende Position benennt, unter welchen Bedingungen ihr Vorschlag trägt und wo eine Ausnahme nötig bleibt.","ending":"Eine gute Regel erkennt man nicht daran, wie eindeutig sie klingt, sondern daran, wie begründet sie mit unterschiedlichen Bedürfnissen umgeht. Schulische Regeln sollen wirksames gemeinsames Handeln erleichtern, ohne Einzelne pauschal zu beschuldigen."},{"id":"freiheit","title":"Meinungsfreiheit und Verantwortung","question":"Wie soll eine Schulöffentlichkeit mit provokanten und verletzenden Äußerungen umgehen?","position":"Offener Widerspruch und Verantwortung gehören zusammen.","headline":"Widerspruch braucht keinen Maulkorb","materials":[{"id":"M1","title":"Perspektive A","text":"Eine fiktive Debattengruppe fordert Raum für unbequeme Positionen. Kritik oder Unbeliebtheit allein sollen nicht jede Diskussion beenden."},{"id":"M2","title":"Perspektive B","text":"Eine zweite Position betont, dass Gesprächsregeln Teilnehmende vor persönlichen Angriffen schützen sollen. Widerspruch darf nicht zur gezielten Herabsetzung werden."},{"id":"M3","title":"Fiktiver schulischer Entscheidungsrahmen","text":"Die Modellschule entwickelt eine Gesprächsordnung: Aussagen begründen, Personen nicht abwerten, Betroffene anhören und Entscheidungen transparent erklären. Dies ist keine Darstellung aktueller Rechtslage."}],"intro":"Manche Debatten beginnen mit einer einfachen Wahl. Doch bei der Frage „Wie soll eine Schulöffentlichkeit mit provokanten und verletzenden Äußerungen umgehen?“ reicht ein schnelles Ja oder Nein nicht aus. Offener Widerspruch und Verantwortung gehören zusammen.","argument":"Ein wichtiges Kriterium ist, ob die Regel im Alltag für unterschiedliche Lernende nutzbar ist. Das Übungsmaterial M3 beschreibt einen Entscheidungsrahmen, in dem eine gemeinsame Lösung gefunden werden muss (vgl. M3). Deshalb reicht es nicht, nur den Vorteil aus M1 zu nennen. Auch der Einwand aus M2 muss geprüft werden. Eine überzeugende Position benennt, unter welchen Bedingungen ihr Vorschlag trägt und wo eine Ausnahme nötig bleibt.","ending":"Eine gute Regel erkennt man nicht daran, wie eindeutig sie klingt, sondern daran, wie begründet sie mit unterschiedlichen Bedürfnissen umgeht. Offener Widerspruch und Verantwortung gehören zusammen."},{"id":"sozial","title":"Soziale Medien","question":"Soll die Schule den bewussten Umgang mit sozialen Medien als eigenes Lernziel behandeln?","position":"Nicht bloß Bildschirmzeit, sondern Nutzung, Quellen und soziale Folgen sollen reflektiert werden.","headline":"Verbunden ist noch nicht verstanden","materials":[{"id":"M1","title":"Perspektive A","text":"Eine fiktive Jugendgruppe beschreibt soziale Medien als Ort für Austausch, kreative Projekte und Informationen über gemeinsame Interessen."},{"id":"M2","title":"Perspektive B","text":"Eine Gegenposition verweist auf Vergleichsdruck, unerwünschte Öffentlichkeit und Inhalte ohne klare Herkunft. Sie fordert Raum für kritische Reflexion."},{"id":"M3","title":"Fiktiver schulischer Entscheidungsrahmen","text":"Eine Modellaufgabe lässt Lernende einen Beitrag auf Quelle, Absicht, Darstellung und mögliche Folgen prüfen. Die Materialien enthalten Positionen, keine repräsentative Studie."}],"intro":"Manche Debatten beginnen mit einer einfachen Wahl. Doch bei der Frage „Soll die Schule den bewussten Umgang mit sozialen Medien als eigenes Lernziel behandeln?“ reicht ein schnelles Ja oder Nein nicht aus. Nicht bloß Bildschirmzeit, sondern Nutzung, Quellen und soziale Folgen sollen reflektiert werden.","argument":"Ein wichtiges Kriterium ist, ob die Regel im Alltag für unterschiedliche Lernende nutzbar ist. Das Übungsmaterial M3 beschreibt einen Entscheidungsrahmen, in dem eine gemeinsame Lösung gefunden werden muss (vgl. M3). Deshalb reicht es nicht, nur den Vorteil aus M1 zu nennen. Auch der Einwand aus M2 muss geprüft werden. Eine überzeugende Position benennt, unter welchen Bedingungen ihr Vorschlag trägt und wo eine Ausnahme nötig bleibt.","ending":"Eine gute Regel erkennt man nicht daran, wie eindeutig sie klingt, sondern daran, wie begründet sie mit unterschiedlichen Bedürfnissen umgeht. Nicht bloß Bildschirmzeit, sondern Nutzung, Quellen und soziale Folgen sollen reflektiert werden."}],"steps":[{"title":"Material sorgfältig auswerten","text":"Lies alle Materialien. Markiere zentrale Informationen und verschiedene Positionen in unterschiedlichen Farben. Notiere eigene Stichwörter und unterscheide Behauptung, Beleg und Bewertung.","field":"materialsNotes"},{"title":"Eine Position festlegen","text":"Prüfe die Aufgabenstellung: Ist eine Position vorgegeben? Formuliere deine eigene Antwort auf die Leitfrage. Notiere ein starkes Gegenargument und einen möglichen begründeten Umgang damit.","field":"position"},{"title":"Eine Stoffsammlung erstellen","text":"Sammle Aussagen aus allen Materialien mit Materialnummer. Ergänze eigene Überlegungen, ohne sie als belegte Fakten auszugeben.","field":"arguments"},{"title":"Die Stoffsammlung sichten","text":"Wähle vier bis sechs tragfähige Ideen. Prüfe, welche Belege verfügbar sind und welche Punkte sich wiederholen. Kurze Kommentare brauchen eine klare Auswahl.","field":"selection"},{"title":"Einen Schreibplan erstellen","text":"Ordne deine Argumente. Der Unterricht schlägt eine Steigerung vom schwächeren zum stärkeren Argument vor. Ein Kommentar erlaubt auch andere überzeugende Anordnungen. Halte die gewählte Logik fest.","field":"plan"},{"title":"Interesse in der Einleitung wecken","text":"Führe in den Sachverhalt ein und mache deine Position erkennbar. Möglich sind eine konkrete Szene, eine Zuspitzung, eine Frage oder ein korrekt zugeordnetes Zitat. Erfunde keine Zitate.","field":"intro"},{"title":"Den Schluss planen","text":"Bündle deine Position und runde sie pointiert ab. Ein begründeter Appell, ein Ausblick oder die Rückkehr zum Einstiegsbild kann passen. Kein neues Hauptargument erst im Schluss.","field":"ending"}],"checks":["Ich bearbeite die Leitfrage und berücksichtige eine eventuell vorgegebene Position.","Meine Position ist früh erkennbar und bleibt begründet.","Ich nutze alle Materialien und kennzeichne Bezüge mit Materialnummern.","Ich unterscheide Quelleninhalte, eigene Schlussfolgerungen und ungesicherte Annahmen.","Meine Argumente enthalten nachvollziehbare Begründungen und passende Belege.","Ich stelle mindestens ein relevantes Gegenargument fair dar und gehe darauf ein.","Die Reihenfolge ist nachvollziehbar; ich wiederhole nicht bloß dieselbe Aussage.","Meine Stilmittel haben eine konkrete Funktion und passen zu Zielgruppe und Erscheinungsort.","Der Ton ist sachlich, aber klar wertend; Umgangssprache bleibt dosiert.","Ich schreibe überwiegend im Präsens; Vorzeitigkeit kennzeichne ich passend, etwa im Perfekt.","Einleitung und Schluss bilden einen sinnvollen Rahmen.","Ich habe Wortumfang, Satzbau, Rechtschreibung und genaue Zitate kontrolliert."],"corrections":["Alle neun Fotos sind berücksichtigt: zwei Übersichten, zwei Zuordnungsblätter, die sieben Planungsschritte, die Kommentarcheckliste und drei handschriftliche Unterrichtsseiten.","„Der Einsatz war groß, klein war der Gewinn“ kann zugleich Chiasmus und Antithese sein. Die zwei Beobachtungen betreffen Satzbau und Bedeutung.","Pars pro toto bedeutet Teil für Ganzes. Die Umkehrung heißt Totum pro parte; der weitere Begriff ist Synekdoche.","Die Publikumsanrede „Meine Damen und Herren“ ist nicht automatisch die spezifische Apostrophe.","Eine Epipher ist nur mit wiederkehrenden Enden mehrerer Einheiten belegt. Die einzelne handschriftlich notierte Strand-Formulierung reicht dafür nicht aus.","„Mit Taschenlampen bewaffnet“ kann metaphorisch verstanden werden. Eine Hyperbel muss anhand der Übertreibung begründet werden; die Notiz allein entscheidet das nicht.","Inversion ist im Deutschen kontextabhängig. Eine grammatisch gewöhnliche Vorfeldbesetzung ist nicht automatisch ein auffälliges Stilmittel.","„Bunt, bunter, Stabilo“ ist eine spielerische Werbesteigerung. Ironie ist daraus nicht ohne weitere Kontextsignale zwingend ableitbar.","Die Unterrichtsnotizen nennen Marktstagnation und Buchumsätze, enthalten aber nicht die vollständigen Originalmaterialien M1 bis M4. Diese Daten werden nicht als geprüfte aktuelle Fakten übernommen.","500 Wörter für die Schulaufgabe und 800 Wörter für das Abiturtraining stammen aus deiner Checkliste. Sie sind hier Übungsziele, keine allgemeingültige Prüfungsordnung.","Die angeführten Wirkungen sind plausible kontextbezogene Deutungen, keine garantiert eintretenden psychologischen Effekte.","Die literarischen Beispiele und Labortexte sind selbst formulierte Modelltexte. Sie werden nicht realen Autorinnen oder Autoren zugeschrieben."],"sources":[{"title":"Eigene Unterrichtsmaterialien","note":"Neun vom Nutzer bereitgestellte Fotografien. Fachliche Präzisierungen siehe oben."},{"title":"Rhetorische Begriffe: ergänzende Gegenprüfung","url":"https://de.wikipedia.org/wiki/Liste_rhetorischer_Stilmittel","note":"Ergänzender Überblick, keine alleinige Quelle. Die eigenen Definitionen und Modellbeispiele sind auf den Unterrichtsauftrag zugeschnitten."}]};});

function hash(str){let h=2166136261;for(const c of String(str)){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}

function marked(s){let text='',ranges=[],last=0,m;const re=/\[\[([\s\S]*?)\]\]/g;while((m=re.exec(s))){text+=s.slice(last,m.index);const start=text.length;text+=m[1];ranges.push([start,text.length]);last=m.index+m[0].length;}text+=s.slice(last);const tok=tokens(text);return {text,tokens:tok,answer:tok.map((t,i)=>ranges.some(([a,b])=>t.start<b&&t.end>a)?i:null).filter(x=>x!==null)};}
function quoteIndices(text,quote){let start=text.indexOf(quote);if(start<0)return [];let end=start+quote.length;return tokens(text).map((t,i)=>t.start<end&&t.end>start?i:null).filter(x=>x!==null);}

S.views.sources=function(){return pageTop('MATERIAL & QUALITÄT','Aus deinem Unterricht. Fachlich präzisiert.','Was übernommen wurde, wo sich Begriffe überschneiden und welche Grenzen die Anwendung hat.')+`<div class="card mb"><h2>Die neun Fotos als Grundlage</h2><div class="stack">${D.corrections.map((text,i)=>`<div class="step-text"><span class="circle-num">${i+1}</span><p>${e(text)}</p></div>`).join('')}</div></div><div class="grid two"><div class="card"><h2>Quellen und Transparenz</h2><div class="source-list">${D.sources.map(s=>`<h3>${s.url?`<a href="${e(s.url)}" target="_blank" rel="noopener noreferrer">${e(s.title)} ↗</a>`:e(s.title)}</h3><p class="small muted">${e(s.note)}</p>`).join('')}</div></div><div class="card"><h2>Keine unsichtbare KI-Bewertung</h2><p class="small">Zuordnung, Fachbegriffe und festgelegte Wortmarkierungen werden nach einer hinterlegten Lösung geprüft. Freie Beispiele, Wirkungsdeutungen, Analysen und Kommentare werden mit Musterlösungen und Selbstkontrolle bearbeitet. Die Anwendung versteht diese freien Texte nicht automatisch.</p><p class="small">Markierungsgrenzen können variieren. Eine formal abweichende, fachlich plausible Zitiergrenze kann die automatische Punktzahl mindern. Die Mustererklärung und deine begründete Einordnung sind deshalb wichtiger als der Prozentwert allein.</p><p class="small">Es werden keine Noten berechnet und keine externen Anfragen für die Lernfunktionen gesendet. Die Lerntexte sind Übungsmaterial, keine verbindliche Prüfungsordnung.</p></div></div>`;};

Analyse</h2><blockquote class="definition" style="font-size:20px">${e(t.exam)}</blockquote><div class="info"><b>Keine Wirkung auf Knopfdruck.</b> ${e(t.effect)} Diese Deutung gilt für das gezeigte Beispiel. In einem anderen Kontext kann dieselbe Form anders wirken. Ein Stilmittel ersetzt keinen sachlichen Beleg.</div></section><section class="card"><h2>Das ist gerade kein Beispiel</h2><div class="question-text" style="font-size:21px">${e(t.counter.text)}</div><p class="small">${e(t.counter.why)}</p></section><section class="card"><h2>Jetzt wirklich anwenden</h2><p class="small muted">Wähle eine echte Übungsrunde zu diesem Begriff. Antworten und Fehler gehen in deinen Lernstand ein.</p><div class="row wrap">${button('5 gemischte Aufgaben '+icon('arrow'),'detail-train',`data-id="${id}" data-mode="mixed"`)}${button('Textstellen markieren','detail-train',`data-id="${id}" data-mode="mark"`,'secondary')}${button('Eigenes Beispiel schreiben','detail-train',`data-id="${id}" data-mode="write"`,'secondary')}</div></section></div><aside class="detail-aside stack"><section class="card"><div class="row between mb"><h3 class="no-margin">Dein Lernstatus</h3>${icon('chart')}</div>${status(id)}<p class="small muted mt-small">${S.state.history.filter(x=>x.term===id&&!x.self).length} objektiv geprüfte Antworten</p><p class="small muted">${p?'Nächste Wiederholung: '+new Date(p.due).toLocaleString('de',{dateStyle:'medium',timeStyle:'short'}):'Noch keine Antwort erfasst. Das Lesen allein erhöht deine Lernstufe nicht.'}</p><a class="text-link" href="#settings">Wie wird der Status berechnet? ${icon('arrow')}</a></section><section class="card"><h3>Verwechslungsgefahr</h3>${t.confusion.map(([other,text])=>`<div class="confusion-link"><a href="#detail/${other}"><strong>${e(Q.by[other]?.name||other)} ${icon('arrow')}</strong></a>${e(text)}</div>`).join('')}<a class="text-link mt-small" href="#compare">Direkt vergleichen ${icon('arrow')}</a></section><section class="card"><div class="eyebrow mb S.views.paths=function(){return pageTop('SCHRITT FÜR SCHRITT','Du musst nicht alles auf einmal können.','Acht Lernpfade führen vom ersten sprachlichen Muster zur eigenständigen Textanalyse. Fortschritt gibt es nach einem Lerncheck, nicht nach dem Öffnen.')+`<div class="grid two">${D.paths.map(S.pathCard).join('')}</div><div class="info mt">Die Reihenfolge innerhalb eines Pfades ist eine Empfehlung. Du kannst jede Lektion öffnen. Ein objektiver Lerncheck gilt ab 70 % als abgeschlossen; praktische Schreibaufgaben werden ausdrücklich als Selbstkontrolle geführt.</div>`;};

S.views.compare=function(){return pageTop('VERWECHSLUNGSGEFAHR','Ähnlich ist nicht dasselbe.','Vergleiche Merkmale statt auswendig gelernter Etiketten. Bei Überschneidungen zeigt die Plattform, warum mehrere Beschreibungen vertretbar sind.')+`<div class="grid three">${D.pairs.map((p,i)=>`<a class="card clickable" href="#pair/${p.id}"><div class="row between mb">${tag('VERGLEICH '+String(i+1).padStart(2,'0'))}${icon('compare')}</div><h3 style="font:23px/1.5 var(--serif)">${e(Q.by[p.a].name)}<span class="muted" style="display:block;font:italic 14px var(--serif)">oder</span>${e(Q.by[p.b].name)}</h3><p class="small muted">${e(p.explanation.slice(0,130))}…</p><span class="text-link">Unterschied verstehen ${icon('arrow')}</span></a>`).join('')}</div>`;};
S.views.pair=function(id){const p=D.pairs.find(p=>p.id===id);if(!p)return empty('Vergleich nicht gefunden','Öffne die Vergleichsübersicht.');return `<a class="back" href="#compare">${icon('back')} Alle Vergleiche</a>`+pageTop('ZWEI BEGRIFFE · KLARE KRITERIEN',e(Q.by[p.a].name)+' <span class="muted">vs.</span> '+e(Q.by[p.b].name),'Erst das Merkmal bestimmen. Dann den passenden Begriff wählen.')+`<div class="grid two">${[p.a,p.b].map((id,i)=>{let t=Q.by[id];return `<section class="card comparison-card ${i?'alt':''}">${tag(i?'BEGRIFF B':'BEGRIFF A')}<h2 class="mt" style="font:28px var(--serif)">${e(t.name)}</h2><p>${e(t.simple)}</p><div class="question-text" style="font-size:22px">${C.highlight(t.examples[0].text)}</div><p class="small">${e(t.examples[0].why)}</p><div class="info"><b>Erkennungsmerkmal:</b> ${e(t.recognize)}</div><a class="text-link mt" href="#detail/${id}">Vollständiges Porträt ${icon('arrow')}</a></section>`;}).join('')}</div><div class="card mt"><h2>Der entscheidende Unterschied</h2><p>${e(p.explanation)}</p><div class="info"><b>Wenn beides stimmen kann:</b> ${e(p.overlap)}</div></div><div class="card mt"><h2>Jetzt ohne Gegenüberstellung prüfen</h2><p class="small muted">Der Vergleichscheck mischt Definitionen, eigene Begriffsangaben und Textbeispiele beider Mittel. Rückmeldungen beziehen sich auf das jeweils gefragte Merkmal.</p>${button('Vergleichscheck starten '+icon('arrow'),'pair-train',`data-id="${p.id}"`)}</div>`;};
Object.assign(S.handlers,{
 'reset-catalog':()=>{Object.assign(S.ui,{search:'',category:'',status:'',material:false,bookmarks:false});S.render();},
 'bookmark':el=>{const id=el.dataset.id;S.state.bookmarks=S.state.bookmarks.includes(id)?S.state.bookmarks.filter(x=>x!==id):[...S.state.bookmarks,id];S.save();S.render();},

});

for(const [id,key,type] of [['catalog-category','category','value'],['catalog-status','status','value'],['catalog-material','material','checked'],['catalog-bookmarks','bookmarks','checked']])S.changes[id]=el=>{S.ui[key]=el[type];S.render();};
