/* Focus edition: short study sessions, material cues and compact mock tests. */
.focus-budget {display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:12px}
.focus-budget p {margin:0}
.focus-time-value {font:56px/1.1 var(--serif);letter-spacing:-2px}
.focus-time-value span {font:14px/1.5 var(--sans);letter-spacing:0;margin-left:10px;color:var(--muted)}
.time-options {display:flex;gap:7px;width:100%}
.time-option {flex:1;border:1px solid var(--line);padding:10px 12px;border-radius:9px;background:var(--surface);font:inherit;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap}
.time-option.active {background:var(--brand);color:white;border-color:var(--brand)}
.focus-main-grid {display:grid;grid-template-columns:minmax(0,1.8fr) minmax(260px,1fr);gap:22px;align-items:start}
.focus-plan-row {display:flex;gap:16px;align-items:center;padding:21px 0;border-top:1px solid var(--line)}
.focus-plan-row h3 {margin:0 0 5px}
.focus-plan-row p {margin:0 0 7px}
.focus-plan-action {display:flex;align-items:flex-end;flex-direction:column;gap:12px;flex-shrink:0}
.focus-plan-row .circle-num {flex-shrink:0;align-self:flex-start;margin-top:3px}
.circle-num.complete {background:var(--brand);color:white}
.focus-mock-card {background:var(--surface2)}
.focus-mock-number {font:60px/1.2 var(--serif);margin:15px 0}
.focus-mock-number span {font:17px var(--sans);color:var(--muted)}
.catalog-controls {display:flex;gap:18px;align-items:end;flex-wrap:wrap}
.catalog-controls .field {min-width:200px}
.focus-term-card {display:flex;flex-direction:column}
.focus-term-card h2 {font:25px/1.25 var(--serif);margin:18px 0 12px;overflow-wrap:anywhere}
.focus-term-card .status-label {font-size:11px}
.focus-term-card .tag {font-size:9px}
.focus-term-card .focus-cue {font-size:14px;line-height:1.65;flex:1;margin-top:0}
.focus-example {background:var(--surface2);border-left:3px solid var(--brand);padding:15px 17px;border-radius:0 10px 10px 0;font:19px/1.65 var(--serif);overflow-wrap:anywhere}
.focus-example.large {font-size:27px;padding:24px;margin:22px 0 10px}
.focus-example mark {background:var(--brand-soft,#e7efc9);color:inherit;padding:1px 2px;border-radius:2px}
.focus-signal {font:32px/1.35 var(--serif);max-width:900px}
.focus-explain-grid {display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:24px}
.focus-explain-grid p {line-height:1.8}
.focus-explain-grid h3 {margin-bottom:5px}
.signal-row {padding:15px 5px;border-top:1px solid var(--line)}
.signal-row h3 {font-size:16px}
.signal-row p {margin:6px 0 12px;line-height:1.7}
.focus-mode {display:flex;flex-direction:column;align-items:flex-start}
.focus-mode h2 {font-size:19px;margin:18px 0 8px}
.focus-mode p {flex:1}
.focus-tabs {display:flex;gap:7px;border-bottom:1px solid var(--line);padding-bottom:9px;flex-wrap:wrap}
.focus-tabs a {padding:10px 16px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px}
.focus-tabs a.active {background:var(--brand);color:white}
.focus-analysis-steps {display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:23px 0}
.focus-analysis-steps>div {padding:17px 15px;border-radius:10px;background:var(--surface2)}
.focus-analysis-steps b {font-size:14px}
.focus-analysis-steps p {font-size:14px;line-height:1.7;margin:10px 0 0}
.focus-reading {font:20px/1.9 var(--serif);background:var(--surface2);border-radius:10px;padding:25px;margin-top:20px}
.focus-exam-section {display:flex;align-items:center;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.focus-exam-section .grow {min-width:0}
.focus-exam-section .grow>span {display:block;margin-top:5px}
.focus-exam-section>b {white-space:nowrap}
.focus-self-score {color:var(--brand);font-weight:600;margin-bottom:0}
#focus-writing-text {font-size:16px;line-height:1.85;min-height:280px}
.focus-hero .hero-copy h2 {font-size:32px;line-height:1.2;max-width:480px}
.focus-hero .hero-art {max-width:180px}
.dark .focus-example mark {background:#365944;color:#e8f1dc}

<script>
(function(root,factory){if(typeof module==="object"&&module.exports)module.exports=factory();else root.SMD=factory();})(typeof globalThis!=="undefined"?globalThis:this,function(){return {"terms":[{"id":"metapher","name":"Metapher","category":"bild","level":2,"material":true,"simple":"Ein Wort wird als Bild verwendet. Gemeint ist etwas anderes als seine wörtliche Bedeutung.","definition":"Eine Metapher überträgt einen Ausdruck aufgrund einer wahrgenommenen Ähnlichkeit in einen anderen Bedeutungsbereich.","recognize":"Prüfe, ob die wörtliche Lesart im Zusammenhang passt. Benenne das Bild und die Eigenschaft, die übertragen wird.","examples":[{"text":"Mein Zimmer ist ein [[Schlachtfeld]].","why":"Das Zimmer ist kein Kriegsgebiet. Die Unordnung wird mit der Verwüstung eines Schlachtfeldes verbunden.","effect":"Das Bild lässt die Unordnung besonders groß und chaotisch erscheinen.","context":"Alltag"},{"text":"Die Schulbibliothek ist ein [[Fenster zur Welt]].","why":"Ein Raum mit Büchern wird als Fenster bezeichnet. Übertragen wird die Möglichkeit, neue Aussichten und Erfahrungen zu gewinnen.","effect":"Im Plädoyer für eine Bibliothek erscheint Lesen als Zugang zu unbekannten Lebenswelten; das stützt die Forderung nach Förderung.","context":"Kommentar / Rede"},{"text":"Über ihren Erinnerungen lag ein [[Mantel aus Staub]].","why":"Staub und Mantel beschreiben nicht wörtlich die Erinnerung. Sie übertragen das Bild des Bedeckens auf das Vergessen.","effect":"Die Vergangenheit erscheint schwer zugänglich und lange unbeachtet; so wird die Distanz der Figur zu ihrem früheren Leben erfahrbar.","context":"Literarischer Modelltext"}],"effect":"Im Plädoyer für eine Bibliothek erscheint Lesen als Zugang zu unbekannten Lebenswelten; das stützt die Forderung nach Förderung.","confusion":[["vergleich","Ein Vergleich nennt die Beziehung ausdrücklich, etwa mit „wie“. Eine Metapher überträgt die Bezeichnung."],["personifikation","Eine Personifikation überträgt gerade menschliche Eigenschaften. Sie kann zugleich metaphorisch sein."]],"counter":{"text":"Das Zimmer ist zwanzig Quadratmeter groß.","why":"Die Größenangabe bleibt wörtlich; es wird kein fremder Bedeutungsbereich übertragen."},"memory":"Ein Bild wird zur Bezeichnung.","aliases":[],"classExample":"„Jemandem das Herz brechen“; „Stilmitteldschungel“; „ein Meer von Menschen“","exam":"Die Formulierung „Jemandem das Herz brechen.“ zeigt Metapher. Das Herz wird nicht körperlich zerbrochen. Das Bild meint eine schwere seelische Verletzung. Das Bild macht den Schmerz als etwas tief Verletzendes vorstellbar.","focus":{"cue":"Ein Ausdruck ist bildlich gemeint, nicht wörtlich.","example":"Jemandem das [[Herz brechen]].","why":"Das Herz wird nicht körperlich zerbrochen. Das Bild meint eine schwere seelische Verletzung.","effect":"Das Bild macht den Schmerz als etwas tief Verletzendes vorstellbar.","source":"Foto 2 und Foto 9","priority":1}},{"id":"vergleich","name":"Vergleich","category":"bild","level":2,"material":true,"simple":"Zwei Dinge werden miteinander verglichen. Ein gemeinsames Merkmal verbindet sie.","definition":"Ein Vergleich setzt Sachverhalte anhand eines gemeinsamen Merkmals ausdrücklich in Beziehung, häufig durch „wie“ oder „als“.","recognize":"Suche Vergleichspartikel und bestimme die beiden verglichenen Größen sowie das gemeinsame Merkmal. Nicht jedes „wie“ ist ein Stilmittel.","examples":[{"text":"Der Rucksack ist schwer [[wie ein Stein]].","why":"Rucksack und Stein werden durch „wie“ verbunden; das gemeinsame Merkmal ist die Schwere.","effect":"Die körperliche Belastung wird anschaulich und leicht vorstellbar.","context":"Alltag"},{"text":"Eine Debatte ohne Zuhören ist [[wie ein Spiel ohne Regeln]].","why":"Die Debatte und das Spiel teilen den Mangel an einer Voraussetzung für faires Miteinander.","effect":"Der Vergleich begründet im Kommentar, warum Zuhören keine Nebensache, sondern Voraussetzung einer sinnvollen Debatte ist.","context":"Kommentar / Rede"},{"text":"Ihr Blick glitt über ihn hinweg [[wie Licht über kaltes Wasser]].","why":"Die Bewegung des Blicks wird ausdrücklich mit dem Gleiten von Licht verglichen.","effect":"Das flüchtige, unberührte Bild vermittelt Distanz; eine erwartete menschliche Nähe bleibt aus.","context":"Literarischer Modelltext"}],"effect":"Der Vergleich begründet im Kommentar, warum Zuhören keine Nebensache, sondern Voraussetzung einer sinnvollen Debatte ist.","confusion":[["metapher","„Die Debatte ist ein Schlachtfeld“ überträgt die Bezeichnung. „Wie ein Schlachtfeld“ stellt die Beziehung ausdrücklich her."]],"counter":{"text":"Ich weiß, wie das Gerät funktioniert.","why":"„Wie“ leitet hier eine indirekte Frage ein und vergleicht keine Größen."},"memory":"Wie oder als verbindet zwei Größen; die gemeinsame Eigenschaft zählt.","aliases":[],"classExample":"„stark wie ein Löwe“","exam":"Die Formulierung „stark wie ein Löwe“ zeigt Vergleich. Die Stärke eines Menschen wird ausdrücklich mit der eines Löwen verglichen. Die Stärke wird an einem leicht vorstellbaren Bild verdeutlicht.","focus":{"cue":"Zwei Dinge werden ausdrücklich mit „wie“ oder „als“ verbunden.","example":"stark [[wie ein Löwe]]","why":"Die Stärke eines Menschen wird ausdrücklich mit der eines Löwen verglichen.","effect":"Die Stärke wird an einem leicht vorstellbaren Bild verdeutlicht.","source":"Foto 9","priority":1}},{"id":"personifikation","name":"Personifikation","category":"bild","level":2,"material":true,"simple":"Etwas Nichtmenschliches verhält sich wie ein Mensch. Zum Beispiel kann ein Wind im Text flüstern.","definition":"Eine Personifikation schreibt Nichtmenschlichem menschliche Eigenschaften, Handlungen oder eine menschliche Gestalt zu.","recognize":"Frage: Wer handelt, und ist diese Handlung typisch menschlich? Auch Abstrakta wie Hoffnung können als Personen auftreten.","examples":[{"text":"Der Wecker [[schreit]] mich an.","why":"Dem Gerät wird ein menschlicher Ausdruck von Lautstärke und Ärger zugeschrieben.","effect":"Der Weckton wirkt aufdringlich; der Satz vermittelt den Widerwillen der geweckten Person.","context":"Alltag"},{"text":"Die Statistik [[verschweigt]] die Geschichten hinter den Zahlen.","why":"Eine Statistik kann keine bewusste Entscheidung zum Verschweigen treffen. Sie wird als handelnde Person dargestellt.","effect":"Der Kommentar lenkt den Blick auf Erfahrungen, die eine bloße Zahlenübersicht nicht zeigt, und fordert eine ergänzende Betrachtung.","context":"Kommentar / Rede"},{"text":"Die Hoffnung [[setzte sich an ihr Bett und wartete]].","why":"Das abstrakte Gefühl erhält einen Körper und menschliche Geduld.","effect":"Hoffnung wird als stille Begleiterin erfahrbar; das Bild betont Trost trotz anhaltender Unsicherheit.","context":"Literarischer Modelltext"}],"effect":"Der Kommentar lenkt den Blick auf Erfahrungen, die eine bloße Zahlenübersicht nicht zeigt, und fordert eine ergänzende Betrachtung.","confusion":[["metapher","Personifikation ist eine besondere Form bildlicher Übertragung. „Ein Meer von Fragen“ ist bildlich, aber nicht menschlich."],["allegorie","Eine ausgeführte Personifikation kann Teil einer Allegorie sein. Nicht jede Vermenschlichung bildet ein ganzes Deutungssystem."]],"counter":{"text":"Der Hund läuft über den Hof.","why":"Laufen ist für einen Hund eine wörtliche, natürliche Tätigkeit und keine Vermenschlichung."},"memory":"Nichtmenschliches bekommt menschliche Züge.","aliases":[],"classExample":"„Der Wind spielte mit ihren Haaren.“","exam":"Die Formulierung „Der Wind spielte mit ihren Haaren.“ zeigt Personifikation. Dem Wind wird die menschlich wirkende Handlung des Spielens zugeschrieben. Die Bewegung des Windes erscheint lebendig und eher sanft als bedrohlich.","focus":{"cue":"Etwas Nichtmenschliches handelt menschlich.","example":"Der Wind [[spielte]] mit ihren Haaren.","why":"Dem Wind wird die menschlich wirkende Handlung des Spielens zugeschrieben.","effect":"Die Bewegung des Windes erscheint lebendig und eher sanft als bedrohlich.","source":"Foto 9","priority":1}},{"id":"allegorie","name":"Allegorie","category":"bild","level":3,"material":true,"simple":"Eine ganze Figur oder Bildfolge steht für eine abstrakte Idee. Mehrere Einzelheiten des Bildes passen zu dieser Idee.","definition":"Eine Allegorie stellt einen abstrakten Zusammenhang durch eine ausdeutbare konkrete Gestalt oder eine zusammenhängende Bildhandlung dar.","recognize":"Suche einen abstrakten Bezug und mehrere passende Bildelemente. Eine bloße lange Beschreibung ist noch keine Allegorie.","examples":[{"text":"Auf dem Plakat trägt die [[Gerechtigkeit eine Waage und verbundene Augen]].","why":"Die Figur verkörpert Gerechtigkeit. Waage und Augenbinde stehen für Abwägen und Unparteilichkeit.","effect":"Eine abstrakte Vorstellung wird zu einem einprägsamen Bild mit deutbaren Einzelheiten.","context":"Alltag"},{"text":"Die Demokratie ist ein [[Garten: Rechte sind seine Wurzeln, Beteiligung ist das Wasser, Gleichgültigkeit lässt ihn verdorren]].","why":"Garten, Wurzeln, Wasser und Verdorren bilden ein zusammenhängendes Modell politischer Bedingungen.","effect":"Die Bildfolge macht demokratische Teilhabe als dauernde Pflege verständlich und stützt den Aufruf, sich einzubringen.","context":"Kommentar / Rede"},{"text":"[[Die Zeit kam als Wanderin. Sie trug die Jahre im Beutel und ließ an jeder Tür eine Erinnerung zurück.]]","why":"Die Wanderin verkörpert Zeit; ihr Gepäck und ihre Besuche gestalten das Vergehen und Zurückbleiben von Erfahrungen aus.","effect":"Der Lebenslauf erscheint als Begegnung mit einer unaufhaltsam weiterziehenden Gestalt.","context":"Literarischer Modelltext"}],"effect":"Die Bildfolge macht demokratische Teilhabe als dauernde Pflege verständlich und stützt den Aufruf, sich einzubringen.","confusion":[["metapher","Eine einzelne Übertragung kann schon Metapher sein. Die Allegorie entfaltet einen abstrakten Zusammenhang in einem ausdeutbaren Bildgefüge."]],"counter":{"text":"Ein Gärtner gießt die Blumen.","why":"Ohne erkennbaren zweiten Bedeutungszusammenhang ist dies eine wörtliche Handlung."},"memory":"Ein zusammenhängendes Bild macht eine Idee sichtbar.","aliases":[],"classExample":"Justitia als Darstellung der Gerechtigkeit; Fortuna als Darstellung des Glücks.","exam":"Die Formulierung „Justitia steht für Gerechtigkeit.“ zeigt Allegorie. Die abstrakte Idee Gerechtigkeit wird durch eine Figur dargestellt. Die schwer greifbare Idee erhält eine anschauliche Gestalt.","focus":{"cue":"Eine konkrete Gestalt stellt eine abstrakte Idee dar.","example":"[[Justitia]] steht für [[Gerechtigkeit]].","why":"Die abstrakte Idee Gerechtigkeit wird durch eine Figur dargestellt.","effect":"Die schwer greifbare Idee erhält eine anschauliche Gestalt.","source":"Foto 7","priority":2}},{"id":"metonymie","name":"Metonymie","category":"bild","level":3,"material":true,"simple":"Ein Wort ersetzt ein anderes, weil die Dinge sachlich zusammengehören. Zum Beispiel steht der Autor für sein Werk.","definition":"Eine Metonymie ersetzt eine Bezeichnung durch eine sachlich benachbarte, etwa Autor für Werk, Ort für Institution oder Gefäß für Inhalt.","recognize":"Benutze keine bloße Ähnlichkeit als Begründung. Benenne die reale Beziehung zwischen gemeintem und genanntem Gegenstand.","examples":[{"text":"Ich lese gerade [[Schiller]].","why":"Gelesen wird ein Werk, nicht die Person. Der Autor steht für seinen Text.","effect":"Die knappe Bezeichnung setzt gemeinsames Wissen über Autor und Werk voraus.","context":"Alltag"},{"text":"[[Das Rathaus]] muss die Entscheidung endlich erklären.","why":"Gemeint ist die zuständige Stadtverwaltung, nicht das Gebäude. Der Arbeitsort ersetzt die Institution.","effect":"Der Kommentar bündelt Verantwortung bei einer öffentlichen Stelle und formuliert eine klare Forderung.","context":"Kommentar / Rede"},{"text":"Am Abend schwieg [[die ganze Straße]].","why":"Nicht der Straßenbelag, sondern die dort lebenden Menschen werden als schweigend beschrieben.","effect":"Die Ortsbezeichnung fasst die Bewohner zu einer Gemeinschaft zusammen; dadurch wirkt die Stille umfassend.","context":"Literarischer Modelltext"}],"effect":"Der Kommentar bündelt Verantwortung bei einer öffentlichen Stelle und formuliert eine klare Forderung.","confusion":[["metapher","Die Metapher überträgt aufgrund einer Ähnlichkeit. Die Metonymie ersetzt aufgrund einer sachlichen Beziehung, etwa Verfasser für Werk."],["pars-pro-toto","Bei Pars pro toto steht ausdrücklich ein Teil für das ganze Ding. „Goethe lesen“ nennt dagegen den Verfasser für sein Werk."]],"counter":{"text":"Die Stadt ist ein Ameisenhaufen.","why":"Das beruht auf einer Ähnlichkeit vieler Bewegungen, nicht auf sachlicher Nachbarschaft."},"memory":"Nähe statt Ähnlichkeit: Autor, Werk; Ort, Institution.","aliases":[],"classExample":"„Goethe lesen“; „eine Tasse trinken“; „Tempo“ für Papiertaschentuch.","exam":"Die Formulierung „Goethe lesen.“ zeigt Metonymie. Man liest ein Werk von Goethe, nicht die Person. Der Verfasser steht für sein Werk. Die verkürzte Bezeichnung hebt den Verfasser hervor und setzt gemeinsames Wissen voraus.","focus":{"cue":"Ein sachlich eng verbundener Ausdruck ersetzt das Gemeinte.","example":"[[Goethe]] lesen.","why":"Man liest ein Werk von Goethe, nicht die Person. Der Verfasser steht für sein Werk.","effect":"Die verkürzte Bezeichnung hebt den Verfasser hervor und setzt gemeinsames Wissen voraus.","source":"Foto 9","priority":2}},{"id":"pars-pro-toto","name":"Pars pro toto","category":"bild","level":3,"material":true,"simple":"Ein Teil steht für das Ganze. Gemeint ist mehr, als das Wort wörtlich nennt.","definition":"Ein Teil bezeichnet das Ganze, zu dem er gehört.","recognize":"Prüfe eine echte Teil-Ganzes-Beziehung: Genannt ist der Teil, gemeint das Ganze.","examples":[{"text":"Wir brauchen noch zwei [[helfende Hände]].","why":"Die Hände stehen für die Menschen, die bei der Arbeit helfen.","effect":"Der Ausdruck rückt die praktische Unterstützung und nicht die Person als Ganzes in den Vordergrund.","context":"Alltag"},{"text":"Jeder [[Kopf]] in dieser Klasse zählt.","why":"Gemeint ist jeder Schüler beziehungsweise jede Schülerin, nicht nur ein Körperteil.","effect":"Die Formulierung betont, dass alle Mitglieder der Lerngruppe berücksichtigt werden sollen.","context":"Kommentar / Rede"},{"text":"Am Horizont kehrten drei [[Segel]] in den Hafen zurück.","why":"Die Segel stehen für die vollständigen Segelschiffe.","effect":"Das auffällige sichtbare Detail prägt die Wahrnehmung der fernen Schiffe und verdichtet die Szene.","context":"Literarischer Modelltext"}],"effect":"Die Formulierung betont, dass alle Mitglieder der Lerngruppe berücksichtigt werden sollen.","confusion":[["metonymie","Metonymie kann andere sachliche Beziehungen nutzen, etwa Autor und Werk. Pars pro toto nennt genau einen Teil."]],"counter":{"text":"Sie repariert das Segel des Bootes.","why":"Hier ist tatsächlich nur das Segel gemeint; es ersetzt nicht das Boot."},"memory":"Genannt: der Teil. Gemeint: das Ganze.","aliases":[],"classExample":"„Klinge“ statt „Schwert“: Ein Teil bezeichnet das Ganze. Die umgekehrte Richtung im Blatt ist dafür keine präzise Definition.","exam":"Die Formulierung „Klinge statt Schwert.“ zeigt Pars pro toto. Die Klinge ist nur ein Teil des Schwertes, bezeichnet hier aber das ganze Schwert. Die Benennung lenkt den Blick besonders auf den schneidenden, gefährlichen Teil.","focus":{"cue":"Ein Teil bezeichnet das ganze Ding.","example":"[[Klinge]] statt [[Schwert]].","why":"Die Klinge ist nur ein Teil des Schwertes, bezeichnet hier aber das ganze Schwert.","effect":"Die Benennung lenkt den Blick besonders auf den schneidenden, gefährlichen Teil.","source":"Foto 9","priority":2}},{"id":"periphrase","name":"Periphrase","category":"bild","level":3,"material":true,"simple":"Du nennst etwas nicht direkt. Stattdessen beschreibst du es mit kennzeichnenden Merkmalen.","definition":"Eine Periphrase umschreibt eine Person oder Sache durch charakteristische Merkmale anstelle ihrer direkten Bezeichnung.","recognize":"Frage, welcher direkte Name durch die Wortgruppe ersetzt wird. Die Umschreibung muss im Kontext zuordenbar sein.","examples":[{"text":"Kannst du mir den [[kleinen Helfer gegen den Regen]] reichen? Gemeint ist der Schirm.","why":"Der Gegenstand wird über seine Funktion statt über seinen Namen bezeichnet.","effect":"Die bekannte Alltagssache wirkt spielerisch und persönlich.","context":"Alltag"},{"text":"Auch [[die Menschen, die nachts unsere Straßen reinigen]], verdienen mehr Aufmerksamkeit.","why":"Die Berufsbezeichnung wird durch eine charakteristische Tätigkeit ersetzt.","effect":"Der Kommentar macht die konkrete Arbeit sichtbar und unterstützt die Forderung nach gesellschaftlicher Anerkennung.","context":"Kommentar / Rede"},{"text":"Sie suchte [[den Ort, an dem ihre ersten Schritte Spuren hinterlassen hatten]].","why":"Die Umschreibung ersetzt im Kontext das Elternhaus oder die frühere Heimat.","effect":"Der Ort wird mit biografischer Erinnerung verbunden; die Rückkehr erhält eine emotionale Bedeutung.","context":"Literarischer Modelltext"}],"effect":"Der Kommentar macht die konkrete Arbeit sichtbar und unterstützt die Forderung nach gesellschaftlicher Anerkennung.","confusion":[["euphemismus","Eine Periphrase muss nichts beschönigen. Ein Euphemismus mildert ausdrücklich einen problematischen Sachverhalt."],["metapher","Eine Umschreibung kann bildlich sein, muss es aber nicht."]],"counter":{"text":"Der Schirm liegt im Flur.","why":"Der Gegenstand wird unmittelbar benannt."},"memory":"Beschreiben statt direkt benennen.","aliases":[],"classExample":"„Das Land, wo die Zitronen blühn“ als Umschreibung Italiens.","exam":"Die Formulierung „Das Land, wo die Zitronen blühn statt Italien.“ zeigt Periphrase. Das Land wird durch ein kennzeichnendes Bild umschrieben. Die Umschreibung stellt Italien als warmen, anschaulichen Sehnsuchtsort dar.","focus":{"cue":"Merkmale umschreiben etwas, statt es direkt zu nennen.","example":"[[Das Land, wo die Zitronen blühn]] statt Italien.","why":"Das Land wird durch ein kennzeichnendes Bild umschrieben.","effect":"Die Umschreibung stellt Italien als warmen, anschaulichen Sehnsuchtsort dar.","source":"Foto 9","priority":2}},{"id":"synaesthesie","name":"Synästhesie","category":"bild","level":3,"material":true,"simple":"Wörter aus verschiedenen Sinnen werden verbunden. Ein Klang kann zum Beispiel als süß beschrieben werden.","definition":"Eine Synästhesie verbindet sprachlich Wahrnehmungen aus unterschiedlichen Sinnesbereichen.","recognize":"Ordne die beteiligten Wörter Sinnen zu: Sehen, Hören, Riechen, Schmecken oder Tasten. Zwei Wörter aus demselben Sinn reichen nicht.","examples":[{"text":"Die Sängerin hat eine [[warme Stimme]].","why":"Wärme gehört zum Tasten und Temperaturempfinden, Stimme zum Hören.","effect":"Der Klang erscheint angenehm und geborgen; die körperliche Empfindung wird auf den Höreindruck übertragen.","context":"Alltag"},{"text":"Die Werbung verspricht einen [[samtweichen Klang]].","why":"Die tastbare Eigenschaft des Samts wird auf einen Höreindruck bezogen.","effect":"Die Werbung macht eine schwer beschreibbare Klangqualität sinnlich vorstellbar und wertet sie positiv.","context":"Kommentar / Rede"},{"text":"Aus dem offenen Fenster fiel [[goldene Musik]] in die Gasse.","why":"Die sichtbare Farbe und der Glanz von Gold werden mit hörbarer Musik verbunden.","effect":"Der Klang bekommt Leuchtkraft und Kostbarkeit; die Szene wirkt sinnlich verdichtet.","context":"Literarischer Modelltext"}],"effect":"Die Werbung macht eine schwer beschreibbare Klangqualität sinnlich vorstellbar und wertet sie positiv.","confusion":[["metapher","Synästhesie ist eine besondere Übertragung zwischen Sinnesgebieten. Nicht jede Metapher verbindet Sinne."]],"counter":{"text":"Die Musik ist laut.","why":"Lautstärke gehört zum Hören. Es findet kein Wechsel des Sinnesbereichs statt."},"memory":"Ein Sinn spricht mit den Wörtern eines anderen.","aliases":["Synästhesie","Synaesthesie"],"classExample":"„Golden wehn die Töne, süß spricht das Herz.“","exam":"Die Formulierung „Golden wehn die Töne.“ zeigt Synästhesie. Eine Farbwahrnehmung wird auf etwas Hörbares übertragen. Der Klang bekommt eine warme, leuchtende Qualität und wirkt sinnlich erfahrbar.","focus":{"cue":"Wörter aus unterschiedlichen Sinnesbereichen werden verbunden.","example":"[[Golden]] wehn die [[Töne]].","why":"Eine Farbwahrnehmung wird auf etwas Hörbares übertragen.","effect":"Der Klang bekommt eine warme, leuchtende Qualität und wirkt sinnlich erfahrbar.","source":"Foto 9","priority":2}},{"id":"euphemismus","name":"Euphemismus","category":"bild","level":3,"material":true,"simple":"Etwas Unangenehmes wird milder oder freundlicher bezeichnet. Das kann schonend sein oder Probleme verdecken.","definition":"Ein Euphemismus ersetzt eine als hart, anstößig oder belastend empfundene Bezeichnung durch einen mildernden Ausdruck.","recognize":"Formuliere den Sachverhalt möglichst neutral und vergleiche die Wertung. Entscheidend ist die beschönigende Wirkung im Kontext.","examples":[{"text":"Die Familie sagt: Er ist [[von uns gegangen]].","why":"Der Tod wird durch eine mildere Umschreibung ersetzt.","effect":"Die Formulierung kann in einem Trauergespräch Rücksicht nehmen und emotionalen Schmerz abfedern.","context":"Alltag"},{"text":"Die Firma nennt den Abbau von Arbeitsplätzen [[Personalanpassung]].","why":"Die konkrete Entlassung wird durch einen neutral klingenden Verwaltungsausdruck ersetzt.","effect":"Der Begriff kann die Folgen für Betroffene verdecken; ein kritischer Kommentar kann diese Verschleierung offenlegen.","context":"Kommentar / Rede"},{"text":"Man sagte, das Dorf werde [[weichen müssen]], während bereits die Häuser fielen.","why":"Die Zerstörung und der Verlust der Heimat erscheinen als sanftes, fast freiwilliges Zurücktreten.","effect":"Der Gegensatz zur sichtbaren Zerstörung macht die beschönigende Amtssprache kritisch erkennbar.","context":"Literarischer Modelltext"}],"effect":"Der Begriff kann die Folgen für Betroffene verdecken; ein kritischer Kommentar kann diese Verschleierung offenlegen.","confusion":[["litotes","Litotes bejaht durch Verneinung des Gegenteils. Euphemismus beschreibt eine beschönigende Funktion, nicht eine bestimmte Negationsform."],["periphrase","Nicht jede Umschreibung beschönigt; beide Mittel können gemeinsam auftreten."]],"counter":{"text":"Dreißig Beschäftigte werden entlassen.","why":"Die Aussage benennt den Sachverhalt direkt, ohne ihn sprachlich abzumildern."},"memory":"Milde Wörter können harte Wirklichkeit verdecken.","aliases":[],"classExample":"„entschlafen“ statt „sterben“","exam":"Die Formulierung „entschlafen statt sterben“ zeigt Euphemismus. Der Tod wird als friedlicher Schlaf umschrieben. Die Bezeichnung kann den Tod weniger hart erscheinen lassen und Rücksicht auf Trauernde nehmen.","focus":{"cue":"Ein unangenehmer Sachverhalt wird milder oder schöner bezeichnet.","example":"[[entschlafen]] statt [[sterben]]","why":"Der Tod wird als friedlicher Schlaf umschrieben.","effect":"Die Bezeichnung kann den Tod weniger hart erscheinen lassen und Rücksicht auf Trauernde nehmen.","source":"Foto 4 und Foto 7","priority":1}},{"id":"hyperbel","name":"Hyperbel","category":"bild","level":2,"material":true,"simple":"Etwas wird absichtlich sehr stark übertrieben. Die Aussage ist nicht wörtlich gemeint.","definition":"Eine Hyperbel übersteigert einen Sachverhalt über das glaubhafte oder sachlich angemessene Maß hinaus.","recognize":"Prüfe, ob die Aussage als auffällige Übertreibung erkennbar ist. Ein bloßer großer Zahlenwert ist nicht automatisch eine Hyperbel.","examples":[{"text":"Ich habe dir das schon [[tausendmal]] erklärt.","why":"Die Zahl ist im üblichen Gespräch nicht als genau gezählte Häufigkeit gemeint.","effect":"Die Übertreibung betont Ungeduld und den Eindruck ständiger Wiederholung.","context":"Alltag"},{"text":"Wer jedes Klingeln beantwortet, kommt [[nie mehr zum Denken]].","why":"Es wird absolute Unmöglichkeit behauptet, obwohl Denkpausen weiter möglich sind.","effect":"Die Zuspitzung dramatisiert die Ablenkung durch Benachrichtigungen und stützt die Forderung nach störungsfreien Lernphasen.","context":"Kommentar / Rede"},{"text":"Sie wartete, bis [[ganze Zeitalter zwischen zwei Atemzügen]] vergangen waren.","why":"Zwischen Atemzügen vergehen keine Zeitalter; die Dauer wird extrem überhöht.","effect":"Die übersteigerte Zeitwahrnehmung vermittelt Anspannung und subjektiv endloses Warten.","context":"Literarischer Modelltext"}],"effect":"Die Zuspitzung dramatisiert die Ablenkung durch Benachrichtigungen und stützt die Forderung nach störungsfreien Lernphasen.","confusion":[["klimax","Klimax braucht eine steigende Folge. Eine Hyperbel kann aus nur einem übertriebenen Ausdruck bestehen."]],"counter":{"text":"Die Fahrt dauerte tatsächlich drei Stunden.","why":"Eine zutreffende Dauerangabe ist keine Übertreibung."},"memory":"Übertreibung ist nicht wörtlich zu nehmen.","aliases":[],"classExample":"„Es dauert eine Ewigkeit“; „Ich weiß alles.“","exam":"Die Formulierung „Es dauert eine Ewigkeit.“ zeigt Hyperbel. Eine begrenzte Wartezeit wird als unendlich lang dargestellt. Die Übertreibung betont die Ungeduld der wartenden Person.","focus":{"cue":"Eine Aussage ist deutlich übertrieben.","example":"Es dauert [[eine Ewigkeit]].","why":"Eine begrenzte Wartezeit wird als unendlich lang dargestellt.","effect":"Die Übertreibung betont die Ungeduld der wartenden Person.","source":"Foto 4 und Foto 7","priority":1}},{"id":"litotes","name":"Litotes","category":"bild","level":3,"material":true,"simple":"Du sagst etwas, indem du das Gegenteil verneinst. „Nicht schlecht“ kann im Kontext ein vorsichtiges Lob sein.","definition":"Eine Litotes formuliert eine Aussage durch Verneinung ihres Gegenteils, häufig als Untertreibung oder indirekte Verstärkung.","recognize":"Suche die Verneinung und das verneinte Gegenmerkmal. Bestimme dann anhand des Kontextes, wie stark die positive Aussage gemeint ist.","examples":[{"text":"Nach einer hervorragenden Präsentation sagt jemand: Das war [[nicht schlecht]].","why":"Verneint wird „schlecht“; im Lobkontext ist eine deutlich positive Bewertung gemeint.","effect":"Das Lob wirkt zurückhaltend und kann gerade dadurch Anerkennung hervorheben.","context":"Alltag"},{"text":"Die Folgekosten sind [[nicht unerheblich]].","why":"Die geringe Bedeutung der Kosten wird verneint; gemeint sind spürbare Kosten.","effect":"Die zurückhaltende Form mahnt zur Vorsicht, ohne die Warnung plakativ zu übertreiben.","context":"Kommentar / Rede"},{"text":"Sie ging diesen Weg [[nicht ohne Furcht]].","why":"Furchtlosigkeit wird verneint; die Figur empfindet Angst.","effect":"Die indirekte Form lässt die Angst beherrscht erscheinen und unterstreicht, dass der Aufbruch trotzdem erfolgt.","context":"Literarischer Modelltext"}],"effect":"Die zurückhaltende Form mahnt zur Vorsicht, ohne die Warnung plakativ zu übertreiben.","confusion":[["euphemismus","Euphemismus beschönigt etwas; eine Litotes muss nicht beschönigen und kann eine Kritik verstärken."],["hyperbel","Hyperbel übersteigert offen; Litotes kann durch scheinbar zurückhaltende Negation wirken."]],"counter":{"text":"Ich habe das Buch nicht gelesen.","why":"Die Aussage verneint eine Handlung direkt, ohne dadurch das Gegenteil einer Eigenschaft positiv auszudrücken."},"memory":"Das Gegenteil verneinen, statt direkt bejahen.","aliases":[],"classExample":"„nicht schlecht“; „nicht gerade ein Held“; „Er war nicht ehrlich zu dir.“ Die Deutung als indirekte Verstärkung benötigt Kontext.","exam":"Die Formulierung „Das ist nicht schlecht.“ zeigt Litotes. Statt direkt zu loben, wird das negative Urteil verneint. Das Lob wirkt zurückhaltend; je nach Zusammenhang kann gerade diese Zurückhaltung es verstärken.","focus":{"cue":"Eine Abschwächung oder Verneinung hebt indirekt etwas hervor.","example":"Das ist [[nicht schlecht]].","why":"Statt direkt zu loben, wird das negative Urteil verneint.","effect":"Das Lob wirkt zurückhaltend; je nach Zusammenhang kann gerade diese Zurückhaltung es verstärken.","source":"Foto 9","priority":2}},{"id":"anapher","name":"Anapher","category":"muster","level":2,"material":true,"simple":"Mehrere Sätze oder Satzteile beginnen mit demselben Wort. So entsteht ein wiederkehrender Anfang.","definition":"Eine Anapher wiederholt Wörter oder Wortgruppen am Anfang aufeinanderfolgender Sätze, Verse oder vergleichbarer Einheiten.","recognize":"Vergleiche die Anfänge mehrerer Einheiten. Gleiche Satzstruktur allein reicht nicht; die Wörter am Anfang müssen sich wiederholen.","examples":[{"text":"[[Ich will]] schlafen. [[Ich will]] Ruhe.","why":"Die beiden Sätze beginnen mit derselben Wortgruppe „Ich will“.","effect":"Die Wiederholung betont das Bedürfnis und wirkt nachdrücklich.","context":"Alltag"},{"text":"[[Wir brauchen]] Räume zum Lesen. [[Wir brauchen]] Zeit zum Denken. [[Wir brauchen]] Mut zur Diskussion.","why":"Drei Forderungen setzen mit genau denselben Wörtern ein.","effect":"Der gemeinsame Anfang verbindet die Forderungen zu einem Programm und erhöht ihre Eindringlichkeit.","context":"Kommentar / Rede"},{"text":"[[Noch]] stand ihr Stuhl am Fenster. [[Noch]] hing ihr Mantel an der Tür. [[Noch]] wartete das Haus.","why":"„Noch“ steht jeweils am Satzanfang; im letzten Satz tritt zusätzlich eine Personifikation auf.","effect":"Die Wiederholung hält die Spuren einer abwesenden Person fest und lässt einen bevorstehenden Verlust spürbar werden.","context":"Literarischer Modelltext"}],"effect":"Der gemeinsame Anfang verbindet die Forderungen zu einem Programm und erhöht ihre Eindringlichkeit.","confusion":[["epipher","Epipher wiederholt am Ende, Anapher am Anfang."],["parallelismus","Parallelismus betrifft die Satzstruktur. Eine Anapher kann mit ihm zusammen auftreten."]],"counter":{"text":"Heute lese ich. Morgen schreibe ich.","why":"Die Anfänge sind verschieden; wiederholt wird „ich“ am Ende."},"memory":"Anapher: am Anfang.","aliases":["Anaphora"],"classExample":"„Ich wollte rennen, ich wollte fliegen, ich wollte alles erreichen!“","exam":"Die Formulierung „Ich wollte rennen, ich wollte fliegen, ich wollte alles erreichen!“ zeigt Anapher. Die Wortgruppe „ich wollte“ steht dreimal am Anfang. Die wiederholten Anfänge betonen den starken Wunsch und verbinden die einzelnen Ziele.","focus":{"cue":"Gleiche Wörter am Anfang aufeinanderfolgender Einheiten.","example":"[[Ich wollte]] rennen, [[ich wollte]] fliegen, [[ich wollte]] alles erreichen!","why":"Die Wortgruppe „ich wollte“ steht dreimal am Anfang.","effect":"Die wiederholten Anfänge betonen den starken Wunsch und verbinden die einzelnen Ziele.","source":"Foto 2 und Foto 7","priority":1}},{"id":"epipher","name":"Epipher","category":"muster","level":3,"material":true,"simple":"Mehrere Sätze oder Satzteile enden mit denselben Wörtern. Der Schluss kehrt immer wieder.","definition":"Eine Epipher wiederholt Wörter oder Wortgruppen am Ende aufeinanderfolgender Sätze, Verse oder vergleichbarer Einheiten.","recognize":"Vergleiche die Enden. Eine einmalige Formulierung kann ohne weitere Textstelle nicht als Epipher nachgewiesen werden.","examples":[{"text":"Am Morgen fehlt mir [[Zeit]]. Am Abend fehlt mir [[Zeit]].","why":"Beide Sätze schließen mit demselben Wort.","effect":"Das wiederholte Ende macht Zeitmangel zum beherrschenden Problem.","context":"Alltag"},{"text":"Die Schule braucht [[Vertrauen]]. Die Familien brauchen [[Vertrauen]]. Die ganze Debatte braucht [[Vertrauen]].","why":"Die Einheiten münden jeweils in „Vertrauen“.","effect":"Das Schlüsselwort wird zum gemeinsamen Ziel verschiedener Beteiligter; die Rede bündelt ihre Forderung darauf.","context":"Kommentar / Rede"},{"text":"Er suchte im Haus [[nach ihr]]. Er fragte den Wind [[nach ihr]]. Er lauschte der Nacht [[nach ihr]].","why":"Die drei Sätze enden identisch; Wind und Nacht ergänzen bildhafte Sprache.","effect":"Jede Suchbewegung kehrt zu derselben Person zurück. Das verstärkt den Eindruck von Sehnsucht und Ausweglosigkeit.","context":"Literarischer Modelltext"}],"effect":"Das Schlüsselwort wird zum gemeinsamen Ziel verschiedener Beteiligter; die Rede bündelt ihre Forderung darauf.","confusion":[["anapher","Der Unterschied ist die Position der wiederholten Wörter."],["epiphrase","Epiphrase ist ein Nachtrag zu einem abgeschlossenen Satz, keine Wiederholung am Satzende."]],"counter":{"text":"Wir warten auf Antworten.","why":"Ein einzelner Satz weist keine wiederholten Enden nach."},"memory":"Epipher: am Ende.","aliases":[],"classExample":"„Wir wollen gute Noten. Nichts ist uns wichtiger als gute Noten.“","exam":"Die Formulierung „Wir wollen gute Noten. Nichts ist uns wichtiger als gute Noten.“ zeigt Epipher. Beide Sätze enden mit derselben Wortgruppe. Das wiederholte Satzende rückt das Ziel guter Noten besonders stark in den Vordergrund.","focus":{"cue":"Gleiche Wörter am Ende aufeinanderfolgender Einheiten.","example":"Wir wollen [[gute Noten]]. Nichts ist uns wichtiger als [[gute Noten]].","why":"Beide Sätze enden mit derselben Wortgruppe.","effect":"Das wiederholte Satzende rückt das Ziel guter Noten besonders stark in den Vordergrund.","source":"Foto 2 und Foto 7","priority":1}},{"id":"repetitio","name":"Repetitio","category":"muster","level":2,"material":true,"simple":"Ein Wort oder eine Wortgruppe wird wiederholt. Wichtiges bleibt dadurch im Ohr.","definition":"Repetitio bezeichnet die Wiederholung sprachlicher Elemente; Anapher und Epipher sind positionsgebundene Sonderformen.","recognize":"Suche tatsächlich wiederkehrende Wörter. Ähnliche Bedeutungen allein sind keine wörtliche Wiederholung.","examples":[{"text":"[[Weiter, weiter]]!","why":"Dasselbe Wort steht zweimal unmittelbar hintereinander.","effect":"Die Wiederholung treibt an und verstärkt den Handlungsdruck.","context":"Alltag"},{"text":"Wir warten auf Ergebnisse und [[warten und warten]].","why":"Das Verb kehrt mehrfach zurück, ohne dass es um einen wechselnden Wortstamm geht.","effect":"Die gedehnte Wiederholung bildet die als quälend empfundene Verzögerung nach und kritisiert Untätigkeit.","context":"Kommentar / Rede"},{"text":"[[Fort]] war der Klang, [[fort]] das Licht, [[fort]] die Wärme.","why":"„Fort“ wird wiederholt, jeweils am Anfang der verkürzten Einheiten; daher ist auch Anapher zutreffend.","effect":"Die wiederholte Abwesenheit lässt den Verlust mehrere Wahrnehmungsbereiche erfassen.","context":"Literarischer Modelltext"}],"effect":"Die gedehnte Wiederholung bildet die als quälend empfundene Verzögerung nach und kritisiert Untätigkeit.","confusion":[["figura-etymologica","Figura etymologica verbindet verschiedene Wörter desselben Stamms; Repetitio wiederholt ein Element."],["anapher","Anapher ist die genauere Bezeichnung, wenn die Wiederholung jeweils am Anfang steht."]],"counter":{"text":"Sie ist mutig und tapfer.","why":"Die Bedeutungen ähneln sich, die Wörter sind aber nicht identisch."},"memory":"Dasselbe sprachliche Element kommt wieder.","aliases":["Wiederholung"],"classExample":"„Bald da, bald dort.“ Zusätzlich wiederholt sich ein Einheitsanfang.","exam":"Die Formulierung „Bald da, bald dort.“ zeigt Repetitio. „Bald“ kommt mehrfach vor. Zusätzlich beginnt es beide Teile. Die Wiederholung macht den Wechsel zwischen den Orten deutlich.","focus":{"cue":"Ein Wort oder eine Wortgruppe wird wiederholt.","example":"[[Bald]] da, [[bald]] dort.","why":"„Bald“ kommt mehrfach vor. Zusätzlich beginnt es beide Teile.","effect":"Die Wiederholung macht den Wechsel zwischen den Orten deutlich.","source":"Foto 9","priority":2}},{"id":"parallelismus","name":"Parallelismus","category":"muster","level":3,"material":true,"simple":"Mehrere Satzteile haben denselben Bauplan. Die Wörter dürfen unterschiedlich sein.","definition":"Ein Parallelismus ordnet entsprechende Satzglieder in aufeinanderfolgenden Einheiten in gleicher syntaktischer Folge an.","recognize":"Bestimme die Funktionen der Satzteile, etwa Subjekt, Prädikat und Objekt. Vergleiche ihren Bauplan statt nur einzelne Wörter.","examples":[{"text":"[[Mia liest Bücher]]. [[Ben schreibt Briefe]].","why":"Beide Sätze folgen dem Schema Subjekt – Prädikat – Objekt.","effect":"Die gleich gebauten Aussagen stellen die Tätigkeiten gleichrangig nebeneinander.","context":"Alltag"},{"text":"[[Wir schützen Daten]]. [[Wir stärken Rechte]].","why":"Die Forderungen haben denselben grammatischen Aufbau; zusätzlich beginnt jede mit „Wir“.","effect":"Der gleichmäßige Satzbau verbindet Datenschutz und Rechte als zusammengehörende Ziele.","context":"Kommentar / Rede"},{"text":"[[Der Tag brachte Fragen]]. [[Die Nacht trug Antworten]].","why":"Die Einheiten folgen demselben Bauplan, auch wenn die Tätigkeiten metaphorisch beschrieben sind.","effect":"Die formale Entsprechung stellt Tag und Nacht als aufeinander bezogene Erfahrungsräume dar.","context":"Literarischer Modelltext"}],"effect":"Der gleichmäßige Satzbau verbindet Datenschutz und Rechte als zusammengehörende Ziele.","confusion":[["chiasmus","Parallelismus: A–B / A–B. Chiasmus: A–B / B–A."],["anapher","Gleicher Satzbau verlangt keine identischen Anfangswörter; Anapher verlangt sie."]],"counter":{"text":"Mia liest Bücher, während Ben von seinen Briefen erzählt.","why":"Die grammatischen Strukturen sind hier nicht parallel aufgebaut."},"memory":"Gleicher Bauplan, nicht zwingend gleiche Wörter.","aliases":[],"classExample":"„Wir sind vier Mädchen, wir sind 22 Jungen.“","exam":"Die Formulierung „Wir sind vier Mädchen, wir sind 22 Jungen.“ zeigt Parallelismus. Beide Teile folgen dem Muster „Wir sind + Anzahl + Gruppe“. Der gleiche Aufbau stellt die beiden Gruppengrößen unmittelbar nebeneinander.","focus":{"cue":"Sätze haben denselben grammatischen Bauplan.","example":"[[Wir sind vier Mädchen]], [[wir sind 22 Jungen]].","why":"Beide Teile folgen dem Muster „Wir sind + Anzahl + Gruppe“.","effect":"Der gleiche Aufbau stellt die beiden Gruppengrößen unmittelbar nebeneinander.","source":"Foto 2 und Foto 9","priority":1}},{"id":"chiasmus","name":"Chiasmus","category":"muster","level":3,"material":true,"simple":"Zwei Satzteile sind über Kreuz gebaut. Eine Reihenfolge wird im zweiten Teil umgedreht.","definition":"Ein Chiasmus stellt syntaktisch oder semantisch entsprechende Elemente über Kreuz nach dem Muster A–B / B–A.","recognize":"Benenne ausdrücklich, welche Elemente die Rollen A und B übernehmen. Ein Gegensatz allein beweist keine Kreuzstellung.","examples":[{"text":"[[Ich mag den Sommer; den Winter magst du]].","why":"Zuerst steht die Person vor der Jahreszeit, dann die Jahreszeit vor der Person: Subjekt – Objekt / Objekt – Subjekt.","effect":"Der umgekehrte Bau hebt die unterschiedlichen Vorlieben hervor.","context":"Alltag"},{"text":"[[Die Technik soll dem Menschen dienen, nicht der Mensch der Technik]].","why":"Die Rollen von Mensch und Technik werden im zweiten Teil überkreuz getauscht.","effect":"Die Kreuzstellung stellt die gewünschte Rangordnung der problematischen Umkehrung gegenüber und verdichtet die Kritik.","context":"Kommentar / Rede"},{"text":"[[Hell war der Morgen, der Abend war dunkel]].","why":"Im ersten Teil steht die Eigenschaft vor dem Subjekt, im zweiten das Subjekt vor der Eigenschaft.","effect":"Der spiegelnde Aufbau betont den Wandel von Helligkeit zu Dunkelheit; zugleich liegt eine Antithese vor.","context":"Literarischer Modelltext"}],"effect":"Die Kreuzstellung stellt die gewünschte Rangordnung der problematischen Umkehrung gegenüber und verdichtet die Kritik.","confusion":[["parallelismus","Parallelismus bewahrt die Reihenfolge, Chiasmus kehrt sie um."],["antithese","Antithese beschreibt einen Bedeutungsgegensatz. Chiasmus beschreibt die Anordnung. Beides kann gleichzeitig vorliegen."]],"counter":{"text":"Der Morgen ist hell, der Abend ist dunkel.","why":"Es gibt einen Gegensatz, aber beide Einheiten haben denselben Aufbau."},"memory":"A–B wird zu B–A.","aliases":[],"classExample":"„Der Einsatz war groß, klein war der Gewinn.“ Zugleich liegt ein Gegensatz zwischen groß und klein vor.","exam":"Die Formulierung „Der Einsatz war groß, klein war der Gewinn.“ zeigt Chiasmus. Zuerst steht das Subjekt vor der Eigenschaft, danach die Eigenschaft vor dem Subjekt. Die Kreuzstellung verbindet den großen Aufwand mit dem kleinen Ergebnis und verschärft den Kontrast.","focus":{"cue":"Die Reihenfolge wird über Kreuz angeordnet: AB – BA.","example":"[[Der Einsatz]] war [[groß]], [[klein]] war [[der Gewinn]].","why":"Zuerst steht das Subjekt vor der Eigenschaft, danach die Eigenschaft vor dem Subjekt.","effect":"Die Kreuzstellung verbindet den großen Aufwand mit dem kleinen Ergebnis und verschärft den Kontrast.","source":"Foto 4 und Foto 7","priority":1}},{"id":"alliteration","name":"Alliteration","category":"muster","level":2,"material":true,"simple":"Benachbarte wichtige Wörter beginnen mit demselben Laut. Der Klang verbindet sie.","definition":"Eine Alliteration wiederholt den Anfangslaut betonter Stammsilben benachbarter oder eng verbundener Wörter.","recognize":"Höre auf den Laut, nicht nur auf den Buchstaben. Kleine Verbindungswörter können dazwischenstehen.","examples":[{"text":"[[Mila malt Muster]].","why":"Die betonten Wörter beginnen hörbar mit dem Laut m.","effect":"Der Gleichklang macht den Satz rhythmisch und leicht merkbar.","context":"Alltag"},{"text":"Wir brauchen [[Mut statt Mauern]].","why":"Die bedeutungstragenden Wörter „Mut“ und „Mauern“ haben denselben Anfangslaut.","effect":"Der Klang koppelt die Alternative eng und macht die politische Forderung einprägsam.","context":"Kommentar / Rede"},{"text":"[[Leise lag das Licht]] auf den verlassenen Wegen.","why":"Die l-Anlaute wiederholen sich in mehreren benachbarten Wörtern.","effect":"Der sanfte Gleichklang kann hier die ruhige, gedämpfte Atmosphäre unterstützen.","context":"Literarischer Modelltext"}],"effect":"Der Klang koppelt die Alternative eng und macht die politische Forderung einprägsam.","confusion":[["anapher","Alliteration wiederholt einen Laut; Anapher ganze Wörter an Einheitsanfängen."],["onomatopoesie","Lautmalerei ahmt einen bezeichneten Klang nach. Alliteration verlangt keine Geräuschnachahmung."]],"counter":{"text":"Chemie und Chor","why":"Die Anfangsbuchstaben sind gleich, die üblichen deutschen Anfangslaute unterscheiden sich."},"memory":"Gleicher Anfangslaut, nicht nur gleicher Buchstabe.","aliases":[],"classExample":"„Stefanie strahlt stundenlang“; „Daniel Dauerdöser denkt: Das dauert doch noch.“","exam":"Die Formulierung „Stefanie strahlt stundenlang.“ zeigt Alliteration. Die wichtigen Wörter beginnen jeweils mit dem Laut „scht“. Der Gleichklang verbindet die Wörter und macht die Aussage einprägsam.","focus":{"cue":"Benachbarte Wörter beginnen mit demselben Laut.","example":"[[Stefanie]] [[strahlt]] [[stundenlang]].","why":"Die wichtigen Wörter beginnen jeweils mit dem Laut „scht“.","effect":"Der Gleichklang verbindet die Wörter und macht die Aussage einprägsam.","source":"Foto 4 und Foto 7","priority":1}},{"id":"figura-etymologica","name":"Figura etymologica","category":"muster","level":3,"material":true,"simple":"Verschiedene Wörter aus derselben Wortfamilie stehen eng zusammen. Oft wird ein Verb mit einem verwandten Nomen verbunden.","definition":"Eine Figura etymologica verbindet etymologisch beziehungsweise wortstammverwandte Ausdrücke in enger syntaktischer Beziehung.","recognize":"Suche unterschiedliche Wörter mit gemeinsamem Stamm. Bloße Flexionsformen oder eine identische Wortwiederholung sind nicht das typische Muster.","examples":[{"text":"Sie [[träumt einen schönen Traum]].","why":"Das Verb „träumen“ und das Nomen „Traum“ gehören zur selben Wortfamilie.","effect":"Die Verbindung hebt das Träumen und seinen Inhalt nachdrücklich hervor.","context":"Alltag"},{"text":"Wer [[Freiheit erkämpft]], muss auch bereit sein, den [[Kampf]] für sie fortzusetzen.","why":"Das Verb „erkämpfen“ und das Nomen „Kampf“ sind stammverwandt und inhaltlich verbunden.","effect":"Die Wortverwandtschaft bindet erreichte Freiheit an fortdauernde Anstrengung und stützt die Aufforderung zu Engagement.","context":"Kommentar / Rede"},{"text":"Er wollte ein [[Leben leben]], das seinen Namen verdiente.","why":"Nomen und Verb besitzen denselben Stamm und bilden eine enge Verbindung.","effect":"Die Figur betont den Anspruch auf ein bewusst gestaltetes, nicht bloß vergehendes Leben.","context":"Literarischer Modelltext"}],"effect":"Die Wortverwandtschaft bindet erreichte Freiheit an fortdauernde Anstrengung und stützt die Aufforderung zu Engagement.","confusion":[["repetitio","„Kampf, Kampf“ wiederholt dasselbe Wort. „Einen Kampf kämpfen“ verbindet unterschiedliche stammverwandte Wörter."]],"counter":{"text":"Sie träumt und träumt.","why":"Das ist Wiederholung desselben Verbs, nicht die typische Verbindung verschiedener Wörter einer Wortfamilie."},"memory":"Verwandte Wörter, gemeinsamer Stamm.","aliases":["Etymologische Figur"],"classExample":"„Wir arbeiten in Arbeiten nicht gerne alleine.“ Die Formulierung ist im Arbeitsblatt ungewöhnlich; prüfungstauglicher ist eine klar erkennbare Wortfamilienverbindung wie „einen Traum träumen“.","exam":"Die Formulierung „Wir arbeiten in Arbeiten nicht gerne alleine.“ zeigt Figura etymologica. Verb und Substantiv haben denselben Wortstamm. Es ist keine unveränderte Wortwiederholung. Die Wortverwandtschaft lenkt die Aufmerksamkeit spielerisch auf das Arbeiten in Prüfungen.","focus":{"cue":"Verwandte Wörter derselben Wortfamilie werden verbunden.","example":"Wir [[arbeiten]] in [[Arbeiten]] nicht gerne alleine.","why":"Verb und Substantiv haben denselben Wortstamm. Es ist keine unveränderte Wortwiederholung.","effect":"Die Wortverwandtschaft lenkt die Aufmerksamkeit spielerisch auf das Arbeiten in Prüfungen.","source":"Foto 2","priority":1}},{"id":"tautologie","name":"Tautologie","category":"muster","level":3,"material":true,"simple":"Eine Bedeutung wird mit ähnlichen Wörtern noch einmal gesagt. Beide Ausdrücke stehen meist gleichrangig nebeneinander.","definition":"Als rhetorische Figur bezeichnet Tautologie die Wiederholung desselben Inhalts mit bedeutungsgleichen oder sehr ähnlichen, häufig gleichrangigen Ausdrücken.","recognize":"Prüfe, ob beide Glieder weitgehend dasselbe sagen. Hier geht es um die rhetorische Verwendung, nicht um den logischen Fachbegriff einer immer wahren Aussage.","examples":[{"text":"Das ist [[voll und ganz]] richtig.","why":"Die beiden gleichrangigen Ausdrücke bekräftigen weitgehend denselben Grad der Zustimmung.","effect":"Die Dopplung unterstreicht die uneingeschränkte Zustimmung.","context":"Alltag"},{"text":"Diese Entscheidung ist [[endgültig und abschließend]].","why":"Beide Adjektive betonen das Ende weiterer Entscheidungen in derselben Sache.","effect":"Die doppelte Festlegung kann Entschlossenheit signalisieren und weitere Einwände sprachlich abwehren.","context":"Kommentar / Rede"},{"text":"Er stand [[einsam und allein]] am verschlossenen Tor.","why":"Die gleichrangigen Ausdrücke bündeln den Zustand fehlender Begleitung; ihre Bedeutungsnuancen bleiben im Kontext mitzudenken.","effect":"Die Häufung verstärkt hier den Eindruck von Verlassenheit, statt neue Handlung zu berichten.","context":"Literarischer Modelltext"}],"effect":"Die doppelte Festlegung kann Entschlossenheit signalisieren und weitere Einwände sprachlich abwehren.","confusion":[["pleonasmus","Pleonasmus fügt einem Begriff ein schon enthaltenes Merkmal hinzu, etwa „weißer Schimmel“. Tautologie verwendet meist gleichrangige Ausdrücke."],["synonym","Synonymie ist eine Bedeutungsbeziehung. Erst ihre redundante Verwendung im Ausdruck ergibt die rhetorische Figur."]],"counter":{"text":"Das Zimmer ist klein und dunkel.","why":"Die Eigenschaften sind verschieden und wiederholen nicht dieselbe Bedeutung."},"memory":"Gleichrangige Wörter sagen fast dasselbe.","aliases":[],"classExample":"„nackt und bloß“; „voll und ganz“","exam":"Die Formulierung „nackt und bloß“ zeigt Tautologie. Die beiden gleichrangigen Wörter wiederholen im Wesentlichen dieselbe Bedeutung. Die Doppelung verstärkt den Eindruck völliger Unbedecktheit oder Schutzlosigkeit.","focus":{"cue":"Gleichrangige, sinngleiche oder sehr ähnliche Ausdrücke stehen zusammen.","example":"[[nackt und bloß]]","why":"Die beiden gleichrangigen Wörter wiederholen im Wesentlichen dieselbe Bedeutung.","effect":"Die Doppelung verstärkt den Eindruck völliger Unbedecktheit oder Schutzlosigkeit.","source":"Foto 9","priority":2}},{"id":"pleonasmus","name":"Pleonasmus","category":"muster","level":3,"material":true,"simple":"Ein Wort bekommt eine Ergänzung, deren Bedeutung schon in ihm steckt. Die zusätzliche Information ist eigentlich nicht nötig.","definition":"Ein Pleonasmus fügt einem Ausdruck ein semantisch bereits enthaltenes Merkmal hinzu und kann dadurch verstärken oder unbeabsichtigt redundant wirken.","recognize":"Prüfe die Wortbedeutung im jeweiligen Kontext. Ein Zusatz ist nicht schon deshalb überflüssig, weil er häufig zu einer Sache passt.","examples":[{"text":"Auf der Wiese steht ein [[weißer Schimmel]].","why":"Ein Schimmel bezeichnet in der üblichen Wortbedeutung bereits ein weißes oder sehr helles Pferd.","effect":"Der Zusatz kann die Farbe anschaulich hervorheben, liefert in diesem Kontext aber keine eigenständige Unterscheidung.","context":"Alltag"},{"text":"Die Anschaffung wird als [[kostenlose Gratiszugabe]] angepriesen.","why":"„Gratis“ bedeutet bereits kostenlos. Das zusätzliche Adjektiv wiederholt dieselbe Eigenschaft.","effect":"Die doppelte Betonung lässt den Preisvorteil besonders wichtig erscheinen und kann die Aufmerksamkeit von anderen Kosten ablenken.","context":"Kommentar / Rede"},{"text":"In der Nacht blieb nur die [[lautlose Stille]].","why":"Stille schließt das Fehlen hörbarer Geräusche schon ein.","effect":"Die zusätzliche Betonung des Lautlosen verdichtet die gespannte Ruhe der Szene.","context":"Literarischer Modelltext"}],"effect":"Die doppelte Betonung lässt den Preisvorteil besonders wichtig erscheinen und kann die Aufmerksamkeit von anderen Kosten ablenken.","confusion":[["tautologie","Tautologie reiht ähnliche Ausdrücke meist gleichrangig; beim Pleonasmus steckt die Zusatzbedeutung bereits im Bezugswort."]],"counter":{"text":"Ein rotes Auto fährt vorbei.","why":"Rot ist nicht schon im Begriff Auto enthalten und fügt ein echtes Merkmal hinzu."},"memory":"Die Ergänzung steckt schon im Grundwort.","aliases":[],"classExample":"„weißer Schimmel“; „alter Greis“","exam":"Die Formulierung „weißer Schimmel“ zeigt Pleonasmus. Ein Schimmel ist in der üblichen Bedeutung bereits ein weißes beziehungsweise sehr helles Pferd. Der Zusatz kann das Weiß betonen, aber auch sprachlich überflüssig wirken.","focus":{"cue":"Ein Zusatz wiederholt eine schon im Bezugswort enthaltene Eigenschaft.","example":"[[weißer Schimmel]]","why":"Ein Schimmel ist in der üblichen Bedeutung bereits ein weißes beziehungsweise sehr helles Pferd.","effect":"Der Zusatz kann das Weiß betonen, aber auch sprachlich überflüssig wirken.","source":"Foto 9","priority":2}},{"id":"polysyndeton","name":"Polysyndeton","category":"muster","level":3,"material":true,"simple":"Viele Glieder einer Reihe werden einzeln mit „und“ oder „oder“ verbunden. Die Bindewörter kehren auffällig oft wieder.","definition":"Ein Polysyndeton verbindet mehrere Glieder einer Reihung durch wiederholt gesetzte Konjunktionen.","recognize":"Zähle die Bindewörter zwischen den Gliedern. Ein einziges „und“ am Ende einer gewöhnlichen Liste genügt nicht.","examples":[{"text":"Im Rucksack sind [[Bücher und Hefte und Stifte und Zettel]].","why":"Zwischen den Elementen steht jeweils erneut „und“.","effect":"Jeder Gegenstand erhält Gewicht; die Liste wirkt länger und angehäuft.","context":"Alltag"},{"text":"Wir brauchen [[Zeit und Geld und Räume und Menschen]], die Verantwortung übernehmen.","why":"Die wiederholte Konjunktion bindet die Voraussetzungen gleichrangig zusammen.","effect":"Die Reihung betont, dass keine einzelne Maßnahme genügt; mehrere Bedingungen müssen gemeinsam erfüllt sein.","context":"Kommentar / Rede"},{"text":"Sie hörte [[den Regen und die Schritte und das Atmen und ihr eigenes Herz]].","why":"Die Wahrnehmungen werden durch wiederholtes „und“ einzeln angeschlossen.","effect":"Die langsame Folge lässt die Aufmerksamkeit der Figur von Geräusch zu Geräusch wandern und steigert die Anspannung.","context":"Literarischer Modelltext"}],"effect":"Die Reihung betont, dass keine einzelne Maßnahme genügt; mehrere Bedingungen müssen gemeinsam erfüllt sein.","confusion":[["asyndeton","Asyndeton lässt Konjunktionen weg; Polysyndeton häuft sie."],["akkumulation","Akkumulation betrifft inhaltlich zusammengehörende Begriffe. Sie kann zusätzlich polysyndetisch gebaut sein."]],"counter":{"text":"Bücher, Hefte und Stifte liegen da.","why":"Das ist eine gewöhnliche Aufzählung mit einem einzigen abschließenden Bindewort."},"memory":"Viele Glieder, viele Bindewörter.","aliases":[],"classExample":"„Und es wallet und siedet und brauset und zischt.“","exam":"Die Formulierung „Und es wallet und siedet und brauset und zischt.“ zeigt Polysyndeton. Das Bindewort „und“ verbindet immer wieder die nächste Tätigkeit. Die vielen Verbindungen lassen die Vorgänge dicht und unaufhörlich wirken.","focus":{"cue":"Viele Glieder werden durch wiederholte Bindewörter verbunden.","example":"Und es wallet [[und]] siedet [[und]] brauset [[und]] zischt.","why":"Das Bindewort „und“ verbindet immer wieder die nächste Tätigkeit.","effect":"Die vielen Verbindungen lassen die Vorgänge dicht und unaufhörlich wirken.","source":"Foto 9","priority":2}},{"id":"asyndeton","name":"Asyndeton","category":"muster","level":3,"material":true,"simple":"Eine Reihe kommt ohne Bindewörter wie „und“ aus. Die Glieder stehen direkt nebeneinander.","definition":"Ein Asyndeton reiht Wörter, Wortgruppen oder Sätze ohne verbindende Konjunktionen aneinander.","recognize":"Prüfe, ob eine erkennbare Reihung vorliegt und die Verknüpfungswörter fehlen. Kommas allein beweisen keine Reihung.","examples":[{"text":"Er [[packt, rennt, stolpert]].","why":"Drei gleichrangige Verben sind nur durch Kommas verbunden.","effect":"Die unverbundene Folge vermittelt Tempo und eine rasche Abfolge von Handlungen.","context":"Alltag"},{"text":"Wir brauchen [[Bücher, Räume, Ruhe]].","why":"Die drei Forderungsgegenstände werden ohne „und“ gereiht.","effect":"Die knappe Liste wirkt pointiert und drängend; sie konzentriert den Kommentar auf konkrete Bedürfnisse.","context":"Kommentar / Rede"},{"text":"[[Die Tür fiel zu, die Schritte verstummten, das Haus atmete Dunkelheit]].","why":"Die Teilsätze folgen ohne Konjunktion aufeinander.","effect":"Die dicht aufeinanderfolgenden Eindrücke geben der Szene einen gedrängten Rhythmus; die letzte Personifikation verstärkt die Atmosphäre.","context":"Literarischer Modelltext"}],"effect":"Die knappe Liste wirkt pointiert und drängend; sie konzentriert den Kommentar auf konkrete Bedürfnisse.","confusion":[["polysyndeton","Dort werden die Bindewörter gerade mehrfach gesetzt."],["akkumulation","Eine Akkumulation ist eine inhaltliche Häufung; ein Asyndeton ist die Form der Verknüpfung. Beides ist kombinierbar."]],"counter":{"text":"Er packt und rennt und stolpert.","why":"Die Reihung enthält wiederholte Bindewörter und ist polysyndetisch."},"memory":"Reihung ohne Bindewörter.","aliases":[],"classExample":"„Herr Fuchs denkt nach, schaut, lächelt.“","exam":"Die Formulierung „Herr Fuchs denkt nach, schaut, lächelt.“ zeigt Asyndeton. Zwischen den drei Tätigkeiten fehlen „und“ oder andere Konjunktionen. Die knappe Reihe kann die Abfolge zügig und verdichtet erscheinen lassen.","focus":{"cue":"Eine Reihe steht ohne verbindende Bindewörter.","example":"Herr Fuchs [[denkt nach, schaut, lächelt]].","why":"Zwischen den drei Tätigkeiten fehlen „und“ oder andere Konjunktionen.","effect":"Die knappe Reihe kann die Abfolge zügig und verdichtet erscheinen lassen.","source":"Foto 4 und Foto 7","priority":1}},{"id":"akkumulation","name":"Akkumulation","category":"muster","level":3,"material":true,"simple":"Mehrere zusammengehörende Einzelheiten werden gesammelt genannt. So entsteht ein breites Bild eines Bereichs.","definition":"Eine Akkumulation häuft mehrere inhaltlich zusammengehörende Unterbegriffe oder Einzelheiten unter einem genannten oder erschließbaren Oberbegriff.","recognize":"Finde die gemeinsamen Oberbegriffe und mindestens mehrere Einzelglieder. Die Art der Bindewörter ist für die Einordnung nicht entscheidend.","examples":[{"text":"Auf dem Tisch liegen [[Äpfel, Birnen, Pflaumen, Trauben]].","why":"Die Früchte sind mehrere Unterbegriffe des gemeinsamen Bereichs Obst.","effect":"Die Häufung lässt das Angebot vielfältig und reich erscheinen.","context":"Alltag"},{"text":"Die Schließung trifft [[Kinder, Eltern, Lehrkräfte und Ehrenamtliche]].","why":"Verschiedene Gruppen werden unter dem gemeinsamen Aspekt der Betroffenheit gesammelt.","effect":"Die Reihe zeigt die Breite der Folgen und stützt das Argument, dass die Entscheidung nicht nur eine kleine Gruppe betrifft.","context":"Kommentar / Rede"},{"text":"[[Briefe, Bilder, Fahrkarten, getrocknete Blüten]] lagen in der Schublade.","why":"Die Dinge gehören als Erinnerungsstücke zu einem gemeinsamen Bedeutungsfeld.","effect":"Die Gegenstände lassen ein vergangenes Leben aus vielen konkreten Spuren entstehen, ohne es ausführlich zu erzählen.","context":"Literarischer Modelltext"}],"effect":"Die Reihe zeigt die Breite der Folgen und stützt das Argument, dass die Entscheidung nicht nur eine kleine Gruppe betrifft.","confusion":[["asyndeton","Akkumulation fragt nach der inhaltlichen Sammlung, Asyndeton nach fehlenden Konjunktionen."],["zweierfigur","Im Unterricht wird die Zweierfigur gesondert für zwei gliedernde Begriffe verwendet; Akkumulation meint eine umfangreichere Häufung."]],"counter":{"text":"Der Bus hält. Danach beginnt die Stunde.","why":"Das ist eine zeitliche Abfolge, keine Sammlung zusammengehörender Unterbegriffe."},"memory":"Viele Einzelheiten ergeben einen gemeinsamen Bereich.","aliases":["Accumulatio"],"classExample":"„Frauen, Männer, Kinder, Alte, Junge – jeder wollte kommen.“","exam":"Die Formulierung „Frauen, Männer, Kinder, Alte, Junge – jeder wollte kommen.“ zeigt Akkumulation. Die Einzelgruppen stehen für die versammelten Menschen. Die Häufung veranschaulicht, wie viele unterschiedliche Menschen gemeint sind.","focus":{"cue":"Mehrere Einzelbegriffe sammeln sich unter einem gemeinsamen Oberbegriff.","example":"[[Frauen, Männer, Kinder, Alte, Junge]] – jeder wollte kommen.","why":"Die Einzelgruppen stehen für die versammelten Menschen.","effect":"Die Häufung veranschaulicht, wie viele unterschiedliche Menschen gemeint sind.","source":"Foto 7","priority":1}},{"id":"zweierfigur","name":"Zweierfigur","category":"muster","level":3,"material":true,"simple":"Zwei zusammengehörende Ausdrücke bilden ein Paar. Sie können gemeinsam einen größeren Bereich vertreten.","definition":"In den vorliegenden Unterrichtsmaterialien bezeichnet Zweierfigur die Paarung zweier Unterbegriffe anstelle eines zusammenfassenden Oberbegriffs.","recognize":"Prüfe, welche Gesamtheit das Paar vertritt. Der Unterrichtsbegriff ist weiter gefasst und nicht in allen Rhetoriksystemen gleich gebräuchlich.","examples":[{"text":"[[Jung und Alt]] feiern mit.","why":"Zwei Altersgruppen stehen zusammen für Menschen verschiedener Altersstufen.","effect":"Das Paar vermittelt, dass niemand aufgrund des Alters ausgeschlossen wird.","context":"Alltag"},{"text":"Die Regel soll für [[Lehrende und Lernende]] gelten.","why":"Zwei Rollen bezeichnen gemeinsam die zentralen Beteiligten des Unterrichts.","effect":"Die Paarung betont gemeinsame Verantwortung und einen Anspruch auf gleiche Geltung.","context":"Kommentar / Rede"},{"text":"[[Tag und Nacht]] bewachte sie das Licht am Fenster.","why":"Die beiden Tagesphasen stehen zusammen für die gesamte Zeit.","effect":"Das Paar lässt die Dauer der Wachsamkeit umfassend erscheinen.","context":"Literarischer Modelltext"}],"effect":"Die Paarung betont gemeinsame Verantwortung und einen Anspruch auf gleiche Geltung.","confusion":[["akkumulation","Die Akkumulation sammelt mehrere Unterbegriffe; hier wird bewusst ein Paar gebildet."],["tautologie","Bei einer Tautologie ähneln sich die Bedeutungen. „Jung und Alt“ nennt unterschiedliche, gemeinsam umfassende Bereiche."]],"counter":{"text":"Brot und Schraubenzieher liegen hier.","why":"Ohne einen erkennbaren gemeinsamen Oberbegriff oder eine gestaltende Funktion ist nicht jede Zweierliste eine rhetorische Zweierfigur."},"memory":"Zwei Begriffe vertreten gemeinsam einen Bereich.","aliases":[],"classExample":"„Mann und Frau“; „Pech und Schwefel“. Solche Paarformeln können je nach Kontext weitere Figuren überlagern.","exam":"Die Formulierung „Mann und Frau“ zeigt Zweierfigur. Zwei Unterbegriffe werden als zusammengehöriges Paar genannt. Das Paar kann beide Seiten gemeinsam hervorheben. Ob es alle Menschen einschließt, hängt vom Zusammenhang ab.","focus":{"cue":"Zwei zusammengehörige Begriffe bilden ein Paar.","example":"[[Mann und Frau]]","why":"Zwei Unterbegriffe werden als zusammengehöriges Paar genannt.","effect":"Das Paar kann beide Seiten gemeinsam hervorheben. Ob es alle Menschen einschließt, hängt vom Zusammenhang ab.","source":"Foto 9","priority":1}},{"id":"antithese","name":"Antithese","category":"gegensatz","level":2,"material":true,"simple":"Zwei gegensätzliche Gedanken werden einander gegenübergestellt. Der Unterschied soll deutlich werden.","definition":"Eine Antithese stellt inhaltlich gegensätzliche Begriffe, Aussagen oder Vorstellungen in einen erkennbaren Zusammenhang.","recognize":"Benenne beide Seiten und den Gegensatz. Ein „aber“ allein beweist noch keine Antithese.","examples":[{"text":"[[Du lachst, ich weine]].","why":"Lachen und Weinen bilden im Kontext gegensätzliche emotionale Reaktionen.","effect":"Die direkte Gegenüberstellung hebt die unterschiedliche Stimmung hervor.","context":"Alltag"},{"text":"[[Die Geräte werden moderner, die Lernräume bleiben rückständig]].","why":"Die Modernität der Technik wird der Rückständigkeit der Lernumgebung gegenübergestellt.","effect":"Der Gegensatz kritisiert einen einseitigen Fortschrittsbegriff und begründet, dass Ausstattung und pädagogische Bedingungen gemeinsam verbessert werden müssen.","context":"Kommentar / Rede"},{"text":"[[Draußen feierte die Stadt; in ihr blieb alles still]].","why":"Öffentlicher Jubel und innere Stille stehen sich gegenüber.","effect":"Der Gegensatz macht die Isolation der Figur mitten im gesellschaftlichen Leben spürbar.","context":"Literarischer Modelltext"}],"effect":"Der Gegensatz kritisiert einen einseitigen Fortschrittsbegriff und begründet, dass Ausstattung und pädagogische Bedingungen gemeinsam verbessert werden müssen.","confusion":[["oxymoron","Eine Antithese stellt Gegensätze gegenüber. Ein Oxymoron verbindet sie eng zu einem widersprüchlichen Ausdruck."],["chiasmus","Chiasmus ist eine Kreuzstellung der Elemente. Eine Antithese braucht keinen solchen Satzbau."]],"counter":{"text":"Sie liest, und er schreibt.","why":"Zwei unterschiedliche Tätigkeiten sind ohne weiteren Kontext noch keine gegensätzlichen Positionen."},"memory":"Gegensätze werden einander gegenübergestellt.","aliases":[],"classExample":"„Heiß ist die Liebe, kalt ist der Schnee.“ Das Beispiel ist zusätzlich parallel gebaut.","exam":"Die Formulierung „Heiß ist die Liebe, kalt ist der Schnee.“ zeigt Antithese. „Heiß“ und „kalt“ bezeichnen gegensätzliche Eigenschaften. Der Temperaturgegensatz lässt die Intensität der Liebe besonders hervortreten.","focus":{"cue":"Gegensätzliche Begriffe oder Aussagen werden gegenübergestellt.","example":"[[Heiß]] ist die Liebe, [[kalt]] ist der Schnee.","why":"„Heiß“ und „kalt“ bezeichnen gegensätzliche Eigenschaften.","effect":"Der Temperaturgegensatz lässt die Intensität der Liebe besonders hervortreten.","source":"Foto 4 und Foto 7","priority":1}},{"id":"oxymoron","name":"Oxymoron","category":"gegensatz","level":3,"material":true,"simple":"Zwei widersprüchliche Wörter werden eng verbunden. Die Kombination klingt zunächst unmöglich.","definition":"Ein Oxymoron verbindet semantisch widersprüchliche Ausdrücke zu einer engen sprachlichen Einheit.","recognize":"Prüfe die innere Spannung innerhalb der Wortgruppe. Ein bloßer Gegensatz zwischen zwei Sätzen genügt nicht.","examples":[{"text":"Im Raum herrscht [[beredtes Schweigen]].","why":"Schweigen scheint gerade nicht zu sprechen; „beredt“ schreibt ihm dennoch Mitteilungsfähigkeit zu.","effect":"Die Verbindung macht deutlich, dass Nichtsprechen eine starke Botschaft vermitteln kann.","context":"Alltag"},{"text":"Eine Debatte ohne Widerspruch ist eine [[lebendige Erstarrung]].","why":"Lebendigkeit und Erstarrung schließen sich auf der wörtlichen Ebene aus.","effect":"Der widersprüchliche Ausdruck kritisiert einen scheinbar aktiven Austausch, in dem sich tatsächlich nichts bewegt.","context":"Kommentar / Rede"},{"text":"Sie trug eine [[bittere Süße]] in der Erinnerung.","why":"Geschmacklich gegensätzliche Eigenschaften werden eng zusammengefügt.","effect":"Die Verbindung erfasst die Gleichzeitigkeit von schöner Erinnerung und schmerzlichem Verlust.","context":"Literarischer Modelltext"}],"effect":"Der widersprüchliche Ausdruck kritisiert einen scheinbar aktiven Austausch, in dem sich tatsächlich nichts bewegt.","confusion":[["antithese","Antithese stellt die gegensätzlichen Seiten deutlicher getrennt gegenüber."],["paradoxon","Paradoxon betrifft eine scheinbar widersprüchliche Aussage oder einen Gedanken. Das Oxymoron ist die enge sprachliche Verbindung."]],"counter":{"text":"Der Tee ist heiß, das Wasser daneben kalt.","why":"Die Gegensätze gehören zu verschiedenen Gegenständen und werden nicht widersprüchlich in einer Einheit verbunden."},"memory":"Widerspruch in einer engen Wortverbindung.","aliases":[],"classExample":"„alter Knabe“; „beredtes Schweigen“; „bittere Süße“","exam":"Die Formulierung „beredtes Schweigen“ zeigt Oxymoron. Schweigen wird mit einer Eigenschaft verbunden, die eigentlich zum Reden gehört. Der Widerspruch macht deutlich, dass auch Schweigen eine starke Aussage tragen kann.","focus":{"cue":"Widersprüchliche Ausdrücke werden eng verbunden.","example":"[[beredtes Schweigen]]","why":"Schweigen wird mit einer Eigenschaft verbunden, die eigentlich zum Reden gehört.","effect":"Der Widerspruch macht deutlich, dass auch Schweigen eine starke Aussage tragen kann.","source":"Foto 4 und Foto 9","priority":1}},{"id":"paradoxon","name":"Paradoxon","category":"gegensatz","level":3,"material":true,"simple":"Eine Aussage scheint sich selbst zu widersprechen. Beim Nachdenken kann ein sinnvoller Gedanke erkennbar werden.","definition":"Ein Paradoxon formuliert einen scheinbaren Widerspruch oder eine Aussage gegen die gewöhnliche Erwartung, die eine weiterführende Deutung eröffnet.","recognize":"Erkläre zuerst den Widerspruch und dann, unter welcher Perspektive die Aussage verständlich wird. Unsinn ohne begründbare Lesart genügt nicht.","examples":[{"text":"[[Weniger Auswahl kann mehr Freiheit bedeuten]].","why":"Weniger Möglichkeiten scheinen Freiheit zu mindern; zugleich können sie von Entscheidungsdruck entlasten.","effect":"Die Aussage regt dazu an, Freiheit nicht nur als Zahl der Optionen zu verstehen.","context":"Alltag"},{"text":"[[Wer jede Meinung verbietet, schützt am Ende keine eigene Meinung mehr]].","why":"Das vermeintliche Absichern der eigenen Position führt zum Verlust der Möglichkeit, sie frei zu äußern.","effect":"Die paradoxe Konsequenz macht auf ein Grundproblem umfassender Verbote aufmerksam und fordert konsistente Regeln.","context":"Kommentar / Rede"},{"text":"[[Er fand sich erst, als er sich verlor]].","why":"Selbstverlust scheint Selbsterkenntnis auszuschließen; gemeint ist der Verlust einer alten, fremdbestimmten Identität.","effect":"Die Spannung fasst einen persönlichen Wandel zusammen, der nicht als einfacher Gewinn erzählt werden kann.","context":"Literarischer Modelltext"}],"effect":"Die paradoxe Konsequenz macht auf ein Grundproblem umfassender Verbote aufmerksam und fordert konsistente Regeln.","confusion":[["oxymoron","Ein Oxymoron verbindet widersprüchliche Ausdrücke eng. Das Paradoxon entfaltet den Widerspruch auf der Ebene einer Aussage."]],"counter":{"text":"Der Stein ist rund und liegt am Weg.","why":"Die Eigenschaften widersprechen einander weder scheinbar noch tatsächlich."},"memory":"Scheinbarer Widerspruch, begründbarer tieferer Sinn.","aliases":[],"classExample":"„Ich weiß, dass ich nichts weiß.“","exam":"Die Formulierung „Ich weiß, dass ich nichts weiß.“ zeigt Paradoxon. Die Aussage behauptet Wissen über das eigene Nichtwissen. Der scheinbare Widerspruch regt dazu an, über die Grenzen des Wissens nachzudenken.","focus":{"cue":"Ein ganzer Gedanke wirkt widersprüchlich, kann aber einen Sinn haben.","example":"[[Ich weiß, dass ich nichts weiß.]]","why":"Die Aussage behauptet Wissen über das eigene Nichtwissen.","effect":"Der scheinbare Widerspruch regt dazu an, über die Grenzen des Wissens nachzudenken.","source":"Foto 9","priority":2}},{"id":"ironie","name":"Ironie","category":"gegensatz","level":2,"material":true,"simple":"Jemand sagt etwas, meint es aber erkennbar anders. Oft ist das Gegenteil gemeint. Der Zusammenhang ist entscheidend.","definition":"Ironie erzeugt eine erkennbare Distanz zwischen dem wörtlich Gesagten und dem Gemeinten, häufig durch eine Aussage, deren Gegenteil der Kontext nahelegt.","recognize":"Suche einen Widerspruch zwischen Aussage und Situation. Ohne Kontext oder Tonfall lässt sich Ironie oft nicht sicher bestimmen.","examples":[{"text":"Der Bus fährt vor der Nase weg. „[[Das läuft ja großartig]].“","why":"Das Lob passt nicht zur ärgerlichen Situation; tatsächlich wird der Ablauf kritisiert.","effect":"Die ironische Form drückt Ärger mit sprachlicher Distanz aus.","context":"Alltag"},{"text":"Das Schulnetz fällt zum dritten Mal aus. „[[So sieht also die perfekte Digitalisierung aus]].“","why":"Das scheinbare Lob wird durch die geschilderten Ausfälle widerlegt.","effect":"Die Ironie entlarvt eine Erfolgserzählung als unzureichend und verschärft die Kritik an fehlender Zuverlässigkeit.","context":"Kommentar / Rede"},{"text":"Er betrachtete das undichte Dach. „[[Ein Palast]], gewiss“, sagte er und stellte den Eimer darunter.","why":"Die tatsächliche Wohnsituation widerspricht der prachtvollen Bezeichnung.","effect":"Die Figur hält durch ironische Distanz ihren Ärger oder ihre Enttäuschung aus, ohne sie direkt auszusprechen.","context":"Literarischer Modelltext"}],"effect":"Die Ironie entlarvt eine Erfolgserzählung als unzureichend und verschärft die Kritik an fehlender Zuverlässigkeit.","confusion":[],"counter":{"text":"Die Lösung funktioniert. „Das hast du gut gemacht.“","why":"Das Lob passt zur Situation; ohne gegenteilige Hinweise besteht kein Ironiesignal."},"memory":"Nicht nur Wörter lesen: Situation und Haltung prüfen.","aliases":[],"classExample":"„Schulaufgaben machen ja so großen Spaß.“ Nur der passende Kontext begründet eine ironische Lesart.","exam":"Die Formulierung „Nach einer unangenehmen Schulaufgabe: „Schulaufgaben machen ja so großen Spaß.““ zeigt Ironie. Das scheinbare Lob passt nicht zum negativen Erlebnis. Der Kontext zeigt die umgekehrte Wertung. Die Aussage vermittelt Kritik oder Unzufriedenheit in indirekter, spöttischer Form.","focus":{"cue":"Wortlaut und gemeinte Bewertung widersprechen sich.","example":"Nach einer unangenehmen Schulaufgabe: „Schulaufgaben machen ja [[so großen Spaß]].“","why":"Das scheinbare Lob passt nicht zum negativen Erlebnis. Der Kontext zeigt die umgekehrte Wertung.","effect":"Die Aussage vermittelt Kritik oder Unzufriedenheit in indirekter, spöttischer Form.","source":"Foto 4 und Foto 7; Situation zur Verdeutlichung ergänzt","priority":1}},{"id":"ellipse","name":"Ellipse","category":"satz","level":2,"material":true,"simple":"Ein Satz lässt Wörter weg, die man aus dem Zusammenhang ergänzen kann. Trotzdem versteht man die Aussage.","definition":"Eine Ellipse lässt syntaktisch erwartbare Satzbestandteile aus, die aus dem sprachlichen oder situativen Kontext erschließbar sind.","recognize":"Ergänze die fehlenden Bestandteile in einem vollständigen Satz. Nicht jede kurze Äußerung ist automatisch eine Ellipse.","examples":[{"text":"[[Noch einen Kaffee?]]","why":"Ergänzbar ist etwa „Möchtest du noch einen Kaffee?“; Verb und Subjekt bleiben unausgesprochen.","effect":"Die Verkürzung passt zur direkten Alltagssituation und wirkt unkompliziert.","context":"Alltag"},{"text":"[[Mehr Zeit zum Denken. Weniger Druck durch Noten.]]","why":"Die Forderungen lassen sich etwa zu „Wir brauchen mehr Zeit ...“ ergänzen.","effect":"Die verkürzten Sätze stellen die Ziele schlagwortartig heraus und verleihen dem Kommentar Nachdruck.","context":"Kommentar / Rede"},{"text":"[[Kein Laut. Kein Schritt. Nur das Licht im Flur.]]","why":"Vollständige Aussagen wie „Es war kein Laut zu hören“ werden auf Wahrnehmungsfragmente verkürzt.","effect":"Die abgehackten Eindrücke lassen Stille und gespannte Aufmerksamkeit unmittelbar erscheinen.","context":"Literarischer Modelltext"}],"effect":"Die verkürzten Sätze stellen die Ziele schlagwortartig heraus und verleihen dem Kommentar Nachdruck.","confusion":[["epiphrase","Epiphrase fügt nach einem vollständigen Satz etwas hinzu. Ellipse lässt erwartbare Teile weg."],["asyndeton","Asyndeton lässt Verbindungskonjunktionen einer Reihung weg; Ellipse betrifft fehlende Satzbestandteile."]],"counter":{"text":"Sie schläft.","why":"Der kurze Satz enthält Subjekt und Prädikat und ist vollständig."},"memory":"Fehlende Satzteile lassen sich sinnvoll ergänzen.","aliases":[],"classExample":"„Je schneller, desto besser.“; „Lieber zwei Stunden als gar kein Schlaf.“","exam":"Die Formulierung „Je schneller, desto besser.“ zeigt Ellipse. Ein vollständiger Satz könnte „Je schneller es geht, desto besser ist es“ lauten. Die Verkürzung bringt di
